      - name: Exercise go mode
        run: |
          set -euo pipefail
          source /tmp/start-go.sh
          start_go go go
          docker logs api-go-workspace 2>&1 | grep -F "GraphQL workspace reads registered (me, myOrganizations, users, userLoginRecords, roles, permissions, memberships, dashboards, queueStats, entitySentimentSeries, topicSentimentSeries, processedItemById)"
          python3 - << 'PY'
          import base64, json, subprocess, urllib.error, urllib.request

          go = "http://127.0.0.1:4020"
          nest = "http://127.0.0.1:4000"
          token_admin = open("/tmp/ws-token-admin").read()
          token_plain = open("/tmp/ws-token-plain").read()
          token_reader = open("/tmp/ws-token-reader").read()
          case = json.load(open("/tmp/ws-query.json"))
          workspace_query = case["query"]
          variables = case["variables"]

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def call(base, path, token, payload=None):
              headers = {"content-type": "application/json"}
              data = json.dumps(payload).encode() if payload is not None else None
              if token:
                  headers["authorization"] = "Bearer " + token
              req = urllib.request.Request(base + path, data=data, method="POST", headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return resp.status, json.loads(resp.read() or b"null")
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try:
                      doc = json.loads(raw)
                  except Exception:
                      doc = {"raw": raw[:400].decode("utf-8", "replace")}
                  return exc.code, doc

          def gql(base, token, query, variables_=None):
              return call(base, "/graphql", token, {"query": query, "variables": variables_ or {}})

          def scrub(value):
              if isinstance(value, dict):
                  return {k: scrub(v) for k, v in value.items() if k not in ("traceId", "locations", "stack", "originalError")}
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              return value

          def canon(value, key=None):
              if isinstance(value, dict):
                  return {k: canon(v, k) for k, v in value.items()}
              if isinstance(value, list):
                  items = [canon(v, key) for v in value]
                  if key in ("memberships", "roles", "permissions", "widgets") and items and all(isinstance(v, dict) and "id" in v for v in items):
                      return sorted(items, key=lambda v: v["id"])
                  return items
              return value

          def same(left, right):
              if isinstance(left, dict) and isinstance(right, dict):
                  if left.keys() != right.keys():
                      return False
                  return all(same(left[k], right[k]) for k in left)
              if isinstance(left, list) and isinstance(right, list):
                  return len(left) == len(right) and all(same(a, b) for a, b in zip(left, right))
              if isinstance(left, (int, float)) and isinstance(right, (int, float)) and not isinstance(left, bool) and not isinstance(right, bool):
                  return abs(float(left) - float(right)) < 0.0001
              return left == right

          ns, nd = gql(nest, token_admin, workspace_query, variables)
          gs, gd = gql(go, token_admin, workspace_query, variables)
          if ns != gs or not same(canon(scrub(nd)), canon(scrub(gd))):
              fail(f"go nest/gateway {ns}/{gs}\nNEST {json.dumps(scrub(nd))[:2200]}\nGO {json.dumps(scrub(gd))[:2200]}")
          print("OK go twelve roots")

          data = scrub(gd).get("data") or {}
          if data["processedItemById"]["duplicateOf"] != "meta-b":
              fail(f"go duplicateOf = {data['processedItemById']['duplicateOf']}")
          if data["processedItemById"]["eventId"] != "wsevent0000000000001":
              fail(f"go eventId = {data['processedItemById']['eventId']}")
          if data["processedItemById"]["llm"]["promptTokens"] is not None:
              fail("go NaN promptTokens must be null")
          if not data["processedItemById"]["resultJson"] or data["processedItemById"]["result"] is None:
              fail(f"go result fields {data['processedItemById']}")
          if "Bearer [REDACTED]" not in (data["queueStats"]["recentLogs"][0]["data"] or ""):
              fail("go queue log redaction")

          # Padded names hit the canonical snapshots on Go too.
          status, doc = gql(go, token_admin, 'query { entitySentimentSeries(entityName: "  Apple  ", entityType: "  COMPANY  ") { entityName entityType } topicSentimentSeries(topic: "  AI  ") { topic } }')
          if status != 200 or not (doc.get("data") or {}).get("entitySentimentSeries") or not (doc.get("data") or {}).get("topicSentimentSeries"):
              fail(f"go padded sentiment {status} {doc}")

          # Bad ObjectId is a 400 on both sides.
          for base, label in ((nest, "nest"), (go, "gateway")):
              status, doc = gql(base, token_admin, 'query { processedItemById(id: "bad-id") { id } }')
              if status != 400 or "Invalid processed item id" not in json.dumps(doc):
                  fail(f"{label} bad object id {status} {doc}")

          # Field-level permission: a normal member without users.read can read
          # the public fields but not the guarded UserModel fields.
          status, doc = gql(go, token_plain, 'query { me { id email permissions } }')
          if status != 200 or (doc.get("data") or {}).get("me") is None:
              fail(f"go plain me public {status} {doc}")
          status, doc = gql(go, token_plain, 'query { me { id roleIds } }')
          if status != 403 or "FORBIDDEN" not in json.dumps(doc):
              fail(f"go plain me roleIds {status} {doc}")

          # memberships needs users.read; roles.read guards RoleModel.permissions.
          status, doc = gql(go, token_reader, 'query { memberships { id role { id name } } }')
          if status != 200 or not (doc.get("data") or {}).get("memberships"):
              fail(f"go reader memberships {status} {doc}")
          status, doc = gql(go, token_reader, 'query { memberships { id role { permissions { name } } } }')
          if status != 403 or "FORBIDDEN" not in json.dumps(doc):
              fail(f"go reader role permissions {status} {doc}")

          # The organization-admin gate still fails closed on Go.
          for query in ('query { users { id } }', 'query { userLoginRecords(userId: "wsuserplain000000000001") { id } }'):
              status, doc = gql(go, token_reader, query)
              if status != 403 or "Admin access required" not in json.dumps(doc):
                  fail(f"go admin gate {status} {doc}")

          bad_cursor = base64.b64encode(b"does-not-exist-000000000000").decode()
          status, doc = gql(go, token_admin, 'query Users($after: String) { users(first: 5, after: $after) { id } }', {"after": bad_cursor})
          if status != 200 or (doc.get("data") or {}).get("users") != [] or doc.get("errors"):
              fail(f"go bad cursor {status} {doc}")
          print("OK go processed item, field permissions, admin gate, trim")
          PY
      - name: Nest down availability and mutation fallback
        run: |
          set -euo pipefail
          # JWT tokens were captured while NestJS was healthy in /tmp before
          # the process is stopped here.
          kill "$(cat /tmp/api-nestjs.pid)" 2>/dev/null || true
          pkill -f '@modular/api' 2>/dev/null || true
          pkill -f 'node .*dist/main' 2>/dev/null || true
          if command -v fuser >/dev/null 2>&1; then fuser -k 4000/tcp 2>/dev/null || true; fi
          for i in $(seq 1 30); do
            if ! curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
            echo "NestJS is still healthy after stop attempts"
            exit 1
          fi
          python3 - << 'PY'
          import json, urllib.error, urllib.request

          go = "http://127.0.0.1:4020"
          token = open("/tmp/ws-token-admin").read()
          case = json.load(open("/tmp/ws-query.json"))

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def call(path, payload):
              req = urllib.request.Request(go + path, data=json.dumps(payload).encode(), method="POST",
                                           headers={"content-type": "application/json", "authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return resp.status, json.loads(resp.read() or b"null")
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try:
                      return exc.code, json.loads(raw)
                  except Exception:
                      return exc.code, {"raw": raw[:200].decode("utf-8", "replace")}

          status, doc = call("/graphql", {"query": case["query"], "variables": case["variables"]})
          if status != 200 or doc.get("errors") or not (doc.get("data") or {}).get("processedItemById"):
              fail(f"nest-down twelve roots {status} {doc}")
          print("OK nest-down twelve roots 200")

          status, doc = call("/graphql", {"query": 'mutation { deleteDashboard(id: "x") }'})
          if status != 502:
              fail(f"nest-down mutation status {status} {doc}")
          print("OK nest-down deleteDashboard 502")
          PY
