# 采集 Frontier 运行监控与取消 11 条 HTTP 的真实栈验收。不进普通 CI。
# PR 上加 label api-go-crawl-frontier-runs-smoke，或 workflow_dispatch。
# SCHEDULE_ENABLED 保持 false。不请求 crawl4ai；不把模型、外网当通过。
name: api-go-crawl-frontier-runs-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-crawl-frontier-runs-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-crawl-frontier-runs-smoke@example.com
  SMTP_PASS: api-go-crawl-frontier-runs-smoke-smtp-not-connected
  JWT_SECRET: c1f4a9e8d2b3706f5a1c8e9d4b2a7f6038e5d1c9a7b6f4e2d3c8a1b5f9e0d7c2
  NEXTAUTH_SECRET: e2b5c1f8a9d3b47e60d4a1f8c3b5e79d02c1f4a9e8d2b3706f5a1c8e9d4b2a7f6
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  SEED_ORG_SLUG: api-go-crawl-frontier-runs-smoke-org
  SEED_ORG_NAME: api-go Crawl Frontier Runs Smoke Org
  SEED_ADMIN_EMAIL: api-go-crawl-frontier-runs-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: ApiGoCrawlFr#2026-Ci
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-crawl-frontier-runs-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-crawl-frontier-runs-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-crawl-frontier:ci .
      - name: Exercise crawl frontier run routes
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib, json, os, signal, subprocess, threading, time, urllib.error, urllib.request

          nest = "http://127.0.0.1:4000"
          go = "http://127.0.0.1:4020"
          org = "frrunsorga0000000000001"
          other = "frrunsorgb0000000000001"
          base = "/api/admin/crawl-frontier"
          runs = base + "/runs"
          nodes = base + "/nodes"
          wf_runs = base + "/workflow-runs"

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def ok(message):
              print("ok", message)

          def sql(statement):
              cid = subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=mysql:8.4"], text=True).split()[0]
              proc = subprocess.run(["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "app"], input=statement, text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(proc.stderr or proc.stdout)
              return proc.stdout.strip()

          def scalar(statement):
              lines = [line.strip() for line in sql(statement).splitlines() if line.strip()]
              return lines[-1] if lines else ""

          def s(value):
              if value is None:
                  return "NULL"
              return "'" + value.replace("'", "''") + "'"

          def j(value):
              if isinstance(value, str):
                  text = value
              else:
                  text = json.dumps(value)
              return "CAST('" + text.replace("'", "''") + "' AS JSON)"

          def start_go(frontier_mode):
              subprocess.run(["docker", "rm", "-f", "api-go-crawl-frontier"], check=False, capture_output=True)
              env = [
                  "PORT=4020",
                  "LEGACY_API_URL=http://host.docker.internal:4000",
                  "DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app",
                  "MONGO_URI=mongodb://host.docker.internal:27017/app",
                  f"API_GO_CRAWL_FRONTIER_RUNS_MODE={frontier_mode}",
                  "API_GO_CRAWL_PROFILES_MODE=legacy",
                  "API_GO_CRAWL_WORKFLOWS_MODE=legacy",
                  "API_GO_CRAWL_TEMPLATES_MODE=legacy",
                  "API_GO_CRAWL_READ_TELEMETRY_MODE=legacy",
                  "API_GO_NEWS_SOURCES_MODE=legacy",
                  "API_GO_SITUATION_MONITORS_MODE=legacy",
                  "API_GO_RBAC_MODE=legacy",
                  "API_GO_LLM_LOGS_MODE=legacy",
                  "API_GO_ADMIN_LOGS_MODE=legacy",
                  "API_GO_QUALITY_OVERVIEW_MODE=legacy",
                  "API_GO_CLASSIFICATION_RSS_OPS_MODE=legacy",
                  "API_GO_NEWSNOW_CLUSTERING_OPS_MODE=legacy",
                  "API_GO_RUNTIME_SETTINGS_MODE=legacy",
                  "API_GO_CONTENT_SUBSCRIPTIONS_MODE=legacy",
                  "API_GO_USER_NEWS_BEHAVIOR_MODE=legacy",
                  "API_GO_USER_DIGEST_MODE=legacy",
                  "API_GO_DASHBOARD_STATS_MODE=legacy",
                  "API_GO_DASHBOARD_CHARTS_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_GEO_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE=legacy",
                  "API_GO_DASHBOARD_STREAM_MODE=legacy",
                  "API_GO_HEALTHZ_MODE=legacy",
                  "API_GO_PUBLIC_PORTAL_MODE=legacy",
                  "API_GO_ANALYSIS_VIEWS_MODE=legacy",
                  "API_GO_ANALYSIS_BOARDS_MODE=legacy",
                  "API_GO_ANALYSIS_THREADS_MODE=legacy",
                  "API_GO_GRAPHQL_READ_MODE=legacy",
                  "API_GO_GRAPHQL_NEWS_EVENTS_MODE=legacy",
                  "API_GO_USER_SETTINGS_WRITE_MODE=legacy",
                  "REALTIME_SIGNALS_ENABLED=false",
                  "ELASTICSEARCH_ENABLED=false",
                  "MODEL_SERVICE_ENABLED=false",
                  "SCHEDULE_ENABLED=false",
                  f"JWT_SECRET={os.environ['JWT_SECRET']}",
                  f"JWT_ISSUER={os.environ['JWT_ISSUER']}",
                  f"JWT_AUDIENCE={os.environ['JWT_AUDIENCE']}",
                  "REDIS_HOST=host.docker.internal",
                  "REDIS_PORT=6379",
                  "CANARY_PERCENT=0",
                  f"CORS_ORIGIN={os.environ['CORS_ORIGIN']}",
              ]
              cmd = ["docker", "run", "-d", "--name", "api-go-crawl-frontier",
                     "--add-host=host.docker.internal:host-gateway",
                     "--health-interval", "5s", "--health-timeout", "3s", "--health-retries", "20", "--health-start-period", "5s",
                     "-p", "127.0.0.1:4020:4020"]
              for item in env:
                  cmd.extend(["-e", item])
              cmd.append("api-go-crawl-frontier:ci")
              subprocess.check_call(cmd)
              for _ in range(30):
                  status = subprocess.check_output(["docker", "inspect", "--format", "{{.State.Health.Status}}", "api-go-crawl-frontier"], text=True).strip()
                  print("health", status, "frontierMode", frontier_mode)
                  if status == "healthy":
                      return
                  if status == "unhealthy":
                      fail(subprocess.check_output(["docker", "logs", "api-go-crawl-frontier"], text=True)[-4000:])
                  time.sleep(2)
              fail(subprocess.check_output(["docker", "logs", "api-go-crawl-frontier"], text=True)[-4000:])

          def call(base_url, path, method="GET", token=None, payload=None, timeout=30):
              headers = {}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(base_url + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          def body(raw):
              if not raw:
                  return None
              text = raw.decode("utf-8", "replace").strip()
              if not text:
                  return None
              return json.loads(text)

          def core(value):
              if isinstance(value, dict):
                  return {key: core(item) for key, item in value.items() if key not in ("traceId", "timestamp")}
              if isinstance(value, list):
                  return [core(item) for item in value]
              return value

          def message(raw):
              doc = body(raw) or {}
              text = doc.get("message")
              if isinstance(text, list):
                  return "; ".join(str(item) for item in text)
              return text

          def login(email):
              status, raw = call(nest, "/api/auth/login", "POST", payload={"email": email, "password": os.environ["SEED_ADMIN_PASSWORD"]})
              doc = body(raw)
              if status not in (200, 201) or not doc or not doc.get("accessToken"):
                  fail(f"login {email} {status} {raw[:400]!r}")
              return doc["accessToken"]

          def first_diff(left, right, path=""):
              if type(left) is not type(right):
                  return f"{path}: type {type(left).__name__} != {type(right).__name__} ({left!r} vs {right!r})"
              if isinstance(left, dict):
                  for key in sorted(set(left) | set(right)):
                      if key not in left:
                          return f"{path}.{key}: missing in nest"
                      if key not in right:
                          return f"{path}.{key}: missing in go"
                      found = first_diff(left[key], right[key], f"{path}.{key}")
                      if found:
                          return found
                  return ""
              if isinstance(left, list):
                  if len(left) != len(right):
                      return f"{path}: length {len(left)} != {len(right)}"
                  for index, (first, second) in enumerate(zip(left, right)):
                      found = first_diff(first, second, f"{path}[{index}]")
                      if found:
                          return found
                  return ""
              if left != right:
                  return f"{path}: {left!r} != {right!r}"
              return ""

          def same(path, method="GET", token=None, payload=None):
              left_status, left_raw = call(nest, path, method, token, payload)
              right_status, right_raw = call(go, path, method, token, payload)
              if left_status != right_status or core(body(left_raw)) != core(body(right_raw)):
                  fail(f"parity {method} {path} nest={left_status} go={right_status} diff={first_diff(core(body(left_raw)), core(body(right_raw)))}")
              return left_status, body(left_raw)

          def same_error(path, method="POST", token=None, payload=None):
              left_status, left_raw = call(nest, path, method, token, payload)
              right_status, right_raw = call(go, path, method, token, payload)
              if left_status != right_status or message(left_raw) != message(right_raw):
                  fail(f"error parity {method} {path} nest={left_status} {left_raw[:400]!r} go={right_status} {right_raw[:400]!r}")
              return left_status, message(left_raw)

          admin = scalar("SELECT id FROM User WHERE email='api-go-crawl-frontier-runs-smoke-admin@example.com'")
          read_perm = scalar("SELECT id FROM Permission WHERE name='crawl.read'")
          write_perm = scalar("SELECT id FROM Permission WHERE name='crawl.write'")
          read_token = "mtk_frrun_read_token_2026"
          write_token = "mtk_frrun_write_token_2026"

          # ---------------------------------------------------------------
          # Stage 0: seed (switch legacy, Nest is the only executor)
          # ---------------------------------------------------------------
          def seed_stage0():
              sql(f"""
              INSERT INTO Org (id, name, slug, isActive, createdAt, updatedAt) VALUES
                ('{org}', 'Frontier Runs Smoke', 'frontier-runs-smoke', 1, NOW(3), NOW(3)),
                ('{other}', 'Frontier Runs Other', 'frontier-runs-other', 1, NOW(3), NOW(3));
              INSERT INTO Role (id, name, isSystem, orgId) VALUES
                ('frrunrolewriter0000000001', 'frrun-writer', 0, '{org}'),
                ('frrunrolereader0000000001', 'frrun-reader', 0, '{org}'),
                ('frrunroleother00000000001', 'frrun-other', 0, '{other}');
              INSERT INTO RolePermission (id, roleId, permissionId) VALUES
                ('frrunpermwriterread0000001', 'frrunrolewriter0000000001', '{read_perm}'),
                ('frrunpermwriterwrite000001', 'frrunrolewriter0000000001', '{write_perm}'),
                ('frrunpermreaderread0000001', 'frrunrolereader0000000001', '{read_perm}'),
                ('frrunpermotherread00000001', 'frrunroleother00000000001', '{read_perm}'),
                ('frrunpermotherwrite000001', 'frrunroleother00000000001', '{write_perm}');
              """)
              users = [
                  ("frrunuserwriter000000001", "frrun-writer@example.com", org, "frrunrolewriter0000000001"),
                  ("frrunuserreader000000001", "frrun-reader@example.com", org, "frrunrolereader0000000001"),
                  ("frrunuserother00000000001", "frrun-other@example.com", other, "frrunroleother00000000001"),
              ]
              for user_id, email, user_org, role_id in users:
                  sql(f"""
                  INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
                  SELECT '{user_id}', '{email}', passwordHash, 'Smoke', 'User', 1, NOW(3), NOW(3), NOW(3)
                  FROM User WHERE id = '{admin}';
                  INSERT INTO Membership (id, userId, orgId, roleId, isActive, createdAt)
                  VALUES ('m{user_id[1:]}', '{user_id}', '{user_org}', '{role_id}', 1, NOW(3));
                  """)
              for token, permissions, token_id in [
                  (read_token, ["crawl.read"], "frruntokenread000000000001"),
                  (write_token, ["crawl.read", "crawl.write"], "frruntokenwrite00000000001"),
              ]:
                  token_hash = hashlib.sha256(token.encode()).hexdigest()
                  sql(f"""
                  INSERT INTO MachineAccessToken (id, orgId, name, tokenHash, permissions, createdById, createdAt, updatedAt)
                  VALUES ('{token_id}', '{org}', 'smoke', '{token_hash}', {j(permissions)}, '{admin}', NOW(3), NOW(3));
                  """)

              # Profile with a config that needs normalization.
              config = {"keywords": ["alpha", " beta ", "", "alpha"], "hostScope": "Strict_Hosts", "seedDiscovery": {"mode": "common_paths"}}
              sql(f"""
              INSERT INTO CrawlSiteProfile (id, orgId, name, description, matchHost, isActive, executionMode, workflowBindingMode, version, config, createdById, createdAt, updatedAt)
              VALUES ('frrunprofilea00000000001', '{org}', 'Frontier Profile A', NULL, 'frrun.example.com', 1, 'layered', 'published', 1, {j(config)}, '{admin}', NOW(3), NOW(3)),
                     ('frrunprofileb00000000001', '{other}', 'Frontier Profile B', NULL, 'frrun.example.com', 1, 'layered', 'published', 1, {j({"keywords": ["other"]})}, '{admin}', NOW(3), NOW(3));
              INSERT INTO CrawlTask (id, orgId, createdById, targetUrl, displayName, status, concurrency, createdAt, updatedAt) VALUES
                ('frruntaska000000000000001', '{org}', '{admin}', 'https://frrun.example.com/start', 'Frontier: A', 'completed', 1, NOW(3), NOW(3)),
                ('frruntaskb000000000000001', '{other}', '{admin}', 'https://frrun.example.com/b', 'Frontier: B', 'completed', 1, NOW(3), NOW(3));
              INSERT INTO CrawlResult (id, taskId, orgId, sourceUrl, fetchedAt, markdownRef, contentHash, metadata, createdAt) VALUES
                ('frrunresulta0000000000001', 'frruntaska000000000000001', '{org}', 'https://frrun.example.com/a', '2026-01-01 00:00:00.000', 'md/a', 'hash-a', {j({"x": 1})}, NOW(3)),
                ('frrunresultb0000000000001', 'frruntaskb000000000000001', '{other}', 'https://frrun.example.com/b', '2026-01-01 00:00:00.000', 'md/b', 'hash-b', NULL, NOW(3));
              INSERT INTO Article (id, orgId, url, sourceLabel, language, titleGuess, crawlAt, contentHash, metadata, createdAt, updatedAt) VALUES
                ('frrunarticlea000000000001', '{org}', 'https://frrun.example.com/article-a', 'Smoke', 'en', 'Title A', '2026-01-01 00:00:00.000', 'hash-a',
                 {j({"llmRepair": {"applied": True, "source": "llm", "model": "m1", "error": None, "missingFields": ["title"], "repairedFields": ["author"], "promptTokens": "12", "completionTokens": 34, "totalTokens": 46, "costUsd": "0.001", "latencyMs": 120}})}, NOW(3), NOW(3));
              INSERT INTO ProcessedArticle (id, orgId, articleId, status, title, subtitle, author, source, publishedAt, category, qualityScore, llmModel, llmPromptVersion, language, location, processedAt, removedNoiseTypes, topics, keyPoints, entities, kgRelations, createdAt, updatedAt) VALUES
                ('frrunprocesseda0000000001', '{org}', 'frrunarticlea000000000001', 'completed', 'Title A', NULL, 'Author A', 'Source A', '2026-01-01 00:00:00.000', NULL, 0.9, 'm1', 'v1', 'en', NULL, '2026-01-01 00:00:00.000', {j(["noise"])}, {j(["topic"])}, {j(["point"])}, {j(["entity"])}, {j(["kg"])}, NOW(3), NOW(3));
              """)

              # Workflow definition used by the workflow-run detail endpoints.
              definition = {"settings": {}, "nodes": [], "edges": []}
              sql(f"""
              INSERT INTO CrawlStrategyWorkflow (id, orgId, name, description, draftDefinition, createdById, createdAt, updatedAt)
              VALUES ('frrunworkflowa0000000001', '{org}', 'FR Workflow', NULL, {j(definition)}, '{admin}', NOW(3), NOW(3));
              INSERT INTO CrawlStrategyWorkflowVersion (id, workflowId, orgId, version, name, description, definition, createdById, createdAt)
              VALUES ('frrunwfversiona0000000001', 'frrunworkflowa0000000001', '{org}', 1, 'v1', NULL, {j(definition)}, '{admin}', NOW(3));
              """)

              # Workflow runs for the main runs, with steps/candidates/traces/events.
              wf_rows = [
                  ("frwfrunrunning0000000001", "running", None),
                  ("frwfrunqueued00000000001", "queued", None),
                  ("frwfrunfailed00000000001", "failed", "boom"),
                  ("frwfruncompleted000000001", "completed", "keep-me"),
                  ("frwfruncanceled0000000001", "canceled", None),
                  ("frwfrunother00000000001", "running", None),
              ]
              for index, (wf_id, status, error) in enumerate(wf_rows):
                  error_sql = s(error)
                  finished = "'2020-01-01 00:00:00.000'" if status in ("completed", "canceled") else "NULL"
                  wf_org = other if wf_id == "frwfrunother00000000001" else org
                  sql(f"""
                  INSERT INTO CrawlStrategyWorkflowRun (id, orgId, workflowId, workflowVersionId, workflowOrigin, status, runKind, input, output, graphSnapshot, parameterSources, error, stepCount, candidateCount, selectedCount, createdById, startedAt, finishedAt, createdAt, updatedAt)
                  VALUES ('{wf_id}', '{wf_org}', 'frrunworkflowa0000000001', 'frrunwfversiona0000000001', 'bound', '{status}', 'frontier',
                          {j({"seedUrl": "https://frrun.example.com/start"})}, {j({"selectedCount": 1})}, {j({"nodes": []})}, {j([{"key": "seed", "source": "profile"}])}, {error_sql}, 2, 2, 1, '{admin}', '2026-01-01 00:00:00.000', {finished}, DATE_SUB(NOW(3), INTERVAL {200 - index} SECOND), NOW(3));
                  """)
              sql(f"""
              INSERT INTO CrawlStrategyWorkflowRunStep (id, runId, stepKey, sequence, workflowNodeId, nodeType, label, status, startedAt, finishedAt, durationMs, inputCount, outputCount, rejectedCount, sampleUrls, metrics, error, createdAt, updatedAt) VALUES
                ('frrunstep1running000000001', 'frwfrunrunning0000000001', 'seed', 1, 'seed', 'seed', 'Seed', 'completed', '2026-01-01 00:00:00.000', '2026-01-01 00:00:01.000', 1000, 1, 2, 0, {j(["https://frrun.example.com/a"])}, {j({"attempts": 1})}, NULL, NOW(3), NOW(3)),
                ('frrunstep2running000000001', 'frwfrunrunning0000000001', 'frontier', 2, NULL, 'frontier', 'Frontier', 'running', NULL, NULL, NULL, 2, 1, 1, NULL, NULL, 'still running', NOW(3), NOW(3));
              INSERT INTO CrawlStrategyWorkflowRunCandidate (id, runId, candidateKey, externalId, sourceNodeId, sourceNodeType, url, title, description, author, pageType, relevanceScore, score, freshnessScore, qualityScore, publishedAt, crawledAt, effectiveAt, status, rejectedByNodeId, rejectedReason, metadata, traceCount, createdAt, updatedAt) VALUES
                ('frruncandidateext00000001', 'frwfrunrunning0000000001', 'cand-ext', 'cand-ext', 'frrunnode1running000000001', 'legacy.frontier_node', 'https://frrun.example.com/cand-ext', 'Candidate', NULL, NULL, 'article', 0.7, 1.2, NULL, NULL, '2026-01-01 00:00:00.000', NULL, '2026-01-01 00:00:00.000', 'accepted', NULL, NULL, {j({"source": "frontier"})}, 2, DATE_SUB(NOW(3), INTERVAL 10 SECOND), DATE_SUB(NOW(3), INTERVAL 5 SECOND)),
                ('frruncandidateplain00000001', 'frwfrunrunning0000000001', 'cand-plain', NULL, NULL, NULL, 'https://frrun.example.com/cand-plain', NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, 'rejected', 'frrunnode2running000000001', 'low_score', NULL, 0, DATE_SUB(NOW(3), INTERVAL 20 SECOND), DATE_SUB(NOW(3), INTERVAL 10 SECOND));
              INSERT INTO CrawlStrategyWorkflowRunCandidateTrace (id, candidateId, sequence, timestamp, nodeId, nodeType, action, message, accepted, scoreDelta, freshnessDelta, ruleHits, beforeSnapshot, afterSnapshot, details) VALUES
                ('frruntrace1ext000000000001', 'frruncandidateext00000001', 1, '2026-01-01 00:00:00.000', 'frrunnode1running000000001', 'legacy.frontier_node', 'scored', 'Candidate scored', NULL, NULL, NULL, NULL, NULL, NULL, NULL),
                ('frruntrace2ext000000000001', 'frruncandidateext00000001', 2, '2026-01-01 00:00:01.000', 'frrunnode1running000000001', 'legacy.frontier_node', 'accepted', 'Candidate accepted', 1, 1.5, 0.5, {j(["rule-1"])}, {j({"score": 1})}, {j({"score": 2})}, {j({"rejectedReason": "low_score"})});
              INSERT INTO CrawlStrategyWorkflowRunEvent (id, runId, sequence, level, eventType, nodeId, nodeType, message, triggerReason, beforeCount, afterCount, rescuedCount, details, createdAt) VALUES
                ('frrunevent1running00000001', 'frwfrunrunning0000000001', 1, 'info', 'frontier_run_started', NULL, 'legacy.frontier_run', 'Frontier run started', NULL, NULL, NULL, NULL, {j({"frontierRunId": "frrunrunrunning0000000001"})}, '2026-01-01 00:00:00.000'),
                ('frrunevent2running00000001', 'frwfrunrunning0000000001', 2, 'info', 'frontier_node_discovered', 'frrunnode1running000000001', 'legacy.frontier_node', 'Node discovered', 'discovery', 0, 1, 0, {j({"queueClass": "hot"})}, '2026-01-01 00:00:01.000');
              """)
              # Five main runs: running, queued, failed, completed, canceled.
              main_runs = [
                  ("frrunrunrunning0000000001", "frwfrunrunning0000000001", "running", None),
                  ("frrunrunqueued00000000001", "frwfrunqueued00000000001", "queued", None),
                  ("frrunrunfailed00000000001", "frwfrunfailed00000000001", "failed", "Cloudflare challenge detected"),
                  ("frrunruncompleted000000001", "frwfruncompleted000000001", "completed", None),
                  ("frrunruncanceled0000000001", "frwfruncanceled0000000001", "canceled", None),
              ]
              running_metadata = {
                  "runRole": "  active  ",
                  "warningFlags": ["ssrf_blocked", "", "ssrf_blocked"],
                  "llmJudgeEnabled": True,
                  "llmJudgeAttempted": True,
                  "llmJudgeParsed": False,
                  "llmJudgeError": "judge boom",
                  "llmPendingJudgeJobs": 2,
                  "pendingLlmJudgeJobs": "3.6",
                  "failureKind": "",
                  "coverage": {"byPageType": {"home": "2", "category": None, "list": 3, "article": "x"}, "byDepth": {"0": "1", "1": 2}},
                  "candidateStats": {"accepted": "5", "rejected": 2},
                  "rejectionCounts": {"low_score": 1},
                  "judgeSummary": {"count": "4", "averageConfidence": 0.8},
                  "rootDiagnosis": {"failureKind": "root_kind", "seedStrategy": "frontier_only", "nativeStrategyType": "native", "nativeFilterChainType": "f", "nativeUrlScorerType": "s", "linkPreviewMode": "js", "linkPreviewQuery": "a[href]", "domScopeMode": "main", "seedYield": {"pages": "7"}},
                  "seedStrategy": "  seed_first  ",
                  "seedOrigin": "frontier_root",
                  "seedMethod": "robots",
                  "fallbackStage": "frontier",
                  "shadowComparison": {"summary": "improved", "articleLift": 0.2},
                  "shadowProfileId": "profile-shadow",
                  "shadowPublishedProfileId": "profile-published",
                  "llmLifecycle": {"role": "shadow", "learnQueuedAt": "2026-01-01T00:00:00.000Z"},
                  "llmAssist": {"enabled": True},
                  "seedQuality": {"score": 0.5},
                  "seedDiagnostics": {"notes": "ok"},
              }
              queued_metadata = {"llmPendingJudgeJobs": "2.5", "pendingLlmJudgeJobs": 3.6, "runRole": "shadow", "failureKind": "queued_kind", "seedStrategy": "frontier_only", "rootDiagnosis": {"failureKind": "queued_kind", "seedStrategy": "frontier_only"}}
              failed_metadata = {"failureKind": "", "warningFlags": ["challenge_detected"]}
              run_rows = []
              for index, (run_id, wf_id, status, last_error) in enumerate(main_runs):
                  metadata = running_metadata if status == "running" else (queued_metadata if status == "queued" else (failed_metadata if status == "failed" else {}))
                  finished = "'2020-01-01 00:00:00.000'" if status in ("completed", "canceled") else "NULL"
                  started = "'2026-01-01 00:00:00.000'" if status in ("running", "completed", "failed") else "NULL"
                  run_rows.append(
                      f"('{run_id}', '{org}', 'frrunprofilea00000000001', '{wf_id}', 'https://frrun.example.com/start/{index}', 'frruntaska000000000000001', 'layered', '{status}', 3, 60, "
                      f"{j(['k1'])}, {index}, 3, 1, 1, 0, 'native-run-{index}', "
                      f"{s(last_error)}, "
                      f"{j(metadata) if metadata else 'NULL'}, '{admin}', {started}, {finished}, DATE_SUB(NOW(3), INTERVAL {100 - index} SECOND), NOW(3))"
                  )
              sql("INSERT INTO CrawlFrontierRun (id, orgId, profileId, workflowRunId, seedUrl, crawlTaskId, executionMode, status, maxDepth, maxPages, keywords, pageCount, nodeCount, articleCount, failedCount, duplicateCount, nativeRunId, lastError, metadata, createdById, startedAt, finishedAt, createdAt, updatedAt) VALUES " + ", ".join(run_rows) + ";")

              # Cross-tenant run for the 404 checks.
              sql(f"""
              INSERT INTO CrawlFrontierRun (id, orgId, profileId, workflowRunId, seedUrl, crawlTaskId, executionMode, status, maxDepth, maxPages, createdById, createdAt, updatedAt)
              VALUES ('frrunrunother00000000001', '{other}', 'frrunprofileb00000000001', 'frwfrunother00000000001', 'https://frrun.example.com/other', 'frruntaskb000000000000001', 'layered', 'running', 3, 60, '{admin}', DATE_SUB(NOW(3), INTERVAL 200 SECOND), NOW(3));
              """)

              # A run without a workflow run (404 Crawl frontier workflow run not found).
              sql(f"""
              INSERT INTO CrawlFrontierRun (id, orgId, profileId, seedUrl, crawlTaskId, executionMode, status, maxDepth, maxPages, createdById, createdAt, updatedAt)
              VALUES ('frrunrunnoworkflow000001', '{org}', 'frrunprofilea00000000001', 'https://frrun.example.com/no-wf', 'frruntaska000000000000001', 'layered', 'queued', 3, 60, '{admin}', DATE_SUB(NOW(3), INTERVAL 150 SECOND), NOW(3));
              """)

              # Nodes: three for the running run (one references org B's result), one per other run.
              sql(f"""
              INSERT INTO CrawlFrontierNode (id, runId, orgId, url, canonicalUrl, urlFingerprint, pageType, depth, queueClass, status, score, freshnessScore, attempts, queuedAt, crawledAt, crawlResultId, metadata, discoveredAt, createdAt, updatedAt) VALUES
                ('frrunnode1running000000001', 'frrunrunrunning0000000001', '{org}', 'https://frrun.example.com/start/0', NULL, 'fp-1', 'home', 0, 'hot', 'queued', 1.5, 0.5, 1, '2026-01-01 00:00:00.000', NULL, 'frrunresulta0000000000001', {j({"seed": True, "warningFlags": ["node_flag"], "failureKind": ""})}, '2026-01-01 00:00:01.000', NOW(3), NOW(3)),
                ('frrunnode2running000000001', 'frrunrunrunning0000000001', '{org}', 'https://frrun.example.com/start/1', NULL, 'fp-2', 'article', 1, 'normal', 'running', NULL, NULL, 0, NULL, NULL, NULL, NULL, '2026-01-01 00:00:02.000', NOW(3), NOW(3)),
                ('frrunnode3running000000001', 'frrunrunrunning0000000001', '{org}', 'https://frrun.example.com/start/2', NULL, 'fp-3', 'list', 1, 'normal', 'completed', NULL, NULL, 0, NULL, NULL, 'frrunresultb0000000000001', NULL, '2026-01-01 00:00:03.000', NOW(3), NOW(3));
              INSERT INTO CrawlFrontierNode (id, runId, orgId, url, pageType, depth, queueClass, status, discoveredAt, createdAt, updatedAt) VALUES
                ('frrunnodequeued0000000001', 'frrunrunqueued00000000001', '{org}', 'https://frrun.example.com/q', 'home', 0, 'hot', 'pending', '2026-01-01 00:00:04.000', NOW(3), NOW(3)),
                ('frrunnodefailed0000000001', 'frrunrunfailed00000000001', '{org}', 'https://frrun.example.com/f', 'home', 0, 'hot', 'failed', '2026-01-01 00:00:05.000', NOW(3), NOW(3)),
                ('frrunnodecompleted00000001', 'frrunruncompleted000000001', '{org}', 'https://frrun.example.com/c', 'home', 0, 'hot', 'completed', '2026-01-01 00:00:06.000', NOW(3), NOW(3)),
                ('frrunnodecanceled000000001', 'frrunruncanceled0000000001', '{org}', 'https://frrun.example.com/x', 'home', 0, 'hot', 'canceled', '2026-01-01 00:00:07.000', NOW(3), NOW(3));
              """)

              ok("stage 0 seed complete")

          seed_stage0()

          # ---------------------------------------------------------------
          # Stage 1: switch legacy (proxy) then go; compare Go with Nest
          # ---------------------------------------------------------------
          start_go("legacy")
          writer = login("frrun-writer@example.com")
          reader = login("frrun-reader@example.com")
          outsider = login("frrun-other@example.com")
          ok("stage 1 logins through the legacy proxy")

          start_go("go")

          running_id = "frrunrunrunning0000000001"
          wf_id = "frwfrunrunning0000000001"
          node_id = "frrunnode1running000000001"
          get_paths = [
              runs,
              f"{runs}/{running_id}",
              f"{runs}/{running_id}/workflow-run",
              f"{runs}/{running_id}/workflow-candidates",
              f"{runs}/{running_id}/workflow-candidates/cand-ext",
              f"{nodes}/{node_id}",
              f"{wf_runs}/{wf_id}",
              f"{wf_runs}/{wf_id}/candidates",
              f"{wf_runs}/{wf_id}/candidates/cand-ext/explanation",
          ]
          for path in get_paths:
              same(path, "GET", writer)
          ok("stage 1 nine GET endpoints match Nest")

          # list filters
          for query in [
              "search=frrun",
              "search=frrun_",
              "search=frrun%",
              "profileId=frrunprofilea00000000001",
              "status=running",
              "executionMode=layered",
              "runRole=active",
              "failureKind=root_kind",
              "warningFlag=ssrf_blocked",
              "seedStrategy=seed_first",
              "status=running&executionMode=layered",
              "runRole=shadow&failureKind=queued_kind",
          ]:
              same(f"{runs}?{query}", "GET", writer)
          ok("stage 1 list filters match Nest (including _ and % wildcards)")

          # 400s
          long_search = "a" * 201
          for query, expected in [
              ("foo=1", "property foo should not exist"),
              ("status=running&status=queued", "status must be one of the following values: pending, queued, running, completed, failed, canceled; status must be a string"),
              (f"search={long_search}", "search must be shorter than or equal to 200 characters"),
              ("status=nope", "status must be one of the following values: pending, queued, running, completed, failed, canceled"),
          ]:
              status, text = same_error(f"{runs}?{query}", "GET", writer)
              if status != 400 or text != expected:
                  fail(f"query 400 {query} {status} {text!r}")
          ok("stage 1 query 400 messages match Nest")

          # 404s
          for path, expected in [
              (f"{runs}/frrunmissing000000000001", "Crawl frontier run not found"),
              (f"{runs}/frrunrunother00000000001", "Crawl frontier run not found"),
              (f"{runs}/frrunrunnoworkflow000001/workflow-run", "Crawl frontier workflow run not found"),
              (f"{runs}/{running_id}/workflow-candidates/missing-candidate", "Workflow candidate not found"),
              (f"{nodes}/frrunmissingnode00000001", "Crawl frontier node not found"),
              (f"{wf_runs}/frwfmissing000000000001", "Workflow run not found"),
              (f"{wf_runs}/frwfrunother00000000001", "Workflow run not found"),
              (f"{wf_runs}/{wf_id}/candidates/missing-candidate/explanation", "Workflow candidate not found"),
          ]:
              status, text = same_error(path, "GET", writer)
              if status != 404 or text != expected:
                  fail(f"404 {path} {status} {text!r}")
          ok("stage 1 404 messages match Nest")

          # Permissions: read-only user and read token can read; write requires crawl.write.
          for token in (reader, read_token):
              for path in get_paths:
                  if call(go, path, "GET", token)[0] != 200:
                      fail(f"read access failed {path}")
              if call(go, f"{runs}/{running_id}/cancel", "POST", token)[0] != 403:
                  fail("read-only identity was not 403 on cancel")
              if call(go, runs + "/cancel", "POST", token, {"ids": [running_id]})[0] != 403:
                  fail("read-only identity was not 403 on bulk cancel")
          if call(go, runs, "GET", None)[0] != 401 or call(go, runs, "GET", "not-a-jwt")[0] != 401:
              fail("missing/bad token was not 401")
          if call(go, runs, "GET", "mtk_unknown_token")[0] != 401:
              fail("unknown machine token was not 401")
          ok("stage 1 identity and permission failures match the contract")

          # Cross-tenant: A cannot read B's run; a node referencing B's result renders null.
          status, raw = call(go, f"{runs}/frrunrunother00000000001", "GET", writer)
          if status != 404 or message(raw) != "Crawl frontier run not found":
              fail(f"cross tenant run {status} {raw[:300]!r}")
          cross_node = body(call(go, f"{nodes}/frrunnode3running000000001", "GET", writer)[1])
          if cross_node.get("crawlResult") is not None or cross_node.get("article") is not None:
              fail(f"cross-tenant crawl result leaked: {cross_node.get('crawlResult')}")
          ok("stage 1 cross-tenant reads are 404 / null")

          # Omission: candidate keys must match Nest exactly.
          nest_candidate = body(call(nest, f"{runs}/{running_id}/workflow-candidates/cand-ext", "GET", writer)[1])
          go_candidate = body(call(go, f"{runs}/{running_id}/workflow-candidates/cand-ext", "GET", writer)[1])
          if list(nest_candidate.keys()) != list(go_candidate.keys()):
              fail(f"candidate key order differs nest={list(nest_candidate.keys())} go={list(go_candidate.keys())}")
          if list(nest_candidate["trace"][0].keys()) != list(go_candidate["trace"][0].keys()):
              fail(f"trace key order differs nest={list(nest_candidate['trace'][0].keys())} go={list(go_candidate['trace'][0].keys())}")
          if "description" in go_candidate or "ruleHits" in go_candidate["trace"][0]:
              fail(f"omitted keys leaked: {go_candidate}")
          ok("stage 1 undefined omission matches Nest")

          # ---------------------------------------------------------------
          # Stage 2: F1 regression, one independent seed per server
          # ---------------------------------------------------------------
          def seed_stage2(side):
              suffix = "g" if side == "go" else "n"
              ids = {
                  "completed": f"frrun2{suffix}completed00000001",
                  "running": f"frrun2{suffix}running000000001",
                  "running2": f"frrun2{suffix}arun2000000000001",
                  "failed": f"frrun2{suffix}zfail0000000000001",
                  "queued": f"frrun2{suffix}queued000000001",
                  "wf_completed": f"frwf2{suffix}completed0000001",
                  "wf_running": f"frwf2{suffix}running00000001",
                  "wf_running2": f"frwf2{suffix}running200000001",
                  "wf_failed": f"frwf2{suffix}failed00000001",
                  "wf_queued": f"frwf2{suffix}queued00000001",
              }
              for key, status in [("completed", "completed"), ("running", "running"), ("running2", "running"), ("failed", "failed"), ("queued", "queued")]:
                  wf_key = "wf_" + key
                  error_sql = "'keep-me'" if status == "completed" else "NULL"
                  finished = "'2020-01-01 00:00:00.000'" if status == "completed" else "NULL"
                  sql(f"""
                  INSERT INTO CrawlStrategyWorkflowRun (id, orgId, workflowOrigin, status, runKind, error, createdById, startedAt, finishedAt, createdAt, updatedAt)
                  VALUES ('{ids[wf_key]}', '{org}', 'bound', '{status}', 'frontier', {error_sql}, '{admin}', '2026-01-01 00:00:00.000', {finished}, NOW(3), NOW(3));
                  INSERT INTO CrawlFrontierRun (id, orgId, profileId, workflowRunId, seedUrl, crawlTaskId, executionMode, status, maxDepth, maxPages, createdById, finishedAt, createdAt, updatedAt)
                  VALUES ('{ids[key]}', '{org}', 'frrunprofilea00000000001', '{ids[wf_key]}', 'https://frrun.example.com/{side}/{key}', 'frruntaska000000000000001', 'layered', '{status}', 3, 60, '{admin}', {finished}, NOW(3), NOW(3));
                  """)
                  if status in ("running", "queued"):
                      sql(f"""
                      INSERT INTO CrawlFrontierNode (id, runId, orgId, url, pageType, depth, queueClass, status, discoveredAt, createdAt, updatedAt) VALUES
                        ('{ids[key][:20]}n1', '{ids[key]}', '{org}', 'https://frrun.example.com/{side}/{key}/1', 'home', 0, 'hot', 'pending', NOW(3), NOW(3), NOW(3)),
                        ('{ids[key][:20]}n2', '{ids[key]}', '{org}', 'https://frrun.example.com/{side}/{key}/2', 'list', 1, 'normal', 'queued', NOW(3), NOW(3), NOW(3)),
                        ('{ids[key][:20]}n3', '{ids[key]}', '{org}', 'https://frrun.example.com/{side}/{key}/3', 'article', 1, 'normal', 'running', NOW(3), NOW(3), NOW(3)),
                        ('{ids[key][:20]}n4', '{ids[key]}', '{org}', 'https://frrun.example.com/{side}/{key}/4', 'article', 2, 'normal', 'completed', NOW(3), NOW(3), NOW(3));
                      """)
              # Lock-contention pairs with opposite id order per round.
              for round_index in range(5):
                  for slot in ("a", "b"):
                      run_id = f"frrunlock{suffix}{round_index}{slot}0000000001"
                      sql(f"""
                      INSERT INTO CrawlFrontierRun (id, orgId, seedUrl, executionMode, status, maxDepth, maxPages, createdById, createdAt, updatedAt)
                      VALUES ('{run_id}', '{org}', 'https://frrun.example.com/lock/{round_index}/{slot}', 'layered', 'queued', 3, 60, '{admin}', NOW(3), NOW(3));
                      """)
              ok(f"stage 2 seed complete ({side})")

          def event_count(wf_run_id, event_type):
              return int(scalar(f"SELECT COUNT(*) FROM CrawlStrategyWorkflowRunEvent WHERE runId='{wf_run_id}' AND eventType='{event_type}'"))

          def run_status(run_id):
              return scalar(f"SELECT status FROM CrawlFrontierRun WHERE id='{run_id}'")

          def finished_at(run_id):
              return scalar(f"SELECT DATE_FORMAT(finishedAt, '%Y-%m-%d %H:%i:%s.%f') FROM CrawlFrontierRun WHERE id='{run_id}'")

          seed_stage2("go")
          seed_stage2("nest")
          ok("stage 2 independent seeds for Go and Nest")

          for side, url in (("nest", nest), ("go", go)):
              suffix = "g" if side == "go" else "n"
              ids = {
                  "completed": f"frrun2{suffix}completed00000001",
                  "running": f"frrun2{suffix}running000000001",
                  "running2": f"frrun2{suffix}arun2000000000001",
                  "failed": f"frrun2{suffix}zfail0000000000001",
                  "queued": f"frrun2{suffix}queued000000001",
                  "wf_completed": f"frwf2{suffix}completed0000001",
                  "wf_running": f"frwf2{suffix}running00000001",
                  "wf_running2": f"frwf2{suffix}running200000001",
                  "wf_failed": f"frwf2{suffix}failed00000001",
                  "wf_queued": f"frwf2{suffix}queued00000001",
              }

              # (a) completed cancel is an idempotent no-op.
              before_finished = finished_at(ids["completed"])
              before_events = event_count(ids["wf_completed"], "frontier_run_canceled")
              status, raw = call(url, f"{runs}/{ids['completed']}/cancel", "POST", writer)
              if status != 201:
                  fail(f"{side} completed cancel {status} {raw[:300]!r}")
              if run_status(ids["completed"]) != "completed" or finished_at(ids["completed"]) != before_finished:
                  fail(f"{side} completed run was rewritten: {run_status(ids['completed'])} {finished_at(ids['completed'])}")
              if scalar(f"SELECT status FROM CrawlStrategyWorkflowRun WHERE id='{ids['wf_completed']}'") != "completed":
                  fail(f"{side} completed workflow run was rewritten")
              if scalar(f"SELECT error FROM CrawlStrategyWorkflowRun WHERE id='{ids['wf_completed']}'") != "keep-me":
                  fail(f"{side} completed workflow run error changed")
              if event_count(ids["wf_completed"], "frontier_run_canceled") != before_events:
                  fail(f"{side} completed cancel appended an event")
              ok(f"stage 2 {side} completed run cancel keeps completed history")

              # (b) running cancel transitions once.
              before_events = event_count(ids["wf_running"], "frontier_run_canceled")
              status, raw = call(url, f"{runs}/{ids['running']}/cancel", "POST", writer)
              if status != 201:
                  fail(f"{side} running cancel {status} {raw[:300]!r}")
              if run_status(ids["running"]) != "canceled":
                  fail(f"{side} running run is not canceled")
              for node_status in ("pending", "queued", "running"):
                  if scalar(f"SELECT COUNT(*) FROM CrawlFrontierNode WHERE runId='{ids['running']}' AND status='{node_status}'") != "0":
                      fail(f"{side} node {node_status} was not canceled")
              if scalar(f"SELECT COUNT(*) FROM CrawlFrontierNode WHERE runId='{ids['running']}' AND status='completed'") != "1":
                  fail(f"{side} completed node was rewritten")
              if scalar(f"SELECT status FROM CrawlStrategyWorkflowRun WHERE id='{ids['wf_running']}'") != "canceled":
                  fail(f"{side} workflow run is not canceled")
              after_events = event_count(ids["wf_running"], "frontier_run_canceled")
              if after_events != before_events + 1:
                  fail(f"{side} cancel event count = {after_events}, want {before_events + 1}")
              sequence = scalar(f"SELECT MAX(sequence) FROM CrawlStrategyWorkflowRunEvent WHERE runId='{ids['wf_running']}' AND eventType='frontier_run_canceled'")
              if sequence != str(before_events + 1):
                  fail(f"{side} cancel event sequence = {sequence}")
              ok(f"stage 2 {side} running run cancel transitions once")

              # (c) bulk cancel skips terminal, cross-tenant and unknown ids.
              payload = {"ids": [ids["completed"], ids["running2"], ids["failed"], "frrunrunother00000000001", "frrunmissing000000000001", " " + ids["running2"] + " "]}
              status, raw = call(url, runs + "/cancel", "POST", writer, payload)
              doc = body(raw) or {}
              expected_ids = sorted([ids["running2"], ids["failed"]])
              if status != 201 or doc.get("canceledIds") != expected_ids or doc.get("canceledCount") != 2:
                  fail(f"{side} bulk cancel {status} {doc}")
              if run_status(ids["completed"]) != "completed":
                  fail(f"{side} bulk cancel rewrote the completed run")
              ok(f"stage 2 {side} bulk cancel skips terminal and cross-tenant ids")

              # (d) concurrent cancels append exactly one event.
              concurrent_id = ids["queued"]
              concurrent_wf = ids["wf_queued"]
              results = {}

              def cancel(tag, target_url, run_id):
                  try:
                      results[tag] = call(target_url, f"{runs}/{run_id}/cancel", "POST", writer)
                  except Exception as exc:  # noqa: BLE001
                      results[tag] = (0, repr(exc).encode())

              threads = []
              for index in range(10):
                  target_url = go if index % 2 == 0 else nest
                  threads.append(threading.Thread(target=cancel, args=(index, target_url, concurrent_id)))
              for thread in threads:
                  thread.start()
              for thread in threads:
                  thread.join()
              for index in range(10):
                  if results[index][0] != 201:
                      fail(f"{side} concurrent cancel {index} {results[index][0]} {results[index][1][:200]!r}")
              if event_count(concurrent_wf, "frontier_run_canceled") != 1:
                  fail(f"{side} concurrent cancel events = {event_count(concurrent_wf, 'frontier_run_canceled')}")
              if run_status(concurrent_id) != "canceled":
                  fail(f"{side} concurrent cancel did not cancel the run")
              ok(f"stage 2 {side} concurrent cancels append exactly one event")

              # (e) opposite-order bulk cancels do not deadlock.
              for round_index in range(5):
                  run_a = f"frrunlock{suffix}{round_index}a0000000001"
                  run_b = f"frrunlock{suffix}{round_index}b0000000001"
                  pair_results = {}

                  def bulk(tag, target_url, first, second):
                      try:
                          pair_results[tag] = call(target_url, runs + "/cancel", "POST", writer, {"ids": [first, second]})
                      except Exception as exc:  # noqa: BLE001
                          pair_results[tag] = (0, repr(exc).encode())

                  threads = [
                      threading.Thread(target=bulk, args=("go", go, run_a, run_b)),
                      threading.Thread(target=bulk, args=("nest", nest, run_b, run_a)),
                  ]
                  for thread in threads:
                      thread.start()
                  for thread in threads:
                      thread.join()
                  for tag in ("go", "nest"):
                      if pair_results[tag][0] != 201:
                          fail(f"{side} lock round {round_index} {tag} {pair_results[tag][0]} {pair_results[tag][1][:200]!r}")
              ok(f"stage 2 {side} opposite-order bulk cancels do not deadlock")

              # (f) bulk DTO messages are byte-identical.
              cases = [
                  ({"ids": []}, "ids should not be empty"),
                  ({"ids": [" "]}, "ids must contain at least one run id"),
                  ({"ids": ["x"] * 201}, "ids must contain no more than 200 elements"),
                  ({"ids": [1]}, "each value in ids must be shorter than or equal to 191 characters; each value in ids must be a string"),
                  ({"ids": ["x" * 192]}, "each value in ids must be shorter than or equal to 191 characters"),
              ]
              for payload, expected in cases:
                  status, text = same_error(runs + "/cancel", "POST", writer, payload)
                  if status != 400 or text != expected:
                      fail(f"{side} bulk DTO {expected!r} got {status} {text!r}")
              ok(f"stage 2 {side} bulk DTO messages match Nest byte for byte")

          # ---------------------------------------------------------------
          # Stage 3: stop Nest; the 11 routes are still served by Go
          # ---------------------------------------------------------------
          sql(f"""
          INSERT INTO CrawlStrategyWorkflowRun (id, orgId, workflowOrigin, status, runKind, createdById, startedAt, createdAt, updatedAt)
          VALUES ('frwfstage3running00000001', '{org}', 'bound', 'running', 'frontier', '{admin}', NOW(3), NOW(3), NOW(3));
          INSERT INTO CrawlFrontierRun (id, orgId, profileId, workflowRunId, seedUrl, crawlTaskId, executionMode, status, maxDepth, maxPages, createdById, startedAt, createdAt, updatedAt)
          VALUES ('frrunstage3running0000001', '{org}', 'frrunprofilea00000000001', 'frwfstage3running00000001', 'https://frrun.example.com/stage3', 'frruntaska000000000000001', 'layered', 'running', 3, 60, '{admin}', NOW(3), NOW(3), NOW(3));
          INSERT INTO CrawlFrontierNode (id, runId, orgId, url, pageType, depth, queueClass, status, discoveredAt, createdAt, updatedAt)
          VALUES ('frrunnodestage300000000001', 'frrunstage3running0000001', '{org}', 'https://frrun.example.com/stage3/1', 'home', 0, 'hot', 'queued', NOW(3), NOW(3), NOW(3));
          """)

          if os.path.exists("/tmp/api-nestjs.pid"):
              os.kill(int(open("/tmp/api-nestjs.pid").read().strip()), signal.SIGTERM)
          subprocess.run(["pkill", "-f", "apps/api/dist/main.js"], check=False)
          subprocess.run(["pkill", "-f", "node dist/main.js"], check=False)
          stopped = False
          for _ in range(30):
              try:
                  urllib.request.urlopen(nest + "/api/healthz/live", timeout=2).read()
              except Exception:
                  stopped = True
                  break
              time.sleep(1)
          if not stopped:
              fail("nestjs did not stop")

          stage3_paths = [
              (runs, "GET", None),
              (f"{runs}/frrunstage3running0000001", "GET", None),
              (f"{runs}/frrunstage3running0000001/workflow-run", "GET", None),
              (f"{runs}/frrunstage3running0000001/workflow-candidates", "GET", None),
              (f"{runs}/frrunstage3running0000001/workflow-candidates/missing", "GET", None),
              (f"{nodes}/frrunnodestage300000000001", "GET", None),
              (f"{wf_runs}/frwfstage3running00000001", "GET", None),
              (f"{wf_runs}/frwfstage3running00000001/candidates", "GET", None),
              (f"{wf_runs}/frwfstage3running00000001/candidates/missing/explanation", "GET", None),
          ]
          for path, method, payload in stage3_paths:
              status, raw = call(go, path, method, writer, payload)
              if status not in (200, 404):
                  fail(f"stage 3 {method} {path} = {status} {raw[:300]!r}")
          status, raw = call(go, f"{runs}/frrunstage3running0000001/cancel", "POST", writer)
          if status != 201 or run_status("frrunstage3running0000001") != "canceled":
              fail(f"stage 3 cancel {status} {raw[:300]!r}")
          status, raw = call(go, runs + "/cancel", "POST", writer, {"ids": ["frrunstage3running0000001"]})
          if status != 201:
              fail(f"stage 3 bulk cancel {status} {raw[:300]!r}")
          ok("stage 3 eleven routes are still served by Go after Nest stops")

          for path, payload in [
              (runs, {"seedUrl": "https://example.com/"}),
              (f"{nodes}/frrunnodestage300000000001/retry", {}),
              (f"{wf_runs}/frwfstage3running00000001/replay", {}),
          ]:
              status, raw = call(go, path, "POST", writer, payload)
              if status != 502 or (body(raw) or {}).get("statusCode") != 502:
                  fail(f"stage 3 write queue {path} = {status} {raw[:300]!r}")
          ok("stage 3 write queue routes stay on Nest and return 502")

          print("ALL STAGES PASSED")
