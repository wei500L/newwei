# 采集站点画像编辑接口的真实栈验收。不进普通 CI。
# PR 上加 label api-go-crawl-profiles-smoke，或 workflow_dispatch。
# SCHEDULE_ENABLED 保持 false。不请求 crawl4ai；不把试跑、模型、
# AkShare 或 Nominatim 当通过。
name: api-go-crawl-profiles-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-crawl-profiles-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-crawl-profiles-smoke@example.com
  SMTP_PASS: api-go-crawl-profiles-smoke-smtp-not-connected
  JWT_SECRET: c1f4a9e8d2b3706f5a1c8e9d4b2a7f6038e5d1c9a7b6f4e2d3c8a1b5f9e0d7c2
  NEXTAUTH_SECRET: e2b5c1f8a9d3b47e60d4a1f8c3b5e79d02c1f4a9e8d2b3706f5a1c8e9d4b2a7f6
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  SEED_ORG_SLUG: api-go-crawl-profiles-smoke-org
  SEED_ORG_NAME: api-go Crawl Profiles Smoke Org
  SEED_ADMIN_EMAIL: api-go-crawl-profiles-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: ApiGoCrawlPr#2026-Ci
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-crawl-profiles-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-crawl-profiles-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-crawl-pr:ci .
      - name: Exercise crawl profile routes
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib, json, os, signal, subprocess, threading, time, urllib.error, urllib.request

          nest = "http://127.0.0.1:4000"
          go = "http://127.0.0.1:4020"
          org = "cwpforgsmoke00000000000001"
          other = "cwpforgother00000000000001"

          base = "/api/admin/crawl-frontier"
          profiles = base + "/profiles"

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def sql(statement):
              cid = subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=mysql:8.4"], text=True).split()[0]
              proc = subprocess.run(["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "app"], input=statement, text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(proc.stderr or proc.stdout)
              return proc.stdout.strip()

          def scalar(statement):
              lines = [line.strip() for line in sql(statement).splitlines() if line.strip()]
              return lines[-1] if lines else ""

          def redis_jobs():
              cid = subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=redis:7.2"], text=True).split()[0]
              proc = subprocess.run(["docker", "exec", cid, "redis-cli", "--scan", "--pattern", "bull:crawl4ai*"], text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(proc.stderr or proc.stdout)
              return len([line for line in proc.stdout.splitlines() if line.strip()])

          def start_go(profiles_mode):
              subprocess.run(["docker", "rm", "-f", "api-go-crawl-pr"], check=False, capture_output=True)
              env = [
                  "PORT=4020",
                  "LEGACY_API_URL=http://host.docker.internal:4000",
                  "DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app",
                  "MONGO_URI=mongodb://host.docker.internal:27017/app",
                  f"API_GO_CRAWL_PROFILES_MODE={profiles_mode}",
                  "API_GO_CRAWL_WORKFLOWS_MODE=legacy",
                  "API_GO_NEWS_SOURCES_MODE=legacy",
                  "API_GO_SITUATION_MONITORS_MODE=legacy",
                  "API_GO_CONTENT_SUBSCRIPTIONS_MODE=legacy",
                  "API_GO_USER_NEWS_BEHAVIOR_MODE=legacy",
                  "API_GO_USER_DIGEST_MODE=legacy",
                  "API_GO_DASHBOARD_STATS_MODE=legacy",
                  "API_GO_DASHBOARD_CHARTS_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_GEO_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE=legacy",
                  "API_GO_DASHBOARD_STREAM_MODE=legacy",
                  "API_GO_HEALTHZ_MODE=legacy",
                  "API_GO_PUBLIC_PORTAL_MODE=legacy",
                  "API_GO_ANALYSIS_VIEWS_MODE=legacy",
                  "API_GO_ANALYSIS_BOARDS_MODE=legacy",
                  "API_GO_ANALYSIS_THREADS_MODE=legacy",
                  "API_GO_GRAPHQL_READ_MODE=legacy",
                  "API_GO_GRAPHQL_NEWS_EVENTS_MODE=legacy",
                  "API_GO_USER_SETTINGS_WRITE_MODE=legacy",
                  "REALTIME_SIGNALS_ENABLED=false",
                  "ELASTICSEARCH_ENABLED=false",
                  "MODEL_SERVICE_ENABLED=false",
                  "SCHEDULE_ENABLED=false",
                  f"JWT_SECRET={os.environ['JWT_SECRET']}",
                  f"JWT_ISSUER={os.environ['JWT_ISSUER']}",
                  f"JWT_AUDIENCE={os.environ['JWT_AUDIENCE']}",
                  "REDIS_HOST=host.docker.internal",
                  "REDIS_PORT=6379",
                  "CANARY_PERCENT=0",
                  f"CORS_ORIGIN={os.environ['CORS_ORIGIN']}",
              ]
              cmd = ["docker", "run", "-d", "--name", "api-go-crawl-pr",
                     "--add-host=host.docker.internal:host-gateway",
                     "--health-interval", "5s", "--health-timeout", "3s", "--health-retries", "20", "--health-start-period", "5s",
                     "-p", "127.0.0.1:4020:4020"]
              for item in env:
                  cmd.extend(["-e", item])
              cmd.append("api-go-crawl-pr:ci")
              subprocess.check_call(cmd)
              for _ in range(30):
                  status = subprocess.check_output(["docker", "inspect", "--format", "{{.State.Health.Status}}", "api-go-crawl-pr"], text=True).strip()
                  print("health", status, "profilesMode", profiles_mode)
                  if status == "healthy":
                      return
                  if status == "unhealthy":
                      fail(subprocess.check_output(["docker", "logs", "api-go-crawl-pr"], text=True)[-4000:])
                  time.sleep(2)
              fail(subprocess.check_output(["docker", "logs", "api-go-crawl-pr"], text=True)[-4000:])

          def call(base_url, path, method="GET", token=None, payload=None, timeout=30):
              headers = {}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(base_url + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          def body(raw):
              if not raw:
                  return None
              text = raw.decode("utf-8", "replace").strip()
              if not text:
                  return None
              return json.loads(text)

          def core(value):
              if isinstance(value, dict):
                  return {key: core(item) for key, item in value.items() if key not in ("traceId", "timestamp")}
              if isinstance(value, list):
                  return [core(item) for item in value]
              return value

          def message(raw):
              doc = body(raw) or {}
              text = doc.get("message")
              if isinstance(text, list):
                  return "; ".join(str(item) for item in text)
              return text

          def login(email):
              status, raw = call(nest, "/api/auth/login", "POST", payload={"email": email, "password": os.environ["SEED_ADMIN_PASSWORD"]})
              doc = body(raw)
              if status not in (200, 201) or not doc or not doc.get("accessToken"):
                  fail(f"login {email} {status} {raw[:400]!r}")
              return doc["accessToken"]

          def same(path, method="GET", token=None, payload=None):
              left_status, left_raw = call(nest, path, method, token, payload)
              right_status, right_raw = call(go, path, method, token, payload)
              if left_status != right_status or core(body(left_raw)) != core(body(right_raw)):
                  fail(f"parity {method} {path} nest={left_status} {left_raw[:500]!r} go={right_status} {right_raw[:500]!r}")
              return left_status, body(left_raw)

          def smoke_config():
              return {
                  "keywords": ["alpha", " beta ", "", "alpha", 7],
                  "urlPatterns": {"article": ["/news/"], "exclude": ["/tag/"]},
                  "hostScope": "Strict_Hosts",
                  "seedDiscovery": {"mode": "common_paths", "maxSeedUrls": 25},
                  "freshnessRules": {"recentHours": 12},
                  "layeredOptions": {"maxDepth": 5, "scoreThreshold": 0.25},
                  "crawlOptions": {"check_robots_txt": False},
              }

          def create_payload(name, match_host, extra=None):
              payload = {"name": name, "description": " smoke ", "matchHost": match_host, "config": smoke_config()}
              if extra:
                  payload.update(extra)
              return payload

          admin = scalar("SELECT id FROM User WHERE email='api-go-crawl-profiles-smoke-admin@example.com'")
          baseline_jobs = redis_jobs()
          read_perm = scalar("SELECT id FROM Permission WHERE name='crawl.read'")
          write_perm = scalar("SELECT id FROM Permission WHERE name='crawl.write'")
          sql(f"""
          INSERT INTO Org (id, name, slug, isActive, createdAt, updatedAt) VALUES
            ('{org}', 'Crawl Profiles Smoke', 'crawl-profiles-smoke', 1, NOW(3), NOW(3)),
            ('{other}', 'Crawl Profiles Other', 'crawl-profiles-other', 1, NOW(3), NOW(3));
          INSERT INTO Role (id, name, isSystem, orgId) VALUES
            ('cwprolewriter000000000001', 'cwp-writer', 0, '{org}'),
            ('cwprolereader000000000001', 'cwp-reader', 0, '{org}'),
            ('cwproleother0000000000001', 'cwp-other', 0, '{other}');
          INSERT INTO RolePermission (id, roleId, permissionId) VALUES
            ('cwppermwriterread00000001', 'cwprolewriter000000000001', '{read_perm}'),
            ('cwppermwriterwrite0000001', 'cwprolewriter000000000001', '{write_perm}'),
            ('cwppermreaderread00000001', 'cwprolereader000000000001', '{read_perm}'),
            ('cwppermotherread00000001', 'cwproleother0000000000001', '{read_perm}'),
            ('cwppermotherwrite000001', 'cwproleother0000000000001', '{write_perm}');
          INSERT INTO CrawlSiteProfile (id, orgId, name, description, matchHost, isActive, executionMode, workflowBindingMode, version, config, createdById, createdAt, updatedAt) VALUES
            ('cwpprofilea00000000000001', '{org}', 'Match Profile A', NULL, 'match.example.com', 1, 'layered', 'published', 1,
             CAST('{{"keywords":["msmoke"]}}' AS JSON), '{admin}', NOW(3), NOW(3)),
            ('cwpprofileb00000000000001', '{other}', 'Other Match Profile', NULL, 'match.example.com', 1, 'layered', 'published', 1,
             CAST('{{"keywords":["msmoke"]}}' AS JSON), '{admin}', DATE_SUB(NOW(3), INTERVAL 5 SECOND), DATE_SUB(NOW(3), INTERVAL 5 SECOND));
          """)
          users = [
              ("cwpuserwriter000000000001", "cwp-writer@example.com", org, "cwprolewriter000000000001"),
              ("cwpuserreader000000000001", "cwp-reader@example.com", org, "cwprolereader000000000001"),
              ("cwpuserother0000000000001", "cwp-other@example.com", other, "cwproleother0000000000001"),
          ]
          for user_id, email, user_org, role_id in users:
              sql(f"""
              INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
              SELECT '{user_id}', '{email}', passwordHash, 'Smoke', 'User', 1, NOW(3), NOW(3), NOW(3)
              FROM User WHERE id = '{admin}';
              INSERT INTO Membership (id, userId, orgId, roleId, isActive, createdAt)
              VALUES ('m{user_id[1:]}', '{user_id}', '{user_org}', '{role_id}', 1, NOW(3));
              """)
          # 组织 B 的工作流：跨组织绑定校验的对象。
          sql(f"""
          INSERT INTO CrawlStrategyWorkflow (id, orgId, name, description, draftDefinition, createdById, createdAt, updatedAt)
          VALUES ('cwpworkflowb00000000000001', '{other}', 'Org B Workflow', NULL, CAST('{{"settings":{{}},"nodes":[],"edges":[]}}' AS JSON), '{admin}', NOW(3), NOW(3));
          """)

          # ---- 阶段 1：开关还是 legacy，全部经 Go 代理，Nest 是唯一执行者 ----
          start_go("legacy")
          tokens = {email: login(email) for _, email, _, _ in users}
          writer = tokens["cwp-writer@example.com"]
          reader = tokens["cwp-reader@example.com"]
          outsider = tokens["cwp-other@example.com"]

          # 步骤 2：经 Go 代理创建画像；直接打 Nest 读同一 id；version 与快照。
          status, raw = call(go, profiles, "POST", writer, create_payload("Smoke Profile", "Smoke.Example.COM"))
          created = body(raw)
          if status != 201 or not created or not created.get("id"):
              fail(f"legacy proxy create {status} {raw[:300]!r}")
          pid = created["id"]
          if created.get("version") != 1 or created.get("matchHost") != "smoke.example.com":
              fail(f"create fields {created}")
          config = created.get("config") or {}
          if config.get("keywords") != ["alpha", "beta"] or config.get("hostScope") != "strict_hosts":
              fail(f"create config normalization {config}")
          if (config.get("seedDiscovery") or {}).get("maxSeedUrls") != 25:
              fail(f"create seedDiscovery {config.get('seedDiscovery')}")
          if (config.get("freshnessRules") or {}).get("weekHours") != 168:
              fail(f"create freshnessRules {config.get('freshnessRules')}")
          nest_read = body(call(nest, f"{profiles}/{pid}", "GET", writer)[1])
          go_read = body(call(go, f"{profiles}/{pid}", "GET", writer)[1])
          if core(nest_read) != core(go_read) or core(nest_read) != core(created):
              fail(f"legacy read mismatch nest={core(nest_read)} go={core(go_read)} created={core(created)}")
          if scalar(f"SELECT version FROM CrawlSiteProfile WHERE id='{pid}'") != "1":
              fail("profile version is not 1")
          if scalar(f"SELECT COUNT(*) FROM CrawlSiteProfileVersion WHERE profileId='{pid}' AND version=1") != "1":
              fail("version 1 snapshot missing")

          # 步骤 3：空白 name 的 PATCH → 400 name is required，名称不变。
          status, raw = call(go, f"{profiles}/{pid}", "PATCH", writer, {"name": "   "})
          if status != 400 or message(raw) != "name is required":
              fail(f"legacy blank name {status} {raw[:300]!r}")
          if scalar(f"SELECT name FROM CrawlSiteProfile WHERE id='{pid}'") != "Smoke Profile":
              fail("blank name changed the database name")

          # 步骤 4：只有 crawl.read 的用户 PATCH → 403。
          if call(go, f"{profiles}/{pid}", "PATCH", reader, {"name": "stolen"})[0] != 403:
              fail("reader patch was not 403")
          if call(go, profiles, "POST", reader, create_payload("Nope", "nope.example.com"))[0] != 403:
              fail("reader create was not 403")
          if call(go, f"{profiles}/{pid}", "GET", outsider)[0] != 404:
              fail("cross org read was not 404")

          # 步骤 5：另一组织的 id → 404 Crawl site profile not found。
          status, raw = call(go, f"{profiles}/{pid}", "GET", outsider)
          if status != 404 or message(raw) != "Crawl site profile not found":
              fail(f"legacy cross org {status} {raw[:300]!r}")
          status, raw = call(go, f"{profiles}/{pid}", "PATCH", outsider, {"name": "theirs"})
          if status != 404 or message(raw) != "Crawl site profile not found":
              fail(f"legacy cross org patch {status} {raw[:300]!r}")

          # 步骤 6：组织 A 的画像绑定组织 B 的工作流 → 400 Invalid workflowId，
          # 画像不落库；Nest 与 Go（代理）都看到同一句。
          cross_payload = create_payload("Cross Bind", "cross.example.com", {"workflowId": "cwpworkflowb00000000000001"})
          status, raw = call(go, profiles, "POST", writer, cross_payload)
          if status != 400 or message(raw) != "Invalid workflowId":
              fail(f"legacy go cross workflow {status} {raw[:300]!r}")
          status, raw = call(nest, profiles, "POST", writer, cross_payload)
          if status != 400 or message(raw) != "Invalid workflowId":
              fail(f"legacy nest cross workflow {status} {raw[:300]!r}")
          if scalar(f"SELECT COUNT(*) FROM CrawlSiteProfile WHERE orgId='{org}' AND name='Cross Bind'") != "0":
              fail("cross workflow profile was persisted")
          print("legacy proxy ok")

          # ---- 阶段 2：开关 go（Nest 仍在运行）----
          start_go("go")

          # 列表与详情契约对照。
          status, listed = same(profiles, "GET", writer)
          if status != 200 or not isinstance(listed, list) or not any(item.get("id") == pid for item in listed):
              fail(f"list {status} {listed}")
          status, detail = same(f"{profiles}/{pid}", "GET", writer)
          if status != 200 or detail.get("name") != "Smoke Profile":
              fail(f"detail {status} {detail}")

          # 空白 name 与权限、跨组织在 go 侧重验。
          status, raw = call(go, f"{profiles}/{pid}", "PATCH", writer, {"name": "   "})
          if status != 400 or message(raw) != "name is required":
              fail(f"go blank name {status} {raw[:300]!r}")
          if scalar(f"SELECT name FROM CrawlSiteProfile WHERE id='{pid}'") != "Smoke Profile":
              fail("go blank name changed the database name")
          if call(go, f"{profiles}/{pid}", "PATCH", reader, {"name": "stolen"})[0] != 403:
              fail("go reader patch was not 403")
          if call(go, profiles, "GET", None)[0] != 401 or call(go, profiles, "GET", "not-a-jwt")[0] != 401:
              fail("missing/bad token was not 401")
          status, raw = call(go, f"{profiles}/{pid}", "GET", outsider)
          if status != 404 or message(raw) != "Crawl site profile not found":
              fail(f"go cross org {status} {raw[:300]!r}")

          # 跨组织工作流绑定：Nest 与 Go 同一句 400。
          status, _ = same(profiles, "POST", writer, cross_payload)
          if status != 400:
              fail(f"go cross workflow {status}")
          if scalar(f"SELECT COUNT(*) FROM CrawlSiteProfile WHERE orgId='{org}' AND name='Cross Bind'") != "0":
              fail("cross workflow profile was persisted after go")

          # 重复名称唯一冲突：先对一次 Nest，再让 Go 对齐（生产 500 形状）。
          dup_payload = create_payload("Smoke Profile", "dup.example.com")
          status, _ = same(profiles, "POST", writer, dup_payload)
          if status != 500:
              fail(f"duplicate name conflict {status}")
          if scalar(f"SELECT COUNT(*) FROM CrawlSiteProfile WHERE orgId='{org}' AND name='Smoke Profile'") != "1":
              fail("duplicate create persisted a second row")

          # 步骤 7：match 只返回本组织画像；另一组织的同 host 画像不出现。
          status, matched = same(f"{profiles}/match?url=https://match.example.com/page", "GET", writer)
          if status != 200 or matched.get("host") != "match.example.com":
              fail(f"match {status} {matched}")
          if (matched.get("match") or {}).get("orgId") != org:
              fail(f"match org {matched.get('match')}")
          candidate_ids = [item.get("id") for item in matched.get("candidates") or []]
          if "cwpprofileb00000000000001" in candidate_ids:
              fail(f"match leaked other org profile {candidate_ids}")
          if "cwpprofilea00000000000001" not in candidate_ids:
              fail(f"match missing org profile {candidate_ids}")
          status, miss = same(f"{profiles}/match?url=https://nowhere.example.org/x", "GET", writer)
          if status != 200 or miss.get("match") is not None:
              fail(f"match miss {status} {miss}")

          # 步骤 8：preview 不落库；draft.id 是 draft；201。
          before_rows = scalar(f"SELECT COUNT(*) FROM CrawlSiteProfile WHERE orgId='{org}'")
          status, preview = same(f"{profiles}/preview", "POST", writer,
                                 {"url": "https://draft.example.com/x", "matchHost": " Draft.Example.COM ", "config": smoke_config()})
          if status != 201:
              fail(f"preview {status} {preview}")
          if (preview.get("draft") or {}).get("id") != "draft" or preview.get("draft", {}).get("version") != 0:
              fail(f"preview draft {preview.get('draft')}")
          if preview.get("draft", {}).get("matchHost") != "draft.example.com":
              fail(f"preview matchHost {preview.get('draft')}")
          if preview.get("draft", {}).get("createdAt") != "1970-01-01T00:00:00.000Z":
              fail(f"preview epoch {preview.get('draft')}")
          after_rows = scalar(f"SELECT COUNT(*) FROM CrawlSiteProfile WHERE orgId='{org}'")
          if before_rows != after_rows:
              fail("preview wrote rows")

          # 步骤 9：并发两次 PATCH 同一画像，两次都成功、version 连续、快照齐全。
          version_before = int(scalar(f"SELECT version FROM CrawlSiteProfile WHERE id='{pid}'"))
          results = {}

          def patch(tag, description):
              try:
                  results[tag] = call(go, f"{profiles}/{pid}", "PATCH", writer, {"description": description})
              except Exception as exc:  # noqa: BLE001
                  results[tag] = (0, repr(exc).encode())

          threads = [threading.Thread(target=patch, args=("a", "concurrent-a")), threading.Thread(target=patch, args=("b", "concurrent-b"))]
          for thread in threads:
              thread.start()
          for thread in threads:
              thread.join()
          for tag in ("a", "b"):
              if results[tag][0] != 200:
                  fail(f"concurrent patch {tag} {results[tag][0]} {results[tag][1][:300]!r}")
          versions = sorted(body(results[tag][1])["version"] for tag in ("a", "b"))
          if versions != [version_before + 1, version_before + 2]:
              fail(f"concurrent patch versions {versions} (before {version_before})")
          for version in versions:
              if scalar(f"SELECT COUNT(*) FROM CrawlSiteProfileVersion WHERE profileId='{pid}' AND version={version}") != "1":
                  fail(f"missing snapshot for version {version}")

          # 步骤 10：回滚版本 1：201；内容与版本 1 一致；version 比回滚前大 1；多一条快照。
          version_before_rollback = int(scalar(f"SELECT version FROM CrawlSiteProfile WHERE id='{pid}'"))
          snapshots_before = int(scalar(f"SELECT COUNT(*) FROM CrawlSiteProfileVersion WHERE profileId='{pid}'"))
          status, raw = call(go, f"{profiles}/{pid}/rollback/1", "POST", writer)
          rolled = body(raw)
          if status != 201 or not rolled:
              fail(f"rollback {status} {raw[:300]!r}")
          if rolled.get("version") != version_before_rollback + 1:
              fail(f"rollback version {rolled.get('version')} (before {version_before_rollback})")
          version_one = next((item for item in body(call(go, f"{profiles}/{pid}/versions", "GET", writer)[1]) if item.get("version") == 1), None)
          if not version_one:
              fail("version 1 snapshot not found")
          for key in ("name", "description", "matchHost", "isActive", "executionMode", "workflowId", "workflowVersionId", "workflowBindingMode", "config"):
              if core(rolled.get(key)) != core(version_one.get(key)):
                  fail(f"rollback mismatch {key}: {rolled.get(key)} != {version_one.get(key)}")
          if int(scalar(f"SELECT COUNT(*) FROM CrawlSiteProfileVersion WHERE profileId='{pid}'")) != snapshots_before + 1:
              fail("rollback did not add a snapshot")
          if redis_jobs() != baseline_jobs:
              fail("smoke enqueued crawl4ai jobs")
          print("go switch ok")

          # ---- 阶段 3：停止 Nest，Go 仍可创建与列表；runs 未迁 → 502 ----
          if os.path.exists("/tmp/api-nestjs.pid"):
              os.kill(int(open("/tmp/api-nestjs.pid").read().strip()), signal.SIGTERM)
          subprocess.run(["pkill", "-f", "apps/api/dist/main.js"], check=False)
          subprocess.run(["pkill", "-f", "node dist/main.js"], check=False)
          stopped = False
          for _ in range(30):
              try:
                  urllib.request.urlopen(nest + "/api/healthz/live", timeout=2).read()
              except Exception:
                  stopped = True
                  break
              time.sleep(1)
          if not stopped:
              fail("nestjs did not stop")

          alive = writer
          status, raw = call(go, profiles, "POST", alive, create_payload("After Nest", "after.example.com"))
          after_create = body(raw)
          if status != 201 or not after_create or not after_create.get("id"):
              fail(f"create after nest stop {status} {raw[:300]!r}")
          status, raw = call(go, profiles, "GET", alive)
          if status != 200 or not isinstance(body(raw), list):
              fail(f"list after nest stop {status} {raw[:300]!r}")
          status, raw = call(go, f"{base}/runs", "POST", alive, {"seedUrl": "https://example.com/"})
          if status != 502 or (body(raw) or {}).get("statusCode") != 502:
              fail(f"runs after nest stop {status} {raw[:300]!r}")
          print("nest stopped; crawl profiles still succeed; runs stays on Nest")
          PY
