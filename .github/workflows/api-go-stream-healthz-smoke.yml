          except urllib.error.HTTPError as exc:
              raise SystemExit(f"legacy stream failed {exc.code} {exc.read()[:200]}")
          after = json.load(urllib.request.urlopen("http://127.0.0.1:4020/__go/healthz", timeout=10))["dashboardStream"]["cycles"]
