            -e DASHBOARD_STREAM_PING_MS=5000 \
            -e REALTIME_SIGNALS_ENABLED=false \
            -e CRAWL4AI_BASE_URL=http://host.docker.internal:11235 \
            -e JWT_SECRET="$JWT_SECRET" -e JWT_ISSUER="$JWT_ISSUER" -e JWT_AUDIENCE="$JWT_AUDIENCE" \
            -e REDIS_HOST=host.docker.internal -e REDIS_PORT=6379 -e CANARY_PERCENT=0 \
            -e CORS_ORIGIN="$CORS_ORIGIN" \
            api-go-stream:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api-go-stream 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "unhealthy" ]; then docker logs api-go-stream; exit 1; fi
            sleep 2
          done
          if [ -f /tmp/api-nestjs.pid ]; then kill "$(cat /tmp/api-nestjs.pid)" || true; fi
          pkill -f "apps/api/dist/main.js" || true
          pkill -f "node dist/main.js" || true
          for i in $(seq 1 30); do
            if ! curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs stopped"
              break
            fi
            sleep 1
          done
          if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
            echo "nestjs still up"; exit 1
          fi
          python3 - << 'PY'
          import http.client, json, socket, time, urllib.request, urllib.error
          token = open("/tmp/smoke-jwt").read().strip()
          query = "/api/dashboard/stream?start=2026-03-01T00:00:00.000Z&end=2026-03-15T00:00:00.000Z"
          conn = http.client.HTTPConnection("127.0.0.1", 4020, timeout=30)
          conn.request("GET", query, headers={"Authorization": "Bearer " + token, "Accept": "text/event-stream"})
          resp = conn.getresponse()

          def read_one_chunk(response):
              piece = response.read(1)
              if not piece:
                  return b""
              left = getattr(response, "chunk_left", None) or 0
              if left:
                  piece += response.read(left)
              return piece

          buf = b""
          events = []
          try:
              while True:
                  chunk = read_one_chunk(resp)
                  if not chunk:
                      break
                  buf += chunk
                  while b"\n\n" in buf:
                      frame, buf = buf.split(b"\n\n", 1)
                      event, data = "", ""
                      for line in frame.split(b"\n"):
                          if line.startswith(b"event:"):
                              event = line[6:].decode().strip()
                          elif line.startswith(b"data:"):
                              data += line[5:].decode().strip()
                      if event:
                          events.append((event, data))
                  names = [name for name, _ in events]
                  candle = next((data for name, data in events if name == "financial-candlestick"), "")
                  if all(name in names for name in ("war-map-events", "war-map-news-markers", "war-map-layers", "financial-candlestick")) and "4242" in candle:
                      break
          except (socket.timeout, OSError) as exc:
              print("stream without nest stopped", exc)
          conn.close()
          names = [name for name, _ in events]
          print("without nest", names)
          for name in ("war-map-events", "war-map-news-markers", "war-map-layers", "financial-candlestick"):
              if name not in names:
                  raise SystemExit("missing " + name)
          candle = next(data for name, data in events if name == "financial-candlestick")
          if "4242" not in candle:
              raise SystemExit("candle payload lost after nest shutdown " + candle[:300])
          time.sleep(2)
          mid = json.load(urllib.request.urlopen("http://127.0.0.1:4020/__go/healthz", timeout=10))["dashboardStream"]
          time.sleep(3)
          after = json.load(urllib.request.urlopen("http://127.0.0.1:4020/__go/healthz", timeout=10))["dashboardStream"]
          if after["active"] != 0 or mid["cycles"] != after["cycles"]:
              raise SystemExit(f"still querying after close {mid} {after}")
          req = urllib.request.Request("http://127.0.0.1:4020/api/healthz", headers={"authorization": "Bearer " + token})
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  status, raw = resp.status, resp.read()
          except urllib.error.HTTPError as exc:
              status, raw = exc.code, exc.read()
          doc = json.loads(raw)
          if status not in (200, 503) or "details" not in doc or doc["details"]["mysql"]["status"] != "up":
              raise SystemExit(f"health without nest {status} {raw[:400]}")
          print("go survived nest shutdown")
          PY
