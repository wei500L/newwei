# 态势监控自定义监控五条 HTTP 的真实栈验收。不进普通 CI。
# PR 上加 label api-go-situation-monitors-smoke，或 workflow_dispatch。
# MODEL_SERVICE_ENABLED 保持 false。不把 Nominatim、模型、crawl4ai 或 AkShare 当实网通过。
name: api-go-situation-monitors-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-situation-monitors-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-smoke@example.com
  SMTP_PASS: api-go-smoke-smtp-not-connected
  JWT_SECRET: c1f4a9e8d2b3706f5a1c8e9d4b2a7f6038e5d1c9a7b6f4e2d3c8a1b5f9e0d7c2
  NEXTAUTH_SECRET: e2b5c1f8a9d3b47e60d4a1f8c3b5e79d02c1f4a9e8d2b3706f5a1c8e9d4b2a7f6
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  SEED_ORG_SLUG: api-go-smoke-org
  SEED_ORG_NAME: api-go Smoke Org
  SEED_ADMIN_EMAIL: api-go-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: ApiGoSmoke#2026-Ci
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-situation-monitors-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-situation-monitors-smoke')
    runs-on: [self-hosted, linux, build-server]
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-situation:ci .
      - name: Exercise situation monitor routes
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os, subprocess, time, urllib.error, urllib.request
          from concurrent.futures import ThreadPoolExecutor

          nest = "http://127.0.0.1:4000"
          go = "http://127.0.0.1:4020"

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def sql(statement):
              cid = subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=mysql:8.4"], text=True).split()[0]
              proc = subprocess.run(["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "app"], input=statement, text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(proc.stderr or proc.stdout)
              return proc.stdout.strip()

          def scalar(statement):
              return sql(statement).splitlines()[-1].strip()

          def start_go(mode):
              subprocess.run(["docker", "rm", "-f", "api-go-situation"], check=False, capture_output=True)
              env = [
                  "PORT=4020",
                  "LEGACY_API_URL=http://host.docker.internal:4000",
                  "DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app",
                  "MONGO_URI=mongodb://host.docker.internal:27017/app",
                  f"API_GO_SITUATION_MONITORS_MODE={mode}",
                  "API_GO_CONTENT_SUBSCRIPTIONS_MODE=legacy",
                  "API_GO_USER_NEWS_BEHAVIOR_MODE=legacy",
                  "API_GO_USER_DIGEST_MODE=legacy",
                  "API_GO_DASHBOARD_STATS_MODE=legacy",
                  "API_GO_DASHBOARD_CHARTS_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_GEO_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE=legacy",
                  "API_GO_DASHBOARD_STREAM_MODE=legacy",
                  "API_GO_HEALTHZ_MODE=legacy",
                  "API_GO_PUBLIC_PORTAL_MODE=legacy",
                  "API_GO_ANALYSIS_VIEWS_MODE=legacy",
                  "API_GO_ANALYSIS_BOARDS_MODE=legacy",
                  "API_GO_ANALYSIS_THREADS_MODE=legacy",
                  "API_GO_GRAPHQL_READ_MODE=legacy",
                  "API_GO_USER_SETTINGS_WRITE_MODE=legacy",
                  "REALTIME_SIGNALS_ENABLED=false",
                  "ELASTICSEARCH_ENABLED=false",
                  "MODEL_SERVICE_ENABLED=false",
                  f"JWT_SECRET={os.environ['JWT_SECRET']}",
                  f"JWT_ISSUER={os.environ['JWT_ISSUER']}",
                  f"JWT_AUDIENCE={os.environ['JWT_AUDIENCE']}",
                  "REDIS_HOST=host.docker.internal",
                  "REDIS_PORT=6379",
                  "CANARY_PERCENT=0",
                  f"CORS_ORIGIN={os.environ['CORS_ORIGIN']}",
              ]
              cmd = ["docker", "run", "-d", "--name", "api-go-situation",
                     "--add-host=host.docker.internal:host-gateway",
                     "--health-interval", "5s", "--health-timeout", "3s", "--health-retries", "20", "--health-start-period", "5s",
                     "-p", "127.0.0.1:4020:4020"]
              for item in env:
                  cmd.extend(["-e", item])
              cmd.append("api-go-situation:ci")
              subprocess.check_call(cmd)
              for _ in range(30):
                  status = subprocess.check_output(["docker", "inspect", "--format", "{{.State.Health.Status}}", "api-go-situation"], text=True).strip()
                  print("health", status, "mode", mode)
                  if status == "healthy":
                      return
                  if status == "unhealthy":
                      fail(subprocess.check_output(["docker", "logs", "api-go-situation"], text=True)[-4000:])
                  time.sleep(2)
              fail(subprocess.check_output(["docker", "logs", "api-go-situation"], text=True)[-4000:])

          def call(base, path, method="GET", token=None, payload=None):
              headers = {}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          def body(raw):
              if not raw:
                  return None
              return json.loads(raw)

          def core(value):
              if isinstance(value, dict):
                  return {key: core(item) for key, item in value.items() if key not in ("traceId", "timestamp")}
              if isinstance(value, list):
                  return [core(item) for item in value]
              return value

          def login(email):
              status, raw = call(nest, "/api/auth/login", "POST", payload={"email": email, "password": os.environ["SEED_ADMIN_PASSWORD"]})
              doc = body(raw)
              if status not in (200, 201) or not doc or not doc.get("accessToken"):
                  fail(f"login {email} {status} {raw[:300]!r}")
              return doc["accessToken"]

          def message(raw):
              doc = body(raw) or {}
              return doc.get("message")

          org = scalar("SELECT id FROM Org WHERE slug='api-go-smoke-org'")
          admin = scalar("SELECT id FROM User WHERE email='api-go-smoke-admin@example.com'")
          role = scalar(f"SELECT roleId FROM Membership WHERE userId='{admin}' AND orgId='{org}'")
          sql(f"""
          INSERT INTO Role (id, name, isSystem, orgId)
          VALUES ('csmknoreadrole000000000001', 'sm-no-read', 0, '{org}');
          INSERT INTO Org (id, name, slug, isActive, createdAt, updatedAt)
          VALUES ('csmkorgother0000000000001', 'SM Other', 'sm-other-org', 1, NOW(3), NOW(3));
          INSERT INTO Role (id, name, isSystem, orgId)
          VALUES ('csmkotherrole000000000001', 'sm-other-admin', 0, 'csmkorgother0000000000001');
          INSERT INTO RolePermission (id, roleId, permissionId)
          SELECT 'csmkotherperm000000000001', 'csmkotherrole000000000001', id
          FROM Permission WHERE name = 'items.read';
          """)
          users = [
              ("csmkuserparity00000000001", "sm-parity@example.com", org, role),
              ("csmkuserlimitn0000000001", "sm-limit-nest@example.com", org, role),
              ("csmkuserlimitg0000000001", "sm-limit-go@example.com", org, role),
              ("csmkuseremptyn0000000001", "sm-empty-nest@example.com", org, role),
              ("csmkuseremptyg0000000001", "sm-empty-go@example.com", org, role),
              ("csmkuserlegacyn000000001", "sm-legacy-nest@example.com", org, role),
              ("csmkuserlegacyg000000001", "sm-legacy-go@example.com", org, role),
              ("csmkusernoread0000000001", "sm-noread@example.com", org, "csmknoreadrole000000000001"),
              ("csmkuserother000000000001", "sm-other@example.com", "csmkorgother0000000000001", "csmkotherrole000000000001"),
              ("csmkuseralive000000000001", "sm-alive@example.com", org, role),
          ]
          for user_id, email, user_org, user_role in users:
              membership_org = user_org
              sql(f"""
              INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
              SELECT '{user_id}', '{email}', passwordHash, 'Smoke', 'User', 1, NOW(3), NOW(3), NOW(3)
              FROM User WHERE id = '{admin}';
              INSERT INTO Membership (id, userId, orgId, roleId, isActive, createdAt)
              VALUES ('m{user_id[1:]}', '{user_id}', '{membership_org}', '{user_role}', 1, NOW(3));
              """)
          legacy_json = json.dumps([
              {"name": "Legacy One", "keywords": ["alpha"], "enabled": True},
              {"name": "Legacy Two", "keywords": ["gamma"], "enabled": True},
          ], separators=(",", ":"))
          for user_id, setting_id in (
              ("csmkuserlegacyn000000001", "csmksetlegacyn0000000001"),
              ("csmkuserlegacyg000000001", "csmksetlegacyg0000000001"),
          ):
              sql(
                  "INSERT INTO UserSetting (id, orgId, userId, `key`, value, createdAt, updatedAt) VALUES "
                  f"('{setting_id}', '{org}', '{user_id}', 'ui:situation-monitor:monitors:v1', CAST('{legacy_json}' AS JSON), NOW(3), NOW(3));"
              )
          def insert_manuals(user_id, prefix):
              rows = []
              for n in range(1, 20):
                  rows.append(
                      "('{prefix}{n:02d}','{org}','{user}','manual','Manual {n}',1,"
                      "CAST('[\"k\"]' AS JSON),CAST('[]' AS JSON),CAST('[]' AS JSON),CAST('[\"k\"]' AS JSON),NOW(3),NOW(3))".format(
                          prefix=prefix, n=n, org=org, user=user_id
                      )
                  )
              sql(
                  "INSERT INTO SituationMonitorMonitor "
                  "(id, orgId, userId, kind, name, enabled, rawKeywords, approvedTopics, approvedEntities, approvedLexicalTerms, createdAt, updatedAt) VALUES "
                  + ",".join(rows) + ";"
              )
          insert_manuals("csmkuserlimitn0000000001", "csmklimn")
          insert_manuals("csmkuserlimitg0000000001", "csmklimg")
          sql(f"""
          INSERT INTO SituationMonitorMonitor
            (id, orgId, userId, kind, name, enabled, rawKeywords, approvedTopics, approvedEntities, approvedLexicalTerms, createdAt, updatedAt)
          VALUES ('csmkothermon000000000001', 'csmkorgother0000000000001', 'csmkuserother000000000001', 'manual', 'other-org-monitor', 1,
                  CAST('[\"secret\"]' AS JSON), CAST('[]' AS JSON), CAST('[]' AS JSON), CAST('[\"secret\"]' AS JSON), NOW(3), NOW(3));
          """)

          start_go("legacy")
          tokens = {email: login(email) for _, email, _, _ in users}
          open("/tmp/smoke-jwt-alive", "w").write(tokens["sm-alive@example.com"])

          def same(path, method="GET", token=None, payload=None):
              left_status, left_raw = call(nest, path, method, token, payload)
              right_status, right_raw = call(go, path, method, token, payload)
              if left_status != right_status or core(body(left_raw)) != core(body(right_raw)):
                  fail(f"parity {method} {path} nest={left_status} {left_raw[:400]!r} go={right_status} {right_raw[:400]!r}")
              return left_status, body(left_raw)

          parity = tokens["sm-parity@example.com"]
          status, listed = same("/api/situation-monitor/monitors", "GET", parity)
          if status != 200 or not any(item.get("kind") == "system_sync" and item.get("name") == "Subscription Sync" for item in listed):
              fail(f"legacy list {status} {listed}")
          preview_body = {"name": "Preview", "rawKeywords": ["keyword"], "location": {"name": "Custom Place", "lat": 55.75, "lng": 37.61}}
          status, preview = same("/api/situation-monitor/monitors/preview", "POST", parity, preview_body)
          if status != 201 or not preview or preview.get("locationResolution", {}).get("lat") != 55.75 or preview.get("locationResolution", {}).get("lng") != 37.61:
              fail(f"legacy preview {status} {preview}")
          if "kind" in preview:
              fail("preview was handled as create")
          create_body = {"name": "Created", "rawKeywords": ["created"], "location": {"name": "Custom Place", "lat": 55.75, "lng": 37.61}}
          nest_status, nest_raw = call(nest, "/api/situation-monitor/monitors", "POST", parity, create_body)
          go_status, go_raw = call(go, "/api/situation-monitor/monitors", "POST", parity, dict(create_body, name="Created Proxy", rawKeywords=["created-proxy"]))
          nest_doc, go_doc = body(nest_raw), body(go_raw)
          if nest_status != 201 or go_status != 201:
              fail(f"legacy create {nest_status} {nest_raw[:300]!r} {go_status} {go_raw[:300]!r}")
          def shape(doc):
              return {key: doc.get(key) for key in ("kind", "enabled", "name") if doc}
          if nest_doc.get("location", {}).get("lat") != 55.75 or go_doc.get("location", {}).get("lng") != 37.61:
              fail(f"legacy create location {nest_doc} {go_doc}")
          if nest_doc.get("queryEmbeddingVector") or go_doc.get("queryEmbeddingVector"):
              fail("legacy create returned an embedding vector while the model is disabled")
          sync = next(item for item in body(call(nest, "/api/situation-monitor/monitors", "GET", parity)[1]) if item["kind"] == "system_sync")
          status, err_doc = same(f"/api/situation-monitor/monitors/{sync['id']}", "PATCH", parity, {"name": "nope"})
          if status != 400 or message(json.dumps(err_doc).encode()) != "System sync monitor is read only":
              fail(f"readonly {status} {err_doc}")
          status, err_doc = same(f"/api/situation-monitor/monitors/{sync['id']}", "DELETE", parity)
          if status != 400 or (err_doc or {}).get("message") != "System sync monitor cannot be deleted":
              fail(f"delete sync {status} {err_doc}")
          status, missing = same("/api/situation-monitor/monitors/missing-monitor-id", "PATCH", parity, {"name": "x", "rawKeywords": ["x"]})
          if status != 404 or (missing or {}).get("message") != "Monitor not found":
              fail(f"missing update {status} {missing}")
          status, removed = same("/api/situation-monitor/monitors/missing-monitor-id", "DELETE", parity)
          if status != 200 or removed != {"ok": True}:
              fail(f"missing delete {status} {removed}")
          print("legacy parity ok")

          def limit_race(base, token, user_id):
              def once(name):
                  return call(base, "/api/situation-monitor/monitors", "POST", token, {"name": name, "rawKeywords": [name]})
              with ThreadPoolExecutor(max_workers=2) as pool:
                  results = list(pool.map(once, ["Cap A", "Cap B"]))
              statuses = sorted(item[0] for item in results)
              if statuses != [201, 400]:
                  fail(f"cap statuses {results}")
              if message(results[0][1] if results[0][0] == 400 else results[1][1]) != "Manual monitor limit reached":
                  fail(f"cap message {results}")
              count = int(scalar(f"SELECT COUNT(*) FROM SituationMonitorMonitor WHERE orgId='{org}' AND userId='{user_id}' AND kind='manual'"))
              if count != 20:
                  fail(f"manual count {count} for {user_id}")

          def get_race(base, token, user_id, expect_manual):
              def once(_):
                  return call(base, "/api/situation-monitor/monitors", "GET", token)
              with ThreadPoolExecutor(max_workers=2) as pool:
                  results = list(pool.map(once, [1, 2]))
              if any(item[0] != 200 for item in results):
                  fail(f"get race {results}")
              manual = int(scalar(f"SELECT COUNT(*) FROM SituationMonitorMonitor WHERE orgId='{org}' AND userId='{user_id}' AND kind='manual'"))
              sync_count = int(scalar(f"SELECT COUNT(*) FROM SituationMonitorMonitor WHERE orgId='{org}' AND userId='{user_id}' AND kind='system_sync' AND name='Subscription Sync'"))
              if manual != expect_manual or sync_count != 1:
                  fail(f"migration user {user_id} manual={manual} sync={sync_count}")

          limit_race(nest, tokens["sm-limit-nest@example.com"], "csmkuserlimitn0000000001")
          get_race(nest, tokens["sm-empty-nest@example.com"], "csmkuseremptyn0000000001", 0)
          get_race(nest, tokens["sm-legacy-nest@example.com"], "csmkuserlegacyn000000001", 2)
          print("nest races ok")

          start_go("go")
          noread = call(go, "/api/situation-monitor/monitors", "GET", tokens["sm-noread@example.com"])
          if noread[0] != 403:
              fail(f"noread {noread}")
          tampered = tokens["sm-parity@example.com"][:-1] + ("a" if tokens["sm-parity@example.com"][-1] != "a" else "b")
          if call(go, "/api/situation-monitor/monitors", "GET", tampered)[0] != 401:
              fail("tampered signature was accepted")
          if call(go, "/api/situation-monitor/monitors", "GET", "mtk_not-a-real-token")[0] != 401:
              fail("machine token was accepted")
          other = call(go, "/api/situation-monitor/monitors", "GET", parity)
          if other[0] != 200 or "other-org-monitor" in other[1].decode():
              fail(f"cross org list {other[0]} {other[1][:300]!r}")
          if call(go, "/api/situation-monitor/monitors/csmkothermon000000000001", "PATCH", parity, {"name": "stolen", "rawKeywords": ["stolen"]})[0] != 404:
              fail("cross org update was not 404")
          deleted = call(go, "/api/situation-monitor/monitors/csmkothermon000000000001", "DELETE", parity)
          if deleted[0] != 200 or body(deleted[1]) != {"ok": True}:
              fail(f"cross org delete {deleted}")
          if scalar("SELECT COUNT(*) FROM SituationMonitorMonitor WHERE id='csmkothermon000000000001'") != "1":
              fail("cross org delete removed the row")
          limit_race(go, tokens["sm-limit-go@example.com"], "csmkuserlimitg0000000001")
          get_race(go, tokens["sm-empty-go@example.com"], "csmkuseremptyg0000000001", 0)
          get_race(go, tokens["sm-legacy-go@example.com"], "csmkuserlegacyg000000001", 2)
          placed = call(go, "/api/situation-monitor/monitors", "POST", tokens["sm-alive@example.com"], {
              "name": "Placed", "rawKeywords": ["placed"],
              "location": {"name": "Custom Place", "lat": 55.75, "lng": 37.61},
          })
          placed_doc = body(placed[1])
          if placed[0] != 201 or not placed_doc or placed_doc.get("location", {}).get("lat") != 55.75 or placed_doc.get("location", {}).get("lng") != 37.61:
              fail(f"go create location {placed}")
          if placed_doc.get("queryEmbeddingVector"):
              fail("go create returned an embedding vector while the model is disabled")
          preview = call(go, "/api/situation-monitor/monitors/preview", "POST", tokens["sm-alive@example.com"], preview_body)
          preview_doc = body(preview[1])
          if preview[0] != 201 or preview_doc.get("locationResolution", {}).get("lat") != 55.75 or "kind" in preview_doc:
              fail(f"go preview {preview}")
          print("go switch ok")

          if os.path.exists("/tmp/api-nestjs.pid"):
              os.kill(int(open("/tmp/api-nestjs.pid").read().strip()), 15)
          subprocess.run(["pkill", "-f", "apps/api/dist/main.js"], check=False)
          subprocess.run(["pkill", "-f", "node dist/main.js"], check=False)
          stopped = False
          for _ in range(30):
              try:
                  urllib.request.urlopen(nest + "/api/healthz/live", timeout=2).read()
              except Exception:
                  stopped = True
                  break
              time.sleep(1)
          if not stopped:
              fail("nestjs did not stop")
          alive = tokens["sm-alive@example.com"]
          checks = [
              ("GET", "/api/situation-monitor/monitors", None, 200),
              ("POST", "/api/situation-monitor/monitors/preview", preview_body, 201),
              ("POST", "/api/situation-monitor/monitors", {"name": "After Nest", "rawKeywords": ["after"], "location": {"name": "Custom Place", "lat": 12.5, "lng": 44.25}}, 201),
          ]
          created_id = None
          for method, path, payload, expect in checks:
              status, raw = call(go, path, method, alive, payload)
              if status != expect:
                  fail(f"after nest stop {method} {path} {status} {raw[:300]!r}")
              if method == "POST" and path.endswith("/monitors"):
                  created_id = body(raw).get("id")
                  if body(raw).get("location", {}).get("lat") != 12.5:
                      fail(f"coords lost after nest stop {raw[:300]!r}")
          if not created_id:
              fail("create after nest stop returned no id")
          patched = call(go, f"/api/situation-monitor/monitors/{created_id}", "PATCH", alive, {"name": "Renamed"})
          if patched[0] != 200 or body(patched[1]).get("name") != "Renamed":
              fail(f"patch after nest stop {patched}")
          removed = call(go, f"/api/situation-monitor/monitors/{created_id}", "DELETE", alive)
          if removed[0] != 200 or body(removed[1]) != {"ok": True}:
              fail(f"delete after nest stop {removed}")
          insights = call(go, "/api/situation-monitor/insights", "GET", alive)
          refresh = call(go, "/api/situation-monitor/refresh", "POST", alive, {})
          if insights[0] != 502 or refresh[0] != 502:
              fail(f"unmigrated after nest stop insights={insights[0]} refresh={refresh[0]}")
          print("nest stopped; go monitors still succeed")
          PY
