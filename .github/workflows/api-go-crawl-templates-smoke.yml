# 采集模板编辑接口的真实栈验收。不进普通 CI。
# PR 上加 label api-go-crawl-templates-smoke，或 workflow_dispatch。
# SCHEDULE_ENABLED 保持 false。不请求 crawl4ai；不把抓取、模型、
# AkShare 或 Nominatim 当通过。
name: api-go-crawl-templates-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-crawl-templates-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-crawl-templates-smoke@example.com
  SMTP_PASS: api-go-crawl-templates-smoke-smtp-not-connected
  JWT_SECRET: c1f4a9e8d2b3706f5a1c8e9d4b2a7f6038e5d1c9a7b6f4e2d3c8a1b5f9e0d7c2
  NEXTAUTH_SECRET: e2b5c1f8a9d3b47e60d4a1f8c3b5e79d02c1f4a9e8d2b3706f5a1c8e9d4b2a7f6
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  SEED_ORG_SLUG: api-go-crawl-templates-smoke-org
  SEED_ORG_NAME: api-go Crawl Templates Smoke Org
  SEED_ADMIN_EMAIL: api-go-crawl-templates-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: ApiGoCrawlTpl#2026-Ci
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-crawl-templates-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-crawl-templates-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-crawl-tpl:ci .
      - name: Exercise crawl template routes
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os, signal, subprocess, time, urllib.error, urllib.request

          nest = "http://127.0.0.1:4000"
          go = "http://127.0.0.1:4020"
          org = "cwtorgsmoke00000000000001"
          other = "cwtorgother00000000000001"

          templates = "/api/admin/crawl-templates"

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def sql(statement):
              cid = subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=mysql:8.4"], text=True).split()[0]
              proc = subprocess.run(["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "app"], input=statement, text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(proc.stderr or proc.stdout)
              return proc.stdout.strip()

          def scalar(statement):
              lines = [line.strip() for line in sql(statement).splitlines() if line.strip()]
              return lines[-1] if lines else ""

          def redis_jobs():
              cid = subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=redis:7.2"], text=True).split()[0]
              proc = subprocess.run(["docker", "exec", cid, "redis-cli", "--scan", "--pattern", "bull:crawl4ai*"], text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(proc.stderr or proc.stdout)
              return len([line for line in proc.stdout.splitlines() if line.strip()])

          def start_go(templates_mode):
              subprocess.run(["docker", "rm", "-f", "api-go-crawl-tpl"], check=False, capture_output=True)
              env = [
                  "PORT=4020",
                  "LEGACY_API_URL=http://host.docker.internal:4000",
                  "DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app",
                  "MONGO_URI=mongodb://host.docker.internal:27017/app",
                  f"API_GO_CRAWL_TEMPLATES_MODE={templates_mode}",
                  "API_GO_CRAWL_PROFILES_MODE=legacy",
                  "API_GO_CRAWL_WORKFLOWS_MODE=legacy",
                  "API_GO_NEWS_SOURCES_MODE=legacy",
                  "API_GO_SITUATION_MONITORS_MODE=legacy",
                  "API_GO_CONTENT_SUBSCRIPTIONS_MODE=legacy",
                  "API_GO_USER_NEWS_BEHAVIOR_MODE=legacy",
                  "API_GO_USER_DIGEST_MODE=legacy",
                  "API_GO_DASHBOARD_STATS_MODE=legacy",
                  "API_GO_DASHBOARD_CHARTS_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_GEO_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE=legacy",
                  "API_GO_DASHBOARD_STREAM_MODE=legacy",
                  "API_GO_HEALTHZ_MODE=legacy",
                  "API_GO_PUBLIC_PORTAL_MODE=legacy",
                  "API_GO_ANALYSIS_VIEWS_MODE=legacy",
                  "API_GO_ANALYSIS_BOARDS_MODE=legacy",
                  "API_GO_ANALYSIS_THREADS_MODE=legacy",
                  "API_GO_GRAPHQL_READ_MODE=legacy",
                  "API_GO_GRAPHQL_NEWS_EVENTS_MODE=legacy",
                  "API_GO_USER_SETTINGS_WRITE_MODE=legacy",
                  "REALTIME_SIGNALS_ENABLED=false",
                  "ELASTICSEARCH_ENABLED=false",
                  "MODEL_SERVICE_ENABLED=false",
                  "SCHEDULE_ENABLED=false",
                  f"JWT_SECRET={os.environ['JWT_SECRET']}",
                  f"JWT_ISSUER={os.environ['JWT_ISSUER']}",
                  f"JWT_AUDIENCE={os.environ['JWT_AUDIENCE']}",
                  "REDIS_HOST=host.docker.internal",
                  "REDIS_PORT=6379",
                  "CANARY_PERCENT=0",
                  f"CORS_ORIGIN={os.environ['CORS_ORIGIN']}",
              ]
              cmd = ["docker", "run", "-d", "--name", "api-go-crawl-tpl",
                     "--add-host=host.docker.internal:host-gateway",
                     "--health-interval", "5s", "--health-timeout", "3s", "--health-retries", "20", "--health-start-period", "5s",
                     "-p", "127.0.0.1:4020:4020"]
              for item in env:
                  cmd.extend(["-e", item])
              cmd.append("api-go-crawl-tpl:ci")
              subprocess.check_call(cmd)
              for _ in range(30):
                  status = subprocess.check_output(["docker", "inspect", "--format", "{{.State.Health.Status}}", "api-go-crawl-tpl"], text=True).strip()
                  print("health", status, "templatesMode", templates_mode)
                  if status == "healthy":
                      return
                  if status == "unhealthy":
                      fail(subprocess.check_output(["docker", "logs", "api-go-crawl-tpl"], text=True)[-4000:])
                  time.sleep(2)
              fail(subprocess.check_output(["docker", "logs", "api-go-crawl-tpl"], text=True)[-4000:])

          def call(base_url, path, method="GET", token=None, payload=None, timeout=30):
              headers = {}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(base_url + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          def body(raw):
              if not raw:
                  return None
              text = raw.decode("utf-8", "replace").strip()
              if not text:
                  return None
              return json.loads(text)

          def core(value):
              if isinstance(value, dict):
                  return {key: core(item) for key, item in value.items() if key not in ("traceId", "timestamp")}
              if isinstance(value, list):
                  return [core(item) for item in value]
              return value

          def message(raw):
              doc = body(raw) or {}
              text = doc.get("message")
              if isinstance(text, list):
                  return "; ".join(str(item) for item in text)
              return text

          def login(email):
              status, raw = call(nest, "/api/auth/login", "POST", payload={"email": email, "password": os.environ["SEED_ADMIN_PASSWORD"]})
              doc = body(raw)
              if status not in (200, 201) or not doc or not doc.get("accessToken"):
                  fail(f"login {email} {status} {raw[:400]!r}")
              return doc["accessToken"]

          def same(path, method="GET", token=None, payload=None):
              left_status, left_raw = call(nest, path, method, token, payload)
              right_status, right_raw = call(go, path, method, token, payload)
              if left_status != right_status or core(body(left_raw)) != core(body(right_raw)):
                  fail(f"parity {method} {path} nest={left_status} {left_raw[:500]!r} go={right_status} {right_raw[:500]!r}")
              return left_status, body(left_raw)

          def list_for(token):
              status, raw = call(go, templates, "GET", token)
              if status != 200 or not isinstance(body(raw), list):
                  fail(f"list {status} {raw[:300]!r}")
              return body(raw)

          admin = scalar("SELECT id FROM User WHERE email='api-go-crawl-templates-smoke-admin@example.com'")
          baseline_jobs = redis_jobs()
          read_perm = scalar("SELECT id FROM Permission WHERE name='crawl.read'")
          write_perm = scalar("SELECT id FROM Permission WHERE name='crawl.write'")
          sql(f"""
          INSERT INTO Org (id, name, slug, isActive, createdAt, updatedAt) VALUES
            ('{org}', 'Crawl Templates Smoke', 'crawl-templates-smoke', 1, NOW(3), NOW(3)),
            ('{other}', 'Crawl Templates Other', 'crawl-templates-other', 1, NOW(3), NOW(3));
          INSERT INTO Role (id, name, isSystem, orgId) VALUES
            ('cwtrolewriter000000000001', 'cwt-writer', 0, '{org}'),
            ('cwtrolereader000000000001', 'cwt-reader', 0, '{org}'),
            ('cwtroleother0000000000001', 'cwt-other', 0, '{other}');
          INSERT INTO RolePermission (id, roleId, permissionId) VALUES
            ('cwtpermwriterread00000001', 'cwtrolewriter000000000001', '{read_perm}'),
            ('cwtpermwriterwrite0000001', 'cwtrolewriter000000000001', '{write_perm}'),
            ('cwtpermreaderread00000001', 'cwtrolereader000000000001', '{read_perm}'),
            ('cwtpermotherread00000001', 'cwtroleother0000000000001', '{read_perm}'),
            ('cwtpermotherwrite000001', 'cwtroleother0000000000001', '{write_perm}');
          INSERT INTO CrawlTemplate (id, orgId, name, description, isActive, crawlOptions, createdAt, updatedAt) VALUES
            ('cwttemplateother0000000001', '{other}', 'Other Template', NULL, 1, NULL, NOW(3), NOW(3));
          """)
          users = [
              ("cwtuserwriter000000000001", "cwt-writer@example.com", org, "cwtrolewriter000000000001"),
              ("cwtuserreader000000000001", "cwt-reader@example.com", org, "cwtrolereader000000000001"),
              ("cwtuserother0000000000001", "cwt-other@example.com", other, "cwtroleother0000000000001"),
          ]
          for user_id, email, user_org, role_id in users:
              sql(f"""
              INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
              SELECT '{user_id}', '{email}', passwordHash, 'Smoke', 'User', 1, NOW(3), NOW(3), NOW(3)
              FROM User WHERE id = '{admin}';
              INSERT INTO Membership (id, userId, orgId, roleId, isActive, createdAt)
              VALUES ('m{user_id[1:]}', '{user_id}', '{user_org}', '{role_id}', 1, NOW(3));
              """)

          # ---- 阶段 1：开关还是 legacy，全部经 Go 代理，Nest 是唯一执行者 ----
          start_go("legacy")
          tokens = {email: login(email) for _, email, _, _ in users}
          writer = tokens["cwt-writer@example.com"]
          reader = tokens["cwt-reader@example.com"]
          outsider = tokens["cwt-other@example.com"]

          # 步骤 2：经 Go 代理创建模板，201；直接打 Nest 读列表，同一条字段一致。
          payload = {"name": "Tpl Smoke", "description": " description ", "isActive": False,
                     "crawlOptions": {"markdown": True, "check_robots_txt": False}}
          status, raw = call(go, templates, "POST", writer, payload)
          created = body(raw)
          if status != 201 or not created or not created.get("id"):
              fail(f"legacy proxy create {status} {raw[:300]!r}")
          tid = created["id"]
          if created.get("name") != "Tpl Smoke" or created.get("description") != "description":
              fail(f"create fields {created}")
          if created.get("isActive") is not False:
              fail(f"create isActive {created.get('isActive')}")
          if created.get("crawlOptions") != {"markdown": True, "check_robots_txt": False}:
              fail(f"create crawlOptions {created.get('crawlOptions')}")
          nest_items = body(call(nest, templates, "GET", writer)[1])
          go_items = body(call(go, templates, "GET", writer)[1])
          nest_row = next((item for item in nest_items if item.get("id") == tid), None)
          go_row = next((item for item in go_items if item.get("id") == tid), None)
          if not nest_row or not go_row:
              fail("created template missing from list")
          for key in ("name", "description", "isActive", "crawlOptions"):
              if core(nest_row.get(key)) != core(created.get(key)) or core(go_row.get(key)) != core(nest_row.get(key)):
                  fail(f"legacy list mismatch {key} nest={nest_row.get(key)} go={go_row.get(key)} created={created.get(key)}")
          if nest_row.get("orgId") != org or go_row.get("orgId") != org:
              fail(f"list org mismatch {nest_row.get('orgId')}")

          # 步骤 3：空白 name 的 POST 与 PATCH → 400 name is required；PATCH 不改原名。
          status, raw = call(go, templates, "POST", writer, {"name": "   "})
          if status != 400 or message(raw) != "name is required":
              fail(f"legacy blank create {status} {raw[:300]!r}")
          status, raw = call(go, f"{templates}/{tid}", "PATCH", writer, {"name": "   "})
          if status != 400 or message(raw) != "name is required":
              fail(f"legacy blank patch {status} {raw[:300]!r}")
          if scalar(f"SELECT name FROM CrawlTemplate WHERE id='{tid}'") != "Tpl Smoke":
              fail("blank name changed the database name")

          # 步骤 4：crawlOptions 带 proxyUrl → 400 Unsupported crawl config: 前缀，不落库。
          status, raw = call(go, templates, "POST", writer, {"name": "Bad Proxy", "crawlOptions": {"proxyUrl": "http://127.0.0.1:8080"}})
          if status != 400 or not (message(raw) or "").startswith("Unsupported crawl config:"):
              fail(f"legacy proxy option {status} {raw[:300]!r}")
          if scalar(f"SELECT COUNT(*) FROM CrawlTemplate WHERE orgId='{org}' AND name='Bad Proxy'") != "0":
              fail("proxy option was persisted")

          # 步骤 5：crawlOptions 含 llmConfig → 400 含 crawl4ai LLM extraction settings，不落库。
          status, raw = call(go, templates, "POST", writer, {"name": "Bad Llm", "crawlOptions": {"llmConfig": {"model": "x"}}})
          if status != 400 or "crawl4ai LLM extraction settings" not in (message(raw) or ""):
              fail(f"legacy llm option {status} {raw[:300]!r}")
          if scalar(f"SELECT COUNT(*) FROM CrawlTemplate WHERE orgId='{org}' AND name='Bad Llm'") != "0":
              fail("llm option was persisted")

          # 步骤 6：只有 crawl.read 的用户 POST → 403。
          if call(go, templates, "POST", reader, {"name": "Nope"})[0] != 403:
              fail("reader create was not 403")
          if call(go, f"{templates}/{tid}", "PATCH", reader, {"name": "stolen"})[0] != 403:
              fail("reader patch was not 403")

          # 步骤 7：另一组织的 id 做 PATCH/DELETE → 404 Crawl template not found；该行还在原组织。
          other_id = "cwttemplateother0000000001"
          status, raw = call(go, f"{templates}/{other_id}", "PATCH", outsider, {"name": "theirs"})
          if status != 404 or message(raw) != "Crawl template not found":
              fail(f"legacy cross org patch {status} {raw[:300]!r}")
          status, raw = call(go, f"{templates}/{other_id}", "DELETE", outsider)
          if status != 404 or message(raw) != "Crawl template not found":
              fail(f"legacy cross org delete {status} {raw[:300]!r}")
          if scalar(f"SELECT COUNT(*) FROM CrawlTemplate WHERE id='{other_id}' AND orgId='{other}'") != "1":
              fail("cross org delete removed the other org row")

          # 步骤 8：DELETE 成功 200 {ok:true}；再 GET 列表里没有它。
          status, raw = call(go, f"{templates}/{tid}", "DELETE", writer)
          if status != 200 or body(raw) != {"ok": True}:
              fail(f"legacy delete {status} {raw[:300]!r}")
          if any(item.get("id") == tid for item in list_for(writer)):
              fail("deleted template still listed")
          if scalar(f"SELECT COUNT(*) FROM CrawlTemplate WHERE id='{tid}'") != "0":
              fail("delete did not remove the row")
          print("legacy proxy ok")

          # ---- 阶段 2：开关 go（Nest 仍在运行）----
          start_go("go")

          # 创建一条新模板；Nest 直连与 Go 列表都含同一条且字段一致。
          status, raw = call(go, templates, "POST", writer, {"name": "Tpl Go", "isActive": True})
          go_created = body(raw)
          if status != 201 or not go_created or not go_created.get("id"):
              fail(f"go create {status} {raw[:300]!r}")
          gid = go_created["id"]
          if go_created.get("description") is not None or go_created.get("crawlOptions") is not None:
              fail(f"go create null fields {go_created}")
          status, same_list = same(templates, "GET", writer)
          if status != 200 or not isinstance(same_list, list) or not any(item.get("id") == gid for item in same_list):
              fail(f"go list parity {status} {same_list}")
          same_row = next((item for item in same_list if item.get("id") == gid), None)
          if same_row.get("name") != "Tpl Go" or same_row.get("isActive") is not True:
              fail(f"go list row {same_row}")

          # 空白 name、权限、缺少/坏 token、跨组织在 go 侧重验。
          status, raw = call(go, f"{templates}/{gid}", "PATCH", writer, {"name": "   "})
          if status != 400 or message(raw) != "name is required":
              fail(f"go blank name {status} {raw[:300]!r}")
          if call(go, f"{templates}/{gid}", "PATCH", reader, {"name": "stolen"})[0] != 403:
              fail("go reader patch was not 403")
          if call(go, templates, "GET", None)[0] != 401 or call(go, templates, "GET", "not-a-jwt")[0] != 401:
              fail("missing/bad token was not 401")
          status, raw = call(go, f"{templates}/{gid}", "DELETE", outsider)
          if status != 404 or message(raw) != "Crawl template not found":
              fail(f"go cross org {status} {raw[:300]!r}")

          # 重复名称：Nest 与 Go 都 500（生产形状），且只留一行，不新造 409。
          status, _ = same(templates, "POST", writer, {"name": "Tpl Go", "description": "dup"})
          if status != 500:
              fail(f"duplicate name conflict {status}")
          if scalar(f"SELECT COUNT(*) FROM CrawlTemplate WHERE orgId='{org}' AND name='Tpl Go'") != "1":
              fail("duplicate create persisted a second row")
          print("go switch ok")

          # ---- 阶段 3：停止 Nest，Go 仍可创建与列表；crawl-tasks 未迁 → 502 ----
          if os.path.exists("/tmp/api-nestjs.pid"):
              os.kill(int(open("/tmp/api-nestjs.pid").read().strip()), signal.SIGTERM)
          subprocess.run(["pkill", "-f", "apps/api/dist/main.js"], check=False)
          subprocess.run(["pkill", "-f", "node dist/main.js"], check=False)
          stopped = False
          for _ in range(30):
              try:
                  urllib.request.urlopen(nest + "/api/healthz/live", timeout=2).read()
              except Exception:
                  stopped = True
                  break
              time.sleep(1)
          if not stopped:
              fail("nestjs did not stop")

          alive = writer
          status, raw = call(go, templates, "POST", alive, {"name": "After Nest"})
          after_create = body(raw)
          if status != 201 or not after_create or not after_create.get("id"):
              fail(f"create after nest stop {status} {raw[:300]!r}")
          status, raw = call(go, templates, "GET", alive)
          if status != 200 or not isinstance(body(raw), list):
              fail(f"list after nest stop {status} {raw[:300]!r}")
          status, raw = call(go, "/api/crawl-tasks", "POST", alive, {"name": "x"})
          if status != 502 or (body(raw) or {}).get("statusCode") != 502:
              fail(f"crawl-tasks after nest stop {status} {raw[:300]!r}")
          if redis_jobs() != baseline_jobs:
              fail("smoke enqueued crawl4ai jobs")
          print("nest stopped; crawl templates still succeed; crawl-tasks stays on Nest")
          PY
