# 采集只读（列表/详情）、媒体资产签名下发、Crawl4AI 质量快照与检索遥测 7 条
# HTTP 的真实栈验收。不进普通 CI。
# PR 上加 label api-go-crawl-read-telemetry-smoke，或 workflow_dispatch。
# SCHEDULE_ENABLED 保持 false。不请求 crawl4ai；不把抓取、模型、AkShare 或
# Nominatim 当通过。
name: api-go-crawl-read-telemetry-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-crawl-read-telemetry-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-crawl-read-telemetry-smoke@example.com
  SMTP_PASS: api-go-crawl-read-telemetry-smoke-smtp-not-connected
  JWT_SECRET: c1f4a9e8d2b3706f5a1c8e9d4b2a7f6038e5d1c9a7b6f4e2d3c8a1b5f9e0d7c2
  NEXTAUTH_SECRET: e2b5c1f8a9d3b47e60d4a1f8c3b5e79d02c1f4a9e8d2b3706f5a1c8e9d4b2a7f6
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  SEED_ORG_SLUG: api-go-crawl-read-telemetry-smoke-org
  SEED_ORG_NAME: api-go Crawl Read Telemetry Smoke Org
  SEED_ADMIN_EMAIL: api-go-crawl-read-telemetry-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: ApiGoCrawlRead#2026-Ci
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-crawl-read-telemetry-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-crawl-read-telemetry-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-crawl-read:ci .
      - name: Exercise crawl read / media / telemetry routes
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import base64, hashlib, hmac, json, os, re, signal, subprocess, time, urllib.error, urllib.request

          nest = "http://127.0.0.1:4000"
          go = "http://127.0.0.1:4020"

          org_a = "crawl-smoke-org-a-0001"
          org_b = "crawl-smoke-org-b-0001"
          user_a = "crawl-smoke-user-a-0001"
          user_b = "crawl-smoke-user-b-0001"
          user_manage = "crawl-smoke-user-manage-0001"
          user_denied = "crawl-smoke-user-denied-0001"
          machine_token = "mtk_crawl_smoke_0000000000000001"

          task_a = "crawl-smoke-task-a-1"
          task_a2 = "crawl-smoke-task-a-2"
          task_b = "crawl-smoke-task-b-1"
          result_a1 = "crawl-smoke-result-a-1"
          result_a2 = "crawl-smoke-result-a-2"
          result_b1 = "crawl-smoke-result-b-1"
          blob_png = "crawl-smoke-blob-png"
          blob_svg = "crawl-smoke-blob-svg"
          blob_b = "crawl-smoke-blob-b"
          asset_png = "crawl-smoke-asset-png"
          asset_svg = "crawl-smoke-asset-svg"
          asset_b = "crawl-smoke-asset-b"
          # Dirty cross-tenant row: it points at an org A result but belongs to
          # org B. The orgId predicate added by this batch must keep it out of
          # org A's detail payload and out of any org A signature.
          asset_stale = "crawl-smoke-asset-stale"
          source_a = "crawl-smoke-source-a"

          list_path = "/api/crawl-tasks"
          detail_a = f"/api/crawl-tasks/{task_a}"
          quality_path = "/api/admin/crawl4ai/quality"
          quality_source = f"/api/admin/crawl4ai/quality/sources/{source_a}"
          telemetry_path = "/api/search-telemetry"
          summary_path = "/api/admin/search-telemetry/summary"

          foreign_marker = "CROSS-TENANT-CONTENT-MARKER"
          own_markdown = "alpha own markdown body"
          svg_body = '<svg xmlns="http://www.w3.org/2000/svg" width="1" height="1"></svg>'
          png_hex = ("89504E470D0A1A0A0000000D4948445200000001000000010806000000"
                     "1F15C4890000000A49444154789C6360000002000154A24F5F0000000049454E44AE426082")
          png_bytes = len(png_hex) // 2
          svg_hex = svg_body.encode().hex().upper()

          def go_logs():
              try:
                  proc = subprocess.run(["docker", "logs", "--tail", "60", "api-go-crawl-read"],
                                        text=True, capture_output=True)
                  return (proc.stdout + proc.stderr)[-3000:]
              except Exception:  # noqa: BLE001 - diagnostics only
                  return ""

          def fail(message):
              print("FAIL", message)
              logs = go_logs()
              if logs:
                  print("GO-LOGS:", logs)
              raise SystemExit(1)

          def container_id(ancestor):
              return subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=" + ancestor], text=True).split()[0]

          def sql(statement):
              cid = container_id("mysql:8.4")
              proc = subprocess.run(["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "app"],
                                    input=statement, text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(proc.stderr or proc.stdout)
              return proc.stdout.strip()

          def scalar(statement):
              lines = [line.strip() for line in sql(statement).splitlines() if line.strip()]
              return lines[-1] if lines else ""

          def redis(*args):
              cid = container_id("redis:7.2")
              return subprocess.run(["docker", "exec", cid, "redis-cli", *args],
                                    text=True, capture_output=True).stdout.strip()

          def mongo_seed(script):
              cid = container_id("mongo:7.0")
              with open("/tmp/crawl-read-seed.js", "w") as handle:
                  handle.write(script)
              subprocess.check_call(["docker", "cp", "/tmp/crawl-read-seed.js", cid + ":/tmp/seed.js"])
              proc = subprocess.run(["docker", "exec", cid, "mongosh", "--quiet", "app", "--file", "/tmp/seed.js"],
                                    text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(proc.stderr or proc.stdout)
              return proc.stdout

          def start_go(mode):
              subprocess.run(["docker", "rm", "-f", "api-go-crawl-read"], check=False, capture_output=True)
              env = [
                  "PORT=4020",
                  "LEGACY_API_URL=http://host.docker.internal:4000",
                  "DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app",
                  "MONGO_URI=mongodb://host.docker.internal:27017/app",
                  f"API_GO_CRAWL_READ_TELEMETRY_MODE={mode}",
                  "API_GO_QUALITY_OVERVIEW_MODE=legacy",
                  "API_GO_ADMIN_LOGS_MODE=legacy",
                  "API_GO_LLM_LOGS_MODE=legacy",
                  "API_GO_CRAWL_PROFILES_MODE=legacy",
                  "API_GO_CRAWL_TEMPLATES_MODE=legacy",
                  "API_GO_CRAWL_WORKFLOWS_MODE=legacy",
                  "API_GO_NEWS_SOURCES_MODE=legacy",
                  "API_GO_NEWS_INDICATORS_MODE=legacy",
                  "API_GO_RBAC_MODE=legacy",
                  "API_GO_SITUATION_MONITORS_MODE=legacy",
                  "API_GO_CONTENT_SUBSCRIPTIONS_MODE=legacy",
                  "API_GO_USER_NEWS_BEHAVIOR_MODE=legacy",
                  "API_GO_USER_DIGEST_MODE=legacy",
                  "API_GO_DASHBOARD_STATS_MODE=legacy",
                  "API_GO_DASHBOARD_CHARTS_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_GEO_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE=legacy",
                  "API_GO_DASHBOARD_STREAM_MODE=legacy",
                  "API_GO_HEALTHZ_MODE=legacy",
                  "API_GO_PUBLIC_PORTAL_MODE=legacy",
                  "API_GO_ANALYSIS_VIEWS_MODE=legacy",
                  "API_GO_ANALYSIS_BOARDS_MODE=legacy",
                  "API_GO_ANALYSIS_THREADS_MODE=legacy",
                  "API_GO_GRAPHQL_READ_MODE=legacy",
                  "API_GO_GRAPHQL_NEWS_EVENTS_MODE=legacy",
                  "API_GO_GRAPHQL_KG_IMPACT_MODE=legacy",
                  "API_GO_USER_SETTINGS_WRITE_MODE=legacy",
                  "REALTIME_SIGNALS_ENABLED=false",
                  "ELASTICSEARCH_ENABLED=false",
                  "MODEL_SERVICE_ENABLED=false",
                  "SCHEDULE_ENABLED=false",
                  f"JWT_SECRET={os.environ['JWT_SECRET']}",
                  f"JWT_ISSUER={os.environ['JWT_ISSUER']}",
                  f"JWT_AUDIENCE={os.environ['JWT_AUDIENCE']}",
                  "REDIS_HOST=host.docker.internal",
                  "REDIS_PORT=6379",
                  "CANARY_PERCENT=0",
                  f"CORS_ORIGIN={os.environ['CORS_ORIGIN']}",
              ]
              cmd = ["docker", "run", "-d", "--name", "api-go-crawl-read",
                     "--add-host=host.docker.internal:host-gateway",
                     "-p", "127.0.0.1:4020:4020"]
              for item in env:
                  cmd.extend(["-e", item])
              cmd.append("api-go-crawl-read:ci")
              subprocess.check_call(cmd)
              # Probe /__go/healthz directly so a startup failure reports the
              # container state and its logs instead of a bare health status.
              deadline = time.time() + 120
              last = "no attempt"
              while time.time() < deadline:
                  state = subprocess.check_output(
                      ["docker", "inspect", "--format", "{{.State.Status}}/{{.State.ExitCode}}",
                       "api-go-crawl-read"], text=True).strip()
                  if state.startswith("exited"):
                      logs = subprocess.run(["docker", "logs", "api-go-crawl-read"],
                                            text=True, capture_output=True)
                      fail(f"api-go exited mode={mode} state={state} logs={(logs.stdout + logs.stderr)[-4000:]}")
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:4020/__go/healthz", timeout=3) as resp:
                          if 200 <= resp.status < 300:
                              print("health healthy mode", mode, "state", state)
                              return
                          last = f"{resp.status} {resp.read()[:400]!r}"
                  except Exception as exc:  # noqa: BLE001 - probe diagnostics
                      last = repr(exc)
                  print("health waiting mode", mode, "state", state, "last", last)
                  time.sleep(3)
              logs = subprocess.run(["docker", "logs", "api-go-crawl-read"], text=True, capture_output=True)
              fail(f"api-go unhealthy mode={mode} last={last} logs={(logs.stdout + logs.stderr)[-4000:]}")

          def call(base_url, path, method="GET", token=None, payload=None, timeout=30):
              headers = {}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(base_url + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, dict(resp.headers), resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, dict(exc.headers), exc.read()

          def body(raw):
              if not raw:
                  return None
              text = raw.decode("utf-8", "replace").strip()
              if not text:
                  return None
              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  return None

          def message(raw):
              doc = body(raw) or {}
              text = doc.get("message")
              if isinstance(text, list):
                  return "; ".join(str(item) for item in text)
              return text

          def login(email, password):
              status, _, raw = call(nest, "/api/auth/login", "POST",
                                    payload={"email": email, "password": password})
              doc = body(raw)
              if status not in (200, 201) or not doc or not doc.get("accessToken"):
                  fail(f"login {email} {status} {raw[:400]!r}")
              return doc["accessToken"]

          # normalize_exp rewrites the dynamic exp query parameter and the HMAC
          # signature (which is derived from exp) of every signed media URL so
          # Nest and Go payloads can be compared.
          def normalize_exp(value):
              text = json.dumps(value, ensure_ascii=False, sort_keys=True)
              text = re.sub(r"exp=\d+", "exp=0", text)
              text = re.sub(r"sig=[A-Za-z0-9_-]+", "sig=0", text)
              return text

          # normalize_snapshot_window drops the millisecond-level from/to of the
          # quality snapshot, which is computed independently on both sides.
          def normalize_quality(value):
              if isinstance(value, dict):
                  value = {k: v for k, v in value.items() if k not in ("from", "to")}
              return normalize_exp(value)

          # deep_diff prints the first differing JSON paths so a parity failure
          # is actionable without dumping multi-kilobyte bodies.
          def deep_diff(left, right, path="", out=None):
              if out is None:
                  out = []
              if isinstance(left, dict) and isinstance(right, dict):
                  for key in sorted(set(left) | set(right)):
                      deep_diff(left.get(key), right.get(key), f"{path}.{key}", out)
              elif isinstance(left, list) and isinstance(right, list):
                  if len(left) != len(right):
                      out.append(f"{path} length {len(left)} != {len(right)}")
                  for index in range(min(len(left), len(right))):
                      deep_diff(left[index], right[index], f"{path}[{index}]", out)
              elif left != right:
                  out.append(f"{path}: nest={left!r} go={right!r}")
              return out

          def report_diff(label, left, right):
              diffs = deep_diff(left, right)
              print("DIFF", label, "|", " ;; ".join(diffs[:12]))

          def compare(path, token, kind="json"):
              left_status, _, left_raw = call(nest, path, "GET", token)
              right_status, _, right_raw = call(go, path, "GET", token)
              if left_status != right_status:
                  fail(f"parity status {path} nest={left_status} go={right_status} {right_raw[:300]!r}")
              if kind == "quality":
                  left, right = normalize_quality(body(left_raw)), normalize_quality(body(right_raw))
              else:
                  left, right = normalize_exp(body(left_raw)), normalize_exp(body(right_raw))
              if left != right:
                  report_diff(path, left, right)
                  fail(f"parity body {path}")
              return body(right_raw)

          def flush_quality():
              sql(f"DELETE FROM ObservabilitySnapshot WHERE orgId IN ('{org_a}', '{org_b}')")

          def compare_fresh(path, token):
              flush_quality()
              go_status, _, go_raw = call(go, path, "GET", token)
              flush_quality()
              nest_status, _, nest_raw = call(nest, path, "GET", token)
              if go_status != 200 or nest_status != 200:
                  fail(f"fresh parity status {path} go={go_status} nest={nest_status} {go_raw[:400]!r} {nest_raw[:400]!r}")
              left, right = normalize_quality(body(nest_raw)), normalize_quality(body(go_raw))
              if left != right:
                  report_diff("fresh " + path, left, right)
                  fail(f"fresh parity body {path}")
              return body(go_raw)

          # media_paths indexes the media assets of every hydrated result by
          # content type (attachResultContent attaches mediaAssets per result).
          def media_paths(detail):
              by_type = {}
              for result in (detail.get("task") or {}).get("results") or []:
                  for asset in result.get("mediaAssets") or []:
                      by_type[asset.get("contentType")] = asset
              return by_type

          # ---- 准备数据：本组织 + 另一组织的 MySQL / Mongo 测试数据 ----
          admin = scalar("SELECT id FROM User WHERE email='api-go-crawl-read-telemetry-smoke-admin@example.com'")
          crawl_perm = scalar("SELECT id FROM Permission WHERE name='crawl.read'")
          items_perm = scalar("SELECT id FROM Permission WHERE name='items.read'")
          manage_perm = scalar("SELECT id FROM Permission WHERE name='settings.manage'")
          if not admin or not crawl_perm or not items_perm or not manage_perm:
              fail(f"missing seed rows admin={admin} crawl={crawl_perm} items={items_perm} manage={manage_perm}")
          machine_hash = hashlib.sha256(machine_token.encode()).hexdigest()

          sql(f"""
          INSERT INTO Org (id, name, slug, isActive, createdAt, updatedAt) VALUES
            ('{org_a}', 'Crawl Read Org A', 'crawl-smoke-org-a', 1, NOW(3), NOW(3)),
            ('{org_b}', 'Crawl Read Org B', 'crawl-smoke-org-b', 1, NOW(3), NOW(3));
          INSERT INTO Role (id, name, isSystem, orgId) VALUES
            ('crawl-role-a-0001', 'crawl-a', 0, '{org_a}'),
            ('crawl-role-b-0001', 'crawl-b', 0, '{org_b}'),
            ('crawl-role-m-0001', 'crawl-m', 0, '{org_a}'),
            ('crawl-role-d-0001', 'crawl-d', 0, '{org_a}');
          INSERT INTO RolePermission (id, roleId, permissionId) VALUES
            ('crawl-rp-a-1', 'crawl-role-a-0001', '{crawl_perm}'),
            ('crawl-rp-a-2', 'crawl-role-a-0001', '{items_perm}'),
            ('crawl-rp-b-1', 'crawl-role-b-0001', '{crawl_perm}'),
            ('crawl-rp-b-2', 'crawl-role-b-0001', '{items_perm}'),
            ('crawl-rp-m-1', 'crawl-role-m-0001', '{crawl_perm}'),
            ('crawl-rp-m-2', 'crawl-role-m-0001', '{items_perm}'),
            ('crawl-rp-m-3', 'crawl-role-m-0001', '{manage_perm}');
          INSERT INTO NewsSource (id, orgId, name, url, siteType, frequencySeconds, priority, isActive, consecutiveFailures, createdAt, updatedAt) VALUES
            ('{source_a}', '{org_a}', 'crawl-smoke-source-a', 'https://smoke.example.com/rss', 'general', 3600, 0, 1, 0, NOW(3), NOW(3));
          INSERT INTO CrawlTask (id, orgId, createdById, newsSourceId, targetUrl, displayName, status, config, keywords, concurrency, runCount, createdAt, updatedAt) VALUES
            ('{task_a}', '{org_a}', '{admin}', '{source_a}', 'https://alpha.example.com/list', 'NewsSource:{source_a}:smoke', 'completed',
             '{{"notes":"alpha"}}', '["alpha"]', 1, 2, DATE_SUB(NOW(3), INTERVAL 30 MINUTE), DATE_SUB(NOW(3), INTERVAL 20 MINUTE)),
            ('{task_a2}', '{org_a}', '{admin}', NULL, 'https://alpha.example.com/other', 'alpha second task', 'pending',
             NULL, '[]', 1, 0, DATE_SUB(NOW(3), INTERVAL 20 MINUTE), DATE_SUB(NOW(3), INTERVAL 10 MINUTE)),
            ('{task_b}', '{org_b}', '{admin}', NULL, 'https://beta.example.com/list', 'beta task', 'completed',
             NULL, '[]', 1, 1, DATE_SUB(NOW(3), INTERVAL 25 MINUTE), DATE_SUB(NOW(3), INTERVAL 15 MINUTE));
          INSERT INTO CrawlResult (id, taskId, orgId, sourceUrl, fetchedAt, markdownRef, contentHash, metadata, createdAt) VALUES
            ('{result_a1}', '{task_a}', '{org_a}', 'https://alpha.example.com/1', DATE_SUB(NOW(3), INTERVAL 25 MINUTE), 'mongo://a1', 'hash-a1', '{{"smoke":"a1"}}', NOW(3)),
            ('{result_a2}', '{task_a}', '{org_a}', 'https://alpha.example.com/2', DATE_SUB(NOW(3), INTERVAL 24 MINUTE), 'mongo://a2', 'hash-a2', NULL, NOW(3)),
            ('{result_b1}', '{task_b}', '{org_b}', 'https://beta.example.com/1', DATE_SUB(NOW(3), INTERVAL 23 MINUTE), 'mongo://b1', 'hash-b1', NULL, NOW(3));
          INSERT INTO CrawlMediaBlob (id, orgId, sha256, bytes, contentType, blobData, refCount, createdAt, updatedAt) VALUES
            ('{blob_png}', '{org_a}', REPEAT('a', 64), {png_bytes}, 'image/png', UNHEX('{png_hex}'), 1, NOW(3), NOW(3)),
            ('{blob_svg}', '{org_a}', REPEAT('b', 64), {len(svg_body)}, 'image/svg+xml', UNHEX('{svg_hex}'), 1, NOW(3), NOW(3)),
            ('{blob_b}', '{org_b}', REPEAT('c', 64), {png_bytes}, 'image/png', UNHEX('{png_hex}'), 1, NOW(3), NOW(3));
          INSERT INTO CrawlMediaAsset (id, resultId, orgId, taskId, blobId, provider, kind, sourceUrl, bytes, contentType, blobData, width, height, alt, title, format, metadata, createdAt, updatedAt) VALUES
            ('{asset_png}', '{result_a1}', '{org_a}', '{task_a}', '{blob_png}', 'mysql', 'image', 'https://alpha.example.com/p.png', {png_bytes}, 'image/png', NULL, 1, 1, 'alpha png', 'alpha png title', 'png', '{{"smoke":true}}', NOW(3), NOW(3)),
            ('{asset_svg}', '{result_a1}', '{org_a}', '{task_a}', '{blob_svg}', 'mysql', 'image', 'https://alpha.example.com/p.svg', {len(svg_body)}, 'image/svg+xml', NULL, NULL, NULL, NULL, NULL, 'svg', NULL, DATE_ADD(NOW(3), INTERVAL 1 SECOND), DATE_ADD(NOW(3), INTERVAL 1 SECOND)),
