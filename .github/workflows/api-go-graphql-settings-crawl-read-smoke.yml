      - name: Assert admin gate, source policy revisions, stale cursors and review queue
        run: |
          set -euo pipefail
          # 第 3-6 组验收。Go 已在上一步以 go 模式运行。
          python3 - << 'PY'
          import base64, json, sys
          sys.path.insert(0, "/tmp")
          from sc_lib import GO, NEST, compare, fail, first_error, gql, scrub

          def token(name):
              return open("/tmp/sc-token-" + name).read()

          # ---------------------------------------------------------------
          # 第 3 组：assertAdmin 修复。
          # userA 绑定本组织 isSystem=false 且名为 admin 的自定义角色；
          # userB 的 membership roles 借用了另一个组织的系统 admin 角色。
          # 两者对三个 admin 门禁 root 都必须 403 "Admin access required"，
          # 对四个 dashboards.read root 必须成功，且 NestJS 直连与 Go 一致。
          # ---------------------------------------------------------------
          gated = [
              ("rateLimitSettings", "query { rateLimitSettings { login { limit windowSeconds } } }"),
              ("newsEventSourcePolicy", "query { newsEventSourcePolicy { activeRevision } }"),
              ("newsPromptConfig", "query { newsPromptConfig { version } }"),
          ]
          allowed = [
              ("entityImpactGraphSettings", "query { entityImpactGraphSettings { enabled } }"),
              ("knowledgeGraphSettings", "query { knowledgeGraphSettings { enabled } }"),
              ("newsEventSettings", "query { newsEventSettings { enabled } }"),
              ("newsIndicatorSettings", "query { newsIndicatorSettings { enabled } }"),
          ]
          # 正向对照：真正的系统 admin 对三个门禁 root 必须成功，防止「一律 403」
          # 的实现把第 3 组混过去。
          for name, query in gated:
              status, doc = gql(NEST, token("admin"), query)
              if status != 200 or doc.get("errors") or not (doc.get("data") or {}).get(name):
                  fail("real admin " + name + " " + str(status) + " " + json.dumps(doc)[:400])
          for user in ("custom-admin", "foreign-admin"):
              user_token = token(user)
              for name, query in gated:
                  ns, nd = gql(NEST, user_token, query)
                  gs, gd = gql(GO, user_token, query)
                  for label, status, doc in (("nest", ns, nd), ("gateway", gs, gd)):
                      if status != 403 or first_error(doc) != "Admin access required" or "FORBIDDEN" not in json.dumps(doc):
                          fail("admin gate " + user + " " + name + " " + label + " " + str(status) + " " + json.dumps(doc)[:400])
                  if ns != gs or first_error(nd) != first_error(gd):
                      fail("admin gate agreement " + user + " " + name)
              for name, query in allowed:
                  status, doc = gql(NEST, user_token, query)
                  if status != 200 or doc.get("errors") or not (doc.get("data") or {}).get(name):
                      fail("allowed " + user + " " + name + " nest " + str(status) + " " + json.dumps(doc)[:400])
                  other = compare("allowed " + user + " " + name, query, {}, user_token)
                  if not (other.get("data") or {}).get(name):
                      fail("allowed " + user + " " + name + " gateway")
          print("OK admin gate rejects custom/borrowed admin roles and allows dashboards.read roots")

          # ---------------------------------------------------------------
          # 第 4 组：来源策略 + 修订差异 + 同步状态。
          # ---------------------------------------------------------------
          policy_query = "query { newsEventSourcePolicy { activeRevision warnings { domainConflicts hasConflicts labelConflicts } } }"
          policy = compare("go source policy", policy_query, {}, token("admin")).get("data", {}).get("newsEventSourcePolicy") or {}
          if policy.get("activeRevision") != 2 or not (policy.get("warnings") or {}).get("hasConflicts"):
              fail("go source policy " + json.dumps(policy)[:400])
          if "conflict.example" not in (policy.get("warnings") or {}).get("domainConflicts", []):
              fail("go source policy conflict domain missing " + json.dumps(policy)[:400])
          diff_query = """
          query PolicyDiff($baseRevision: Int!, $targetRevision: Int!) {
            newsEventSourcePolicyRevisionDiff(baseRevision: $baseRevision, targetRevision: $targetRevision) {
              authoritativeDomainsAdd authoritativeDomainsRemove authoritativeLabelsAdd authoritativeLabelsRemove
              baseRevision blogDomainsAdd blogDomainsRemove blogLabelsAdd blogLabelsRemove targetRevision
            }
          }"""
          diff = compare("go revision diff", diff_query, {"baseRevision": 1, "targetRevision": 2}, token("admin")).get("data", {}).get("newsEventSourcePolicyRevisionDiff") or {}
          if diff.get("baseRevision") != 1 or diff.get("targetRevision") != 2:
              fail("revision diff revisions " + json.dumps(diff)[:400])
          if "rev2-authoritative.example" not in diff.get("authoritativeDomainsAdd", []):
              fail("revision diff must add rev2-authoritative.example " + json.dumps(diff)[:400])
          if "rev1-authoritative.example" not in diff.get("authoritativeDomainsRemove", []):
              fail("revision diff must remove rev1-authoritative.example " + json.dumps(diff)[:400])
          sync_query = "query { newsEventSourcePolicySyncStatus { degraded forceAuthoritativeMode forceMinAuthoritativeSources policyCacheStale presetCacheStale warningCodes } }"
          sync_status = compare("go sync status", sync_query, {}, token("admin")).get("data", {}).get("newsEventSourcePolicySyncStatus") or {}
          if "warningCodes" not in sync_status:
              fail("sync status shape " + json.dumps(sync_status)[:400])
          print("OK source policy revisions, diff and sync status")

          # ---------------------------------------------------------------
          # 第 5 组：crawlTasks 失效游标修复。
          # 不存在的 id 与其它组织的 CrawlTask.id 都必须返回空页、无错误、HTTP 200。
          # ---------------------------------------------------------------
          cursor_query = """
          query StaleCursor($after: String) {
            crawlTasks(after: $after, first: 20) { edges { cursor node { id } } pageInfo { endCursor hasNextPage } totalCount }
          }"""
          bogus = base64.b64encode(b"does-not-exist-crawl-task").decode()
          other_task = open("/tmp/sc-task-other").read()
          other_cursor = base64.b64encode(other_task.encode()).decode()
          for label, cursor in (("missing", bogus), ("cross-org", other_cursor)):
              for base, side in ((NEST, "nest"), (GO, "gateway")):
                  status, doc = gql(base, token("admin"), cursor_query, {"after": cursor})
                  connection = (doc.get("data") or {}).get("crawlTasks") or {}
                  if status != 200 or doc.get("errors") or connection.get("edges") != [] or (connection.get("pageInfo") or {}).get("hasNextPage") is not False:
                      fail("stale cursor " + label + " " + side + " " + str(status) + " " + json.dumps(doc)[:400])
              compare("stale cursor " + label, cursor_query, {"after": cursor}, token("admin"))
          print("OK crawlTasks stale cursors return empty pages on both sides")

          # ---------------------------------------------------------------
          # 第 6 组：知识图谱证据复核队列。
          # ---------------------------------------------------------------
          queue_query = """
          query ReviewQueue($onlyUnreviewed: Boolean!) {
            knowledgeGraphEvidenceReviewQueue(limit: 50, onlyUnreviewed: $onlyUnreviewed) {
              id
              article { crawlAt id language summary title url }
              confidence createdAt evidence extractorVersion
              edge { confidence fromEntity { id name properties type } id properties toEntity { id name properties type } type weight }
            }
          }"""
          good = open("/tmp/sc-evidence-good").read()
          approved = open("/tmp/sc-evidence-approved").read()
          for user in ("kg-review", "kg-settings"):
              reviewed = compare("review queue " + user, queue_query, {"onlyUnreviewed": True}, token(user))
              ids = [item["id"] for item in (reviewed.get("data") or {}).get("knowledgeGraphEvidenceReviewQueue") or []]
              if ids != [good]:
                  fail("review queue " + user + " ids " + json.dumps(ids))
          all_rows = compare("review queue all", queue_query, {"onlyUnreviewed": False}, token("kg-review"))
          ids = [item["id"] for item in (all_rows.get("data") or {}).get("knowledgeGraphEvidenceReviewQueue") or []]
          if ids != [approved, good]:
              fail("review queue onlyUnreviewed=false ids " + json.dumps(ids))
          for base, side in ((NEST, "nest"), (GO, "gateway")):
              status, doc = gql(base, token("kg-none"), queue_query, {"onlyUnreviewed": True})
              if status != 403 or "INSUFFICIENT_PERMISSIONS" not in json.dumps(doc):
                  fail("review queue no-permission " + side + " " + str(status) + " " + json.dumps(doc)[:400])
          print("OK review queue permissions, approved filter and cross-org dirty row")
          PY
