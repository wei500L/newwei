# Go：设置中心 + 新闻来源策略 + 同步状态 + 知识图谱证据复核队列 + 爬取任务 20 个
# GraphQL 只读 root 的真实栈对照。
# 不进普通 CI。PR 上加 label api-go-graphql-settings-crawl-read-smoke，或 workflow_dispatch。
# 不调用模型或外部服务；不启动采集 worker、调度器或 AkShare。
#
# 被测开关（两者同时为 go 时 Go 才接管这 20 个 root）：
#   API_GO_GRAPHQL_READ_MODE=go
#   API_GO_GRAPHQL_SETTINGS_CRAWL_READ_MODE=go（新增，默认 legacy）
# 回滚只需把 API_GO_GRAPHQL_SETTINGS_CRAWL_READ_MODE 改回 legacy。
#
# SDL 来源：apps/api/schema.gql（Query 根字段与各返回对象类型逐字段抄录，
# 选择集覆盖每个 root 返回类型的全部标量字段并递归展开嵌套对象）。
name: api-go-graphql-settings-crawl-read-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-graphql-settings-crawl-read-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-smoke@example.com
  SMTP_PASS: api-go-smoke-smtp-not-connected
  JWT_SECRET: c1f4a9e8d2b3706f5a1c8e9d4b2a7f6038e5d1c9a7b6f4e2d3c8a1b5f9e0d7c2
  NEXTAUTH_SECRET: e2b5c1f8a9d3b47e60d4a1f8c3b5e79d02c1f4a9e8d2b3706f5a1c8e9d4b2a7f6
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  LITELLM_TIMEOUT_MS: "800"
  LITELLM_RETRY_ATTEMPTS: "1"
  SEED_ORG_SLUG: api-go-smoke-org
  SEED_ORG_NAME: api-go Smoke Org
  SEED_ADMIN_EMAIL: api-go-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: ApiGoSmoke#2026-Ci
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-graphql-settings-crawl-read-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-graphql-settings-crawl-read-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-settings-crawl:ci .
      - name: Seed fixtures and drive source policy revisions
        run: |
          set -euo pipefail
          # 共享的对照工具：调用 /graphql、登录、JSON 规范化比较。
          cat > /tmp/sc_lib.py << 'PYLIB'
          import json
          import urllib.error
          import urllib.request

          NEST = "http://127.0.0.1:4000"
          GO = "http://127.0.0.1:4020"

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def call(base, path, method="GET", token=None, payload=None, timeout=60):
              headers = {"content-type": "application/json"}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          def gql(base, token, query, variables=None):
              status, raw = call(base, "/graphql", "POST", token, {"query": query, "variables": variables or {}})
              try:
                  doc = json.loads(raw or b"null")
              except Exception:
                  doc = {"raw": raw[:400].decode("utf-8", "replace")}
              return status, doc

          def login(base, email, password):
              status, raw = call(base, "/api/auth/login", "POST", payload={"email": email, "password": password})
              try:
                  doc = json.loads(raw) if raw else None
              except Exception:
                  doc = None
              if status not in (200, 201) or not doc or not doc.get("accessToken"):
                  fail("login " + email + " " + str(status) + " " + repr(raw[:300]))
              return doc["accessToken"]

          def scrub(value):
              if isinstance(value, dict):
                  return {k: scrub(v) for k, v in value.items() if k not in ("traceId", "locations", "stack", "originalError")}
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              return value

          def canon(value, key=None):
              # 只按解析后的 JSON 比较，字段顺序无关；列表顺序保持原样，
              # 不做任何重排，避免掩盖真实的顺序差异。
              if isinstance(value, dict):
                  return {k: canon(v, k) for k, v in value.items()}
              if isinstance(value, list):
                  return [canon(v, key) for v in value]
              return value

          def same(left, right):
              if isinstance(left, dict) and isinstance(right, dict):
                  if left.keys() != right.keys():
                      return False
                  return all(same(left[k], right[k]) for k in left)
              if isinstance(left, list) and isinstance(right, list):
                  return len(left) == len(right) and all(same(a, b) for a, b in zip(left, right))
              if isinstance(left, (int, float)) and isinstance(right, (int, float)) and not isinstance(left, bool) and not isinstance(right, bool):
                  return abs(float(left) - float(right)) < 0.0001
              return left == right

          def compare(label, query, variables, token, base_nest=NEST, base_go=GO):
              ns, nd = gql(base_nest, token, query, variables)
              gs, gd = gql(base_go, token, query, variables)
              if ns != gs or not same(canon(scrub(nd)), canon(scrub(gd))):
                  fail(label + " nest/gateway " + str(ns) + "/" + str(gs) + "\nNEST " + json.dumps(scrub(nd))[:2500] + "\nGO " + json.dumps(scrub(gd))[:2500])
              return scrub(gd)

          def first_error(doc):
              errors = doc.get("errors") or []
              if not errors:
                  return None
              return errors[0].get("message")
          PYLIB
          # legacy 阶段先以 settings-crawl=legacy 启动 Go，供第 1 组验收使用。
          start_go() {
            local read_mode="$1"
            local settings_crawl_mode="$2"
            local workspace_mode="$3"
            docker rm -f api-go-settings-crawl >/dev/null 2>&1 || true
            docker run -d --name api-go-settings-crawl \
              --add-host=host.docker.internal:host-gateway \
              --health-interval 5s --health-timeout 3s --health-retries 20 --health-start-period 5s \
              -p 127.0.0.1:4020:4020 \
              -e PORT=4020 \
              -e LEGACY_API_URL=http://host.docker.internal:4000 \
              -e DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app \
              -e MONGO_URI=mongodb://host.docker.internal:27017/app \
              -e API_GO_GRAPHQL_READ_MODE="$read_mode" \
              -e API_GO_GRAPHQL_SETTINGS_CRAWL_READ_MODE="$settings_crawl_mode" \
              -e API_GO_GRAPHQL_WORKSPACE_READ_MODE="$workspace_mode" \
              -e GRAPHQL_RESPONSE_CACHE_ENABLED=false \
              -e RATE_LIMIT_LOGIN=1000 \
              -e API_GO_DASHBOARD_STATS_MODE=legacy \
              -e API_GO_DASHBOARD_CHARTS_MODE=legacy \
              -e API_GO_DASHBOARD_WAR_MAP_MODE=legacy \
              -e API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE=legacy \
              -e API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE=legacy \
              -e API_GO_DASHBOARD_SPACETIME_GEO_MODE=legacy \
              -e API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE=legacy \
              -e API_GO_DASHBOARD_STREAM_MODE=legacy \
              -e API_GO_HEALTHZ_MODE=legacy \
              -e API_GO_CONTENT_SUBSCRIPTIONS_MODE=legacy \
              -e API_GO_USER_NEWS_BEHAVIOR_MODE=legacy \
              -e API_GO_USER_DIGEST_MODE=legacy \
              -e API_GO_ANALYSIS_VIEWS_MODE=legacy \
              -e API_GO_ANALYSIS_BOARDS_MODE=legacy \
              -e API_GO_ANALYSIS_THREADS_MODE=legacy \
              -e API_GO_GRAPHQL_NEWS_EVENTS_MODE=legacy \
              -e API_GO_GRAPHQL_KG_IMPACT_MODE=legacy \
              -e API_GO_GRAPHQL_KNOWLEDGE_GRAPH_MODE=legacy \
              -e API_GO_NEWS_INDICATORS_MODE=legacy \
              -e JWT_SECRET="$JWT_SECRET" \
              -e JWT_ISSUER="$JWT_ISSUER" \
              -e JWT_AUDIENCE="$JWT_AUDIENCE" \
              -e REDIS_HOST=host.docker.internal \
              -e REDIS_PORT=6379 \
              -e CANARY_PERCENT=0 \
              -e CORS_ORIGIN="$CORS_ORIGIN" \
              api-go-settings-crawl:ci
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' api-go-settings-crawl 2>/dev/null || echo starting)
              echo "health=$status read=$read_mode settings-crawl=$settings_crawl_mode workspace=$workspace_mode"
              if [ "$status" = "healthy" ]; then return 0; fi
              if [ "$status" = "unhealthy" ]; then docker logs api-go-settings-crawl; return 1; fi
              sleep 2
            done
            docker logs api-go-settings-crawl || true
            return 1
          }
          start_go go legacy legacy
          declare -f start_go > /tmp/start-go.sh
          python3 - << 'PY'
          import datetime, json, os, subprocess, sys
          sys.path.insert(0, "/tmp")
          from sc_lib import GO, NEST, fail, gql, login

          def cid(ancestor):
              return subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=" + ancestor], text=True).split()[0]

          mysql = cid("mysql:8.4")
          mongo = cid("mongo:7.0")
          redis = cid("redis:7.2")

          def sql(statement):
              proc = subprocess.run(["docker", "exec", "-i", mysql, "mysql", "-uroot", "-psecret", "-N", "app"], input=statement, text=True, capture_output=True)
              if proc.returncode != 0:
                  raise SystemExit(proc.stderr or proc.stdout)
              return proc.stdout.strip()

          org = sql("SELECT id FROM Org WHERE slug='api-go-smoke-org'")
          admin = sql("SELECT id FROM User WHERE email='api-go-smoke-admin@example.com'")
          if not org or not admin:
              fail("seed org/admin missing")
          sql("UPDATE User SET emailVerified = NOW(3) WHERE id = '" + admin + "'")

          permissions = {}
          for name in ["settings.manage", "dashboards.read", "knowledgegraph.review", "items.read", "crawl.read"]:
              value = sql("SELECT id FROM Permission WHERE name='" + name + "'")
              if not value:
                  fail("permission " + name + " missing")
              permissions[name] = value

          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0)

          def at(minutes):
              return (now - datetime.timedelta(minutes=minutes)).strftime("%Y-%m-%d %H:%M:%S")

          t5, t10, t30, t60, t100, t120 = at(5), at(10), at(30), at(60), at(100), at(120)

          # 组织 B：另一个组织的系统 admin 角色（被借用的 role id）。
          # 组织 C：本组织自定义 admin 角色（isSystem=false），该组织没有系统 admin。
          # 组织 A：base 角色 + 拥有 settings.manage/dashboards.read 的普通用户。
          sql(f"""
          INSERT INTO Org (id, name, slug, description, planTier, subscriptionStatus, isActive, createdAt, updatedAt)
          VALUES
            ('wsorgother00000000001', 'API Go Smoke Other Org', 'api-go-smoke-other-org', NULL, NULL, NULL, 1, NOW(3), NOW(3)),
            ('wsorgcustom0000000001', 'API Go Smoke Custom Admin Org', 'api-go-smoke-custom-admin-org', NULL, NULL, NULL, 1, NOW(3), NOW(3));
          INSERT INTO Role (id, name, description, isSystem, orgId) VALUES
            ('wsrolebadmin0000000001', 'admin', 'other org system admin role', 1, 'wsorgother00000000001'),
            ('wsrolecustomadmin001', 'admin', 'custom non-system admin lookalike', 0, 'wsorgcustom0000000001'),
            ('wsroleforeignbase01', 'ws-foreign-base', 'caller primary role in the smoke org', 0, '{org}'),
            ('wsrolekgreview00001', 'ws-kg-review', 'knowledgegraph.review only', 0, '{org}'),
            ('wsrolekgsettings001', 'ws-kg-settings', 'settings.manage only', 0, '{org}'),
            ('wsrolekgnone00000001', 'ws-kg-none', 'no permissions', 0, '{org}');
          INSERT INTO RolePermission (id, roleId, permissionId) VALUES
            ('wsrpbauthority0001', 'wsrolebadmin0000000001', '{permissions["settings.manage"]}'),
            ('wsrpbauthority0002', 'wsrolebadmin0000000001', '{permissions["dashboards.read"]}'),
            ('wsrpcustom00000001', 'wsrolecustomadmin001', '{permissions["settings.manage"]}'),
            ('wsrpcustom00000002', 'wsrolecustomadmin001', '{permissions["dashboards.read"]}'),
            ('wsrpforeign0000001', 'wsroleforeignbase01', '{permissions["settings.manage"]}'),
            ('wsrpforeign0000002', 'wsroleforeignbase01', '{permissions["dashboards.read"]}'),
            ('wsrpkgreview00001', 'wsrolekgreview00001', '{permissions["knowledgegraph.review"]}'),
            ('wsrpkgsettings001', 'wsrolekgsettings001', '{permissions["settings.manage"]}');
          INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
          SELECT 'wsusercustomadmin001', 'ws-custom-admin@example.com', passwordHash, 'Custom', 'Admin', 1, NOW(3), NOW(3), NOW(3) FROM User WHERE id = '{admin}';
          INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
          SELECT 'wsuserforeign00000001', 'ws-foreign-admin@example.com', passwordHash, 'Foreign', 'Admin', 1, NOW(3), NOW(3), NOW(3) FROM User WHERE id = '{admin}';
          INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
          SELECT 'wsuserkgreview000001', 'ws-kg-review@example.com', passwordHash, 'Kg', 'Review', 1, NOW(3), NOW(3), NOW(3) FROM User WHERE id = '{admin}';
          INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
          SELECT 'wsuserkgsettings0001', 'ws-kg-settings@example.com', passwordHash, 'Kg', 'Settings', 1, NOW(3), NOW(3), NOW(3) FROM User WHERE id = '{admin}';
          INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
          SELECT 'wsuserkgnone0000001', 'ws-kg-none@example.com', passwordHash, 'Kg', 'None', 1, NOW(3), NOW(3), NOW(3) FROM User WHERE id = '{admin}';
          INSERT INTO Membership (id, userId, orgId, roleId, isActive, createdAt) VALUES
            ('wsmemcustomadmin0001', 'wsusercustomadmin001', 'wsorgcustom0000000001', 'wsrolecustomadmin001', 1, NOW(3)),
            ('wsmemforeign0000000001', 'wsuserforeign00000001', '{org}', 'wsroleforeignbase01', 1, NOW(3)),
            ('wsmemkgreview0000001', 'wsuserkgreview000001', '{org}', 'wsrolekgreview00001', 1, NOW(3)),
            ('wsmemkgsettings0001', 'wsuserkgsettings0001', '{org}', 'wsrolekgsettings001', 1, NOW(3)),
            ('wsmemkgnone00000001', 'wsuserkgnone0000001', '{org}', 'wsrolekgnone00000001', 1, NOW(3));
          SET FOREIGN_KEY_CHECKS=0;
          INSERT INTO MembershipRole (membershipId, roleId, orgId, createdAt)
          VALUES ('wsmemforeign0000000001', 'wsrolebadmin0000000001', 'wsorgother00000000001', NOW(3));
          SET FOREIGN_KEY_CHECKS=1;
          INSERT INTO Article (id, orgId, url, language, titleGuess, crawlAt, contentHash, createdAt, updatedAt)
          VALUES ('wsarticle00000000001', '{org}', 'https://example.com/smoke-article-a', 'en', 'Smoke Article A', '{t100}', 'smoke-hash-art-a', '{t100}', '{t100}');
          INSERT INTO Article (id, orgId, url, language, titleGuess, crawlAt, contentHash, createdAt, updatedAt)
          VALUES ('wsarticleother000001', 'wsorgother00000000001', 'https://example.com/other-article', 'en', 'Other Article', '{t100}', 'other-hash-art', '{t100}', '{t100}');
          INSERT INTO KnowledgeEntity (id, orgId, type, canonicalName, normalizedKey, properties, createdAt, updatedAt) VALUES
            ('wskgentity000000001', '{org}', 'company', 'Smoke Co A', 'smoke-co-a', CAST('{{"probe":true}}' AS JSON), '{t100}', '{t100}'),
            ('wskgentity000000002', '{org}', 'industry', 'Smoke Industry A', 'smoke-industry-a', NULL, '{t100}', '{t100}');
          INSERT INTO KnowledgeEntity (id, orgId, type, canonicalName, normalizedKey, properties, createdAt, updatedAt) VALUES
            ('wskgentityother0001', 'wsorgother00000000001', 'company', 'Other Co B', 'other-co-b', NULL, '{t100}', '{t100}'),
            ('wskgentityother0002', 'wsorgother00000000001', 'industry', 'Other Industry B', 'other-industry-b', NULL, '{t100}', '{t100}');
          INSERT INTO KnowledgeEdge (id, orgId, type, fromEntityId, toEntityId, weight, confidence, properties, firstSeenAt, lastSeenAt, createdAt, updatedAt) VALUES
            ('wskgedge00000000001', '{org}', 'belongs_to_industry', 'wskgentity000000001', 'wskgentity000000002', 1, 0.4, NULL, '{t100}', '{t100}', '{t100}', '{t100}'),
            ('wskgedge00000000002', '{org}', 'supplies', 'wskgentity000000001', 'wskgentity000000002', 0.5, 0.3, CAST('{{"probe":"edge"}}' AS JSON), '{t100}', '{t100}', '{t100}', '{t100}');
          INSERT INTO KnowledgeEdge (id, orgId, type, fromEntityId, toEntityId, weight, confidence, properties, firstSeenAt, lastSeenAt, createdAt, updatedAt) VALUES
            ('wskgedgeother000001', 'wsorgother00000000001', 'supplies', 'wskgentityother0001', 'wskgentityother0002', 0.5, 0.3, NULL, '{t100}', '{t100}', '{t100}', '{t100}');
          INSERT INTO KnowledgeEdgeEvidence (id, orgId, edgeId, articleId, extractorVersion, confidence, evidence, createdAt) VALUES
            ('wskgevidence0000001', '{org}', 'wskgedge00000000001', 'wsarticle00000000001', 'v1', 0.2, CAST('{{"review":{{"status":"pending"}}}}' AS JSON), '{t30}'),
            ('wskgevidence0000002', '{org}', 'wskgedge00000000002', 'wsarticle00000000001', 'v1', 0.3, CAST('{{"review":{{"status":"approved"}}}}' AS JSON), '{t10}'),
            ('wskgevidencdirty001', '{org}', 'wskgedgeother000001', 'wsarticleother000001', 'v1', 0.25, CAST('{{"review":{{"status":"pending"}}}}' AS JSON), '{t5}');
          INSERT INTO CrawlTask (id, orgId, createdById, targetUrl, displayName, status, config, concurrency, keywords, lastRunAt, lastSuccessAt, lastResultAt, lastCursor, lastError, runCount, lastServerMemoryMb, lastPeakMemoryMb, lastMemoryEfficiency, createdAt, updatedAt) VALUES
            ('wscrawltask0000000001', '{org}', '{admin}', 'https://example.com/smoke-a', 'Smoke Task A', 'completed', CAST('{{"sourcePriority":1}}' AS JSON), 2, CAST('["smoke","crawl"]' AS JSON), '{t60}', '{t60}', '{t60}', 'cursor-a1', NULL, 3, 128.5, 256.25, 0.5, '{t60}', '{t60}');
          INSERT INTO CrawlTask (id, orgId, createdById, targetUrl, displayName, status, config, concurrency, keywords, runCount, createdAt, updatedAt) VALUES
            ('wscrawltask0000000002', '{org}', '{admin}', 'https://example.com/smoke-b', 'Smoke Task B', 'queued', NULL, 1, CAST('[]' AS JSON), 0, '{t120}', '{t120}');
          INSERT INTO CrawlTask (id, orgId, createdById, targetUrl, displayName, status, concurrency, keywords, runCount, createdAt, updatedAt) VALUES
            ('wscrawltaskother000001', 'wsorgother00000000001', '{admin}', 'https://example.com/other-task', 'Other Org Task', 'completed', 1, CAST('[]' AS JSON), 0, '{t30}', '{t30}');
          INSERT INTO CrawlResult (id, taskId, orgId, sourceUrl, fetchedAt, markdownRef, contentHash, metadata, createdAt) VALUES
            ('wscrawlresult00000001', 'wscrawltask0000000001', '{org}', 'https://example.com/smoke-a', '{t60}', 'smoke-md-a', 'smoke-content-a', NULL, '{t60}');
          """)

          # 夹具自检：证明被测的两个「假 admin」场景真的成立，避免断言
          # 因夹具缺失而假通过。
          custom_role = sql("SELECT name, isSystem FROM Role WHERE id='wsrolecustomadmin001'").split("\t")
          if custom_role[:2] != ["admin", "0"]:
              fail("custom admin role fixture " + repr(custom_role))
          borrowed_role = sql("SELECT orgId, isSystem, LOWER(name) FROM Role WHERE id='wsrolebadmin0000000001'").split("\t")
          if borrowed_role != ["wsorgother00000000001", "1", "admin"]:
              fail("borrowed admin role fixture " + repr(borrowed_role))
          borrowed_links = sql("SELECT COUNT(*) FROM MembershipRole WHERE membershipId='wsmemforeign0000000001' AND roleId='wsrolebadmin0000000001'")
          if borrowed_links != "1":
              fail("borrowed membership role fixture " + repr(borrowed_links))
          if sql("SELECT orgId FROM Role WHERE id='wsrolecustomadmin001'") != "wsorgcustom0000000001":
              fail("custom admin role must live in the custom admin org")

          link = {
              "href": "https://example.com/link-1",
              "text": "Link 1",
              "title": "Link One",
              "baseDomain": "example.com",
              "rel": "nofollow",
              "type": "external",
              "intrinsicScore": 0.5,
