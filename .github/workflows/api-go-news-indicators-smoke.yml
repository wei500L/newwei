# 新闻指标关联分析的真实栈验收。不进普通 CI。
# PR 上加 label api-go-news-indicators-smoke，或 workflow_dispatch。
# SCHEDULE_ENABLED 保持 false。不请求 AkShare/crawl4ai；不把抓取、模型、
# AkShare 或 Nominatim 当通过。
name: api-go-news-indicators-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-news-indicators-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-news-indicators-smoke@example.com
  SMTP_PASS: api-go-news-indicators-smoke-smtp-not-connected
  JWT_SECRET: c1f4a9e8d2b3706f5a1c8e9d4b2a7f6038e5d1c9a7b6f4e2d3c8a1b5f9e0d7c2
  NEXTAUTH_SECRET: e2b5c1f8a9d3b47e60d4a1f8c3b5e79d02c1f4a9e8d2b3706f5a1c8e9d4b2a7f6
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  SEED_ORG_SLUG: api-go-news-indicators-smoke-org
  SEED_ORG_NAME: api-go News Indicators Smoke Org
  SEED_ADMIN_EMAIL: api-go-news-indicators-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: ApiGoNewsInd#2026-Ci
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-news-indicators-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-news-indicators-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-news-ind:ci .
      - name: Exercise news indicator routes
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import datetime, hashlib, json, os, signal, subprocess, threading, time, urllib.error, urllib.request

          nest = "http://127.0.0.1:4000"
          go = "http://127.0.0.1:4020"
          org = "ni-org-smoke-000000000001"
          other = "ni-org-other-000000000001"
          item_id = "ni-item-smoke-000000000001"
          base = "/api/news-indicator"
          refresh = base + "/refresh"
          list_path = base + "/associations"

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def sql(statement):
              cid = subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=mysql:8.4"], text=True).split()[0]
              proc = subprocess.run(["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "app"], input=statement, text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(proc.stderr or proc.stdout)
              return proc.stdout.strip()

          def scalar(statement):
              lines = [line.strip() for line in sql(statement).splitlines() if line.strip()]
              return lines[-1] if lines else ""

          def start_go(news_mode, graphql_read_mode):
              subprocess.run(["docker", "rm", "-f", "api-go-news-ind"], check=False, capture_output=True)
              env = [
                  "PORT=4020",
                  "LEGACY_API_URL=http://host.docker.internal:4000",
                  "DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app",
                  "MONGO_URI=mongodb://host.docker.internal:27017/app",
                  f"API_GO_NEWS_INDICATORS_MODE={news_mode}",
                  f"API_GO_GRAPHQL_READ_MODE={graphql_read_mode}",
                  "API_GO_GRAPHQL_NEWS_EVENTS_MODE=legacy",
                  "API_GO_CRAWL_TEMPLATES_MODE=legacy",
                  "API_GO_CRAWL_PROFILES_MODE=legacy",
                  "API_GO_CRAWL_WORKFLOWS_MODE=legacy",
                  "API_GO_NEWS_SOURCES_MODE=legacy",
                  "API_GO_SITUATION_MONITORS_MODE=legacy",
                  "API_GO_CONTENT_SUBSCRIPTIONS_MODE=legacy",
                  "API_GO_USER_NEWS_BEHAVIOR_MODE=legacy",
                  "API_GO_USER_DIGEST_MODE=legacy",
                  "API_GO_DASHBOARD_STATS_MODE=legacy",
                  "API_GO_DASHBOARD_CHARTS_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_GEO_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE=legacy",
                  "API_GO_DASHBOARD_STREAM_MODE=legacy",
                  "API_GO_HEALTHZ_MODE=legacy",
                  "API_GO_PUBLIC_PORTAL_MODE=legacy",
                  "API_GO_ANALYSIS_VIEWS_MODE=legacy",
                  "API_GO_ANALYSIS_BOARDS_MODE=legacy",
                  "API_GO_ANALYSIS_THREADS_MODE=legacy",
                  "API_GO_ADMIN_LOGS_MODE=legacy",
                  "API_GO_LLM_LOGS_MODE=legacy",
                  "API_GO_RBAC_MODE=legacy",
                  "API_GO_USER_SETTINGS_WRITE_MODE=legacy",
                  "REALTIME_SIGNALS_ENABLED=false",
                  "ELASTICSEARCH_ENABLED=false",
                  "MODEL_SERVICE_ENABLED=false",
                  "SCHEDULE_ENABLED=false",
                  f"JWT_SECRET={os.environ['JWT_SECRET']}",
                  f"JWT_ISSUER={os.environ['JWT_ISSUER']}",
                  f"JWT_AUDIENCE={os.environ['JWT_AUDIENCE']}",
                  "REDIS_HOST=host.docker.internal",
                  "REDIS_PORT=6379",
                  "CANARY_PERCENT=0",
                  f"CORS_ORIGIN={os.environ['CORS_ORIGIN']}",
              ]
              cmd = ["docker", "run", "-d", "--name", "api-go-news-ind",
                     "--add-host=host.docker.internal:host-gateway",
                     "--health-interval", "5s", "--health-timeout", "3s", "--health-retries", "20", "--health-start-period", "5s",
                     "-p", "127.0.0.1:4020:4020"]
              for entry in env:
                  cmd.extend(["-e", entry])
              cmd.append("api-go-news-ind:ci")
              subprocess.check_call(cmd)
              for _ in range(30):
                  status = subprocess.check_output(["docker", "inspect", "--format", "{{.State.Health.Status}}", "api-go-news-ind"], text=True).strip()
                  print("health", status, "newsMode", news_mode, "graphqlRead", graphql_read_mode)
                  if status == "healthy":
                      return
                  if status == "unhealthy":
                      fail(subprocess.check_output(["docker", "logs", "api-go-news-ind"], text=True)[-4000:])
                  time.sleep(2)
              fail(subprocess.check_output(["docker", "logs", "api-go-news-ind"], text=True)[-4000:])

          def call(base_url, path, method="GET", token=None, payload=None, timeout=60):
              headers = {}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(base_url + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          def body(raw):
              if not raw:
                  return None
              text = raw.decode("utf-8", "replace").strip()
              if not text:
                  return None
              return json.loads(text)

          def core(value):
              if isinstance(value, dict):
                  return {key: core(item) for key, item in value.items() if key not in ("traceId", "timestamp")}
              if isinstance(value, list):
                  return [core(item) for item in value]
              return value

          def message(raw):
              doc = body(raw) or {}
              text = doc.get("message")
              if isinstance(text, list):
                  return "; ".join(str(item) for item in text)
              return text

          def login(email):
              status, raw = call(nest, "/api/auth/login", "POST", payload={"email": email, "password": os.environ["SEED_ADMIN_PASSWORD"]})
              doc = body(raw)
              if status not in (200, 201) or not doc or not doc.get("accessToken"):
                  fail(f"login {email} {status} {raw[:400]!r}")
              return doc["accessToken"]

          def same(path, method="GET", token=None, payload=None):
              left_status, left_raw = call(nest, path, method, token, payload)
              right_status, right_raw = call(go, path, method, token, payload)
              if left_status != right_status or core(body(left_raw)) != core(body(right_raw)):
                  fail(f"parity {method} {path} nest={left_status} {left_raw[:500]!r} go={right_status} {right_raw[:500]!r}")
              return left_status, body(left_raw)

          def gql(base_url, token, query, variables=None):
              payload = {"query": query}
              if variables is not None:
                  payload["variables"] = variables
              return call(base_url, "/graphql", "POST", token, payload)

          def gql_same(token, query, variables=None):
              ls, lr = gql(nest, token, query, variables)
              rs, rr = gql(go, token, query, variables)
              if ls != rs or core(body(lr)) != core(body(rr)):
                  fail(f"graphql parity nest={ls} {lr[:600]!r} go={rs} {rr[:600]!r}")
              return body(lr)

          list_query = """
          query ListNI {
            newsIndicatorAssociations {
              id scopeType scopeKey scopeKeyType featureMetric windowDays lagDays correlation pValue
              sampleSize analyzedStartAt analyzedEndAt lastEvaluatedAt metadata
              indicator { slug displayName groupLabel defaultUnit metadata }
              latestBacktest { id status windowStart windowEnd config metrics error createdAt updatedAt }
            }
          }
          """
          detail_query = """
          query DetailNI($id: String!) {
            newsIndicatorAssociation(id: $id) {
              id scopeType scopeKey featureMetric
              backtests { id status createdAt }
              latestBacktest { id status metrics }
              indicator { slug }
            }
          }
          """

          admin = scalar("SELECT id FROM User WHERE email='api-go-news-indicators-smoke-admin@example.com'")
          read_perm = scalar("SELECT id FROM Permission WHERE name='dashboards.read'")
          write_perm = scalar("SELECT id FROM Permission WHERE name='settings.manage'")

          def day(offset):
              return (datetime.datetime.now(datetime.timezone.utc).date() - datetime.timedelta(days=offset)).isoformat()

          settings_value = json.dumps({
              "enabled": True, "windowDays": 60, "minSampleSize": 10,
              "backtestBaselineDays": 10, "backtestHoldoutDays": 10, "indicatorSlugs": ["smoke-cpi"],
          })
          economic_rows = []
          for i in range(45):
              economic_rows.append(f"('ni-econ-{i:04d}', '{item_id}', '{day(44 - i)} 00:00:00.000', 'price', {100 + 5 * i}, NULL, 'close', NULL, NOW(3))")
          entity_rows = []
          for i in range(35):
              docs = 10 + i
              entity_rows.append(f"('ni-ent-{i:04d}', '{org}', 'SMOKE_ENTITY', 'company', '{day(34 - i)} 00:00:00.000', {docs}, 0, 0, {docs}, 0, 0, 0, NULL, NOW(3), NOW(3))")
          sql(f"""
          INSERT INTO Org (id, name, slug, isActive, createdAt, updatedAt) VALUES
            ('{org}', 'News Indicators Smoke', 'news-indicators-smoke', 1, NOW(3), NOW(3)),
            ('{other}', 'News Indicators Other', 'news-indicators-other', 1, NOW(3), NOW(3));
          INSERT INTO Role (id, name, isSystem, orgId) VALUES
            ('ni-role-writer-000000000001', 'ni-writer', 0, '{org}'),
            ('ni-role-reader-000000000001', 'ni-reader', 0, '{org}'),
            ('ni-role-other-0000000000001', 'ni-other', 0, '{other}');
          INSERT INTO RolePermission (id, roleId, permissionId) VALUES
            ('ni-rp-writer-read-00000001', 'ni-role-writer-000000000001', '{read_perm}'),
            ('ni-rp-writer-write-0000001', 'ni-role-writer-000000000001', '{write_perm}'),
            ('ni-rp-reader-read-00000001', 'ni-role-reader-000000000001', '{read_perm}'),
            ('ni-rp-other-read-00000001', 'ni-role-other-0000000000001', '{read_perm}'),
            ('ni-rp-other-write-000001', 'ni-role-other-0000000000001', '{write_perm}');
          INSERT INTO SystemSetting (`key`, value, isPublic, description, createdAt, updatedAt) VALUES
            ('news_indicator_association_settings:{org}', '{settings_value}', 0, 'news indicators smoke settings', NOW(3), NOW(3));
          INSERT INTO EconomicDataItem (id, slug, displayName, groupLabel, description, sourceFunction, sourceEndpoint, sourceDocUrl, valueType, defaultUnit, defaultFrequency, responseAdapter, isActive, metadata, createdAt, updatedAt) VALUES
            ('{item_id}', 'smoke-cpi', 'Smoke CPI', NULL, NULL, 'get_cpi', 'cpi', NULL, 'price', NULL, 'daily', NULL, 1, NULL, NOW(3), NOW(3));
          INSERT INTO EconomicDataPoint (id, itemId, recordedAt, dataType, value, unit, sourceField, sourceMeta, createdAt) VALUES
            {",".join(economic_rows)};
          INSERT INTO EntitySentimentSnapshot (id, orgId, entityName, entityType, bucketStart, totalDocs, negativeDocs, positiveDocs, neutralDocs, scoreSum, avgScore, negativeRatio, evidenceProcessedItemIds, createdAt, updatedAt) VALUES
            {",".join(entity_rows)};
          INSERT INTO EntitySentimentSnapshot (id, orgId, entityName, entityType, bucketStart, totalDocs, negativeDocs, positiveDocs, neutralDocs, scoreSum, avgScore, negativeRatio, evidenceProcessedItemIds, createdAt, updatedAt) VALUES
            ('ni-ent-other-000', '{other}', 'SMOKE_ENTITY', 'company', '{day(1)} 00:00:00.000', 5, 0, 0, 5, 0, 0, 0, NULL, NOW(3), NOW(3));
          """)

          users = [
              ("ni-user-writer-000000000001", "ni-writer@example.com", org, "ni-role-writer-000000000001"),
              ("ni-user-reader-000000000001", "ni-reader@example.com", org, "ni-role-reader-000000000001"),
              ("ni-user-other-0000000000001", "ni-other@example.com", other, "ni-role-other-0000000000001"),
          ]
          for user_id, email, user_org, role_id in users:
              sql(f"""
              INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
              SELECT '{user_id}', '{email}', passwordHash, 'Smoke', 'User', 1, NOW(3), NOW(3), NOW(3)
              FROM User WHERE id = '{admin}';
              INSERT INTO Membership (id, userId, orgId, roleId, isActive, createdAt)
              VALUES ('m{user_id[1:]}', '{user_id}', '{user_org}', '{role_id}', 1, NOW(3));
              """)

          machine_read = "mtk_smoke_news_ind_read_only_token"
          machine_write = "mtk_smoke_news_ind_read_write_token"
          sql(f"""
          INSERT INTO MachineAccessToken (id, orgId, name, tokenHash, permissions, createdAt, updatedAt) VALUES
            ('ni-mtok-read-000000000001', '{org}', 'ni read only', '{hashlib.sha256(machine_read.encode()).hexdigest()}', '["dashboards.read"]', NOW(3), NOW(3)),
            ('ni-mtok-write-00000000001', '{org}', 'ni read write', '{hashlib.sha256(machine_write.encode()).hexdigest()}', '["dashboards.read","settings.manage"]', NOW(3), NOW(3));
          """)

          # ---- 阶段 1：开关 legacy，全部经 Go 代理，Nest 是唯一执行者 ----
          start_go("legacy", "legacy")
          tokens = {email: login(email) for _, email, _, _ in users}
          writer = tokens["ni-writer@example.com"]
          reader = tokens["ni-reader@example.com"]
          outsider = tokens["ni-other@example.com"]

          status, raw = call(go, refresh, "POST", writer)
          doc = body(raw)
          if status != 201 or not doc:
              fail(f"legacy refresh {status} {raw[:300]!r}")
          if doc.get("indicators") != 1 or doc.get("associationsUpserted", 0) < 1:
              fail(f"legacy refresh counts {doc}")

          status, listing = same(list_path, "GET", writer)
          if status != 200 or not isinstance(listing, list) or not listing:
              fail(f"legacy list parity {status} {listing}")
          assoc_id = listing[0]["id"]

          same(list_path + "/" + assoc_id, "GET", writer)
          detail_legacy = gql_same(writer, detail_query, {"id": assoc_id})
          if detail_legacy["data"]["newsIndicatorAssociation"] is None:
              fail("legacy graphql detail was null")
          gql_same(writer, list_query)

          zero = body(call(go, list_path + "/" + assoc_id + "?backtestsLimit=0", "GET", writer)[1])
          if "backtests" in zero:
              fail("backtestsLimit=0 still returned backtests")
          one = body(call(go, list_path + "/" + assoc_id + "?backtestsLimit=1", "GET", writer)[1])
          if not isinstance(one.get("backtests"), list) or len(one["backtests"]) != 1:
              fail(f"backtestsLimit=1 {one.get('backtests')}")
          print("legacy proxy ok")

          # ---- 阶段 2：开关 go（Nest 仍在运行）----
          start_go("go", "go")

          same(list_path, "GET", writer)
          same(list_path + "/" + assoc_id, "GET", writer)
          gql_same(writer, list_query)
          gql_same(writer, detail_query, {"id": assoc_id})

          # 非法 scopeType/featureMetric 返回 200，不报 400。
          status, raw = call(go, list_path + "?scopeType=INVALID&featureMetric=INVALID", "GET", writer)
          if status != 200 or not isinstance(body(raw), list):
              fail(f"invalid enums {status} {raw[:300]!r}")

          # 清空该组织的关联与回测后并发刷新。
          sql(f"DELETE FROM NewsIndicatorAssociationBacktestRun WHERE orgId='{org}'; DELETE FROM NewsIndicatorAssociation WHERE orgId='{org}';")
          results = []
          lock = threading.Lock()
          def do_refresh():
              outcome = call(go, refresh, "POST", writer)
              with lock:
                  results.append(outcome)
          threads = [threading.Thread(target=do_refresh) for _ in range(2)]
          for thread in threads:
              thread.start()
          for thread in threads:
              thread.join()
          if len(results) != 2 or any(status != 201 for status, _ in results):
              fail(f"concurrent refresh {[ (s, r[:200]) for s, r in results ]}")
          assoc_count = scalar(f"SELECT COUNT(*) FROM NewsIndicatorAssociation WHERE orgId='{org}'")
          if assoc_count != "1":
              fail(f"concurrent refresh created {assoc_count} associations")
          per_assoc = scalar(f"SELECT COUNT(*) FROM NewsIndicatorAssociationBacktestRun b JOIN NewsIndicatorAssociation a ON a.id=b.associationId WHERE a.orgId='{org}'")
          if per_assoc not in ("1", "2"):
              fail(f"concurrent refresh backtests per association = {per_assoc}")
          print("go switch ok")

          # ---- 阶段 3：跨组织隔离与权限 ----
          other_list = body(call(go, list_path, "GET", outsider)[1])
          if other_list != []:
              fail(f"other org list = {other_list}")
          other_detail = call(go, list_path + "/" + assoc_id, "GET", outsider)
          if other_detail[0] != 200 or body(other_detail[1]) is not None:
              fail(f"other org detail {other_detail[0]} {other_detail[1][:200]!r}")
          other_gql = body(gql(go, outsider, detail_query, {"id": assoc_id})[1])
          if other_gql["data"]["newsIndicatorAssociation"] is not None:
              fail(f"other org graphql detail {other_gql}")

          if call(go, list_path, "GET", reader)[0] != 200:
              fail("reader list was not 200")
          if call(go, list_path + "/" + assoc_id, "GET", reader)[0] != 200:
              fail("reader detail was not 200")
          status, raw = call(go, refresh, "POST", reader)
          if status != 403:
              fail(f"reader refresh was not 403: {status} {raw[:200]!r}")
          if call(go, list_path, "GET", machine_read)[0] != 200:
              fail("read-only machine token list was not 200")
          if call(go, refresh, "POST", machine_read)[0] != 403:
              fail("read-only machine token refresh was not 403")
          if call(go, refresh, "POST", machine_write)[0] != 201:
              fail("read-write machine token refresh was not 201")
          print("isolation and permissions ok")

          # ---- 阶段 4：停止 Nest，Go 仍可读三个 HTTP 与两个 GraphQL，mutation 为 502 ----
          if os.path.exists("/tmp/api-nestjs.pid"):
              os.kill(int(open("/tmp/api-nestjs.pid").read().strip()), signal.SIGTERM)
          subprocess.run(["pkill", "-f", "apps/api/dist/main.js"], check=False)
          subprocess.run(["pkill", "-f", "node dist/main.js"], check=False)
          stopped = False
          for _ in range(30):
              try:
                  urllib.request.urlopen(nest + "/api/healthz/live", timeout=2).read()
              except Exception:
                  stopped = True
                  break
              time.sleep(1)
          if not stopped:
              fail("nestjs did not stop")

          if call(go, list_path, "GET", writer)[0] != 200:
              fail("list after nest stop was not 200")
          if call(go, list_path + "/" + assoc_id, "GET", writer)[0] != 200:
              fail("detail after nest stop was not 200")
          if call(go, refresh, "POST", writer)[0] != 201:
              fail("refresh after nest stop was not 201")
          gql_list = body(gql(go, writer, list_query)[1])
          if not gql_list.get("data", {}).get("newsIndicatorAssociations"):
              fail(f"graphql list after nest stop {gql_list}")
          gql_detail = body(gql(go, writer, detail_query, {"id": assoc_id})[1])
          if gql_detail.get("data", {}).get("newsIndicatorAssociation") is None:
