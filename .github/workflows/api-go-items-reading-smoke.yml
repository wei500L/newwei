# 条目阅读（items reading）真实栈验收。不进普通 CI。
# PR 上加 label api-go-items-reading-smoke，或 workflow_dispatch。
# SCHEDULE_ENABLED 保持 false。不请求 crawl4ai/AkShare/翻译上游；
# ELASTICSEARCH_ENABLED / VECTOR_SERVICE_ENABLED / MODEL_SERVICE_ENABLED 全程 false——
# 只断言文档化的降级路径（词法建议、列表/分面仍成功），不宣称模型/向量/ES 成功。
name: api-go-items-reading-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-items-reading-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-items-reading-smoke@example.com
  SMTP_PASS: api-go-items-reading-smoke-smtp-not-connected
  JWT_SECRET: d3a7b1e9c5f2408a6b9d2e4f7a1c8b3065e9d4b2a7f6038e5d1c9a7b6f4e2d3c
  NEXTAUTH_SECRET: f4c2a8e1b7d3509a7c0e3f5a8b2d9c4176f0e5c3b8a7149f6e2d0b8c7a5f3e4d
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  SEED_ORG_SLUG: api-go-items-reading-smoke-org
  SEED_ORG_NAME: api-go Items Reading Smoke Org
  SEED_ADMIN_EMAIL: api-go-items-reading-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: ApiGoItemsReading#2026-Ci
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-items-reading-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-items-reading-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-items-reading:ci .
      - name: Exercise item reading routes
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import datetime, json, os, signal, subprocess, time, urllib.error, urllib.parse, urllib.request

          nest = "http://127.0.0.1:4000"
          go = "http://127.0.0.1:4020"
          container = "api-go-items-reading"
          image = "api-go-items-reading:ci"

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def phase(title):
              print("=== PHASE", title, "===")

          def oid(ch, suffix):
              return (ch * 24)[: 24 - len(suffix)] + suffix

          def now_utc():
              return datetime.datetime.now(datetime.timezone.utc)

          BASE_DAY = now_utc()

          def mts(offset_days):
              return (BASE_DAY + datetime.timedelta(days=offset_days)).strftime("%Y-%m-%d %H:%M:%S.000")

          def its(offset_days):
              return (BASE_DAY + datetime.timedelta(days=offset_days)).strftime("%Y-%m-%dT%H:%M:%S.000Z")

          # ---------- host process helpers ----------

          def docker_ps(ancestor):
              out = subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=" + ancestor], text=True).split()
              if not out:
                  fail("no container for " + ancestor)
              return out[0]

          def mysql_container():
              return docker_ps("mysql:8.4")

          def mongo_container():
              return docker_ps("mongo:7.0")

          def redis_container():
              return docker_ps("redis:7.2")

          def sql(statement):
              proc = subprocess.run(
                  ["docker", "exec", "-i", mysql_container(), "mysql", "-uroot", "-psecret", "-N", "app"],
                  input=statement, text=True, capture_output=True)
              if proc.returncode != 0:
                  details = (proc.stderr or "") + (proc.stdout or "")
                  fail("mysql: " + details + "\n--- statement head ---\n" + statement[:1200]
                       + "\n--- statement tail ---\n" + statement[-600:])
              return proc.stdout.strip()

          def scalar(statement):
              lines = [line.strip() for line in sql(statement).splitlines() if line.strip()]
              return lines[-1] if lines else ""

          class Oid:
              def __init__(self, value):
                  self.value = value

          class JsDate:
              def __init__(self, value):
                  self.value = value

          def js(value):
              if isinstance(value, Oid):
                  return "ObjectId(" + json.dumps(value.value) + ")"
              if isinstance(value, JsDate):
                  return "new Date(" + json.dumps(value.value) + ")"
              if isinstance(value, dict):
                  return "{" + ",".join(json.dumps(str(k)) + ":" + js(v) for k, v in value.items()) + "}"
              if isinstance(value, list):
                  return "[" + ",".join(js(v) for v in value) + "]"
              if isinstance(value, bool):
                  return "true" if value else "false"
              if value is None:
                  return "null"
              if isinstance(value, (int, float)):
                  return repr(value)
              return json.dumps(value)

          def mongo(script):
              proc = subprocess.run(
                  ["docker", "exec", "-i", mongo_container(), "mongosh", "app", "--quiet", "--eval", script],
                  text=True, capture_output=True)
              if proc.returncode != 0:
                  fail("mongosh: " + (proc.stderr or proc.stdout))
              return proc.stdout.strip()

          def mongo_insert(collection, docs):
              if docs:
                  mongo("db.getCollection(" + json.dumps(collection) + ").insertMany(" + js(docs) + ");")

          def redis(*args):
              proc = subprocess.run(
                  ["docker", "exec", redis_container(), "redis-cli", "--raw"] + list(args),
                  text=True, capture_output=True)
              if proc.returncode != 0:
                  fail("redis: " + (proc.stderr or proc.stdout))
              return proc.stdout.strip()

          def redis_keys(pattern):
              return [line for line in redis("KEYS", pattern).splitlines() if line.strip()]

          def redis_del_pattern(pattern):
              keys = redis_keys(pattern)
              if keys:
                  redis("DEL", *keys)

          # ---------- HTTP helpers (urllib only; no curl) ----------

          def call(base_url, path, method="GET", token=None, payload=None, timeout=60):
              headers = {}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(base_url + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          def body(raw):
              if not raw:
                  return None
              text = raw.decode("utf-8", "replace").strip()
              if not text:
                  return None
              return json.loads(text)

          def core(value):
              if isinstance(value, dict):
                  return {key: core(item) for key, item in value.items() if key not in ("traceId", "timestamp", "locations", "path")}
              if isinstance(value, list):
                  return [core(item) for item in value]
              return value

          def message(raw):
              doc = body(raw) or {}
              text = doc.get("message")
              if isinstance(text, list):
                  return "; ".join(str(item) for item in text)
              return text

          def login(email, password=None):
              status, raw = call(nest, "/api/auth/login", "POST", payload={
                  "email": email,
                  "password": password or os.environ["SEED_ADMIN_PASSWORD"],
              })
              doc = body(raw)
              if status not in (200, 201) or not doc or not doc.get("accessToken"):
                  fail("login " + email + " " + str(status) + " " + repr(raw[:400]))
              return doc["accessToken"]

          def same(path, method="GET", token=None, payload=None):
              left_status, left_raw = call(nest, path, method, token, payload)
              right_status, right_raw = call(go, path, method, token, payload)
              if left_status != right_status or core(body(left_raw)) != core(body(right_raw)):
                  fail("rest parity " + method + " " + path + " nest=" + str(left_status) + " " + repr(left_raw[:500]) +
                       " go=" + str(right_status) + " " + repr(right_raw[:500]))
              return left_status, body(left_raw)

          def detail_projection(doc):
              if not isinstance(doc, dict):
                  return doc
              meta = doc.get("itemMeta") or {}
              raw = doc.get("rawItem")
              processed = doc.get("processed")
              out = {"itemMeta": {key: meta.get(key) for key in ("id", "orgId", "externalId", "name", "status", "mongoRef")}}
              if isinstance(raw, dict):
                  out["rawItem"] = {key: raw.get(key) for key in ("_id", "itemMetaId", "payload", "source")}
              else:
                  out["rawItem"] = raw
              if isinstance(processed, dict):
                  out["processed"] = {key: processed.get(key) for key in ("_id", "itemMetaId", "status", "tags", "createdAt")}
                  out["processedResult"] = processed.get("result")
              else:
                  out["processed"] = processed
                  out["processedResult"] = None
              return out

          def detail_same(path, token):
              left_status, left_raw = call(nest, path, "GET", token)
              right_status, right_raw = call(go, path, "GET", token)
              if left_status != right_status or detail_projection(body(left_raw)) != detail_projection(body(right_raw)):
                  fail("detail parity " + path + " nest=" + str(left_status) + " " + repr(left_raw[:600]) +
                       " go=" + str(right_status) + " " + repr(right_raw[:600]))
              return right_status, body(right_raw)

          def gql(base_url, token, query, variables=None):
              payload = {"query": query}
              if variables is not None:
                  payload["variables"] = variables
              return call(base_url, "/graphql", "POST", token, payload)

          def gql_doc(base_url, token, query, variables=None):
              status, raw = gql(base_url, token, query, variables)
              return status, body(raw)

          def gql_same(token, query, variables=None, label=""):
              ls, lr = gql(nest, token, query, variables)
              rs, rr = gql(go, token, query, variables)
              if ls != rs or core(body(lr)) != core(body(rr)):
                  fail("graphql parity " + label + " nest=" + str(ls) + " " + repr(lr[:700]) +
                       " go=" + str(rs) + " " + repr(rr[:700]))
              return body(lr)

          def stats(base_url=go):
              status, raw = call(base_url, "/__go/graphql-read-stats")
              doc = body(raw) or {}
              if status != 200:
                  fail("graphql-read-stats " + str(status) + " " + repr(raw[:200]))
              return doc.get("resolverCalls") or 0

          # ---------- docker run / health ----------

          LEGACY_SWITCHES = [
              "API_GO_GRAPHQL_NEWS_EVENTS_MODE",
              "API_GO_CRAWL_TEMPLATES_MODE",
              "API_GO_CRAWL_PROFILES_MODE",
              "API_GO_CRAWL_WORKFLOWS_MODE",
              "API_GO_CRAWL_FRONTIER_RUNS_MODE",
              "API_GO_NEWS_SOURCES_MODE",
              "API_GO_SITUATION_MONITORS_MODE",
              "API_GO_CONTENT_SUBSCRIPTIONS_MODE",
              "API_GO_USER_NEWS_BEHAVIOR_MODE",
              "API_GO_USER_DIGEST_MODE",
              "API_GO_DASHBOARD_STATS_MODE",
              "API_GO_DASHBOARD_CHARTS_MODE",
              "API_GO_DASHBOARD_WAR_MAP_MODE",
              "API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE",
              "API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE",
              "API_GO_DASHBOARD_SPACETIME_GEO_MODE",
              "API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE",
              "API_GO_DASHBOARD_STREAM_MODE",
              "API_GO_HEALTHZ_MODE",
              "API_GO_PUBLIC_PORTAL_MODE",
              "API_GO_ANALYSIS_VIEWS_MODE",
              "API_GO_ANALYSIS_BOARDS_MODE",
              "API_GO_ANALYSIS_THREADS_MODE",
              "API_GO_RBAC_MODE",
              "API_GO_GRAPHQL_WORKSPACE_READ_MODE",
              "API_GO_GRAPHQL_SETTINGS_CRAWL_READ_MODE",
              "API_GO_NEWS_INDICATORS_MODE",
              "API_GO_QUALITY_OVERVIEW_MODE",
              "API_GO_CLASSIFICATION_RSS_OPS_MODE",
              "API_GO_NEWSNOW_CLUSTERING_OPS_MODE",
              "API_GO_CRAWL_READ_TELEMETRY_MODE",
              "API_GO_RUNTIME_SETTINGS_MODE",
              "API_GO_ADMIN_LOGS_MODE",
              "API_GO_LLM_LOGS_MODE",
              "API_GO_MODEL_ACCESS_SETTINGS_MODE",
              "API_GO_INFRASTRUCTURE_SETTINGS_MODE",
              "API_GO_PLATFORM_GOVERNANCE_SETTINGS_MODE",
              "API_GO_SITUATION_MONITOR_SIGNALS_MODE",
              "API_GO_GRAPHQL_KG_IMPACT_MODE",
              "API_GO_GRAPHQL_KNOWLEDGE_GRAPH_MODE",
              "API_GO_USER_SETTINGS_WRITE_MODE",
          ]

          SWITCH_OVERRIDES = {
              "API_GO_ONBOARDING_MODE": "shadow",
              "API_GO_USER_SETTINGS_READ_MODE": "go",
          }

          def docker_run_args(items_mode, graphql_mode, read_model, vector_hard_fail):
              env = [
                  "PORT=4020",
                  "LEGACY_API_URL=http://host.docker.internal:4000",
                  "DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app",
                  "MONGO_URI=mongodb://host.docker.internal:27017/app",
                  "API_GO_ITEMS_READING_MODE=" + items_mode,
                  "API_GO_GRAPHQL_READ_MODE=" + graphql_mode,
                  "ITEMS_READ_MODEL_ENABLED=" + ("true" if read_model else "false"),
                  "ITEMS_VECTOR_HARD_FAIL_ENABLED=" + ("true" if vector_hard_fail else "false"),
                  "REALTIME_SIGNALS_ENABLED=false",
                  "ELASTICSEARCH_ENABLED=false",
                  "VECTOR_SERVICE_ENABLED=false",
                  "MODEL_SERVICE_ENABLED=false",
                  "SCHEDULE_ENABLED=false",
                  "CANARY_PERCENT=0",
                  "JWT_SECRET=" + os.environ["JWT_SECRET"],
                  "JWT_ISSUER=" + os.environ["JWT_ISSUER"],
                  "JWT_AUDIENCE=" + os.environ["JWT_AUDIENCE"],
                  "REDIS_HOST=host.docker.internal",
                  "REDIS_PORT=6379",
                  "CORS_ORIGIN=" + os.environ["CORS_ORIGIN"],
              ]
              for name in LEGACY_SWITCHES:
                  env.append(name + "=legacy")
              for name, value in SWITCH_OVERRIDES.items():
                  env.append(name + "=" + value)
              cmd = ["docker", "run", "-d", "--name", container,
                     "--add-host=host.docker.internal:host-gateway",
                     "--health-interval", "5s", "--health-timeout", "3s",
                     "--health-retries", "20", "--health-start-period", "5s",
                     "-p", "127.0.0.1:4020:4020"]
              for entry in env:
                  cmd.extend(["-e", entry])
              cmd.append(image)
              return cmd

          def go_logs():
              proc = subprocess.run(["docker", "logs", container], text=True, capture_output=True)
              return (proc.stdout or "") + (proc.stderr or "")

          def inspect_state():
              proc = subprocess.run(
                  ["docker", "inspect", "--format",
                   "{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|{{.State.ExitCode}}",
                   container], text=True, capture_output=True)
              if proc.returncode != 0:
                  return None
              return proc.stdout.strip()

          def start_go(items_mode, graphql_mode, read_model, vector_hard_fail):
              subprocess.run(["docker", "rm", "-f", container], check=False, capture_output=True)
              subprocess.check_call(docker_run_args(items_mode, graphql_mode, read_model, vector_hard_fail))
              for _ in range(40):
                  state = inspect_state()
                  print("health", state, "itemsMode", repr(items_mode), "graphqlRead", repr(graphql_mode),
                        "readModel", read_model, "vectorHardFail", vector_hard_fail)
                  if state is None:
                      fail("container disappeared during startup\n" + go_logs()[-4000:])
                  status, health, _ = state.split("|")
                  if health == "healthy":
                      return
                  if health == "unhealthy":
                      fail(go_logs()[-4000:])
                  if status == "exited":
                      fail(go_logs()[-4000:])
                  time.sleep(2)
              fail(go_logs()[-4000:])

          def start_go_expect_failure(items_mode):
              subprocess.run(["docker", "rm", "-f", container], check=False, capture_output=True)
              proc = subprocess.run(docker_run_args(items_mode, "legacy", False, False), text=True, capture_output=True)
              if proc.returncode != 0:
                  fail("docker run rejected: " + (proc.stderr or proc.stdout))
              for _ in range(40):
                  state = inspect_state()
                  if state is None:
                      return
                  status, health, _ = state.split("|")
                  if health == "unhealthy" or status == "exited":
                      return
                  time.sleep(1)
              fail("invalid API_GO_ITEMS_READING_MODE did not fail the container; state=" + str(state))

          # ---------- identities / fixture ids ----------

          ORG_A = "ir-org-a-00000000000001"
          ORG_B = "ir-org-b-00000000000001"
          ORG_C = "ir-org-c-00000000000001"

          RAW_NORMAL = oid("a", "01")
          RAW_DUP = oid("a", "02")
          RAW_NULLPAYLOAD = oid("a", "03")
          RAW_LATE = oid("a", "04")
          RAW_RM = oid("a", "11")
          RAW_X1 = oid("c", "01")
          RAW_X2 = oid("c", "02")
          RAW_B_LEAK = oid("b", "01")
          RAW_B_NORMAL = oid("b", "02")
          RAW_B_IR3 = oid("b", "03")

          ITEM_NORMAL = "ir-item-a-normal-0000000001"
          ITEM_DUP = "ir-item-a-dup-000000000002"
          ITEM_CROSS1 = "ir-item-a-cross-0000000003"
          ITEM_CROSS2 = "ir-item-a-cross2-000000004"
          ITEM_BADREF = "ir-item-a-badref-0000000009"
          ITEM_NULLPAYLOAD = "ir-item-a-nullpayload-0010"
          ITEM_ORDER_LOW = "ir-item-a-order-0000000005"
          ITEM_ORDER_HIGH = "ir-item-a-order-0000000006"
          ITEM_CROSSED_C = "ir-item-a-crossed-00000007"
          ITEM_CROSSED_S = "ir-item-a-crossed-00000008"
          ITEM_NORAW = "ir-item-a-noraw-00000000012"
          ITEM_LATE = "ir-item-a-late-00000000011"
          ITEM_IR3 = "ir-item-a-ir3-000000000013"
          ITEM_IR3_DUP = "ir-item-a-ir3dup-0000000014"
          ITEM_PROC = "ir-item-a-processed-000015"
          ITEM_EVENT = "ir-item-a-event-00000000016"
          ITEM_EVENT_FB = "ir-item-a-eventfb-0000000017"
          ITEM_RM = "ir-item-a-readmodel-0000019"
          ITEM_B_NORMAL = "ir-item-b-normal-0000000001"
          ITEM_B_IR3 = "ir-item-b-ir3-000000000002"
          ITEM_MISSING = "ir-item-a-missing-000000018"

          PI_NORMAL = oid("d", "01")
          PI_DUP = oid("d", "02")
          PI_B_LATEST = oid("e", "01")
          PI_B_LEAK = oid("e", "02")
          PI_PROC_COMPLETED = oid("d", "03")
          PI_PROC_FAILED = oid("d", "04")
          PI_PROC_PROCESSING = oid("d", "05")
          PI_RESULT_OBJECT = oid("d", "06")
          PI_RESULT_STRING = oid("d", "07")
          PI_RESULT_NESTED = oid("d", "08")
          PI_RESULT_BLANK = oid("d", "09")
          PI_RESULT_INVALID = oid("d", "0a")
          PI_DUP_OF_A = oid("d", "0b")
          PI_DUP_OF_B = oid("d", "0c")
          PI_IR3 = oid("d", "0d")
          PI_IR3_DUP = oid("d", "0e")
          PI_IR3_BAD_REGION = oid("d", "0f")
          PI_EVENT_DIRECT = oid("d", "10")
          PI_EVENT_FB = oid("d", "11")
          PI_RM = oid("d", "12")
          PI_B_IR3 = oid("e", "03")
          PI_LATE = oid("d", "13")

          SRC_A_IR3 = "ir-src-a-ir3-000000000001"
          SRC_A_ARTICLES = "ir-src-a-articles-00000001"
          SRC_A_PROCESSED = "ir-src-a-processed-000001"
          SRC_A_BOTH = "ir-src-a-both-000000000002"
          SRC_A_ZERO = "ir-src-a-zero-000000000003"
          SRC_A_NONRSS = "ir-src-a-nonrss-0000000004"
          SRC_A_NORMAL = "ir-src-a-normal-0000000005"

          ARTICLE_IR3 = "ir-art-a-ir3-0000000000001"
          ARTICLE_IR3_DUP = "ir-art-a-ir3dup-0000000002"
          PA_IR3 = "ir-pa-a-ir3-00000000000001"
          PA_IR3_DUP = "ir-pa-a-ir3dup-00000000002"
          ARTICLE_EVENT_FB = "ir-art-a-eventfb-000000001"
          PA_EVENT_FB = "ir-pa-a-eventfb-00000000001"
          ARTICLE_SRC_ARTICLES = "ir-art-a-srcart-0000000001"
          ARTICLE_SRC_BOTH = "ir-art-a-srcboth-0000000001"
