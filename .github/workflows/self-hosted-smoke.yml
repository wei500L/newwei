name: Self-hosted Smoke

# 仅手动触发。不要挂 pull_request / push：
# 仓库为 public，自托管 runner 执行工作流代码时拥有宿主机权限，
# 若允许 fork PR 触发会构成远程代码执行通道。
on:
  workflow_dispatch:

concurrency:
  group: self-hosted-smoke
  cancel-in-progress: false

jobs:
  # 验证无服务的常规 job：工具链安装、缓存、checkout 是否可用。
  basic:
    runs-on: [self-hosted, linux, build-server]
    timeout-minutes: 15
    steps:
      - name: Host identity
        run: |
          echo "hostname: $(hostname)"
          uname -a
          echo "runner: ${RUNNER_NAME}"
          echo "workspace: ${GITHUB_WORKSPACE}"

      - name: Resource budget
        run: |
          echo "--- cpu ---"; nproc
          echo "--- memory ---"; free -h
          echo "--- disk ---"; df -h "$GITHUB_WORKSPACE"

      - name: Docker availability
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version

      - name: Toolchain baseline (pre-setup)
        run: |
          for b in git node pnpm go docker; do
            printf '%-6s ' "$b"
            command -v "$b" >/dev/null && "$b" --version 2>&1 | head -1 || echo "absent"
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Toolchain after setup
        run: |
          node --version
          pnpm --version
          git --version

  # 验证 CI 真实依赖的 Docker 服务容器路径：GitHub 会把 services
  # 起成同网桥内的容器并映射到宿主机端口，宿主机若已占用同端口则 job 失败。
  services:
    runs-on: [self-hosted, linux, build-server]
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.10.1
        ports:
          - 6333:6333
    steps:
      - name: Service containers reachable on host ports
        run: |
          docker ps --format '{{.Names}}\t{{.Ports}}'
          echo "--- redis ---"
          docker run --rm --network host redis:7.2 redis-cli -h 127.0.0.1 ping
          echo "--- qdrant ---"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6333/healthz >/dev/null 2>&1; then
              echo "qdrant healthy after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:6333/healthz && echo

      - name: Docker build path
        run: |
          mkdir -p /tmp/dockerfile-probe
          printf 'FROM alpine:3.20\nRUN echo self-hosted-docker-ok\n' \
            > /tmp/dockerfile-probe/Dockerfile
          docker build -t probe:self-hosted /tmp/dockerfile-probe
          docker run --rm probe:self-hosted
          docker rmi probe:self-hosted
          rm -rf /tmp/dockerfile-probe
