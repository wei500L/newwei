              except Exception:
                  return {"_raw": text[:500]}
              if isinstance(doc, dict):
                  doc.pop("traceId", None)
                  doc.pop("timestamp", None)
              return doc

          before_stamp = setting_stamp()
          over = b"x" * (10 * 1024 * 1024 + 1)
          status, headers, body = request("PUT", "http://127.0.0.1:4020" + path, over)
          after_stamp = setting_stamp()
