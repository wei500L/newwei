              "/api/user-settings/ui/war-map",
              "/api/user-settings/ui/newsnow",
              "/api/user-settings/ui/situation-monitor",
          ]

          def get(url):
              req = urllib.request.Request(url, headers={
                  "authorization": f"Bearer {token}", "x-trace-id": TRACE})
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      return resp.status, resp.headers, resp.read()
              except urllib.error.HTTPError as err:
                  raise SystemExit(f"GET {url} returned {err.code}: {err.read()[:500]!r}")

          for path in PATHS:
              # 同一 token 分别请求 NestJS 直连与 api-go（Go handler 全响应）。
              # 二者必须逐字段一致（同一条 UserSetting 记录 → updatedAt 也
              # 一致；非确定字段 traceId/timestamp 不在成功响应体里）。
              s_nest, h_nest, b_nest = get(f"http://127.0.0.1:4000{path}")
