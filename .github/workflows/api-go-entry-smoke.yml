              assert "no-store" in (h_nest.get("cache-control") or "").lower(), (path, dict(h_nest))
              assert "no-store" in (h_go.get("cache-control") or "").lower(), (path, dict(h_go))
              assert (h_nest.get("content-type") or "").startswith("application/json"), (path, dict(h_nest))
              assert (h_go.get("content-type") or "").startswith("application/json"), (path, dict(h_go))
              assert h_go.get("x-trace-id") == TRACE, (path, dict(h_go))
              doc_nest, doc_go = json.loads(b_nest), json.loads(b_go)
              assert doc_nest == doc_go, (
                  f"{path}: contract mismatch\n  nestjs: {json.dumps(doc_nest, sort_keys=True)[:2000]}\n"
                  f"  go:     {json.dumps(doc_go, sort_keys=True)[:2000]}")
              assert doc_go.get("version") == 1, (path, doc_go)
              print(f"GET {path}: NestJS 直连 vs api-go(Go handler) 契约一致"
                    "（status/cache-control/content-type/JSON 全等）")

          # situation-monitor 的三段 updatedAt 与三份数据对应正确（Phase A
          # 写入了三段，全都在）+ 各端点读自己的 key（无跨 key 串读已由
          # 逐字段对比覆盖——这里针对三段结构显式断言）。
          s, h, b = get("http://127.0.0.1:4020/api/user-settings/ui/situation-monitor")
          doc = json.loads(b)
          for section in ("monitors", "layout", "settings"):
              assert isinstance(doc.get(section), (dict, list)), (section, doc.get(section))
              assert isinstance(doc.get("updatedAt", {}).get(section), str) and doc["updatedAt"][section], doc
          print("situation-monitor: 三段 updatedAt 与三份数据对应正确")
          PY
          python3 /tmp/smoke_go_get.py

