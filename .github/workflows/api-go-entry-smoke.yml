              print(f"Go error {name} matches Nest baseline status={status}")

          def setting_stamp():
              import os
              import subprocess
              return subprocess.check_output(
                  ["docker", "exec", os.environ["MYSQL_CID"], "mysql", "-uroot", "-psecret", "-N", "-e",
                   "SELECT COUNT(*), COALESCE(GROUP_CONCAT(CONCAT(`key`, '=', updatedAt) ORDER BY `key` SEPARATOR '|'), '') FROM app.UserSetting"],
                  stderr=subprocess.DEVNULL,
