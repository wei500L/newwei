      - name: "Smoke 8c — browser Origin preflight, Go PUT/GET, and a real row"
        run: |
          set -euo pipefail
          MYSQL_CID=$(docker ps -q -f ancestor=mysql:8.4 | head -n1)
          USER_ID=$(docker exec "$MYSQL_CID" mysql -uroot -psecret -N -e \
            "SELECT id FROM app.User WHERE email='${SEED_ADMIN_EMAIL}'" 2>/dev/null)
          ORG_ID=$(docker exec "$MYSQL_CID" mysql -uroot -psecret -N -e \
            "SELECT id FROM app.Org WHERE slug='${SEED_ORG_SLUG}'" 2>/dev/null)
          test -n "$USER_ID" && test -n "$ORG_ID"
          export MYSQL_CID USER_ID ORG_ID
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          ORIGIN = "http://localhost:3000"
          PATH = "/api/user-settings/ui/onboarding"
          token = open("/tmp/smoke-jwt").read().strip()

          def call(method, url, data=None, origin=None, auth=False, preflight=False):
              headers = {}
              if origin:
                  headers["Origin"] = origin
              if auth:
                  headers["authorization"] = f"Bearer {token}"
              if preflight:
                  headers["Access-Control-Request-Method"] = "PUT"
                  headers["Access-Control-Request-Headers"] = "authorization,content-type,x-trace-id"
              elif data is not None:
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, resp.headers, resp.read()
              except urllib.error.HTTPError as err:
                  return err.code, err.headers, err.read()

          def allow_origin(headers):
              return headers.get("access-control-allow-origin")

          status, headers, body = call(
              "OPTIONS", "http://127.0.0.1:4020" + PATH, origin=ORIGIN, preflight=True)
          assert status == 204, (status, body[:200])
          assert allow_origin(headers) == ORIGIN, dict(headers)
          assert headers.get("access-control-allow-credentials") == "true", dict(headers)
          assert "*" not in (allow_origin(headers) or ""), dict(headers)
          assert "PUT" in (headers.get("access-control-allow-methods") or ""), dict(headers)
          assert "authorization" in (headers.get("access-control-allow-headers") or "").lower(), dict(headers)
          assert "origin" in (headers.get("vary") or "").lower(), dict(headers)
          # Nest helmet 会带上 x-frame-options。这里没有，说明预检是 Go 自己回答的。
          assert not headers.get("x-frame-options"), dict(headers)
          print("preflight from web origin -> 204 by Go (no JWT, no x-frame-options)")

          status, headers, body = call(
              "OPTIONS", "http://127.0.0.1:4020" + PATH, origin="https://evil.example", preflight=True)
          assert status == 204, (status, body[:200])
          assert not allow_origin(headers), dict(headers)
          assert allow_origin(headers) != "*", dict(headers)
          print("preflight from an unlisted origin is not reflected")

          status, headers, body = call(
              "PUT", "http://127.0.0.1:4020" + PATH, data=b"{}", origin=ORIGIN)
          assert status == 401, (status, body[:300])
          assert allow_origin(headers) == ORIGIN, dict(headers)
          assert headers.get("access-control-allow-credentials") == "true", dict(headers)
          print("401 without a token still carries the web origin")

          status, headers, body = call(
              "PUT", "http://127.0.0.1:4020" + PATH, data=b"{", origin=ORIGIN, auth=True)
          assert status == 400, (status, body[:300])
          assert allow_origin(headers) == ORIGIN, dict(headers)
          print("400 invalid JSON still carries the web origin")

          payload = json.dumps({"settings": {"dismissed": True, "checklist": {"finance": True}}}).encode()
          status, headers, body = call(
              "PUT", "http://127.0.0.1:4020" + PATH, data=payload, origin=ORIGIN, auth=True)
          assert status == 200, (status, body[:300])
          assert allow_origin(headers) == ORIGIN, dict(headers)
          written = json.loads(body)
          assert written["settings"]["checklist"]["finance"] is True, written
          status, headers, body = call("GET", "http://127.0.0.1:4020" + PATH, origin=ORIGIN, auth=True)
          assert status == 200, (status, body[:300])
          assert allow_origin(headers) == ORIGIN, dict(headers)
          got = json.loads(body)
          assert got == written, (got, written)
          finance = subprocess.check_output(
              ["docker", "exec", os.environ["MYSQL_CID"], "mysql", "-uroot", "-psecret", "-N", "-e",
               "SELECT JSON_EXTRACT(value, '$.checklist.finance') FROM app.UserSetting "
               "WHERE orgId='" + os.environ["ORG_ID"] + "' AND userId='" + os.environ["USER_ID"] +
               "' AND `key`='ui:onboarding:settings:v1'"],
              stderr=subprocess.DEVNULL,
          ).decode().strip()
          assert finance == "true", finance
          print("browser-origin PUT then GET matched, and checklist.finance is true in MySQL")

          restore = json.dumps({"settings": {"dismissed": True}}).encode()
          status, headers, body = call(
              "PUT", "http://127.0.0.1:4020" + PATH, data=restore, origin=ORIGIN, auth=True)
          assert status == 200, (status, body[:300])
          print("onboarding restored to dismissed=true for later phases")
          PY

      # ---- 以下步骤对真实数据库/Redis 做有状态验证，全部先备份、后恢复 ----

      - name: "Smoke 9/13 — no items.read in DB -> 403 on both sides (JWT claim ignored)"
        run: |
          set -euo pipefail
          MYSQL_CID=$(docker ps -q -f ancestor=mysql:8.4 | head -n1)
          REDIS_CID=$(docker ps -q -f ancestor=redis:7.2 | head -n1)
          USER_ID=$(docker exec "$MYSQL_CID" mysql -uroot -psecret -N -e \
            "SELECT id FROM app.User WHERE email='${SEED_ADMIN_EMAIL}'" 2>/dev/null)
          ORG_ID=$(docker exec "$MYSQL_CID" mysql -uroot -psecret -N -e \
            "SELECT id FROM app.Org WHERE slug='${SEED_ORG_SLUG}'" 2>/dev/null)
          MEMBERSHIP_ID=$(docker exec "$MYSQL_CID" mysql -uroot -psecret -N -e \
            "SELECT id FROM app.Membership WHERE userId='${USER_ID}' AND orgId='${ORG_ID}'" 2>/dev/null)
          echo "fixture: user/org/membership resolved (ids not printed)"
          # 备份该 membership（多角色 + primary role）的 items.read 授权行，
          # 然后真实删除——数据库不再有 items.read（JWT claim 仍有）。
          docker exec "$MYSQL_CID" mysql -uroot -psecret -N -e \
            "SELECT CONCAT('(', QUOTE(id), ',', QUOTE(roleId), ',', QUOTE(permissionId), ')') FROM app.RolePermission \
             WHERE permissionId=(SELECT id FROM app.Permission WHERE name='items.read') \
               AND (roleId IN (SELECT roleId FROM app.MembershipRole WHERE membershipId='${MEMBERSHIP_ID}') \
                    OR roleId=(SELECT roleId FROM app.Membership WHERE id='${MEMBERSHIP_ID}'))" 2>/dev/null \
            > /tmp/rp-backup.txt
          echo "backed up $(wc -l < /tmp/rp-backup.txt) RolePermission rows (items.read)"
          docker exec "$MYSQL_CID" mysql -uroot -psecret -e \
            "DELETE FROM app.RolePermission \
             WHERE permissionId=(SELECT id FROM app.Permission WHERE name='items.read') \
               AND (roleId IN (SELECT roleId FROM app.MembershipRole WHERE membershipId='${MEMBERSHIP_ID}') \
                    OR roleId=(SELECT roleId FROM app.Membership WHERE id='${MEMBERSHIP_ID}'))" 2>/dev/null
          # 清 NestJS profile 缓存（profile:<userId>:<orgId>）——避免缓存
          # 掩盖数据库状态；Go 无缓存，直接重推导。
          docker exec "$REDIS_CID" redis-cli DEL "profile:${USER_ID}:${ORG_ID}" >/dev/null
          cat > /tmp/smoke_noperm.py <<'PY'
          import base64
          import json
          import urllib.error
          import urllib.request

          TRACE = "6f1e2d3c4b5a69788697a5b4c3d2e1f0"
          token = open("/tmp/smoke-jwt").read().strip()

          # 记录性断言：该 token 的 permissions claim 仍含 items.read——
          # 两侧都必须因数据库无权限而 403（claim 不参与授权）。
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          assert "items.read" in (claims.get("permissions") or []), claims.get("permissions")

          def expect_error(url, want_status):
              req = urllib.request.Request(url, headers={
                  "authorization": f"Bearer {token}", "x-trace-id": TRACE})
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      raise SystemExit(f"{url} -> {resp.status}, want {want_status}")
              except urllib.error.HTTPError as err:
                  body = err.read()
                  return err.code, dict(err.headers), json.loads(body)

          results = {}
          for side, url in {
              "nestjs": "http://127.0.0.1:4000/api/user-settings/ui/onboarding",
              "go": "http://127.0.0.1:4020/api/user-settings/ui/onboarding",
          }.items():
