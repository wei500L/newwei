                  "sourceType": "mixed", "sortBy": "latest", "minHeatScore": 3.5,
                  "minCredibilityScore": 72, "timelineGranularity": "week",
                  "speed": 4, "syncStatusAutoRefresh": False}},
              "/api/user-settings/ui/war-map": {"settings": {
                  "conflicts": False, "militaryBases": False, "cables": True,
                  "viewState": {"lat": 120, "lon": -200, "zoom": 99, "bearing": 45, "pitch": 30},
                  "activePreset": "mena", "timeRangePreset": "1y", "flightMode": "all",
                  "aisMode": "density", "aisHighlightCandidates": False}},
              "/api/user-settings/ui/newsnow": {"settings": {
                  "focusSources": [" src-A ", "src-A", "src-B!", "src-c", 42, ""],
                  "columnOrders": {" zz-col ": [" s2 ", "s1", "s1"], "bad col!": ["s1"], "empty-col": [], "aa-col": ["s0"]},
