          path = "/api/user-settings/ui/onboarding"
          for name, raw in samples.items():
              status, headers, body = request("PUT", "http://127.0.0.1:4020" + path, raw)
              base = recorded[name]
              assert status == base["status"], (name, status, base["status"], body[:300], base["body"][:300])
              ctype = (headers.get("content-type") or "").split(";")[0].strip().lower()
