          export MYSQL_CID
          python3 /tmp/smoke_go_put.py
          onboarding=$(docker exec "$MYSQL_CID" mysql -uroot -psecret -N -e \
            "SELECT COUNT(*) FROM app.UserSetting WHERE orgId='${ORG_ID}' AND userId='${USER_ID}' AND \`key\`='ui:onboarding:settings:v1'" 2>/dev/null)
          # 脚本末尾的代表性 PUT 会把 onboarding 写回来，所以这里应是 1。
          test "$onboarding" = "1"
          rss=$(docker exec "$MYSQL_CID" mysql -uroot -psecret -N -e \
            "SELECT COUNT(*) FROM app.UserSetting WHERE orgId='${ORG_ID}' AND userId='${USER_ID}' AND \`key\`='ui:rss-reader:settings:v1'" 2>/dev/null)
          test "$rss" = "1"
          for key in ui:onboarding:settings:v1 \
