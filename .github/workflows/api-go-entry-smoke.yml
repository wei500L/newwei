          REDIS_CID=$(docker ps -q -f ancestor=redis:7.2 | head -n1)
          USER_ID=$(docker exec "$MYSQL_CID" mysql -uroot -psecret -N -e \
            "SELECT id FROM app.User WHERE email='${SEED_ADMIN_EMAIL}'" 2>/dev/null)
          ORG_ID=$(docker exec "$MYSQL_CID" mysql -uroot -psecret -N -e \
            "SELECT id FROM app.Org WHERE slug='${SEED_ORG_SLUG}'" 2>/dev/null)
          MEMBERSHIP_ID=$(docker exec "$MYSQL_CID" mysql -uroot -psecret -N -e \
            "SELECT id FROM app.Membership WHERE userId='${USER_ID}' AND orgId='${ORG_ID}'" 2>/dev/null)
          # 真实停用 membership（代表性 inactive 状态——org/membership/user
          # 的拒绝链已由集成测试覆盖，这里选一支做真栈端到端对比）。
          docker exec "$MYSQL_CID" mysql -uroot -psecret -e \
            "UPDATE app.Membership SET isActive=false WHERE id='${MEMBERSHIP_ID}'" 2>/dev/null
          docker exec "$REDIS_CID" redis-cli DEL "profile:${USER_ID}:${ORG_ID}" >/dev/null
          cat > /tmp/smoke_inactive.py <<'PY'
          import json
          import urllib.error
          import urllib.request

          TRACE = "7f1e2d3c4b5a69788697a5b4c3d2e1f0"
          token = open("/tmp/smoke-jwt").read().strip()

          def expect_error(url, want_status, want_message):
              req = urllib.request.Request(url, headers={
                  "authorization": f"Bearer {token}", "x-trace-id": TRACE})
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      raise SystemExit(f"{url} -> {resp.status}, want {want_status}")
              except urllib.error.HTTPError as err:
                  return err.code, json.loads(err.read())

          results = {}
          for side, url in {
              "nestjs": "http://127.0.0.1:4000/api/user-settings/ui/onboarding",
              "go": "http://127.0.0.1:4020/api/user-settings/ui/onboarding",
          }.items():
              status, doc = expect_error(url, 401, "Organization access disabled")
              assert status == 401, (side, status, doc)
              assert doc.get("statusCode") == 401, (side, doc)
              assert doc.get("message") == "Organization access disabled", (side, doc)
              assert doc.get("error") == "Unauthorized", (side, doc)
              results[side] = {k: v for k, v in doc.items()
                               if k not in ("traceId", "timestamp", "path")}
          assert results["nestjs"] == results["go"], (
              f"401 shape mismatch\n  nestjs: {json.dumps(results['nestjs'], sort_keys=True)}\n"
              f"  go:     {json.dumps(results['go'], sort_keys=True)}")
          print("membership inactive: NestJS 401 与 Go 401 同文案"
                "（Organization access disabled）契约一致")
          PY
          python3 /tmp/smoke_inactive.py
          # 恢复 fixture + 清缓存。
          docker exec "$MYSQL_CID" mysql -uroot -psecret -e \
            "UPDATE app.Membership SET isActive=true WHERE id='${MEMBERSHIP_ID}'" 2>/dev/null
          docker exec "$REDIS_CID" redis-cli DEL "profile:${USER_ID}:${ORG_ID}" >/dev/null
          # 复验：恢复后两侧均 200（也确认前面步骤的 fixture 恢复完整）。
          cat > /tmp/smoke_restored.py <<'PY'
          import json
          import urllib.request

          token = open("/tmp/smoke-jwt").read().strip()
          for url in ("http://127.0.0.1:4000/api/user-settings/ui/onboarding",
                      "http://127.0.0.1:4020/api/user-settings/ui/onboarding"):
              req = urllib.request.Request(url, headers={"authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  assert resp.status == 200, (url, resp.status)
                  json.loads(resp.read())
          print("fixtures restored: onboarding GET 200 on both sides")
          PY
          python3 /tmp/smoke_restored.py

      - name: "Smoke 11/13 — tampered signature & alg=none -> Go 401"
        run: |
          cat > /tmp/smoke_tamper.py <<'PY'
          import base64
          import json
          import urllib.error
          import urllib.request

          TRACE = "8f1e2d3c4b5a69788697a5b4c3d2e1f0"
          token = open("/tmp/smoke-jwt").read().strip()

          def go_get(auth_token):
              req = urllib.request.Request(
                  "http://127.0.0.1:4020/api/user-settings/ui/onboarding",
                  headers={"authorization": f"Bearer {auth_token}", "x-trace-id": TRACE})
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      raise SystemExit(f"tampered token accepted: {resp.status}")
              except urllib.error.HTTPError as err:
                  return err.code, json.loads(err.read())

          # 1) 篡改签名：真实登录 token 的签名段中部换一个字符（恶意输入，
          #    不是伪造合法登录）。
          parts = token.split(".")
          sig = parts[2]
          flipped = ("A" if sig[0] != "A" else "B") + sig[1:]
          tampered = f"{parts[0]}.{parts[1]}.{flipped}"
          status, doc = go_get(tampered)
          assert status == 401, (status, doc)
          assert doc.get("message") == "Unauthorized" and doc.get("error") == "Unauthorized", doc
          print("tampered signature -> Go 401 Unauthorized（与 NestJS passport 层同形态）")

          # 2) alg 混淆：alg=none + 保留真实 payload + 空签名。
          header = base64.urlsafe_b64encode(
              json.dumps({"alg": "none", "typ": "JWT"}).encode()).rstrip(b"=").decode()
          alg_none = f"{header}.{parts[1]}."
          status, doc = go_get(alg_none)
          assert status == 401, (status, doc)
          assert doc.get("message") == "Unauthorized", doc
          print("alg=none confusion -> Go 401 Unauthorized（拒绝未签名 token）")
          PY
          python3 /tmp/smoke_tamper.py

      - name: "Smoke 12/13 — real logout writes Redis blacklist -> Go 401 revoked (Phase D preparation)"
        run: |
          set -euo pipefail
          REDIS_CID=$(docker ps -q -f ancestor=redis:7.2 | head -n1)
          cat > /tmp/smoke_logout.py <<'PY'
          import json
          import urllib.error
          import urllib.request

          TRACE = "9f1e2d3c4b5a69788697a5b4c3d2e1f0"
          token = open("/tmp/smoke-jwt").read().strip()
          refresh = open("/tmp/smoke-refresh").read().strip()

          # 真实 logout 经 api-go 代理到 NestJS——由 NestJS 写入真实 Redis
          # blacklist（不是本地内存模拟）。@Post 默认状态码 201（logout 无
          # @HttpCode 装饰器，auth.controller.ts）。
          req = urllib.request.Request(
              "http://127.0.0.1:4020/api/auth/logout",
              data=json.dumps({"refreshToken": refresh}).encode(),
              method="POST",
              headers={"authorization": f"Bearer {token}",
                       "content-type": "application/json", "x-trace-id": TRACE})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  assert resp.status == 201, resp.status
                  json.loads(resp.read())
          except urllib.error.HTTPError as err:
              raise SystemExit(f"logout returned {err.code}: {err.read()[:300]!r}")
          print("logout via api-go -> NestJS 201（blacklist 由 NestJS 写入真实 Redis）")

          # 被撤销的 accessToken 请求 Go onboarding → 按 NestJS 契约 401。
          req = urllib.request.Request(
              "http://127.0.0.1:4020/api/user-settings/ui/onboarding",
              headers={"authorization": f"Bearer {token}", "x-trace-id": TRACE})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  raise SystemExit(f"revoked token accepted: {resp.status}")
          except urllib.error.HTTPError as err:
              assert err.code == 401, (err.code, err.read()[:300])
              doc = json.loads(err.read())
              assert doc.get("message") == "Access token revoked", doc
              assert doc.get("error") == "Unauthorized", doc
          print("revoked accessToken -> Go 401 Access token revoked")
          PY
          python3 /tmp/smoke_logout.py
          # 静态/只读确认 blacklist key 存在（jti/token 不打印）。
          JTI=$(python3 -c "import base64,json; t=open('/tmp/smoke-jwt').read().strip(); p=t.split('.')[1]; p+='='*(-len(p)%4); print(json.loads(base64.urlsafe_b64decode(p))['jti'])")
          COUNT=$(docker exec "$REDIS_CID" redis-cli EXISTS "access-token:blacklist:${JTI}")
          test "$COUNT" = "1"
          echo "access-token:blacklist:<jti> exists in real Redis (jti not printed)"

      # ---- Phase D：独立性证明（NestJS 停止后）----

      - name: "Smoke 13/13 (Phase D) — re-login, then stop NestJS and prove independence"
        run: |
          set -euo pipefail
          # 重新真实登录（旧 token 已被 logout 撤销）——确认数据仍在，然后停止 NestJS。
          cat > /tmp/smoke_relogin.py <<'PY'
          import json
          import os
          import urllib.request

          body = json.dumps({
              "email": os.environ["SEED_ADMIN_EMAIL"],
              "password": os.environ["SEED_ADMIN_PASSWORD"],
          }).encode()
          req = urllib.request.Request(
              "http://127.0.0.1:4020/api/auth/login",
              data=body, method="POST",
              headers={"content-type": "application/json"})
          with urllib.request.urlopen(req, timeout=15) as resp:
              doc = json.loads(resp.read())
          token = doc["accessToken"]
          with open("/tmp/smoke-jwt", "w") as f:
              f.write(token)
          # 停止前经 api-go 确认 onboarding 数据仍在（Go handler，此时上游
          # 亦可用——不构成独立性证明，仅为数据存在性确认）。
          req = urllib.request.Request(
              "http://127.0.0.1:4020/api/user-settings/ui/onboarding",
              headers={"authorization": f"Bearer {token}"})
          with urllib.request.urlopen(req, timeout=15) as resp:
              assert resp.status == 200, resp.status
              doc = json.loads(resp.read())
              assert doc["settings"]["completed"] is True, doc
          print("re-login ok; onboarding data confirmed present (via Go handler)")
          PY
          python3 /tmp/smoke_relogin.py
          # 停止真实 NestJS 进程（MySQL/Redis/api-go 保持运行）。
          kill $(cat /tmp/api-nestjs.pid) 2>/dev/null || true
          pkill -f "dist/main.js" 2>/dev/null || true
          for i in $(seq 1 30); do
            if ! curl -s -o /dev/null --max-time 2 http://127.0.0.1:4000/api/healthz/live 2>/dev/null; then
              echo "nestjs api stopped (port 4000 closed)"
              break
            fi
            sleep 1
          done
          if curl -s -o /dev/null --max-time 2 http://127.0.0.1:4000/api/healthz/live 2>/dev/null; then
            echo "nestjs api still alive — cannot prove independence"
            exit 1
          fi
          cat > /tmp/smoke_takeover.py <<'PY'
          import json
          import urllib.error
          import urllib.request

          TRACE = "bf1e2d3c4b5a69788697a5b4c3d2e1f0"
          token = open("/tmp/smoke-jwt").read().strip()

          EXPECTED = {
              "/api/user-settings/ui/onboarding": {"settings": {
                  "completed": True,
                  "dismissed": True,
                  "checklist": {"today": True, "events": True, "map": True, "finance": False},
                  "completedTours": {"today": True}}},
              "/api/user-settings/ui/rss-reader": {"settings": {
                  "selectedSourceIds": ["src-alpha", "src-beta"],
                  "sourceLanguageFilters": ["EN", "ZH"],
                  "translationEnabled": True,
                  "translationProvider": "llm",
                  "targetLanguage": "en-US",
                  "showOriginalContent": True}},
              "/api/user-settings/ui/spacetime-timeline": {"settings": {
                  "authoritativeLock": False,
                  "requireCorroborated": False,
                  "sourceType": "mixed",
                  "sortBy": "latest",
                  "minHeatScore": 3.5,
                  "minCredibilityScore": 72,
                  "timelineGranularity": "week",
                  "speed": 4,
                  "syncStatusAutoRefresh": False}},
              "/api/user-settings/ui/war-map": {"_partial": {
                  "viewState": {"lat": 90, "lon": -180, "zoom": 18, "bearing": 0, "pitch": 0},
                  "activePreset": "mena", "timeRangePreset": "7d",
                  "flightMode": "all", "aisMode": "density", "aisHighlightCandidates": False}},
              "/api/user-settings/ui/newsnow": {"settings": {
                  "focusSources": ["src-A", "src-c"],
                  "columnOrders": {"zz-col": ["s2", "s1"], "aa-col": ["s0"]},
                  "hideCrossSourceDuplicates": True,
                  "sortMode": "personalized",
                  "densityMode": "compact"}},
              "/api/user-settings/ui/situation-monitor": {
                  "monitors": [
                      {"id": "mon-1", "name": "Taiwan Strait", "keywords": ["ship", "navy", "MISSING"],
                       "enabled": True, "color": "#ff00aa",
                       "location": {"name": "Taipei", "lat": 25.03, "lng": 121.56},
                       "createdAt": 1757000000000},
                      {"id": "Bad location", "name": "Bad location", "keywords": ["y"], "enabled": True},
                  ],
                  "settings": {"windowHours": 24, "scope": "all", "autoRefresh": True,
                               "resetLayoutOnPreset": True, "translateToZh": True}},
          }

          # Phase D 核心验收：NestJS 已停止，六个 user-settings GET 仍全部
          # 由 Go 返回此前真实持久化的数据（Phase A 的 PUT 写入）——证明
          # 不是代理或 Shadow 假象。
          for path, want in EXPECTED.items():
              req = urllib.request.Request(
                  f"http://127.0.0.1:4020{path}",
                  headers={"authorization": f"Bearer {token}", "x-trace-id": TRACE})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  assert resp.status == 200, (path, resp.status)
                  assert "no-store" in (resp.headers.get("cache-control") or "").lower(), (path, dict(resp.headers))
                  assert (resp.headers.get("content-type") or "").startswith("application/json"), (path, dict(resp.headers))
                  assert resp.headers.get("x-trace-id") == TRACE, (path, dict(resp.headers))
                  doc = json.loads(resp.read())
              assert doc.get("version") == 1, (path, doc)
              if "_partial" in want:
                  for key, value in want["_partial"].items():
                      assert doc.get(key) == value, (path, key, doc.get(key), value)
              else:
                  for key, value in want.items():
                      assert doc.get(key) == value, (path, key, doc.get(key), value)
              assert isinstance(doc.get("updatedAt", {}).get("settings"), str) and doc["updatedAt"]["settings"], (path, doc)
              print(f"NestJS 停止后：GET {path} via api-go -> 200（Go handler 独立响应, 数据一致）")

          # situation-monitor 三段 updatedAt 全在（Phase A 写入三段）。
          req = urllib.request.Request(
              "http://127.0.0.1:4020/api/user-settings/ui/situation-monitor",
              headers={"authorization": f"Bearer {token}", "x-trace-id": TRACE})
          with urllib.request.urlopen(req, timeout=15) as resp:
              doc = json.loads(resp.read())
          for section in ("monitors", "layout", "settings"):
              assert doc["updatedAt"].get(section), doc
          print("situation-monitor: 三段 updatedAt 均存在（NestJS 停止后仍由 Go 聚合返回）")

          # 反证 1：代表性 PUT（war-map）必须代理失败——写路径没有偷偷迁入 Go。
          req = urllib.request.Request(
              "http://127.0.0.1:4020/api/user-settings/ui/war-map",
              data=json.dumps({"settings": {"activePreset": "eu"}}).encode(),
              method="PUT",
              headers={"authorization": f"Bearer {token}", "content-type": "application/json",
                       "x-trace-id": TRACE})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  raise SystemExit(f"PUT war-map unexpectedly succeeded ({resp.status}) — 写路径被迁入 Go？")
          except urllib.error.HTTPError as err:
              assert err.code == 502, (err.code, err.read()[:300])
          print("NestJS 停止后：PUT war-map（NestJS 单写）-> 502（写路径未迁入 Go）")

          # 反证 2：未迁移业务 GET（/api/items）必须代理失败——api-go 没有
          # 伪装所有请求成功。
          req = urllib.request.Request(
              "http://127.0.0.1:4020/api/items",
              headers={"authorization": f"Bearer {token}", "x-trace-id": TRACE})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  raise SystemExit(f"GET /api/items unexpectedly succeeded ({resp.status}) — api-go 伪装成功？")
          except urllib.error.HTTPError as err:
              assert err.code == 502, (err.code, err.read()[:300])
          print("NestJS 停止后：GET /api/items（未迁移路由）-> 502（未伪装成功）")
          PY
          python3 /tmp/smoke_takeover.py
          # api-go 容器保持 healthy（Go 端点与探活不依赖 NestJS）。
          HEALTH=$(docker inspect --format '{{.State.Health.Status}}' api-go-smoke)
          test "$HEALTH" = "healthy"
          echo "api-go container still healthy after NestJS stopped"
          # 最终 shadow 指标：go 接管的六个 GET 全程零 shadow 执行；Phase C
          # 容器重启后 shadow 从 0 开始且保持 0（本 smoke 中 Phase B 的
          # executed 计数属于上一个容器实例）。
          cat > /tmp/smoke_final.py <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:4020/__go/healthz", timeout=10) as resp:
              doc = json.load(resp)
          now = doc["shadow"]
          assert doc.get("userSettingsRead", {}).get("mode") == "go", doc
          assert doc.get("userSettingsRead", {}).get("database") == "configured", doc
          assert now["executed"] == 0, now
          assert now["diffs"] == 0, now
          assert now["inflight"] == 0, now
          assert sum(now["dropped"].values()) == 0, now["dropped"]
          print("=== api-go entry smoke (Go-批3B): FINAL METRICS ===")
          print("executed: 0 (Phase C/D 六端点全部 Go handler 全响应，零 shadow 执行)")
          print("diffs:    0 | inflight: 0 | dropped total: 0")
          print("userSettingsRead.mode: go")
          print("userSettingsRead.database: configured")
          print("api-go entry smoke: ALL ASSERTIONS PASSED")
          PY
          python3 /tmp/smoke_final.py

      - name: Dump service logs on failure (hash/status/category only by design)
        if: failure()
        run: |
          echo "=== api-go container log (shadow-diff 记录默认只含 hash/状态/分类，SHADOW_DEBUG_BODY_LOG=false) ==="
          docker logs api-go-smoke 2>&1 | tail -200 || true
          echo "=== nestjs api log (tail) ==="
          tail -150 /tmp/api-nestjs.log || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f api-go-smoke >/dev/null 2>&1 || true
          kill $(cat /tmp/api-nestjs.pid) 2>/dev/null || true
          pkill -f "dist/main.js" 2>/dev/null || true
