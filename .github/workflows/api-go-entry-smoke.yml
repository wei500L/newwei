          import json
          import urllib.error
          import urllib.request

          TRACE = "6f1e2d3c4b5a69788697a5b4c3d2e1f0"
          token = open("/tmp/smoke-jwt").read().strip()

          PATHS = [
              "/api/user-settings/ui/onboarding",
