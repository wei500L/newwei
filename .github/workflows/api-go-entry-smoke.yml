          req = urllib.request.Request(
              "http://127.0.0.1:4020/api/user-settings/ui/situation-monitor",
              headers={"authorization": f"Bearer {token}", "x-trace-id": TRACE})
          with urllib.request.urlopen(req, timeout=15) as resp:
              doc = json.loads(resp.read())
          for section in ("monitors", "layout", "settings"):
              assert doc["updatedAt"].get(section), doc
          print("situation-monitor: 三段 updatedAt 均存在（NestJS 停止后仍由 Go 聚合返回）")

          # NestJS 已停止：浏览器预检仍由 Go 回答，已接管的 PUT/GET 仍带上来源头。
          origin = "http://localhost:3000"
          path = "/api/user-settings/ui/onboarding"

          def cors_call(method, url, data=None, preflight=False, auth=True):
              headers = {"Origin": origin}
              if preflight:
                  headers["Access-Control-Request-Method"] = "PUT"
                  headers["Access-Control-Request-Headers"] = "authorization,content-type"
              else:
                  if auth:
                      headers["authorization"] = f"Bearer {token}"
                  if data is not None:
                      headers["content-type"] = "application/json"
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, resp.headers, resp.read()
              except urllib.error.HTTPError as err:
                  return err.code, err.headers, err.read()

          status, headers, body = cors_call(
              "OPTIONS", "http://127.0.0.1:4020" + path, preflight=True, auth=False)
          assert status == 204, (status, body[:200])
          assert headers.get("access-control-allow-origin") == origin, dict(headers)
          assert headers.get("access-control-allow-credentials") == "true", dict(headers)
          assert not headers.get("x-frame-options"), dict(headers)
          print("NestJS 停止后：浏览器 Origin 预检仍是 204")

          status, headers, body = cors_call(
              "PUT", "http://127.0.0.1:4020" + path,
              data=json.dumps({"settings": {"dismissed": True, "completed": True}}).encode())
          assert status == 200, (status, body[:300])
          assert headers.get("access-control-allow-origin") == origin, dict(headers)
          written = json.loads(body)
          status, headers, body = cors_call("GET", "http://127.0.0.1:4020" + path)
          assert status == 200, (status, body[:300])
          assert headers.get("access-control-allow-origin") == origin, dict(headers)
          assert json.loads(body) == written
          print("NestJS 停止后：带浏览器 Origin 的 PUT+GET 仍成功")

          for url in (
              "http://127.0.0.1:4020/api/items",
              "http://127.0.0.1:4020/api/user-settings/ui/onboarding-x",
          ):
              status, headers, body = cors_call("OPTIONS", url, preflight=True, auth=False)
              assert status == 502, (url, status, body[:300])
          print("NestJS 停止后：未接管路径的预检是 502")

          # NestJS 已停止：六个 PUT 仍由 Go 写入并读回。这是写路径不依赖上游的证据。
          writes = {
              "/api/user-settings/ui/onboarding": (
                  {"settings": {"dismissed": True, "completed": True}},
                  lambda doc: doc["settings"]["dismissed"] is True and doc["settings"]["completed"] is True),
              "/api/user-settings/ui/rss-reader": (
                  {"settings": {"translationProvider": "llm", "translationEnabled": True}},
                  lambda doc: doc["settings"]["translationProvider"] == "llm" and doc["settings"]["translationEnabled"] is True),
              "/api/user-settings/ui/spacetime-timeline": (
                  {"settings": {"sourceType": "blog", "sortBy": "latest"}},
                  lambda doc: doc["settings"]["sourceType"] == "blog" and doc["settings"]["sortBy"] == "latest"),
              "/api/user-settings/ui/war-map": (
                  {"settings": {"activePreset": "eu"}},
                  lambda doc: doc["settings"]["activePreset"] == "eu"),
              "/api/user-settings/ui/newsnow": (
                  {"settings": {"sortMode": "smart", "hideCrossSourceDuplicates": True}},
                  lambda doc: doc["settings"]["sortMode"] == "personalized" and doc["settings"]["hideCrossSourceDuplicates"] is True),
              "/api/user-settings/ui/situation-monitor": (
                  {"settings": {"windowHours": 72, "scope": "tagged", "translateToZh": True}},
                  lambda doc: doc["settings"]["windowHours"] == 72 and doc["settings"]["scope"] == "tagged" and doc["settings"]["translateToZh"] is True),
          }
          for path, (body, check) in writes.items():
              req = urllib.request.Request(
                  f"http://127.0.0.1:4020{path}",
                  data=json.dumps(body).encode(), method="PUT",
                  headers={"authorization": f"Bearer {token}", "content-type": "application/json", "x-trace-id": TRACE})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  assert resp.status == 200, (path, resp.status)
                  written = json.loads(resp.read())
              req = urllib.request.Request(
                  f"http://127.0.0.1:4020{path}",
                  headers={"authorization": f"Bearer {token}", "x-trace-id": TRACE})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  assert resp.status == 200, (path, resp.status)
                  got = json.loads(resp.read())
              assert written == got, (path, written, got)
              assert check(got), (path, got)
              print(f"NestJS 停止后：PUT+GET {path} -> 200（Go 独立写入并读回）")

          # 公开首页/频道在 NestJS 停止后仍返回 Smoke 7b 写入的故事。
          # 两个故事详情和多段 channel 路径仍是未迁移路由，必须 502。
          expect = json.load(open("/tmp/portal-expect.json"))
          def portal_get(path):
              req = urllib.request.Request(
                  "http://127.0.0.1:4020" + path,
                  headers={"x-trace-id": TRACE})
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, resp.headers, json.loads(resp.read().decode())
              except urllib.error.HTTPError as err:
                  return err.code, err.headers, err.read()[:300]

          status, headers, home = portal_get("/api/public-portal/home")
          assert status == 200, (status, home)
          assert headers.get("cache-control") == "public, max-age=60, s-maxage=60, stale-while-revalidate=300"
          assert home["featuredStory"]["id"] == expect["featuredId"], home
          assert home["featuredStory"]["title"] == expect["featuredTitle"], home
          assert home["featuredStory"]["summary"] == expect["featuredSummary"], home
          assert home["featuredStory"]["credibilityScore"] == expect["featuredCredibility"], home
          assert [row["id"] for row in home["latestStories"]] == expect["latestIds"], home
          assert "Archived Leak" not in json.dumps(home) and "Other Org" not in json.dumps(home)
          status, headers, markets = portal_get("/api/public-portal/channels/markets")
          assert status == 200, (status, markets)
          assert [row["id"] for row in markets["stories"]] == expect["marketIds"], markets
          status, headers, energy = portal_get("/api/public-portal/channels/energy")
          assert status == 200, (status, energy)
          assert [row["id"] for row in energy["stories"]] == expect["energyIds"], energy
          print("NestJS 停止后：public-portal home/channel 仍返回完整故事")

          def story_ok(path):
              status, headers, doc = portal_get(path)
              assert status == 200, (path, status, doc)
              assert headers.get("cache-control") == "public, max-age=60, s-maxage=60, stale-while-revalidate=300"
              assert doc["story"]["id"] == expect["featuredId"], doc
              assert doc["story"]["slug"] == expect["featuredSlug"], doc
              assert doc["story"]["title"] == expect["featuredTitle"], doc
              assert doc["story"]["summary"] == expect["featuredSummary"], doc
              assert [row["id"] for row in doc["story"]["timeline"]] == ["tl-portal-now"], doc
              assert [row["id"] for row in doc["story"]["referencedArticles"]] == expect["articleIds"], doc
              assert [row["id"] for row in doc["relatedStories"]] == [expect["relatedId"]], doc
              assert doc["story"]["brief"]["payload"]["tldr"] == expect["briefTldr"], doc
              assert "Archived Leak" not in json.dumps(doc) and "Other Org" not in json.dumps(doc)
              return doc

          story_ok("/api/public-portal/stories/id/" + expect["featuredId"])
          story_ok("/api/public-portal/stories/slug/" + urllib.parse.quote(expect["featuredSlug"]))
          print("NestJS 停止后：故事详情仍返回时间线、引用文章、相关故事和已缓存 brief")

          for path in (
              "/api/public-portal/channels/markets/extra",
              "/api/public-portal/home/extra",
          ):
              status, headers, body = portal_get(path)
              assert status == 502, (path, status, body)
          print("NestJS 停止后：频道/首页的额外路径仍是 502（未接管）")

          # 反证 2：未迁移业务 GET（/api/items）必须代理失败——api-go 没有
          # 伪装所有请求成功。
          req = urllib.request.Request(
              "http://127.0.0.1:4020/api/items",
              headers={"authorization": f"Bearer {token}", "x-trace-id": TRACE})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  raise SystemExit(f"GET /api/items unexpectedly succeeded ({resp.status}) — api-go 伪装成功？")
          except urllib.error.HTTPError as err:
              assert err.code == 502, (err.code, err.read()[:300])
          print("NestJS 停止后：GET /api/items（未迁移路由）-> 502（未伪装成功）")

          # 冷路径：清掉已缓存 brief，只请求 Go。NestJS 已停止，不能代为生成。
          base = os.environ.get("LITELLM_API_BASE", "").strip()
          key = os.environ.get("LITELLM_API_KEY", "").strip()
          model = os.environ.get("LITELLM_MODEL", "").strip() or "openai/gpt-4o-mini"
          if not base or not key:
              raise SystemExit(
                  "COLD_PATH_BLOCKED: 远端 runner 没有 LITELLM_API_BASE/LITELLM_API_KEY。"
                  "缓存命中的详情不能当成完整接管。故事详情路由仍应由 legacy 回滚，直到真实网关可写回 brief。"
              )
          profile = {
              "activeId": "smoke-brief",
              "profiles": [{
                  "id": "smoke-brief",
                  "name": "smoke",
                  "apiBase": base,
                  "apiKey": key,
                  "model": model,
                  "enabled": True,
                  "timeoutMs": 60000,
                  "maxRetries": 1,
                  "fallbackModels": [],
                  "responseFormatMode": "json_schema",
                  "apiSurface": "chat_completions",
                  "sendMetadata": True,
              }],
          }
          mysql = ["docker", "exec", "-i", os.environ["MYSQL_CID"], "mysql", "-uroot", "-psecret", "app", "-e"]
          profile_sql = "INSERT INTO SystemSetting (`key`, value, isPublic, createdAt, updatedAt) VALUES ('llm_gateway_profiles', CAST('" + json.dumps(profile).replace("'", "''") + "' AS JSON), 0, UTC_TIMESTAMP(3), UTC_TIMESTAMP(3)) ON DUPLICATE KEY UPDATE value = VALUES(value), updatedAt = UTC_TIMESTAMP(3)"
          subprocess.check_call(mysql + [profile_sql])
          clear_sql = "UPDATE NewsEvent SET metadata = CAST('{\"note\":\"keep\"}' AS JSON) WHERE id = '" + expect["featuredId"] + "' AND orgId = 'org-portal-pub'"
          subprocess.check_call(mysql + [clear_sql])
          req = urllib.request.Request(
              "http://127.0.0.1:4020/api/public-portal/stories/id/" + expect["featuredId"],
              headers={"x-trace-id": TRACE})
          try:
              with urllib.request.urlopen(req, timeout=90) as resp:
                  status, doc = resp.status, json.loads(resp.read().decode())
          except urllib.error.HTTPError as err:
              status, doc = err.code, err.read()[:500]
          assert status == 200, (status, doc)
          tldr = ((doc.get("story") or {}).get("brief") or {}).get("payload", {}).get("tldr")
          assert isinstance(tldr, str) and tldr.strip() and tldr != expect["briefTldr"], doc
          generated = doc["story"]["brief"]["generatedAt"]
          assert generated != "2026-09-27T12:00:00.000Z", generated
          read_sql = "SELECT JSON_UNQUOTE(JSON_EXTRACT(metadata, '$.note')), JSON_EXTRACT(metadata, '$.briefV1.payload.tldr') FROM NewsEvent WHERE id = '" + expect["featuredId"] + "' AND orgId = 'org-portal-pub'"
          raw = subprocess.check_output(["docker", "exec", os.environ["MYSQL_CID"], "mysql", "-uroot", "-psecret", "-N", "-e", read_sql], text=True)
          note, _, tldr_json = raw.strip().partition("\t")
          assert note == "keep", raw
          assert tldr_json and tldr_json.upper() != "NULL", raw
          status, headers, again = portal_get("/api/public-portal/stories/id/" + expect["featuredId"])
          assert status == 200, (status, again)
          assert again["story"]["brief"]["generatedAt"] == generated, (generated, again["story"]["brief"]["generatedAt"])
          print("NestJS 停止后：brief 冷路径由 Go 调用已配置模型网关并写回 metadata.briefV1")
          PY
          python3 /tmp/smoke_takeover.py
          # api-go 容器保持 healthy（Go 端点与探活不依赖 NestJS）。
          HEALTH=$(docker inspect --format '{{.State.Health.Status}}' api-go-smoke)
          test "$HEALTH" = "healthy"
          echo "api-go container still healthy after NestJS stopped"
          # 最终 shadow 指标：go 接管的六个 GET 全程零 shadow 执行；Phase C
          # 容器重启后 shadow 从 0 开始且保持 0（本 smoke 中 Phase B 的
          # executed 计数属于上一个容器实例）。
          cat > /tmp/smoke_final.py <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:4020/__go/healthz", timeout=10) as resp:
              doc = json.load(resp)
          now = doc["shadow"]
          assert doc.get("userSettingsRead", {}).get("mode") == "go", doc
          assert doc.get("userSettingsWrite", {}).get("mode") == "go", doc
          assert doc.get("userSettingsRead", {}).get("database") == "configured", doc
          assert now["executed"] == 0, now
          assert now["diffs"] == 0, now
          assert now["inflight"] == 0, now
          assert sum(now["dropped"].values()) == 0, now["dropped"]
          print("=== api-go entry smoke (Go-批3B): FINAL METRICS ===")
          print("executed: 0 (Phase C/D 六端点全部 Go handler 全响应，零 shadow 执行)")
          print("diffs:    0 | inflight: 0 | dropped total: 0")
          print("userSettingsRead.mode: go")
          print("userSettingsWrite.mode: go")
          print("userSettingsRead.database: configured")
          print("api-go entry smoke: ALL ASSERTIONS PASSED")
          PY
          python3 /tmp/smoke_final.py

      - name: "Smoke browser — real page only when the runner already has a browser"
        run: |
          set -euo pipefail
          BROWSER=""
          for bin in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$bin" >/dev/null 2>&1; then
              BROWSER="$bin"
              break
            fi
          done
          if [ -z "$BROWSER" ]; then
            echo "NO_BROWSER: this runner has no Chrome or Chromium. The Origin preflight above was sent by an HTTP client, not a browser."
            exit 0
          fi
          echo "browser binary: $BROWSER"
          cat > /tmp/cors_page_server.py <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          TOKEN = open("/tmp/smoke-jwt").read().strip()
          PAGE = """<!doctype html>
          <body data-cors="pending"><script>
          (async () => {
            const token = await (await fetch("/token")).text();
            const put = await fetch("http://127.0.0.1:4020/api/user-settings/ui/onboarding", {
              method: "PUT",
              credentials: "include",
              headers: {
                "authorization": "Bearer " + token,
                "content-type": "application/json"
              },
              body: JSON.stringify({settings: {dismissed: true, checklist: {finance: true}}})
            });
            const written = await put.json();
            const get = await fetch("http://127.0.0.1:4020/api/user-settings/ui/onboarding", {
              credentials: "include",
              headers: {"authorization": "Bearer " + token}
            });
            const got = await get.json();
            document.body.dataset.cors = JSON.stringify({
              put: put.status,
              get: get.status,
              finance: !!(got.settings && got.settings.checklist && got.settings.checklist.finance),
              same: JSON.stringify(written) === JSON.stringify(got)
            });
          })().catch((error) => {
            document.body.dataset.cors = "ERR " + String(error);
          });
          </script></body>
          """

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith("/token"):
                      body = TOKEN.encode()
                      content_type = "text/plain; charset=utf-8"
                  else:
                      body = PAGE.encode()
                      content_type = "text/html; charset=utf-8"
                  self.send_response(200)
                  self.send_header("content-type", content_type)
                  self.send_header("content-length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, fmt, *args):
                  return

          ThreadingHTTPServer(("127.0.0.1", 3000), Handler).serve_forever()
          PY
          python3 /tmp/cors_page_server.py >/tmp/cors-web.log 2>&1 &
          echo $! > /tmp/cors-web.pid
          for _ in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:3000/cors.html >/dev/null; then
              break
            fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:3000/cors.html >/dev/null
          # 页面从 localhost:3000 打开，Origin 才等于 CORS_ORIGIN。
          set +e
          DOM=$("$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=20000 --dump-dom "http://localhost:3000/cors.html" 2>/tmp/chrome-cors.err)
          STATUS=$?
          set -e
          kill "$(cat /tmp/cors-web.pid)" >/dev/null 2>&1 || true
          printf '%s\n' "$DOM" | sed 's/Bearer [^" ]*/Bearer [redacted]/g' | head -80
          if [ "$STATUS" -ne 0 ]; then
            echo "chrome exited $STATUS"
            tail -40 /tmp/chrome-cors.err || true
            exit 1
          fi
          printf '%s' "$DOM" > /tmp/cors-dom.html
          python3 - <<'PY'
          dom = open("/tmp/cors-dom.html").read()
          raw = '{"put":200,"get":200,"finance":true,"same":true}'
          escaped = raw.replace('"', "&quot;")
          if raw in dom or escaped in dom:
              print("real browser saved and read onboarding settings through Go")
          else:
              raise SystemExit("browser page did not report a successful Go PUT and GET")
          PY

      - name: Dump service logs on failure (hash/status/category only by design)
        if: failure()
        run: |
          echo "=== api-go container log (shadow-diff 记录默认只含 hash/状态/分类，SHADOW_DEBUG_BODY_LOG=false) ==="
          docker logs api-go-smoke 2>&1 | tail -200 || true
          echo "=== nestjs api log (tail) ==="
          tail -150 /tmp/api-nestjs.log || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f api-go-smoke >/dev/null 2>&1 || true
          kill $(cat /tmp/api-nestjs.pid) 2>/dev/null || true
          kill $(cat /tmp/cors-web.pid) 2>/dev/null || true
          pkill -f "dist/main.js" 2>/dev/null || true
