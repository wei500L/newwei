# Go-批2C 引入 / Go-批3A 扩展 / Go-批3B 重构：api-go 真实入口链的
# 远端真实栈 smoke（手动触发）。
#
# 与普通 CI（ci.yml）的区别：这不是单元/集成测试，而是把迁移单元放进
# 「真实入口链」运行——
#
#   客户端 → api-go 容器 :4020 → NestJS apps/api :4000（真实进程）
#                                   ↘ Go Shadow → 真实 MySQL（真实迁移后的 schema）
#
# Go-批3B/3C：六个 user-settings GET 的读模式与六个 PUT 的写模式。
#
#   Phase A（write=legacy）：6 个 PUT 经 api-go 由 NestJS 单写（helmet
#     头为可观察证据）；记录空请求不写库、400/非法 JSON/超限的 Nest 响应；
#     MySQL 直查 8 个固定 key；
#   Phase B（shadow）：readMode=shadow、write 仍 legacy——6 个 GET 由
#     NestJS 响应，Go 旁路差分（executed 精确 +6，diffs/dropped 零增量）；
#   Phase C（read=go, write=go）：6 个 GET 与 NestJS 直连契约对比；然后
#     六个 PUT 由 Go 真写入，NestJS GET 与 Go GET 读同一行；空写、并发
#     upsert、校验失败不写库、跨用户隔离；浏览器 Origin 的预检由 Go 204
#     回答，PUT/GET 带回 CORS 头并确认落库；超过 10MiB 的请求与 Nest
#     对照状态和 JSON，且不写库；
#   Phase D（独立性证明）：停止 NestJS——六个 PUT 与六个 GET 仍成功；
#     浏览器 Origin 的预检和已接管读写仍可用；未迁移路径的预检与 GET
#     为 502。runner 若自带 Chrome/Chromium，再做一次真实页面请求；
#     没有浏览器就不把 HTTP 客户端结果叫成浏览器实测。
#     write=legacy 阶段的 PUT 仍能看到 NestJS 响应头。
#
# 真实性约束（沿承 Go-批2C/3A 任务书，Go-批3B 扩展到六端点）：
#   - 真实 MySQL/Redis/Mongo service 容器（与 docker-compose 同版本线）；
#   - 真实 prisma migrate deploy（不是内存库/fixture）；
#   - 真实 NestJS 进程（node apps/api/dist/main.js，非 fake upstream）；
#   - 真实 api-go Docker 镜像（infra/docker/api-go.Dockerfile 构建，非 go run）；
#   - 仓库既有 seed 机制创建可登录 org+admin；
#   - 通过 api-go 入口调用真实 NestJS 登录端点获得其签发的 JWT（不手工伪造）；
#   - 六个 user-settings PUT 经 api-go 代理由 NestJS 单写并真实持久化
#     （PUT 不进入 Go handler——method 白名单）；
#   - 六个 GET 在 shadow 阶段做真实差分（零差异），go 阶段由 Go handler
#     全响应，与 NestJS 直连响应逐字段契约对比（status/Cache-Control/
#     content-type/JSON 正文）；
#   - 共享鉴权链负向用例只保留代表性端点（onboarding）——Go-批3A 已
#     验证的 JWT/RBAC 行为不重复铺测试矩阵；
#   - 无权限：真实删除 RolePermission（items.read）+ 清 NestJS profile
#     缓存——JWT claim 仍含 items.read 也必须双端 403（claim 不参与授权）；
#   - membership inactive：真实 UPDATE + 缓存清理——双端 401 同文案；
#   - 撤销：真实 NestJS logout 写入真实 Redis blacklist → Go 401
#     "Access token revoked"（key 存在性静态确认，不打印 jti/token）；
#   - 非法 token：真实登录 token 篡改签名 + alg=none 混淆 → Go 401；
#   - /__go/healthz 前后指标断言：go 接管端点不增加 shadow.executed、
#     shadow 阶段 executed 精确增量（6）、diffs/dropped 零增量、
#     inflight 归零。
#
# 重型真实栈（4 个容器 + 全量 install/build）——不进 push/synchronize 的
# 普通 CI。
#
# 触发方式：
#   1. workflow_dispatch（主路径）：workflow 文件在默认分支注册后，
#      `gh workflow run api-go-entry-smoke.yml --ref <branch>` 手动触发。
#      注：文件已在 main（Go-批2C 合并），分支上直接可用。
#   2. pull_request types:[labeled] + label `api-go-entry-smoke`（PR 期间
#      的路径）：GitHub 平台限制——workflow_dispatch 只能触发默认分支上
#      已存在的 workflow 文件（API 对分支独有文件返回 404，见
#      docs.github.com/en/actions/using-workflows/events-that-trigger-workflows）。
#      PR 合并前用 label 手动触发（与 ci.yml 的 go-modules-regen /
#      contract-baseline-regen label 门禁同一模式）；合并后走主路径。
#      运行完成后移除 label——避免歧义。普通 push/synchronize 不触发。
name: api-go-entry-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-entry-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  # --- 真实 MySQL（与 compose / ci.yml 的 api-go-user-settings-integration 同版本线） ---
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  # --- NestJS apps/api 启动 env（NODE_ENV=production 只在启动步骤注入——
  #     不能放 job 级：会让 pnpm install 跳过 devDependencies，根包 prepare
  #     的 husky 随之缺失而 install 失败。CI=true 时 .env 文件被忽略，全部
  #     来自本处；语义镜像 compose api 服务）。以下凭据仅作用于本次
  #     ephemeral CI 栈，随 runner 销毁。 ---
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  # JWT 显式声明（与 NestJS env schema 默认值相同——api-go 容器必须用
  # 同一 issuer/audience 验签）。
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-smoke@example.com
  SMTP_PASS: api-go-smoke-smtp-not-connected
  JWT_SECRET: c1f4a9e8d2b3706f5a1c8e9d4b2a7f6038e5d1c9a7b6f4e2d3c8a1b5f9e0d7c2
  NEXTAUTH_SECRET: e2b5c1f8a9d3b47e60d4a1f8c3b5e79d02c1f4a9e8d2b3706f5a1c8e9d4b2a7f6
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://localhost:11235
  CORS_ORIGIN: http://localhost:3000
  # 不要在 job env 写入空的 LITELLM_*：Nest zod 把空字符串当成非法 URL /
  # 空模型名，API 起不来。冷路径只在 Go 容器和 Phase D 步骤里读取 secrets。
  # 关闭可选外呼模块（ELASTICSEARCH/VECTOR/MODEL_SERVICE 默认即 false）；
  # AKSHARE_ENABLED=false 只停 HTTP 网关调用（catalog 同步走 MySQL+Redis，
  # 均已就绪）；SCHEDULE_ENABLED=false 关闭全部 @Cron 调度，降低噪音。
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  # --- seed（复用 packages/db 既有 seed：org + admin 用户 + 角色/membership/
  #     permission 全套，可真实登录）。密码仅用于本次 ephemeral 栈。 ---
  SEED_ORG_SLUG: api-go-smoke-org
  SEED_ORG_NAME: api-go Smoke Org
  SEED_ADMIN_EMAIL: api-go-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: ApiGoSmoke#2026-Ci
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-entry-smoke:
    # 手动触发双路径（见文件头注释）：workflow_dispatch 直接进入；
    # PR 期间靠 label `api-go-entry-smoke` 显式进入（label 添加是维护者
    # 的手动动作，与 regen job 同一模式；普通 push/synchronize 事件
    # 因 types:[labeled] 根本不会启动本 workflow）。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-entry-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        # 与 infra/docker/docker-compose.yml 的 mysql 服务同版本。
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        # 与 compose 的 redis 服务同版本线（REDIS_IMAGE 默认 redis:7.2）。
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        # 与 compose 的 mongo 服务同版本。
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate

      - name: Real database migration (prisma migrate deploy)
        run: pnpm --filter db run migrate

      - name: Build NestJS api (dist/main.js)
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api

      - name: "Start real NestJS api (:4000)"
        run: |
          # 与 compose api 服务同一启动命令（pnpm --filter @modular/api run start
          # = node dist/main.js，含 NODE_PATH 语义）；NODE_ENV=production 只在
          # 本步骤注入（compose 同款运行态），env 其余来自 job env。
          NODE_ENV=production PORT=4000 \
            pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs api healthy"
              exit 0
            fi
            sleep 2
          done
          echo "nestjs api failed to become healthy"
          tail -100 /tmp/api-nestjs.log || true
          exit 1

      - name: Seed loginable org + admin (existing seed mechanism)
        run: pnpm --filter db run seed

      - name: Build api-go production image (infra/docker/api-go.Dockerfile)
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-entry-smoke:ci .

      # start_api_go 是两阶段复用的容器启动步骤：Phase B 用 shadow 模式，
      # Phase C 重启为 go 模式。模式经 API_GO_USER_SETTINGS_READ_MODE
      # 控制（Go-批3B 统一读模式）。
      - name: "Start api-go container (:4020, Phase B shadow mode)"
        run: |
          # healthcheck 命令来自镜像内置的 exec 形式 HEALTHCHECK 指令
          # （distroless 无 shell——字符串形式 health-cmd 会经 /bin/sh 执行
          # 而失败）；这里只覆盖探测节奏加速等待。
          # Phase B：API_GO_USER_SETTINGS_READ_MODE=shadow——六个 GET 全部
          # 由 NestJS 响应，Go 做真实旁路查询与差分。
          docker run -d --name api-go-smoke \
            --add-host=host.docker.internal:host-gateway \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 20 \
            --health-start-period 5s \
            -p 127.0.0.1:4020:4020 \
            -e PORT=4020 \
            -e LEGACY_API_URL=http://host.docker.internal:4000 \
            -e DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app \
            -e API_GO_USER_SETTINGS_READ_MODE=shadow \
            -e JWT_SECRET="$JWT_SECRET" \
            -e JWT_ISSUER="$JWT_ISSUER" \
            -e JWT_AUDIENCE="$JWT_AUDIENCE" \
            -e REDIS_HOST=host.docker.internal \
            -e REDIS_PORT=6379 \
            -e CANARY_PERCENT=0 \
            -e SHADOW_DEBUG_BODY_LOG=false \
            -e CORS_ORIGIN="$CORS_ORIGIN" \
            api-go-entry-smoke:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api-go-smoke 2>/dev/null || echo starting)
            echo "api-go container health: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs api-go-smoke || true
              exit 1
            fi
            sleep 2
          done
          echo "api-go container failed to become healthy"
          docker logs api-go-smoke || true
          exit 1

      # ---- 以下 smoke 步骤全部经 api-go 入口（:4020）完成 ----

      - name: "Smoke 0/13 — baseline healthz (Phase B: read mode=shadow)"
        run: |
          cat > /tmp/smoke_baseline.py <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:4020/__go/healthz", timeout=10) as resp:
              doc = json.load(resp)
          assert doc.get("ok") is True, doc
          assert doc.get("userSettingsRead", {}).get("database") == "configured", doc
          # Phase B：统一读模式如实展示为 shadow。
          assert doc.get("userSettingsRead", {}).get("mode") == "shadow", doc
          assert doc.get("userSettingsWrite", {}).get("mode") == "legacy", doc
          with open("/tmp/shadow-baseline.json", "w") as f:
              json.dump(doc["shadow"], f)
          print("userSettingsRead.database: configured")
          print("userSettingsRead.mode: shadow (Phase B)")
          print("userSettingsWrite.mode: legacy (PUT still NestJS)")
          print("baseline shadow:", json.dumps(doc["shadow"], sort_keys=True))
          PY
          python3 /tmp/smoke_baseline.py

      - name: "Smoke 1/13 — real login via api-go (NestJS-issued JWT)"
        run: |
          cat > /tmp/smoke_login.py <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          TRACE = "5f1e2d3c4b5a69788697a5b4c3d2e1f0"
          body = json.dumps({
              "email": os.environ["SEED_ADMIN_EMAIL"],
              "password": os.environ["SEED_ADMIN_PASSWORD"],
          }).encode()
          req = urllib.request.Request(
              "http://127.0.0.1:4020/api/auth/login",
              data=body,
              method="POST",
              headers={"content-type": "application/json", "x-trace-id": TRACE},
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  status, headers, payload = resp.status, resp.headers, resp.read()
          except urllib.error.HTTPError as err:
              raise SystemExit(f"login via api-go returned {err.code}: {err.read()[:500]!r}")
          assert status == 200, status
          # trace header 在入口链保持一致（api-go TraceMiddleware 回写同值）。
          assert headers.get("x-trace-id") == TRACE, dict(headers)
          doc = json.loads(payload)
          token = doc.get("accessToken") or ""
          refresh = doc.get("refreshToken") or ""
          assert token.count(".") == 2 and len(token) > 40, "login response missing JWT accessToken"
          assert refresh, "login response missing refreshToken（logout 撤销验证需要）"
          # JWT 只写入临时文件供后续步骤使用，不回显（不进日志）。
          with open("/tmp/smoke-jwt", "w") as f:
              f.write(token)
          with open("/tmp/smoke-refresh", "w") as f:
              f.write(refresh)
          print(f"login ok via api-go -> NestJS: tokenType={doc.get('tokenType')} "
                f"expiresIn={doc.get('expiresIn')} (JWT+refresh saved to tmp, not echoed)")
          print(f"trace header propagated: x-trace-id={headers.get('x-trace-id')}")
          PY
          python3 /tmp/smoke_login.py

      # ---- Phase A：NestJS 单写基线（write=legacy）----

      - name: "Smoke 1b/13 — Phase A baseline: empty PUT writes nothing; record Nest error shapes"
        run: |
          set -euo pipefail
          MYSQL_CID=$(docker ps -q -f ancestor=mysql:8.4 | head -n1)
          test -n "$MYSQL_CID"
          before=$(docker exec "$MYSQL_CID" mysql -uroot -psecret -N -e "SELECT COUNT(*) FROM app.UserSetting" 2>/dev/null)
          test "$before" = "0"
          cat > /tmp/smoke_put_baseline.py <<'PY'
          import json
          import urllib.error
          import urllib.request

          TRACE = "4f1e2d3c4b5a69788697a5b4c3d2e1f0"
          token = open("/tmp/smoke-jwt").read().strip()
          path = "/api/user-settings/ui/onboarding"

          def call(data, content_type="application/json"):
              req = urllib.request.Request(
                  "http://127.0.0.1:4020" + path,
                  data=data, method="PUT",
                  headers={"authorization": f"Bearer {token}", "content-type": content_type, "x-trace-id": TRACE})
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return resp.status, resp.headers.get("content-type") or "", resp.read(), dict(resp.headers)
              except urllib.error.HTTPError as err:
                  return err.code, err.headers.get("content-type") or "", err.read(), dict(err.headers)

          status, ctype, body, headers = call(b"{}")
          assert status == 200, (status, body[:300])
          assert "x-frame-options" in {k.lower() for k in headers}, headers
          doc = json.loads(body)
          assert doc.get("version") == 1 and doc.get("settings") is None, doc
          print("empty PUT {} -> 200 settings=null, helmet header present (NestJS)")

          recorded = {}
          samples = {
              "unknown": b'{"extra":1}',
              "wrong-type": b'{"settings":[]}',
              "invalid-json": b"{",
              "too-large": b"x" * (100 * 1024 + 1),
          }
          for name, raw in samples.items():
              status, ctype, body, headers = call(raw)
              recorded[name] = {"status": status, "contentType": ctype, "body": body.decode("utf-8", "replace")}
              print(f"nest baseline {name}: status={status} content-type={ctype} bytes={len(body)}")
          with open("/tmp/nest-put-errors.json", "w") as f:
              json.dump(recorded, f)
          over = b"x" * (10 * 1024 * 1024 + 1)
          status, ctype, body, headers = call(over)
          with open("/tmp/nest-oversize.json", "w") as f:
              json.dump({
                  "status": status,
                  "contentType": ctype,
                  "body": body.decode("utf-8", "replace"),
              }, f)
          print(f"nest oversize >10MiB: status={status} content-type={ctype} bytes={len(body)} head={body[:180]!r}")
          PY
          python3 /tmp/smoke_put_baseline.py
          after=$(docker exec "$MYSQL_CID" mysql -uroot -psecret -N -e "SELECT COUNT(*) FROM app.UserSetting" 2>/dev/null)
          test "$after" = "0"
          echo "empty object + rejected bodies did not insert UserSetting rows"

      # ---- Phase A：写入准备（六个 PUT 由 NestJS 单写）----

      - name: "Smoke 2/13 — Phase A: six user-settings PUTs via api-go (NestJS single-writer)"
        run: |
          cat > /tmp/smoke_put.py <<'PY'
          import json
          import urllib.error
          import urllib.request

          TRACE = "5f1e2d3c4b5a69788697a5b4c3d2e1f0"
          token = open("/tmp/smoke-jwt").read().strip()

          # 六个端点各写入与默认值不同的确定性 settings（每个端点独立 payload，
          # 后续 GET 断言各自读回自己的 key——证明无跨 key 串读）。
          # expected 是 NestJS normalization 之后的期望值（PUT 响应即 GET
          # 形状，按 normalized 值断言）。PUT 全部经 api-go 的 method 白名单
          # 回落 /api/ legacy——由 NestJS 单写（200 + NestJS 回显本身就是
          # 「PUT 未被 Go 接管」的证据）。
          #
          # situation-monitor 的 body 顶层是 monitors/layout/settings 三段
          # （不是 settings 包裹）；war-map/newsnow 用覆盖关键 normalization
          # 的代表性数据（legacy layer key、clamp、排序、上限、真值）。
          PUTS = {
              "/api/user-settings/ui/onboarding": {
                  "body": {"settings": {
                      "completed": True,
                      "dismissed": True,
                      "checklist": {"today": True, "events": True, "map": True, "finance": False},
                      "completedTours": {"today": True},
                  }},
                  "expected": {
                      "completed": True,
                      "dismissed": True,
                      "checklist": {"today": True, "events": True, "map": True, "finance": False},
                      "completedTours": {"today": True},
                  },
              },
              "/api/user-settings/ui/rss-reader": {
                  "body": {"settings": {
                      "selectedSourceIds": ["src-alpha", "src-beta"],
                      "sourceLanguageFilters": ["en", "ZH"],
                      "translationEnabled": True,
                      "translationProvider": "llm",
                      "targetLanguage": "en-US",
                      "showOriginalContent": True,
                  }},
                  "expected": {
                      "selectedSourceIds": ["src-alpha", "src-beta"],
                      "sourceLanguageFilters": ["EN", "ZH"],
                      "translationEnabled": True,
                      "translationProvider": "llm",
                      "targetLanguage": "en-US",
                      "showOriginalContent": True,
                  },
              },
              "/api/user-settings/ui/spacetime-timeline": {
                  "body": {"settings": {
                      "authoritativeLock": False,
                      "requireCorroborated": False,
                      "sourceType": "mixed",
                      "sortBy": "latest",
                      "minHeatScore": 3.5,
