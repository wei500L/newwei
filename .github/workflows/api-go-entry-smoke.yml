          assert doc.get("version") == 1, doc
          assert doc.get("settings") == EXPECTED_SETTINGS, doc
          assert isinstance(doc.get("updatedAt", {}).get("settings"), str) and doc["updatedAt"]["settings"], doc
          print("NestJS 停止后：GET onboarding via api-go -> 200（Go handler 独立响应）")
          print(f"  cache-control=no-store, content-type ok, trace header ok, settings 一致, updatedAt ok")

          # 反证：未迁移端点（rss-reader，shadow → NestJS）必须因上游死亡
          # 而失败——证明 onboarding 的成功不是 NestJS 仍在后台存活。
          req = urllib.request.Request(
              "http://127.0.0.1:4020/api/user-settings/ui/rss-reader",
              headers={"authorization": f"Bearer {token}", "x-trace-id": TRACE})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  raise SystemExit(f"rss-reader unexpectedly succeeded ({resp.status}) — NestJS 可能未停止")
          except urllib.error.HTTPError as err:
              # 502 = api-go 代理层对上游不可达的契约错误（非 200 伪装成功）。
              assert err.code == 502, (err.code, err.read()[:300])
          print("NestJS 停止后：GET rss-reader（shadow，未迁移）-> 502（上游不可达，未伪装成功）")
          PY
          python3 /tmp/smoke_takeover.py
          # api-go 容器保持 healthy（Go 端点与探活不依赖 NestJS）。
          HEALTH=$(docker inspect --format '{{.State.Health.Status}}' api-go-smoke)
          test "$HEALTH" = "healthy"
          echo "api-go container still healthy after NestJS stopped"
          # 最终 shadow 指标：onboarding 全程不产生 shadow 执行；RSS/
          # Spacetime/healthz.live 各执行一次 = 基线 +3；diffs/dropped 零增量。
          cat > /tmp/smoke_final.py <<'PY'
          import json
          import time
          import urllib.request

          DROPPED_KEYS = ("request-too-large", "response-too-large", "streaming-skipped",
                          "concurrency-limit", "rate-limit", "timeout")
          baseline = json.load(open("/tmp/shadow-baseline.json"))
          # 本 smoke 的 shadow 执行：healthz/live + rss-reader（NestJS 存活期）
          # + spacetime-timeline = 3。onboarding 全部由 Go handler 响应——
          # executed 不含 onboarding；NestJS 停止后的 rss-reader 502 不执行。
          want_executed = baseline["executed"] + 3

          def health():
              with urllib.request.urlopen("http://127.0.0.1:4020/__go/healthz", timeout=10) as resp:
                  return json.load(resp)

          # shadow 执行是异步的——轮询到目标值且 inflight 归零。
          deadline = time.time() + 30
          doc = health()
          while time.time() < deadline:
              now = doc["shadow"]
              if now["executed"] >= want_executed and now["inflight"] == 0:
                  break
              time.sleep(1)
              doc = health()
          now = doc["shadow"]

          assert now["executed"] == want_executed, (
              f"executed {baseline['executed']} -> {now['executed']}, want exactly +3 ({want_executed})")
          assert now["diffs"] == baseline["diffs"], (
              f"diffs {baseline['diffs']} -> {now['diffs']} (shadow diff detected!)")
          assert now["inflight"] == 0, f"inflight {now['inflight']} != 0"
          for key in DROPPED_KEYS:
              assert now["dropped"][key] == baseline["dropped"][key], (
                  f"dropped[{key}] {baseline['dropped'][key]} -> {now['dropped'][key]}")
          assert sum(now["dropped"].values()) == sum(baseline["dropped"].values()), now["dropped"]
          assert doc.get("userSettingsShadow", {}).get("database") == "configured", doc
          assert doc.get("onboarding", {}).get("mode") == "go", doc

          print("=== api-go entry smoke (Go-批3A): FINAL SHADOW METRICS (before -> after) ===")
          print(f"executed: {baseline['executed']} -> {now['executed']} "
                f"(delta +{now['executed'] - baseline['executed']}, expect 3: live+rss+spacetime, onboarding excluded)")
          print(f"diffs:    {baseline['diffs']} -> {now['diffs']} (delta 0)")
          print(f"inflight: {baseline['inflight']} -> {now['inflight']} (back to 0)")
          print(f"dropped:  {json.dumps(now['dropped'], sort_keys=True)} "
                f"(all categories unchanged, total {sum(now['dropped'].values())})")
          print("onboarding.mode: go (全响应，零 shadow 执行)")
          print("userSettingsShadow.database: configured")
          print("api-go entry smoke: ALL ASSERTIONS PASSED")
          PY
          python3 /tmp/smoke_final.py

      - name: Dump service logs on failure (hash/status/category only by design)
        if: failure()
        run: |
          echo "=== api-go container log (shadow-diff 记录默认只含 hash/状态/分类，SHADOW_DEBUG_BODY_LOG=false) ==="
          docker logs api-go-smoke 2>&1 | tail -200 || true
          echo "=== nestjs api log (tail) ==="
          tail -150 /tmp/api-nestjs.log || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f api-go-smoke >/dev/null 2>&1 || true
          kill $(cat /tmp/api-nestjs.pid) 2>/dev/null || true
          pkill -f "dist/main.js" 2>/dev/null || true
