                      raise SystemExit(f"GET {path} -> {resp.status}, want 404（NestJS 未注册该路由）")
              except urllib.error.HTTPError as err:
                  assert err.code == 404, (path, err.code, err.read()[:300])
                  doc = json.loads(err.read())
                  assert doc.get("statusCode") == 404 and doc.get("error") == "Not Found", (path, doc)
              print(f"GET {path} -> 404 (NestJS via legacy proxy — 未误命中 Go handler)")
          PY
          python3 /tmp/smoke_boundaries.py

