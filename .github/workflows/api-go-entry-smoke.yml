          cat > /tmp/smoke_go_put.py <<'PY'
          import json
          import threading
          import urllib.error
          import urllib.request

          TRACE = "af1e2d3c4b5a69788697a5b4c3d2e1f0"
          token = open("/tmp/smoke-jwt").read().strip()

          def request(method, url, data=None, auth=True):
              headers = {"x-trace-id": TRACE}
              if auth:
                  headers["authorization"] = f"Bearer {token}"
              if data is not None:
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return resp.status, resp.headers, resp.read()
              except urllib.error.HTTPError as err:
                  return err.code, err.headers, err.read()

          def put_go(path, raw):
              status, headers, body = request("PUT", "http://127.0.0.1:4020" + path, raw)
              assert status == 200, (path, status, body[:500])
              assert (headers.get("content-type") or "").startswith("application/json"), (path, dict(headers))
              assert headers.get("x-trace-id") == TRACE, (path, dict(headers))
              assert not headers.get("x-frame-options"), (path, dict(headers))
              return json.loads(body)

          def get_json(url):
              status, headers, body = request("GET", url)
              assert status == 200, (url, status, body[:300])
              return json.loads(body)

          def cross(path, raw):
              written = put_go(path, raw)
              nest = get_json("http://127.0.0.1:4000" + path)
              go = get_json("http://127.0.0.1:4020" + path)
              assert written == nest == go, (
                  path,
                  json.dumps(written, sort_keys=True)[:1500],
                  json.dumps(nest, sort_keys=True)[:1500],
                  json.dumps(go, sort_keys=True)[:1500])
              print(f"Go PUT {path} == Nest GET == Go GET")
              return written

          # 空对象不新增行（先删掉 Phase A 的 onboarding 行）。
          # 删除在 shell 里做；这里只发空 PUT，shell 再数行。
          empty = put_go("/api/user-settings/ui/onboarding", b"{}")
          assert empty.get("settings") is None, empty
          print("empty PUT {} -> settings null (Go)")

          bodies = {
              "/api/user-settings/ui/onboarding": {"settings": {
                  "completed": True, "dismissed": True,
                  "checklist": {"today": True, "events": True, "map": True, "finance": False},
                  "completedTours": {"today": True}}},
              "/api/user-settings/ui/rss-reader": {"settings": {
                  "selectedSourceIds": ["src-alpha", "src-beta"],
                  "sourceLanguageFilters": ["en", "ZH"],
                  "translationEnabled": True, "translationProvider": "llm",
