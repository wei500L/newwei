          python3 /tmp/smoke_go_shadow.py

      - name: "Smoke 8b/13 — Phase C: Go PUT write takeover, cross-read, empty, concurrency, isolation"
        run: |
          set -euo pipefail
          MYSQL_CID=$(docker ps -q -f ancestor=mysql:8.4 | head -n1)
          USER_ID=$(docker exec "$MYSQL_CID" mysql -uroot -psecret -N -e \
