              except urllib.error.HTTPError as err:
                  return err.code, json.loads(err.read())

          # 1) 篡改签名：真实登录 token 的签名段中部换一个字符（恶意输入，
          #    不是伪造合法登录）。
          parts = token.split(".")
          sig = parts[2]
          flipped = ("A" if sig[0] != "A" else "B") + sig[1:]
          tampered = f"{parts[0]}.{parts[1]}.{flipped}"
          status, doc = go_get(tampered)
          assert status == 401, (status, doc)
          assert doc.get("message") == "Unauthorized" and doc.get("error") == "Unauthorized", doc
          print("tampered signature -> Go 401 Unauthorized（与 NestJS passport 层同形态）")

          # 2) alg 混淆：alg=none + 保留真实 payload + 空签名。
          header = base64.urlsafe_b64encode(
              json.dumps({"alg": "none", "typ": "JWT"}).encode()).rstrip(b"=").decode()
          alg_none = f"{header}.{parts[1]}."
          status, doc = go_get(alg_none)
          assert status == 401, (status, doc)
          assert doc.get("message") == "Unauthorized", doc
          print("alg=none confusion -> Go 401 Unauthorized（拒绝未签名 token）")
