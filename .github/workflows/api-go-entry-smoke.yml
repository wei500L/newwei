                  "expected": {
                      # monitors 第二条（Bad location）缺失 id/createdAt——
                      # NestJS fallback 是 randomUUID()/Date.now()（非确定值）。
                      # fixture 第一条提供稳定 id/createdAt；第二条用哨兵
                      # 标记（"@exists:sm-"/"@exists:int"）断言 fallback 行为
                      # 本身（id 以 sm- 开头、createdAt 是毫秒整数）——不是把
                      # 随机字段加入 ignore 集。
                      "monitors": [
                          {"id": "mon-1", "name": "Taiwan Strait", "keywords": ["ship", "navy", "MISSING"],
                           "enabled": True, "color": "#ff00aa", "location": {"name": "Taipei", "lat": 25.03, "lng": 121.56},
                           "createdAt": 1757000000000},
                          {"id": "@exists:sm-", "name": "Bad location", "keywords": ["y"],
                           "enabled": True, "createdAt": "@exists:int"},
                      ],
                      "layout": {
                          "layouts": {
                              "lg": [{"i": "legacy-1", "x": 0, "y": 3, "w": 1, "h": 5, "minW": 1, "static": True}],
                              "md": [{"i": "md-1", "x": 0, "y": 2, "w": 3, "h": 1, "minH": 1}],
                          },
                          "visibility": {"panel-1": True, "panel-3": False},
                      },
                      "settings": {"windowHours": 24, "scope": "all", "autoRefresh": True,
                                   "resetLayoutOnPreset": True, "translateToZh": True},
                  },
              },
          }

          def assert_value(got, want, context):
              # 哨兵断言（@exists: 前缀）：只断言存在性与形态，不比较精确值
              #（fallback 的 randomUUID/Date.now() 本身非确定——显式断言其
              # 存在与形态，不静默 ignore）。
              if isinstance(want, str) and want.startswith("@exists:"):
                  assert got is not None, f"{context}: fallback value missing (want exists)"
                  form = want[len("@exists:"):]
                  if form == "int":
                      assert isinstance(got, int) and got > 1_500_000_000_000, (
                          f"{context}: createdAt = {got!r}, want 毫秒时间戳")
                  elif form.startswith("sm-"):
                      assert isinstance(got, str) and got.startswith("sm-"), (
                          f"{context}: id = {got!r}, want sm- 前缀 fallback")
                  return
              assert got == want, (
                  f"{context}\n  got:      {json.dumps(got, sort_keys=True)}\n"
                  f"  expected: {json.dumps(want, sort_keys=True)}")

          def assert_equal(actual, want, context):
              if isinstance(want, dict):
                  assert isinstance(actual, dict), f"{context}: got {type(actual).__name__}, want object"
                  for key, value in want.items():
                      assert_value(actual.get(key), value, f"{context}.{key}")
              elif isinstance(want, list):
                  assert isinstance(actual, list), f"{context}: got {type(actual).__name__}, want array"
                  assert len(actual) == len(want), f"{context}: len {len(actual)} != {len(want)}"
                  for i, item in enumerate(want):
                      assert_equal(actual[i], item, f"{context}[{i}]")
              else:
                  assert_value(actual, want, context)

          for path, payload in PUTS.items():
              req = urllib.request.Request(
                  f"http://127.0.0.1:4020{path}",
                  data=json.dumps(payload["body"]).encode(),
                  method="PUT",
                  headers={
                      "authorization": f"Bearer {token}",
                      "content-type": "application/json",
                      "x-trace-id": TRACE,
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      status, headers, body = resp.status, resp.headers, resp.read()
              except urllib.error.HTTPError as err:
                  raise SystemExit(f"PUT {path} via api-go returned {err.code}: {err.read()[:800]!r}")
              assert status == 200, (path, status)
              assert headers.get("x-trace-id") == TRACE, (path, dict(headers))
              # helmet 是 NestJS 响应的可观察证据（Go 写 handler 不设置该头）。
              assert headers.get("x-frame-options"), (path, dict(headers))
              doc = json.loads(body)
              assert doc.get("version") == 1, (path, doc)
              expected = dict(payload["expected"])
              expected.pop("_partial", False)
              # 响应形态判别：situation-monitor 是顶层三段（monitors/layout/
              # settings 都是顶层段）；单 key 端点是 {settings: {...}} 包裹
              # ——不能只看 "settings" in doc（situation-monitor 顶层也有
              # settings 段），以 monitors 段判别。
              actual = doc if "monitors" in doc else doc.get("settings")
              for key, want in expected.items():
                  assert_equal(actual.get(key), want, f"{path}: {key}")
              print(f"PUT {path} -> 200 (NestJS 响应回显 normalized settings 一致, trace header ok)")
          PY
