          assert stable_json(body) == stable_json(base["body"]), (stable_json(body), stable_json(base["body"])[:500])
          print(f"Go >10MiB matches Nest status={status} and wrote nothing")
          PY
          # 空写断言放在 Python 之前删行、之后查行。上面的脚本把空 PUT 放在
          # 代表性写入之前，所以这里先删 onboarding 再跑脚本会把顺序弄反。
          # 改为：脚本内部空 PUT 发生在代表性写入之前，因此删行必须在脚本前。
