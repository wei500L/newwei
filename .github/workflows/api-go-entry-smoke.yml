          assert partial["monitors"] == before["monitors"], "partial update changed monitors"
          assert partial["layout"] == before["layout"], "partial update changed layout"
          assert partial["updatedAt"].get("monitors") == before["updatedAt"].get("monitors")
          assert partial["updatedAt"].get("layout") == before["updatedAt"].get("layout")
          assert partial["settings"]["windowHours"] == 6 and partial["settings"]["scope"] == "tagged"
          print("situation-monitor partial update kept monitors/layout")

          # 并发 upsert 同一个 key。
          errors = []
          def once():
              status, _, body = request(
                  "PUT", "http://127.0.0.1:4020/api/user-settings/ui/rss-reader",
                  json.dumps({"settings": {"translationEnabled": True, "translationProvider": "llm"}}).encode())
              if status != 200:
                  errors.append((status, body[:200]))
          threads = [threading.Thread(target=once) for _ in range(2)]
          for thread in threads:
              thread.start()
          for thread in threads:
              thread.join()
          assert not errors, errors
          print("concurrent rss-reader upserts returned 200")

          # 与 Phase A 记录的 Nest 错误形状对照；这些请求不得成功。
          recorded = json.load(open("/tmp/nest-put-errors.json"))
          samples = {
              "unknown": b'{"extra":1}',
              "wrong-type": b'{"settings":[]}',
              "invalid-json": b"{",
              "too-large": b"x" * (100 * 1024 + 1),
