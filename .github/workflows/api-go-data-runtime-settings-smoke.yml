          reset_settings()
          parity("dynamic revoke PUT", "PUT", REALTIME_PATH, admin_a_token, {"maxRetries": 6}, 403,
                 expected_message="Platform admin access required")
          print("phase 2k ok: platform role grant/revoke takes effect immediately")

          # ---- DS2: DB 权威合并基准 ----
          # 预热 Go 的实时设置缓存（旧值），随后直接改 DB，再做一次只改一个字段的
          # Go PUT：DB 中的另一字段不得被缓存旧值回滚。
          reset_settings()
          set_setting(REALTIME_KEY, json.dumps({"maxRetries": 1, "requestTimeoutMs": 30000}))
          redis("DEL", REALTIME_CACHE)
          request_json("DS2 warm go cache", GO_URL, "GET", REALTIME_PATH, platform_token)
          set_setting(REALTIME_KEY, json.dumps({"maxRetries": 1, "requestTimeoutMs": 45000}))
          request_json("DS2 go partial", GO_URL, "PUT", REALTIME_PATH, platform_token, {"maxRetries": 5})
          stored = json.loads(raw_setting(REALTIME_KEY))
          require("DS2 go keeps fresh DB field", stored.get("requestTimeoutMs"), 45000)
          require("DS2 go applies its own field", stored.get("maxRetries"), 5)
          # 反向：预热 Nest 缓存后直接改 DB，再做 Nest PUT。
          redis("DEL", REALTIME_CACHE)
          request_json("DS2 warm nest cache", NEST_URL, "GET", REALTIME_PATH, platform_token)
          set_setting(REALTIME_KEY, json.dumps({"maxRetries": 5, "requestTimeoutMs": 50000}))
          request_json("DS2 nest partial", NEST_URL, "PUT", REALTIME_PATH, platform_token,
                       {"adsbEnabled": False})
          stored = json.loads(raw_setting(REALTIME_KEY))
          require("DS2 nest keeps fresh DB field", stored.get("requestTimeoutMs"), 50000)
          # 交叉：Nest 写 A、Go 写 B，两者都保留。
          reset_settings()
          request_json("DS2 nest writes A", NEST_URL, "PUT", REALTIME_PATH, platform_token,
                       {"requestTimeoutMs": 40000})
          request_json("DS2 go writes B", GO_URL, "PUT", REALTIME_PATH, platform_token,
                       {"maxRetries": 6})
          stored = json.loads(raw_setting(REALTIME_KEY))
          require("DS2 cross keeps A", stored.get("requestTimeoutMs"), 40000)
          require("DS2 cross keeps B", stored.get("maxRetries"), 6)
          # Nominatim：Go 改 userAgent、Nest 改 email，互不覆盖。
          reset_settings()
          request_json("DS2 nominatim go ua", GO_URL, "PUT", NOMINATIM_PATH, platform_token,
                       {"userAgent": "drs-go/1.0"})
          request_json("DS2 nominatim nest email", NEST_URL, "PUT", NOMINATIM_PATH, platform_token,
                       {"email": "geo@example.com"})
          overrides = json.loads(raw_setting(NOMINATIM_KEY))
          require("DS2 nominatim keeps ua", overrides.get("userAgent"), "drs-go/1.0")
          require("DS2 nominatim keeps email", overrides.get("email"), "geo@example.com")
          print("phase 2l ok: DB-authoritative merges keep both fields (DS2)")

          # ---- DS2: 真实 MySQL 持锁 → 409，释放后恢复 ----
          def hold_mysql_lock(lock_name, seconds=25):
              cid = container_id("mysql:8.4")
              return subprocess.Popen(
                  ["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "app", "-e",
                   f"SELECT GET_LOCK('{lock_name}', 5); SELECT SLEEP({seconds});"],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          reset_settings()
          set_setting(REALTIME_KEY, json.dumps({"maxRetries": 2}))
          redis("DEL", REALTIME_CACHE)
          holder = hold_mysql_lock(REALTIME_LOCK)
          try:
              time.sleep(2)
              for side, base in (("nest", NEST_URL), ("go", GO_URL)):
                  started = time.time()
                  status, raw = call(base, REALTIME_PATH, "PUT", platform_token, {"maxRetries": 4})
                  elapsed = time.time() - started
                  if status != 409 or message_of(raw) != REALTIME_BUSY:
                      fail(f"DS2 lock {side}: {status} {message_of(raw)!r} want 409 {REALTIME_BUSY!r}")
                  if elapsed < 9 or elapsed > 35:
                      fail(f"DS2 lock {side}: elapsed={elapsed:.1f}s outside the GET_LOCK window")
              stored = json.loads(raw_setting(REALTIME_KEY))
              require("DS2 lock kept the row", stored.get("maxRetries"), 2)
              print("phase 2m ok: both sides wait for the same lock and return the 409 contract")
          finally:
              holder.wait()
              time.sleep(1)
          reset_settings()
          parity("DS2 lock released", "PUT", REALTIME_PATH, platform_token, {"maxRetries": 4})

          reset_settings()
          set_setting(NOMINATIM_KEY, json.dumps({"userAgent": "lock-probe"}))
          holder = hold_mysql_lock(NOMINATIM_LOCK)
          try:
              time.sleep(2)
              for side, base in (("nest", NEST_URL), ("go", GO_URL)):
                  status, raw = call(base, NOMINATIM_PATH, "PUT", platform_token,
                                     {"userAgent": "blocked"})
                  if status != 409 or message_of(raw) != NOMINATIM_BUSY:
                      fail(f"DS2 nominatim lock {side}: {status} {message_of(raw)!r}")
              print("phase 2n ok: nominatim writes share one lock and the 409 contract")
          finally:
              holder.wait()
              time.sleep(1)
          reset_settings()
          parity("DS2 nominatim lock released", "PUT", NOMINATIM_PATH, platform_token,
                 {"userAgent": "after-lock"})

          # ---- DS3/DS4: 归档状态 ----
          seed_archive_status()
          counts, recent = expected_status_snapshot(ORG_A)
          nest_doc, go_doc = parity("DS4 status", "GET", ARCHIVE_STATUS_PATH, platform_token)
          require("DS4 counts", nest_doc.get("counts"), {k: v for k, v in counts.items() if k != "pending"})
          require("DS4 pending", nest_doc.get("pending"), counts["pending"])
          require("DS4 recent length", len(nest_doc.get("recentStatuses", [])), 10)
          if len(nest_doc["recentStatuses"]) != len(recent):
              fail("DS4 recent length mismatch against the Redis snapshot")
          for index, record in enumerate(recent):
              public = nest_doc["recentStatuses"][index]
              require(f"DS4 order {index}", public.get("scopeValue"), record.get("scopeValue"))
          if json.dumps(nest_doc).find(ORG_B) != -1:
              fail("DS4 response leaked the foreign organisation")
          for key in ("orgId", STATUS_KEY_PREFIX, "traceId"):
              if key in json.dumps(nest_doc):
                  fail(f"DS4 response leaked {key}")
          # 同 score 时 Redis 按成员字典序升序返回，读取端 reverse 后 zzz-tie 在前。
          tie_positions = {record["scopeValue"]: index for index, record in enumerate(nest_doc["recentStatuses"])}
          if "aaa-tie" not in tie_positions or "zzz-tie" not in tie_positions:
              fail(f"DS4 equal-score members missing: {tie_positions}")
          if tie_positions["zzz-tie"] >= tie_positions["aaa-tie"]:
              fail(f"DS4 equal-score order not preserved after reverse: {tie_positions}")
          # 旧无 orgId 记录按 key 第 5 段回退后归属 org A。
          legacy_record = next((r for r in expected_status_snapshot(ORG_A)[1]
                                if r.get("scopeValue") == "legacy-no-org"), None)
          if legacy_record is None:
              fail("DS4 legacy fixture missing from the expected snapshot")
          # 12+ 条时 counts 全量、recent 只取 10。
          if counts["completed"] + counts["active"] + counts["failed"] + counts["waiting"] < 12:
              fail(f"DS4 counts do not cover the whole snapshot: {counts}")
          # DS3 脱敏：Go 与 Nest 的脱敏结果一致且不含凭据。
          raw_redis = redis("GET", status_key("digest", ORG_A, "2026-01-12"))
          if "tok.abc-1" not in raw_redis:
              fail("DS3 Redis original must keep the unredacted text")
          redacted = [r for r in nest_doc["recentStatuses"] if r.get("errorMessage")]
          sensitive = [r["errorMessage"] for r in redacted if "Bearer" in (r["errorMessage"] or "")]
          if not sensitive:
              fail(f"DS3 fixture with a Bearer token was not visible: {redacted}")
          for text in sensitive:
              if "tok.abc-1" in text or "password=pw" in text or "secret=s1" in text:
                  fail(f"DS3 public message not redacted: {text!r}")
              if "[REDACTED]" not in text:
                  fail(f"DS3 public message missing the redaction marker: {text!r}")
          print("phase 2o ok: archive status counts/order/org isolation/redaction (DS3, DS4)")

          # 空索引 → 空状态（不伪装成有数据）。
          redis("DEL", STATUS_INDEX)
          nest_doc, go_doc = parity("DS4 empty index", "GET", ARCHIVE_STATUS_PATH, platform_token)
          require("DS4 empty counts", nest_doc.get("counts"),
                  {"waiting": 0, "active": 0, "completed": 0, "failed": 0, "delayed": 0})
          require("DS4 empty recent", nest_doc.get("recentStatuses"), [])
          seed_archive_status()

          # ---- 加密策略矩阵 ----
          print("phase 2p: encryption policy matrix")
          reset_settings()
          # Nest 写密文 → Go 读取与来源一致。
          request_json("crypto nest write", NEST_URL, "PUT", REALTIME_PATH, platform_token,
                       {"openskyClientSecret": "nest-secret"})
          raw = raw_setting(REALTIME_KEY)
          if '"__enc":"system-settings:v1"' not in raw.replace(" ", ""):
              fail(f"crypto nest write did not store an envelope: {raw[:200]!r}")
          nest_doc, go_doc = parity("crypto nest->go source", "GET", REALTIME_PATH, platform_token)
          require("crypto nest->go has", nest_doc.get("hasOpenskyClientSecret"), True)
          require("crypto nest->go source", nest_doc.get("openskyClientSecretSource"), "stored")
          # Go 写密文 → Nest 读取与来源一致。
          reset_settings()
          request_json("crypto go write", GO_URL, "PUT", REALTIME_PATH, platform_token,
                       {"openskyClientSecret": "go-secret"})
          raw = raw_setting(REALTIME_KEY)
          if '"__enc":"system-settings:v1"' not in raw.replace(" ", ""):
              fail(f"crypto go write did not store an envelope: {raw[:200]!r}")
          nest_doc, go_doc = parity("crypto go->nest source", "GET", REALTIME_PATH, platform_token)
          require("crypto go->nest has", nest_doc.get("hasOpenskyClientSecret"), True)
          require("crypto go->nest source", nest_doc.get("openskyClientSecretSource"), "stored")
          envelope_before = json.loads(raw_setting(REALTIME_KEY))["openskyClientSecret"]
          # 未提供 secret 的更新必须保持密文原字节不变。
          request_json("crypto nest untouched", NEST_URL, "PUT", REALTIME_PATH, platform_token,
                       {"maxRetries": 3})
          require("crypto nest untouched bytes", json.loads(raw_setting(REALTIME_KEY))["openskyClientSecret"],
                  envelope_before)
          request_json("crypto go untouched", GO_URL, "PUT", REALTIME_PATH, platform_token,
                       {"maxRetries": 4})
          require("crypto go untouched bytes", json.loads(raw_setting(REALTIME_KEY))["openskyClientSecret"],
                  envelope_before)
          print("phase 2p ok: Nest<->Go ciphertext interop and untouched ciphertext preservation")

          # ---- 加密策略：生产无 key / 显式 false / 错 key ----
          print("phase 2q: production key policy")
          reset_settings()
          start_go("go", encryption_key=None)
          status, raw = call(GO_URL, REALTIME_PATH, "PUT", platform_token,
                             {"openskyClientSecret": "blocked"})
          if status != 400 or message_of(raw) != ("SYSTEM_SETTINGS_ENCRYPTION_KEY is required to "
                                                  "store secrets in production"):
              fail(f"go production no key: {status} {message_of(raw)!r}")
          # 显式 false 是逃生舱：即使有 key 也存明文。
          set_setting("system_security", json.dumps({"secretEncryptionEnabled": False}))
          redis("DEL", "system_security:settings")
          request_json("go explicit false", GO_URL, "PUT", REALTIME_PATH, platform_token,
                       {"openskyClientSecret": "plain-escape"})
          raw = raw_setting(REALTIME_KEY)
          if "plain-escape" not in raw:
              fail(f"go explicit false must store plaintext: {raw[:200]!r}")
          start_go("go", encryption_key=VALID_KEY)
          sql("DELETE FROM SystemSetting WHERE `key`='system_security';")
          redis("DEL", "system_security:settings")
          # 错 key：读取降级为无可用 stored secret，绝不 500。
          reset_settings()
          request_json("crypto write with valid key", GO_URL, "PUT", REALTIME_PATH, platform_token,
                       {"openskyClientSecret": "rotated"})
          start_go("go", encryption_key=WRONG_KEY)
          status, raw = call(GO_URL, REALTIME_PATH, "GET", platform_token)
          if status != 200:
              fail(f"wrong key GET must not fail: {status} {raw[:200]!r}")
          doc = body(raw)
          require("wrong key has", doc.get("hasOpenskyClientSecret"), False)
          require("wrong key source", doc.get("openskyClientSecretSource"), "none")
          start_go("go", encryption_key=VALID_KEY)
          # Nest 侧生产无 key。
          reset_settings()
          start_nest(encryption_key=None)
          status, raw = call(NEST_URL, REALTIME_PATH, "PUT", platform_token,
                             {"openskyClientSecret": "blocked"})
          if status != 400 or message_of(raw) != ("SYSTEM_SETTINGS_ENCRYPTION_KEY is required to "
                                                  "store secrets in production"):
              fail(f"nest production no key: {status} {message_of(raw)!r}")
          start_nest(encryption_key=VALID_KEY)
          print("phase 2q ok: production failures, explicit-false escape hatch and wrong-key fallback")

          # ---- geo 进程缓存差异（刻意保留，未改成 Redis 全局缓存） ----
          print("phase 2r: geo process cache")
          reset_settings()
          request_json("geo seed nest cache", NEST_URL, "GET", NOMINATIM_PATH, platform_token)
          # Go 改写 DB 后，Nest 的进程缓存最多 30 秒仍返回旧值：这是刻意保留的行为，
          # 不是缺陷，也不在比较测试中误判为差异。
          request_json("geo go write", GO_URL, "PUT", NOMINATIM_PATH, platform_token,
                       {"userAgent": "go-fresh"})
          stored = json.loads(raw_setting(NOMINATIM_KEY))
          require("geo DB after go write", stored.get("userAgent"), "go-fresh")
          status, raw = call(NEST_URL, NOMINATIM_PATH, "GET", platform_token)
          if status != 200:
              fail(f"geo nest cached GET: {status} {raw[:200]!r}")
          if (body(raw) or {}).get("userAgent") is not None:
              fail("geo nest process cache must still serve the pre-write value for up to 30s")
          # 写入方自己的缓存立即刷新。
          go_doc = request_json("geo go immediate", GO_URL, "GET", NOMINATIM_PATH, platform_token)
          require("geo go immediate visible", go_doc.get("userAgent"), "go-fresh")
          # 等 TTL 过期后两侧可比较（跨实例 GET 需等 31 秒或重启）。
          time.sleep(31)
          nest_doc, go_doc = parity("geo after ttl", "GET", NOMINATIM_PATH, platform_token)
          require("geo after ttl", nest_doc.get("userAgent"), "go-fresh")
          # 异步（fire-and-forget）审计：有界轮询等待，不改成 awaited。
          sql("DELETE FROM AuditLog WHERE action='geo_nominatim_settings_update'")
          request_json("geo audit write", GO_URL, "PUT", NOMINATIM_PATH, platform_token,
                       {"userAgent": "audit-probe"})
          geo_meta, geo_actor = newest_audit("geo_nominatim_settings_update", timeout=15)
          if geo_meta is None:
              fail("geo fire-and-forget audit did not appear within 15s")
          require("geo audit metadata", geo_meta, {"userAgent": "audit-probe", "email": None})
          require("geo audit actor", geo_actor, PLATFORM_USER)
          print("phase 2r ok: the 30s process cache is retained，异步审计在有界轮询内落库")

          print("ALL PHASE 1-2 CHECKS PASSED")

          # ===================== phase 3: nested rewrite / rollback =====================

          print("==== phase 3: nest stopped ====")
          # 停 Nest 前重新登录，令牌寿命覆盖后续阶段。
          alive = login(PLATFORM_EMAIL)
          stop_nest()
          stopped = False
          for _ in range(30):
              try:
                  urllib.request.urlopen(NEST_URL + "/api/healthz/live", timeout=2).read()
              except Exception:
                  stopped = True
                  break
              time.sleep(1)
          if not stopped:
              fail("nestjs did not stop")

          # 以全新进程接管（清空进程内缓存），确认 Go 直接读 MySQL/Redis 的非空 fixture，
          # 而不是复用停机前的缓存。
          start_go("go")
          reset_settings()
          set_setting(REALTIME_KEY, json.dumps({"maxRetries": 6}))
          set_setting(ARCHIVE_KEY, json.dumps({"jobBatchSize": 35, "embeddingBatchSize": 25,
                                              "embeddingMaxConcurrency": 3, "rerankMaxConcurrency": 2}))
          set_setting(NOMINATIM_KEY, json.dumps({"userAgent": "nestjs-down/1.0"}))
          seed_archive_status()
          redis("DEL", REALTIME_CACHE, ARCHIVE_CACHE)

          def takeover(label, method, path, token, payload=None, expected=200):
              status, raw = call(GO_URL, path, method, token, payload)
              if status != expected:
                  fail(f"after nest stop {label}: {status} {raw[:400]!r}, want {expected}")
              return body(raw)

          realtime_doc = takeover("realtime GET", "GET", REALTIME_PATH, alive)
          require("realtime non-empty fixture", realtime_doc.get("maxRetries"), 6)
          archive_doc = takeover("archive GET", "GET", ARCHIVE_SETTINGS_PATH, alive)
          require("archive non-empty fixture", archive_doc.get("jobBatchSize"), 35)
          status_doc = takeover("status GET", "GET", ARCHIVE_STATUS_PATH, alive)
          if not status_doc.get("recentStatuses"):
              fail("archive status must be non-empty after nest stop")
          expected_counts, _ = expected_status_snapshot(ORG_A)
          require("status counts", status_doc.get("counts"),
                  {k: v for k, v in expected_counts.items() if k != "pending"})
          nom_doc = takeover("nominatim GET", "GET", NOMINATIM_PATH, alive)
          require("nominatim non-empty fixture", nom_doc.get("userAgent"), "nestjs-down/1.0")

          # 五条写仍受平台门禁。
          for method, path, payload in (
              ("PUT", REALTIME_PATH, {"maxRetries": 1}),
              ("DELETE", REALTIME_PATH, None),
              ("PUT", ARCHIVE_SETTINGS_PATH, {"jobBatchSize": 10, "embeddingBatchSize": 10,
                                              "embeddingMaxConcurrency": 1, "rerankMaxConcurrency": 1}),
              ("DELETE", ARCHIVE_SETTINGS_PATH, None),
              ("PUT", NOMINATIM_PATH, {"userAgent": "blocked"}),
          ):
              by_admin = call(GO_URL, path, method, admin_a_token, payload)
              if by_admin[0] != 403:
                  fail(f"after nest stop {method} {path} org admin: {by_admin[0]} {by_admin[1][:200]!r}")
              by_machine = call(GO_URL, path, method, MACHINE_ALLOW, payload)
              if by_machine[0] != 403:
                  fail(f"after nest stop {method} {path} machine: {by_machine[0]} {by_machine[1][:200]!r}")

          # 配置更新、reset、缓存失效与审计真实发生。
          before_audit = int(scalar("SELECT COUNT(*) FROM AuditLog"))
          takeover("realtime PUT", "PUT", REALTIME_PATH, alive, {"maxRetries": 1})
          require("realtime PUT persisted", json.loads(raw_setting(REALTIME_KEY)).get("maxRetries"), 1)
          takeover("nominatim PUT", "PUT", NOMINATIM_PATH, alive, {"email": "down@example.com"})
          require("nominatim PUT persisted",
                  json.loads(raw_setting(NOMINATIM_KEY)).get("email"), "down@example.com")
          takeover("archive PUT", "PUT", ARCHIVE_SETTINGS_PATH, alive,
                   {"jobBatchSize": 12, "embeddingBatchSize": 12,
                    "embeddingMaxConcurrency": 2, "rerankMaxConcurrency": 2})
          require("archive PUT persisted", json.loads(raw_setting(ARCHIVE_KEY)).get("jobBatchSize"), 12)
          takeover("archive DELETE", "DELETE", ARCHIVE_SETTINGS_PATH, alive)
          require("archive DELETE removed the row", raw_setting(ARCHIVE_KEY), "")
          takeover("realtime DELETE", "DELETE", REALTIME_PATH, alive)
          require("realtime DELETE removed the row", raw_setting(REALTIME_KEY), "")
          after_audit = int(scalar("SELECT COUNT(*) FROM AuditLog"))
          if after_audit <= before_audit:
              fail(f"audit rows did not grow: {before_audit} -> {after_audit}")
          # 撤回令牌 → 401。
          revoked = login(PLATFORM_EMAIL)
          redis("SET", "access-token:blacklist:" + jwt_jti(revoked), "true", "EX", "600")
          status, raw = call(GO_URL, REALTIME_PATH, "GET", revoked)
          if status != 401 or message_of(raw) != "Access token revoked":
              fail(f"revoked token: {status} {message_of(raw)!r}")
          # 未迁路径在 Nest 停机后 502。
          for method, path in (("POST", "/api/system-settings/geo/nominatim/test"),
                               ("POST", "/api/geo/geocode"),
                               ("GET", "/api/system-settings/situation-monitor"),
                               ("POST", "/api/system-settings/situation-monitor/external-snapshot/refresh")):
              status, raw = call(GO_URL, path, method, alive, {} if method == "POST" else None)
              if status != 502 or (body(raw) or {}).get("statusCode") != 502:
                  fail(f"unmigrated {method} {path} after nest stop: {status} {raw[:300]!r}")
          print("phase 3 ok: nine routes独立服务、五条写仍受门禁、未迁路径 502")

          # ===================== phase 4: rollback =====================

          print("==== phase 4: rollback ====")
          start_go("legacy")
          for method, path, payload in ALL_ROUTES:
              status, raw = call(GO_URL, path, method, alive, payload)
              if status != 502:
                  fail(f"rollback {method} {path}: {status} {raw[:300]!r}, want 502 with NestJS down")
          print("phase 4 ok: legacy rollback proxies to the stopped NestJS (502)")

          start_nest(encryption_key=VALID_KEY)
          token = login(PLATFORM_EMAIL)
          reset_settings()
          for method, path, payload in ALL_ROUTES:
              reset_settings()
              parity(f"rollback parity {method} {path}", method, path, token, payload)
          print("ALL DATA RUNTIME SETTINGS CHECKS PASSED")
          PY
