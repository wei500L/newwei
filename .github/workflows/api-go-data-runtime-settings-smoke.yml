# 数据运行设置与归档状态（实时信号设置 / 归档准备设置 / 归档准备状态 /
# Nominatim 身份设置，共 9 条精确 HTTP）的 Go 真实栈验收。不进普通 CI：
# PR 上加 label api-go-data-runtime-settings-smoke，或 workflow_dispatch 手动触发。
#
# 覆盖：开关四态与非法值启动失败、9 条 exact 路由接管与相邻未迁路径回落、
# DTO 逐字段消息（未知字段/布尔/范围/小数/URL/数字字符串差异）、实时设置四个
# 跨字段约束、canonical/legacy 别名与 null 语义、source default/env/db、
# audit updatedFields 精确数组、DS1 平台写入门禁（含动态授予/撤销与机器令牌）、
# DS2 两把全局锁与 DB 权威合并基准（含真实 MySQL 持锁 409 与释放恢复）、
# DS3 归档错误脱敏（Redis 原文不变）、DS4 单快照自洽（含 >10 条与同 score）、
# 加密策略矩阵（Nest↔Go 密文互通、未修改密文原样、清空回退、生产无 key 400、
# 显式 false 逃生、错 key 降级）、停 NestJS 后 9 条独立服务与未迁路径 502。
name: api-go-data-runtime-settings-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-data-runtime-settings-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  JWT_SECRET: c1f4a9e8d2b3706f5a1c8e9d4b2a7f6038e5d1c9a7b6f4e2d3c8a1b5f9e0d7c2
  JWT_ACCESS_EXPIRES_IN: 6h
  NEXTAUTH_SECRET: e2b5c1f8a9d3b47e60d4a1f8c3b5e79d02c1f4a9e8d2b3706f5a1c8e9d4b2a7f6
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  SMTP_USER: api-go-data-runtime-settings-smoke@example.com
  SMTP_PASS: api-go-data-runtime-settings-smoke-smtp-not-connected
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  RATE_LIMIT_LOGIN: "1000"
  RATE_LIMIT_LOGIN_WINDOW: "600"
  RATE_LIMIT_CRAWL_TASK_CREATE: "1000"
  RATE_LIMIT_CRAWL_TASK_CREATE_WINDOW: "600"
  RATE_LIMIT_RBAC_WRITE: "1000"
  RATE_LIMIT_RBAC_WRITE_WINDOW: "600"
  RATE_LIMIT_SETTINGS_CACHE_TTL_SECONDS: "60"
  AUTH_PROFILE_CACHE_TTL_SECONDS: "600"
  AUTH_PROFILE_CACHE_LOCK_TTL_MS: "5000"
  AUTH_PROFILE_CACHE_MAX_WAIT_MS: "5000"
  AUTH_PROFILE_CACHE_RETRY_DELAY_MS: "50"
  AUDIT_LOG_RETENTION_DAYS: "90"
  # 32 字节 key 的 64 位 hex 形式，Nest 与 Go 共用。
  SYSTEM_SETTINGS_ENCRYPTION_KEY: 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
  SEED_ORG_SLUG: api-go-data-runtime-settings-smoke-org
  SEED_ORG_NAME: api-go Data Runtime Settings Smoke Org
  SEED_ADMIN_EMAIL: api-go-data-runtime-settings-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: "ApiGoDataRuntime#2026-Ci"
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-data-runtime-settings-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-data-runtime-settings-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-data-runtime-settings:ci .
      - name: Exercise data runtime settings routes
        run: |
          set -euo pipefail
          python3 -u - << 'PY'
          import base64
          import hashlib
          import json
          import os
          import signal
          import subprocess
          import sys
          import time
          import traceback
          import urllib.error
          import urllib.request

          NEST_URL = "http://127.0.0.1:4000"
          GO_URL = "http://127.0.0.1:4020"
          GO_CONTAINER = "api-go-data-runtime-settings-smoke"
          GO_IMAGE = "api-go-data-runtime-settings:ci"

          REALTIME_PATH = "/api/system-settings/realtime-signals"
          ARCHIVE_SETTINGS_PATH = "/api/system-settings/archive-preparation"
          ARCHIVE_STATUS_PATH = "/api/admin/archive-preparation/status"
          NOMINATIM_PATH = "/api/system-settings/geo/nominatim"

          REALTIME_KEY = "realtime_signals_settings"
          REALTIME_ACLED_KEY = "realtime_signals_acled_auth_state"
          ARCHIVE_KEY = "archive_preparation_settings"
          NOMINATIM_KEY = "geo_nominatim_identity"
          REALTIME_CACHE = "realtime-signals:settings"
          REALTIME_ACLED_CACHE = "realtime-signals:acled-auth-state"
          ARCHIVE_CACHE = "archive_preparation:settings"
          STATUS_INDEX = "archive:preparation:status:index"
          STATUS_KEY_PREFIX = "archive:preparation:status:"

          REALTIME_LOCK = "data-runtime-settings:realtime:v1"
          NOMINATIM_LOCK = "data-runtime-settings:nominatim:v1"
          REALTIME_BUSY = "Realtime signals settings are being updated by another request; retry later"
          NOMINATIM_BUSY = "Nominatim identity settings are being updated by another request; retry later"

          VALID_KEY = os.environ["SYSTEM_SETTINGS_ENCRYPTION_KEY"]
          WRONG_KEY = "ff" * 32

          ORG_A = "drs-smoke-org-a"
          ORG_B = "drs-smoke-org-b"
          ROLE_A = "drs-smoke-role-a"
          ROLE_B = "drs-smoke-role-b"
          ROLE_NO = "drs-smoke-role-no"
          PLATFORM_USER = "drs-smoke-platform-user"
          PLATFORM_EMAIL = "drs-smoke-platform@example.com"
          ADMIN_A = "drs-smoke-admin-a"
          ADMIN_A_EMAIL = "drs-smoke-admin-a@example.com"
          ADMIN_B = "drs-smoke-admin-b"
          ADMIN_B_EMAIL = "drs-smoke-admin-b@example.com"
          NO_MANAGE_USER = "drs-smoke-no-manage"
          NO_MANAGE_EMAIL = "drs-smoke-no-manage@example.com"
          MACHINE_ALLOW = "mtk_drs_smoke_allow_0000000000001"
          MACHINE_DENY = "mtk_drs_smoke_deny_00000000000001"

          # 实时 DTO 的 47 个字段，顺序取自编译后 class 字段声明顺序；因为 target
          # ES2022 + useDefineForClassFields=true 让每个声明都成为实例自有属性，
          # Object.keys(input) 恒为该数组，与请求体无关。
          REALTIME_UPDATED_FIELDS = [
              "enabled", "requestTimeoutMs", "maxRetries", "openskyEnabled", "adsbEnabled",
              "openskyIntervalSec", "openskyDailyCreditBudget", "openskyDayIntervalSec",
              "openskyNightIntervalSec", "openskyDayStartHourHkt", "openskyNightStartHourHkt",
              "openskyWarningRemainingPct", "openskyCriticalRemainingPct", "adsbIntervalSec",
              "aisEnabled", "aisIntervalSec", "unrestEnabled", "unrestIntervalSec",
              "outagesEnabled", "outagesIntervalSec", "keywordSpikeEnabled",
              "keywordSpikeIntervalSec", "pizzintEnabled", "pizzintIntervalSec",
              "gdeltTensionEnabled", "gdeltTensionIntervalSec", "polymarketLeadsEnabled",
              "polymarketLeadsIntervalSec", "keywordSpikeMinCount", "keywordSpikeMultiplier",
              "predictionShiftThreshold", "predictionNewsActivityThreshold", "openskyBaseUrl",
              "adsbBaseUrl", "openskyTokenUrl", "aisRelayBaseUrl", "relayBaseUrl",
              "openskyClientId", "openskyClientSecret", "aisRelaySharedSecret",
              "relaySharedSecret", "acledOauthUsername", "acledOauthPassword",
              "acledOauthClientId", "cloudflareApiToken", "wingbitsApiKey",
              "polymarketProxyUrl",
          ]

          REALTIME_ENV_BODY = {
              "source": "env",
              # 真实验收栈要求 REALTIME_SIGNALS_ENABLED=false（避免采集器访问外网），
              # 所以 env 缺省下的 enabled 是 false。
              "enabled": False,
              "requestTimeoutMs": 12000,
              "maxRetries": 2,
              "acledApiEnabled": False,
              "acledApiDisabledReason": "Open myACLED does not include API access.",
              "openskyEnabled": True,
              "openskyIntervalSec": 900,
              "openskyDailyCreditBudget": 4000,
              "openskyDayIntervalSec": 600,
              "openskyNightIntervalSec": 1800,
              "openskyDayStartHourHkt": 8,
              "openskyNightStartHourHkt": 22,
              "openskyWarningRemainingPct": 20,
              "openskyCriticalRemainingPct": 10,
              "aisEnabled": True,
              "aisIntervalSec": 600,
              "unrestEnabled": True,
              "unrestIntervalSec": 600,
              "outagesEnabled": True,
              "outagesIntervalSec": 600,
              "keywordSpikeEnabled": True,
              "keywordSpikeIntervalSec": 600,
              "pizzintEnabled": True,
              "pizzintIntervalSec": 600,
              "gdeltTensionEnabled": True,
              "gdeltTensionIntervalSec": 600,
              "polymarketLeadsEnabled": True,
              "polymarketLeadsIntervalSec": 600,
              "keywordSpikeMinCount": 5,
              "keywordSpikeMultiplier": 3,
              "predictionShiftThreshold": 5,
              "predictionNewsActivityThreshold": 3,
              "openskyBaseUrl": "https://opensky-network.org/api",
              "openskyTokenUrl": "https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token",
              "openskyClientIdSource": "none",
              "hasAisRelaySharedSecret": False,
              "aisRelaySharedSecretSource": "none",
              "hasOpenskyClientSecret": False,
              "openskyClientSecretSource": "none",
              "hasAcledAccessToken": False,
              "acledAccessTokenSource": "none",
              "acledAccessTokenStatus": "missing",
              "acledOauthUsernameSource": "none",
              "hasAcledOauthPassword": False,
              "acledOauthPasswordSource": "none",
              "acledOauthClientId": "acled",
              "acledOauthClientIdSource": "none",
              "hasCloudflareApiToken": False,
              "cloudflareApiTokenSource": "none",
              "hasWingbitsApiKey": False,
              "wingbitsApiKeySource": "none",
          }


          def _on_sigterm(signum, frame):
              print("SIGTERM received at:", flush=True)
              traceback.print_stack(frame)
              os._exit(143)


          signal.signal(signal.SIGTERM, _on_sigterm)


          def fail(message):
              print("FAIL", message, flush=True)
              raise SystemExit(1)


          def require(label, got, want):
              if got != want:
                  fail(f"{label}: got {got!r}, want {want!r}")


          def container_id(ancestor):
              found = subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=" + ancestor], text=True).split()
              if not found:
                  fail("no running container for " + ancestor)
              return found[0]


          def sql(statement):
              cid = container_id("mysql:8.4")
              proc = subprocess.run(
                  ["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "-B", "app"],
                  input=statement, text=True, capture_output=True)
              if proc.returncode != 0:
                  fail("mysql: " + (proc.stderr or proc.stdout))
              return proc.stdout.strip()


          def sql_rows(statement):
              return [line.split("\t") for line in sql(statement).splitlines() if line != ""]


          def scalar(statement):
              rows = sql_rows(statement)
              return rows[-1][0] if rows else ""


          def redis(*args):
              cid = container_id("redis:7.2")
              proc = subprocess.run(
                  ["docker", "exec", "-i", cid, "redis-cli", "--raw", *args],
                  text=True, capture_output=True)
              if proc.returncode != 0:
                  fail("redis: " + (proc.stderr or proc.stdout))
              return proc.stdout.strip()


          def sql_escape(text):
              return text.replace("\\", "\\\\").replace("'", "''")


          def call(base, path, method="GET", token=None, payload=None, timeout=60):
              headers = {}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()


          def body(raw):
              if not raw:
                  return None
              text = raw.decode("utf-8", "replace").strip()
              if not text:
                  return None
              try:
                  return json.loads(text)
              except ValueError:
                  return None


          def message_of(raw):
              doc = body(raw) or {}
              text = doc.get("message")
              if isinstance(text, list):
                  return "; ".join(str(item) for item in text)
              return text


          def canon(value):
              if isinstance(value, dict):
                  if value.get("__enc") == "system-settings:v1":
                      return "<encrypted>"
                  out = {}
                  for key, item in value.items():
                      if key in ("traceId", "timestamp", "updatedAt"):
                          out[key] = "<ts>"
                      else:
                          out[key] = canon(item)
                  return out
              if isinstance(value, list):
                  return [canon(item) for item in value]
              return value


          def login(email):
              status, raw = call(NEST_URL, "/api/auth/login", "POST", None,
                                 {"email": email, "password": os.environ["SEED_ADMIN_PASSWORD"]})
              doc = body(raw) or {}
              if status not in (200, 201) or not doc.get("accessToken"):
                  fail(f"login {email} -> {status} {raw[:300]!r}")
              return doc["accessToken"]


          def jwt_jti(token):
              payload = token.split(".")[1]
              payload += "=" * (-len(payload) % 4)
              return json.loads(base64.urlsafe_b64decode(payload))["jti"]


          def docker_logs():
              proc = subprocess.run(["docker", "logs", "--tail", "200", GO_CONTAINER],
                                    text=True, capture_output=True)
              return (proc.stdout or "") + (proc.stderr or "")


          def log_tail(path, lines=80):
              if not os.path.exists(path):
                  return "<no log>"
              return "".join(open(path, errors="replace").readlines()[-lines:])


          def wait_http(url, attempts=90, delay=2):
              for _ in range(attempts):
                  try:
                      urllib.request.urlopen(url, timeout=3).read()
                      return True
                  except Exception:
                      time.sleep(delay)
              return False


          def stop_nest():
              # 只 SIGTERM 记录的 pid。不能用 killpg：Nest 后台进程由 workflow
              # 步骤 shell 启动，其进程组就是 Actions worker 自身所在的组，
              # 杀组会把当前步骤一起 SIGTERM。
              pid_path = "/tmp/api-nestjs.pid"
              if os.path.exists(pid_path):
                  raw = open(pid_path).read().strip()
                  if raw.isdigit():
                      try:
                          os.kill(int(raw), signal.SIGTERM)
                      except Exception:
                          pass
              subprocess.run(["pkill", "-f", "apps/api/dist/main.js"], check=False, capture_output=True)
              subprocess.run(["pkill", "-f", "node dist/main.js"], check=False, capture_output=True)


          def start_nest(encryption_key=VALID_KEY):
              stop_nest()
              time.sleep(2)
              env = dict(os.environ)
              env["NODE_ENV"] = "production"
              env["PORT"] = "4000"
              env.pop("SYSTEM_SETTINGS_ENCRYPTION_KEY", None)
              if encryption_key is not None:
                  env["SYSTEM_SETTINGS_ENCRYPTION_KEY"] = encryption_key
              proc = subprocess.Popen(
                  ["pnpm", "--filter", "@modular/api", "run", "start"],
                  env=env, stdout=open("/tmp/api-nestjs.log", "w"), stderr=subprocess.STDOUT,
                  start_new_session=True)
              open("/tmp/api-nestjs.pid", "w").write(str(proc.pid))
              if not wait_http(NEST_URL + "/api/healthz/live"):
                  fail("nestjs restart failed: " + log_tail("/tmp/api-nestjs.log"))


          def start_go(mode="legacy", encryption_key=VALID_KEY, node_env="production"):
              subprocess.run(["docker", "rm", "-f", GO_CONTAINER], check=False, capture_output=True)
              env = [
                  "PORT=4020",
                  "LEGACY_API_URL=http://host.docker.internal:4000",
                  "DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app",
                  "MONGO_URI=mongodb://host.docker.internal:27017/app",
                  f"API_GO_DATA_RUNTIME_SETTINGS_MODE={mode}",
                  "API_GO_RBAC_MODE=legacy",
                  "API_GO_RUNTIME_SETTINGS_MODE=legacy",
                  "API_GO_INFRASTRUCTURE_SETTINGS_MODE=legacy",
                  "RATE_LIMIT_LOGIN=1000",
                  "RATE_LIMIT_LOGIN_WINDOW=600",
                  "RATE_LIMIT_CRAWL_TASK_CREATE=1000",
                  "RATE_LIMIT_CRAWL_TASK_CREATE_WINDOW=600",
                  "RATE_LIMIT_RBAC_WRITE=1000",
                  "RATE_LIMIT_RBAC_WRITE_WINDOW=600",
                  "RATE_LIMIT_SETTINGS_CACHE_TTL_SECONDS=60",
                  "AUTH_PROFILE_CACHE_TTL_SECONDS=600",
                  "AUTH_PROFILE_CACHE_LOCK_TTL_MS=5000",
                  "AUTH_PROFILE_CACHE_MAX_WAIT_MS=5000",
                  "AUTH_PROFILE_CACHE_RETRY_DELAY_MS=50",
                  "AUDIT_LOG_RETENTION_DAYS=90",
                  "REALTIME_SIGNALS_ENABLED=false",
                  "ELASTICSEARCH_ENABLED=false",
                  "MODEL_SERVICE_ENABLED=false",
                  "SCHEDULE_ENABLED=false",
                  f"JWT_SECRET={os.environ['JWT_SECRET']}",
                  f"JWT_ISSUER={os.environ['JWT_ISSUER']}",
                  f"JWT_AUDIENCE={os.environ['JWT_AUDIENCE']}",
                  "REDIS_HOST=host.docker.internal",
                  "REDIS_PORT=6379",
                  "CANARY_PERCENT=0",
                  f"CORS_ORIGIN={os.environ['CORS_ORIGIN']}",
              ]
              if node_env is not None:
                  env.append("NODE_ENV=" + node_env)
              if encryption_key is not None:
                  env.append("SYSTEM_SETTINGS_ENCRYPTION_KEY=" + encryption_key)
              cmd = ["docker", "run", "-d", "--name", GO_CONTAINER,
                     "--add-host=host.docker.internal:host-gateway",
                     "--health-interval", "5s", "--health-timeout", "3s",
                     "--health-retries", "20", "--health-start-period", "5s",
                     "-p", "127.0.0.1:4020:4020"]
              for item in env:
                  cmd.extend(["-e", item])
              cmd.append(GO_IMAGE)
              subprocess.check_call(cmd, stdout=subprocess.DEVNULL)
              for _ in range(30):
                  status = subprocess.check_output(
                      ["docker", "inspect", "--format", "{{.State.Health.Status}}", GO_CONTAINER],
                      text=True).strip()
                  if status == "healthy":
                      print(f"api-go up dataRuntimeSettingsMode={mode} encryptionKey={'yes' if encryption_key else 'no'}")
                      return
                  if status == "unhealthy":
                      fail(docker_logs())
                  time.sleep(2)
              fail(docker_logs())


          def start_go_expect_failure(mode):
              """Starts a container with an invalid mode and returns its exit error text."""
              subprocess.run(["docker", "rm", "-f", GO_CONTAINER + "-bad"], check=False, capture_output=True)
              proc = subprocess.run(
                  ["docker", "run", "--name", GO_CONTAINER + "-bad",
                   "--add-host=host.docker.internal:host-gateway",
                   "-e", f"API_GO_DATA_RUNTIME_SETTINGS_MODE={mode}",
                   "-e", "JWT_SECRET=" + os.environ["JWT_SECRET"],
                   "-e", "REDIS_HOST=host.docker.internal",
                   "-e", "DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app",
                   GO_IMAGE],
                  text=True, capture_output=True, timeout=120)
              subprocess.run(["docker", "rm", "-f", GO_CONTAINER + "-bad"], check=False, capture_output=True)
              return proc.returncode, (proc.stdout or "") + (proc.stderr or "")


          def setting_state(*keys):
              rows = sql_rows(
                  "SELECT `key`, CAST(`value` AS CHAR), JSON_TYPE(`value`), (`value` IS NULL), "
                  "IFNULL(description, '<null>'), IFNULL(updatedById, '<null>') "
                  "FROM SystemSetting WHERE `key` IN (" +
                  ", ".join("'" + key + "'" for key in keys) + ") ORDER BY `key`")
              return [(row[0], canon(json.loads(row[1])) if row[1] else None, row[2], row[3], row[4], row[5])
                      for row in rows]


          def raw_setting(key):
              return sql(f"SELECT CAST(`value` AS CHAR) FROM SystemSetting WHERE `key`='{key}'")


          def reset_settings():
              sql("DELETE FROM SystemSetting WHERE `key` IN "
                  f"('{REALTIME_KEY}','{REALTIME_ACLED_KEY}','{ARCHIVE_KEY}','{NOMINATIM_KEY}')")
              redis("DEL", REALTIME_CACHE, REALTIME_ACLED_CACHE, ARCHIVE_CACHE)
              redis("DEL", STATUS_INDEX)


          def set_setting(key, value_text, description=None, is_public=0):
              desc = "NULL" if description is None else "'" + sql_escape(description) + "'"
              sql("REPLACE INTO SystemSetting (`key`, value, isPublic, description, createdAt, updatedAt, updatedById) "
                  f"VALUES ('{key}', _utf8mb4'{sql_escape(value_text)}', {is_public}, {desc}, NOW(3), NOW(3), NULL)")


          def audit_rows(action):
              return sql_rows(
                  "SELECT IFNULL(CAST(metadata AS CHAR),'null'), IFNULL(actorId,'<null>') FROM AuditLog "
                  f"WHERE action='{action}' ORDER BY createdAt DESC, id DESC LIMIT 5")


          def newest_audit_raw(action):
              rows = audit_rows(action)
              if not rows:
                  return None, None
              return json.loads(rows[0][0]), rows[0][1]


          def newest_audit(action, timeout=10):
              deadline = time.time() + timeout
              while True:
                  metadata, actor = newest_audit_raw(action)
                  if metadata is not None or time.time() > deadline:
                      return metadata, actor
                  time.sleep(0.3)


          def cache_value(key):
              return redis("GET", key)


          def parity(label, method, path, token, payload=None, expected=200, setup=None, expected_message=None):
              if setup is not None:
                  setup()
              nest_status, nest_raw = call(NEST_URL, path, method, token, payload)
              if setup is not None:
                  setup()
              go_status, go_raw = call(GO_URL, path, method, token, payload)
              if nest_status != expected or go_status != expected:
                  fail(f"parity {label}: status nest={nest_status} go={go_status}, want {expected}; "
                       f"nest={nest_raw[:300]!r} go={go_raw[:300]!r}")
              if canon(body(nest_raw)) != canon(body(go_raw)):
                  fail(f"parity {label}: body mismatch nest={nest_raw[:800]!r} go={go_raw[:800]!r}")
              if expected_message is not None:
                  for side, raw in (("nest", nest_raw), ("go", go_raw)):
                      if message_of(raw) != expected_message:
                          fail(f"parity {label}: {side} message {message_of(raw)!r} want {expected_message!r} raw={raw[:400]!r}")
              print("parity ok:", label)
              return body(nest_raw), body(go_raw)


          def request_json(label, base, method, path, token, payload=None, expected=200, expected_message=None):
              status, raw = call(base, path, method, token, payload)
              if status != expected:
                  fail(f"{label}: {method} {path} -> {status} {raw[:400]!r}, want {expected}")
              if expected_message is not None and message_of(raw) != expected_message:
                  fail(f"{label}: message {message_of(raw)!r} want {expected_message!r} raw={raw[:400]!r}")
              return body(raw)


