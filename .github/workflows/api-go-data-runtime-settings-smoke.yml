          def status_key(scope, org, value):
              return f"{STATUS_KEY_PREFIX}{scope}:{org}:{value}"


          def seed_archive_status():
              # 12 条 org A 记录（>10）+ 1 条 org B + 1 条同 score + 1 条旧无 orgId
              # + 1 条索引残留（值已过期）。
              redis("DEL", STATUS_INDEX)
              members = []
              score = 1000
              states = ["QUEUED", "PROCESSING", "PARTIAL", "READY", "FAILED", "IDLE"]
              for index in range(12):
                  key = status_key("digest", ORG_A, f"2026-01-{index + 1:02d}")
                  message = "S3 upload timed out after 30s"
                  if index == 11:
                      # 最新的那条带敏感模式，保证它出现在 recentStatuses（最多10条）里。
                      message = "call failed: Bearer tok.abc-1 password=pw token=t1 api_key=k1 secret=s1"
                  redis("SET", key, json.dumps({
                      "orgId": ORG_A, "scope": "digest", "scopeValue": f"2026-01-{index + 1:02d}",
                      "state": states[index % len(states)], "updatedAt": "2026-01-01T00:00:00.000Z",
                      "errorMessage": message,
                  }), "EX", "3600")
                  members.append((score + index, key))
              foreign = status_key("calendar", ORG_B, "2026-02")
              redis("SET", foreign, json.dumps({
                  "orgId": ORG_B, "scope": "calendar", "scopeValue": "2026-02",
                  "state": "READY", "updatedAt": "2026-01-02T00:00:00.000Z",
              }), "EX", "3600")
              members.append((score + 50, foreign))
              # 同 score：Redis 按成员字典序返回，读取端必须保持该顺序。
              tie_a = status_key("digest", ORG_A, "zzz-tie")
              tie_b = status_key("digest", ORG_A, "aaa-tie")
              for key in (tie_a, tie_b):
                  redis("SET", key, json.dumps({
                      "orgId": ORG_A, "scope": "digest", "scopeValue": key.rsplit(":", 1)[1],
                      "state": "READY", "updatedAt": "2026-01-03T00:00:00.000Z",
                  }), "EX", "3600")
                  members.append((score + 80, key))
              # 旧无 orgId 记录：从 key 第 5 段回退。
              legacy = status_key("digest", ORG_A, "legacy-no-org")
              redis("SET", legacy, json.dumps({
                  "scope": "digest", "scopeValue": "legacy-no-org", "state": "READY",
                  "updatedAt": "2026-01-04T00:00:00.000Z",
              }), "EX", "3600")
              members.append((score + 90, legacy))
              # 索引残留：成员仍在索引里，但值已过期。
              expired = status_key("digest", ORG_A, "expired")
              members.append((score + 95, expired))
              for member_score, member in members:
                  redis("ZADD", STATUS_INDEX, str(member_score), member)
              print(f"archive status fixtures ok: {scalar('SELECT 1')} zset members seeded")


          def expected_status_snapshot(org):
              """从 Redis 直接推导期望的 org 快照，用于校验 counts/recent。"""
              members = redis("ZRANGE", STATUS_INDEX, "0", "-1").splitlines()
              records = []
              for member in members:
                  if not member:
                      continue
                  raw = redis("GET", member)
                  if not raw:
                      continue
                  try:
                      record = json.loads(raw)
                  except ValueError:
                      continue
                  if not isinstance(record, dict):
                      continue
                  record_org = record.get("orgId")
                  if not isinstance(record_org, str) or not record_org:
                      parts = member.split(":")
                      record_org = parts[4] if len(parts) >= 6 else ""
                  if record_org != org:
                      continue
                  records.append(record)
              records.reverse()
              counts = {"waiting": 0, "active": 0, "completed": 0, "failed": 0, "delayed": 0}
              for record in records:
                  state = record.get("state")
                  if state == "QUEUED":
                      counts["waiting"] += 1
                  elif state in ("PROCESSING", "PARTIAL"):
                      counts["active"] += 1
                  elif state == "READY":
                      counts["completed"] += 1
                  elif state == "FAILED":
                      counts["failed"] += 1
              counts["pending"] = counts["waiting"] + counts["active"] + counts["delayed"]
              recent = records[:10]
              return counts, recent


