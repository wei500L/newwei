# Go：知识图谱冲击传导与实体共现/相关图 4 个 GraphQL 只读 root 的真实栈对照。
# 不进普通 CI。PR 上加 label api-go-kg-impact-read-smoke，或 workflow_dispatch。
# 不调用 AkShare、模型或 Nominatim；不启动采集 worker。
name: api-go-kg-impact-read-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-kg-impact-read-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-smoke@example.com
  SMTP_PASS: api-go-smoke-smtp-not-connected
  JWT_SECRET: c1f4a9e8d2b3706f5a1c8e9d4b2a7f6038e5d1c9a7b6f4e2d3c8a1b5f9e0d7c2
  NEXTAUTH_SECRET: e2b5c1f8a9d3b47e60d4a1f8c3b5e79d02c1f4a9e8d2b3706f5a1c8e9d4b2a7f6
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  LITELLM_TIMEOUT_MS: "800"
  LITELLM_RETRY_ATTEMPTS: "1"
  SEED_ORG_SLUG: api-go-smoke-org
  SEED_ORG_NAME: api-go Smoke Org
  SEED_ADMIN_EMAIL: api-go-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: ApiGoSmoke#2026-Ci
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-kg-impact-read-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-kg-impact-read-smoke')
    runs-on: [self-hosted, linux, build-server]
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-kg:ci .
      - name: Start api-go
        run: |
          set -euo pipefail
          start_go() {
            local read_mode="$1"
            local kg_mode="$2"
            docker rm -f api-go-kg >/dev/null 2>&1 || true
            docker run -d --name api-go-kg \
              --add-host=host.docker.internal:host-gateway \
              --health-interval 5s --health-timeout 3s --health-retries 20 --health-start-period 5s \
              -p 127.0.0.1:4020:4020 \
              -e PORT=4020 \
              -e LEGACY_API_URL=http://host.docker.internal:4000 \
              -e DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app \
              -e MONGO_URI=mongodb://host.docker.internal:27017/app \
              -e API_GO_GRAPHQL_READ_MODE="$read_mode" \
              -e API_GO_GRAPHQL_KG_IMPACT_MODE="$kg_mode" \
              -e GRAPHQL_RESPONSE_CACHE_ENABLED=false \
              -e RATE_LIMIT_LOGIN=100 \
              -e API_GO_DASHBOARD_STATS_MODE=legacy \
              -e API_GO_DASHBOARD_CHARTS_MODE=legacy \
              -e API_GO_DASHBOARD_WAR_MAP_MODE=legacy \
              -e API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE=legacy \
              -e API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE=legacy \
              -e API_GO_DASHBOARD_SPACETIME_GEO_MODE=legacy \
              -e API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE=legacy \
              -e API_GO_DASHBOARD_STREAM_MODE=legacy \
              -e API_GO_HEALTHZ_MODE=legacy \
              -e API_GO_CONTENT_SUBSCRIPTIONS_MODE=legacy \
              -e API_GO_USER_NEWS_BEHAVIOR_MODE=legacy \
              -e API_GO_USER_DIGEST_MODE=legacy \
              -e API_GO_ANALYSIS_VIEWS_MODE=legacy \
              -e API_GO_ANALYSIS_BOARDS_MODE=legacy \
              -e API_GO_ANALYSIS_THREADS_MODE=legacy \
              -e API_GO_GRAPHQL_NEWS_EVENTS_MODE=legacy \
              -e JWT_SECRET="$JWT_SECRET" \
              -e JWT_ISSUER="$JWT_ISSUER" \
              -e JWT_AUDIENCE="$JWT_AUDIENCE" \
              -e REDIS_HOST=host.docker.internal \
              -e REDIS_PORT=6379 \
              -e CANARY_PERCENT=0 \
              -e CORS_ORIGIN="$CORS_ORIGIN" \
              api-go-kg:ci
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' api-go-kg 2>/dev/null || echo starting)
              echo "health=$status read=$read_mode kg=$kg_mode"
              if [ "$status" = "healthy" ]; then return 0; fi
              if [ "$status" = "unhealthy" ]; then docker logs api-go-kg; return 1; fi
              sleep 2
            done
            docker logs api-go-kg || true
            return 1
          }
          start_go go legacy
          declare -f start_go > /tmp/start-go.sh
      - name: Exercise kg impact reads (legacy)
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import datetime, json, os, subprocess, urllib.error, urllib.request

          go = "http://127.0.0.1:4020"
          nest = "http://127.0.0.1:4000"

          def cid(ancestor):
              return subprocess.check_output(["docker", "ps", "-q", "-f", f"ancestor={ancestor}"], text=True).split()[0]

          mysql = cid("mysql:8.4")
          mongo = cid("mongo:7.0")
          redis = cid("redis:7.2")

          def sql(statement):
              proc = subprocess.run(["docker", "exec", "-i", mysql, "mysql", "-uroot", "-psecret", "-N", "app"], input=statement, text=True, capture_output=True)
              if proc.returncode != 0:
                  raise SystemExit(proc.stderr or proc.stdout)
              return proc.stdout.strip()

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def call(base, path, method="GET", token=None, payload=None, timeout=40):
              headers = {"content-type": "application/json"}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read(), resp.headers
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(), exc.headers

          def body(raw):
              if not raw:
                  return None
              return json.loads(raw)

          def login(email):
              status, raw, _ = call(go, "/api/auth/login", "POST", payload={"email": email, "password": os.environ["SEED_ADMIN_PASSWORD"]})
              doc = body(raw)
              if status not in (200, 201) or not doc or not doc.get("accessToken"):
                  fail(f"login {email} {status} {raw[:300]!r}")
              return doc["accessToken"]

          # 六天输入，UTC 08:00 对齐：Mongo 提及数与 stock-index 序列同形。
          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0)
          counts = [2, 1, 2, 1, 2, 1]
          day_times = [(now - datetime.timedelta(days=5 - i)).replace(hour=8, minute=0, second=0) for i in range(6)]
          day_sql = [moment.strftime("%Y-%m-%d %H:%M:%S") for moment in day_times]

          org = sql("SELECT id FROM Org WHERE slug='api-go-smoke-org'")
          admin = sql("SELECT id FROM User WHERE email='api-go-smoke-admin@example.com'")
          perm = sql("SELECT id FROM Permission WHERE name='dashboards.read'")
          if not perm:
              fail("dashboards.read missing")
          sql(f"UPDATE User SET emailVerified = NOW(3) WHERE id = '{admin}'")
          economic_rows = ",\n".join(
              f"('kgecpt{index:016d}', 'kgecitem00000000000001', '{day_sql[index]}', 'price', {counts[index]:.6f}, 'smoke', NOW(3))"
              for index in range(6)
          )
          sql(f"""
          INSERT INTO Org (id, name, slug, isActive, createdAt, updatedAt)
          VALUES ('kgotherorg0000000000000001', 'KG Other', 'kg-other-org', 1, NOW(3), NOW(3));
          INSERT INTO KnowledgeEntity (id, orgId, type, canonicalName, normalizedKey, properties, createdAt, updatedAt)
          VALUES
            ('kgacmeco00000000000000001', '{org}', 'company', 'Acme Corp', 'acme corp', NULL, NOW(3), NOW(3)),
            ('kginstrument000000000001', '{org}', 'instrument', '600519', '600519', NULL, NOW(3), NOW(3)),
            ('kgindustry00000000000001', '{org}', 'industry', 'Semiconductors', 'semiconductors', NULL, NOW(3), NOW(3)),
            ('kgbetaco0000000000000001', '{org}', 'company', 'Beta Corp', 'beta corp', NULL, NOW(3), NOW(3)),
            ('kggammaco000000000000001', '{org}', 'company', 'Gamma Corp', 'gamma corp', NULL, NOW(3), NOW(3)),
            ('kggold000000000000000001', '{org}', 'commodity', 'Gold', 'gold', NULL, NOW(3), NOW(3)),
            ('kgpolicy000000000000001', '{org}', 'policy', 'Rate Cut', 'rate cut', NULL, NOW(3), NOW(3)),
            ('kgotherentity00000000001', 'kgotherorg0000000000000001', 'company', 'Other Org Co', 'other org co', NULL, NOW(3), NOW(3));
          INSERT INTO KnowledgeEdge (id, orgId, type, fromEntityId, toEntityId, weight, confidence, properties, firstSeenAt, lastSeenAt, createdAt, updatedAt)
          VALUES
            ('kgedge0000000000000001', '{org}', 'has_ticker', 'kgacmeco00000000000000001', 'kginstrument000000000001', 1, 0.9, NULL, NOW(3), NOW(3), NOW(3), NOW(3)),
            ('kgedge0000000000000002', '{org}', 'competes_with', 'kgacmeco00000000000000001', 'kgbetaco0000000000000001', 1, 0.8, NULL, NOW(3), NOW(3), NOW(3), NOW(3)),
            ('kgedge0000000000000003', '{org}', 'belongs_to_industry', 'kgacmeco00000000000000001', 'kgindustry00000000000001', 1, 0.9, NULL, NOW(3), NOW(3), NOW(3), NOW(3)),
            ('kgedge0000000000000004', '{org}', 'belongs_to_industry', 'kggammaco000000000000001', 'kgindustry00000000000001', 1, 0.7, NULL, NOW(3), NOW(3), NOW(3), NOW(3)),
            ('kgedge0000000000000005', '{org}', 'affects_industry', 'kggold000000000000000001', 'kgindustry00000000000001', 1, 0.8, NULL, NOW(3), NOW(3), NOW(3), NOW(3)),
            ('kgedge0000000000000006', '{org}', 'affects_industry', 'kgpolicy000000000000001', 'kgindustry00000000000001', 1, 0.9, NULL, NOW(3), NOW(3), NOW(3), NOW(3)),
            ('kgedge0000000000000007', '{org}', 'affects_company', 'kgpolicy000000000000001', 'kgacmeco00000000000000001', 1, 0.8, NULL, NOW(3), NOW(3), NOW(3), NOW(3)),
            ('kgedgedirty000000000001', '{org}', 'competes_with', 'kgacmeco00000000000000001', 'kgotherentity00000000001', 1, 0.9, NULL, NOW(3), NOW(3), NOW(3), NOW(3));
          INSERT INTO KnowledgeEntityAlias (id, orgId, entityId, alias, normalizedAlias, source, createdAt)
          VALUES
            ('kgalias000000000000001', '{org}', 'kgacmeco00000000000000001', 'Acme Corp', 'acme corp', 'seed', NOW(3)),
            ('kgalias000000000000002', '{org}', 'kginstrument000000000001', '600519', '600519', 'seed', NOW(3)),
            ('kgalias000000000000003', '{org}', 'kggold000000000000000001', 'Gold', 'gold', 'seed', NOW(3)),
            ('kgalias000000000000004', '{org}', 'kgpolicy000000000000001', 'Rate Cut', 'rate cut', 'seed', NOW(3));
          INSERT INTO SystemSetting (`key`, value, isPublic, description, createdAt, updatedAt)
          VALUES
            ('knowledge_graph_settings:{org}', CAST('{{"enabled":true,"cacheTtlSeconds":60}}' AS JSON), 0, 'kg smoke', NOW(3), NOW(3)),
            ('entity_impact_graph_settings:{org}', CAST('{{"enabled":true,"minEntityConfidence":0.5,"minCorrelation":0.3,"minCoOccurrence":2,"maxNodes":100,"categories":["person","organization","stock","commodity"],"cacheTtlSeconds":60}}' AS JSON), 0, 'eig smoke', NOW(3), NOW(3));
          INSERT INTO EconomicCategory (id, `key`, label, description, createdAt, updatedAt)
          VALUES ('kgeccat0000000000000001', 'stock-index', 'Stock Index', NULL, NOW(3), NOW(3));
          INSERT INTO EconomicDataItem (id, slug, displayName, sourceFunction, sourceEndpoint, valueType, defaultFrequency, isActive, createdAt, updatedAt)
          VALUES ('kgecitem00000000000001', 'smoke-index', 'Smoke Index', 'smoke', 'smoke', 'price', 'daily', 1, NOW(3), NOW(3));
          INSERT INTO EconomicDataItemCategory (id, itemId, categoryId, createdAt)
          VALUES ('kgecic0000000000000001', 'kgecitem00000000000001', 'kgeccat0000000000000001', NOW(3));
          INSERT INTO EconomicDataPoint (id, itemId, recordedAt, dataType, value, sourceField, createdAt)
          VALUES {economic_rows};
          INSERT INTO Role (id, orgId, name, description, isSystem)
          VALUES ('kgrolec0000000000000001', '{org}', 'kg-no-read', 'no dashboards.read', 0);
          INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
          SELECT 'kguserc0000000000000001', 'kg-c@example.com', passwordHash, 'No', 'Read', 1, NOW(3), NOW(3), NOW(3)
          FROM User WHERE id = '{admin}';
          INSERT INTO Membership (id, userId, orgId, roleId, isActive, createdAt)
          VALUES ('kgmemc0000000000000001', 'kguserc0000000000000001', '{org}', 'kgrolec0000000000000001', 1, NOW(3));
          """)
          role = sql(f"SELECT roleId FROM Membership WHERE userId='{admin}' AND orgId='{org}' LIMIT 1")
          if role and not sql(f"SELECT id FROM RolePermission WHERE roleId='{role}' AND permissionId='{perm}' LIMIT 1"):
              sql(f"INSERT INTO RolePermission (id, roleId, permissionId) VALUES ('kgrp000000000000000001', '{role}', '{perm}')")

          def js_doc(doc_id, org_id, created_iso, entities):
              parts = ", ".join(
                  "{name: '%s', type: '%s', confidence: %s}" % (entity["name"], entity["type"], entity["confidence"])
                  for entity in entities
              )
              return "{_id: ObjectId('%s'), orgId: '%s', status: 'completed', createdAt: new Date('%s'), result: {entities: [%s]}}" % (
                  doc_id,
                  org_id,
                  created_iso,
                  parts,
              )

          doc_js = []
          doc_index = 0
          for index, count in enumerate(counts):
              for _ in range(count):
                  doc_index += 1
                  entities = [{"name": "Acme Corp", "type": "company", "confidence": 0.9}]
                  if index == 0:
                      entities.append({"name": "Gold", "type": "commodity", "confidence": 0.9})
                  doc_js.append(js_doc(
                      "64c0000000000000000000%02d" % doc_index,
                      org,
                      day_times[index].strftime("%Y-%m-%dT%H:%M:%S.000Z"),
                      entities,
                  ))
          doc_js.append(js_doc(
              "64c0000000000000000000e1",
              "kgotherorg0000000000000001",
              day_times[0].strftime("%Y-%m-%dT%H:%M:%S.000Z"),
              [{"name": "OtherOrg", "type": "company", "confidence": 0.9}, {"name": "Gold", "type": "commodity", "confidence": 0.9}],
          ))
          insert_js = "db.processeditems.insertMany([" + ", ".join(doc_js) + "])"
          proc = subprocess.run(["docker", "exec", "-i", mongo, "mongosh", "app", "--quiet", "--eval", insert_js], text=True, capture_output=True)
          if proc.returncode != 0:
              fail(proc.stderr or proc.stdout)

          token_a = login(os.environ["SEED_ADMIN_EMAIL"])
          token_c = login("kg-c@example.com")
          open("/tmp/kg-org", "w").write(org)
          open("/tmp/kg-token", "w").write(token_a)
          open("/tmp/kg-token-c", "w").write(token_c)

          exec_query = """
          query Exec($name: String!) {
            getExecutiveChangeImpact(input: { companyName: $name }) {
              scenario generatedAt
              seed { id name type }
              candidates { score kind entity { id name type } chains { reason nodes { id name type } edges { id from to type weight confidence } } }
              metadata
            }
          }"""
          commodity_query = """
          query Commodity($name: String!) {
            getCommodityMoveImpact(input: { commodityName: $name }) {
              scenario generatedAt
              seed { id name type }
              candidates { score kind entity { id name type } chains { reason nodes { id name type } edges { id from to type weight confidence } } }
              metadata
            }
          }"""
          policy_query = """
          query Policy($name: String!, $lpr: Boolean) {
            getPolicyEventImpact(input: { policyName: $name, includeLprSnapshot: $lpr }) {
              scenario generatedAt
              seed { id name type }
              candidates { score kind entity { id name type } chains { reason nodes { id name type } edges { id from to type weight confidence } } }
              metadata
            }
          }"""
          eig_query = """
          query Eig($input: EntityImpactGraphInput) {
            getEntityImpactGraph(input: $input) {
              nodes { id name category type value }
              links { source target value type }
              metadata { totalNodes totalLinks generatedAt }
            }
          }"""
          queries = {
              "executive": {"query": exec_query, "variables": {"name": "Acme Corp"}},
              "commodity": {"query": commodity_query, "variables": {"name": "Gold"}},
              "policy": {"query": policy_query, "variables": {"name": "Rate Cut", "lpr": False}},
              "entity_graph": {"query": eig_query, "variables": {"input": {"minConfidence": 0.5, "minCorrelation": 0.3, "minCoOccurrence": 2, "maxNodes": 100}}},
          }
          open("/tmp/kg-queries.json", "w").write(json.dumps(queries))

          def gql(base, token, query, variables=None):
              status, raw, _ = call(base, "/graphql", "POST", token, {"query": query, "variables": variables or {}})
              return status, body(raw)

          def scrub(value):
              if isinstance(value, dict):
                  return {k: scrub(v) for k, v in value.items() if k not in ("traceId", "locations", "stack", "originalError", "generatedAt")}
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              return value

          def same(left, right):
              if isinstance(left, dict) and isinstance(right, dict):
                  if left.keys() != right.keys():
                      return False
                  return all(same(left[key], right[key]) for key in left)
              if isinstance(left, list) and isinstance(right, list):
                  return len(left) == len(right) and all(same(a, b) for a, b in zip(left, right))
              if isinstance(left, (int, float)) and isinstance(right, (int, float)) and not isinstance(left, bool) and not isinstance(right, bool):
                  return abs(float(left) - float(right)) < 0.05
              return left == right

          def clear_cache():
              subprocess.check_call(["docker", "exec", redis, "redis-cli", "EVAL", "for _, p in ipairs({'knowledgeGraph:*','entityImpactGraph:*'}) do local ks = redis.call('KEYS', p) for i=1,#ks do redis.call('DEL', ks[i]) end end return 1", "0"])

          def match(name, token=token_a):
              case = queries[name]
              clear_cache()
              ns, nd = gql(nest, token, case["query"], case["variables"])
              clear_cache()
              gs, gd = gql(go, token, case["query"], case["variables"])
              if ns != gs or not same(scrub(nd), scrub(gd)):
                  fail(f"{name} legacy nest/gateway {ns}/{gs}\nNEST {json.dumps(scrub(nd), ensure_ascii=False)[:1400]}\nGATEWAY {json.dumps(scrub(gd), ensure_ascii=False)[:1400]}")
              print("OK legacy", name)
              return scrub(gd)

          for name in queries:
              match(name)

          def stats():
              status, raw, _ = call(go, "/__go/graphql-read-stats")
              doc = body(raw) or {}
              if status != 200:
                  fail(f"stats {status} {doc}")
              return doc.get("resolverCalls") or 0

          before = stats()
          gql(go, token_a, queries["executive"]["query"], queries["executive"]["variables"])
          if stats() != before:
              fail("kg impact root incremented resolverCalls while API_GO_GRAPHQL_KG_IMPACT_MODE=legacy")
          print("OK legacy forwards the four roots")
          PY
          logs=$(docker logs api-go-kg 2>&1)
          echo "$logs" | grep -F "GraphQL knowledge-graph impact reads not registered (API_GO_GRAPHQL_KG_IMPACT_MODE=legacy)"
      - name: Exercise kg impact reads (go)
        run: |
          set -euo pipefail
          source /tmp/start-go.sh
          start_go go go
          logs=$(docker logs api-go-kg 2>&1)
          echo "$logs" | grep -F "GraphQL knowledge-graph impact reads registered (getExecutiveChangeImpact, getCommodityMoveImpact, getPolicyEventImpact, getEntityImpactGraph)"
          python3 - << 'PY'
          import json, subprocess, urllib.error, urllib.request

          go = "http://127.0.0.1:4020"
          nest = "http://127.0.0.1:4000"
          token_a = open("/tmp/kg-token").read()
          token_c = open("/tmp/kg-token-c").read()
          queries = json.load(open("/tmp/kg-queries.json"))
          redis = subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=redis:7.2"], text=True).split()[0]

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def call(base, path, token, payload):
              data = json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, method="POST", headers={"content-type": "application/json", "authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req, timeout=40) as resp:
                      return resp.status, json.loads(resp.read() or b"null")
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try:
                      doc = json.loads(raw)
                  except Exception:
                      doc = {"raw": raw[:400].decode("utf-8", "replace")}
                  return exc.code, doc

          def gql(base, token, query, variables=None):
              return call(base, "/graphql", token, {"query": query, "variables": variables or {}})

          def scrub(value):
              if isinstance(value, dict):
                  return {k: scrub(v) for k, v in value.items() if k not in ("traceId", "locations", "stack", "originalError", "generatedAt")}
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              return value

          def same(left, right):
              if isinstance(left, dict) and isinstance(right, dict):
                  if left.keys() != right.keys():
                      return False
                  return all(same(left[key], right[key]) for key in left)
              if isinstance(left, list) and isinstance(right, list):
                  return len(left) == len(right) and all(same(a, b) for a, b in zip(left, right))
              if isinstance(left, (int, float)) and isinstance(right, (int, float)) and not isinstance(left, bool) and not isinstance(right, bool):
                  return abs(float(left) - float(right)) < 0.05
              return left == right

          def clear_cache():
              subprocess.check_call(["docker", "exec", redis, "redis-cli", "EVAL", "for _, p in ipairs({'knowledgeGraph:*','entityImpactGraph:*'}) do local ks = redis.call('KEYS', p) for i=1,#ks do redis.call('DEL', ks[i]) end end return 1", "0"])

          def match(name, token=token_a):
              case = queries[name]
              clear_cache()
              ns, nd = gql(nest, token, case["query"], case["variables"])
              clear_cache()
              gs, gd = gql(go, token, case["query"], case["variables"])
              if ns != gs or not same(scrub(nd), scrub(gd)):
                  fail(f"{name} go nest/go {ns}/{gs}\nNEST {json.dumps(scrub(nd), ensure_ascii=False)[:1600]}\nGO {json.dumps(scrub(gd), ensure_ascii=False)[:1600]}")
              print("OK go", name)
              return scrub(nd), scrub(gd)

          nest_results = {}
          go_results = {}
          for name in queries:
              nest_results[name], go_results[name] = match(name)

          # 脏边指向的另一组织实体不得进入冲击传导候选或链条节点。
          def impact_nodes(doc, field):
              ids = set()
              names = set()
              payload = (doc.get("data") or {}).get(field)
              if not payload:
                  return ids, names
              for candidate in payload.get("candidates") or []:
                  entity = candidate.get("entity") or {}
                  ids.add(entity.get("id"))
                  names.add(entity.get("name"))
                  for chain in candidate.get("chains") or []:
                      for node in chain.get("nodes") or []:
                          ids.add(node.get("id"))
                          names.add(node.get("name"))
              return ids, names

          dirty_id = "kgotherentity00000000001"
          for label, results in (("nest", nest_results), ("go", go_results)):
              for name, field in (("executive", "getExecutiveChangeImpact"), ("commodity", "getCommodityMoveImpact"), ("policy", "getPolicyEventImpact")):
                  ids, names = impact_nodes(results[name], field)
                  if dirty_id in ids or "Other Org Co" in names:
                      fail(f"{label} {name} leaked the other-org entity {sorted(names)}")
          print("OK dirty edge excluded on both implementations")

          # 实体图同时含共现边与相关边；另一组织 processeditems 不参与。
          for label, doc in (("nest", nest_results["entity_graph"]), ("go", go_results["entity_graph"])):
              payload = (doc.get("data") or {}).get("getEntityImpactGraph") or {}
              link_types = {link.get("type") for link in payload.get("links") or []}
              node_names = {node.get("name") for node in payload.get("nodes") or []}
              if "co-occurrence" not in link_types or "correlation" not in link_types:
                  fail(f"{label} entity graph link types {link_types}")
              if "OtherOrg" in node_names:
                  fail(f"{label} entity graph leaked other-org processeditems {sorted(node_names)}")
          print("OK entity graph has both link types and stays inside the org")

          # 无 dashboards.read 被拒绝。
          for name in queries:
              status, doc = gql(go, token_c, queries[name]["query"], queries[name]["variables"])
              errors = (doc or {}).get("errors") or []
              data = (doc or {}).get("data")
              served = bool(data) and any(value is not None for value in data.values())
              if status == 200 and not errors and served:
                  fail(f"no dashboards.read was allowed for {name}: {status} {doc}")
          print("OK no dashboards.read denied")
          PY
