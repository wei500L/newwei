name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  NEXT_BUILD_SKIP_QUALITY_CHECKS: "true"
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
  NEXT_PUBLIC_GRAPHQL_APQ_ENABLED: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Go 工具链供 @modular/api-go / @modular/vector-go 的 lint/test/build 脚本使用；
      # 版本以 apps/api-go/go.mod 为准（apps/vector-go/go.mod 需保持一致）。
      # 两个 Go 模块均为纯标准库、无 go.sum，无需模块缓存。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate

      - name: GraphQL codegen drift check
        run: |
          pnpm --filter @modular/web run generate
          git diff --exit-code apps/web/graphql/generated.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Web component tests with coverage
        run: pnpm --filter @modular/web test -- --coverage

      - name: Vector unit tests
        run: pnpm --filter @modular/vector test

      - name: Go tests (api-go gateway + vector-go pilot)
        run: pnpm --filter @modular/api-go --filter @modular/vector-go test

      - name: Compose image pin check
        run: pnpm --filter @modular/infra-scripts run compose:images:check

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-cyclonedx.json

      - name: Build
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/ais-relay --filter=@modular/api --filter=@modular/vector --filter=@modular/web --filter=@modular/api-go --filter=@modular/vector-go
