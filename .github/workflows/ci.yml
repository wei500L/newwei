name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  NEXT_BUILD_SKIP_QUALITY_CHECKS: "true"
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
  NEXT_PUBLIC_GRAPHQL_APQ_ENABLED: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Go 工具链供 @modular/api-go / @modular/vector-go 的 lint/test/build 脚本使用；
      # 版本以 apps/api-go/go.mod 为准（apps/vector-go/go.mod 需保持一致）。
      # 两个 Go 模块均为纯标准库、无 go.sum，无需模块缓存。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate

      # api-go 模块文件漂移门禁：go.sum 必须是 tracked file（仅 git diff
      # 发现不了未跟踪的 go.sum），且远端 go mod tidy 后 go.mod/go.sum
      # 零漂移（tidy 同时按 go.sum 校验 module proxy 校验和）。依赖清单
      # 的更新走 go-modules-regen label 通道远端生成提交。此步骤先于
      # Lint/Go tests/Build——后续 go 命令依赖 go.sum 就位。
      - name: Go modules drift gate (api-go go.mod/go.sum)
        run: |
          cd apps/api-go
          git ls-files --error-unmatch go.sum
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: GraphQL codegen drift check
        run: |
          pnpm --filter @modular/web run generate
          git diff --exit-code apps/web/graphql/generated.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Web component tests with coverage
        run: pnpm --filter @modular/web test -- --coverage

      - name: Vector unit tests
        run: pnpm --filter @modular/vector test

      - name: API unit tests (SEC-01 / API-01 regression + route scanner)
        run: pnpm --filter @modular/api test

      - name: OpenAPI contract snapshot determinism + drift check
        run: |
          # CI-01：同一命令在两个互相独立的冷 Node 进程各生成一次（--output
          # 导向临时文件，不动已提交基线），比对 SHA-256，再与已提交快照
          # 逐字节比对。任一不同即失败——无 retry，不掩盖非确定性。
          pnpm --filter @modular/api run contract:openapi:snapshot -- --output "$RUNNER_TEMP/openapi-snapshot-run1.json"
          pnpm --filter @modular/api run contract:openapi:snapshot -- --output "$RUNNER_TEMP/openapi-snapshot-run2.json"
          SHA1=$(sha256sum "$RUNNER_TEMP/openapi-snapshot-run1.json" | cut -d' ' -f1)
          SHA2=$(sha256sum "$RUNNER_TEMP/openapi-snapshot-run2.json" | cut -d' ' -f1)
          echo "cold-process run1 sha256: $SHA1"
          echo "cold-process run2 sha256: $SHA2"
          if [ "$SHA1" != "$SHA2" ]; then
            echo "::error::OpenAPI snapshot not deterministic across cold processes ($SHA1 vs $SHA2)"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/openapi-snapshot-run1.json" apps/api/tests/contract/openapi.snapshot.json; then
            echo "::error::OpenAPI snapshot drifted from committed baseline"
            diff "$RUNNER_TEMP/openapi-snapshot-run1.json" apps/api/tests/contract/openapi.snapshot.json | head -200 || true
            exit 1
          fi
          echo "deterministic across cold processes and byte-identical to committed snapshot"

      - name: Auth matrix drift check (fail-closed)
        run: pnpm --filter @modular/api run contract:auth-matrix:check

      - name: GraphQL SDL drift check
        run: |
          pnpm --filter @modular/api run generate:schema
          git diff --exit-code apps/api/schema.gql

      - name: Go tests (api-go gateway + vector-go pilot)
        run: pnpm --filter @modular/api-go --filter @modular/vector-go test

      - name: Compose image pin check
        run: pnpm --filter @modular/infra-scripts run compose:images:check

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-cyclonedx.json

      - name: Build
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/ais-relay --filter=@modular/api --filter=@modular/vector --filter=@modular/web --filter=@modular/api-go --filter=@modular/vector-go

  # vector-go 远端集成（任务 F / roadmap M2 余项 3）：真实 Qdrant +
  # NestJS vector 与 vector-go 的契约差分。本机禁 Docker——验证全部在
  # GitHub Actions Linux runner 完成。
  vector-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      qdrant:
        # 与 infra/docker/docker-compose.yml 的 qdrant 服务同版本。
        # 注：qdrant 镜像无 shell 工具，health-cmd 无法用 curl/wget——
        # 就绪等待由「Start services」步骤的宿主侧循环完成。
        image: qdrant/qdrant:v1.10.1
        ports:
          - 6333:6333
    env:
      HUSKY: "0"
      CI: "true"
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: ""
      VECTOR_INTEGRATION: "1"
      VECTOR_INTEGRATION_TOKEN: integration-internal-token
      VECTOR_INTERNAL_TOKEN: integration-internal-token
      VECTOR_COLLECTION_PREFIX: integration_processed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/vector-go/go.mod
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate

      - name: Build workspace deps (utils) + vector (NestJS)
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/vector --filter=@modular/utils

      - name: Build vector-go binary
        run: cd apps/vector-go && go build -o /tmp/vector-go-bin ./main.go

      - name: Start NestJS vector + vector-go against real Qdrant
        run: |
          # Qdrant 就绪等待（服务容器无 health 探针，宿主侧循环探测）。
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:6333/healthz >/dev/null 2>&1; then
              echo "qdrant healthy"
              break
            fi
            if [ "$i" = 60 ]; then
              echo "qdrant failed to become healthy"
              exit 1
            fi
            sleep 2
          done

          # NestJS vector（:4010）
          PORT=4010 \
          NODE_ENV=test \
          QDRANT_URL=http://localhost:6333 \
          QDRANT_API_KEY= \
          VECTOR_INTERNAL_TOKEN=integration-internal-token \
          VECTOR_COLLECTION_PREFIX=integration_processed \
          node apps/vector/dist/main.js > /tmp/vector-nestjs.log 2>&1 &
          echo $! > /tmp/vector-nestjs.pid

          # vector-go（:4012）
          PORT=4012 \
          NODE_ENV=test \
          QDRANT_URL=http://localhost:6333 \
          QDRANT_API_KEY= \
          VECTOR_INTERNAL_TOKEN=integration-internal-token \
          VECTOR_COLLECTION_PREFIX=integration_processed \
          /tmp/vector-go-bin > /tmp/vector-go.log 2>&1 &
          echo $! > /tmp/vector-go.pid

          # 等待两侧健康（最多 60s）。
          for i in $(seq 1 60); do
            nest_ok=$(curl -fsS http://localhost:4010/healthz >/dev/null 2>&1 && echo ok || echo no)
            go_ok=$(curl -fsS http://localhost:4012/healthz >/dev/null 2>&1 && echo ok || echo no)
            if [ "$nest_ok" = ok ] && [ "$go_ok" = ok ]; then
              echo "both vector services healthy"
              exit 0
            fi
            sleep 1
          done
          echo "vector services failed to become healthy"
          echo "=== nestjs log ==="; cat /tmp/vector-nestjs.log || true
          echo "=== go log ==="; cat /tmp/vector-go.log || true
          exit 1

      - name: Contract diff — NestJS vector vs vector-go (real Qdrant)
        run: |
          VECTOR_NESTJS_URL=http://localhost:4010 \
          VECTOR_GO_URL=http://localhost:4012 \
          pnpm --filter @modular/vector test -- src/integration/vector-go-diff.test.ts

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== nestjs log ==="; cat /tmp/vector-nestjs.log || true
          echo "=== go log ==="; cat /tmp/vector-go.log || true

      - name: Stop services
        if: always()
        run: |
          kill $(cat /tmp/vector-nestjs.pid) 2>/dev/null || true
          kill $(cat /tmp/vector-go.pid) 2>/dev/null || true

  # Go-批2A/2B：user-settings 只读 shadow（onboarding / rss-reader /
  # spacetime-timeline 三个 GET 共用同一 repository）的真实 MySQL 数据
  # 访问验证。只测 Go repository（最小 fixture 的 UserSetting 表），不启动
  # NestJS/前端/Redis/Qdrant。普通 verify 的 `go test ./...` 不含 integration
  # build tag——没有 MySQL 时 verify 不受影响。
  # api-go 的远端真实 MySQL/Redis 集成测试（Go-批3A 起含 authz 授权
  # 重推导 + authn blacklist 的真实栈验证）。
  api-go-user-settings-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        # 固定版本（不用 latest）；与 infra/docker/docker-compose.yml 的
        # MySQL 服务同版本线。health 探针由官方镜像 healthcheck 提供。
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # Go-批3A：access-token blacklist 用真实 Redis（与 smoke 的 redis
      # service 同版本线；无密码——ephemeral CI 栈）。
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
      API_GO_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false

      - name: Go modules (download with committed go.sum)
        run: cd apps/api-go && go mod download

      - name: MySQL/Redis integration tests (user-settings repository + authz RBAC + authn blacklist)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/usersettings/ ./internal/authz/ -run 'TestUserSettingsMySQLIntegration|TestAuthZMySQLIntegration' -v

  # api-go Go module 依赖清单（go.mod/go.sum）的按需远端再生成。
  #
  # 背景：本仓库约束「生成器不在本机执行」——go.sum 是 go 工具链从
  # module proxy 校验和生成的产物（本机禁跑 go 工具链），只能远端生成
  # 后作为 tracked file 提交。api-go 自 Go-批2A 起引入第三方依赖
  # （go-sql-driver/mysql）；后续迁移批次继续新增依赖时复用同一通道。
  #
  # 触发边界：仅 PR 带 go-modules-regen label 时运行（维护者在有意变更
  # 依赖时添加）；与 contract-regen 同一模式：检出 PR head → go mod
  # tidy → 空跑构建确认清单可用 → 有差异则 bot 提交回 PR 分支。
  # 再生成完成后必须移除 label——平时 verify 的模块文件漂移门禁保持
  # fail-on-drift 语义。
  go-modules-regen:
    if: contains(github.event.pull_request.labels.*.name, 'go-modules-regen')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false

      - name: Regenerate api-go module files
        run: |
          cd apps/api-go
          go mod tidy
          # 生成后空跑一次构建，确保清单与当前代码一致可用。
          go build ./...

      - name: Commit regenerated module files (if changed)
        run: |
          git config user.name "go-modules-regen[bot]"
          git config user.email "actions@github.com"
          # git status --porcelain 同时覆盖 tracked 修改与未跟踪文件
          # （仅 git diff 发现不了未跟踪的 go.sum）。
          if [ -z "$(git status --porcelain -- apps/api-go/go.mod apps/api-go/go.sum)" ]; then
            echo "module files already in sync — nothing to commit"
            exit 0
          fi
          git add apps/api-go/go.mod apps/api-go/go.sum
          git commit -m "🔧 chore(api-go): 远端再生成 Go module 依赖清单（go.mod/go.sum）"
          git push origin HEAD:${{ github.head_ref }}
          echo "committed regenerated module files"

      - name: Remind to remove the label
        run: |
          echo "::notice::go.mod/go.sum 已远端生成并提交。请从 PR 移除 go-modules-regen label，恢复漂移门禁语义。"

  # 契约基线一次性远端再生成（专用远端生成提交方案）。
  #
  # 背景：本仓库约束「生成器不在本机执行」——生成物（OpenAPI 快照 /
  # 鉴权矩阵 / GraphQL SDL）的更新必须走远端。本 job 仅在 PR 带有
  # contract-regen label 时运行：检出 PR head → 运行三个生成器 →
  # 有差异则提交回 PR 分支（触发新一轮完整 CI）。
  #
  # ⚠️ 该 label 等价于「跳过漂移门禁一次」——只应由维护者在有意变更
  # 契约语义时添加，再生成完成后必须移除。平时 verify job 的三个
  # drift gate 保持 fail-on-drift 语义不变。
  contract-baseline-regen:
    if: contains(github.event.pull_request.labels.*.name, 'contract-regen')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HUSKY: "0"
      CI: "true"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate

      - name: Regenerate contract artifacts
        run: |
          pnpm --filter @modular/api run contract:openapi:snapshot
          pnpm --filter @modular/api run contract:auth-matrix:generate
          pnpm --filter @modular/api run generate:schema

      - name: Commit regenerated artifacts (if changed)
        run: |
          git config user.name "contract-regen[bot]"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "contract artifacts already in sync — nothing to commit"
            exit 0
          fi
          git add apps/api/tests/contract apps/api/schema.gql
          git commit -m "🔧 chore(contract): 远端再生成契约基线（OpenAPI 快照/鉴权矩阵/GraphQL SDL）"
          git push origin HEAD:${{ github.head_ref }}
          echo "committed regenerated artifacts"

      - name: Remind to remove the label
        run: |
          echo "::notice::契约基线已再生成并提交。请从 PR 移除 contract-regen label，恢复漂移门禁语义。"
