name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  NEXT_BUILD_SKIP_QUALITY_CHECKS: "true"
  # 自托管 runner 内存预算（德国服务器 7.8G，其中生产容器常驻约 2.1G）。
  # 实测两个内存大户：apps/api 的 typescript-eslint 类型感知 lint 峰值
  # 超 1.5G 堆（堆上限给 1.5G 会直接 "JavaScript heap out of memory"），
  # 以及 Go 编译器单包峰值约 3.5G。默认 turbo 并发 10 + Go 默认 -p=NumCPU
  # 会把物理内存和 swap 一起打满并触发内核 OOM-killer。
  # 取舍：Node 堆给 3G（够 lint），Go 编译串行（-p=1），turbo 并发 2。
  TURBO_CONCURRENCY: "2"
  NODE_OPTIONS: "--max-old-space-size=3072"
  GOFLAGS: "-p=1"
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
  NEXT_PUBLIC_GRAPHQL_APQ_ENABLED: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app

jobs:
  verify:
    runs-on: [self-hosted, linux, build-server]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Go 工具链供 @modular/api-go / @modular/vector-go 的 lint/test/build 脚本使用；
      # 版本以 apps/api-go/go.mod 为准（apps/vector-go/go.mod 需保持一致）。
      # api-go 自 Go-批2A 起有第三方依赖（go.sum 为 tracked file，漂移由
      # verify 的 drift gate 与 go-modules-regen 通道管理）；vector-go 仍为
      # 纯标准库。两模块均不启用 setup-go 模块缓存（集成 job 用
      # cache: false 消费已提交 go.sum）。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate

      # api-go 模块文件漂移门禁：go.sum 必须是 tracked file（仅 git diff
      # 发现不了未跟踪的 go.sum），且远端 go mod tidy 后 go.mod/go.sum
      # 零漂移（tidy 同时按 go.sum 校验 module proxy 校验和）。依赖清单
      # 的更新走 go-modules-regen label 通道远端生成提交。此步骤先于
      # Lint/Go tests/Build——后续 go 命令依赖 go.sum 就位。
      - name: Go modules drift gate (api-go go.mod/go.sum)
        run: |
          cd apps/api-go
          git ls-files --error-unmatch go.sum
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: GraphQL codegen drift check
        run: |
          pnpm --filter @modular/web run generate
          git diff --exit-code apps/web/graphql/generated.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Web component tests with coverage
        run: pnpm --filter @modular/web test -- --coverage

      - name: Vector unit tests
        run: pnpm --filter @modular/vector test

      - name: API unit tests (SEC-01 / API-01 regression + route scanner)
        run: pnpm --filter @modular/api test

      - name: OpenAPI contract snapshot determinism + drift check
        run: |
          # CI-01：同一命令在两个互相独立的冷 Node 进程各生成一次（--output
          # 导向临时文件，不动已提交基线），比对 SHA-256，再与已提交快照
          # 逐字节比对。任一不同即失败——无 retry，不掩盖非确定性。
          pnpm --filter @modular/api run contract:openapi:snapshot -- --output "$RUNNER_TEMP/openapi-snapshot-run1.json"
          pnpm --filter @modular/api run contract:openapi:snapshot -- --output "$RUNNER_TEMP/openapi-snapshot-run2.json"
          SHA1=$(sha256sum "$RUNNER_TEMP/openapi-snapshot-run1.json" | cut -d' ' -f1)
          SHA2=$(sha256sum "$RUNNER_TEMP/openapi-snapshot-run2.json" | cut -d' ' -f1)
          echo "cold-process run1 sha256: $SHA1"
          echo "cold-process run2 sha256: $SHA2"
          if [ "$SHA1" != "$SHA2" ]; then
            echo "::error::OpenAPI snapshot not deterministic across cold processes ($SHA1 vs $SHA2)"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/openapi-snapshot-run1.json" apps/api/tests/contract/openapi.snapshot.json; then
            echo "::error::OpenAPI snapshot drifted from committed baseline"
            diff "$RUNNER_TEMP/openapi-snapshot-run1.json" apps/api/tests/contract/openapi.snapshot.json | head -200 || true
            exit 1
          fi
          echo "deterministic across cold processes and byte-identical to committed snapshot"

      - name: Auth matrix drift check (fail-closed)
        run: pnpm --filter @modular/api run contract:auth-matrix:check

      - name: GraphQL SDL drift check
        run: |
          pnpm --filter @modular/api run generate:schema
          git diff --exit-code apps/api/schema.gql

      - name: Go tests (api-go gateway + vector-go pilot)
        run: pnpm --filter @modular/api-go --filter @modular/vector-go test

      - name: Compose image pin check
        run: pnpm --filter @modular/infra-scripts run compose:images:check

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom-cyclonedx.json

      - name: Build
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/ais-relay --filter=@modular/api --filter=@modular/vector --filter=@modular/web --filter=@modular/api-go --filter=@modular/vector-go

  # vector-go 远端集成（任务 F / roadmap M2 余项 3）：真实 Qdrant +
  # NestJS vector 与 vector-go 的契约差分。本机禁 Docker——验证全部在
  # GitHub Actions Linux runner 完成。
  vector-integration:
    runs-on: [self-hosted, linux, build-server]
    timeout-minutes: 20
    services:
      qdrant:
        # 与 infra/docker/docker-compose.yml 的 qdrant 服务同版本。
        # 注：qdrant 镜像无 shell 工具，health-cmd 无法用 curl/wget——
        # 就绪等待由「Start services」步骤的宿主侧循环完成。
        image: qdrant/qdrant:v1.10.1
        ports:
          - 6333:6333
    env:
      HUSKY: "0"
      CI: "true"
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: ""
      VECTOR_INTEGRATION: "1"
      VECTOR_INTEGRATION_TOKEN: integration-internal-token
      VECTOR_INTERNAL_TOKEN: integration-internal-token
      VECTOR_COLLECTION_PREFIX: integration_processed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/vector-go/go.mod
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate

      - name: Build workspace deps (utils) + vector (NestJS)
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/vector --filter=@modular/utils

      - name: Build vector-go binary
        run: cd apps/vector-go && go build -o /tmp/vector-go-bin ./main.go

      - name: Start NestJS vector + vector-go against real Qdrant
        run: |
          # Qdrant 就绪等待（服务容器无 health 探针，宿主侧循环探测）。
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:6333/healthz >/dev/null 2>&1; then
              echo "qdrant healthy"
              break
            fi
            if [ "$i" = 60 ]; then
              echo "qdrant failed to become healthy"
              exit 1
            fi
            sleep 2
          done

          # NestJS vector（:4010）
          PORT=4010 \
          NODE_ENV=test \
          QDRANT_URL=http://localhost:6333 \
          QDRANT_API_KEY= \
          VECTOR_INTERNAL_TOKEN=integration-internal-token \
          VECTOR_COLLECTION_PREFIX=integration_processed \
          node apps/vector/dist/main.js > /tmp/vector-nestjs.log 2>&1 &
          echo $! > /tmp/vector-nestjs.pid

          # vector-go（:4012）
          PORT=4012 \
          NODE_ENV=test \
          QDRANT_URL=http://localhost:6333 \
          QDRANT_API_KEY= \
          VECTOR_INTERNAL_TOKEN=integration-internal-token \
          VECTOR_COLLECTION_PREFIX=integration_processed \
          /tmp/vector-go-bin > /tmp/vector-go.log 2>&1 &
          echo $! > /tmp/vector-go.pid

          # 等待两侧健康（最多 60s）。
          for i in $(seq 1 60); do
            nest_ok=$(curl -fsS http://localhost:4010/healthz >/dev/null 2>&1 && echo ok || echo no)
            go_ok=$(curl -fsS http://localhost:4012/healthz >/dev/null 2>&1 && echo ok || echo no)
            if [ "$nest_ok" = ok ] && [ "$go_ok" = ok ]; then
              echo "both vector services healthy"
              exit 0
            fi
            sleep 1
          done
          echo "vector services failed to become healthy"
          echo "=== nestjs log ==="; cat /tmp/vector-nestjs.log || true
          echo "=== go log ==="; cat /tmp/vector-go.log || true
          exit 1

      - name: Contract diff — NestJS vector vs vector-go (real Qdrant)
        run: |
          VECTOR_NESTJS_URL=http://localhost:4010 \
          VECTOR_GO_URL=http://localhost:4012 \
          pnpm --filter @modular/vector test -- src/integration/vector-go-diff.test.ts

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== nestjs log ==="; cat /tmp/vector-nestjs.log || true
          echo "=== go log ==="; cat /tmp/vector-go.log || true

      - name: Stop services
        if: always()
        run: |
          kill $(cat /tmp/vector-nestjs.pid) 2>/dev/null || true
          kill $(cat /tmp/vector-go.pid) 2>/dev/null || true

  # Go-批2A/2B：user-settings 只读 shadow（onboarding / rss-reader /
  # spacetime-timeline 三个 GET 共用同一 repository）的真实 MySQL 数据
  # 访问验证。只测 Go repository（最小 fixture 的 UserSetting 表），不启动
  # NestJS/前端/Redis/Qdrant。普通 verify 的 `go test ./...` 不含 integration
  # build tag——没有 MySQL 时 verify 不受影响。
  # api-go 的远端真实 MySQL/Redis 集成测试（Go-批3A 起含 authz 授权
  # 重推导 + authn blacklist 的真实栈验证）。
  api-go-user-settings-integration:
    runs-on: [self-hosted, linux, build-server]
    timeout-minutes: 25
    services:
      mysql:
        # 固定版本（不用 latest）；与 infra/docker/docker-compose.yml 的
        # MySQL 服务同版本线。health 探针由官方镜像 healthcheck 提供。
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # Go-批3A：access-token blacklist 用真实 Redis（与 smoke 的 redis
      # service 同版本线；无密码——ephemeral CI 栈）。
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # ANALYSIS-RUNS-001：真实 Mongo 7.0 验证 $topN、running 恢复、结果/日志
      # 终态。版本与 infra/docker/docker-compose.yml 的 Mongo 服务同线。
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
      API_GO_TEST_REDIS_ADDR: 127.0.0.1:6379
      MONGO_URI: mongodb://127.0.0.1:27017/app
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false

      # 使用仓库已锁定的 bullmq 5.63.2 做双向协议验证。只安装 api 的
      # workspace 依赖，node fixture 从 apps/api 目录读取同一 lockfile。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install locked Node BullMQ fixture dependencies
        run: pnpm install --frozen-lockfile --filter @modular/api...

      - name: Go modules (download with committed go.sum)
        run: cd apps/api-go && go mod download

      - name: MySQL/Redis integration tests (user-settings repository + authz RBAC + authn blacklist)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/usersettings/ ./internal/authz/ -run 'TestUserSettingsMySQLIntegration|TestAuthZMySQLIntegration' -v
      # ITEMS-INGEST-001: the itemPipeline producer is validated against the
      # real Redis 7.2 service above with the same fixed BullMQ 5.63.2 Lua the
      # NestJS producer uses. This proves the Redis wire protocol only; it does
      # not start a NestJS worker or any external content pipeline.
      - name: Redis itemPipeline producer integration tests
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/pipelineenqueue/ -run 'TestPipelineEnqueueRedisIntegration' -v
        env:
          API_GO_TEST_REDIS_ADDR: 127.0.0.1:6379
      # ItemMeta/raw_item Outbox claim, transaction, JSON filtering and dead
      # compensation against the real MySQL 8.4 service above.
      - name: MySQL item write/outbox integration tests
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/itemsingest/ -run 'TestItemsIngestMySQLIntegration' -v

      # Archive preparation producer: real Redis 7.2 wire check for the BullMQ
      # 5.63.2 MessagePack/hash/options, wait/pause/marker/events, de-dupe,
      # active non-removal, completed/failed re-add, status shape/TTL/index and
      # the 200-entry trim. It proves the Redis protocol only; the NestJS
      # worker is not started here.
      - name: Redis integration test (archive preparation BullMQ producer)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/archivepreparation/ -run TestArchivePreparationRedisIntegration -v

      # 告警规则迁移：默认规则补建、upsert/delete/trigger、B1 通道归属、B3 定时
      # 计划替换，以及直接读取 bull:alerts:* 原始结构断言任务字段。
      - name: MySQL/Redis integration tests (alert rules + BullMQ producer)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/graphqlread/alerts/ -run 'TestAlertRules' -v

      # 采集任务生命周期与队列控制的真实 MySQL/Redis 集成测试：BullMQ
      # 任务哈希/wait/prioritized/去重键/meta、删除事务与 MongoOutbox、
      # 审计、活动计数、暂停/恢复/并发与 C2 广播。Nest worker 不在这个
      # job 内，协议层由原始 Redis 结构断言。
      - name: MySQL/Redis crawl task lifecycle integration tests
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/crawltaskwrite/ -run 'TestCrawlTaskLifecycle' -v

      # 设置中心运行检查与地理编码：真实 MySQL/Redis 覆盖邮件验证码设置
      # 写库+审计+缓存、地理编码缓存/限流结构、实时信号 Redis/MySQL
      # fixture。Mongo 部分只用单元测试 fake（不新增 CI service），SMTP
      # 用测试进程内的 net/textproto 服务器证明协议行为。
      - name: Settings diagnostics integration tests (email settings + geocoding + realtime diagnostics)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/emailsettings/ ./internal/geocoding/ ./internal/runtimediagnostics/ -run 'Integration' -v

      # The insights lane has no Mongo service in this job. Its Mongo reads are
      # covered by unit-level query construction/fakes; this step exercises the
      # cache envelope, TTL and lock against the real Redis service above.
      - name: Redis integration tests (situation insights cache/lock)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/situationsignals/ -run 'TestInsightsRedisIntegration|TestInsightsRedisKeyConstants' -v

      # 知识图谱自动构建：游标、实体/边/证据事务写入、K2 重量修正、链接去重、
      # 设置缓存，以及 tick gate / 组织锁的 Redis 结构与互斥。
      - name: MySQL/Redis integration tests (knowledge-graph ingestion)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/kgingestion/ -run 'TestKnowledgeGraphIngestion' -v
      # 新闻事件聚类 LLM 补救链与新闻—指标关联刷新的真实副作用：
      # BullMQ 任务写入/消费/失败/卡死恢复的 Redis 原始结构断言、NewsEvent/
      # NewsEventItem 事务写入与 (orgId, processedArticleId) 唯一约束、扫描锁/
      # 时间片/组织锁。Mongo 不在本 job 的服务里，Mongo fixture 相关分支由
      # 单元测试的纯函数与 fake 覆盖（PR 说明）。
      - name: News backfill integration tests (BullMQ protocol, event writes, scheduler locks)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/clusteringrecoveryqueue/ ./internal/newsnowclusteringops/ ./internal/newsbackfilljobs/ -run 'TestIntegration' -v

      - name: MySQL integration tests (dashboard charts + spacetime reads)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/dashboardcharts/ ./internal/dashboardspacetime/ -run 'TestSectorEndpointsMySQLIntegration|TestSpacetimeMySQLIntegration' -v
      # 分类质量队列批次：BullMQ 生产/消费、重试与卡死恢复需要真实 Redis。
      # 同一 job 的 redis service 已提供，Mongo 不在该 job 内（分类质量的 Mongo
      # 读写由单元测试的 fake 覆盖）。
      - name: BullMQ classification quality queue integration tests (Redis)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/qualityqueue/ -run 'TestBullMQ' -v

      - name: MySQL/Redis integration test (account-data export fixture, isolation, quota, audit)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/accountdata/ -run 'TestDataExportIntegration' -v

      # Assistant 队列与订阅总线只使用既有 Redis：BullMQ 生产/消费/重试/卡死
      # 恢复（A2）以及 gqlsub:assistantEvents 的原始消息逐字节断言。Mongo 在
      # 该 job 中不可用，运行记录的持久化由 assistantruns 单元测试的 fake 覆盖。
      - name: Assistant queue and subscription integration tests
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/assistantqueue/ ./internal/assistantruns/ -run 'TestProducerWorkerRetryAndRemove|TestStalledJobReturnsWithCounter|TestPublisherRawMessageMatchesNestEnvelope' -v

      # GDELT 外部快照链路的真实 MySQL/Redis 验证：投影聚合与逐份
      # payload 参考实现等价、7 天清理、两层缓存的 key/TTL/原始值、共享锁互斥
      # 与数据库回填缓存。与上一个步骤同一 MySQL/Redis service。
      - name: MySQL/Redis integration tests (GDELT external snapshot store, cache and lease)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/gdeltsnapshot/ -run 'TestGDELTSnapshotIntegration' -v

      - name: MySQL integration tests (crawl-strategy run records + preview in-flight queries)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/crawlfrontierruns/ ./internal/crawlstrategyruns/ -run 'TestStrategyRunWriteIntegration|TestStrategyRunBatchWriterMatchesPerRowIntegration|TestCountActivePipelineJobsIntegration' -v

      # Frontier 管理端写路由（创建运行 + 单条/批量重试节点）：真实 MySQL/Redis
      # 验证四个行族与 runDetail 回读、crawl4ai-hot/normal 的 BullMQ 原始结构
      # 与去重键、B2 元数据行锁合并、B3 失败回滚、B4 终态拒绝。不连接真实
      # crawl4ai，也不启动 worker（节点只入队，不会被执行）。
      - name: MySQL/Redis integration tests (crawl-frontier admin write routes)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/crawlfrontierruns/ -run 'TestFrontierWritesIntegration' -v

      # 告警 worker 的队列协议与事务语义：领取事务（并发只有一方成功）、B1 投递
      # 最后一次失败、moveToDelayed 的 skipAttempt 与自定义重试退避、限速 key、
      # O1/O2/B3 扫描，以及 alertEvents/通知桥的两条 Redis 消息。fixture 使用
      # MySQL 后端的 system_event provider，因此不需要 Mongo 服务。
      - name: Alert worker integration tests (queue protocol, claim transaction, delivery state machine, scan)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/alertworker/ -run 'TestAlertWorkerIntegration' -v

      # 真实 MySQL/Redis/Mongo + 真 Go worker + Node BullMQ 5.63.2 + 本地
      # HTTP SSE fixture。fixture 通过只证明协议与本地闭环，不代表真实外部
      # 模型、生产数据或多实例切换已验证。
      - name: Analysis runs integration (Go worker + Node BullMQ + Mongo/MySQL/Redis + SSE fixture)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/analysisruns/ -run TestAnalysisRunsIntegration -v -timeout 10m

      # NewsNow 热点分析与个性化推荐：真实 MySQL/Redis/Mongo 覆盖 H1（匹配只用本组织
      # 条目/事件）与 O1（分阶段批量匹配与逐 URL 等价）、O4 多行舆情快照写入、tick
      # gate/组织锁/warm 锁的上限 TTL，以及信号状态的一次 pipeline 写入。模型网关不在
      # 本 job 调用（解析与请求形状由单元 httptest 覆盖）。
      - name: MySQL/Redis/Mongo integration tests (NewsNow hottest analysis)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/newsnowhottest/ -run 'TestNewsnowHottestIntegration' -v

      # processed_item Outbox: CAS claim, delivery across MySQL/Mongo, vector
      # condition, backoff/dead compensation, O1 scan order and B1 multi-batch
      # draining against the real MySQL 8.4, Redis 7.2 and Mongo 7.0 services.
      - name: MySQL/Mongo processed_item outbox integration tests
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/processeditemoutbox/ -run 'TestProcessedItemOutboxIntegration' -v

      # 态势监控设置：真实 MySQL/Redis 覆盖读写/重置/清除授权、加密信封、审计、
      # 缓存失效、O3 写后重读等价与 T1 广播；Telegram JobScheduler 用原始 Redis
      # 结构断言，并用已锁定的 Node BullMQ 5.63.2 fixture 双向读取/替换。
      - name: MySQL/Redis integration tests (situation-monitor settings + Telegram scheduler)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/situationsettings/ ./internal/situationsettings/telegramsched/ -run 'Integration|TestTelegramSchedulerNodeInterop' -v

      # 新闻源采集调度与运维：真实 MySQL/Redis 覆盖派发事务（PipelineJob +
      # CrawlTask + 预生成 id）、BullMQ crawl 队列原始结构、25 秒共享派发去重
      # key、背压 key/TTL/计数与通知桥消息、运营快照写入 + Go newssources 读取
      # 往返，以及四个运维入口。种子发现用 fixture，不访问外部站点或 crawl4ai；
      # 不启动 crawl worker 与条目流水线 worker。
      - name: MySQL/Redis news-source scheduler integration tests
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/newssourcescheduler/ -run 'TestNewsSourceSchedulerIntegration' -v

      # 采集维护 Cron 的真实 MySQL/Redis/Mongo 集成测试：janitor（三类
      # 标记、B1 prioritized 不误杀、B2 空闲 pending、B3 事务内选取、
      # crawl:activity）、cleanup outbox（投递、退避、死信、Mongo 删除）、
      # 自适应并发（设置行、队列 meta、C2 广播、冷却）、质量快照（tick gate、
      # 组织锁、最近变化发现、快照 upsert）与审计保留（B5 租约、主键游标
      # 2500 行、保留未过期记录）。
      - name: MySQL/Redis/Mongo crawl maintenance integration tests
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/crawlmaintenance/ -run 'TestCrawlMaintenance' -v -timeout 10m

      # 事件时间线与情绪快照重建：真实 MySQL/Redis/Mongo 覆盖端到端写入与
      # graphqlread/newsevents 读取端回读、B1（只写 $.timeline，重建期间写入的
      # briefV1 保留；metadata 非对象时为 {timeline}）、保留窗口修剪、B2（排序规则
      # 等价的名称合并、avgScore 用 DOUBLE 除法）、事务失败保留旧数据，以及
      # tick gate / 组织锁的键名与互斥。
      - name: MySQL/Redis/Mongo integration tests (event timeline + sentiment snapshot rebuild)
        run: cd apps/api-go && go test -tags=integration -count=1 -p 1 ./internal/newseventstimeline/ ./internal/sentimentsnapshot/ -v -timeout 10m

      # 实时信号采集 Cron 的真实 MySQL/Redis/Mongo 验证：一轮完整采集后的指标
      # 序列、源状态、洞察快照、ADS-B/AIS 快照与 OpenSky 额度账本；B1（3 个组织
      # 并发时军机区域只预扣一次）；O1（AIS 与 Polymarket 每轮各只请求一次）；
      # 全量航班抓取的游标与 transport 写入；dashboardwarmap 与
      # runtimediagnostics 读取端回读；以及 enabled=false 时的清理。外部接口全部
      # 由测试进程内的 httptest 服务器模拟，不调用真实 OpenSky/ACLED/Cloudflare/
      # PizzINT/GDELT/Polymarket/AIS。同一 job 的 Mongo service 提供 transport 集合。
      - name: Realtime signals collector integration tests (MySQL/Redis/Mongo + httptest upstreams)
        run: cd apps/api-go && go test -tags=integration -count=1 -p 1 ./internal/realtimesignals/ ./internal/dataruntimesettings/ -run 'TestRealtimeSignalsCollectorIntegration|TestAcledAuthStateIntegration|TestAcledRefreshLockIntegration|TestEffectiveRealtimeCronRuntimeIntegration' -v -timeout 10m

      # 新闻事件入库 Cron（NewsEventsIngestionService.ingestRecentProcessedArticles）：
      # 真实 MySQL/Redis/Mongo + 本进程 httptest 模型服务与向量服务。覆盖默认模式
      # 的向量/重叠/新建三条分配路径与逐篇游标、B1 settle 窗口（含并发晚提交竞态）、
      # bertopic 代表与成员分配、聚类失败分组与 TaskLog、唯一键并发只有一个胜出者，
      # 以及 tick gate / 组织锁的键名与互斥。fixture 只证明协议与本地闭环：没有连接
      # 真实模型服务或向量服务，也没有用生产数据比对分配结果。
      - name: MySQL/Redis/Mongo integration tests (news-event ingestion and assignment)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/newseventsingest/ -v -timeout 10m

      # Frontier LLM 判定/学习 worker：真实 MySQL/Redis 验证判定物化与工作流
      # 事件/步骤、B1 失败收尾、学习成功/失败重试一次、租户隔离，以及两个
      # 队列的 1/1000ms 限速。LLM 由进程内 httptest 提供，不连接真实网关。
      - name: MySQL/Redis Frontier LLM worker integration tests
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/crawlfrontierllm/ -run 'TestFrontierLlm' -v
        env:
          API_GO_TEST_REDIS_ADDR: 127.0.0.1:6379

      # Archive preparation worker: real MySQL/Redis/Mongo end-to-end for a
      # digest and a calendar job (status processing -> partial -> ready,
      # classification writes), the B1 jobBatchSize+5 unparseable-result
      # termination case, and a model-layer failure that writes FAILED and
      # schedules the BullMQ retry. Model calls use httptest.
      - name: Archive preparation worker integration tests (MySQL/Redis/Mongo)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/archivepreparationworker/ -run 'TestArchivePreparationWorkerIntegration' -v

      # 本批五项残留职责：真实 MySQL/Redis/Mongo 覆盖清理范围与 B1 租约、复核
      # 样本事件入队幂等、replay/rollback 的写入与跨组织 404、指标端点鉴权与
      # 文本格式、启动 TTL 对齐与启动锁。每个包单独一次 go test：包级 FlushDB
      # 不能并发执行。
      - name: Residual duties integration tests (BullMQ cleanup + review seed + pipeline writes + metrics + startup reconcile)
        run: |
          cd apps/api-go
          go test -tags=integration -count=1 ./internal/bullmqcleanup/ -run 'TestBullmqCleanup' -v
          go test -tags=integration -count=1 ./internal/classificationreviewseed/ -run 'TestClassificationReviewSeed' -v
          go test -tags=integration -count=1 ./internal/pipelinerecovery/ -run 'TestPipelineRecoveryWritesIntegration' -v
          go test -tags=integration -count=1 ./internal/metrics/ -run 'TestMetricsEndpointAuthorizationIntegration' -v
          go test -tags=integration -count=1 ./internal/startupreconcile/ -run 'TestStartupReconcile' -v

      # 态势信号 worker（situationMonitorSignals）：真实 Redis/MySQL 覆盖 B1 双实例
      # 状态连续与单实例租约、B3 OREF 失败语义与三份缓存文档、事件桥 envelope
      # 原始字节、A2 清除广播、A4 重复任务协议，以及 OREF 默认告警规则。
      # Telegram 全部 fake（不拨号），OREF 上游/代理为进程内 httptest，无外网。
      - name: Redis/MySQL integration tests (situation monitor signals worker)
        run: cd apps/api-go && go test -tags=integration -count=1 -timeout 5m ./internal/situationsignalsworker/ -run 'TestSituationSignalsWorker' -v
        env:
          API_GO_TEST_REDIS_ADDR: 127.0.0.1:6379

      # 条目流水线 worker（API_GO_ITEM_PIPELINE_WORKER_MODE=go 的 Go 消费端）：
      # 真实 MySQL/Redis/Mongo 验证入队到 BullMQ worker 的完整协议（completed
      # 事件、TaskLog、ItemMeta/PipelineJob/NewsSource 状态写入）、瞬时失败进入
      # delayed 集合并按 exponential backoff 重试、永久错误直接进入 failed 并写
      # itemPipelineDlq（原始 data 展开 + failedAt/errorKind/error）、以及 B1
      # 并发两次最终失败时计数 +2 且熔断通知只发一次。测试进程内的 fake pipeline
      # 只验证 worker/失败语义；完整流水线由 newspipeline 的单元测试覆盖。
      - name: Item pipeline worker integration tests (MySQL/Redis/Mongo)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/itempipeline/ -run 'TestItemPipelineWorkerIntegration|TestItemPipelineWorkerRetriesTransientFailure|TestItemPipelineWorkerPermanentFailureGoesToDLQ|TestMarkSourceFailureStateConcurrentFinalFailures' -v -timeout 10m

      # 完整条目流水线链路：真实 MySQL/Mongo，任务带预取正文（不请求 crawl4ai），
      # LLM 由进程内 fake 提供、向量服务禁用。覆盖 staged 模式的预检门控、清洗、
      # 质量门控、实体/情感/知识图谱抽取、去重、持久化（Article +
      # ProcessedArticle + MongoOutbox）以及 #116 立即投递（ProcessedItem →
      # ItemMeta completed → 读模型 → outbox 行删除）。没有连接真实 LLM 网关、
      # crawl4ai 或向量服务，也没有用生产数据比对结果。
      - name: Full item pipeline chain integration test (MySQL/Mongo + fake LLM)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/newspipeline/ -run 'TestFullPipelineChainIntegration' -v -timeout 10m

      # refactor/go-queue-ops · 队列运维接口：真实 Redis 7.2 + vendored BullMQ
      # 5.63.2 官方脚本。覆盖队列列表的 counts/paused/并发度（一次 pipeline）、
      # failed job 用 reprocessJob 回到 wait、删除 delayed job 产生 removed 事件、
      # 按状态清理，以及 itemPipelineDlq 重放（itemPipeline 出现新 job、DLQ job 被
      # 删除、重复重放因 replay-<dlqJobId> 去重不产生第二个 job）。不启动 NestJS
      # worker，也不连接真实流水线。
      - name: Redis queue operations console integration tests (BullMQ script protocol)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/queueops/ -run '^TestQueueOpsIntegration' -v
        env:
          API_GO_TEST_REDIS_ADDR: 127.0.0.1:6379

      # refactor/go-queue-ops · 按组织的 itemPipeline 计数：真实 Redis 上跑与
      # NestJS 逐字节相同的三段 Lua（waiting→active→completed 计数、终态不保留
      # 时 meta 被删而计数 +1、removed 扣减），并验证两个 tracker 只有一个拿到
      # 租约在读事件流。
      - name: Redis queue org-stats tracker integration tests (single owner + Nest Lua)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/queueorgstats/ -run 'TestQueueOrgStatsIntegration' -v
        env:
          API_GO_TEST_REDIS_ADDR: 127.0.0.1:6379

      # refactor/go-queue-ops · 告警规则启动全量对账：真实 MySQL + Redis，最小
      # AlertRule/Org 表。两条 active 规则 + 一条 paused 规则，对账后每条 active
      # 规则恰有一个 evaluate-<ruleId> repeatable、paused 规则没有；checkIntervalSec
      # 下限 60 秒；重复对账幂等。
      - name: MySQL/Redis alert rule schedule reconcile integration tests
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/alertworker/ -run 'TestAlertReconcileIntegration' -v

      # 五个实时 namespace 与分类质检告警调度：最小 Socket.IO 客户端在一条
      # Engine.IO 连接上连接 5 个 namespace（connected 载荷/sid 独立/权限拒绝先
      # error 后断）、newsnow 的 Socket.IO Redis adapter msgpack 广播按房间投递、
      # 态势事件桥的按用户载荷补充、BullMQ 事件双实例恰好一次（B1）、身份复核
      # 断开（B2），以及调度 tick gate/组织锁/并发度/摘要参数。
      - name: Realtime Socket.IO and classification alert integration tests (MySQL/Redis/Mongo)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/realtimeintegration/ -run 'TestRealtime' -v

      # Frontier 节点执行（processQueuedNode 及其调用链，Go-批 candidate 实现）：
      # 真实 MySQL/Redis/Mongo 覆盖 layered 节点（结果写入 + 子节点物化 + BullMQ
      # 原始任务结构 + 工作流事件/步骤 + refreshRunStatus）、native 根节点分支、
      # run 已取消、不可重试失败（节点 failed、run lastError、错误文本契约）、
      # crawl4ai 503（errors.As 取 *crawl4ai.Error.Status）、hot 降级 normal，
      # 以及 B1（同一 run 两个节点并发完成时元数据补丁都保留）。crawl4ai 由本进程
      # httptest 提供；种子发现分支的集成用例把站点配置固定为 frontier_only，只断言
      # seed_branch_skipped，不访问外部站点（crawlmetadata 没有可注入的 transport，
      # sitemap 抓取本身未在本步骤覆盖）。不连接真实 crawl4ai，也没有用生产数据比对
      # 结果；本包只交付库，不消费队列、不新增开关。
      - name: MySQL/Redis/Mongo Frontier node execution integration tests
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/crawlfrontiernode/ -run 'TestFrontierNode' -v -timeout 10m

      # CRAWL-WORKER：三个爬取队列（crawl4ai / crawl4ai-hot / crawl4ai-normal）
      # 由 api-go 消费时的端到端行为（API_GO_CRAWL_WORKER_MODE=go）。crawl4ai 与
      # 媒体源都用 httptest，对象存储走 mysql provider（不需要真实 S3）；测试
      # 自行 DROP/CREATE 窄表并使用独立 Mongo 库，因此这两个 step 及其后的
      # crawlexecution step 放在共享 schema 的最后：本批整合在它们之后追加的
      # 态势刷新与 Telegram 轮询转交 step 分别使用私有 MySQL 库和只连 Redis，
      # 不依赖共享 app schema。同一 go test 命令并发跑这两个包会互删同名表，
      # 所以必须一个 step 一个包。
      # 覆盖：成功路径（CrawlTask/CrawlResult/Mongo 内容与媒体资产/TaskLog/
      # 通知行 + notification:events:v1/returnvalue/事件流 completed/
      # crawl:activity 减一）、可重试失败后成功、不可重试直接 failed、最终失败
      # lastError 截断、内存压力（三队列 limiter 键 + PX、memoryPressureRequeues
      # 写回、回到 wait、预算耗尽）、B1 两实例只扣一次、B2 并发最终失败计数 +2
      # 且熔断通知只一条、stalled 改回 queued、legacy 队列为空不启动 worker。
      - name: CRAWL-WORKER integration tests (crawl queue worker)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/crawlworker/ -run 'TestCrawlWorkerIntegration' -v

      # CRAWL-WORKER 执行路径：crawlexecution.RunQueuedTask 的 B2 并发最终失败
      # 语义（同一新闻源两路并发最终失败 → consecutiveFailures 连续 +2、熔断
      # 通知只写一条、且只发 notification:events:v1 不发 legacy 频道）。
      - name: CRAWL-WORKER integration tests (queued crawl execution)
        run: cd apps/api-go && go test -tags=integration -count=1 ./internal/crawlexecution/ -run 'TestCrawlExecutionQueuedIntegration' -v

      # 态势手动刷新（POST /api/situation-monitor/refresh）：真实 MySQL/Redis 覆盖活跃
      # 新闻源重排（nextRunAt/circuitOpenUntil/consecutiveFailures）与 CrawlTask/
      # PipelineJob 计数、刷新记录写入（900 秒 TTL）与 GET refresh-runs 读取、
      # terminal 状态机（pending → completed）、B1 调度锁被占用时的「正忙」分支
      # （占用 lock:cron:news-source-scheduler 后由真实 newssourcescheduler 抢同一把
      # 锁）、无 crawl.write 与无活跃新闻源分支，以及缓存前缀清理（Q2 跨组织洞察键、
      # Q3 externalCleared 恒 0）。Telegram/OREF 用 fixture 写缓存文档，无 MTProto
      # 连接、无外网请求；真实调度派发由 newssourcescheduler 自己的集成步骤覆盖。
      - name: MySQL/Redis integration tests (situation monitor manual refresh)
        run: cd apps/api-go && go test -tags=integration -count=1 -timeout 5m ./internal/situationsignals/ -run 'TestSituationRefreshIntegration' -v
        env:
          API_GO_TEST_REDIS_ADDR: 127.0.0.1:6379

      # B2：真实 Redis 覆盖 Telegram 轮询转交。两个 worker 实例共用一把 Redis 租约：
      # 队列任务落到非持有方时由持有方执行并在 telegram-poll-done 键留下 120 秒结果，
      # 刷新接口在非持有方时阻塞到持有方完成（BLPOP），持有方退出且租约释放后由当前
      # 实例自行轮询。Telegram 客户端全部 fake（不拨号），无 OREF 请求。
      - name: Redis integration tests (situation monitor Telegram poll handover)
        run: cd apps/api-go && go test -tags=integration -count=1 -timeout 5m ./internal/situationsignalsworker/ -run 'TestTelegramPollHandoverIntegration' -v
        env:
          API_GO_TEST_REDIS_ADDR: 127.0.0.1:6379

  # api-go Go module 依赖清单（go.mod/go.sum）的按需远端再生成。
  #
  # 背景：本仓库约束「生成器不在本机执行」——go.sum 是 go 工具链从
  # module proxy 校验和生成的产物（本机禁跑 go 工具链），只能远端生成
  # 后作为 tracked file 提交。api-go 自 Go-批2A 起引入第三方依赖
  # （go-sql-driver/mysql）；后续迁移批次继续新增依赖时复用同一通道。
  #
  # 触发边界：仅 PR 带 go-modules-regen label 时运行（维护者在有意变更
  # 依赖时添加）；与 contract-regen 同一模式：检出 PR head → go mod
  # tidy → 空跑构建确认清单可用 → 有差异则 bot 提交回 PR 分支。
  # 再生成完成后必须移除 label——平时 verify 的模块文件漂移门禁保持
  # fail-on-drift 语义。
  go-modules-regen:
    if: contains(github.event.pull_request.labels.*.name, 'go-modules-regen')
    runs-on: [self-hosted, linux, build-server]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache: false

      - name: Regenerate api-go module files
        run: |
          cd apps/api-go
          go mod tidy
          # 生成后空跑一次构建，确保清单与当前代码一致可用。
          go build ./...

      - name: Commit regenerated module files (if changed)
        run: |
          git config user.name "go-modules-regen[bot]"
          git config user.email "actions@github.com"
          # git status --porcelain 同时覆盖 tracked 修改与未跟踪文件
          # （仅 git diff 发现不了未跟踪的 go.sum）。
          if [ -z "$(git status --porcelain -- apps/api-go/go.mod apps/api-go/go.sum)" ]; then
            echo "module files already in sync — nothing to commit"
            exit 0
          fi
          git add apps/api-go/go.mod apps/api-go/go.sum
          git commit -m "🔧 chore(api-go): 远端再生成 Go module 依赖清单（go.mod/go.sum）"
          git push origin HEAD:${{ github.head_ref }}
          echo "committed regenerated module files"

      - name: Remind to remove the label
        run: |
          echo "::notice::go.mod/go.sum 已远端生成并提交。请从 PR 移除 go-modules-regen label，恢复漂移门禁语义。"

  # 契约基线一次性远端再生成（专用远端生成提交方案）。
  #
  # 背景：本仓库约束「生成器不在本机执行」——生成物（OpenAPI 快照 /
  # 鉴权矩阵 / GraphQL SDL）的更新必须走远端。本 job 仅在 PR 带有
  # contract-regen label 时运行：检出 PR head → 运行三个生成器 →
  # 有差异则提交回 PR 分支（触发新一轮完整 CI）。
  #
  # ⚠️ 该 label 等价于「跳过漂移门禁一次」——只应由维护者在有意变更
  # 契约语义时添加，再生成完成后必须移除。平时 verify job 的三个
  # drift gate 保持 fail-on-drift 语义不变。
  contract-baseline-regen:
    if: contains(github.event.pull_request.labels.*.name, 'contract-regen')
    runs-on: [self-hosted, linux, build-server]
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HUSKY: "0"
      CI: "true"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate

      - name: Regenerate contract artifacts
        run: |
          pnpm --filter @modular/api run contract:openapi:snapshot
          pnpm --filter @modular/api run contract:auth-matrix:generate
          pnpm --filter @modular/api run generate:schema

      - name: Commit regenerated artifacts (if changed)
        run: |
          git config user.name "contract-regen[bot]"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "contract artifacts already in sync — nothing to commit"
            exit 0
          fi
          git add apps/api/tests/contract apps/api/schema.gql
          git commit -m "🔧 chore(contract): 远端再生成契约基线（OpenAPI 快照/鉴权矩阵/GraphQL SDL）"
          git push origin HEAD:${{ github.head_ref }}
          echo "committed regenerated artifacts"

      - name: Remind to remove the label
        run: |
          echo "::notice::契约基线已再生成并提交。请从 PR 移除 contract-regen label，恢复漂移门禁语义。"
