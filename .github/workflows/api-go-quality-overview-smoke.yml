# 管理端质量面板 5 条 GET 的真实栈验收。不进普通 CI。
# PR 上加 label api-go-quality-overview-smoke，或 workflow_dispatch。
# SCHEDULE_ENABLED 保持 false。不请求 crawl4ai；不把抓取、模型、
# AkShare 或 Nominatim 当通过。
name: api-go-quality-overview-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-quality-overview-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-quality-overview-smoke@example.com
  SMTP_PASS: api-go-quality-overview-smoke-smtp-not-connected
  JWT_SECRET: c1f4a9e8d2b3706f5a1c8e9d4b2a7f6038e5d1c9a7b6f4e2d3c8a1b5f9e0d7c2
  NEXTAUTH_SECRET: e2b5c1f8a9d3b47e60d4a1f8c3b5e79d02c1f4a9e8d2b3706f5a1c8e9d4b2a7f6
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  SEED_ORG_SLUG: api-go-quality-overview-smoke-org
  SEED_ORG_NAME: api-go Quality Overview Smoke Org
  SEED_ADMIN_EMAIL: api-go-quality-overview-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: ApiGoQuality#2026-Ci
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-quality-overview-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-quality-overview-smoke')
    runs-on: [self-hosted, linux, build-server]
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-quality:ci .
      - name: Exercise quality overview routes
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib, json, os, signal, subprocess, time, urllib.error, urllib.request

          nest = "http://127.0.0.1:4000"
          go = "http://127.0.0.1:4020"

          org_a = "quality-smoke-org-a-0001"
          org_b = "quality-smoke-org-b-0001"
          user_a = "quality-smoke-user-a-0001"
          user_b = "quality-smoke-user-b-0001"
          user_denied = "quality-smoke-user-denied-0001"
          machine_token = "mtk_quality_smoke_0000000000000001"

          news = "/api/admin/quality/news-sources"
          pipeline = "/api/admin/quality/pipeline"
          overview = "/api/admin/quality/overview"
          task_logs = "/api/admin/quality/task-logs"
          task_logs_summary = "/api/admin/quality/task-logs/summary"
          all_paths = [news, pipeline, overview, task_logs, task_logs_summary]
          # 跨组织标记：另一组织的数据不得出现在本组织的任一响应里。
          foreign_markers = ["quality-beta-source", "quality-beta-log", "beta-job-1"]
          org_a_markers = ["quality-alpha-source", "alpha-job-1"]
          overview_cache_key = "quality:task-logs:overview:" + org_a + ":60:10"
          overview_cache_key_b = "quality:task-logs:overview:" + org_b + ":60:10"

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def container_id(ancestor):
              return subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=" + ancestor], text=True).split()[0]

          def sql(statement):
              cid = container_id("mysql:8.4")
              proc = subprocess.run(["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "app"],
                                    input=statement, text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(proc.stderr or proc.stdout)
              return proc.stdout.strip()

          def scalar(statement):
              lines = [line.strip() for line in sql(statement).splitlines() if line.strip()]
              return lines[-1] if lines else ""

          def redis(*args):
              cid = container_id("redis:7.2")
              return subprocess.run(["docker", "exec", cid, "redis-cli", *args],
                                    text=True, capture_output=True).stdout.strip()

          def mongo_seed(script):
              cid = container_id("mongo:7.0")
              with open("/tmp/quality-overview-seed.js", "w") as handle:
                  handle.write(script)
              subprocess.check_call(["docker", "cp", "/tmp/quality-overview-seed.js", cid + ":/tmp/seed.js"])
              proc = subprocess.run(["docker", "exec", cid, "mongosh", "--quiet", "app", "--file", "/tmp/seed.js"],
                                    text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(proc.stderr or proc.stdout)
              return proc.stdout

          def start_go(mode):
              subprocess.run(["docker", "rm", "-f", "api-go-quality"], check=False, capture_output=True)
              env = [
                  "PORT=4020",
                  "LEGACY_API_URL=http://host.docker.internal:4000",
                  "DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app",
                  "MONGO_URI=mongodb://host.docker.internal:27017/app",
                  f"API_GO_QUALITY_OVERVIEW_MODE={mode}",
                  "API_GO_ADMIN_LOGS_MODE=legacy",
                  "API_GO_LLM_LOGS_MODE=legacy",
                  "API_GO_CRAWL_PROFILES_MODE=legacy",
                  "API_GO_CRAWL_TEMPLATES_MODE=legacy",
                  "API_GO_CRAWL_WORKFLOWS_MODE=legacy",
                  "API_GO_NEWS_SOURCES_MODE=legacy",
                  "API_GO_RBAC_MODE=legacy",
                  "API_GO_SITUATION_MONITORS_MODE=legacy",
                  "API_GO_CONTENT_SUBSCRIPTIONS_MODE=legacy",
                  "API_GO_USER_NEWS_BEHAVIOR_MODE=legacy",
                  "API_GO_USER_DIGEST_MODE=legacy",
                  "API_GO_DASHBOARD_STATS_MODE=legacy",
                  "API_GO_DASHBOARD_CHARTS_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_GEO_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE=legacy",
                  "API_GO_DASHBOARD_STREAM_MODE=legacy",
                  "API_GO_HEALTHZ_MODE=legacy",
                  "API_GO_PUBLIC_PORTAL_MODE=legacy",
                  "API_GO_ANALYSIS_VIEWS_MODE=legacy",
                  "API_GO_ANALYSIS_BOARDS_MODE=legacy",
                  "API_GO_ANALYSIS_THREADS_MODE=legacy",
                  "API_GO_GRAPHQL_READ_MODE=legacy",
                  "API_GO_GRAPHQL_NEWS_EVENTS_MODE=legacy",
                  "API_GO_USER_SETTINGS_WRITE_MODE=legacy",
                  "REALTIME_SIGNALS_ENABLED=false",
                  "ELASTICSEARCH_ENABLED=false",
                  "MODEL_SERVICE_ENABLED=false",
                  "SCHEDULE_ENABLED=false",
                  f"JWT_SECRET={os.environ['JWT_SECRET']}",
                  f"JWT_ISSUER={os.environ['JWT_ISSUER']}",
                  f"JWT_AUDIENCE={os.environ['JWT_AUDIENCE']}",
                  "REDIS_HOST=host.docker.internal",
                  "REDIS_PORT=6379",
                  "CANARY_PERCENT=0",
                  f"CORS_ORIGIN={os.environ['CORS_ORIGIN']}",
              ]
              cmd = ["docker", "run", "-d", "--name", "api-go-quality",
                     "--add-host=host.docker.internal:host-gateway",
                     "--health-interval", "5s", "--health-timeout", "3s", "--health-retries", "20", "--health-start-period", "5s",
                     "-p", "127.0.0.1:4020:4020"]
              for item in env:
                  cmd.extend(["-e", item])
              cmd.append("api-go-quality:ci")
              subprocess.check_call(cmd)
              for _ in range(30):
                  status = subprocess.check_output(["docker", "inspect", "--format", "{{.State.Health.Status}}",
                                                    "api-go-quality"], text=True).strip()
                  print("health", status, "mode", mode)
                  if status == "healthy":
                      return
                  if status == "unhealthy":
                      fail(subprocess.check_output(["docker", "logs", "api-go-quality"], text=True)[-4000:])
                  time.sleep(2)
              fail(subprocess.check_output(["docker", "logs", "api-go-quality"], text=True)[-4000:])

          def call(base_url, path, method="GET", token=None, payload=None, timeout=30):
              headers = {}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(base_url + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          def body(raw):
              if not raw:
                  return None
              text = raw.decode("utf-8", "replace").strip()
              if not text:
                  return None
              return json.loads(text)

          def message(raw):
              doc = body(raw) or {}
              text = doc.get("message")
              if isinstance(text, list):
                  return "; ".join(str(item) for item in text)
              return text

          def login(email):
              status, raw = call(nest, "/api/auth/login", "POST",
                                 payload={"email": email, "password": os.environ["SEED_ADMIN_PASSWORD"]})
              doc = body(raw)
              if status not in (200, 201) or not doc or not doc.get("accessToken"):
                  fail(f"login {email} {status} {raw[:400]!r}")
              return doc["accessToken"]

          def ok(path, token=None):
              status, raw = call(go, path, "GET", token)
              if status != 200:
                  fail(f"GET {path} {status} {raw[:400]!r}")
              return body(raw)

          def compare(path, token, ignore_generated=False):
              left_status, left_raw = call(nest, path, "GET", token)
              right_status, right_raw = call(go, path, "GET", token)
              if left_status != right_status:
                  fail(f"parity status {path} nest={left_status} go={right_status}")
              left, right = body(left_raw), body(right_raw)
              if ignore_generated and isinstance(left, dict) and isinstance(right, dict):
                  left = {k: v for k, v in left.items() if k != "generatedAt"}
                  right = {k: v for k, v in right.items() if k != "generatedAt"}
              if left != right:
                  fail(f"parity body {path} nest={left_raw[:700]!r} go={right_raw[:700]!r}")
              return left

          def flush_quality():
              sql(f"DELETE FROM ObservabilitySnapshot WHERE orgId IN ('{org_a}', '{org_b}')")
              redis("DEL", overview_cache_key, overview_cache_key_b)

          def compare_fresh(path, token, ignore_generated=False):
              # Go 先算（写快照/缓存），flush 后再让 Nest 独立算，再比对两次独立结果。
              flush_quality()
              go_status, go_raw = call(go, path, "GET", token)
              flush_quality()
              nest_status, nest_raw = call(nest, path, "GET", token)
              if go_status != 200 or nest_status != 200:
                  fail(f"fresh parity status {path} go={go_status} nest={nest_status} {go_raw[:400]!r} {nest_raw[:400]!r}")
              left, right = body(nest_raw), body(go_raw)
              if ignore_generated and isinstance(left, dict) and isinstance(right, dict):
                  left = {k: v for k, v in left.items() if k != "generatedAt"}
                  right = {k: v for k, v in right.items() if k != "generatedAt"}
              if left != right:
                  fail(f"fresh parity body {path} nest={nest_raw[:700]!r} go={go_raw[:700]!r}")
              return right

          def assert_no_foreign(label, payload):
              text = json.dumps(payload, ensure_ascii=False)
              for marker in foreign_markers:
                  if marker in text:
                      fail(f"{label} leaked another org: {marker} in {text[:400]!r}")

          def assert_redacted(label, payload):
              text = json.dumps(payload, ensure_ascii=False)
              if "Bearer [REDACTED]" not in text:
                  fail(f"{label} missing Bearer [REDACTED]: {text[:600]!r}")
              for secret in ["secret.jwt.token"]:
                  if secret in text:
                      fail(f"{label} leaked {secret}: {text[:600]!r}")

          # ---- 准备数据：本组织 + 另一组织的 MySQL / Mongo 测试数据 ----
          admin = scalar("SELECT id FROM User WHERE email='api-go-quality-overview-smoke-admin@example.com'")
          settings_perm = scalar("SELECT id FROM Permission WHERE name='settings.manage'")
          other_perm = scalar("SELECT id FROM Permission WHERE name='crawl.read'")
          if not admin or not settings_perm or not other_perm:
              fail(f"missing seed rows admin={admin} settings={settings_perm} other={other_perm}")
          machine_hash = hashlib.sha256(machine_token.encode()).hexdigest()

          sql(f"""
          INSERT INTO Org (id, name, slug, isActive, createdAt, updatedAt) VALUES
            ('{org_a}', 'Quality Org A', 'quality-smoke-org-a', 1, NOW(3), NOW(3)),
            ('{org_b}', 'Quality Org B', 'quality-smoke-org-b', 1, NOW(3), NOW(3));
          INSERT INTO Role (id, name, isSystem, orgId) VALUES
            ('quality-role-a-0001', 'quality-a', 0, '{org_a}'),
            ('quality-role-b-0001', 'quality-b', 0, '{org_b}'),
            ('quality-role-d-0001', 'quality-d', 0, '{org_a}');
          INSERT INTO RolePermission (id, roleId, permissionId) VALUES
            ('quality-rp-a-0001', 'quality-role-a-0001', '{settings_perm}'),
            ('quality-rp-b-0001', 'quality-role-b-0001', '{settings_perm}'),
            ('quality-rp-d-0001', 'quality-role-d-0001', '{other_perm}');
          INSERT INTO NewsSource (id, orgId, name, url, siteType, frequencySeconds, priority, isActive, consecutiveFailures, circuitOpenUntil, lastFailureAt, nextRunAt, createdAt, updatedAt) VALUES
            ('quality-source-a-1', '{org_a}', 'quality-alpha-source', 'https://alpha.example.com/rss', 'general', 3600, 0, 1, 2, DATE_ADD(NOW(3), INTERVAL 1 HOUR), DATE_SUB(NOW(3), INTERVAL 10 MINUTE), DATE_ADD(NOW(3), INTERVAL 30 MINUTE), NOW(3), NOW(3)),
            ('quality-source-a-2', '{org_a}', 'quality-alpha-idle', 'https://alpha-idle.example.com/rss', 'general', 3600, 0, 0, 0, NULL, NULL, NULL, NOW(3), NOW(3)),
            ('quality-source-b-1', '{org_b}', 'quality-beta-source', 'https://beta.example.com/rss', 'general', 3600, 0, 1, 0, NULL, NULL, NULL, NOW(3), NOW(3));
          INSERT INTO PipelineJob (id, orgId, sourceId, url, status, queueName, attempts, createdAt, updatedAt) VALUES
            ('quality-job-a-1', '{org_a}', 'quality-source-a-1', 'https://alpha.example.com/1', 'failed', 'crawl-queue', 0, DATE_SUB(NOW(3), INTERVAL 5 MINUTE), NOW(3)),
            ('quality-job-a-2', '{org_a}', 'quality-source-a-1', 'https://alpha.example.com/2', 'failed', 'crawl-queue', 0, DATE_SUB(NOW(3), INTERVAL 4 MINUTE), NOW(3)),
            ('quality-job-a-3', '{org_a}', 'quality-source-a-2', 'https://alpha-idle.example.com/1', 'completed', 'crawl-queue', 0, DATE_SUB(NOW(3), INTERVAL 3 MINUTE), NOW(3)),
            ('quality-job-b-1', '{org_b}', 'quality-source-b-1', 'https://beta.example.com/1', 'failed', 'crawl-queue', 0, DATE_SUB(NOW(3), INTERVAL 2 MINUTE), NOW(3));
          INSERT INTO MongoOutbox (id, orgId, type, payload, status, attempts, availableAt, lockedAt, createdAt, updatedAt) VALUES
            ('quality-outbox-a-pending', '{org_a}', 'processed_item', '{{"alpha": true}}', 'pending', 0, NOW(3), NULL, DATE_SUB(NOW(3), INTERVAL 1212 SECOND), NOW(3)),
            ('quality-outbox-a-processing', '{org_a}', 'processed_item', '{{"alpha": true}}', 'processing', 1, NOW(3), DATE_SUB(NOW(3), INTERVAL 10 MINUTE), DATE_SUB(NOW(3), INTERVAL 9 MINUTE), NOW(3)),
            ('quality-outbox-a-failed', '{org_a}', 'processed_item', '{{"alpha": true}}', 'failed', 2, NOW(3), NULL, DATE_SUB(NOW(3), INTERVAL 8 MINUTE), NOW(3)),
            ('quality-outbox-b-pending', '{org_b}', 'processed_item', '{{"beta": true}}', 'pending', 0, NOW(3), NULL, DATE_SUB(NOW(3), INTERVAL 7 MINUTE), NOW(3));
          INSERT INTO MachineAccessToken (id, orgId, name, tokenHash, permissions, lastUsedAt, expiresAt, revokedAt, createdAt, updatedAt)
          VALUES ('quality-mtok-0001', '{org_a}', 'smoke', '{machine_hash}', '["settings.manage"]', NULL, NULL, NULL, NOW(3), NOW(3));
          """)
          users = [
              (user_a, "quality-a@example.com", org_a, "quality-role-a-0001"),
              (user_b, "quality-b@example.com", org_b, "quality-role-b-0001"),
              (user_denied, "quality-denied@example.com", org_a, "quality-role-d-0001"),
          ]
          for user_id, email, user_org, role_id in users:
              sql(f"""
              INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
              SELECT '{user_id}', '{email}', passwordHash, 'Smoke', 'User', 1, NOW(3), NOW(3), NOW(3)
              FROM User WHERE id = '{admin}';
              INSERT INTO Membership (id, userId, orgId, roleId, isActive, createdAt)
              VALUES ('m{user_id}', '{user_id}', '{user_org}', '{role_id}', 1, NOW(3));
              """)

          mongo_seed("""
          db.processeditems.insertMany([
            { orgId: "quality-smoke-org-a-0001", status: "completed", llm: { model: "gpt-smoke", latencyMs: 1200, costUsd: 0.0123, totalTokens: 345 },
              ingestedAt: new Date(Date.now() - 300000), createdAt: new Date(Date.now() - 200000), updatedAt: new Date() },
            { orgId: "quality-smoke-org-a-0001", status: "failed", createdAt: new Date(Date.now() - 100000), updatedAt: new Date() },
            { orgId: "quality-smoke-org-a-0001", status: "pending", createdAt: new Date(Date.now() - 90000), updatedAt: new Date() },
            { orgId: "quality-smoke-org-b-0001", status: "completed", llm: { model: "beta-model", latencyMs: 50 },
              ingestedAt: new Date(Date.now() - 300000), createdAt: new Date(Date.now() - 200000), updatedAt: new Date() }
          ]);
          db.tasklogs.insertMany([
            { _id: "quality-alpha-task-1", queue: "itemPipeline", jobId: "alpha-job-1", orgId: "quality-smoke-org-a-0001",
              stage: "llm", status: "failed", message: "alpha pipeline Bearer secret.jwt.token",
              error: { name: "Bearer secret.jwt.token", message: "alpha pipeline failed" },
              createdAt: new Date(Date.now() - 50000), updatedAt: new Date() },
            { _id: "quality-alpha-task-2", queue: "itemPipeline", jobId: "alpha-job-2", orgId: "quality-smoke-org-a-0001",
              stage: "llm", status: "completed", message: "alpha ok",
              createdAt: new Date(Date.now() - 40000), updatedAt: new Date() },
            { _id: "quality-beta-task-1", queue: "itemPipeline", jobId: "beta-job-1", orgId: "quality-smoke-org-b-0001",
              stage: "llm", status: "failed", message: "quality-beta-log", error: { name: "BetaError" },
              createdAt: new Date(Date.now() - 30000), updatedAt: new Date() }
          ]);
          """)

          tokens = {email: login(email) for _, email, _, _ in users}
          token_a = tokens["quality-a@example.com"]
          token_b = tokens["quality-b@example.com"]
          token_denied = tokens["quality-denied@example.com"]

          # ---- 阶段 1：开关 legacy，5 条经 Go 代理与 Nest 直连一致 ----
          start_go("legacy")
          parity_paths = [
              news,
              f"{news}?windowHours=12",
              f"{news}?windowHours=bad",
              pipeline,
              f"{pipeline}?windowMinutes=15",
              overview,
              f"{overview}?windowMinutes=30",
              task_logs,
              f"{task_logs}?status=failed&limit=10",
              f"{task_logs}?status=invalid_status&limit=10",
              f"{task_logs}?queue=itemPipeline&sinceMinutes=120",
              task_logs_summary,
              f"{task_logs_summary}?sinceMinutes=120",
          ]
          for path in parity_paths:
              payload = compare(path, token_a, ignore_generated=path.startswith(overview))
              assert_no_foreign("legacy " + path, payload)
          # legacy 下非法参数宽松回退：status 非法仍是 200 数组。
          legacy_unknown = compare(f"{task_logs}?status=invalid_status&limit=10", token_a)
          if not isinstance(legacy_unknown, list):
              fail(f"legacy status=invalid_status should return an array: {legacy_unknown!r}")
          print("legacy proxy ok")

          # ---- 阶段 2：开关 go（Nest 仍在运行）----
          start_go("go")

          # 每条都让 Go 先算、flush 后 Nest 独立算，再比对（overview 忽略 generatedAt）。
          fresh_paths = [
              news,
              f"{news}?windowHours=12",
              pipeline,
              f"{pipeline}?windowMinutes=15",
              overview,
              f"{overview}?windowMinutes=30",
              task_logs,
              f"{task_logs}?status=failed&limit=10",
              f"{task_logs}?status=invalid_status&limit=10",
              f"{task_logs}?queue=itemPipeline&sinceMinutes=120",
              task_logs_summary,
              f"{task_logs_summary}?sinceMinutes=120",
          ]
          for path in fresh_paths:
              payload = compare_fresh(path, token_a, ignore_generated=path.startswith(overview))
              assert_no_foreign("go " + path, payload)

          # 2. failureTypes.errorName 在 Nest 与 Go 两侧都脱敏。
          for label, base in (("go", go), ("nest", nest)):
              flush_quality()
              status, raw = call(base, pipeline, "GET", token_a)
              if status != 200:
                  fail(f"{label} pipeline {status} {raw[:300]!r}")
              assert_redacted(f"{label} pipeline failureTypes", body(raw))
          flush_quality()
          go_overview = ok(overview, token_a)
          assert_redacted("go overview failureTypes", go_overview)
          flush_quality()
          nest_overview_raw = call(nest, overview, "GET", token_a)[1]
          assert_redacted("nest overview failureTypes", body(nest_overview_raw))

          # 3. windowHours=12 → MySQL ObservabilitySnapshot 落 scope/variantKey。
          flush_quality()
          window12 = ok(f"{news}?windowHours=12", token_a)
          if window12.get("windowHours") != 12:
              fail(f"windowHours=12 payload: {window12!r}")
          snapshot_row = scalar(
              f"SELECT COUNT(*) FROM ObservabilitySnapshot WHERE orgId='{org_a}' "
              f"AND scope='quality_news_sources' AND variantKey='windowHours:12'")
          if snapshot_row != "1":
              fail(f"ObservabilitySnapshot row for windowHours:12 = {snapshot_row!r}")
          snapshot_expired = scalar(
              f"SELECT COUNT(*) FROM ObservabilitySnapshot WHERE orgId='{org_a}' "
              f"AND scope='quality_news_sources' AND variantKey='windowHours:12' AND expiresAt > NOW(3)")
          if snapshot_expired != "1":
              fail(f"ObservabilitySnapshot windowHours:12 not fresh: {snapshot_expired!r}")

          # 4. 非法 status + limit 是 200 数组，不是 400。
          status, raw = call(go, f"{task_logs}?status=invalid_status&limit=10", "GET", token_a)
          if status != 200 or not isinstance(body(raw), list):
              fail(f"status=invalid_status {status} {raw[:300]!r}")

          # 6. 没有 settings.manage 的用户 403；有效机器令牌 200。
          for path in all_paths:
              status, _ = call(go, path, "GET", token_denied)
              if status != 403:
                  fail(f"{path} without settings.manage = {status}, want 403")
              status, raw = call(go, path, "GET", machine_token)
              if status != 200:
                  fail(f"{path} machine token = {status} {raw[:300]!r}")
          status, _ = call(go, news, "GET", None)
          if status != 401:
              fail(f"missing token = {status}, want 401")

          # 5. 另一组织只看到自己的数据；本组织看不到它的。
          for path in all_paths:
              payload_b = ok(path, token_b)
              text = json.dumps(payload_b, ensure_ascii=False)
              for marker in org_a_markers:
                  if marker in text:
                      fail(f"org B leaked org A rows: {path} {marker} {text[:400]!r}")
          beta_news = ok(news, token_b)
          if "quality-beta-source" not in json.dumps(beta_news, ensure_ascii=False):
              fail(f"org B cannot see its own source: {beta_news!r}")
          beta_logs = ok(f"{task_logs}?status=failed", token_b)
          if "quality-beta-log" not in json.dumps(beta_logs, ensure_ascii=False):
              fail(f"org B cannot see its own task log: {beta_logs!r}")

          # 窗口与总览子对象的参数语义。
          if ok(news, token_a).get("windowHours") != 24:
              fail(f"default windowHours: {ok(news, token_a)!r}")
          if ok(f"{news}?windowHours=bad", token_a).get("windowHours") != 24:
              fail("windowHours=bad should fall back to 24")
          if ok(pipeline, token_a).get("windowMinutes") != 60:
              fail("default windowMinutes should be 60")
          ov = ok(f"{overview}?windowMinutes=30", token_a)
          if ov.get("pipeline", {}).get("windowMinutes") != 30 or ov.get("newsSources", {}).get("windowHours") != 24:
              fail(f"overview window semantics: {ov!r}")
          if not isinstance(ov.get("taskLogs", {}).get("items"), list):
              fail(f"overview taskLogs.items should be a list: {ov!r}")
          print("go switch ok")

          # ---- 阶段 3：停止 Nest；5 条仍 200，未迁路径是 502 ----
          alive = token_a
          if os.path.exists("/tmp/api-nestjs.pid"):
              os.kill(int(open("/tmp/api-nestjs.pid").read().strip()), signal.SIGTERM)
          subprocess.run(["pkill", "-f", "apps/api/dist/main.js"], check=False)
          subprocess.run(["pkill", "-f", "node dist/main.js"], check=False)
          stopped = False
          for _ in range(30):
              try:
                  urllib.request.urlopen(nest + "/api/healthz/live", timeout=2).read()
              except Exception:
                  stopped = True
                  break
              time.sleep(1)
          if not stopped:
              fail("nestjs did not stop")

          for path in all_paths:
              status, raw = call(go, path, "GET", alive)
              if status != 200:
                  fail(f"after nest stop {path} {status} {raw[:300]!r}")
          for path in ("/api/admin/quality/pipeline/runs", "/api/admin/quality/classification/summary"):
              status, raw = call(go, path, "GET", alive)
              if status != 502 or (body(raw) or {}).get("statusCode") != 502:
                  fail(f"{path} after nest stop {status} {raw[:300]!r}")
          print("quality overview takeover verified: legacy parity, snapshot reuse, redaction, lenient params, org isolation, machine token, nest stop")
          PY
