          concurrent_pair(lambda: call(go, keys_path + "/key/" + sha256_hex("sk-a"), "DELETE", platform_token),
                          lambda: call(go, keys_path, "POST", platform_token, {"keys": ["sk-c"]}),
                          lambda: None, "DELETE+POST (go)", expected=(200, 201))
