          status, raw = call(go, keys_path, "POST", platform_token, {"keys": ["sk-extra-1", "sk-extra-2"]})
          if status != 400 or message(raw) != "Too many OpenAI API keys (max 100)":
              fail(f"append overflow: {status} {message(raw)!r}")
          if scalar(f"SELECT JSON_LENGTH(JSON_EXTRACT(value, '$.openaiApiKeys')) FROM SystemSetting WHERE `key`='{keys_key}'") != "99":
              fail("a rejected append must not modify the stored list")
          print("keys business ceiling ok: 99 + 2 -> 400 and the stored list is unchanged")

          # MA2：确定性旧缓存。
