          # ---- 真实跨进程并发：并发追加取并集，并发删除都生效，删 A 与加 C ----
          def concurrent_pair(first, second, verify, label, expected=(200, 200)):
              results = {}
              barrier = threading.Barrier(2)

              def worker(index, action):
                  try:
                      barrier.wait(timeout=15)
                      results[index] = action()
                  except Exception as exc:  # noqa: BLE001
                      results[index] = (0, repr(exc).encode())

              threads = [threading.Thread(target=worker, args=(0, first)),
                         threading.Thread(target=worker, args=(1, second))]
              for thread in threads:
                  thread.start()
              for thread in threads:
                  thread.join()
              statuses = sorted(status for status, _ in results.values())
              if statuses != sorted(expected):
                  fail(f"{label}: statuses {statuses} {[raw[:200] for _, raw in results.values()]}, "
                       f"want {sorted(expected)}")
              verify()
              print("concurrency ok:", label)

          def reset_keys_two():
              delete_setting(keys_key)
              keys_seed_two()

          reset_keys_two()
          concurrent_pair(lambda: call(go, keys_path, "POST", platform_token, {"keys": ["sk-c"]}),
                          lambda: call(go, keys_path, "POST", platform_token, {"keys": ["sk-d"]}),
                          lambda: None, "POST+POST (go)", expected=(201, 201))
          if sorted(internal_keys() or []) != ["sk-a", "sk-b", "sk-c", "sk-d"]:
              fail(f"concurrent appends lost a key: {internal_keys()!r}")
          print("concurrency ok: two appends produce the union")

          reset_keys_two()
          concurrent_pair(lambda: call(go, keys_path + "/key/" + sha256_hex("sk-a"), "DELETE", platform_token),
                          lambda: call(go, keys_path + "/key/" + sha256_hex("sk-b"), "DELETE", platform_token),
                          lambda: None, "DELETE+DELETE (go)")
