          # ---- 锁协议：外部持有同一把锁时写入必须等待，超时 503，释放后成功 ----
          lock_holder = subprocess.Popen(
              ["docker", "exec", "-i", container_id("mysql:8.4"), "mysql", "-uroot", "-psecret", "-N", "app"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          lock_holder.stdin.write("SELECT GET_LOCK('model-access:model-service:v1', 10);\n")
