              fail(f"nest token write: {status} {raw[:300]!r}")
          status, raw = call(go, model_path, "GET", admin_a_token)
          if (body(raw) or {}).get("hasToken") is not True or (body(raw) or {}).get("tokenSource") != "stored":
              fail(f"go cannot read the nest-written token: {raw[:300]!r}")
          status, raw = call(go, model_path, "PUT", platform_token,
                             {"enabled": False, "baseUrl": "http://model-y:9000", "internalToken": "go-written-token",
                              "timeoutMs": 1000, "maxRetries": 1})
          if status != 200:
              fail(f"go token write: {status} {raw[:300]!r}")
          status, raw = call(nest, model_path, "GET", admin_a_token)
          if (body(raw) or {}).get("hasToken") is not True or (body(raw) or {}).get("tokenSource") != "stored":
              fail(f"nest cannot read the go-written token: {raw[:300]!r}")
          go_written_token = stored_token_value()
          status, raw = call(nest, model_path, "PUT", platform_token,
                             {"enabled": False, "baseUrl": "http://model-z:9000",
                              "timeoutMs": 1000, "maxRetries": 1})
          if status != 200:
              fail(f"nest must preserve the go-written token: {status} {raw[:300]!r}")
          if stored_token_value() != go_written_token:
              fail(f"nest overwrote the go-written token: {stored_token_value()!r}")
          # Nest 写入密钥，Go 内部取钥；再反过来。
          delete_setting(keys_key)
          status, raw = call(nest, keys_path, "PUT", platform_token, {"keys": ["sk-nest-1", "sk-nest-2"]})
          if status != 200:
              fail(f"nest keys write: {status} {raw[:300]!r}")
          status, raw = call(go, internal_keys_path, "GET", headers={"authorization": "Bearer " + internal_token})
          if body(raw) != {"openaiApiKeys": ["sk-nest-1", "sk-nest-2"]}:
              fail(f"go internal read of nest keys: {raw[:300]!r}")
          delete_setting(keys_key)
          status, raw = call(go, keys_path, "PUT", platform_token, {"keys": ["sk-go-1"]})
          if status != 200:
              fail(f"go keys write: {status} {raw[:300]!r}")
          status, raw = call(nest, internal_keys_path, "GET", headers={"authorization": "Bearer " + internal_token})
          if body(raw) != {"openaiApiKeys": ["sk-go-1"]}:
              fail(f"nest internal read of go keys: {raw[:300]!r}")
          print("cross-implementation crypto interop ok (model token + keys, both directions)")

          # ---- 存量格式兼容：明文、直接加密对象、包装项、损坏项 ----
          def encrypt_go(plaintext):
              """Encrypts through the Go service by writing it and reading the row."""
              delete_setting(model_key)
              status, raw = call(go, model_path, "PUT", platform_token,
                                 {"enabled": False, "baseUrl": "http://model-e:9000", "internalToken": plaintext,
                                  "timeoutMs": 1000, "maxRetries": 1})
              if status != 200:
                  fail(f"encrypt helper: {status} {raw[:300]!r}")
              return json.loads(setting_value(model_key))["internalToken"]

          envelope = encrypt_go("legacy-encrypted")
          if not isinstance(envelope, dict) or envelope.get("__enc") != "system-settings:v1":
              fail(f"the stored token is not a v1 envelope: {envelope!r}")

          delete_setting(keys_key)
          set_setting(keys_key, json.dumps({"openaiApiKeys": [
              "sk-legacy-plain",
              envelope,
              {"fingerprint": sha256_hex("sk-wrapped"), "value": "sk-wrapped"},
              {"__enc": "system-settings:v1", "alg": "aes-256-gcm", "iv": "AAEC", "tag": "AAEC", "data": "AAEC"},
          ]}))
          redis("DEL", keys_cache)
          status, raw = call(go, keys_path, "GET", admin_a_token)
          doc = body(raw) or {}
          if doc.get("keysCount") != 4:
              fail(f"legacy keysCount: {raw[:300]!r}")
          status, raw = call(go, internal_keys_path, "GET", headers={"authorization": "Bearer " + internal_token})
          if body(raw) != {"openaiApiKeys": ["sk-legacy-plain", "legacy-encrypted", "sk-wrapped"]}:
              fail(f"legacy resolve: {raw[:300]!r}")
          print("legacy stored key shapes ok: plain, encrypted, wrapped, corrupted")

          # ---- 阶段 3：加密失败矩阵（分开的真实进程，必要时重启） ----
          def token_write(base, token, value):
              return call(base, model_path, "PUT", token,
                          {"enabled": False, "baseUrl": "http://model-enc:9000", "internalToken": value,
                           "timeoutMs": 1000, "maxRetries": 1})

          # (a) valid key + configured=false -> plaintext
          delete_setting(model_key)
          set_setting(security_key, json.dumps({"secretEncryptionEnabled": False}))
          redis("SET", security_cache, json.dumps({"exists": True, "value": {"secretEncryptionEnabled": False}}), "EX", "60")
          start_go("go")
          status, raw = token_write(go, platform_token, "plaintext-by-toggle")
          if status != 200 or stored_token_value() != "plaintext-by-toggle":
              fail(f"configured=false plaintext path: {status} {raw[:300]!r} {stored_token_value()!r}")
          print("encryption matrix ok: valid key + configured=false stores plaintext")

          # (b) valid key + no toggle -> encrypted
          delete_setting(security_key)
          delete_setting(model_key)
          start_go("go")
          status, raw = token_write(go, platform_token, "encrypted-by-default")
          stored_token = stored_token_value()
          if status != 200 or not isinstance(stored_token, dict) or stored_token.get("__enc") != "system-settings:v1":
              fail(f"valid key encryption path: {status} {raw[:300]!r} {stored_token!r}")
          print("encryption matrix ok: valid key + unset toggle encrypts")

          # (c) production + no key + unset toggle -> 400 and the row is untouched
          before = setting_value(model_key)
          start_go("go", extra_env=["SYSTEM_SETTINGS_ENCRYPTION_KEY=", "NODE_ENV=production"])
          status, raw = token_write(go, platform_token, "must-not-be-stored")
          if status != 400 or message(raw) != "SYSTEM_SETTINGS_ENCRYPTION_KEY is required to store secrets in production":
              fail(f"production without a key: {status} {raw[:300]!r}")
          if setting_value(model_key) != before:
              fail("a rejected encryption must leave the stored row unchanged")
          print("encryption matrix ok: production without a key -> 400 and no write")

          # (d) production + no key + configured=false -> still 400
          set_setting(security_key, json.dumps({"secretEncryptionEnabled": False}))
          status, raw = token_write(go, platform_token, "must-not-be-stored-either")
          if status != 400 or message(raw) != "SYSTEM_SETTINGS_ENCRYPTION_KEY is required to store secrets in production":
              fail(f"production with configured=false and no key: {status} {raw[:300]!r}")
          print("encryption matrix ok: production + toggle false without a key still fails closed")

          # (e) configured=true + no key -> the not-configured message
          set_setting(security_key, json.dumps({"secretEncryptionEnabled": True}))
          redis("DEL", security_cache)
          status, raw = token_write(go, platform_token, "must-not-be-stored-configured")
          if status != 400 or message(raw) != ("Secret encryption is enabled but "
                                              "SYSTEM_SETTINGS_ENCRYPTION_KEY is not configured"):
              fail(f"configured=true without a key: {status} {raw[:300]!r}")
          print("encryption matrix ok: configured=true without a key -> 400 not-configured")

          # (f) configured=true + invalid key -> the decode detail
          start_go("go", extra_env=["SYSTEM_SETTINGS_ENCRYPTION_KEY=not-a-valid-key"])
          status, raw = token_write(go, platform_token, "must-not-be-stored-invalid")
          want = ("Secret encryption is enabled but SYSTEM_SETTINGS_ENCRYPTION_KEY is missing or invalid "
                  "(SYSTEM_SETTINGS_ENCRYPTION_KEY must be 32 bytes (base64) or 64 hex chars)")
          if status != 400 or message(raw) != want:
              fail(f"configured=true with an invalid key: {status} {raw[:400]!r}")
          print("encryption matrix ok: configured=true with an invalid key -> 400 with the decode detail")

          # (g) non-production + no key + no toggle -> plaintext
          delete_setting(security_key)
          delete_setting(model_key)
          start_go("go", extra_env=["SYSTEM_SETTINGS_ENCRYPTION_KEY=", "NODE_ENV=development"])
          status, raw = token_write(go, platform_token, "plaintext-dev")
          if status != 200 or stored_token_value() != "plaintext-dev":
              fail(f"non-production plaintext fallback: {status} {raw[:300]!r} {stored_token_value()!r}")
          print("encryption matrix ok: non-production without a key falls back to plaintext")

          # Nest 侧同一策略的三个代表场景（需要重启 Nest 才能改变进程环境）。
          def stop_nest():
              if os.path.exists("/tmp/api-nestjs.pid"):
                  os.kill(int(open("/tmp/api-nestjs.pid").read().strip()), signal.SIGTERM)
              subprocess.run(["pkill", "-f", "apps/api/dist/main.js"], check=False)
              subprocess.run(["pkill", "-f", "node dist/main.js"], check=False)
              for _ in range(30):
                  try:
                      urllib.request.urlopen(nest + "/api/healthz/live", timeout=2).read()
                  except Exception:
                      return
                  time.sleep(1)
              fail("nestjs did not stop")

          def start_nest(node_env, encryption_key):
              env = dict(os.environ)
              env["NODE_ENV"] = node_env
              env["PORT"] = "4000"
              if encryption_key is None:
                  env.pop("SYSTEM_SETTINGS_ENCRYPTION_KEY", None)
              else:
                  env["SYSTEM_SETTINGS_ENCRYPTION_KEY"] = encryption_key
              log = open("/tmp/api-nestjs.log", "w")
              proc = subprocess.Popen(["pnpm", "--filter", "@modular/api", "run", "start"],
                                      env=env, stdout=log, stderr=subprocess.STDOUT)
              open("/tmp/api-nestjs.pid", "w").write(str(proc.pid))
              for _ in range(90):
                  try:
                      urllib.request.urlopen(nest + "/api/healthz/live", timeout=2).read()
                      return
                  except Exception:
                      time.sleep(2)
              fail("nestjs did not become healthy")

          # Nest：生产 + 无 key -> 400（原始文案）。
          delete_setting(security_key)
          delete_setting(model_key)
          stop_nest()
          start_nest("production", None)
          backend_token = login(email_platform)
          status, raw = token_write(nest, backend_token, "nest-must-not-store")
          if status != 400 or message(raw) != "SYSTEM_SETTINGS_ENCRYPTION_KEY is required to store secrets in production":
              fail(f"nest production without a key: {status} {raw[:300]!r}")
          print("nest encryption policy ok: production without a key -> 400")

          # Nest：生产 + 无 key + configured=false -> 仍然 400。
          set_setting(security_key, json.dumps({"secretEncryptionEnabled": False}))
          redis("DEL", security_cache)
          status, raw = token_write(nest, backend_token, "nest-must-not-store-either")
          if status != 400:
              fail(f"nest production with configured=false and no key: {status} {raw[:300]!r}")
          print("nest encryption policy ok: production + configured=false without a key still fails closed")

          # Nest：非生产 + 无 key + configured=false -> 明文，且 Go 能读。
          stop_nest()
          start_nest("development", None)
          backend_token = login(email_platform)
          delete_setting(model_key)
          status, raw = token_write(nest, backend_token, "nest-plaintext")
          if status != 200 or stored_token_value() != "nest-plaintext":
              fail(f"nest non-production plaintext: {status} {raw[:300]!r} {stored_token_value()!r}")
          print("nest encryption policy ok: non-production plaintext fallback")

          # 恢复生产 Nest 与带 key 的 Go，供后续阶段使用。
          stop_nest()
          start_nest("production", os.environ["SYSTEM_SETTINGS_ENCRYPTION_KEY"])
          backend_token = login(email_platform)
          delete_setting(security_key)
          start_go("go")

          # ---- 阶段 4：停 NestJS 后 10 条仍由 Go 服务，未迁路径 502 ----
          delete_setting(model_key)
          delete_setting(keys_key)
          status, raw = call(go, model_path, "PUT", backend_token,
                             {"enabled": True, "baseUrl": "http://takeover-model:9000", "internalToken": "takeover-token",
                              "timeoutMs": 1000, "maxRetries": 1})
          if status != 200:
              fail(f"takeover setup PUT model: {status} {raw[:300]!r}")
          status, raw = call(go, keys_path, "PUT", backend_token, {"keys": ["sk-takeover"]})
          if status != 200:
              fail(f"takeover setup PUT keys: {status} {raw[:300]!r}")
          status, raw = call(go, internal_applied_path, "POST",
                             headers={"authorization": "Bearer " + internal_token},
                             payload={"source": "db", "keyFingerprints": [sha256_hex("sk-takeover")]})
          if status != 201:
              fail(f"takeover setup applied: {status} {raw[:300]!r}")

          stop_nest()
          print("nestjs stopped; verifying the ten routes stay served by Go")

          takeover = [
              ("GET", model_path, None, 200),
              ("PUT", model_path, {"enabled": True, "baseUrl": "http://takeover-model:9000",
                                   "internalToken": "takeover-token-2", "timeoutMs": 2000, "maxRetries": 2}, 200),
              ("DELETE", model_path, None, 200),
              ("GET", keys_path, None, 200),
              ("PUT", keys_path, {"keys": ["sk-takeover-2"]}, 200),
              ("POST", keys_path, {"keys": ["sk-takeover-3"]}, 201),
              ("DELETE", keys_path + "/key/" + sha256_hex("sk-takeover-2"), None, 200),
              ("DELETE", keys_path, None, 200),
          ]
          for method, path, payload, expected in takeover:
              status, raw = call(go, path, method, backend_token, payload)
              if status != expected:
                  fail(f"after nest stop {method} {path}: {status} {raw[:300]!r}, want {expected}")
          status, raw = call(go, internal_keys_path, "GET",
                             headers={"authorization": "Bearer " + internal_token})
          if status != 200:
              fail(f"after nest stop internal keys: {status} {raw[:300]!r}")
          status, raw = call(go, internal_applied_path, "POST",
                             headers={"authorization": "Bearer " + internal_token},
                             payload={"source": "db", "keyFingerprints": ["fp"]})
          if status != 201:
              fail(f"after nest stop applied: {status} {raw[:300]!r}")

          # 撤销与权限边界在 Nest 停止后仍然生效。
          status, raw = call(go, keys_path, "GET", reader_token)
          if status != 403:
              fail(f"after nest stop the permission boundary is gone: {status} {raw[:300]!r}")
          status, raw = call(go, keys_path, "GET", machine_deny)
          if status != 403:
              fail(f"after nest stop the machine boundary is gone: {status} {raw[:300]!r}")
          status, raw = call(go, model_path, "PUT", admin_a_token,
                             {"enabled": False, "timeoutMs": 1000, "maxRetries": 1})
          if status != 403 or message(raw) != platform_admin_message:
              fail(f"after nest stop the platform gate is gone: {status} {raw[:300]!r}")

          # 未迁路径必须 502，证明仍回落 NestJS。
          for path in (loading_path, gateways_path):
              status, raw = call(go, path, "GET", backend_token)
              if status != 502 or (body(raw) or {}).get("statusCode") != 502:
                  fail(f"unmigrated {path} after nest stop: {status} {raw[:300]!r}")
          print("takeover ok: ten routes served by Go, unmigrated paths stay on Nest (502)")

          # ---- 阶段 5：回滚 ----
          start_nest("production", os.environ["SYSTEM_SETTINGS_ENCRYPTION_KEY"])
          start_go("legacy")
          rollback_token = login(email_platform)
          # 路由恢复代理：Go 上的请求回到 Nest 并由 Nest 读写同一份数据。
          delete_setting(model_key)
          status, raw = call(go, model_path, "PUT", rollback_token,
                             {"enabled": True, "baseUrl": "http://rollback-model:9000", "internalToken": "rollback-token",
                              "timeoutMs": 1000, "maxRetries": 1})
          if status != 200:
              fail(f"rollback PUT through the proxy: {status} {raw[:300]!r}")
          status, raw = call(nest, model_path, "GET", rollback_token)
          doc = body(raw) or {}
          if status != 200 or doc.get("hasToken") is not True or doc.get("tokenSource") != "stored":
              fail(f"nest cannot read the go-era configuration: {raw[:300]!r}")
          delete_setting(keys_key)
          status, raw = call(go, keys_path, "PUT", rollback_token, {"keys": ["sk-rollback"]})
          if status != 200:
              fail(f"rollback keys PUT: {status} {raw[:300]!r}")
          status, raw = call(nest, keys_path, "GET", rollback_token)
          if status != 200 or (body(raw) or {}).get("keysCount") != 1:
              fail(f"nest cannot read the go-era keys: {raw[:300]!r}")
          print("rollback ok: legacy mode proxies to NestJS and NestJS reads the same configuration")
          PY
