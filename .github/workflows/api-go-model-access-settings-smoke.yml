          concurrent_pair(lambda: call(nest, keys_path, "POST", platform_token, {"keys": ["sk-c"]}),
                          lambda: call(go, keys_path, "POST", platform_token, {"keys": ["sk-d"]}),
                          lambda: None, "POST (nest) + POST (go)", expected=(201, 201))
