# 模型接入设置与 OpenAI 密钥分发 10 条 Go 路由真实栈验收。不进普通 CI。
# PR 上加 label api-go-model-access-settings-smoke，或 workflow_dispatch。
# 覆盖 legacy 代理对照、DTO 顺序、四态 token、MA1 平台门禁、MA2 并发
# 读改写、MA3 旧缓存 token、两把全局锁协议、加密决策表、内部 token 边界、
# Nest 与 Go 双向加解密互通，以及停 NestJS 后的接管与回滚。
name: api-go-model-access-settings-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-model-access-settings-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-model-access-settings-smoke@example.com
  SMTP_PASS: api-go-model-access-settings-smoke-smtp-not-connected
  JWT_SECRET: c1f4a9e8d2b3706f5a1c8e9d4b2a7f6038e5d1c9a7b6f4e2d3c8a1b5f9e0d7c2
  NEXTAUTH_SECRET: e2b5c1f8a9d3b47e60d4a1f8c3b5e79d02c1f4a9e8d2b3706f5a1c8e9d4b2a7f6
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  # 仅供 CI 的假密钥：32 字节 base64（openssl rand -base64 32 等价的固定值）。
  SYSTEM_SETTINGS_ENCRYPTION_KEY: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
  LITELLM_CONFIG_INTERNAL_TOKEN: "model-access-smoke-internal-token-0123456789"
  RATE_LIMIT_LOGIN: "1000"
  RATE_LIMIT_LOGIN_WINDOW: "600"
  RATE_LIMIT_CRAWL_TASK_CREATE: "1000"
  RATE_LIMIT_CRAWL_TASK_CREATE_WINDOW: "600"
  RATE_LIMIT_RBAC_WRITE: "1000"
  RATE_LIMIT_RBAC_WRITE_WINDOW: "600"
  RATE_LIMIT_SETTINGS_CACHE_TTL_SECONDS: "60"
  AUTH_PROFILE_CACHE_TTL_SECONDS: "600"
  AUTH_PROFILE_CACHE_LOCK_TTL_MS: "5000"
  AUTH_PROFILE_CACHE_MAX_WAIT_MS: "5000"
  AUTH_PROFILE_CACHE_RETRY_DELAY_MS: "50"
  AUDIT_LOG_RETENTION_DAYS: "90"
  SEED_ORG_SLUG: api-go-model-access-settings-smoke-org
  SEED_ORG_NAME: api-go Model Access Settings Smoke Org
  SEED_ADMIN_EMAIL: api-go-model-access-settings-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: "ApiGoModelAccess#2026-Ci"
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-model-access-settings-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-model-access-settings-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-model-access-settings:ci .
      - name: Exercise model access settings routes
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python3 -u - << 'PY'
          import base64, datetime, hashlib, json, os, signal, subprocess, threading, time, urllib.error, urllib.request

          nest = "http://127.0.0.1:4000"
          go = "http://127.0.0.1:4020"

          org_a = "mast-org-a-0001"
          org_b = "mast-org-b-0001"
          role_settings = "mast-role-settings-0001"
          role_settings_b = "mast-role-settings-b-0001"
          role_none = "mast-role-none-0001"
          user_platform = "mast-platform-0001"
          user_admin_a = "mast-admin-a-0001"
          user_admin_b = "mast-admin-b-0001"
          user_reader = "mast-reader-0001"
          user_platform_only = "mast-platform-only-0001"
          mem_platform = "mast-mem-platform-0001"
          mem_admin_a = "mast-mem-admin-a-0001"
          mem_admin_b = "mast-mem-admin-b-0001"
          mem_reader = "mast-mem-reader-0001"
          mem_platform_only = "mast-mem-platform-only-0001"
          email_platform = "mast-platform@example.com"
          email_admin_a = "mast-admin-a@example.com"
          email_admin_b = "mast-admin-b@example.com"
          email_reader = "mast-reader@example.com"
          email_platform_only = "mast-platform-only@example.com"
          machine_allow = "mtk_model_access_smoke_allow_0001"
          machine_deny = "mtk_model_access_smoke_deny_0001"
          internal_token = os.environ["LITELLM_CONFIG_INTERNAL_TOKEN"]

          model_path = "/api/system-settings/model-service"
          keys_path = "/api/system-settings/openai-keys"
          internal_keys_path = "/api/internal/litellm/openai-keys"
          internal_applied_path = "/api/internal/litellm/openai-keys/applied"
          loading_path = "/api/internal/litellm/proxy-load-balancing"
          gateways_path = "/api/system-settings/llm-gateways"
          platform_admin_message = "Platform admin access required"

          model_key = "model_service"
          keys_key = "openai_keys"
          applied_key = "litellm_openai_keys_applied"
          security_key = "system_security"
          model_cache = "model_service:settings"
          keys_cache = "openai_keys:settings"
          applied_cache = "openai_keys:applied_status"
          security_cache = "system_security:settings"

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def container_id(ancestor):
              return subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=" + ancestor], text=True).split()[0]

          def sql(statement):
              cid = container_id("mysql:8.4")
              proc = subprocess.run(["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "app"],
                                    input=statement.rstrip("\n") + "\n", text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(f"mysql failed rc={proc.returncode} statement={statement[:200]!r} "
                       f"stderr={proc.stderr!r} stdout={proc.stdout!r}")
              return proc.stdout.strip()

          def scalar(statement):
              lines = [line.strip() for line in sql(statement).splitlines() if line.strip()]
              return lines[-1] if lines else ""

          def redis(*args):
              cid = container_id("redis:7.2")
              proc = subprocess.run(["docker", "exec", "-i", cid, "redis-cli", "--raw", *args],
                                    text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(f"redis-cli failed rc={proc.returncode} args={args!r} "
                       f"stderr={proc.stderr!r} stdout={proc.stdout!r}")
              return proc.stdout.strip()

          def set_setting(key, raw_json):
              escaped = raw_json.replace("\\", "\\\\").replace("'", "''")
              sql(f"REPLACE INTO SystemSetting (`key`, value, isPublic, createdAt, updatedAt, updatedById) "
                  f"VALUES ('{key}', '{escaped}', 0, NOW(3), NOW(3), NULL)")

          def delete_setting(key):
              sql(f"DELETE FROM SystemSetting WHERE `key`='{key}'")
              redis("DEL", {"model_service": model_cache, "openai_keys": keys_cache,
                            "litellm_openai_keys_applied": applied_cache,
                            "system_security": security_cache}[key])

          def setting_value(key):
              return scalar(f"SELECT value FROM SystemSetting WHERE `key`='{key}'")

          def call(base, path, method="GET", token=None, payload=None, headers=None, timeout=30, raw_body=None):
              request_headers = dict(headers or {})
              data = None
              if token:
                  request_headers["authorization"] = "Bearer " + token
              if raw_body is not None:
                  data = raw_body
                  request_headers.setdefault("content-type", "application/json")
              elif payload is not None:
                  data = json.dumps(payload).encode()
                  request_headers["content-type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, method=method, headers=request_headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          def body(raw):
              if not raw:
                  return None
              text = raw.decode("utf-8", "replace").strip()
              if not text:
                  return None
              return json.loads(text)

          def message(raw):
              doc = body(raw) or {}
              text = doc.get("message")
              if isinstance(text, list):
                  return "; ".join(str(item) for item in text)
              return text

          def stable(doc):
              """Strips the fields that are legitimately non-deterministic."""
              if not isinstance(doc, dict):
                  return doc
              return {key: value for key, value in doc.items() if key not in ("traceId", "timestamp", "appliedAt")}

          def parity(label, method, path, token, payload=None, expected=200, seed=None, via_go_headers=None):
              if seed:
                  seed()
              nest_status, nest_raw = call(nest, path, method, token, payload)
              if seed:
                  seed()
              go_status, go_raw = call(go, path, method, token, payload)
              if nest_status != expected or go_status != expected:
                  fail(f"parity {label}: status nest={nest_status} go={go_status}, want {expected}; "
                       f"nest={nest_raw[:300]!r} go={go_raw[:300]!r}")
              if stable(body(nest_raw)) != stable(body(go_raw)):
                  fail(f"parity {label}: body mismatch nest={nest_raw[:600]!r} go={go_raw[:600]!r}")
              print("parity ok:", label)
              return body(go_raw)

          def parity_error(label, method, path, token, payload=None, expected=400, want_message=None):
              nest_status, nest_raw = call(nest, path, method, token, payload)
              go_status, go_raw = call(go, path, method, token, payload)
              if nest_status != expected or go_status != expected:
                  fail(f"parity {label}: status nest={nest_status} go={go_status}, want {expected}; "
                       f"nest={nest_raw[:300]!r} go={go_raw[:300]!r}")
              nest_message, go_message = message(nest_raw), message(go_raw)
              if nest_message != go_message:
                  fail(f"parity {label}: message mismatch nest={nest_message!r} go={go_message!r}")
              if want_message is not None and go_message != want_message:
                  fail(f"parity {label}: message {go_message!r}, want {want_message!r}")
              print("parity ok:", label)
              return go_message

          def login(email):
              status, raw = call(nest, "/api/auth/login", "POST",
                                 payload={"email": email, "password": os.environ["SEED_ADMIN_PASSWORD"]})
              doc = body(raw)
              if status not in (200, 201) or not doc or not doc.get("accessToken"):
                  fail(f"login {email} {status} {raw[:400]!r}")
              return doc["accessToken"]

          def start_go(mode, extra_env=None, name="api-go-model-access-settings-smoke"):
              subprocess.run(["docker", "rm", "-f", name], check=False, capture_output=True)
              env = [
                  "PORT=4020",
                  "LEGACY_API_URL=http://host.docker.internal:4000",
                  "DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app",
                  "MONGO_URI=mongodb://host.docker.internal:27017/app",
                  f"API_GO_MODEL_ACCESS_SETTINGS_MODE={mode}",
                  "API_GO_RBAC_MODE=legacy",
                  "API_GO_RUNTIME_SETTINGS_MODE=legacy",
                  "API_GO_CRAWL_PROFILES_MODE=legacy",
                  "API_GO_CRAWL_TEMPLATES_MODE=legacy",
                  "API_GO_CRAWL_WORKFLOWS_MODE=legacy",
                  "API_GO_NEWS_SOURCES_MODE=legacy",
                  "API_GO_SITUATION_MONITORS_MODE=legacy",
                  "API_GO_CONTENT_SUBSCRIPTIONS_MODE=legacy",
                  "API_GO_USER_NEWS_BEHAVIOR_MODE=legacy",
                  "API_GO_USER_DIGEST_MODE=legacy",
                  "API_GO_DASHBOARD_STATS_MODE=legacy",
                  "API_GO_DASHBOARD_CHARTS_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_GEO_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE=legacy",
                  "API_GO_DASHBOARD_STREAM_MODE=legacy",
                  "API_GO_HEALTHZ_MODE=legacy",
                  "API_GO_PUBLIC_PORTAL_MODE=legacy",
                  "API_GO_ANALYSIS_VIEWS_MODE=legacy",
                  "API_GO_ANALYSIS_BOARDS_MODE=legacy",
                  "API_GO_ANALYSIS_THREADS_MODE=legacy",
                  "API_GO_GRAPHQL_READ_MODE=legacy",
                  "API_GO_GRAPHQL_NEWS_EVENTS_MODE=legacy",
                  "API_GO_GRAPHQL_KNOWLEDGE_GRAPH_MODE=legacy",
                  "API_GO_GRAPHQL_KG_IMPACT_MODE=legacy",
                  "API_GO_USER_SETTINGS_WRITE_MODE=legacy",
                  "API_GO_ADMIN_LOGS_MODE=legacy",
                  "API_GO_LLM_LOGS_MODE=legacy",
                  "API_GO_NEWS_INDICATORS_MODE=legacy",
                  "API_GO_QUALITY_OVERVIEW_MODE=legacy",
                  "RATE_LIMIT_LOGIN=1000",
                  "RATE_LIMIT_LOGIN_WINDOW=600",
                  "RATE_LIMIT_CRAWL_TASK_CREATE=1000",
                  "RATE_LIMIT_CRAWL_TASK_CREATE_WINDOW=600",
                  "RATE_LIMIT_RBAC_WRITE=1000",
                  "RATE_LIMIT_RBAC_WRITE_WINDOW=600",
                  "RATE_LIMIT_SETTINGS_CACHE_TTL_SECONDS=60",
                  "AUTH_PROFILE_CACHE_TTL_SECONDS=600",
                  "AUTH_PROFILE_CACHE_LOCK_TTL_MS=5000",
                  "AUTH_PROFILE_CACHE_MAX_WAIT_MS=5000",
                  "AUTH_PROFILE_CACHE_RETRY_DELAY_MS=50",
                  "AUDIT_LOG_RETENTION_DAYS=90",
                  "REALTIME_SIGNALS_ENABLED=false",
                  "ELASTICSEARCH_ENABLED=false",
                  "MODEL_SERVICE_ENABLED=false",
                  "VECTOR_SERVICE_ENABLED=false",
                  "SCHEDULE_ENABLED=false",
                  f"MODEL_SERVICE_TIMEOUT_MS=15000",
                  f"MODEL_SERVICE_MAX_RETRIES=2",
                  f"LITELLM_CONFIG_INTERNAL_TOKEN={internal_token}",
                  f"JWT_SECRET={os.environ['JWT_SECRET']}",
                  f"JWT_ISSUER={os.environ['JWT_ISSUER']}",
                  f"JWT_AUDIENCE={os.environ['JWT_AUDIENCE']}",
                  "REDIS_HOST=host.docker.internal",
                  "REDIS_PORT=6379",
                  "CANARY_PERCENT=0",
                  f"CORS_ORIGIN={os.environ['CORS_ORIGIN']}",
              ]
              if extra_env:
                  env.extend(extra_env)
              cmd = ["docker", "run", "-d", "--name", name,
                     "--add-host=host.docker.internal:host-gateway",
                     "--health-interval", "3s", "--health-timeout", "3s", "--health-retries", "5", "--health-start-period", "2s",
                     "-p", "127.0.0.1:4020:4020"]
              for item in env:
                  cmd.extend(["-e", item])
              cmd.append("api-go-model-access-settings:ci")
              subprocess.check_call(cmd, stdout=subprocess.DEVNULL)
              for attempt in range(45):
                  inspect = subprocess.run(["docker", "inspect", "--format",
                                            "{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}no-health{{end}}",
                                            name], text=True, capture_output=True)
                  status = inspect.stdout.strip()
                  if status.endswith("|healthy"):
                      print(f"api-go healthy mode={mode} state={status}", flush=True)
                      return
                  if attempt % 5 == 0:
                      print(f"api-go health attempt={attempt} state={status!r} mode={mode}", flush=True)
                  if status.endswith("|unhealthy"):
                      logs = subprocess.run(["docker", "logs", name], text=True, capture_output=True)
                      fail(f"api-go container unhealthy mode={mode} inspect={status!r} "
                           f"logs={(logs.stdout or '')[-4000:]!r} logerr={(logs.stderr or '')[-1000:]!r}")
                  time.sleep(2)
              logs = subprocess.run(["docker", "logs", name], text=True, capture_output=True)
              fail(f"api-go container never became healthy mode={mode} inspect={status!r} "
                   f"logs={(logs.stdout or '')[-4000:]!r}")

          # ---- 数据准备：两个组织、平台管理员、两个组织管理员、普通用户、
          # ---- 只有平台角色没有 settings.manage 的用户、两个机器令牌 ----
          admin = scalar(f"SELECT id FROM User WHERE email='{os.environ['SEED_ADMIN_EMAIL']}'")
          settings_perm = scalar("SELECT id FROM Permission WHERE name='settings.manage'")
          if not admin or not settings_perm:
              fail(f"missing seed rows admin={admin} settings={settings_perm}")

          sql(f"""
          INSERT INTO Org (id, name, slug, isActive, createdAt, updatedAt) VALUES
            ('{org_a}', 'Model Access Smoke Org A', 'mast-smoke-org-a', 1, NOW(3), NOW(3)),
            ('{org_b}', 'Model Access Smoke Org B', 'mast-smoke-org-b', 1, NOW(3), NOW(3));
          INSERT INTO Role (id, name, description, isSystem, orgId) VALUES
            ('{role_settings}', 'model-access-smoke-settings', NULL, 0, '{org_a}'),
            ('{role_settings_b}', 'model-access-smoke-settings-b', NULL, 0, '{org_b}'),
            ('{role_none}', 'model-access-smoke-none', NULL, 0, '{org_a}');
          INSERT INTO RolePermission (id, roleId, permissionId) VALUES
            ('mast-rp-settings-0001', '{role_settings}', '{settings_perm}'),
            ('mast-rp-settings-b-0001', '{role_settings_b}', '{settings_perm}');
          """)
          for user_id, email, membership_id, org_id, role_id in (
              (user_platform, email_platform, mem_platform, org_a, role_settings),
              (user_admin_a, email_admin_a, mem_admin_a, org_a, role_settings),
              (user_admin_b, email_admin_b, mem_admin_b, org_b, role_settings_b),
              (user_reader, email_reader, mem_reader, org_a, role_none),
              (user_platform_only, email_platform_only, mem_platform_only, org_a, role_none),
          ):
              sql(f"""
              INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
              SELECT '{user_id}', '{email}', passwordHash, 'Smoke', 'User', 1, NOW(3), NOW(3), NOW(3)
              FROM User WHERE id = '{admin}';
              INSERT INTO Membership (id, userId, orgId, roleId, isActive, createdAt)
              VALUES ('{membership_id}', '{user_id}', '{org_id}', '{role_id}', 1, NOW(3));
              """)
          sql(f"""
          INSERT INTO GlobalRoleAssignment (id, userId, role, createdAt) VALUES
            ('mast-gra-platform-0001', '{user_platform}', 'platform_admin', NOW(3)),
            ('mast-gra-platform-only-0001', '{user_platform_only}', 'platform_admin', NOW(3));
          """)
          allow_hash = hashlib.sha256(machine_allow.encode()).hexdigest()
          deny_hash = hashlib.sha256(machine_deny.encode()).hexdigest()
          sql(f"""
          INSERT INTO MachineAccessToken (id, orgId, name, tokenHash, permissions, lastUsedAt, expiresAt, revokedAt, createdAt, updatedAt)
          VALUES
            ('mast-mtok-allow-0001', '{org_a}', 'allow', '{allow_hash}', '["settings.manage"]', NULL, NULL, NULL, NOW(3), NOW(3)),
            ('mast-mtok-deny-0001', '{org_a}', 'deny', '{deny_hash}', '["org.read"]', NULL, NULL, NULL, NOW(3), NOW(3));
          """)

          def model_seed_none():
              delete_setting(model_key)

          def model_seed_db():
              set_setting(model_key, json.dumps({
                  "enabled": True, "baseUrl": "http://db-model:9000",
                  "internalToken": "db-plain-token", "timeoutMs": 12000, "maxRetries": 4,
              }))
              redis("DEL", model_cache)

          def keys_seed_none():
              delete_setting(keys_key)

          def keys_seed_two():
              set_setting(keys_key, json.dumps({"openaiApiKeys": [
                  {"fingerprint": sha256_hex("sk-a"), "value": "sk-a"},
                  {"fingerprint": sha256_hex("sk-b"), "value": "sk-b"},
              ]}))
              redis("DEL", keys_cache)

          def keys_seed_empty():
              set_setting(keys_key, json.dumps({"openaiApiKeys": []}))
              redis("DEL", keys_cache)

          def sha256_hex(value):
              return hashlib.sha256(value.encode()).hexdigest()

          def internal_keys():
              """Reads the authoritative plaintext list through the internal route."""
              status, raw = call(go, internal_keys_path, "GET",
                                 headers={"authorization": "Bearer " + internal_token})
              if status != 200:
                  fail(f"internal keys read: {status} {raw[:300]!r}")
              return (body(raw) or {}).get("openaiApiKeys")

          def stored_token_value():
              """Reads the raw stored model token (a plain string or a v1 envelope)."""
              return json.loads(setting_value(model_key))["internalToken"]

          # ---- 阶段 1：legacy 开关下 10 条全部经 Go 代理并与 Nest 直连一致 ----
