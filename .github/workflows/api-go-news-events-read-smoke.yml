# Go-批8：新闻事件控制台六个 GraphQL 读查询的真实栈对照。不进普通 CI。
# PR 上加 label api-go-news-events-read-smoke，或 workflow_dispatch。
# 不调用模型。缓存未命中的简报不在本工作流里打模型。
name: api-go-news-events-read-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-news-events-read-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-smoke@example.com
  SMTP_PASS: api-go-smoke-smtp-not-connected
  JWT_SECRET: c1f4a9e8d2b3706f5a1c8e9d4b2a7f6038e5d1c9a7b6f4e2d3c8a1b5f9e0d7c2
  NEXTAUTH_SECRET: e2b5c1f8a9d3b47e60d4a1f8c3b5e79d02c1f4a9e8d2b3706f5a1c8e9d4b2a7f6
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  LITELLM_TIMEOUT_MS: "800"
  LITELLM_RETRY_ATTEMPTS: "1"
  SEED_ORG_SLUG: api-go-smoke-org
  SEED_ORG_NAME: api-go Smoke Org
  SEED_ADMIN_EMAIL: api-go-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: ApiGoSmoke#2026-Ci
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-news-events-read-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-news-events-read-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-news:ci .
      - name: Start api-go
        run: |
          set -euo pipefail
          start_go() {
            local mode="$1"
            docker rm -f api-go-news >/dev/null 2>&1 || true
            docker run -d --name api-go-news \
              --add-host=host.docker.internal:host-gateway \
              --health-interval 5s --health-timeout 3s --health-retries 20 --health-start-period 5s \
              -p 127.0.0.1:4020:4020 \
              -e PORT=4020 \
              -e LEGACY_API_URL=http://host.docker.internal:4000 \
              -e DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app \
              -e MONGO_URI=mongodb://host.docker.internal:27017/app \
              -e API_GO_GRAPHQL_READ_MODE="$mode" \
              -e API_GO_DASHBOARD_STATS_MODE=legacy \
              -e API_GO_DASHBOARD_CHARTS_MODE=legacy \
              -e API_GO_DASHBOARD_WAR_MAP_MODE=legacy \
              -e API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE=legacy \
              -e API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE=legacy \
              -e API_GO_DASHBOARD_SPACETIME_GEO_MODE=legacy \
              -e API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE=legacy \
              -e API_GO_DASHBOARD_STREAM_MODE=legacy \
              -e API_GO_HEALTHZ_MODE=legacy \
              -e API_GO_CONTENT_SUBSCRIPTIONS_MODE=legacy \
              -e API_GO_USER_NEWS_BEHAVIOR_MODE=legacy \
              -e API_GO_USER_DIGEST_MODE=legacy \
              -e API_GO_ANALYSIS_VIEWS_MODE=legacy \
              -e API_GO_ANALYSIS_BOARDS_MODE=legacy \
              -e API_GO_ANALYSIS_THREADS_MODE=legacy \
              -e JWT_SECRET="$JWT_SECRET" \
              -e JWT_ISSUER="$JWT_ISSUER" \
              -e JWT_AUDIENCE="$JWT_AUDIENCE" \
              -e REDIS_HOST=host.docker.internal \
              -e REDIS_PORT=6379 \
              -e CANARY_PERCENT=0 \
              -e CORS_ORIGIN="$CORS_ORIGIN" \
              api-go-news:ci
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' api-go-news 2>/dev/null || echo starting)
              echo "health=$status mode=$mode"
              if [ "$status" = "healthy" ]; then return 0; fi
              if [ "$status" = "unhealthy" ]; then docker logs api-go-news; return 1; fi
              sleep 2
            done
            docker logs api-go-news || true
            return 1
          }
          start_go legacy
          declare -f start_go > /tmp/start-go.sh
      - name: Exercise news event reads
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib, json, os, subprocess, urllib.error, urllib.request

          go = "http://127.0.0.1:4020"
          nest = "http://127.0.0.1:4000"

          def cid(ancestor):
              return subprocess.check_output(["docker", "ps", "-q", "-f", f"ancestor={ancestor}"], text=True).split()[0]

          mysql = cid("mysql:8.4")
          mongo = cid("mongo:7.0")
          redis = cid("redis:7.2")

          def sql(statement):
              proc = subprocess.run(["docker", "exec", "-i", mysql, "mysql", "-uroot", "-psecret", "-N", "app"], input=statement, text=True, capture_output=True)
              if proc.returncode != 0:
                  raise SystemExit(proc.stderr or proc.stdout)
              return proc.stdout.strip()

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def call(base, path, method="GET", token=None, payload=None, timeout=40):
              headers = {"content-type": "application/json"}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read(), resp.headers
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(), exc.headers

          def body(raw):
              if not raw:
                  return None
              return json.loads(raw)

          def login(email):
              status, raw, _ = call(go, "/api/auth/login", "POST", payload={"email": email, "password": os.environ["SEED_ADMIN_PASSWORD"]})
              doc = body(raw)
              if status not in (200, 201) or not doc or not doc.get("accessToken"):
                  fail(f"login {email} {status} {raw[:300]!r}")
              return doc["accessToken"]

          org = sql("SELECT id FROM Org WHERE slug='api-go-smoke-org'")
          admin = sql("SELECT id FROM User WHERE email='api-go-smoke-admin@example.com'")
          perm = sql("SELECT id FROM Permission WHERE name='items.read'")
          if not perm:
              fail("items.read missing")
          sql(f"""
          UPDATE User SET emailVerified = NOW(3) WHERE id = '{admin}';
          INSERT INTO Org (id, name, slug, isActive, createdAt, updatedAt)
          VALUES ('newsorgb0000000000000001', 'News Other', 'news-other-org', 1, NOW(3), NOW(3));
          INSERT INTO Role (id, orgId, name, description, isSystem)
          VALUES ('newsroleb0000000000000001', 'newsorgb0000000000000001', 'news-other', 'other', 0);
          INSERT INTO RolePermission (id, roleId, permissionId)
          VALUES ('newsrpb000000000000000001', 'newsroleb0000000000000001', '{perm}');
          INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
          SELECT 'newsuserb0000000000000001', 'news-b@example.com', passwordHash, 'Other', 'Org', 1, NOW(3), NOW(3), NOW(3)
          FROM User WHERE id = '{admin}';
          INSERT INTO Membership (id, userId, orgId, roleId, isActive, createdAt)
          VALUES ('newsmemb00000000000000001', 'newsuserb0000000000000001', 'newsorgb0000000000000001', 'newsroleb0000000000000001', 1, NOW(3));
          INSERT INTO Article (id, orgId, url, sourceLabel, crawlAt, contentHash, createdAt, updatedAt)
          VALUES
            ('newsarta00000000000000001', '{org}', 'https://www.reuters.com/smoke-brief', 'Reuters', '2026-10-01 11:00:00.000', 'news-hash-brief', NOW(3), NOW(3)),
            ('newsartc00000000000000001', '{org}', 'https://www.reuters.com/smoke-hot', 'Reuters', NOW(3), 'news-hash-hot', NOW(3), NOW(3)),
            ('newsartb00000000000000001', 'newsorgb0000000000000001', 'https://www.bbc.com/smoke-other', 'BBC', NOW(3), 'news-hash-other', NOW(3), NOW(3));
          INSERT INTO ProcessedArticle (id, orgId, articleId, title, summary, publishedAt, language, category, processedAt, createdAt, updatedAt)
          VALUES
            ('newspa000000000000000001', '{org}', 'newsarta00000000000000001', 'Brief story', 'Brief summary', '2026-10-01 11:30:00.000', 'en', 'finance', '2026-10-01 11:40:00.000', NOW(3), NOW(3)),
            ('newspc000000000000000001', '{org}', 'newsartc00000000000000001', 'Hot story', 'Hot summary', NOW(3), 'en', 'finance', NOW(3), NOW(3), NOW(3)),
            ('newspb000000000000000001', 'newsorgb0000000000000001', 'newsartb00000000000000001', 'Other org story', 'Hidden', NOW(3), 'en', 'politics', NOW(3), NOW(3), NOW(3));
          INSERT INTO NewsEvent (id, orgId, status, language, primaryTopic, primaryEntity, title, summary, startAt, lastAt, metadata, createdAt, updatedAt)
          VALUES
            ('newsevta0000000000000001', '{org}', 'active', 'en', 'markets', 'ECB', 'Smoke brief event', 'A cached brief', '2026-10-01 08:00:00.000', '2026-10-01 12:00:00.000', NULL, NOW(3), NOW(3)),
            ('newsevtc0000000000000001', '{org}', 'active', 'en', 'markets', 'Fed', 'Smoke hot event', 'Recent', NOW(3), NOW(3), NULL, NOW(3), NOW(3)),
            ('newsevtb0000000000000001', 'newsorgb0000000000000001', 'active', 'en', 'other', 'OtherOrg', 'Other org event leak', 'Hidden', NOW(3), NOW(3), NULL, NOW(3), NOW(3));
          INSERT INTO NewsEventItem (id, orgId, eventId, processedArticleId, processedItemId, similarity, assignedBy, createdAt)
          VALUES
            ('newsitema000000000000001', '{org}', 'newsevta0000000000000001', 'newspa000000000000000001', '64b0000000000000000000a1', 0.91, 'overlap', '2026-10-01 11:50:00.000'),
            ('newsitemc000000000000001', '{org}', 'newsevtc0000000000000001', 'newspc000000000000000001', '64b0000000000000000000a2', 0.88, 'vector', NOW(3) - INTERVAL 20 MINUTE),
            ('newsitemb000000000000001', 'newsorgb0000000000000001', 'newsevtb0000000000000001', 'newspb000000000000000001', '64b0000000000000000000b1', 0.5, 'overlap', NOW(3));
          INSERT INTO NewsEventTimelineEntry (id, orgId, eventId, bucketStart, title, summary, keyPoints, referencedArticleIds, createdAt, updatedAt)
          VALUES ('newstl000000000000000001', '{org}', 'newsevta0000000000000001', '2026-10-01 00:00:00.000', 'Open', 'Markets opened', JSON_ARRAY('point'), JSON_ARRAY('newsarta00000000000000001'), NOW(3), NOW(3));
          """)
          last_at = "2026-10-01T12:00:00.000Z"
          fingerprint_body = {
              "version": 1,
              "language": "zh",
              "lastAt": last_at,
              "sources": [{
                  "processedArticleId": "newspa000000000000000001",
                  "processedItemId": "64b0000000000000000000a1",
                  "url": "https://www.reuters.com/smoke-brief",
              }],
          }
          raw_fp = json.dumps(fingerprint_body, ensure_ascii=False, separators=(",", ":"))
          fingerprint = hashlib.sha256(raw_fp.encode()).hexdigest()
          brief = {
              "briefV1": {
                  "version": 1,
                  "language": "zh",
                  "fingerprint": fingerprint,
                  "generatedAt": "2026-10-01T12:05:00.000Z",
                  "sources": [{
                      "index": 1,
                      "url": "https://www.reuters.com/smoke-brief",
                      "sourceLabel": "Reuters",
                      "title": "Brief story",
                      "publishedAt": "2026-10-01T11:30:00.000Z",
                      "processedItemId": "64b0000000000000000000a1",
                      "processedArticleId": "newspa000000000000000001",
                  }],
                  "payload": {
                      "detailed_summary": "Markets moved after the decision.",
                      "tldr": "ECB held rates.",
                      "key_points": [{"text": "Rates were unchanged.", "citations": [1]}],
                      "why_it_matters": [{"text": "Funding costs stay put.", "citations": [1]}],
                      "latest_update": {"text": "The statement landed at noon.", "citations": [1]},
                      "what_to_watch": [{"text": "The next inflation print.", "citations": [1]}],
                      "comparison": {"consensus": [{"text": "Rates were unchanged.", "citations": [1]}], "divergence": []},
                      "limitations": "One source.",
                  },
              },
              "timeline": {
                  "categoryDistribution": [{"categoryPath": "finance/markets", "legacyCategory": "finance", "count": 1, "share": 1}],
                  "topicDriftWarning": False,
                  "topicDriftSummary": "stable",
                  "phaseSummaries": [{"name": "open"}],
                  "entries": {
                      "2026-10-01T00:00:00.000Z": {
                          "categoryPath": "finance/markets",
                          "categoryConfidence": 0.8,
                          "tentative": False,
                          "anchor": True,
                      }
                  },
              },
          }
          payload = json.dumps(brief).replace("\\", "\\\\").replace("'", "\\'")
          sql(f"UPDATE NewsEvent SET metadata = CAST('{payload}' AS JSON) WHERE id = 'newsevta0000000000000001'")
          mongo_js = """
          db.processeditems.insertMany([
            {_id: ObjectId('64b0000000000000000000a1'), rawItemId: ObjectId('64b0000000000000000000c1'), itemMetaId: 'meta-a1', orgId: '%s', status: 'completed', createdAt: new Date('2026-10-11T08:00:00Z'), ingestedAt: new Date('2026-10-11T08:00:00Z'), sortAt: new Date('2026-10-11T08:00:00Z'), result: {title: 'Markets move', summary: 'ECB day', source: 'Reuters', published_at: '2026-10-11T08:00:00.000Z', topics: ['smoke-markets'], entities: [{name: 'ECB'}], category: 'finance', category_path: 'finance/markets', cleaned_markdown: 'body a1'}},
            {_id: ObjectId('64b0000000000000000000a2'), rawItemId: ObjectId('64b0000000000000000000c2'), itemMetaId: 'meta-a2', orgId: '%s', status: 'completed', createdAt: new Date('2026-10-11T09:00:00Z'), ingestedAt: new Date('2026-10-11T09:00:00Z'), sortAt: new Date('2026-10-11T09:00:00Z'), result: {title: 'Rates hold', summary: 'second', source: 'Reuters', published_at: '2026-10-11T09:00:00.000Z', topics: ['smoke-markets'], entities: [{name: 'ECB'}], category: 'finance', category_path: 'finance/markets', cleaned_markdown: 'body a2'}},
            {_id: ObjectId('64b0000000000000000000b1'), rawItemId: ObjectId('64b0000000000000000000c3'), itemMetaId: 'meta-b1', orgId: 'newsorgb0000000000000001', status: 'completed', createdAt: new Date('2026-10-11T09:30:00Z'), ingestedAt: new Date('2026-10-11T09:30:00Z'), sortAt: new Date('2026-10-11T09:30:00Z'), result: {title: 'Other org only', summary: 'hidden', source: 'BBC', published_at: '2026-10-11T09:30:00.000Z', topics: ['other-org-only'], entities: [{name: 'OtherOrg'}], category: 'politics', category_path: 'politics/other', cleaned_markdown: 'body b'}}
          ])
          """ % (org, org)
          proc = subprocess.run(["docker", "exec", "-i", mongo, "mongosh", "app", "--quiet"], input=mongo_js, text=True, capture_output=True)
          if proc.returncode != 0:
              fail(proc.stderr or proc.stdout)

          token_a = login(os.environ["SEED_ADMIN_EMAIL"])
          token_b = login("news-b@example.com")

          list_query = """
          query NewsEvents($limit: Int, $windowDays: Int) {
            newsEvents(limit: $limit, windowDays: $windowDays, sortBy: latest, dedupeSimilar: false) {
              id title status primaryEntity itemCount breaking heatScore credibilityScore sourceType
              sourceEvidence { uniqueSourceCount authoritativeSourceCount blogSourceCount corroborated }
              topicDriftWarning topicDriftSummary
            }
          }"""
          detail_query = """
          query NewsEvent($id: String!) {
            newsEvent(id: $id, itemsLimit: 10, timelineLimit: 10) {
              id title itemCount
              items { id processedArticleId itemMetaId processedItemId assignedBy processedArticle { title article { url sourceLabel } } }
              timeline { bucketStart title categoryPath categoryConfidence tentative anchor keyPoints referencedArticleIds }
              categoryDistribution
            }
          }"""
          brief_query = """
          query NewsEventBrief($eventId: String!) {
            newsEventBrief(eventId: $eventId, language: "zh") {
              version language tldr detailedSummary
              keyPoints { text citations }
              sources { index url sourceLabel processedArticleId }
            }
          }"""
          refs_query = """
          query Refs($eventId: String!, $articleIds: [String!]!) {
            newsEventReferencedArticles(eventId: $eventId, articleIds: $articleIds, limit: 10) {
              id url title sourceLabel processedArticleId
            }
          }"""
          groups_query = """
          query Groups {
            topicGroups(limit: 10, itemsPerGroup: 5, windowDays: 30) { topic count items { id itemMetaId title } }
            eventGroups(limit: 10, itemsPerGroup: 5, windowDays: 30, minGroupSize: 2) {
              eventId count title entities topics items { id title }
            }
          }"""

          def gql(base, token, query, variables=None):
              status, raw, headers = call(base, "/graphql", "POST", token, {"query": query, "variables": variables or {}})
              return status, body(raw), headers

          def scrub(value):
              if isinstance(value, dict):
                  return {k: scrub(v) for k, v in value.items() if k not in ("traceId", "locations", "stack", "originalError")}
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              return value

          saved = {}
          def capture(name, query, variables, token=token_a):
              status, doc, _ = gql(go, token, query, variables)
              if status != 200 or not doc or doc.get("errors") or not doc.get("data"):
                  fail(f"legacy {name} unsuccessful {status} {doc}")
              saved[name] = {"status": status, "body": scrub(doc), "query": query, "variables": variables}
              print("CAPTURED", name)

          capture("list", list_query, {"limit": 10, "windowDays": 30})
          capture("detail", detail_query, {"id": "newsevta0000000000000001"})
          capture("brief", brief_query, {"eventId": "newsevta0000000000000001"})
          capture("refs", refs_query, {"eventId": "newsevta0000000000000001", "articleIds": ["newsarta00000000000000001", "newsartb00000000000000001"]})
          subprocess.check_call(["docker", "exec", redis, "redis-cli", "EVAL", "local ks = redis.call('KEYS', ARGV[1]) for i=1,#ks do redis.call('DEL', ks[i]) end return #ks", "0", "items:*groups:*"])
          capture("groups", groups_query, {})
          open("/tmp/news-legacy.json", "w").write(json.dumps(saved))
          open("/tmp/news-token", "w").write(token_a)
          open("/tmp/news-token-b", "w").write(token_b)
          print("legacy captured")
          PY
          source /tmp/start-go.sh
          start_go go
          python3 - << 'PY'
          import json, urllib.error, urllib.request
          go = "http://127.0.0.1:4020"
          token_a = open("/tmp/news-token").read()
          token_b = open("/tmp/news-token-b").read()
          saved = json.loads(open("/tmp/news-legacy.json").read())

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def call(path, method="GET", token=None, payload=None):
              headers = {}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(go + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=40) as resp:
                      return resp.status, json.loads(resp.read() or b"null")
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try:
                      doc = json.loads(raw)
                  except Exception:
                      doc = {"raw": raw[:400].decode("utf-8", "replace")}
                  return exc.code, doc

          def scrub(value):
              if isinstance(value, dict):
                  return {k: scrub(v) for k, v in value.items() if k not in ("traceId", "locations", "stack", "originalError")}
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              return value

          def same_payload(left, right):
              if isinstance(left, dict) and isinstance(right, dict):
                  if left.keys() != right.keys():
                      return False
                  return all(same_payload(left[key], right[key]) for key in left)
              if isinstance(left, list) and isinstance(right, list):
                  return len(left) == len(right) and all(same_payload(a, b) for a, b in zip(left, right))
              if isinstance(left, (int, float)) and isinstance(right, (int, float)) and not isinstance(left, bool) and not isinstance(right, bool):
                  return abs(float(left) - float(right)) < 0.05
              return left == right

          def gql(token, query, variables):
              return call("/graphql", "POST", token, {"query": query, "variables": variables or {}})

          for name, case in saved.items():
              if name == "groups":
                  import subprocess
                  redis = subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=redis:7.2"], text=True).split()[0]
                  subprocess.check_call(["docker", "exec", redis, "redis-cli", "EVAL", "local ks = redis.call('KEYS', ARGV[1]) for i=1,#ks do redis.call('DEL', ks[i]) end return #ks", "0", "items:*groups:*"])
              status, doc = gql(token_a, case["query"], case["variables"])
              if status != case["status"] or not same_payload(case["body"], scrub(doc)):
                  fail(f"{name} legacy/go mismatch status {case['status']} vs {status}\nLEGACY {json.dumps(case['body'], ensure_ascii=False)[:1000]}\nGO {json.dumps(scrub(doc), ensure_ascii=False)[:1000]}")
