                                  normalized_profile("sd-r", "r", rerankModel="r")], active="sd-a"))

          status, raw = status_of(BASE, "GET", platform)
          fresh("S5-01 list", status == 200 and ids_of(body(raw) or {}) == ["sd-a", "sd-e", "sd-r"], short(raw))
          status, raw = status_of(BASE, "POST", platform,
                                  {"name": "sd-created", "apiBase": DEFAULT_API_BASE, "model": "m"})
          created = body(raw) or {}
          fresh("S5-02 create", status == 201, short(raw))
          assert_uuid_and_window("S5-02 create", created)
          status, raw = status_of(BASE + "/" + created["id"], "PUT", platform, {"name": "sd-created-updated"})
          fresh("S5-03 update", status == 200 and (body(raw) or {}).get("name") == "sd-created-updated", short(raw))
          status, raw = status_of(ACTIVE, "PUT", platform, {"activeId": "sd-a"})
          fresh("S5-04 completion activation", status == 200 and (body(raw) or {}).get("activeId") == "sd-a",
                short(raw))
          status, raw = status_of(EMBEDDING_ACTIVE, "PUT", platform, {"activeId": "sd-e"})
          fresh("S5-05 embedding activation",
                status == 200 and (body(raw) or {}).get("embeddingActiveId") == "sd-e", short(raw))
          status, raw = status_of(RERANK_ACTIVE, "PUT", platform, {"activeId": "sd-r"})
          fresh("S5-06 rerank activation", status == 200 and (body(raw) or {}).get("rerankActiveId") == "sd-r",
                short(raw))
          status, raw = status_of(BASE + "/" + created["id"], "DELETE", platform)
          fresh("S5-07 delete", status == 200 and body(raw) == {"ok": True}, short(raw))
          print("OK S5-01..07 seven routes are served by Go with NestJS stopped")

          machine_allow = open("/tmp/lgp-mtok-allow").read().strip()
          status, raw = status_of(BASE, "GET", machine_allow)
          fresh("S5-08 machine token list", status == 200, short(raw))
          status, raw = status_of(BASE, "POST", machine_allow,
                                  {"name": "sd-machine", "apiBase": DEFAULT_API_BASE, "model": "m"})
          fresh("S5-08 machine token write is the platform 403",
                status == 403 and message(raw) == PLATFORM_MESSAGE, "status=" + str(status) + " " + short(raw))
          status, raw = status_of(BASE, "POST", token("a"), {"name": "sd-a-write", "apiBase": DEFAULT_API_BASE,
                                                             "model": "m"})
          fresh("S5-09 ordinary org admin write is the platform 403",
                status == 403 and message(raw) == PLATFORM_MESSAGE, "status=" + str(status) + " " + short(raw))
          status, raw = status_of(BASE, "GET", token("a"))
          fresh("S5-09 ordinary org admin can still list", status == 200, short(raw))
          status, raw = status_of(BASE, "GET", token("x"))
          fresh("S5-10 platform role without settings.manage is a permission 403",
                status == 403 and message(raw) == "Insufficient permissions", "status=" + str(status) + " " + short(raw))
          revoked = token("revoked")
          for label, method, path, payload in (("list", "GET", BASE, None),
                                               ("write", "POST", BASE,
                                                {"name": "sd-revoked", "apiBase": DEFAULT_API_BASE, "model": "m"})):
              status, raw = status_of(path, method, revoked, payload)
              fresh("S5-11 a revoked JWT is still 401 on " + label, status == 401,
                    "status=" + str(status) + " " + short(raw))
          print("OK S5-08..11 machine/admin/revoked identities with NestJS stopped")

          seed_settings(document([normalized_profile("sd-other", "other")]),)
          seed_governance(True, "sd-gov")
          status, raw = status_of(BASE + "/sd-gov", "DELETE", platform)
          fresh("S5-12 governance target protection still holds",
                status == 400 and message(raw) == GOV_DELETE_MESSAGE, "status=" + str(status) + " " + short(raw))

          # GP2 陈旧缓存：DB 有 A/B 而缓存只有 A → 新建 C 必须得到 A/B/C。
          db_ab = document([normalized_profile("sd-gp2-a", "a"), normalized_profile("sd-gp2-b", "b")],
                           active="sd-gp2-a")
          seed_settings(db_ab, cache=document([normalized_profile("sd-gp2-a", "a")], active="sd-gp2-a"))
          status, raw = status_of(BASE, "POST", platform,
                                  {"name": "sd-gp2-c", "apiBase": DEFAULT_API_BASE, "model": "m"})
          new_id = (body(raw) or {}).get("id")
          fresh("S5-13 GP2 stale cache regression still holds",
                status == 201 and sorted(ids_of(read_settings())) == sorted(["sd-gp2-a", "sd-gp2-b", new_id]),
                short(raw))
          rotated = json.load(open("/tmp/lgp-rotated-envelope.json"))
          seed_settings(document([normalized_profile("sd-gp2-a", "a"),
                                  normalized_profile("sd-gp2-b", "b", apiKey=rotated)], active="sd-gp2-a"),
                        cache=document([normalized_profile("sd-gp2-b", "b", apiKey=API_KEY_STALE)]))
          status, raw = status_of(BASE + "/sd-gp2-b", "PUT", platform, {"name": "sd-gp2-b-renamed"})
          stored_b = [item for item in read_settings()["profiles"] if item["id"] == "sd-gp2-b"][0]
          fresh("S5-13 GP2 rotated-key regression still holds",
                status == 200 and canon(stored_b.get("apiKey")) == canon(rotated)
                and decrypt_envelope(stored_b["apiKey"]) == API_KEY_ROTATED, short(raw))

          variant_doc = document([normalized_profile("sd-gp3", "gp3", embeddingModel="e", rerankModel="r")],
                                 active="sd-gp3", embedding_active="sd-gp3", rerank_active="sd-gp3")
          variant_doc["profiles"][0]["enabled"] = "true"
          seed_settings(variant_doc)
          status, raw = status_of(BASE, "GET", platform)
          listed = body(raw) or {}
          fresh("S5-14 GP3 enabled repair still holds",
                listed.get("profiles", [{}])[0].get("enabled") is False and listed.get("activeId") is None
                and listed.get("embeddingActiveId") is None and listed.get("rerankActiveId") is None,
                json.dumps(listed)[:200])
          print("OK S5-12..14 governance, GP2 and GP3 regressions with NestJS stopped")

          seed_settings(document([normalized_profile("sd-id", "sd-id", embeddingModel="e", rerankModel="r")],
                                 active="sd-id"))
          unmigrated = (
              ("GET /proxy-governance", "GET", PROXY_GOVERNANCE, None),
              ("PUT /proxy-governance", "PUT", PROXY_GOVERNANCE, {"enabled": False}),
              ("DELETE /proxy-governance", "DELETE", PROXY_GOVERNANCE, None),
              ("GET /proxy-load-balancing", "GET", PROXY_LOAD_BALANCING, None),
              ("PUT /proxy-load-balancing", "PUT", PROXY_LOAD_BALANCING, {"enabled": False}),
              ("DELETE /proxy-load-balancing", "DELETE", PROXY_LOAD_BALANCING, None),
              ("POST /proxy-governance/preflight", "POST", PROXY_GOVERNANCE + "/preflight", {"targetProfileId": None}),
              ("POST /proxy-governance/rotate-key", "POST", PROXY_GOVERNANCE + "/rotate-key", None),
              ("POST /test-config", "POST", BASE + "/test-config", {"apiBase": DEFAULT_API_BASE, "model": "m"}),
              ("POST /models-config", "POST", BASE + "/models-config", {"apiBase": DEFAULT_API_BASE, "apiKey": None}),
              ("GET /:id/models", "GET", BASE + "/sd-id/models", None),
              ("POST /:id/test", "POST", BASE + "/sd-id/test", {"message": "ping"}),
              ("GET /:id/proxy-health", "GET", BASE + "/sd-id/proxy-health", None),
              ("GET /:id/proxy-model-info", "GET", BASE + "/sd-id/proxy-model-info", None),
              ("POST /:id/proxy-lb-test", "POST", BASE + "/sd-id/proxy-lb-test", {"message": "ping"}),
          )
          for label, method, path, payload in unmigrated:
              status, raw = status_of(path, method, platform, payload)
              doc = body(raw) or {}
              fresh("S5-15 " + label + " stays on NestJS and answers 502",
                    status == 502 and doc.get("statusCode") == 502,
                    "status=" + str(status) + " body=" + short(raw))
              fresh("S5-15 " + label + " must not be a Go profile error",
                    doc.get("message") != NOT_FOUND_MESSAGE and status not in (400, 404),
                    "status=" + str(status) + " body=" + short(raw))
          # 承重断言：这四个路径与 /:id 形状完全相同，Go 必须原样转发给 NestJS，
          # 绝不能回一个 Go 的 profile 404/400。
          for label, method, path, payload in (("PUT /proxy-governance", "PUT", PROXY_GOVERNANCE, {"enabled": False}),
                                               ("DELETE /proxy-governance", "DELETE", PROXY_GOVERNANCE, None),
                                               ("PUT /proxy-load-balancing", "PUT", PROXY_LOAD_BALANCING,
                                                {"enabled": False}),
                                               ("DELETE /proxy-load-balancing", "DELETE", PROXY_LOAD_BALANCING, None)):
              status, raw = status_of(path, method, platform, payload)
              doc = body(raw) or {}
              fresh("S5-16 " + label + " must be forwarded, not answered as a profile",
                    status == 502 and doc.get("statusCode") == 502
                    and doc.get("message") != NOT_FOUND_MESSAGE
                    and doc.get("code") != "INSUFFICIENT_PERMISSIONS",
                    "status=" + str(status) + " body=" + short(raw))
          print("OK S5-15/S5-16 all unmigrated paths answer exactly 502 (never a Go profile 400/404)")
          PY
      - name: Stage 6 rollback to legacy
        run: |
          set -euo pipefail
          source /tmp/lgp-start-go.sh
          BEFORE=$(docker exec -i "$(docker ps -q -f ancestor=mysql:8.4 | head -n1)" \
            mysql -uroot -psecret -N app -e "SELECT CAST(value AS CHAR) FROM SystemSetting WHERE \`key\`='llm_gateway_profiles'" 2>/dev/null)
          start_go legacy "$SYSTEM_SETTINGS_ENCRYPTION_KEY"
          start_nest "$SYSTEM_SETTINGS_ENCRYPTION_KEY"
          AFTER=$(docker exec -i "$(docker ps -q -f ancestor=mysql:8.4 | head -n1)" \
            mysql -uroot -psecret -N app -e "SELECT CAST(value AS CHAR) FROM SystemSetting WHERE \`key\`='llm_gateway_profiles'" 2>/dev/null)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "rollback migrated the llm_gateway_profiles row"
            exit 1
          fi
          echo "OK rollback needs no data migration"
          if docker logs api-go-llm-gateway-profiles-smoke 2>&1 | grep -qF "llm gateway profiles takeover mode="; then
            echo "rollback still registered the llm gateway takeover"
            exit 1
          fi
          python3 - << 'PY'
          import json, sys
          sys.path.insert(0, "/tmp")
          from lgp_lib import *

          def fresh(label, condition, detail=""):
              if not condition:
                  fail(label + ": " + detail)

          p = token("p")
          base_doc = document([normalized_profile("rb-a", "a", embeddingModel="e", rerankModel="r"),
                               normalized_profile("rb-e", "e", embeddingModel="e"),
                               normalized_profile("rb-r", "r", rerankModel="r")], active="rb-a")
          seed = lambda: seed_settings(base_doc)

          pair("S6-01 GET list is proxied again", "GET", BASE, p, seed=seed)
          pair("S6-02 create is proxied again", "POST", BASE, p,
               {"name": "rb-create", "apiBase": DEFAULT_API_BASE, "model": "m"}, expected=201, seed=seed,
               normalize_response=map_profile_response, normalize_document=map_new_profile(["rb-a", "rb-e", "rb-r"]))
          pair("S6-03 update is proxied again", "PUT", BASE + "/rb-a", p, {"name": "rb-a-updated"}, expected=200,
               seed=seed, normalize_response=map_updated_profile("rb-a"),
               normalize_document=map_updated_profile("rb-a"))
          pair("S6-04 delete is proxied again", "DELETE", BASE + "/rb-a", p, None, expected=200, seed=seed)
          pair("S6-05 completion activation is proxied again", "PUT", ACTIVE, p, {"activeId": "rb-a"},
               expected=200, seed=seed)
          pair("S6-06 embedding activation is proxied again", "PUT", EMBEDDING_ACTIVE, p, {"activeId": "rb-e"},
               expected=200, seed=seed)
          pair("S6-07 rerank activation is proxied again", "PUT", RERANK_ACTIVE, p, {"activeId": "rb-r"},
               expected=200, seed=seed)

          # Nest 必须能读取 Go 写入的 profile、激活选择与密文。
          envelope = json.load(open("/tmp/lgp-rotated-envelope.json"))
          go_doc = document([normalized_profile("rb-go", "go-written", apiKey=envelope),
                             normalized_profile("rb-go-emb", "go-emb", embeddingModel="e")],
                            active="rb-go", embedding_active="rb-go-emb", rerank_active=None,
                            embedding_mode="use_default", rerank_mode="use_default")
          seed_settings(go_doc)
          status, raw = call(NEST, BASE, "GET", p)
          listed = body(raw) or {}
          entry = [item for item in listed.get("profiles", []) if item["id"] == "rb-go"]
          fresh("S6-08 Nest reads what Go wrote",
                status == 200 and entry and entry[0].get("hasApiKey") is True
                and listed.get("activeId") == "rb-go"
                and listed.get("embeddingActiveId") == "rb-go-emb"
                and listed.get("embeddingMode") == "use_default"
                and listed.get("rerankMode") == "use_default",
                json.dumps(listed)[:300])
          stored = read_settings()
          fresh("S6-08 Nest reads what Go wrote", stored.get("activeId") == "rb-go"
                and decrypt_envelope(stored["profiles"][0]["apiKey"]) == API_KEY_ROTATED,
                "the Go-written ciphertext is not readable")

          status, raw = call(GO, "/api/system-settings/security", "GET", p)
          fresh("S6-09 the legacy fallback keeps every other route on NestJS", status == 200,
                "status=" + str(status) + " " + short(raw))
          status, raw = call(NEST, BASE, "GET", p)
          go_status, go_raw = call(GO, BASE, "GET", p)
          fresh("S6-09 the Web entry point is unchanged", status == 200 and go_status == 200
                and canon(body(raw)) == canon(body(go_raw)), short(raw))
          env_dump = subprocess.run(["docker", "inspect", "--format", "{{range .Config.Env}}{{println .}}{{end}}",
                                     "api-go-llm-gateway-profiles-smoke"], text=True, capture_output=True).stdout
          fresh("S6-10 canary stays 0", "CANARY_PERCENT=0" in env_dump and "CANARY_PERCENT=100" not in env_dump,
                "the canary switch changed")
          git_status = subprocess.run(["git", "status", "--porcelain", "--", "apps/web"], text=True,
                                      capture_output=True).stdout.strip()
          fresh("S6-11 apps/web is untouched by this batch", git_status == "", git_status[:200])
          print("OK stage 6 rollback: seven routes proxy again and no data migration was needed")
          PY



