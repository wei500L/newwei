      - name: Stage 2 GP1 permission regression
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, sys
          sys.path.insert(0, "/tmp")
          from lgp_lib import *

          def writes():
              return [
                  ("create", "POST", BASE, {"name": "gp1-create", "apiBase": DEFAULT_API_BASE, "model": "m"}, 201),
                  ("update", "PUT", BASE + "/gp1-a", {"name": "gp1-update"}, 200),
                  ("completion activation", "PUT", ACTIVE, {"activeId": "gp1-a"}, 200),
                  ("embedding activation", "PUT", EMBEDDING_ACTIVE, {"activeId": "gp1-e"}, 200),
                  ("rerank activation", "PUT", RERANK_ACTIVE, {"activeId": "gp1-r"}, 200),
                  ("delete", "DELETE", BASE + "/gp1-a", None, 200),
              ]

          def seed_doc():
              seed_settings(
                  document([normalized_profile("gp1-a", "a", embeddingModel="e", rerankModel="r"),
                            normalized_profile("gp1-e", "e", embeddingModel="e"),
                            normalized_profile("gp1-r", "r", rerankModel="r")], active="gp1-a"),
                  cache=document([normalized_profile("gp1-a", "a", embeddingModel="e", rerankModel="r")],
                                 active="gp1-a"))

          def assert_insufficient(label, doc):
              for key, value in INSUFFICIENT_BODY.items():
                  if (doc or {}).get(key) != value:
                      fail(label + ": " + key + " = " + repr((doc or {}).get(key)) + " want " + repr(value))
              if (doc or {}).get("missingPermissions") is not None:
                  fail(label + ": missingPermissions must be absent for the any-mode gate")

          machine_allow = open("/tmp/lgp-mtok-allow").read().strip()

          def stage2(base, tag):
              lower_writers = (
                  ("ordinary org admin A", token("a")),
                  ("ordinary org admin B", token("b")),
                  ("settings.manage machine token", machine_allow),
              )
              for who, bearer in lower_writers:
                  for label, method, path, payload, _expected in writes():
                      seed_doc()
                      before = state_fingerprint()
                      status, raw = call(base, path, method, bearer, payload)
                      doc = body(raw) or {}
                      check(tag + " GP1 " + who + " rejected on " + label,
                            status == 403 and doc.get("message") == PLATFORM_MESSAGE and doc.get("error") == "Forbidden",
                            "status=" + str(status) + " body=" + short(raw))
                      check(tag + " GP1 " + who + " rejected on " + label + " without touching state",
                            state_fingerprint() == before, "document/audit/cache changed")
                  print("OK", tag, "GP1", who, "403 on all six writes with unchanged state")

              for who, bearer in (("platform role without settings.manage", token("x")),
                                  ("user without settings.manage", token("n"))):
                  for label, method, path, payload, _expected in writes():
                      seed_doc()
                      before = state_fingerprint()
                      status, raw = call(base, path, method, bearer, payload)
                      assert_insufficient(tag + " GP1 " + who + " rejected on " + label, body(raw))
                      check(tag + " GP1 " + who + " rejected on " + label, status == 403,
                            "status=" + str(status) + " body=" + short(raw))
                      check(tag + " GP1 " + who + " rejected on " + label + " without touching state",
                            state_fingerprint() == before, "document/audit/cache changed")
                  print("OK", tag, "GP1", who, "403 INSUFFICIENT_PERMISSIONS on all six writes")

              for who, bearer in (("ordinary org admin A", token("a")), ("ordinary org admin B", token("b")),
                                  ("settings.manage machine token", machine_allow),
                                  ("platform admin P", token("p"))):
                  status, raw = call(base, BASE, "GET", bearer)
                  check(tag + " GP1 " + who + " can read the list", status == 200,
                        "status=" + str(status) + " body=" + short(raw))
              for who, bearer in (("user without settings.manage", token("n")),
                                  ("platform role without settings.manage", token("x"))):
                  status, raw = call(base, BASE, "GET", bearer)
                  assert_insufficient(tag + " GP1 " + who + " cannot read the list", body(raw))
                  check(tag + " GP1 " + who + " cannot read the list", status == 403, str(status))
              print("OK", tag, "GP1 list permission matrix")

              seed_doc()
              for label, method, path, payload, expected in writes():
                  status, raw = call(base, path, method, token("p"), payload)
                  check(tag + " GP1 platform admin P succeeds on " + label, status == expected,
                        "status=" + str(status) + " want " + str(expected) + " " + short(raw))
              print("OK", tag, "GP1 platform admin P succeeds on all six writes")

              invalid = {"name": "x", "apiBase": DEFAULT_API_BASE, "model": "m", "bogus": 1}
              valid = {"name": "x", "apiBase": DEFAULT_API_BASE, "model": "m"}
              seed_doc()
              before = state_fingerprint()
              status, raw = call(base, BASE, "POST", token("a"), invalid)
              check(tag + " GP1 invalid DTO is answered before the platform gate",
                    status == 400 and message(raw) == "property bogus should not exist",
                    "status=" + str(status) + " body=" + short(raw))
              check(tag + " GP1 invalid DTO leaves state unchanged", state_fingerprint() == before,
                    "a rejected DTO changed state")
              status, raw = call(base, BASE, "POST", token("a"), valid)
              check(tag + " GP1 valid DTO reaches the platform gate",
                    status == 403 and message(raw) == PLATFORM_MESSAGE, "status=" + str(status) + " " + short(raw))
              print("OK", tag, "GP1 gate order: authentication -> settings.manage -> DTO -> platform gate")

          for base, tag in ((NEST, "nest"), (GO, "go")):
              stage2(base, tag)
          print("stage 2 GP1 permission regression complete")
          PY
      - name: Stage 3 GP2 stale cache, concurrency and the write lock
        run: |
          set -euo pipefail
          cat > /tmp/lgp_stage3.py << 'PYSTAGE3'
          import json, sys
          sys.path.insert(0, "/tmp")
          from lgp_lib import *

          def norm(pid, name, **extra):
              return normalized_profile(pid, name, **extra)

          def fresh(label, condition, detail=""):
              if not condition:
                  fail(label + ": " + detail)

          def gp2_stale_cache(base, tag):
              a_id, b_id = "gp2-a", "gp2-b"
              e_id, r_id = "gp2-e", "gp2-r"

              db_ab = document([norm(a_id, "a"), norm(b_id, "b")], active=a_id)
              stale_a = document([norm(a_id, "a")], active=a_id)
              seed_settings(db_ab, cache=stale_a)
              status, raw = call(base, BASE, "POST", token("p"),
                                 {"name": "gp2-c", "apiBase": DEFAULT_API_BASE, "model": "m"})
              fresh(tag + " GP2-01 a stale cache cannot drop concurrent profiles", status == 201, short(raw))
              created_id = (body(raw) or {}).get("id")
              stored = read_settings()
              fresh(tag + " GP2-01 a stale cache cannot drop concurrent profiles",
                    sorted(ids_of(stored)) == sorted([a_id, b_id, created_id]),
                    "stored ids=" + json.dumps(ids_of(stored)))

              seed_settings(document([profile("gp2-key", "k")]))
              call(NEST, BASE + "/gp2-key", "PUT", token("p"), {"apiKey": API_KEY_ROTATED})
              rotated = read_settings()["profiles"][0]["apiKey"]
              fresh(tag + " GP2-02 rotate seed", isinstance(rotated, dict), "no envelope was produced")
              db_rotated = document([norm(a_id, "a"), norm(b_id, "b", apiKey=rotated)], active=a_id)
              stale_old_key = document([norm(a_id, "a"), norm(b_id, "b", apiKey=API_KEY_STALE)], active=a_id)
              seed_settings(db_rotated, cache=stale_old_key)
              status, raw = call(base, BASE + "/" + b_id, "PUT", token("p"), {"name": "gp2-b-renamed"})
              doc = body(raw) or {}
              fresh(tag + " GP2-02 a stale cache cannot restore a rotated apiKey",
                    status == 200 and doc.get("hasApiKey") is True and doc.get("name") == "gp2-b-renamed",
                    "status=" + str(status) + " " + short(raw))
              stored_b = [item for item in read_settings()["profiles"] if item["id"] == b_id][0]
              fresh(tag + " GP2-02 a stale cache cannot restore a rotated apiKey",
                    canon(stored_b.get("apiKey")) == canon(rotated)
                    and decrypt_envelope(stored_b["apiKey"]) == API_KEY_ROTATED,
                    "the stored key was replaced by the stale plaintext")

              db_selected = document([norm(a_id, "a"), norm(e_id, "e", embeddingModel="e"),
                                      norm(r_id, "r", rerankModel="r")],
                                     active=a_id, embedding_active=e_id, rerank_active=r_id)
              stale_selected = document([norm(a_id, "a")], active=a_id)
              seed_settings(db_selected, cache=stale_selected)
              status, raw = call(base, ACTIVE, "PUT", token("p"), {"activeId": a_id})
              doc = body(raw) or {}
              fresh(tag + " GP2-03 a stale cache cannot restore the other selections",
                    status == 200 and doc.get("embeddingActiveId") == e_id and doc.get("rerankActiveId") == r_id,
                    "status=" + str(status) + " " + json.dumps(doc)[:200])
              stored = read_settings()
              fresh(tag + " GP2-03 a stale cache cannot restore the other selections",
                    stored.get("embeddingActiveId") == e_id and stored.get("rerankActiveId") == r_id,
                    "stored selections=" + json.dumps(doc)[:200])

              for label, cache_doc in (("cache matches the DB", db_ab), ("cache is older than the DB", stale_a)):
                  seed_settings(db_ab, cache=cache_doc)
                  status, raw = call(base, BASE + "/" + a_id, "DELETE", token("p"))
                  fresh(tag + " GP2-04 a deleted profile is not resurrected (" + label + ")",
                        status == 200, "status=" + str(status) + " " + short(raw))
