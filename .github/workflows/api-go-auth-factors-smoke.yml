          # ---- 加密信封（与 NestJS storage-settings.crypto v1 同格式） ----
          def encrypt_v1(plain, key=None):
              script = (
                  "const c=require('node:crypto');"
                  "const [plain,key]=process.argv.slice(1);"
                  "const iv=c.randomBytes(12);"
                  "const ci=c.createCipheriv('aes-256-gcm',Buffer.from(key,'hex'),iv);"
                  "const data=Buffer.concat([ci.update(Buffer.from(plain,'utf8')),ci.final()]);"
                  "process.stdout.write(JSON.stringify({__enc:'system-settings:v1',alg:'aes-256-gcm',"
                  "iv:iv.toString('base64'),tag:ci.getAuthTag().toString('base64'),"
                  "data:data.toString('base64')}));"
              )
              proc = subprocess.run(["node", "-e", script, plain, key or VALID_KEY],
                                    capture_output=True, text=True)
              if proc.returncode != 0:
                  fail("v1 encryption failed: " + proc.stderr[-300:])
              return json.loads(proc.stdout)


          def decrypt_v1(envelope, key=None):
              if not isinstance(envelope, dict) or envelope.get("__enc") != "system-settings:v1":
                  fail("expected a v1 envelope, got " + json.dumps(envelope)[:200])
              script = (
                  "const c=require('node:crypto');"
                  "const [iv,tag,data,key]=process.argv.slice(1);"
                  "const d=c.createDecipheriv('aes-256-gcm',Buffer.from(key,'hex'),Buffer.from(iv,'base64'));"
                  "d.setAuthTag(Buffer.from(tag,'base64'));"
                  "process.stdout.write(Buffer.concat([d.update(Buffer.from(data,'base64')),d.final()]).toString('utf8'));"
              )
              proc = subprocess.run(["node", "-e", script, envelope["iv"], envelope["tag"], envelope["data"],
                                     key or VALID_KEY], capture_output=True, text=True)
              if proc.returncode != 0:
                  fail("v1 decryption failed: " + proc.stderr[-300:])
              return proc.stdout


