          # ---- HTTP helpers ----
          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          NO_REDIRECT = urllib.request.build_opener(_NoRedirect)


          def call_headers(base, path, method="GET", token=None, payload=None, timeout=60, follow=True):
              headers = {}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              opener = urllib.request.urlopen if follow else NO_REDIRECT.open
              try:
                  with opener(req, timeout=timeout) as resp:
                      return resp.status, resp.read(), dict(resp.headers)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(), dict(exc.headers)


          def call(base, path, method="GET", token=None, payload=None, timeout=60):
              status, raw, _ = call_headers(base, path, method, token, payload, timeout)
              return status, raw


          def body(raw):
              if not raw:
                  return None
              text = raw.decode("utf-8", "replace").strip()
              if not text:
                  return None
              try:
                  return json.loads(text)
              except ValueError:
                  return None


          def parse_json_text(text):
              if text is None or text == "":
                  return None
              try:
                  return json.loads(text)
              except ValueError:
                  return text


          def message_of(raw):
              doc = body(raw) or {}
              text = doc.get("message")
              if isinstance(text, list):
                  return "; ".join(str(item) for item in text)
              return text


          def canon(value):
              if isinstance(value, dict):
                  if value.get("__enc") == "system-settings:v1":
                      return "<encrypted>"
                  out = {}
                  for key, item in value.items():
                      if key in ("traceId", "timestamp", "path", "updatedAt"):
                          out[key] = "<ts>"
                      else:
                          out[key] = canon(item)
                  return out
              if isinstance(value, list):
                  return [canon(item) for item in value]
              return value


          def request_json(label, base, method, path, token=None, payload=None, expected=200,
                           expected_message=None, timeout=60):
              status, raw = call(base, path, method, token, payload, timeout)
              if status != expected:
                  fail(f"{label}: {method} {path} -> {status} {raw[:400]!r}, want {expected}")
              if expected_message is not None:
                  got = message_of(raw)
                  if got != expected_message:
                      fail(f"{label}: message {got!r} want {expected_message!r} raw={raw[:400]!r}")
              return body(raw)


          def request_status(label, base, method, path, token=None, payload=None, expected=200,
