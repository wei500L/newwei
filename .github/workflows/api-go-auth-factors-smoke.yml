          p_recovery_disable_go = "af-smoke-p20"
          p_recovery_states_nest = "af-smoke-p21"
          p_recovery_states_go = "af-smoke-p22"
          p_public_login = "af-smoke-p23"

          POOL_USERS = [
              p_closed_nest, p_closed_go, p_interop_go_enroll, p_interop_nest_enroll,
