          # ---- fixtures ----
          org_a = "af-smoke-org-a"
          org_b = "af-smoke-org-b"
          org_c = "af-smoke-org-c"
          role_settings_a = "af-smoke-role-settings-a"
          role_plain_a = "af-smoke-role-plain-a"
          role_settings_b = "af-smoke-role-settings-b"
          role_plain_b = "af-smoke-role-plain-b"
