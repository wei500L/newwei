          def totp_window_matrix(base, label, user_id, token):
              print("---- " + label + " TOTP window / trim / leading zero ----")
              secret = "JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP"

              def reseed(candidate):
                  reset_factor(user_id)
                  seed_factor(user_id, candidate, verified=False)

              # counter-1 / counter / counter+1 都必须被接受。
              for offset in (-1, 0, 1):
                  reseed(secret)
                  doc = request_json(label + " window %+d" % offset, base, "POST", VERIFY_ENROLL_PATH,
                                     token, {"code": totp_now(secret, offset)}, 201)
                  require_codes_match_db(label + " window %+d" % offset, user_id, doc["recoveryCodes"])
              # counter-2 / counter+2 必须被拒绝。
              for offset in (-2, 2):
                  reseed(secret)
                  request_json(label + " outside window %+d" % offset, base, "POST",
                               VERIFY_ENROLL_PATH, token, {"code": totp_now(secret, offset)}, 400,
                               INVALID_CODE)
              # trim：前后空白仍然接受。
              reseed(secret)
              request_json(label + " trimmed code", base, "POST", VERIFY_ENROLL_PATH, token,
                           {"code": "  " + totp_now(secret) + "  "}, 201)
              # 形态：TOTP 分支只接受 trim 后恰好六位数字。
              # 5 字符先被 DTO 的 @MinLength(6) 拦下（Nest 的管道与 Go 的
              # DTO 解析都早于 service 的 TOTP 分支），其余 6 字符及以上的
              # 畸形码才进入 service 并被拒绝。
              reseed(secret)
              request_json(label + " malformed short code", base, "POST", VERIFY_ENROLL_PATH,
                           token, {"code": "12345"}, 400,
                           "code must be longer than or equal to 6 characters")
              for bad in ("1234567", "12a456", "12345 ", " 12345"):
                  reseed(secret)
                  request_json(label + " malformed " + repr(bad), base, "POST", VERIFY_ENROLL_PATH,
                               token, {"code": bad}, 400, INVALID_CODE)
              # 前导零：找一个当前窗口代码以 '0' 开头的 secret，服务端必须保留补零。
              # 代码只在找到候选的那一刻计算一次并原样发送：服务端接受
              # counter-1/0/+1，所以即便请求跨过 30 秒窗口边界仍然成立；重新
              # 计算会引入跨窗口抖动（曾观察到 235488 这类非零前缀）。
              leading = None
              code = None
              for _ in range(400):
                  candidate = random_secret()
                  candidate_code = totp_now(candidate)
                  if candidate_code.startswith("0"):
                      leading = candidate
                      code = candidate_code
                      break
              if leading is None or code is None:
                  fail(label + " leading zero: no secret with a zero-prefixed current code found")
              if len(code) != 6:
                  fail(label + " leading zero: local code is not six digits: " + code)
              reseed(leading)
              doc = request_json(label + " leading zero code " + code, base, "POST", VERIFY_ENROLL_PATH,
                                 token, {"code": code}, 201)
              require_codes_match_db(label + " leading zero code", user_id, doc["recoveryCodes"])
              reset_factor(user_id)
              print(label + " ok: TOTP accepts counter-1/0/+1, rejects +/-2, trims, keeps leading zeros")


          def machine_actor_matrix():
              print("---- machine identities ----")
              allow_actor = "machine:" + mtk_allow + "-row"
              deny_actor = "machine:" + mtk_deny + "-row"
              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  for token, expected, label in ((mtk_allow, 200, "allow"),
                                                 (mtk_deny, 200, "deny")):
                      doc = request_json("B machine GET mfa " + label + " " + side, base, "GET", MFA_PATH,
                                         token, None, expected)
                      require_keys("B machine GET mfa " + label + " " + side, doc, MFA_STATUS_KEYS)
                      require("B machine GET mfa " + label + " " + side, canon(doc),
                              {"enabled": False, "enrolledAt": None, "verifiedAt": None,
                               "lastUsedAt": None, "recoveryCodesRemaining": 0})
                  # settings.manage 门禁：带权限 200 / 不带权限 403（claim 不参与）。
                  doc = request_json("B machine oidc allow " + side, base, "GET", OIDC_PATH, mtk_allow,
                                     None, 200)
                  require_keys("B machine oidc allow " + side, doc, OIDC_KEYS)
                  status, raw = call(base, OIDC_PATH, "GET", mtk_deny, None)
                  if status != 403:
                      fail("B machine oidc deny %s -> %s %r, want 403" % (side, status, raw[:300]))
                  require_error_body("B machine oidc deny " + side, raw, 403, PERMISSION_MESSAGE,
                                     "Forbidden")
                  require("B machine oidc deny code " + side, (body(raw) or {}).get("code"),
                          PERMISSION_CODE)
                  # 过期 / 撤销的机器令牌：401 Invalid machine token。
                  for token, label in ((mtk_expired, "expired"), (mtk_revoked, "revoked")):
                      status, raw = call(base, MFA_PATH, "GET", token, None)
                      if status != 401 or message_of(raw) != "Invalid machine token":
                          fail("B machine GET mfa %s %s -> %s %r, want 401 Invalid machine token"
                               % (label, side, status, raw[:300]))
                  # 4 个写路由对机器身份 403，且绝不创建 factor 行。
                  for method, path, payload in (("POST", ENROLL_PATH, None),
                                                ("POST", VERIFY_ENROLL_PATH, {"code": "123456"}),
                                                ("POST", DISABLE_PATH, {"code": "123456"}),
                                                ("POST", ROTATE_PATH, {"code": "123456"})):
                      status, raw = call(base, path, method, mtk_allow, payload)
                      if status != 403:
                          fail("B machine write %s %s %s -> %s %r, want 403"
                               % (side, method, path, status, raw[:300]))
                      require_error_body("B machine write " + side + " " + method + " " + path, raw,
                                         403, HUMAN_REQUIRED, "Forbidden")
                  require("B machine factor row allow", factor_state(allow_actor), None)
                  require("B machine factor row deny", factor_state(deny_actor), None)
              print("machine ok: GET empty state, OIDC settings.manage gate, writes 403, no factor rows")


          def set_system_security(doc_text):
              redis("DEL", SYSTEM_SECURITY_CACHE)
              if doc_text is None:
                  sql("DELETE FROM SystemSetting WHERE `key`='" + SYSTEM_SECURITY_KEY + "'")
              else:
                  sql("REPLACE INTO SystemSetting (`key`, value, isPublic, description, createdAt, "
                      "updatedAt, updatedById) VALUES ('" + SYSTEM_SECURITY_KEY + "', _utf8mb4'"
                      + sql_escape(doc_text) + "', 0, NULL, NOW(3), NOW(3), NULL)")


          def crypto_key_matrix():
              print("---- crypto policy matrix (wrong key / missing key / plaintext escape hatch) ----")
              secret_a = "JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP"
              secret_b = "KRSXG5CTMVRXEZLUKRSXG5CTMVRXEZLU"
              reset_factor(p_wrong_key)
              seed_factor(p_wrong_key, secret_a, verified=False)
              reset_factor(p_plain_key)
              seed_factor(p_plain_key, secret_b, verified=True)
              codes_b = [fixture_code(p_plain_key, index) for index in range(8)]
              seed_recovery_codes(p_plain_key, codes_b)
              reset_oidc(org_a)
              sql("INSERT INTO OrgOidcConfig (id, orgId, enabled, issuerUrl, discoveryUrl, clientId, "
                  "clientSecret, scopes, buttonLabel, requireEmailVerified, createdAt, updatedAt) VALUES ("
                  "'af-smoke-oidc-wrong', '" + org_a + "', 1, 'https://idp.example', NULL, 'client-x', "
                  "_utf8mb4'" + sql_escape(json.dumps(encrypt_v1("oidc-secret-value")))
                  + "', _utf8mb4'[\"openid\"]', NULL, 1, NOW(3), NOW(3))")
              before_state = factor_state(p_plain_key)
              before_codes = recovery_rows(p_plain_key)

              start_nest(encryption_key=WRONG_KEY)
              start_go("go", encryption_key=WRONG_KEY)
              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  doc = request_json("B wrong key GET mfa " + side, base, "GET", MFA_PATH,
                                     TOKENS[p_wrong_key], None, 200)
                  require("B wrong key GET mfa " + side, canon(doc), expected_status(p_wrong_key))
                  doc = request_json("B wrong key GET mfa active " + side, base, "GET", MFA_PATH,
                                     TOKENS[p_plain_key], None, 200)
                  require("B wrong key GET mfa active " + side, canon(doc), expected_status(p_plain_key))
                  doc = request_json("B wrong key oidc " + side, base, "GET", OIDC_PATH, w_a_token,
                                     None, 200)
                  require("B wrong key oidc hasClientSecret " + side, doc.get("hasClientSecret"), True)
                  if "oidc-secret-value" in json.dumps(doc):
                      fail("B wrong key oidc " + side + ": the response leaked the stored secret")
                  # 非活跃 factor → verify-enroll 真的去解密 → 生产 500。
                  status, raw = call(base, VERIFY_ENROLL_PATH, "POST", TOKENS[p_wrong_key],
                                     {"code": totp_now(secret_a)})
                  if status != 500:
                      fail("B wrong key verify-enroll %s -> %s %r, want 500" % (side, status, raw[:300]))
                  require_error_body("B wrong key verify-enroll " + side, raw, 500, INTERNAL_MESSAGE)
                  # disable/rotate 无论 TOTP 还是恢复码分支都先解密 → 500。
                  for method, path, payload in (("POST", DISABLE_PATH, {"code": totp_now(secret_b)}),
                                                ("POST", ROTATE_PATH, {"code": totp_now(secret_b)}),
                                                ("POST", ROTATE_PATH, {"code": codes_b[0]})):
                      status, raw = call(base, path, method, TOKENS[p_plain_key], payload)
                      if status != 500:
                          fail("B wrong key %s %s %s -> %s %r, want 500"
                               % (side, method, path, status, raw[:300]))
                      require_error_body("B wrong key " + side + " " + method + " " + path, raw, 500,
                                         INTERNAL_MESSAGE)
                  require("B wrong key factor untouched " + side, factor_state(p_plain_key), before_state)
                  require("B wrong key codes untouched " + side, recovery_rows(p_plain_key), before_codes)
              print("wrong key ok: 200 reads, 500 on every decrypting write, no state change")

              start_nest(encryption_key=None)
              start_go("go", encryption_key=None)
              # 生产环境缺 key：无论 secretEncryptionEnabled 是缺省、true 还是
              # false，都必须失败关闭（500）且不写 factor 行——绝不静默降级为明文。
              for security_doc, case_label in ((None, "absent"),
                                               ('{"secretEncryptionEnabled":true}', "enabled"),
                                               ('{"secretEncryptionEnabled":false}', "disabled")):
                  set_system_security(security_doc)
                  for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                      reset_factor(p_missing_key)
                      status, raw = call(base, ENROLL_PATH, "POST", TOKENS[p_missing_key], None)
                      if status != 500:
                          fail("B missing key (%s) enroll %s -> %s %r, want 500"
                               % (case_label, side, status, raw[:300]))
                      require_error_body("B missing key " + case_label + " " + side, raw, 500,
                                         INTERNAL_MESSAGE)
                      require("B missing key " + case_label + " " + side + " no factor",
                              factor_state(p_missing_key), None)
              print("missing key ok: production fails closed with 500 and never writes a factor row")
              set_system_security(None)
              start_nest()
              start_go("go")

              # 明文逃生门：有效 key + secretEncryptionEnabled=false → 明文 JSON
              # 字符串入库，且 TOTP 仍可用（decodeSecret 直接返回字符串）。
              set_system_security('{"secretEncryptionEnabled":false}')
              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  reset_factor(p_plain_key)
                  doc = request_json("B plaintext enroll " + side, base, "POST", ENROLL_PATH,
                                     TOKENS[p_plain_key], None, 201)
                  secret = doc["secret"]
                  state = factor_state(p_plain_key)
                  require("B plaintext stored " + side, parse_json_text(state[0]), secret)
                  if state[0].startswith("{"):
                      fail("B plaintext stored " + side + ": the secret was encrypted despite the "
                           "explicit plaintext policy: " + state[0][:120])
                  doc = request_json("B plaintext verify " + side, base, "POST", VERIFY_ENROLL_PATH,
                                     TOKENS[p_plain_key], {"code": totp_now(secret)}, 201)
                  require_codes_match_db("B plaintext verify " + side, p_plain_key,
                                         doc["recoveryCodes"])
                  doc = request_json("B plaintext disable " + side, base, "POST", DISABLE_PATH,
                                     TOKENS[p_plain_key], {"code": totp_now(secret)}, 201)
                  require("B plaintext disable " + side, doc.get("enabled"), False)
              print("plaintext policy ok: an explicit false stores the secret as a JSON string and TOTP still verifies")
              set_system_security(None)
              reset_factor(p_missing_key)
              reset_factor(p_plain_key)
              reset_oidc(org_a)


          def phase_b_mfa():
              print("==== phase B: MFA closed loop on NestJS and Go ====")
              mfa_closed_loop(NEST_URL, "B nest", p_closed_nest, TOKENS[p_closed_nest])
              mfa_closed_loop(GO_URL, "B go", p_closed_go, TOKENS[p_closed_go])
              mfa_disable_with_recovery_code(NEST_URL, "B nest recovery disable",
                                             p_recovery_disable, TOKENS[p_recovery_disable])
              mfa_disable_with_recovery_code(GO_URL, "B go recovery disable",
                                             p_recovery_disable_go, TOKENS[p_recovery_disable_go])
              mfa_recovery_code_states(NEST_URL, "B nest recovery states",
                                       p_recovery_states_nest, TOKENS[p_recovery_states_nest])
              mfa_recovery_code_states(GO_URL, "B go recovery states",
                                       p_recovery_states_go, TOKENS[p_recovery_states_go])
              totp_window_matrix(NEST_URL, "B nest totp window", p_recovery_states_nest,
                                 TOKENS[p_recovery_states_nest])
              totp_window_matrix(GO_URL, "B go totp window", p_recovery_states_go,
                                 TOKENS[p_recovery_states_go])
              machine_actor_matrix()
              crypto_key_matrix()
              print("phase B ok")


          # ---- phase C ----
          def phase_c_interop():
              print("==== phase C: cross implementation interop ====")
              # C1 Go enroll → Nest verify（Nest 能解密 Go 写入的密文）
              user = p_interop_go_enroll
              reset_factor(user)
              doc = request_json("C1 go enroll", GO_URL, "POST", ENROLL_PATH, TOKENS[user], None, 201)
              secret = doc["secret"]
              doc = request_json("C1 nest verify", NEST_URL, "POST", VERIFY_ENROLL_PATH, TOKENS[user],
                                 {"code": totp_now(secret)}, 201)
              require_codes_match_db("C1 nest verify", user, doc["recoveryCodes"])
              require("C1 nest verify enabled", doc["enabled"], True)
              assert_no_plaintext_in_db("C1 go enroll", [secret])

              # C2 Nest enroll → Go verify（Go 能解密 Nest 写入的密文）
              user = p_interop_nest_enroll
              reset_factor(user)
              doc = request_json("C2 nest enroll", NEST_URL, "POST", ENROLL_PATH, TOKENS[user], None, 201)
              secret = doc["secret"]
              doc = request_json("C2 go verify", GO_URL, "POST", VERIFY_ENROLL_PATH, TOKENS[user],
                                 {"code": totp_now(secret)}, 201)
              require_codes_match_db("C2 go verify", user, doc["recoveryCodes"])

              # C3 Go 生成的恢复码被 Nest 消费
              user = p_interop_go_codes
              reset_factor(user)
              secret, doc = enable_mfa(GO_URL, "C3 go enable", user, TOKENS[user])
              go_codes = doc["recoveryCodes"]
              doc = request_json("C3 nest rotate with go code", NEST_URL, "POST", ROTATE_PATH,
                                 TOKENS[user], {"code": go_codes[2]}, 201)
              require_codes_match_db("C3 nest rotate with go code", user, doc["recoveryCodes"])
              if set(hash_code(c) for c in doc["recoveryCodes"]) & set(hash_code(c) for c in go_codes):
                  fail("C3: the Nest rotation did not replace the Go written recovery codes")

              # C4 Nest 生成的恢复码被 Go 消费
              user = p_interop_nest_codes
              reset_factor(user)
              secret, doc = enable_mfa(NEST_URL, "C4 nest enable", user, TOKENS[user])
              nest_codes = doc["recoveryCodes"]
              doc = request_json("C4 go rotate with nest code", GO_URL, "POST", ROTATE_PATH,
                                 TOKENS[user], {"code": nest_codes[5]}, 201)
              require_codes_match_db("C4 go rotate with nest code", user, doc["recoveryCodes"])

              # C5 Nest 写入的密文被 Go 解密（Go disable 用 TOTP）
              user = p_interop_login
              reset_factor(user)
              secret, doc = enable_mfa(NEST_URL, "C5 nest enable", user, TOKENS[user])
              doc = request_json("C5 go disable nest ciphertext", GO_URL, "POST", DISABLE_PATH,
                                 TOKENS[user], {"code": totp_now(secret)}, 201)
              require("C5 go disable enabled", doc.get("enabled"), False)
              require("C5 go disable disabledAt", factor_state(user)[6] != "<null>", True)

              # C6 Go 写入的密文由真实 NestJS 登录挑战 + 公开 verify-login 完成
              user = p_interop_go_enroll
              reset_factor(user)
              secret, doc = enable_mfa(GO_URL, "C6 go enable", user, TOKENS[user])
              challenge = login_doc(email_of(user), org_a)
              if challenge.get("mfaRequired") is not True or not challenge.get("authChallengeId"):
                  fail("C6: the real NestJS login did not return an MFA challenge: " + repr(challenge))
              if challenge.get("accessToken"):
                  fail("C6: the real NestJS login returned an access token before the challenge was solved")
              doc = request_json("C6 nest verify-login", NEST_URL, "POST", VERIFY_LOGIN_PATH, None,
                                 {"challengeId": challenge["authChallengeId"],
                                  "code": totp_now(secret)}, 200)
              if not doc.get("accessToken") or not doc.get("refreshToken"):
                  fail("C6: verify-login did not return real tokens: " + repr(doc))
              # 同一公开端点经 api-go 入口仍由 NestJS 应答（go 模式下是代理）。
              challenge2 = login_doc(email_of(user), org_a)
              doc = request_json("C6 proxied verify-login", GO_URL, "POST", VERIFY_LOGIN_PATH, None,
                                 {"challengeId": challenge2["authChallengeId"],
                                  "code": totp_now(secret)}, 200)
              if not doc.get("accessToken"):
                  fail("C6: the proxied verify-login did not return an access token")
              print("C6 ok: the public MFA login endpoint is never migrated; it stays on NestJS in every mode")
              print("phase C ok")


          # ---- phase D ----
          def reset_oidc(org_id):
              sql("DELETE FROM OrgOidcConfig WHERE orgId='" + org_id + "'")


          def oidc_row(org_id):
              rows = sql_rows(
                  "SELECT enabled, issuerUrl, IFNULL(discoveryUrl,'<null>'), clientId, "
                  "IFNULL(CAST(clientSecret AS CHAR),'<null>'), IFNULL(CAST(scopes AS CHAR),'<null>'), "
                  "IFNULL(buttonLabel,'<null>'), requireEmailVerified "
                  "FROM OrgOidcConfig WHERE orgId='" + org_id + "'")
              return tuple(rows[0]) if rows else None


          def assert_cache_has_no_plaintext(label, needles):
              """一次 EVAL 扫全库：任何 string 键的值里出现明文 secret / 恢复码即失败。"""
              args = [needle for needle in needles if needle]
              script = (
                  "local needles=ARGV; local cur='0'; local scanned=0; "
                  "repeat local r=redis.call('SCAN',cur,'COUNT',500); cur=r[1]; "
                  "for _,k in ipairs(r[2]) do scanned=scanned+1; "
                  "local t=redis.call('TYPE',k)['ok']; "
                  "if t=='string' then local v=redis.call('GET',k); "
                  "for _,needle in ipairs(needles) do "
                  "if string.find(v,needle,1,true) then return {k,needle} end end end end "
                  "until cur=='0'; return {tostring(scanned),''}"
              )
              cid = container_id("redis:7.2")
              proc = subprocess.run(["docker", "exec", "-i", cid, "redis-cli", "--raw", "EVAL", script, "0"]
                                    + args, text=True, capture_output=True)
              if proc.returncode != 0:
                  fail("redis eval: " + (proc.stderr or proc.stdout))
              lines = [line for line in proc.stdout.splitlines() if line != ""]
              if len(lines) >= 2:
                  fail(f"{label}: redis key {lines[0]!r} contains plaintext {lines[1]!r}")
              print("%s ok: scanned %s redis keys, no secret or recovery code present"
                    % (label, lines[0] if lines else "?"))


          def recovery_guard_ddl():
              rows = sql_rows("SELECT COLUMN_TYPE, CHARACTER_SET_NAME, COLLATION_NAME "
                              "FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='app' "
                              "AND TABLE_NAME='UserRecoveryCode' AND COLUMN_NAME='id'")
              if not rows:
                  fail("cannot inspect UserRecoveryCode.id")
              column_type, charset, collation = rows[0][0], rows[0][1], rows[0][2]
              return ("CREATE TABLE _af_recovery_guard (codeId " + column_type + " CHARACTER SET "
                      + charset + " COLLATE " + collation + " NOT NULL PRIMARY KEY, "
                      "CONSTRAINT fk_af_recovery_guard FOREIGN KEY (codeId) "
                      "REFERENCES UserRecoveryCode(id) ON DELETE RESTRICT)")


          def install_recovery_guard(user_id):
              """只在本次测试库里加一个 FK RESTRICT 子行，让恢复码删除必然失败。

              这是真实的数据库写入失败（不是生产后门）：表只在本 smoke 的
              ephemeral 库里存在，结束前一定会 DROP。
              """
              sql("DROP TABLE IF EXISTS _af_recovery_guard")
              sql(recovery_guard_ddl())
              code_id = scalar("SELECT id FROM UserRecoveryCode WHERE userId='" + user_id
                               + "' ORDER BY id LIMIT 1")
              if not code_id:
                  fail("install_recovery_guard: no recovery code row for " + user_id)
              sql("INSERT INTO _af_recovery_guard (codeId) VALUES ('" + code_id + "')")


          def drop_recovery_guard():
              sql("DROP TABLE IF EXISTS _af_recovery_guard")


          def require_no_recovery_guard(label):
              require(label + " guard table dropped",
                      scalar("SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='app' "
                             "AND TABLE_NAME='_af_recovery_guard'"), "0")


          def af2_fault_matrix():
              print("---- AF2 transaction rollback with a database write failure ----")
              user = p_af2_rotate
              reset_factor(user)
              secret, doc = enable_mfa(GO_URL, "D4 rotate enable", user, TOKENS[user])
              codes = doc["recoveryCodes"]
              before_state = factor_state(user)
              before_codes = recovery_rows(user)
              for base, side in ((GO_URL, "go"), (NEST_URL, "nest")):
                  install_recovery_guard(user)
                  status, raw = call(base, ROTATE_PATH, "POST", TOKENS[user], {"code": codes[1]})
                  if status != 500:
                      drop_recovery_guard()
                      fail("D4 rotate fault %s -> %s %r, want 500" % (side, status, raw[:300]))
                  require_error_body("D4 rotate fault " + side, raw, 500, INTERNAL_MESSAGE)
                  require("D4 rotate fault " + side + " factor rolled back", factor_state(user),
                          before_state)
                  require("D4 rotate fault " + side + " codes rolled back", recovery_rows(user),
                          before_codes)
                  require("D4 rotate fault " + side + " unused count", unused_recovery_count(user), 8)
                  drop_recovery_guard()
              doc = request_json("D4 rotate after fault removal", GO_URL, "POST", ROTATE_PATH,
                                 TOKENS[user], {"code": codes[1]}, 201)
              require_codes_match_db("D4 rotate after fault removal", user, doc["recoveryCodes"])
              print("AF2 ok: a failed rotate rolls the recovery-code consumption and the replacement back together")

              user = p_af2_disable
              reset_factor(user)
              secret, doc = enable_mfa(NEST_URL, "D4 disable enable", user, TOKENS[user])
              codes = doc["recoveryCodes"]
              before_state = factor_state(user)
              before_codes = recovery_rows(user)
              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  install_recovery_guard(user)
                  status, raw = call(base, DISABLE_PATH, "POST", TOKENS[user], {"code": codes[4]})
                  if status != 500:
                      drop_recovery_guard()
                      fail("D4 disable fault %s -> %s %r, want 500" % (side, status, raw[:300]))
                  require_error_body("D4 disable fault " + side, raw, 500, INTERNAL_MESSAGE)
                  require("D4 disable fault " + side + " factor rolled back", factor_state(user),
                          before_state)
                  require("D4 disable fault " + side + " codes rolled back", recovery_rows(user),
                          before_codes)
                  require("D4 disable fault " + side + " unused count", unused_recovery_count(user), 8)
                  drop_recovery_guard()
              doc = request_json("D4 disable after fault removal", NEST_URL, "POST", DISABLE_PATH,
                                 TOKENS[user], {"code": codes[4]}, 201)
              require("D4 disable after fault removal enabled", doc["enabled"], False)
              require("D4 disable after fault removal codes", recovery_rows(user), [])
              require_no_recovery_guard("D4")
              print("AF2 ok: a failed disable rolls the consumed code, lastUsedAt, disabledAt and deletion back together")


          def public_login_behaviour():
              print("---- public MFA login challenge (unchanged, stays on NestJS) ----")
              user = p_public_login
              reset_factor(user)
              secret, doc = enable_mfa(GO_URL, "D5 enable", user, TOKENS[user])
              codes = doc["recoveryCodes"]
              first = login_doc(email_of(user), org_a)
              if first.get("mfaRequired") is not True or not first.get("authChallengeId"):
                  fail("D5: no MFA challenge from the real login: " + repr(first))
              doc = request_json("D5 verify-login recovery code", NEST_URL, "POST", VERIFY_LOGIN_PATH,
                                 None, {"challengeId": first["authChallengeId"], "code": codes[0]}, 200)
              if not doc.get("accessToken"):
                  fail("D5: verify-login with a recovery code returned no access token: " + repr(doc))
              second = login_doc(email_of(user), org_a)
              request_json("D5 reused recovery code", NEST_URL, "POST", VERIFY_LOGIN_PATH, None,
                           {"challengeId": second["authChallengeId"], "code": codes[0]}, 401,
                           INVALID_CODE)
              # 公开登录挑战保持原有语义：恢复码分支只标记 usedAt（单次消费），
              # 不删除行——行的生命周期由 verify-enroll / disable / rotate 管理。
              consumed = [row for row in recovery_rows(user) if row[0] == hash_code(codes[0])]
              if not consumed:
                  fail("D5: the consumed recovery code row disappeared; the public login path "
                       "must only mark usedAt")
              if consumed[0][1] == "<null>":
                  fail("D5: the consumed recovery code was not marked as used")
              require("D5 unused codes after one login", unused_recovery_count(user), 7)
              third = login_doc(email_of(user), org_a)
              for attempt in range(1, 5):
                  request_json("D5 wrong attempt %d" % attempt, NEST_URL, "POST", VERIFY_LOGIN_PATH,
                               None, {"challengeId": third["authChallengeId"], "code": "000000"}, 401,
                               INVALID_CODE)
              request_json("D5 fifth attempt locks the challenge", NEST_URL, "POST", VERIFY_LOGIN_PATH,
                           None, {"challengeId": third["authChallengeId"], "code": "000000"}, 429,
                           CHALLENGE_LOCKED)
              request_json("D5 locked challenge rejects a valid code", NEST_URL, "POST",
                           VERIFY_LOGIN_PATH, None,
                           {"challengeId": third["authChallengeId"], "code": totp_now(secret)}, 429,
                           CHALLENGE_LOCKED)
              print("public login ok: recovery-code single use and the 5-attempt lock are unchanged")


          def lock_behaviour():
              print("---- per-user MySQL session lock ----")
              user = user_u
              reset_factor(user)
              lock_name = mfa_lock_name(user)
              holder = hold_mysql_lock(lock_name, seconds=45)
              try:
                  time.sleep(2.0)
                  started = time.monotonic()
                  status, raw = call(GO_URL, ENROLL_PATH, "POST", u_a_token, None, timeout=90)
                  elapsed = time.monotonic() - started
                  if status != 409:
                      fail("D6 go enroll under lock -> %s %r, want 409" % (status, raw[:300]))
                  require_error_body("D6 go enroll under lock", raw, 409, LOCK_BUSY, "Conflict")
                  if elapsed < 8 or elapsed > 40:
                      fail("D6 go enroll under lock returned after %.1fs, want the 10s GET_LOCK timeout"
                           % elapsed)
                  require("D6 no factor written", factor_state(user), None)
                  # 同一用户在 org B 的请求共用同一把锁（锁名只由 userId 决定）。
                  status, raw = call(NEST_URL, ENROLL_PATH, "POST", u_b_token, None, timeout=90)
                  if status != 409:
                      fail("D6 nest enroll (org B) under lock -> %s %r, want 409" % (status, raw[:300]))
                  require_error_body("D6 nest enroll (org B) under lock", raw, 409, LOCK_BUSY, "Conflict")
                  require("D6 no factor written for org B", factor_state(user), None)
                  # 另一个用户的请求不受影响。
                  doc = request_json("D6 other user unaffected", GO_URL, "POST", ENROLL_PATH,
                                     TOKENS[p_lock], None, 201)
                  require("D6 other user factor created", factor_state(p_lock) is not None, True)
              finally:
                  release_mysql_lock(holder, lock_name)
              request_json("D6 enroll after release", GO_URL, "POST", ENROLL_PATH, u_a_token, None, 201)
              reset_factor(user)
              reset_factor(p_lock)
              print("lock ok: 409 with the shared message, org A/B share one lock, recovery after release")


          def phase_d_concurrency():
              print("==== phase D: concurrency, rollback and locks ====")
              user = p_concurrent_enroll
              reset_factor(user)
              doc = request_json("D1 enroll", GO_URL, "POST", ENROLL_PATH, TOKENS[user], None, 201)
              secret = doc["secret"]
              code = totp_now(secret)
              results = race([(NEST_URL, "POST", VERIFY_ENROLL_PATH, TOKENS[user], {"code": code}),
                              (GO_URL, "POST", VERIFY_ENROLL_PATH, TOKENS[user], {"code": code})])
              statuses = sorted(result[0] for result in results)
              require("D1 concurrent verify statuses", statuses, [201, 400])
              loser = [result for result in results if result[0] == 400][0]
              require("D1 loser message", message_of(loser[1]), ENROLL_NOT_INITIALIZED)
              winner = [result for result in results if result[0] == 201][0]
              require_codes_match_db("D1 winner", user, (body(winner[1]) or {}).get("recoveryCodes"))
              require("D1 rows", len(recovery_rows(user)), 8)
              require("D1 unused", unused_recovery_count(user), 8)
              require("D1 pendingSecret", factor_state(user)[1], "<null>")
              print("D1 ok: Nest and Go racing on one enrollment produce exactly one recovery-code set")

              user = p_concurrent_code
              reset_factor(user)
              secret, doc = enable_mfa(GO_URL, "D2 enable", user, TOKENS[user])
              codes = doc["recoveryCodes"]
              results = race([(GO_URL, "POST", ROTATE_PATH, TOKENS[user], {"code": codes[0]}),
                              (NEST_URL, "POST", ROTATE_PATH, TOKENS[user], {"code": codes[0]})])
              statuses = sorted(result[0] for result in results)
              require("D2 statuses", statuses, [201, 401])
              loser = [result for result in results if result[0] == 401][0]
              require("D2 loser message", message_of(loser[1]), INVALID_CODE)
              winner = [result for result in results if result[0] == 201][0]
              require_codes_match_db("D2 winner", user, (body(winner[1]) or {}).get("recoveryCodes"))
              require("D2 unused", unused_recovery_count(user), 8)
              print("D2 ok: one recovery code authorizes at most one concurrent success")

              user = p_concurrent_rotate
              reset_factor(user)
              secret, doc = enable_mfa(GO_URL, "D3 enable", user, TOKENS[user])
              codes = doc["recoveryCodes"]
              results = race([(GO_URL, "POST", ROTATE_PATH, TOKENS[user], {"code": codes[0]}),
                              (NEST_URL, "POST", ROTATE_PATH, TOKENS[user], {"code": codes[1]})])
              statuses = sorted(result[0] for result in results)
              require("D3 statuses", statuses, [201, 401])
              winner = [result for result in results if result[0] == 201][0]
              require_codes_match_db("D3 winner", user, (body(winner[1]) or {}).get("recoveryCodes"))
              require("D3 rows", len(recovery_rows(user)), 8)
              require("D3 unused", unused_recovery_count(user), 8)
              if set(hash_code(c) for c in codes) & set(recovery_hashes(user)):
                  fail("D3: an old recovery code survived the concurrent rotation")
              print("D3 ok: two different old codes cannot both authorize and overwrite each other")

              af2_fault_matrix()
              public_login_behaviour()
              lock_behaviour()
              print("phase D ok")


          # ---- phase E ----
          def phase_e_profile_cache():
              print("==== phase E: profile cache invalidation ====")
              user = user_u
              reset_factor(user)
              redis_del_pattern(PROFILE_PREFIX + user + ":*")
              redis_del_pattern(PROFILE_PREFIX + user_v + ":*")
              doc = request_json("E prewarm u/a", NEST_URL, "GET", ME_PATH, u_a_token, None, 200)
              require("E prewarm u/a mfaEnabled", doc.get("mfaEnabled"), False)
              doc = request_json("E prewarm u/b", NEST_URL, "GET", ME_PATH, u_b_token, None, 200)
              require("E prewarm u/b mfaEnabled", doc.get("mfaEnabled"), False)
              doc = request_json("E prewarm v", NEST_URL, "GET", ME_PATH, v_token, None, 200)
              require("E prewarm v mfaEnabled", doc.get("mfaEnabled"), False)
              for key in (PROFILE_PREFIX + user + ":" + org_a, PROFILE_PREFIX + user + ":" + org_b,
                          PROFILE_PREFIX + user_v + ":" + org_c):
                  if redis_get(key) == "":
                      fail("E: profile cache key was not warmed: " + key)
              v_cache = redis_get(PROFILE_PREFIX + user_v + ":" + org_c)

              secret, doc = enable_mfa(GO_URL, "E go enable", user, u_a_token)
              codes = doc["recoveryCodes"]
              assert_cache_has_no_plaintext("E cache after go verify", [secret] + codes)
              for label, token in (("u/a", u_a_token), ("u/b", u_b_token)):
                  doc = request_json("E me after go verify " + label, NEST_URL, "GET", ME_PATH, token,
                                     None, 200)
                  require("E me after go verify " + label + " mfaEnabled", doc.get("mfaEnabled"), True)
              doc = request_json("E go read mfa", GO_URL, "GET", MFA_PATH, u_a_token, None, 200)
              require("E go read mfa enabled", doc.get("enabled"), True)
              require("E v cache untouched", redis_get(PROFILE_PREFIX + user_v + ":" + org_c), v_cache)

              doc = request_json("E nest disable", NEST_URL, "POST", DISABLE_PATH, u_a_token,
                                 {"code": totp_now(secret)}, 201)
              require("E nest disable enabled", doc.get("enabled"), False)
              for label, token in (("u/a", u_a_token), ("u/b", u_b_token)):
                  doc = request_json("E me after nest disable " + label, NEST_URL, "GET", ME_PATH, token,
                                     None, 200)
                  require("E me after nest disable " + label + " mfaEnabled", doc.get("mfaEnabled"), False)
              require("E v cache untouched after disable",
                      redis_get(PROFILE_PREFIX + user_v + ":" + org_c), v_cache)

              secret2, doc = enable_mfa(NEST_URL, "E nest enable", user, u_a_token)
              codes2 = doc["recoveryCodes"]
              doc = request_json("E go read after nest write", GO_URL, "GET", MFA_PATH, u_a_token, None,
                                 200)
              require("E go read after nest write enabled", doc.get("enabled"), True)
              assert_cache_has_no_plaintext("E cache final", [secret, secret2] + codes + codes2)
              reset_factor(user)
              print("phase E ok")


          # ---- phase F ----
          def oidc_column_is_null(org_id, column):
              return scalar("SELECT " + column + " IS NULL FROM OrgOidcConfig WHERE orgId='"
                            + org_id + "'")


          def oidc_scopes_elements(org_id):
              """按元素读回 scopes（不依赖 MySQL 的 JSON 文本格式）。"""
              length = int(scalar("SELECT IFNULL(JSON_LENGTH(scopes), -1) FROM OrgOidcConfig "
                                  "WHERE orgId='" + org_id + "'"))
              if length < 0:
                  return None
              return [scalar("SELECT JSON_UNQUOTE(JSON_EXTRACT(scopes, '$[" + str(index) + "]')) "
                             "FROM OrgOidcConfig WHERE orgId='" + org_id + "'")
                      for index in range(length)]


          def reset_a():
              reset_oidc(org_a)


          def oidc_parity(label, payload, expected=200, expected_message=None, setup=None,
                          org_id=None, token=None):
              """PUT 在 Nest 与 Go 两侧各自从同一初始行出发，比较状态码/正文/行状态。"""
              org = org_id if org_id is not None else org_a
              tok = token if token is not None else w_a_token
              if setup is not None:
                  setup()
              nest_status, nest_raw = call(NEST_URL, OIDC_PATH, "PUT", tok, payload)
              nest_row = oidc_row(org)
              if setup is not None:
                  setup()
              go_status, go_raw = call(GO_URL, OIDC_PATH, "PUT", tok, payload)
              go_row = oidc_row(org)
              if nest_status != expected or go_status != expected:
                  fail(f"oidc parity {label}: status nest={nest_status} go={go_status}, want {expected}; "
                       f"nest={nest_raw[:300]!r} go={go_raw[:300]!r}")
              if canon(body(nest_raw)) != canon(body(go_raw)):
                  fail(f"oidc parity {label}: body mismatch nest={nest_raw[:600]!r} go={go_raw[:600]!r}")
              if nest_row != go_row:
                  fail(f"oidc parity {label}: DB row mismatch nest={nest_row} go={go_row}")
              if expected_message is not None:
                  for side, raw in (("nest", nest_raw), ("go", go_raw)):
                      got = message_of(raw)
                      if got != expected_message:
                          fail(f"oidc parity {label}: {side} message {got!r} want {expected_message!r} "
                               f"raw={raw[:400]!r}")
              return body(nest_raw), nest_row


          def seed_oidc_row(secret_sql, scopes_sql):
              reset_oidc(org_a)
              sql("INSERT INTO OrgOidcConfig (id, orgId, enabled, issuerUrl, discoveryUrl, clientId, "
                  "clientSecret, scopes, buttonLabel, requireEmailVerified, createdAt, updatedAt) VALUES ("
                  "'af-smoke-oidc-seed', '" + org_a + "', 0, 'https://idp.example', NULL, 'client-x', "
                  + secret_sql + ", " + scopes_sql + ", NULL, 1, NOW(3), NOW(3))")


          def phase_f_oidc():
              print("==== phase F: OIDC configuration ====")
              reset_oidc(org_a)
              reset_oidc(org_b)

              # 无行默认值 + 双组织隔离
              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  doc = request_json("F defaults a " + side, base, "GET", OIDC_PATH, w_a_token, None, 200)
                  require_keys("F defaults a " + side, doc, OIDC_KEYS)
                  require("F defaults a " + side, canon(doc), OIDC_DEFAULTS)
                  doc = request_json("F defaults b " + side, base, "GET", OIDC_PATH, w_b_token, None, 200)
                  require("F defaults b " + side, canon(doc), OIDC_DEFAULTS)

              # 权限门禁（settings.manage，没有平台管理员门禁）
              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  for method, payload in (("GET", None),
                                          ("PUT", {"enabled": False, "issuerUrl": "", "clientId": ""})):
                      status, raw = call(base, OIDC_PATH, method, n_a_token, payload)
                      if status != 403:
                          fail("F no-permission %s %s -> %s %r, want 403"
                               % (side, method, status, raw[:300]))
                      require_error_body("F no-permission " + side + " " + method, raw, 403,
                                         PERMISSION_MESSAGE, "Forbidden")
                      doc = body(raw) or {}
                      require("F no-permission code " + side + " " + method, doc.get("code"),
                              PERMISSION_CODE)
                      require("F no-permission detail " + side + " " + method, doc.get("detail"),
                              PERMISSION_DETAIL)
                      require("F no-permission required " + side + " " + method,
                              doc.get("requiredPermissions"), ["settings.manage"])
                      require("F no-permission mode " + side + " " + method,
                              doc.get("permissionsMode"), "any")
                      if "missingPermissions" in doc:
                          fail("F no-permission " + side + ": missingPermissions must be absent")

              # 权限来自 MySQL 而不是 JWT claim
              sql("DELETE FROM RolePermission WHERE roleId='" + role_settings_a + "'")
              redis("DEL", PROFILE_PREFIX + user_w + ":" + org_a)
              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  status, raw = call(base, OIDC_PATH, "GET", w_a_token, None)
                  if status != 403:
                      fail("F claim-vs-db %s -> %s %r, want 403" % (side, status, raw[:300]))
                  require_error_body("F claim-vs-db " + side, raw, 403, PERMISSION_MESSAGE, "Forbidden")
              sql("INSERT INTO RolePermission (id, roleId, permissionId) VALUES ('" + role_settings_a
                  + "-rp', '" + role_settings_a + "', '" + SETTINGS_PERM + "')")
              redis("DEL", PROFILE_PREFIX + user_w + ":" + org_a)
              doc = request_json("F permission restored", GO_URL, "GET", OIDC_PATH, w_a_token, None, 200)
              require_keys("F permission restored", doc, OIDC_KEYS)
              print("F ok: 8-field defaults, no platform-admin gate, permission re-derived from MySQL")

              # 双组织隔离
              doc, row = oidc_parity("F write org A",
                                     {"enabled": True, "issuerUrl": "  https://idp-a.example  ",
                                      "clientId": "  client-a  ", "scopes": ["openid"],
                                      "buttonLabel": "  Login with A  "}, 200, setup=reset_a)
              require("F write org A body", canon(doc),
                      {"enabled": True, "issuerUrl": "https://idp-a.example", "discoveryUrl": "",
                       "clientId": "client-a", "hasClientSecret": False, "scopes": ["openid"],
                       "buttonLabel": "Login with A", "requireEmailVerified": True})
              require("F write org A row",
                      (row[0], row[1], row[2], row[3], row[4], row[6], row[7]),
                      ("1", "https://idp-a.example", "<null>", "client-a", "<null>", "Login with A",
                       "1"))
              require("F write org A row scopes", oidc_scopes_elements(org_a), ["openid"])
              doc = request_json("F org B isolated", NEST_URL, "GET", OIDC_PATH, w_b_token, None, 200)
              require("F org B isolated", canon(doc), OIDC_DEFAULTS)
              doc, row = oidc_parity("F write org B",
                                     {"enabled": False, "issuerUrl": "https://idp-b.example",
                                      "clientId": "client-b", "scopes": ["email"],
                                      "requireEmailVerified": False}, 200, setup=lambda: reset_oidc(org_b),
                                     org_id=org_b, token=w_b_token)
              doc = request_json("F org A untouched", GO_URL, "GET", OIDC_PATH, w_a_token, None, 200)
              require("F org A untouched", doc["clientId"], "client-a")
              require("F org A untouched scopes", doc["scopes"], ["openid"])
              doc = request_json("F org B written", GO_URL, "GET", OIDC_PATH, w_b_token, None, 200)
              require("F org B written", doc["clientId"], "client-b")
              require("F org B written requireEmailVerified", doc["requireEmailVerified"], False)
              reset_oidc(org_b)
              print("F ok: two organizations keep independent rows")

              # trim / 可选 null / scopes 过滤
              doc, row = oidc_parity("F discoveryUrl blank",
                                     {"enabled": False, "issuerUrl": "", "clientId": "",
                                      "discoveryUrl": "   "}, 200, setup=reset_a)
              require("F discoveryUrl blank response", doc["discoveryUrl"], "")
              require("F discoveryUrl blank SQL NULL", oidc_column_is_null(org_a, "discoveryUrl"), "1")
              doc, row = oidc_parity("F discoveryUrl trimmed",
                                     {"enabled": False, "issuerUrl": "", "clientId": "",
                                      "discoveryUrl": "  https://x.example/d  "}, 200, setup=reset_a)
              require("F discoveryUrl trimmed response", doc["discoveryUrl"], "https://x.example/d")
              doc, row = oidc_parity("F discoveryUrl null",
                                     {"enabled": False, "issuerUrl": "", "clientId": "",
                                      "discoveryUrl": None}, 200, setup=reset_a)
              require("F discoveryUrl null response", doc["discoveryUrl"], "")
              require("F discoveryUrl null SQL NULL", oidc_column_is_null(org_a, "discoveryUrl"), "1")
              doc, row = oidc_parity("F buttonLabel blank",
                                     {"enabled": False, "issuerUrl": "", "clientId": "",
                                      "buttonLabel": "   "}, 200, setup=reset_a)
              require("F buttonLabel blank response", doc["buttonLabel"], "")
              require("F buttonLabel blank SQL NULL", oidc_column_is_null(org_a, "buttonLabel"), "1")
              doc, row = oidc_parity("F buttonLabel trimmed",
                                     {"enabled": False, "issuerUrl": "", "clientId": "",
                                      "buttonLabel": "  Btn  "}, 200, setup=reset_a)
              require("F buttonLabel trimmed response", doc["buttonLabel"], "Btn")
              doc, row = oidc_parity("F empty required strings",
                                     {"enabled": False, "issuerUrl": "", "clientId": "   "}, 200,
                                     setup=reset_a)
              require("F empty required strings response", [doc["issuerUrl"], doc["clientId"]], ["", ""])
              require("F empty required strings row", row[1:4], ("", "<null>", ""))
              doc, row = oidc_parity("F scopes verbatim",
                                     {"enabled": False, "issuerUrl": "", "clientId": "",
                                      "scopes": ["  openid  ", "email", "email"]}, 200, setup=reset_a)
              require("F scopes verbatim response", doc["scopes"], ["  openid  ", "email", "email"])
              # scalar() 会 strip 每一行输出，按元素读回时看不到首尾空白；改用带
              # 引号的原始 JSON 元素断言存储值逐字节保留原字符串。
              require("F scopes verbatim raw element",
                      scalar("SELECT JSON_EXTRACT(scopes, '$[0]') FROM OrgOidcConfig "
                             "WHERE orgId='" + org_a + "'"), '"  openid  "')
              require("F scopes verbatim row", oidc_scopes_elements(org_a),
                      ["openid", "email", "email"])
              require("F scopes verbatim is array",
                      scalar("SELECT JSON_TYPE(scopes) FROM OrgOidcConfig WHERE orgId='" + org_a + "'"),
                      "ARRAY")
              doc, row = oidc_parity("F scopes filtered empty",
                                     {"enabled": False, "issuerUrl": "", "clientId": "",
                                      "scopes": ["", "   "]}, 200, setup=reset_a)
              require("F scopes filtered empty response", doc["scopes"], OIDC_DEFAULT_SCOPES)
              require("F scopes filtered empty SQL NULL", oidc_column_is_null(org_a, "scopes"), "1")
              doc, row = oidc_parity("F scopes non-string filtered",
                                     {"enabled": False, "issuerUrl": "", "clientId": "",
                                      "scopes": ["openid", 5, "  ", "email"]}, 200, setup=reset_a)
              require("F scopes non-string filtered response", doc["scopes"], ["openid", "email"])
              require("F scopes non-string filtered row", oidc_scopes_elements(org_a), ["openid", "email"])
              doc, row = oidc_parity("F scopes null",
                                     {"enabled": False, "issuerUrl": "", "clientId": "",
                                      "scopes": None}, 200, setup=reset_a)
              require("F scopes null response", doc["scopes"], OIDC_DEFAULT_SCOPES)
              require("F scopes null SQL NULL", oidc_column_is_null(org_a, "scopes"), "1")
              doc, row = oidc_parity("F requireEmailVerified absent",
                                     {"enabled": False, "issuerUrl": "", "clientId": ""}, 200,
                                     setup=reset_a)
              require("F requireEmailVerified absent", doc["requireEmailVerified"], True)
              doc, row = oidc_parity("F requireEmailVerified false",
                                     {"enabled": False, "issuerUrl": "", "clientId": "",
                                      "requireEmailVerified": False}, 200, setup=reset_a)
              require("F requireEmailVerified false", doc["requireEmailVerified"], False)
              require("F requireEmailVerified false row", row[7], "0")
              doc, row = oidc_parity("F requireEmailVerified null",
                                     {"enabled": False, "issuerUrl": "", "clientId": "",
                                      "requireEmailVerified": None}, 200, setup=reset_a)
              require("F requireEmailVerified null", doc["requireEmailVerified"], True)
              print("F ok: trimming, optional null and the scopes filter match on both sides")

              # scopes 读取规则（直接 SQL 造行）
              for label, raw_sql, expected in (
                  ("not an array", "'\"openid\"'", OIDC_DEFAULT_SCOPES),
                  ("object", "'{}'", OIDC_DEFAULT_SCOPES),
                  ("blank members", "'[\"\", \"  \"]'", OIDC_DEFAULT_SCOPES),
                  ("sql null", "NULL", OIDC_DEFAULT_SCOPES),
                  ("whitespace kept", "'[\"  openid  \", \"email\"]'", ["  openid  ", "email"]),
                  ("duplicates kept", "'[\"email\", \"email\"]'", ["email", "email"]),
                  ("mixed types", "'[\"openid\", 5, null]'", ["openid"]),
              ):
                  seed_oidc_row("NULL", raw_sql)
                  for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                      doc = request_json("F scopes seed %s %s" % (label, side), base, "GET", OIDC_PATH,
                                         w_a_token, None, 200)
                      require_keys("F scopes seed %s %s" % (label, side), doc, OIDC_KEYS)
                      require("F scopes seed %s %s" % (label, side), doc["scopes"], expected)
              print("F ok: scopes read rule (non-array/blank -> default, originals kept verbatim)")

              # hasClientSecret 是 Boolean(存储值)，不是"能否解密"
              for label, secret_sql, expected in (
                  ("sql null", "NULL", False),
                  ("plain string", "'\"legacy-plaintext\"'", True),
                  ("empty string", "'\"\"'", False),
                  ("number zero", "'0'", False),
                  ("envelope", "_utf8mb4'" + sql_escape(json.dumps(encrypt_v1("has-secret-value")))
                   + "'", True),
              ):
                  seed_oidc_row(secret_sql, "NULL")
                  for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                      doc = request_json("F hasClientSecret %s %s" % (label, side), base, "GET",
                                         OIDC_PATH, w_a_token, None, 200)
                      require_keys("F hasClientSecret %s %s" % (label, side), doc, OIDC_KEYS)
                      require("F hasClientSecret %s %s" % (label, side), doc["hasClientSecret"], expected)
                      if "has-secret-value" in json.dumps(doc) or "legacy-plaintext" in json.dumps(doc):
                          fail("F hasClientSecret " + label + ": the response leaked the stored value")
              print("F ok: hasClientSecret is Boolean(stored value), the secret is never returned or decrypted")

              # 没有 Redis 缓存：直接改行后 GET 立刻反映
              seed_oidc_row("NULL", "NULL")
              redis_del_pattern("oidc:*")
              doc = request_json("F cache probe 1", NEST_URL, "GET", OIDC_PATH, w_a_token, None, 200)
              require("F cache probe 1", doc["clientId"], "client-x")
              sql("UPDATE OrgOidcConfig SET clientId='client-changed' WHERE orgId='" + org_a + "'")
              doc = request_json("F cache probe 2", GO_URL, "GET", OIDC_PATH, w_a_token, None, 200)
              require("F cache probe 2", doc["clientId"], "client-changed")
              require("F no oidc cache keys", redis_scan("oidc:*"), [])
              print("F ok: there is no Redis cache for the OIDC configuration")

              # 保存端点不发任何网络请求；Nest 登录路径的 HTTPS/SSRF 拒绝仍生效
              reset_oidc(org_a)
              keys_before = sorted(redis_scan("oidc:*"))
              started = time.monotonic()
              doc = request_json("F unfetchable issuer", GO_URL, "PUT", OIDC_PATH, w_a_token,
                                 {"enabled": True, "issuerUrl": "https://127.0.0.1:9/oidc",
                                  "clientId": "client-x"}, 200)
              elapsed = time.monotonic() - started
              if elapsed > 10:
                  fail("F unfetchable issuer: the save took %.1fs, it must not contact the IdP" % elapsed)
              require("F unfetchable issuer stored", doc["issuerUrl"], "https://127.0.0.1:9/oidc")
              require("F unfetchable issuer no discovery cache", sorted(redis_scan("oidc:*")), keys_before)
              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  status, raw = call(base, OIDC_START_PATH + "?org=" + org_a, "GET", None, None)
                  if status != 400 or message_of(raw) != OIDC_SSRF_MESSAGE:
                      fail("F ssrf %s -> %s %r, want 400 %r"
                           % (side, status, raw[:300], OIDC_SSRF_MESSAGE))
              reset_oidc(org_a)
              doc = request_json("F http issuer", GO_URL, "PUT", OIDC_PATH, w_a_token,
                                 {"enabled": True, "issuerUrl": "http://127.0.0.1:9/oidc",
                                  "clientId": "client-x"}, 200)
              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  status, raw = call(base, OIDC_START_PATH + "?org=" + org_a, "GET", None, None)
                  if status != 400 or message_of(raw) != OIDC_HTTPS_MESSAGE:
                      fail("F https %s -> %s %r, want 400 %r"
                           % (side, status, raw[:300], OIDC_HTTPS_MESSAGE))
              print("F ok: the save endpoint performs no network request; HTTPS/SSRF rejection still applies")

              # 没有 AuditLog 行
              before_audit = int(scalar("SELECT COUNT(*) FROM AuditLog"))
              doc, row = oidc_parity("F no audit row",
                                     {"enabled": False, "issuerUrl": "", "clientId": ""}, 200,
                                     setup=reset_a)
              require("F no audit rows", int(scalar("SELECT COUNT(*) FROM AuditLog")), before_audit)
              print("F ok: the OIDC save writes no AuditLog row")

              # clientSecret 保留语义（AF4 写入期原子保留）
              reset_oidc(org_a)
              doc, row = oidc_parity("F secret set S1",
                                     {"enabled": True, "issuerUrl": "", "clientId": "",
                                      "clientSecret": "  S1-secret  "}, 200, setup=reset_a)
              require("F secret set S1 has", doc["hasClientSecret"], True)
              require("F secret set S1 decrypt", decrypt_v1(parse_json_text(row[4])), "S1-secret")
              if "S1-secret" in row[4]:
                  fail("F: the clientSecret column contains the plaintext secret")
              envelope1 = row[4]
              for label, payload in (
                  ("absent", {"enabled": True, "issuerUrl": "", "clientId": ""}),
                  ("null", {"enabled": True, "issuerUrl": "", "clientId": "", "clientSecret": None}),
                  ("empty", {"enabled": True, "issuerUrl": "", "clientId": "", "clientSecret": ""}),
                  ("blank", {"enabled": True, "issuerUrl": "", "clientId": "", "clientSecret": "   "}),
              ):
                  doc, row = oidc_parity("F secret keep " + label, payload, 200)
                  require("F secret keep " + label + " bytes", row[4], envelope1)
                  require("F secret keep " + label + " has", doc["hasClientSecret"], True)
              doc, row = oidc_parity("F secret rotate S2",
                                     {"enabled": True, "issuerUrl": "", "clientId": "",
                                      "clientSecret": "S2-secret"}, 200)
              if row[4] == envelope1:
                  fail("F secret rotate S2: the stored envelope did not change")
              require("F secret rotate S2 decrypt", decrypt_v1(parse_json_text(row[4])), "S2-secret")
              reset_oidc(org_a)
              doc, row = oidc_parity("F create without secret",
                                     {"enabled": False, "issuerUrl": "", "clientId": "client-y"}, 200,
                                     setup=reset_a)
              require("F create without secret has", doc["hasClientSecret"], False)
              require("F create without secret SQL NULL", oidc_column_is_null(org_a, "clientSecret"), "1")
              print("F ok: keep/rotate clientSecret semantics, first insert without a secret is SQL NULL")

              # AF4：并发写新 secret 与不带 secret 的更新不得回滚
              for round_index in range(6):
                  reset_oidc(org_a)
                  oidc_parity("F af4 seed %d" % round_index,
                              {"enabled": True, "issuerUrl": "", "clientId": "",
                               "clientSecret": "AF4-seed-%d" % round_index}, 200, setup=reset_a)
                  new_secret = "AF4-new-%d" % round_index
                  results = race([
                      (NEST_URL, "PUT", OIDC_PATH, w_a_token,
                       {"enabled": True, "issuerUrl": "", "clientId": "", "clientSecret": new_secret}),
                      (GO_URL, "PUT", OIDC_PATH, w_a_token,
                       {"enabled": True, "issuerUrl": "", "clientId": ""}),
                  ])
                  for index, (status, raw) in enumerate(results):
                      if status != 200:
                          fail("F af4 round %d call %d -> %s %r"
                               % (round_index, index, status, raw[:300]))
                  stored = oidc_row(org_a)[4]
                  if stored == "<null>":
                      fail("F af4 round %d: the concurrent update cleared the client secret" % round_index)
                  require("F af4 round %d kept the new secret" % round_index,
                          decrypt_v1(parse_json_text(stored)), new_secret)
              print("F ok: AF4 keep-secret is atomic at write time (no read-modify-write rollback)")

              # 响应与日志里没有 secret
              reset_oidc(org_a)
              marker = "AF-SMOKE-LOG-MARKER-SECRET"
              doc, row = oidc_parity("F log marker",
                                     {"enabled": True, "issuerUrl": "", "clientId": "",
                                      "clientSecret": marker}, 200, setup=reset_a)
              if marker in json.dumps(doc):
                  fail("F log marker: the response contains the plaintext client secret")
              if marker in row[4]:
                  fail("F log marker: the stored column contains the plaintext client secret")
              if nest_log_contains(marker):
                  fail("F log marker: the NestJS log contains the plaintext client secret")
              if marker in docker_logs():
                  fail("F log marker: the api-go log contains the plaintext client secret")
              reset_oidc(org_a)
              print("phase F ok")


          # ---- phase G ----
          def phase_g_nest_down():
              print("==== phase G: NestJS stopped ====")
              start_go("go")
              stop_nest()
              if nest_reachable():
                  fail("phase G: NestJS is still reachable after stop_nest()")
              # 清掉 profile / 鉴权策略 / discovery 缓存，强制 Go 重读真实 DB。
              redis_del_pattern(PROFILE_PREFIX + "*")
              redis("DEL", SYSTEM_SECURITY_CACHE)
              redis_del_pattern("oidc:discovery:*")
              redis_del_pattern("oidc:jwks:*")

              user = p_nest_down
              reset_factor(user)
              secret, doc = enable_mfa(GO_URL, "G go enable", user, TOKENS[user])
              codes = doc["recoveryCodes"]
              require_codes_match_db("G go verify", user, codes)
              doc = request_json("G go rotate totp", GO_URL, "POST", ROTATE_PATH, TOKENS[user],
                                 {"code": totp_now(secret)}, 201)
              codes2 = doc["recoveryCodes"]
              require_codes_match_db("G go rotate totp", user, codes2)
              doc = request_json("G go rotate recovery code", GO_URL, "POST", ROTATE_PATH, TOKENS[user],
                                 {"code": codes2[0]}, 201)
              codes3 = doc["recoveryCodes"]
              require_codes_match_db("G go rotate recovery code", user, codes3)
              doc = request_json("G go disable", GO_URL, "POST", DISABLE_PATH, TOKENS[user],
                                 {"code": totp_now(secret)}, 201)
              require("G go disable enabled", doc["enabled"], False)
              require("G go disable codes", recovery_rows(user), [])

              reset_oidc(org_a)
              doc = request_json("G go oidc write", GO_URL, "PUT", OIDC_PATH, w_a_token,
                                 {"enabled": True, "issuerUrl": "https://idp-g.example",
                                  "clientId": "client-g", "scopes": ["openid", "profile"]}, 200)
              require("G go oidc write", doc["clientId"], "client-g")
              doc = request_json("G go oidc read", GO_URL, "GET", OIDC_PATH, w_a_token, None, 200)
              require_keys("G go oidc read", doc, OIDC_KEYS)
              require("G go oidc read scopes", doc["scopes"], ["openid", "profile"])
              doc = request_json("G go oidc defaults", GO_URL, "GET", OIDC_PATH, w_b_token, None, 200)
              require("G go oidc defaults", canon(doc), OIDC_DEFAULTS)

              for method, path in NEST_ONLY_ROUTES:
                  status, raw = call(GO_URL, path, method, u_a_token, None)
                  if status != 502:
                      fail("G nest-only %s %s -> %s %r, want 502" % (method, path, status, raw[:300]))
              status, raw = call(GO_URL, VERIFY_LOGIN_PATH, "POST", None,
                                 {"challengeId": "af-smoke-missing", "code": "123456"})
              if status != 502:
                  fail("G verify-login with a body -> %s %r, want 502 (never migrated)"
                       % (status, raw[:300]))
              go_health()
              print("G ok: seven routes, a full MFA flow and OIDC config run on Go alone; "
                    "public challenges and the OIDC login chain are 502")

              start_nest()
              user = p_nest_down
              reset_factor(user)
              secret, doc = enable_mfa(GO_URL, "G2 go enable", user, TOKENS[user])
              codes = doc["recoveryCodes"]
              doc = request_json("G2 nest GET mfa", NEST_URL, "GET", MFA_PATH, TOKENS[user], None, 200)
              require("G2 nest GET mfa", canon(doc), expected_status(user))
              doc = request_json("G2 nest rotate with go code", NEST_URL, "POST", ROTATE_PATH,
                                 TOKENS[user], {"code": codes[6]}, 201)
              require_codes_match_db("G2 nest rotate with go code", user, doc["recoveryCodes"])
              doc = request_json("G2 nest disable go ciphertext", NEST_URL, "POST", DISABLE_PATH,
                                 TOKENS[user], {"code": totp_now(secret)}, 201)
              require("G2 nest disable enabled", doc["enabled"], False)
              reset_factor(user)
              reset_oidc(org_a)
              print("G ok: restarted NestJS consumes the factor and recovery codes written by Go")
              print("phase G ok")


          # ---- phase H ----
          def phase_h_rollback():
              print("==== phase H: rollback to legacy ====")
              start_go("legacy")
              require_go_owns_nothing()
              probe_go_routes_no_token("H legacy no token")
              probe_public_routes("H legacy public")
              parity("H legacy GET mfa", "GET", MFA_PATH, u_a_token, None, 200)
              parity("H legacy GET oidc", "GET", OIDC_PATH, w_a_token, None, 200)
              stop_nest()
              for method, path in GO_ROUTES:
                  status, raw = call(GO_URL, path, method, u_a_token, None)
                  if status != 502:
                      fail("H rollback %s %s -> %s %r, want 502 with NestJS down"
                           % (method, path, status, raw[:300]))
              start_nest()
              parity("H legacy GET mfa after restart", "GET", MFA_PATH, u_a_token, None, 200)
              print("phase H ok: API_GO_AUTH_FACTORS_MODE=legacy returns all seven routes to NestJS")


          # ---- main ----
          print("==== api-go auth factors smoke ====")
          phase_0_fixtures()
          phase_a_switch()
          phase_b_mfa()
          phase_c_interop()
          phase_d_concurrency()
          phase_e_profile_cache()
          phase_f_oidc()
          phase_g_nest_down()
          phase_h_rollback()

          print("ALL API-GO AUTH FACTORS SMOKE CHECKS PASSED")
          PY
