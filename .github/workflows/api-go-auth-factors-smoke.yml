          # ---- TOTP (RFC 6238, 本地协议计算) ----
          def base32_decode(secret):
              normalized = secret.strip().upper().rstrip("=")
              bits = 0
              value = 0
              out = bytearray()
              for char in normalized:
                  index = BASE32_ALPHABET.find(char)
                  if index < 0:
                      fail("invalid base32 character in secret: " + char)
                  value = (value << 5) | index
                  bits += 5
                  if bits >= 8:
                      out.append((value >> (bits - 8)) & 0xFF)
                      bits -= 8
              return bytes(out)


          def base32_encode(data):
              bits = 0
              value = 0
              out = ""
              for byte in data:
                  value = (value << 8) | byte
                  bits += 8
                  while bits >= 5:
                      out += BASE32_ALPHABET[(value >> (bits - 5)) & 31]
                      bits -= 5
              if bits > 0:
                  out += BASE32_ALPHABET[(value << (5 - bits)) & 31]
              return out


          def random_secret():
              return base32_encode(os.urandom(20))


          def totp_at(secret, counter):
              digest = hmac.new(base32_decode(secret), struct.pack(">Q", counter), hashlib.sha1).digest()
              offset = digest[len(digest) - 1] & 0x0F
              binary = (((digest[offset] & 0x7F) << 24) | (digest[offset + 1] << 16) |
                        (digest[offset + 2] << 8) | digest[offset + 3])
              return str(binary % 1000000).zfill(6)


          def totp_now(secret, offset=0):
              return totp_at(secret, int(time.time() // 30) + offset)


          def wrong_totp(secret):
              valid = {totp_now(secret, -1), totp_now(secret), totp_now(secret, 1)}
              for candidate in ("000000", "111111", "123456", "654321", "999999"):
                  if candidate not in valid:
                      return candidate
              fail("could not build a wrong TOTP code")


