              union = ("SELECT CAST(secret AS CHAR) AS t FROM UserTotpFactor "
                       "UNION ALL SELECT CAST(pendingSecret AS CHAR) FROM UserTotpFactor "
                       "UNION ALL SELECT codeHash FROM UserRecoveryCode "
                       "UNION ALL SELECT CAST(metadata AS CHAR) FROM AuditLog "
                       "UNION ALL SELECT CAST(payload AS CHAR) FROM AuthChallenge "
                       "UNION ALL SELECT CAST(value AS CHAR) FROM SystemSetting "
                       "UNION ALL SELECT CAST(clientSecret AS CHAR) FROM OrgOidcConfig "
                       "UNION ALL SELECT CAST(scopes AS CHAR) FROM OrgOidcConfig")
              for needle in needles:
                  if not needle:
                      continue
                  escaped = needle.replace("\\", "\\\\").replace("%", "\\%").replace("_", "\\_")
                  found = int(scalar("SELECT COUNT(*) FROM (" + union + ") x WHERE t LIKE '%"
                                     + escaped + "%'"))
                  if found != 0:
                      fail(f"{label}: plaintext {needle!r} appears in {found} database column(s)")


