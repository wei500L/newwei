          def race(targets, timeout=120):
              """Barrier 同步的并发调用；targets 为 (base, method, path, token, payload)。"""
              results = [None] * len(targets)
              barrier = threading.Barrier(len(targets))

              def worker(index, base, method, path, token, payload):
                  try:
                      barrier.wait(timeout=60)
                      results[index] = call(base, path, method, token, payload, timeout)
                  except Exception as exc:
                      results[index] = (0, repr(exc).encode())

              threads = [threading.Thread(target=worker, args=(index,) + target)
                         for index, target in enumerate(targets)]
              for thread in threads:
                  thread.start()
              for thread in threads:
                  thread.join()
              return results


          def hold_mysql_lock(lock_name, seconds=25):
              cid = container_id("mysql:8.4")
              return subprocess.Popen(
                  ["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "app", "-e",
                   "SELECT GET_LOCK('%s', 5); SELECT SLEEP(%d);" % (lock_name, seconds)],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)


          def release_mysql_lock(holder, lock_name):
              holder.terminate()
              try:
                  holder.wait(timeout=30)
              except Exception:
                  holder.kill()
              deadline = time.time() + 60
              while time.time() < deadline:
                  probe = scalar("SELECT GET_LOCK('%s', 0); SELECT RELEASE_LOCK('%s');"
                                 % (lock_name, lock_name))
                  if probe == "1":
                      return
                  time.sleep(1)
              fail("lock " + lock_name + " was not released after the holder stopped")


          def mfa_lock_name(user_id):
              # 与 auth-factors.lock.ts 的 mfaUserLockName / Go 的 mfaUserLockName
              # 完全一致：'mfa:' + sha256(userId) 的前 60 个十六进制字符。
              return "mfa:" + hashlib.sha256(user_id.encode("utf-8")).hexdigest()[:60]


          def parity(label, method, path, token=None, payload=None, expected=200, expected_message=None):
              nest_status, nest_raw = call(NEST_URL, path, method, token, payload)
              go_status, go_raw = call(GO_URL, path, method, token, payload)
              if nest_status != expected or go_status != expected:
                  fail(f"parity {label}: status nest={nest_status} go={go_status}, want {expected}; "
                       f"nest={nest_raw[:300]!r} go={go_raw[:300]!r}")
              if canon(body(nest_raw)) != canon(body(go_raw)):
                  fail(f"parity {label}: body mismatch nest={nest_raw[:600]!r} go={go_raw[:600]!r}")
              if expected_message is not None:
                  for side, raw in (("nest", nest_raw), ("go", go_raw)):
                      got = message_of(raw)
                      if got != expected_message:
                          fail(f"parity {label}: {side} message {got!r} want {expected_message!r} "
                               f"raw={raw[:400]!r}")
              print("parity ok:", label)
              return body(nest_raw), body(go_raw)


          def require_not_go(prefix):
