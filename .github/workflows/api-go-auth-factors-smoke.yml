                  ("oidc-config unknown property", OIDC_PATH, oidc_token,
                   {"enabled": True, "issuerUrl": "", "clientId": "", "extra": 1},
                   "property extra should not exist"),
              ]
              for case_label, path, token, payload, expected_message in dto_cases:
