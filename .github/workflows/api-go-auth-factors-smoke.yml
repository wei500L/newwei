          def probe_dto_contract(label, mfa_token, oidc_token):
              # MFA 写路由只要 AllowAuthenticated；OIDC 配置路由要 settings.manage，
              # 而权限守卫在 ValidationPipe 之前（Nest 的 guard 早于 pipe，Go 的
              # authorize 也早于 body 解析），所以 OIDC 的 DTO 用例必须用带权限的
              # 令牌，否则看到的是 403 而不是 400。
              dto_cases = [
                  ("verify-enroll absent body", VERIFY_ENROLL_PATH, mfa_token, None,
                   "code must be longer than or equal to 6 characters; code must be a string"),
                  ("verify-enroll empty body", VERIFY_ENROLL_PATH, mfa_token, {},
                   "code must be longer than or equal to 6 characters; code must be a string"),
                  ("verify-enroll short code", VERIFY_ENROLL_PATH, mfa_token, {"code": "12345"},
                   "code must be longer than or equal to 6 characters"),
                  ("verify-enroll numeric code", VERIFY_ENROLL_PATH, mfa_token, {"code": 123456},
                   "code must be longer than or equal to 6 characters; code must be a string"),
                  ("verify-enroll injected userId", VERIFY_ENROLL_PATH, mfa_token,
                   {"code": "123456", "userId": "af-smoke-other-user"},
                   "property userId should not exist"),
                  ("disable absent body", DISABLE_PATH, mfa_token, None,
                   "code must be longer than or equal to 6 characters; code must be a string"),
                  ("rotate absent body", ROTATE_PATH, mfa_token, None,
                   "code must be longer than or equal to 6 characters; code must be a string"),
                  ("oidc-config absent body", OIDC_PATH, oidc_token, None,
                   "enabled must be a boolean value; issuerUrl must be a string; clientId must be a string"),
                  ("oidc-config empty body", OIDC_PATH, oidc_token, {},
                   "enabled must be a boolean value; issuerUrl must be a string; clientId must be a string"),
                  ("oidc-config numeric enabled", OIDC_PATH, oidc_token,
                   {"enabled": 1, "issuerUrl": "", "clientId": ""},
                   "enabled must be a boolean value"),
                  ("oidc-config string enabled", OIDC_PATH, oidc_token,
                   {"enabled": "true", "issuerUrl": "", "clientId": ""},
                   "enabled must be a boolean value"),
                  ("oidc-config null issuerUrl", OIDC_PATH, oidc_token,
                   {"enabled": True, "issuerUrl": None, "clientId": ""},
                   "issuerUrl must be a string"),
                  ("oidc-config non-array scopes", OIDC_PATH, oidc_token,
                   {"enabled": True, "issuerUrl": "", "clientId": "", "scopes": "openid"},
                   "scopes must be an array"),
                  ("oidc-config string requireEmailVerified", OIDC_PATH, oidc_token,
                   {"enabled": True, "issuerUrl": "", "clientId": "", "requireEmailVerified": "true"},
                   "requireEmailVerified must be a boolean value"),
                  ("oidc-config numeric discoveryUrl", OIDC_PATH, oidc_token,
                   {"enabled": True, "issuerUrl": "", "clientId": "", "discoveryUrl": 5},
                   "discoveryUrl must be a string"),
                  ("oidc-config numeric clientSecret", OIDC_PATH, oidc_token,
