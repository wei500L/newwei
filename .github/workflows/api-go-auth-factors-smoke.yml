              start_go("go", omit=("MONGO_URI",))
              go_health()
              print("A4 ok: illegal modes fail startup with the exact message; go needs JWT_SECRET/"
                    "DATABASE_URL/REDIS_HOST but not MONGO_URI")

              # A5 回滚只翻转这一个开关。
              start_go("legacy")
              require_go_owns_nothing()
              require_not_go("/api/system-settings")
              require_not_go("/api/rbac")
              require_not_go("/api/admin")
              probe_go_routes_no_token("A5 legacy no token")
              parity("A5 legacy GET mfa", "GET", MFA_PATH, u_a_token, None, 200)
              parity("A5 legacy GET oidc", "GET", OIDC_PATH, w_a_token, None, 200)
              start_go("go")
              print("A5 ok: flipping API_GO_AUTH_FACTORS_MODE back to legacy only releases the seven routes")

              # ---- phase B ----
          def mfa_closed_loop(base, label, user_id, token):
              print("---- " + label + " MFA closed loop ----")
              account = email_of(user_id)
              other_user = user_v
              reset_factor(user_id)

              doc = request_json(label + " GET no factor", base, "GET", MFA_PATH, token, None, 200)
              require_keys(label + " GET no factor", doc, MFA_STATUS_KEYS)
              require(label + " GET no factor body", canon(doc), expected_status(user_id))
              require(label + " GET no factor row", factor_state(user_id), None)

              # enroll 没有请求体 DTO：absent / 空对象 / 未知字段都必须成功，
              # 且请求体里的 userId 不得改变目标用户。
              for body_label, payload in (("absent", None), ("empty", {}),
                                          ("unknown", {"userId": other_user, "extra": 1})):
                  doc = request_json(label + " enroll " + body_label, base, "POST", ENROLL_PATH,
                                     token, payload, 201)
                  require_keys(label + " enroll " + body_label, doc, ["secret", "otpauthUri"])
                  secret = doc["secret"]
                  if not BASE32_RE.match(secret):
                      fail(f"{label} enroll {body_label}: secret {secret!r} is not 32 Base32 chars")
                  require(label + " enroll " + body_label + " uri", doc["otpauthUri"],
                          expected_otpauth(account, secret))
                  state = factor_state(user_id)
                  if state is None:
                      fail(label + " enroll " + body_label + ": no factor row was created")
                  require(label + " enroll " + body_label + " pendingSecret", state[1], "<null>")
                  require(label + " enroll " + body_label + " label", state[2], account)
                  require(label + " enroll " + body_label + " pendingLabel", state[3], "<null>")
                  require(label + " enroll " + body_label + " pendingStartedAt", state[4], "<null>")
                  require(label + " enroll " + body_label + " verifiedAt", state[5], "<null>")
                  require(label + " enroll " + body_label + " disabledAt", state[6], "<null>")
                  require(label + " enroll " + body_label + " lastUsedAt", state[7], "<null>")
                  envelope = parse_json_text(state[0])
                  if not isinstance(envelope, dict) or envelope.get("__enc") != "system-settings:v1":
                      fail(label + " enroll " + body_label + ": stored secret is not a v1 envelope: "
                           + repr(state[0])[:200])
                  require(label + " enroll " + body_label + " decrypt", decrypt_v1(envelope), secret)
                  assert_no_plaintext_in_db(label + " enroll " + body_label, [secret])
                  require(label + " enroll " + body_label + " other user untouched",
                          factor_state(other_user), None)
                  doc = request_json(label + " GET after enroll " + body_label, base, "GET", MFA_PATH,
                                     token, None, 200)
                  require(label + " GET after enroll " + body_label, canon(doc), expected_status(user_id))
              print(label + " enroll: no body DTO, exact Base32 secret and byte-exact otpauth URI ok")

              request_json(label + " verify wrong code", base, "POST", VERIFY_ENROLL_PATH, token,
                           {"code": wrong_totp(secret)}, 400, INVALID_CODE)

              before_verify = factor_state(user_id)
              doc = request_json(label + " verify", base, "POST", VERIFY_ENROLL_PATH, token,
                                 {"code": totp_now(secret)}, 201)
              require_keys(label + " verify", doc, MFA_RECOVERY_KEYS)
              codes = doc["recoveryCodes"]
              require_codes_match_db(label + " verify", user_id, codes)
              require(label + " verify body", canon(doc),
                      {"recoveryCodes": codes, **expected_status(user_id)})
              require(label + " verify rows", len(recovery_rows(user_id)), 8)
              for row in recovery_rows(user_id):
                  require(label + " verify usedAt", row[1], "<null>")
              assert_no_plaintext_in_db(label + " verify", codes)
              state = factor_state(user_id)
              require(label + " verify disabledAt", state[6], "<null>")
              require(label + " verify pendingSecret", state[1], "<null>")
              require(label + " verify pendingLabel", state[3], "<null>")
              require(label + " verify pendingStartedAt", state[4], "<null>")
              require(label + " verify label", state[2], account)
              if state[5] == "<null>" or state[7] == "<null>":
                  fail(label + " verify: verifiedAt/lastUsedAt were not set")
              require(label + " verify enrolledAt kept", db_time_to_iso(state[8]),
                      db_time_to_iso(before_verify[8]))
              require_recent_iso(label + " verify verifiedAt", doc["verifiedAt"], 900)
              print(label + " verify: 201 with 8 hashed-only recovery codes and kept enrolledAt ok")

              # AF1：已完成（活跃且无 pending）的 enrollment 不能再完成一次。
              before_codes = recovery_rows(user_id)
              before_state = factor_state(user_id)
              request_json(label + " AF1 repeat verify", base, "POST", VERIFY_ENROLL_PATH, token,
                           {"code": totp_now(secret)}, 400, ENROLL_NOT_INITIALIZED)
              require(label + " AF1 codes unchanged", recovery_rows(user_id), before_codes)
              require(label + " AF1 factor unchanged", factor_state(user_id), before_state)
              print(label + " AF1: a completed enrollment cannot be completed again (codes byte-identical) ok")

              # 活跃 factor 再 enroll：只写 pendingSecret，活跃 secret 与恢复码不变。
              doc = request_json(label + " re-enroll", base, "POST", ENROLL_PATH, token, None, 201)
              secret2 = doc["secret"]
              require(label + " re-enroll uri", doc["otpauthUri"], expected_otpauth(account, secret2))
              if secret2 == secret:
                  fail(label + " re-enroll: the pending secret equals the active one")
              state = factor_state(user_id)
              require(label + " re-enroll secret unchanged", state[0], before_state[0])
              require(label + " re-enroll label unchanged", state[2], before_state[2])
              require(label + " re-enroll verifiedAt unchanged", state[5], before_state[5])
              require(label + " re-enroll disabledAt unchanged", state[6], before_state[6])
              require(label + " re-enroll lastUsedAt unchanged", state[7], before_state[7])
              if state[1] == "<null>":
                  fail(label + " re-enroll: pendingSecret was not written")
              require(label + " re-enroll pending decrypt", decrypt_v1(parse_json_text(state[1])), secret2)
              require(label + " re-enroll pendingLabel", state[3], account)
              if state[4] == "<null>":
                  fail(label + " re-enroll: pendingStartedAt was not written")
              require(label + " re-enroll codes unchanged", recovery_rows(user_id), before_codes)
              request_json(label + " re-enroll old secret rejected", base, "POST", VERIFY_ENROLL_PATH,
                           token, {"code": totp_now(secret)}, 400, INVALID_CODE)
              print(label + " re-enroll: active factor keeps its secret, pending replacement recorded ok")

              # pending 期间活跃 factor 仍然有效：rotate/disable 校验的是
              # factor.secret（活跃 secret），只有 verify-enroll 校验
              # pendingSecret ?? secret。用【旧活跃 secret】的 TOTP 授权一次
              # rotate 必须成功，且 pendingSecret 不被清掉。
              doc = request_json(label + " rotate while pending", base, "POST", ROTATE_PATH, token,
                                 {"code": totp_now(secret)}, 201)
              require_codes_match_db(label + " rotate while pending", user_id, doc["recoveryCodes"])
              require(label + " rotate while pending secret untouched", factor_state(user_id)[0],
                      before_state[0])
              if factor_state(user_id)[1] == "<null>":
                  fail(label + " rotate while pending: the pending replacement was dropped")
              print(label + " re-enroll: the active factor still authorizes rotate while pending ok")

              # pending 确认：提升新 secret、替换恢复码、重写 enrolledAt。
              doc = request_json(label + " promote pending", base, "POST", VERIFY_ENROLL_PATH, token,
                                 {"code": totp_now(secret2)}, 201)
              require_keys(label + " promote pending", doc, MFA_RECOVERY_KEYS)
              codes2 = doc["recoveryCodes"]
              require_codes_match_db(label + " promote pending", user_id, codes2)
              require(label + " promote pending body", canon(doc),
                      {"recoveryCodes": codes2, **expected_status(user_id)})
              state = factor_state(user_id)
              require(label + " promote secret", decrypt_v1(parse_json_text(state[0])), secret2)
              require(label + " promote pendingSecret", state[1], "<null>")
              require(label + " promote label", state[2], account)
              require(label + " promote pendingLabel", state[3], "<null>")
              require(label + " promote pendingStartedAt", state[4], "<null>")
              require(label + " promote disabledAt", state[6], "<null>")
              if state[5] == "<null>" or state[7] == "<null>":
                  fail(label + " promote: verifiedAt/lastUsedAt were not set")
              if db_time_to_iso(state[8]) == db_time_to_iso(before_state[8]):
                  fail(label + " promote: enrolledAt was not rewritten for a promoted pending replacement")
              require_recent_iso(label + " promote enrolledAt", doc["enrolledAt"], 900)
              if set(recovery_hashes(user_id)) & set(row[0] for row in before_codes):
                  fail(label + " promote: an old recovery code survived the replacement")
              assert_no_plaintext_in_db(label + " promote", codes2)
              print(label + " promote: pending factor promoted, recovery codes replaced, enrolledAt rewritten ok")

              # rotate：TOTP 路径 + 恢复码路径（含 trim/大写归一化）+ 旧码/已用码失效。
              before_rotate = factor_state(user_id)
              doc = request_json(label + " rotate totp", base, "POST", ROTATE_PATH, token,
                                 {"code": totp_now(secret2)}, 201)
              require_keys(label + " rotate totp", doc, MFA_RECOVERY_KEYS)
              codes3 = doc["recoveryCodes"]
              require_codes_match_db(label + " rotate totp", user_id, codes3)
              require(label + " rotate totp body", canon(doc),
                      {"recoveryCodes": codes3, **expected_status(user_id)})
              require(label + " rotate totp secret untouched", factor_state(user_id)[0], before_rotate[0])
              require(label + " rotate totp verifiedAt untouched", factor_state(user_id)[5],
                      before_rotate[5])
              if set(recovery_hashes(user_id)) & set(hash_code(c) for c in codes2):
                  fail(label + " rotate totp: an old recovery code survived")
              doc = request_json(label + " rotate recovery code", base, "POST", ROTATE_PATH, token,
                                 {"code": "  " + codes3[0].lower() + "  "}, 201)
              codes4 = doc["recoveryCodes"]
              require_codes_match_db(label + " rotate recovery code", user_id, codes4)
              require(label + " rotate recovery code body", canon(doc),
                      {"recoveryCodes": codes4, **expected_status(user_id)})
              require(label + " rotate secret still untouched", factor_state(user_id)[0], before_rotate[0])
              require(label + " rotate no enrollment started", factor_state(user_id)[1], "<null>")
              request_json(label + " rotate old code invalid", base, "POST", ROTATE_PATH, token,
                           {"code": codes3[1]}, 401, INVALID_CODE)
              request_json(label + " rotate used code invalid", base, "POST", ROTATE_PATH, token,
                           {"code": codes3[0]}, 401, INVALID_CODE)
              request_json(label + " rotate used code lowercase invalid", base, "POST", ROTATE_PATH,
                           token, {"code": codes3[0].lower()}, 401, INVALID_CODE)
              print(label + " rotate: TOTP and recovery-code paths, normalization, old codes 401 ok")

              # disable：TOTP 分支；factor 行保留，secret 不清空，恢复码删除。
              before_disable = factor_state(user_id)
              doc = request_json(label + " disable totp", base, "POST", DISABLE_PATH, token,
                                 {"code": totp_now(secret2)}, 201)
              require_keys(label + " disable totp", doc, MFA_STATUS_KEYS)
              state = factor_state(user_id)
              if state is None:
                  fail(label + " disable totp: the UserTotpFactor row was deleted")
              require(label + " disable totp body", canon(doc), expected_status(user_id))
              require(label + " disable totp enabled", doc["enabled"], False)
              require(label + " disable totp remaining", doc["recoveryCodesRemaining"], 0)
              if state[6] == "<null>":
                  fail(label + " disable totp: disabledAt was not set")
              require(label + " disable totp secret preserved", state[0], before_disable[0])
              require(label + " disable totp pendingSecret preserved", state[1], before_disable[1])
              require(label + " disable totp verifiedAt preserved", state[5], before_disable[5])
              require(label + " disable totp enrolledAt preserved", state[8], before_disable[8])
              require(label + " disable totp codes deleted", recovery_rows(user_id), [])
              if state[7] == "<null>" or state[7] == before_disable[7]:
                  fail(label + " disable totp: lastUsedAt was not refreshed: " + repr(state[7]))
              request_json(label + " rotate after disable", base, "POST", ROTATE_PATH, token,
                           {"code": totp_now(secret2)}, 401, INVALID_CODE)
              request_json(label + " disable after disable", base, "POST", DISABLE_PATH, token,
                           {"code": totp_now(secret2)}, 401, INVALID_CODE)
              print(label + " disable: 201 disabled status, factor row kept, recovery codes deleted ok")

              # 停用态再 enroll：直接替换 secret，不写 pending。
              doc = request_json(label + " enroll after disable", base, "POST", ENROLL_PATH, token,
                                 None, 201)
              secret3 = doc["secret"]
              state = factor_state(user_id)
              require(label + " enroll after disable secret", decrypt_v1(parse_json_text(state[0])), secret3)
              require(label + " enroll after disable pendingSecret", state[1], "<null>")
              require(label + " enroll after disable pendingLabel", state[3], "<null>")
              require(label + " enroll after disable pendingStartedAt", state[4], "<null>")
              require(label + " enroll after disable verifiedAt", state[5], "<null>")
              require(label + " enroll after disable disabledAt", state[6], "<null>")
              require(label + " enroll after disable lastUsedAt", state[7], "<null>")

              reset_factor(user_id)
              request_json(label + " verify without factor", base, "POST", VERIFY_ENROLL_PATH, token,
                           {"code": "123456"}, 400, ENROLL_NOT_INITIALIZED)
              request_json(label + " disable without factor", base, "POST", DISABLE_PATH, token,
                           {"code": "123456"}, 401, INVALID_CODE)
              request_json(label + " rotate without factor", base, "POST", ROTATE_PATH, token,
                           {"code": "123456"}, 401, INVALID_CODE)
              print(label + " ok: no factor -> 400/401 contracts, disabled re-enroll replaces the secret")


