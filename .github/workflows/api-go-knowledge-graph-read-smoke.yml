          VALUES
            ('kgpa00000000000000000001', '{org}', 'kgarta000000000000000001', '茅台证据标题', '茅台证据摘要', '2026-10-10 08:05:00.000', 'zh', 'finance', '2026-10-10 08:10:00.000', NOW(3), NOW(3)),
            ('kgpb00000000000000000001', 'kgorgb000000000000000001', 'kgartb000000000000000001', 'other title', 'other', '2026-10-10 09:05:00.000', 'en', 'politics', '2026-10-10 09:10:00.000', NOW(3), NOW(3));
          INSERT INTO KnowledgeEdge (id, orgId, type, fromEntityId, toEntityId, weight, confidence, properties, firstSeenAt, lastSeenAt, createdAt, updatedAt)
          VALUES
            ('kgedgea00000000000000001', '{org}', 'has_ticker', 'kgenta000000000000000001', 'kgenta000000000000000002', 5, 0.9, CAST('{{"note":"ticker"}}' AS JSON), NOW(3), NOW(3), NOW(3), NOW(3)),
            ('kgedgea00000000000000002', '{org}', 'belongs_to_industry', 'kgenta000000000000000002', 'kgenta000000000000000004', 3, 0.7, NULL, NOW(3), NOW(3), NOW(3), NOW(3)),
            ('kgedgea00000000000000003', '{org}', 'has_ticker', 'kgenta000000000000000002', 'kgentb000000000000000001', 10, 0.95, CAST('{{"dirty":true}}' AS JSON), NOW(3), NOW(3), NOW(3), NOW(3)),
