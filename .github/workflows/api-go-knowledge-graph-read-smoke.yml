            ('kgsenta00000000000000002', '{org}', '长城', '', NOW(3) - INTERVAL 5 DAY, 8, 4, 3, 1, -2, -0.25, 0.5, NULL, NOW(3), NOW(3)),
            ('kgsenta00000000000000003', '{org}', '长城', 'industry', NOW(3) - INTERVAL 5 DAY, 6, 1, 4, 1, 5, 0.83, 0.17, NULL, NOW(3), NOW(3)),
            ('kgsentb00000000000000001', 'kgorgb000000000000000001', '其它组织公司', 'company', NOW(3) - INTERVAL 5 DAY, 4, 2, 1, 1, -1, -0.25, 0.5, NULL, NOW(3), NOW(3));
          INSERT INTO NewsEvent (id, orgId, status, language, primaryTopic, primaryEntity, title, summary, startAt, lastAt, metadata, createdAt, updatedAt)
          VALUES
            ('kgeventa0000000000000001', '{org}', 'active', 'zh', 'markets', '贵州茅台酒股份有限公司', '茅台事件', '事件摘要', NOW(3) - INTERVAL 2 DAY, NOW(3) - INTERVAL 1 DAY, NULL, NOW(3), NOW(3)),
            ('kgeventb0000000000000001', 'kgorgb000000000000000001', 'active', 'en', 'other', '其它组织公司', 'other event', 'hidden', NOW(3) - INTERVAL 2 DAY, NOW(3) - INTERVAL 1 DAY, NULL, NOW(3), NOW(3));
          INSERT INTO NewsEventItem (id, orgId, eventId, processedArticleId, processedItemId, similarity, assignedBy, createdAt)
          VALUES
            ('kgeitema0000000000000001', '{org}', 'kgeventa0000000000000001', 'kgpa00000000000000000001', '64b0000000000000000000e1', 0.9, 'overlap', NOW(3) - INTERVAL 1 DAY),
            ('kgeitemb0000000000000001', 'kgorgb000000000000000001', 'kgeventb0000000000000001', 'kgpb00000000000000000001', '64b0000000000000000000e2', 0.5, 'overlap', NOW(3) - INTERVAL 1 DAY);
          INSERT INTO AlertNotificationChannel (id, orgId, type, name, target, isActive, config, createdAt, updatedAt)
          VALUES ('kgchan00000000000000001', '{org}', 'email', 'KG Desk', 'kg@example.com', 1, NULL, NOW(3), NOW(3));
          """)
          role = sql(f"SELECT roleId FROM Membership WHERE userId='{admin}' AND orgId='{org}' LIMIT 1")
          for key, pid in perms.items():
              if not sql(f"SELECT id FROM RolePermission WHERE roleId='{role}' AND permissionId='{pid}' LIMIT 1"):
                  sql(f"INSERT INTO RolePermission (id, roleId, permissionId) VALUES ('kgrpadmin{key[:6]}00000000001', '{role}', '{pid}')")
          open("/tmp/kg-org", "w").write(org)
          open("/tmp/kg-admin", "w").write(admin)
          open("/tmp/kg-role", "w").write(role)
          open("/tmp/kg-perms", "w").write(json.dumps(perms))

          token_a = login(os.environ["SEED_ADMIN_EMAIL"])
          token_c = login("kg-c@example.com")
          token_b = login("kg-b@example.com")
          payload = token_a.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          if "dashboards.read" not in (claims.get("permissions") or []):
              fail(f"login JWT missing dashboards.read claim {claims.keys()}")
          open("/tmp/kg-token", "w").write(token_a)
          open("/tmp/kg-token-b", "w").write(token_b)
          open("/tmp/kg-token-c", "w").write(token_c)

          subgraph_query = """
          query Sub($input: KnowledgeGraphSubgraphInput!) {
            getKnowledgeGraphSubgraph(input: $input) {
              seed { id name type properties }
              nodes { id name type properties }
              edges { id from to type weight confidence properties }
              metadata { totalNodes totalEdges generatedAt }
            }
          }"""
          links_query = """
          query Links($articleId: String!) {
            articleEntityLinks(articleId: $articleId, limit: 50) {
              articleId mention confidence createdAt entity { id name type properties }
            }
          }"""
          evidence_query = """
          query EdgeEvidence($edgeId: String!) {
            knowledgeGraphEdgeEvidence(edgeId: $edgeId, limit: 20) {
              id confidence extractorVersion createdAt evidence
              article { id url title summary language crawlAt }
            }
          }"""
          card_query = """
          query Card($input: EntityIntelligenceCardInput!) {
            entityIntelligenceCard(input: $input) {
              entity { id name type properties }
              aliases
              metrics { relationshipCount incomingEdgeCount outgoingEdgeCount mentionedArticleCount recentEventCount avgSentiment negativeRatio latestMentionAt }
              relationships { direction evidenceCount latestEvidenceAt edge { id from to type weight confidence properties } neighbor { id name type properties } }
              sentimentSeries { entityName entityType bucketStart totalDocs negativeDocs positiveDocs neutralDocs scoreSum avgScore negativeRatio evidenceProcessedItemIds }
              neighborhood { seed { id name type } nodes { id name type } edges { id from to } metadata { totalNodes totalEdges generatedAt } }
              generatedAt
            }
          }"""
          intel_evidence_query = """
          query IntelEvidence($input: EntityIntelligenceEvidenceInput!) {
            entityIntelligenceEvidence(input: $input) {
              restricted
              events { id status title summary primaryTopic primaryEntity startAt lastAt itemCount }
              articles { article { id url sourceLabel title summary language crawlAt } mention confidence linkedAt }
              generatedAt
            }
          }"""
          name_query = """
          query Name($name: String!, $type: String) {
            knowledgeEntityByName(name: $name, type: $type) { id name type properties }
          }"""
          queries = {
              "subgraph": (subgraph_query, {"input": {"seedName": "贵州茅台酒", "maxDepth": 2, "maxNodes": 50}}),
              "links": (links_query, {"articleId": "kgarta000000000000000001"}),
              "evidence": (evidence_query, {"edgeId": "kgedgea00000000000000001"}),
              "card_company": (card_query, {"input": {"entityId": "kgenta000000000000000001", "windowDays": 30, "relatedLimit": 12}}),
              "card_homonym": (card_query, {"input": {"entityId": "kgenta000000000000000003", "windowDays": 30, "relatedLimit": 12}}),
              "intel_evidence": (intel_evidence_query, {"input": {"entityId": "kgenta000000000000000001", "windowDays": 30, "eventsLimit": 10, "evidenceLimit": 12}}),
              "name_ticker": (name_query, {"name": "600519"}),
              "name_company": (name_query, {"name": "贵州茅台酒"}),
          }
          open("/tmp/kg-queries.json", "w").write(json.dumps(queries, ensure_ascii=False))

          def gql(base, token, query, variables=None):
              status, raw, _ = call(base, "/graphql", "POST", token, {"query": query, "variables": variables or {}})
              return status, body(raw)

          def scrub(value):
              if isinstance(value, dict):
                  return {k: scrub(v) for k, v in value.items() if k not in ("traceId", "locations", "stack", "originalError", "generatedAt")}
              if isinstance(value, list):
                  return [scrub(v) for v in value]
              return value

          def same(left, right):
              if isinstance(left, dict) and isinstance(right, dict):
                  if left.keys() != right.keys():
