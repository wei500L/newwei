          VALUES ('kgroleb00000000000000001', 'kgorgb000000000000000001', 'kg-other', 'other', 0);
          INSERT INTO RolePermission (id, roleId, permissionId)
          VALUES ('kgrpb0000000000000000001', 'kgroleb00000000000000001', '{perms['dashboards.read']}');
          INSERT INTO RolePermission (id, roleId, permissionId)
          VALUES ('kgrpb0000000000000000002', 'kgroleb00000000000000001', '{perms['items.read']}');
          INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
          SELECT 'kguserb000000000000000001', 'kg-b@example.com', passwordHash, 'Other', 'Org', 1, NOW(3), NOW(3), NOW(3)
          FROM User WHERE id = '{admin}';
          INSERT INTO Membership (id, userId, orgId, roleId, isActive, createdAt)
          VALUES ('kgmembb00000000000000001', 'kguserb000000000000000001', 'kgorgb000000000000000001', 'kgroleb00000000000000001', 1, NOW(3));
          INSERT INTO Role (id, orgId, name, description, isSystem)
          VALUES ('kgrolec00000000000000001', '{org}', 'kg-dash-only', 'dashboards.read only', 0);
          INSERT INTO RolePermission (id, roleId, permissionId)
          VALUES ('kgrpc0000000000000000001', 'kgrolec00000000000000001', '{perms['dashboards.read']}');
          INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
          SELECT 'kguserc000000000000000001', 'kg-c@example.com', passwordHash, 'Dash', 'Only', 1, NOW(3), NOW(3), NOW(3)
          FROM User WHERE id = '{admin}';
          INSERT INTO Membership (id, userId, orgId, roleId, isActive, createdAt)
          VALUES ('kgmemc000000000000000001', 'kguserc000000000000000001', '{org}', 'kgrolec00000000000000001', 1, NOW(3));
          INSERT INTO KnowledgeEntity (id, orgId, type, canonicalName, normalizedKey, properties, createdAt, updatedAt)
          VALUES
            ('kgenta000000000000000001', '{org}', 'company', '贵州茅台酒股份有限公司', '贵州茅台酒股份有限公司', CAST('{{"ticker":"600519.SH"}}' AS JSON), NOW(3), NOW(3)),
            ('kgenta000000000000000002', '{org}', 'instrument', '600519.SH', '600519.sh', CAST('{{"exchange":"SH"}}' AS JSON), NOW(3), NOW(3)),
            ('kgenta000000000000000003', '{org}', 'company', '长城', '长城', NULL, NOW(3), NOW(3)),
            ('kgenta000000000000000004', '{org}', 'industry', '长城', '长城', NULL, NOW(3), NOW(3)),
            ('kgentb000000000000000001', 'kgorgb000000000000000001', 'company', '其它组织公司', '其它组织公司', NULL, NOW(3), NOW(3));
          INSERT INTO KnowledgeEntityAlias (id, orgId, entityId, alias, normalizedAlias, source, createdAt)
          VALUES
            ('kgalias00000000000000001', '{org}', 'kgenta000000000000000001', '贵州茅台酒股份有限公司', '贵州茅台酒股份有限公司', 'seed', NOW(3) - INTERVAL 3 MINUTE),
            ('kgalias00000000000000002', '{org}', 'kgenta000000000000000001', '贵州茅台酒', '贵州茅台酒', 'seed', NOW(3) - INTERVAL 2 MINUTE),
            ('kgalias00000000000000003', '{org}', 'kgenta000000000000000001', '贵州茅台酒股份', '贵州茅台酒股份', 'derived', NOW(3) - INTERVAL 1 MINUTE),
            ('kgalias00000000000000004', '{org}', 'kgenta000000000000000002', '600519', '600519', 'seed', NOW(3)),
            ('kgalias00000000000000005', '{org}', 'kgenta000000000000000002', '600519.SH', '600519.sh', 'seed', NOW(3)),
            ('kgalias00000000000000006', '{org}', 'kgenta000000000000000002', 'SH600519', 'sh600519', 'seed', NOW(3)),
            ('kgalias00000000000000007', '{org}', 'kgenta000000000000000003', '长城', '长城', 'seed', NOW(3)),
            ('kgalias00000000000000008', '{org}', 'kgenta000000000000000004', '长城', '长城', 'llm', NOW(3)),
            ('kgaliasb00000000000000001', 'kgorgb000000000000000001', 'kgentb000000000000000001', '其它组织公司', '其它组织公司', 'seed', NOW(3));
          INSERT INTO Article (id, orgId, url, sourceLabel, titleGuess, language, crawlAt, contentHash, createdAt, updatedAt)
          VALUES
            ('kgarta000000000000000001', '{org}', 'https://www.reuters.com/kg-smoke', 'Reuters', '茅台 ticker', 'zh', '2026-10-10 08:00:00.000', 'kg-hash-a', NOW(3), NOW(3)),
            ('kgartb000000000000000001', 'kgorgb000000000000000001', 'https://www.bbc.com/kg-other', 'BBC', 'other', 'en', '2026-10-10 09:00:00.000', 'kg-hash-b', NOW(3), NOW(3));
