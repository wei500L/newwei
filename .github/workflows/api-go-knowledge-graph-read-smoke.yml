          INSERT INTO KnowledgeEdgeEvidence (id, orgId, edgeId, articleId, extractorVersion, confidence, evidence, createdAt)
          VALUES
            ('kgevida00000000000000001', '{org}', 'kgedgea00000000000000001', 'kgarta000000000000000001', 'v1', 0.88, CAST('{{"quote":"600519 是代码"}}' AS JSON), '2026-10-10 08:20:00.000'),
