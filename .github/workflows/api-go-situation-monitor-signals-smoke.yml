          status, listed = same("/api/situation-monitor/monitors", token=tokens["u1"])
          if status != 200 or not isinstance(listed, list) or not any(item.get("id") == "sig-keyword" for item in listed):
              fail(f"independence monitors list was not served by the monitors handler {status} {listed}")
          status, preview = call(go, "/api/situation-monitor/monitors/preview", "POST", tokens["u1"], preview_body)
          if status != 201 or body(preview).get("locationResolution", {}).get("lat") != 55.75 or "kind" in body(preview):
              fail(f"independence preview {status} {preview[:300]!r}")
          status, raw = call(go, "/api/situation-monitor/monitors", "POST", tokens["u1"],
                             {"name": "Independence Monitor", "rawKeywords": ["independence-marker"]})
          created = body(raw)
          if status != 201 or not created or not created.get("id"):
              fail(f"independence create {status} {raw[:300]!r}")
          created_id = created["id"]
          status, raw = call(go, f"/api/situation-monitor/monitors/{created_id}", "PATCH", tokens["u1"], {"name": "Independence Renamed"})
          if status != 200 or body(raw).get("name") != "Independence Renamed":
              fail(f"independence patch {status} {raw[:300]!r}")
          status, raw = call(go, f"/api/situation-monitor/monitors/{created_id}", "DELETE", tokens["u1"])
          if status != 200 or body(raw) != {"ok": True}:
              fail(f"independence delete {status} {raw[:300]!r}")
          print("stage1 independence ok")

          # POST /refresh is exercised last in stage 1: it runs the signal poll
          # jobs, which record an in-process NestJS poll error, so a later feed
          # parity comparison would differ for a reason unrelated to the proxy.
          status = same_status("/api/situation-monitor/refresh", "POST", tokens["u2"], {})
          if status not in (200, 201):
              fail(f"fallback write /refresh {status}")
          print("stage1 fallback refresh ok")

          # ---------------------------------------------------------------- stage 2: defect regression
          before = mongo_number("db.situationsignalfeedbacks.countDocuments({})")
          blank_body = {"signalType": "narrative", "signalId": " ", "label": "false_positive"}
          nest_status, nest_raw = call(nest, "/api/situation-monitor/feedback", "POST", tokens["u1"], blank_body)
          go_status, go_raw = call(go, "/api/situation-monitor/feedback", "POST", tokens["u1"], blank_body)
          if nest_status != 400 or go_status != 400:
              fail(f"s1 status nest={nest_status} go={go_status} {nest_raw[:200]!r} {go_raw[:200]!r}")
          if message(nest_raw) != "signalId is required" or message(go_raw) != "signalId is required":
              fail(f"s1 message nest={message(nest_raw)!r} go={message(go_raw)!r}")
          print("stage2 s1 blank signalId 400 ok")
          after = mongo_number("db.situationsignalfeedbacks.countDocuments({})")
          if after != before:
              fail(f"s1 inserted a row {before} -> {after}")
          print("stage2 s1 no row inserted ok")

          redis_set(REFRESH_RUN_PREFIX + RUN_BROKEN, json.dumps({
              "refreshId": RUN_BROKEN, "orgId": org, "requestedAt": "2026-01-03T00:00:00.000Z",
              "taskWindowStart": WINDOW_START, "terminal": False,
          }, separators=(",", ":")))
          redis_set(REFRESH_RUN_PREFIX + RUN_BADTIME, json.dumps({
              "refreshId": RUN_BADTIME, "orgId": org, "requestedAt": "2026-01-03T00:00:00.000Z",
              "taskWindowStart": "not-a-timestamp", "terminal": False,
          }, separators=(",", ":")))
          expected_empty_crawl = {"activeSourceCount": 0, "permitted": False, "attempted": False,
                                  "schedulerTriggered": False, "crawlTaskCount": 0, "analysisTaskCount": 0}
          expected_zero = {status: 0 for status in CRAWL_STATUSES}
          expected_zero_analysis = {status: 0 for status in ANALYSIS_STATUSES}
          for base, label in ((nest, "nest"), (go, "go")):
              status, raw = call(base, f"/api/situation-monitor/refresh-runs/{RUN_BROKEN}", "GET", tokens["u1"])
              doc = body(raw)
              if status != 200 or status == 500:
                  fail(f"s2 run broken {label} {status} {raw[:300]!r}")
              if doc.get("crawl") != expected_empty_crawl or not isinstance(doc["crawl"].get("permitted"), bool):
                  fail(f"s2 run broken crawl {label} {doc.get('crawl')}")
              if doc.get("progress", {}).get("crawlTasks") != expected_zero or doc.get("progress", {}).get("analysisTasks") != expected_zero_analysis:
                  fail(f"s2 run broken progress {label} {doc.get('progress')}")
              if doc.get("warnings") != [] or doc.get("terminal") is not True or doc.get("status") != "completed":
                  fail(f"s2 run broken tail {label} {doc}")
          print("stage2 s2 run broken 200 ok")

          for base, label in ((nest, "nest"), (go, "go")):
              status, raw = call(base, f"/api/situation-monitor/refresh-runs/{RUN_BADTIME}", "GET", tokens["u1"])
              if status != 404 or status == 500:
                  fail(f"s2 run bad time {label} {status} {raw[:300]!r}")
              if message(raw) != "Situation Monitor refresh run not found.":
                  fail(f"s2 run bad time message {label} {message(raw)!r}")
          print("stage2 s2 run bad time 404 ok")

          # ---------------------------------------------------------------- stage 3: NestJS down
          if os.path.exists("/tmp/api-nestjs.pid"):
              os.kill(int(open("/tmp/api-nestjs.pid").read().strip()), 15)
          subprocess.run(["pkill", "-f", "apps/api/dist/main.js"], check=False)
          subprocess.run(["pkill", "-f", "node dist/main.js"], check=False)
          stopped = False
          for _ in range(30):
              try:
                  urllib.request.urlopen(nest + "/api/healthz/live", timeout=2).read()
              except Exception:
                  stopped = True
                  break
              time.sleep(1)
          if not stopped:
              fail("nestjs did not stop")
          print("stage3 nest stopped ok")

          checks = [
              ("GET", "/api/situation-monitor/catalog", None, 200),
              ("POST", "/api/situation-monitor/feedback",
               {"signalType": "narrative", "signalId": "sig-stage3-feedback", "label": "false_positive", "note": "stage3"}, 201),
              ("GET", f"/api/situation-monitor/refresh-runs/{RUN_FULL}", None, 200),
              ("GET", "/api/situation-monitor/telegram-feed", None, 200),
              ("GET", "/api/situation-monitor/oref-alerts", None, 200),
              ("GET", "/api/situation-monitor/oref-history", None, 200),
              ("GET", "/api/situation-monitor/live-hls-proxy-config?channel=cnn", None, 200),
          ]
          for method, path, payload, expect in checks:
              status, raw = call(go, path, method, tokens["u1"], payload)
              if status != expect:
                  fail(f"after nest stop {method} {path} {status} {raw[:300]!r}")
          print("stage3 seven signals routes ok")

          for method, path, payload in (
              ("GET", "/api/situation-monitor/insights", None),
              ("POST", "/api/situation-monitor/refresh", {}),
              ("GET", "/api/system-settings/realtime-signals/runtime", None),
          ):
              status, raw = call(go, path, method, tokens["u1"], payload)
              if status != 502:
                  fail(f"after nest stop {method} {path} {status} {raw[:300]!r}")
          print("stage3 unmigrated routes 502 ok")
          PY
