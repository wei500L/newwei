          def decrypt_v1(envelope):
              """Decrypts one system-settings v1 envelope with the CI key via node:crypto."""
              if not isinstance(envelope, dict) or envelope.get("__enc") != "system-settings:v1":
                  fail("expected a v1 envelope, got " + json.dumps(envelope)[:200])
              script = (
                  "const c=require('node:crypto');"
                  "const [iv,tag,data,key]=process.argv.slice(1);"
                  "const d=c.createDecipheriv('aes-256-gcm',Buffer.from(key,'hex'),Buffer.from(iv,'base64'));"
                  "d.setAuthTag(Buffer.from(tag,'base64'));"
                  "process.stdout.write(Buffer.concat([d.update(Buffer.from(data,'base64')),d.final()]).toString('utf8'));"
              )
              proc = subprocess.run(["node", "-e", script, envelope["iv"], envelope["tag"], envelope["data"], VALID_KEY],
                                    capture_output=True, text=True)
              if proc.returncode != 0:
                  fail("v1 decryption failed: " + proc.stderr[-300:])
              return proc.stdout


          VECTOR_LOCK_NAME = "infra-settings:vector-service:v1"
          SECRETS_LOCK_NAME = "infra-settings:news-source-runtime-secrets:v1"


          def hold_mysql_lock(lock_name, seconds=25):
              """Holds one GET_LOCK on an independent MySQL session (docker exec)."""
              cid = container_id("mysql:8.4")
              return subprocess.Popen(
                  ["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "app", "-e",
                   "SELECT GET_LOCK('%s', 5); SELECT SLEEP(%d);" % (lock_name, seconds)],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)


          def release_mysql_lock(holder, lock_name, cid_ready=None):
              """Stops the holder and waits until the lock is observably free again.

              Terminating the docker exec client does not necessarily end the in-container
              mysql session immediately, so the lock is probed from a fresh session
              instead of assuming it is free.
              """
              holder.terminate()
              try:
                  holder.wait(timeout=30)
              except Exception:
                  holder.kill()
              deadline = time.time() + 60
              while time.time() < deadline:
                  probe = scalar("SELECT GET_LOCK('%s', 0); SELECT RELEASE_LOCK('%s');" % (lock_name, lock_name))
                  if probe == "1":
                      return
                  time.sleep(1)
              fail("lock " + lock_name + " was not released after the holder stopped")


          def lock_protocol_group(tag, token):
              """Both sides must wait for the same global lock and fail 503 without writing."""
              label = tag + " lock"
              reset_all()
              request_json(label + " baseline write", GO_URL, "PUT", VECTOR_PATH, token, VECTOR_PUT_BASE, 200)

              holder = hold_mysql_lock(VECTOR_LOCK_NAME)
              try:
                  time.sleep(2.0)
                  before = json.dumps(db_doc(VECTOR_KEY), sort_keys=True)
                  for base, side in ((GO_URL, "go"), (NEST_URL, "nest")):
                      payload = dict(VECTOR_PUT_BASE)
                      payload["maxRetries"] = 7
                      started = time.monotonic()
                      status, raw = call(base, VECTOR_PATH, "PUT", token, payload, timeout=90)
                      elapsed = time.monotonic() - started
                      doc = body(raw) or {}
                      if status != 503 or doc.get("message") != "Internal server error":
                          fail("%s %s: status=%s body=%s, want 503" % (label, side, status, raw[:300]))
                      if doc.get("error") != "Service Unavailable":
                          fail("%s %s: error=%r, want 'Service Unavailable'" % (label, side, doc.get("error")))
                      if elapsed < 9 or elapsed > 35:
                          fail("%s %s: request returned after %.1fs, want the 10s lock timeout" % (label, side, elapsed))
                      if json.dumps(db_doc(VECTOR_KEY), sort_keys=True) != before:
                          fail("%s %s: a lock-blocked write changed the configuration row" % (label, side))
                  print("lock ok: Go and NestJS both waited for " + VECTOR_LOCK_NAME + " and wrote nothing")
              finally:
                  release_mysql_lock(holder, VECTOR_LOCK_NAME)

              # The secret lock is the same protocol on the second lock name.
              reset_all()
              request_json(label + " secrets baseline", GO_URL, "PUT", SECRETS_PATH, token,
                           {"upserts": [{"sourceId": "lock", "key": "k", "value": "v"}]}, 200)
              holder = hold_mysql_lock(SECRETS_LOCK_NAME)
              try:
                  time.sleep(2.0)
                  status, raw = call(GO_URL, SECRETS_PATH, "PUT", token,
                                     {"upserts": [{"sourceId": "lock", "key": "k2", "value": "v2"}]}, timeout=90)
                  if status != 503:
                      fail("%s secrets: status=%s, want 503 while the lock is held" % (label, status))
                  # runtime_map_from_db() is keyed by (sourceId, key) tuples.
                  keys = sorted(key for _, key in runtime_map_from_db().keys())
                  if keys != ["k"]:
                      fail("%s secrets: lock-blocked write changed entries: %s" % (label, keys))
                  print("lock ok: " + SECRETS_LOCK_NAME + " blocks the Go write without side effects")
              finally:
                  release_mysql_lock(holder, SECRETS_LOCK_NAME)

              payload = dict(VECTOR_PUT_BASE)
              payload["maxRetries"] = 7
              request_json(label + " write after release", GO_URL, "PUT", VECTOR_PATH, token, payload, 200)
              print(label + " ok")


          def is3_group(tag, token):
              label = tag + " IS3"
              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  reset_all()
                  payload = dict(VECTOR_PUT_BASE)
                  payload["token"] = "TOKEN-A"
                  request_json(label + " store A", base, "PUT", VECTOR_PATH, token, payload, 200)
                  envelope_a = json.dumps(db_doc(VECTOR_KEY)["token"], sort_keys=True)
                  payload["token"] = "TOKEN-B"
                  request_json(label + " store B", base, "PUT", VECTOR_PATH, token, payload, 200)
                  document_b = db_doc(VECTOR_KEY)
                  envelope_b = json.dumps(document_b["token"], sort_keys=True)
                  if envelope_a == envelope_b:
                      fail(label + " " + side + ": rotated token envelope equals the old one")

                  stale = json.loads(json.dumps(document_b))
                  stale["token"] = json.loads(envelope_a)
                  stale["enabled"] = True
                  stale["baseUrl"] = "http://stale.example:9000"
                  redis("SET", "vector_service:settings", json.dumps({"exists": True, "value": stale}))
                  observed = request_json(label + " stale cache GET", base, "GET", VECTOR_PATH, token, None, 200)
                  if observed.get("enabled") is not True or observed.get("baseUrl") != "http://stale.example:9000":
                      fail(label + " " + side + ": planted stale cache envelope was not observed: " + json.dumps(observed))

                  omitted = dict(VECTOR_PUT_BASE)
                  request_json(label + " update without token", base, "PUT", VECTOR_PATH, token, omitted, 200)
                  envelope_final = json.dumps(db_doc(VECTOR_KEY)["token"], sort_keys=True)
                  if envelope_final == envelope_a:
                      fail(label + " " + side + ": the stale cached token A was written back")
                  if envelope_final != envelope_b:
                      fail(label + " " + side + ": the retained token is not the rotated token B envelope")
                  plaintext = decrypt_v1(db_doc(VECTOR_KEY)["token"])
                  if plaintext != "TOKEN-B":
                      fail(label + " " + side + ": decrypted retained token is %r, want %r" % (plaintext, "TOKEN-B"))
                  print("IS3 ok:", side + " (decrypted retained token = TOKEN-B)")
              print(label + " ok")


