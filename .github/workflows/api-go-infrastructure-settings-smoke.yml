          def concurrent_case(label, seed, payload_a, payload_b, expected_keys, base_a, base_b, token):
              reset_all()
              if seed is not None:
                  seed_runtime_doc([runtime_entry(source, key, value) for source, key, value in seed])
              results = {}
              barrier = threading.Barrier(2)

              def worker(index, base, payload):
                  try:
                      barrier.wait(timeout=30)
                      results[index] = call(base, SECRETS_PATH, "PUT", token, payload)
                  except Exception as exc:
                      results[index] = (0, repr(exc).encode())

              threads = [threading.Thread(target=worker, args=(0, base_a, payload_a)),
                         threading.Thread(target=worker, args=(1, base_b, payload_b))]
              for thread in threads:
                  thread.start()
              for thread in threads:
                  thread.join()
              for index in (0, 1):
                  status, raw = results.get(index, (0, b""))
                  if status != 200:
                      fail(f"{label}: concurrent PUT {index} -> {status} {raw[:300]!r}")
              entries = runtime_entries_from_db() or []
              got = sorted(item["key"] for item in entries)
              if got != sorted(expected_keys):
                  fail(f"{label}: final DB keys {got}, want {sorted(expected_keys)}")
              doc = request_json(label + " verify GET", base_a, "GET", SECRETS_PATH, token, None, 200)
              got_get = sorted(item["key"] for item in doc["entries"])
              if got_get != sorted(expected_keys):
                  fail(f"{label}: GET keys {got_get}, want {sorted(expected_keys)}")
              print("concurrency ok:", label)


          def is2_group(tag, token):
              label = tag + " IS2"
              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  reset_all()
                  seed_runtime_doc([runtime_entry("fresh", "k", "v1")])
                  first = request_json(label + " fresh GET 1", base, "GET", SECRETS_PATH, token, None, 200)
                  require(label + " fresh GET 1 " + side, first["entries"][0]["fingerprint"], fingerprint("v1"))
                  seed_runtime_doc([runtime_entry("fresh", "k", "v2")])
                  second = request_json(label + " fresh GET 2", base, "GET", SECRETS_PATH, token, None, 200)
                  require(label + " fresh GET 2 " + side + " (DB authoritative)",
                          second["entries"][0]["fingerprint"], fingerprint("v2"))

              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  reset_all()
                  seed_runtime_doc([runtime_entry("s", "a", "va")])
                  request_json(label + " merge warm", base, "GET", SECRETS_PATH, token, None, 200)
                  seed_runtime_doc([runtime_entry("s", "a", "va"), runtime_entry("s", "b", "vb")])
                  doc = request_json(label + " merge PUT", base, "PUT", SECRETS_PATH, token,
                                     {"upserts": [{"sourceId": "s", "key": "c", "value": "vc"}]}, 200)
                  keys = sorted(item["key"] for item in doc["entries"])
                  require(label + " merge PUT " + side, keys, ["a", "b", "c"])
              print(label + " admin GET freshness and lock-scoped merge base ok")

              for case_label, seed, payload_a, payload_b, expected in CONCURRENCY_CASES:
                  for pair_label, base_a, base_b in (("Nest/Nest", NEST_URL, NEST_URL),
                                                     ("Go/Go", GO_URL, GO_URL),
                                                     ("Nest/Go", NEST_URL, GO_URL)):
                      concurrent_case(f"{label} {case_label} {pair_label}", seed, payload_a, payload_b, expected,
                                      base_a, base_b, token)
              print(label + " ok")


          def stored_entry_value_type():
              return scalar("SELECT JSON_TYPE(JSON_EXTRACT(value, '$.entries[0].value')) FROM SystemSetting "
                            "WHERE `key`='news_source_runtime_secrets'")


          def stored_entry_enc_tag():
              return scalar("SELECT JSON_UNQUOTE(JSON_EXTRACT(value, '$.entries[0].value.__enc')) FROM SystemSetting "
                            "WHERE `key`='news_source_runtime_secrets'")


          def crypto_switch_matrix(tag, token):
              label = tag + " crypto switch"
              # 三态：行不存在 / 该字段不是 boolean（都按“未配置”处理 → 有 key 即加密）；
              # 显式 secretEncryptionEnabled=false → 明文。第三态是 Go 侧曾经的缺陷：
              # 把非 boolean 折叠成 false 会静默把加密降到明文。
              for security_doc, want_type, want_tag, side_label in (
                  (None, "OBJECT", "system-settings:v1", "system_security absent"),
                  ('{"mfaPolicy":"off"}', "OBJECT", "system-settings:v1", "flag missing"),
                  ('{"secretEncryptionEnabled":"yes","mfaPolicy":"off"}', "OBJECT", "system-settings:v1", "flag non-boolean"),
                  ('{"secretEncryptionEnabled":false,"mfaPolicy":"off"}', "STRING", "", "flag false"),
              ):
                  for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                      reset_all()
                      set_system_security(security_doc)
                      request_json(label + " " + side_label + " " + side, base, "PUT", SECRETS_PATH, token,
                                   {"upserts": [{"sourceId": "crypto", "key": "k", "value": "secret-value"}]}, 200)
                      require(label + " " + side_label + " " + side + " stored type", stored_entry_value_type(), want_type)
                      if want_tag:
                          require(label + " " + side_label + " " + side + " envelope", stored_entry_enc_tag(), want_tag)

              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  reset_all()
                  set_system_security('{"secretEncryptionEnabled":false,"mfaPolicy":"off"}')
                  payload = dict(VECTOR_PUT_BASE)
                  payload["token"] = "plain-token"
                  request_json(label + " vector plaintext " + side, base, "PUT", VECTOR_PATH, token, payload, 200)
                  require(label + " vector plaintext " + side + " stored", db_doc(VECTOR_KEY)["token"], "plain-token")

                  reset_all()
                  set_system_security(None)
                  request_json(label + " vector encrypted " + side, base, "PUT", VECTOR_PATH, token, payload, 200)
                  stored = db_doc(VECTOR_KEY)["token"]
                  if not isinstance(stored, dict) or stored.get("__enc") != "system-settings:v1":
                      fail(label + " vector encrypted " + side + ": stored token is not an envelope: " + repr(stored))
              print(label + " ok")


          def no_key_matrix(tag, token):
              label = tag + " no key"
              production_message = "SYSTEM_SETTINGS_ENCRYPTION_KEY is required to store secrets in production"
              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  reset_all()
                  set_system_security(None)
                  before_state = setting_state()
                  request_json(label + " runtime secrets " + side, base, "PUT", SECRETS_PATH, token,
                               {"upserts": [{"sourceId": "nk", "key": "k", "value": "v"}]}, 400, production_message)
                  payload = dict(VECTOR_PUT_BASE)
                  payload["token"] = "tok"
                  request_json(label + " vector " + side, base, "PUT", VECTOR_PATH, token, payload, 400,
                               production_message)
                  request_json(label + " storage " + side, base, "PATCH", STORAGE_PATH, token,
                               {"secretAccessKey": "v"}, 400, production_message)
                  if setting_state() != before_state:
                      fail(label + " " + side + ": a rejected production write changed SystemSetting")

                  set_system_security('{"secretEncryptionEnabled":true,"mfaPolicy":"off"}')
                  request_json(label + " enabled without key " + side, base, "PUT", SECRETS_PATH, token,
                               {"upserts": [{"sourceId": "nk", "key": "k", "value": "v"}]}, 400,
                               "Secret encryption is enabled but SYSTEM_SETTINGS_ENCRYPTION_KEY is not configured")
              print(label + " ok")


          def invalid_key_matrix(tag, token):
              label = tag + " invalid key"
              detail = "SYSTEM_SETTINGS_ENCRYPTION_KEY must be 32 bytes (base64) or 64 hex chars"
              expected = "Secret encryption is enabled but SYSTEM_SETTINGS_ENCRYPTION_KEY is missing or invalid (" + detail + ")"
              production_message = "SYSTEM_SETTINGS_ENCRYPTION_KEY is required to store secrets in production"
              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  reset_all()
                  set_system_security('{"secretEncryptionEnabled":true,"mfaPolicy":"off"}')
                  request_json(label + " enabled invalid key " + side, base, "PUT", SECRETS_PATH, token,
                               {"upserts": [{"sourceId": "ik", "key": "k", "value": "v"}]}, 400, expected)
                  set_system_security('{"secretEncryptionEnabled":false,"mfaPolicy":"off"}')
                  request_json(label + " disabled invalid key " + side, base, "PUT", SECRETS_PATH, token,
                               {"upserts": [{"sourceId": "ik", "key": "k", "value": "v"}]}, 400, production_message)
              print(label + " ok")


          def corrupt_cache_matrix(tag, token):
              label = tag + " corrupt cache"
              vector_doc = {"enabled": False, "fallbackToMongo": True, "baseUrl": "http://db-vector.example:9000",
                            "token": "db-token", "timeoutMs": 5000, "maxRetries": 2}

              def setup_vector_cache():
                  reset_all()
                  set_setting(VECTOR_KEY, json.dumps(vector_doc), 0, None)
                  redis("SET", "vector_service:settings", "not-json{")

              expected_vector = {"source": "db", "enabled": False, "fallbackToMongo": True,
                                 "baseUrl": "http://db-vector.example:9000", "timeoutMs": 5000, "maxRetries": 2,
                                 "hasToken": True, "tokenSource": "stored"}
              nest_doc, go_doc = parity(label + " vector envelope", "GET", VECTOR_PATH, token, None, 200,
                                        setup_vector_cache)
              for side, doc in (("nest", nest_doc), ("go", go_doc)):
                  require(label + " vector envelope " + side, canon(doc), expected_vector)

              def setup_storage_cache():
                  reset_all()
                  set_setting("storage_s3_region", json.dumps("eu-central-1"), 1, None)
                  redis("SET", "storage:settings", "{not-json")

              expected_storage = dict(STORAGE_DEFAULT_BODY)
              expected_storage["region"] = "eu-central-1"
              nest_doc, go_doc = parity(label + " storage object", "GET", STORAGE_PATH, token, None, 200,
                                        setup_storage_cache)
              for side, doc in (("nest", nest_doc), ("go", go_doc)):
                  require(label + " storage object " + side, canon(doc), expected_storage)
              print(label + " ok")


          def audit_mask_matrix(tag, token):
              label = tag + " audit mask"
              for base, side in ((NEST_URL, "nest"), (GO_URL, "go")):
                  reset_all()
                  request_json(label + " storage " + side, base, "PATCH", STORAGE_PATH, token,
                               {"accessKeyId": "AKIA9999XY", "secretAccessKey": "mask-me"}, 200)
                  metadata = newest_audit("storage_settings_update") or {}
                  raw = newest_audit_raw("storage_settings_update")
                  require(label + " storage fingerprint " + side, metadata.get("accessKeyIdFingerprint"), "AKIA***")
                  require(label + " storage secret mask " + side, metadata.get("secretAccessKey"), "***")
                  if "mask-me" in raw or "AKIA9999XY" in raw:
                      fail(label + " storage " + side + ": audit metadata leaked credential material")

                  reset_all()
                  payload = dict(VECTOR_PUT_BASE)
                  payload["token"] = "audit-token-value"
                  request_json(label + " vector " + side, base, "PUT", VECTOR_PATH, token, payload, 200)
                  if "audit-token-value" in newest_audit_raw("vector_service_update"):
                      fail(label + " vector " + side + ": audit metadata leaked the token")

                  reset_all()
                  request_json(label + " secrets " + side, base, "PUT", SECRETS_PATH, token,
                               {"upserts": [{"sourceId": "aud", "key": "k", "value": "audit-secret"}]}, 200)
                  metadata = newest_audit("news_source_runtime_secrets_update") or {}
                  require(label + " secrets keys " + side, sorted(metadata.keys()), ["entriesAfter", "removes", "upserts"])
                  if "audit-secret" in newest_audit_raw("news_source_runtime_secrets_update"):
                      fail(label + " secrets " + side + ": audit metadata leaked the value")
              print(label + " ok")


          def exercise(tag, platform, admin_a_token, admin_b_token, no_manage_token):
              print("==== " + tag + ": seven routes, NestJS direct vs Go ====")
              vector_group(tag, platform)
              storage_group(tag, platform)
              secrets_group(tag, platform)
              auth_group(tag, platform, admin_a_token, admin_b_token, no_manage_token)
              is3_group(tag, platform)
              is2_group(tag, platform)
              lock_protocol_group(tag, platform)
              print("==== " + tag + " complete ====")


          ALL_ROUTES = [(method, path, payload) for method, path, payload in WRITE_ROUTES] + \
                       [(method, path, None) for method, path in READ_ROUTES]

          # ---- phase 0: identity fixtures and real NestJS logins ----
          seed_identities()
          platform_token = login(platform_email)
          admin_a_token = login(admin_a_email)
          admin_b_token = login(admin_b_email)
          no_manage_token = login(no_manage_email)
          print("phase 0 ok: four real /api/auth/login tokens (platform admin P, org A admin, org B admin, no-manage user)")

          # ---- phase 1: legacy switch, Go proxies every route to NestJS ----
          start_go("legacy")
          exercise("phase 1 (legacy proxy)", platform_token, admin_a_token, admin_b_token, no_manage_token)
          print("phase 1 ok")

          # ---- phase 2: go switch, NestJS still up, Go serves the seven routes ----
          start_go("go")
          exercise("phase 2 (go takeover)", platform_token, admin_a_token, admin_b_token, no_manage_token)
          print("phase 2 ok")

          # ---- phase 3: crypto / cache failure matrix ----
          print("==== phase 3: crypto and cache failure matrix ====")
          crypto_switch_matrix("phase 3", platform_token)
          start_nest(encryption_key=None)
          start_go("go", encryption_key=None)
          no_key_matrix("phase 3", platform_token)
          start_nest(encryption_key=INVALID_KEY)
          start_go("go", encryption_key=INVALID_KEY)
          invalid_key_matrix("phase 3", platform_token)
          start_nest(encryption_key=VALID_KEY)
          start_go("go", encryption_key=VALID_KEY)
          corrupt_cache_matrix("phase 3", platform_token)
          audit_mask_matrix("phase 3", platform_token)
          print("phase 3 ok")

          # ---- phase 4: NestJS stopped, Go keeps serving the seven routes ----
          print("==== phase 4: NestJS stopped ====")
          revoked_token = login(platform_email)
          stop_nest()
          for _ in range(30):
              try:
                  urllib.request.urlopen(NEST_URL + "/api/healthz/live", timeout=2).read()
              except Exception:
                  break
              time.sleep(1)

          for method, path, payload in WRITE_ROUTES:
              request_json("phase 4 go write " + method + " " + path, GO_URL, method, path, platform_token, payload, 200)
          for method, path in READ_ROUTES:
              request_json("phase 4 go read " + method + " " + path, GO_URL, method, path, platform_token, None, 200)
          print("phase 4 ok: seven routes still served by Go with the JWT minted while NestJS was alive")

          for method, path in READ_ROUTES:
              request_json("phase 4 machine read " + path, GO_URL, method, path, allow_token, None, 200)
          for method, path, payload in WRITE_ROUTES:
              status, raw = call(GO_URL, path, method, allow_token, payload)
              if status != 403 or message_of(raw) != PLATFORM_MESSAGE:
                  fail(f"phase 4 machine write {method} {path}: {status} {raw[:300]!r}, want 403 {PLATFORM_MESSAGE!r}")
          print("phase 4 ok: machine token GET 200 / write 403")

          for method, path in (("GET", VECTOR_DIAGNOSTICS_PATH), ("POST", STORAGE_TEST_PATH)):
              status, raw = call(GO_URL, path, method, platform_token, None)
              doc = body(raw) or {}
              if status != 502 or doc.get("statusCode") != 502:
                  fail(f"phase 4 nest-only route {method} {path}: {status} {raw[:300]!r}, want 502")
          print("phase 4 ok: vector diagnostics and storage test stay on NestJS (502)")

          jti = jwt_jti(revoked_token)
          if not jti:
              fail("phase 4 revoked JWT: token has no jti")
          redis("SET", "access-token:blacklist:" + jti, "true", "EX", "600")
          status, raw = call(GO_URL, VECTOR_PATH, "GET", revoked_token)
          if status != 401 or message_of(raw) != "Access token revoked":
              fail(f"phase 4 revoked JWT: {status} {raw[:300]!r}, want 401 Access token revoked")
          print("phase 4 ok: revoked JWT -> 401 Access token revoked")

          # ---- phase 5: rollback to legacy ----
          print("==== phase 5: rollback ====")
          start_go("legacy")
          for method, path, payload in ALL_ROUTES:
              status, raw = call(GO_URL, path, method, platform_token, payload)
              if status != 502:
                  fail(f"phase 5 rollback {method} {path}: {status} {raw[:300]!r}, want 502 with NestJS down")
          print("phase 5 ok: legacy switch registers nothing, so the seven routes are no longer served by Go")

          start_nest(encryption_key=VALID_KEY)
          for method, path, payload in WRITE_ROUTES:
              parity("phase 5 " + method + " " + path, method, path, platform_token, payload, 200, reset_all)
          for method, path in READ_ROUTES:
              parity("phase 5 " + method + " " + path, method, path, platform_token, None, 200, reset_all)
          print("phase 5 ok: seven routes proxy to NestJS again")

          print("ALL INFRASTRUCTURE SETTINGS SMOKE CHECKS PASSED")
          PY
