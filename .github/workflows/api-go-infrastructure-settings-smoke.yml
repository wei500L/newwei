# 基础设施连接与采集运行凭据（向量服务配置 / 存储配置 / 新闻源运行凭据 7 条
# 精确 HTTP）的 Go 真实栈验收。不进普通 CI：PR 上加 label
# api-go-infrastructure-settings-smoke，或 workflow_dispatch 手动触发。
# 覆盖 legacy 代理对照与 go 接管两侧逐条契约比对（状态码 + 完整 JSON 正文 +
# MySQL 行状态）、机器令牌、平台管理员门禁、IS1–IS4 回归（JSON null 清空语义、
# DB 权威合并基准、向量 token 四态、加密策略与缓存降级矩阵、真实并发）、
# 停 NestJS 后的接管与 502 边界，以及回滚到 legacy。
name: api-go-infrastructure-settings-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: api-go-infrastructure-settings-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-infrastructure-settings-smoke@example.com
  SMTP_PASS: api-go-infrastructure-settings-smoke-smtp-not-connected
  JWT_SECRET: c1f4a9e8d2b3706f5a1c8e9d4b2a7f6038e5d1c9a7b6f4e2d3c8a1b5f9e0d7c2
  # 阶段 4/5 必须在 NestJS 停止后继续使用阶段 0 签发的真实 JWT；默认 15m
  # 在完整 smoke（多次容器重启）里会过期，因此 CI 显式放宽有效期。
  JWT_ACCESS_EXPIRES_IN: 6h
  NEXTAUTH_SECRET: e2b5c1f8a9d3b47e60d4a1f8c3b5e79d02c1f4a9e8d2b3706f5a1c8e9d4b2a7f6
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  # 让限流桶足够大，避免验收脚本自身触碰上限（Nest 与 Go 读同一组 env）。
  RATE_LIMIT_LOGIN: "1000"
  RATE_LIMIT_LOGIN_WINDOW: "600"
  RATE_LIMIT_CRAWL_TASK_CREATE: "1000"
  RATE_LIMIT_CRAWL_TASK_CREATE_WINDOW: "600"
  RATE_LIMIT_RBAC_WRITE: "1000"
  RATE_LIMIT_RBAC_WRITE_WINDOW: "600"
  RATE_LIMIT_SETTINGS_CACHE_TTL_SECONDS: "60"
  AUTH_PROFILE_CACHE_TTL_SECONDS: "600"
  AUTH_PROFILE_CACHE_LOCK_TTL_MS: "5000"
  AUTH_PROFILE_CACHE_MAX_WAIT_MS: "5000"
  AUTH_PROFILE_CACHE_RETRY_DELAY_MS: "50"
  AUDIT_LOG_RETENTION_DAYS: "90"
  # 基础设施设置的 env 缺省。api-go 容器在 Python 的 start_go() 里再显式注入
  # 一份同样的值（连同 API_GO_INFRASTRUCTURE_SETTINGS_MODE）。
  #
  # 这里故意【不】定义 VECTOR_SERVICE_BASE_URL 与 S3_ENDPOINT：@nestjs/config 的
  # ConfigService.get() 在 validate 结果缺少该键时仍会回落到 process.env，因此
  # “已设置但为空串”会让 NestJS 的 vector GET 返回 "baseUrl": ""、storage GET
  # 返回 "endpoint": ""，而 Go 把空的环境缺省视为“未配置”（baseUrl: null /
  # 省略 endpoint）。未定义时两侧一致，也正是 IS4 回归要求的“endpoint 依 env
  # 决定有值或省略”。Go 容器仍按契约显式拿到 VECTOR_SERVICE_BASE_URL= 与
  # S3_ENDPOINT=。
  # NODE_ENV=production 也只在启动 NestJS 的步骤与 api-go 容器里注入：工作流级
  # NODE_ENV=production 会让 pnpm install 跳过 devDependencies，构建随即失败。
  SYSTEM_SETTINGS_ENCRYPTION_KEY: 3f8c1d5a9b2e7046c1a8f3d6e9b0c4a75d2f8e1b6c3a9d0e4f7b2c5a8d1e6f30
  VECTOR_SERVICE_FALLBACK_TO_MONGO: "true"
  VECTOR_INTERNAL_TOKEN: ""
  VECTOR_SERVICE_TIMEOUT_MS: "5000"
  VECTOR_SERVICE_MAX_RETRIES: "2"
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  S3_REGION: us-east-1
  S3_BUCKET: ""
  S3_PUBLIC_BASE_URL: ""
  S3_FORCE_PATH_STYLE: "false"
  S3_PRESIGNED_URL_TTL_SECONDS: "300"
  API_GO_INFRASTRUCTURE_SETTINGS_MODE: legacy
  SEED_ORG_SLUG: api-go-infrastructure-settings-smoke-org
  SEED_ORG_NAME: api-go Infrastructure Settings Smoke Org
  SEED_ADMIN_EMAIL: api-go-infrastructure-settings-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: "ApiGoInfraSettings#2026-Ci"
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-infrastructure-settings-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-infrastructure-settings-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-infrastructure-settings:ci .
      - name: Exercise infrastructure settings routes
        run: |
          set -euo pipefail
          python3 -u - << 'PY'
          import base64
          import hashlib
          import json
          import os
          import signal
          import subprocess
          import threading
          import time
          import traceback
          import urllib.error
          import urllib.request


          def _on_sigterm(signum, frame):
              """Prints where the step was when the runner asked it to stop."""
              print("SIGTERM received at:", flush=True)
              traceback.print_stack(frame)
              os._exit(143)


          signal.signal(signal.SIGTERM, _on_sigterm)

          NEST_URL = "http://127.0.0.1:4000"
          GO_URL = "http://127.0.0.1:4020"
          GO_CONTAINER = "api-go-infrastructure-settings-smoke"
          GO_IMAGE = "api-go-infrastructure-settings:ci"

          VALID_KEY = os.environ["SYSTEM_SETTINGS_ENCRYPTION_KEY"].strip()
          INVALID_KEY = "not-a-valid-key"
          PLATFORM_MESSAGE = "Platform admin access required"
          PERMISSION_CODE = "INSUFFICIENT_PERMISSIONS"
          PERMISSION_MESSAGE = "Insufficient permissions"
          PERMISSION_DETAIL = "Requires any permission: settings.manage"

          VECTOR_PATH = "/api/system-settings/vector-service"
          STORAGE_PATH = "/api/admin/settings/storage"
          SECRETS_PATH = "/api/system-settings/news-source-runtime-secrets"
          VECTOR_DIAGNOSTICS_PATH = VECTOR_PATH + "/diagnostics"
          STORAGE_TEST_PATH = STORAGE_PATH + "/test"
          VECTOR_KEY = "vector_service"
          SECRETS_KEY = "news_source_runtime_secrets"
          SECURITY_KEY = "system_security"

          SETTING_KEYS = [
              VECTOR_KEY,
              "crawl_image_storage",
              "storage_s3_access_key_id",
              "storage_s3_secret_access_key",
              "storage_s3_region",
              "storage_s3_bucket",
              "storage_s3_endpoint",
              "storage_s3_public_base_url",
              "storage_s3_force_path_style",
              "storage_s3_presigned_url_ttl_seconds",
              SECRETS_KEY,
              SECURITY_KEY,
          ]
          CACHE_KEYS = ["vector_service:settings", "storage:settings", "system_security:settings"]
          CLEARED_STORAGE_KEYS = [
              "storage_s3_endpoint",
              "storage_s3_force_path_style",
              "storage_s3_presigned_url_ttl_seconds",
          ]

          org_a = "is-smoke-org-a"
          org_b = "is-smoke-org-b"
          role_a = "is-smoke-role-a"
          role_b = "is-smoke-role-b"
          role_no = "is-smoke-role-no"
          platform_user = "is-smoke-platform-user"
          admin_a = "is-smoke-admin-a"
          admin_b = "is-smoke-admin-b"
          no_manage_user = "is-smoke-no-manage-user"
          platform_email = "is-smoke-platform@example.com"
          admin_a_email = "is-smoke-admin-a@example.com"
          admin_b_email = "is-smoke-admin-b@example.com"
          no_manage_email = "is-smoke-no-manage@example.com"
          allow_token = "mtk_is_smoke_allow_000000000001"
          deny_token = "mtk_is_smoke_deny_0000000000001"


          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)


          def require(label, got, want):
              if got != want:
                  fail(f"{label}: got {got!r}, want {want!r}")


          if len(VALID_KEY) != 64 or any(ch not in "0123456789abcdefABCDEF" for ch in VALID_KEY):
              fail("SYSTEM_SETTINGS_ENCRYPTION_KEY must be a 64 hex character key for this smoke")


          def container_id(ancestor):
              found = subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=" + ancestor], text=True).split()
              if not found:
                  fail("no running container for " + ancestor)
              return found[0]


          def sql(statement):
              cid = container_id("mysql:8.4")
              proc = subprocess.run(["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "-B", "app"],
                                    input=statement, text=True, capture_output=True)
              if proc.returncode != 0:
                  fail("mysql: " + (proc.stderr or proc.stdout))
              return proc.stdout.strip()


          def sql_rows(statement):
              return [line.split("\t") for line in sql(statement).splitlines() if line != ""]


          def scalar(statement):
              rows = sql_rows(statement)
              return rows[-1][0] if rows else ""


          def redis(*args):
              cid = container_id("redis:7.2")
              proc = subprocess.run(["docker", "exec", "-i", cid, "redis-cli", "--raw", *args],
                                    text=True, capture_output=True)
              if proc.returncode != 0:
                  fail("redis: " + (proc.stderr or proc.stdout))
              return proc.stdout.strip()


          def sql_escape(text):
              return text.replace("\\", "\\\\").replace("'", "''")


          def call(base, path, method="GET", token=None, payload=None, timeout=60):
              headers = {}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()


          def body(raw):
              if not raw:
                  return None
              text = raw.decode("utf-8", "replace").strip()
              if not text:
                  return None
              try:
                  return json.loads(text)
              except ValueError:
                  return None


          def parse_json_text(text):
              if text is None or text == "":
                  return None
              try:
                  return json.loads(text)
              except ValueError:
                  return text


          def message_of(raw):
              doc = body(raw) or {}
              text = doc.get("message")
              if isinstance(text, list):
                  return "; ".join(str(item) for item in text)
              return text


          def canon(value):
              if isinstance(value, dict):
                  if value.get("__enc") == "system-settings:v1":
                      return "<encrypted>"
                  out = {}
                  for key, item in value.items():
                      if key in ("traceId", "timestamp", "updatedAt"):
                          out[key] = "<ts>"
                      else:
                          out[key] = canon(item)
                  return out
              if isinstance(value, list):
                  return [canon(item) for item in value]
              return value


          def keys_sql():
              return ", ".join("'" + key + "'" for key in SETTING_KEYS)


          def setting_state():
              rows = sql_rows(
                  "SELECT `key`, CAST(`value` AS CHAR), JSON_TYPE(`value`), (`value` IS NULL), "
                  "isPublic, IFNULL(description, '<null>'), IFNULL(updatedById, '<null>') "
                  "FROM SystemSetting WHERE `key` IN (" + keys_sql() + ") ORDER BY `key`")
              return [(row[0], canon(parse_json_text(row[1])), row[2], row[3], row[4], row[5], row[6])
                      for row in rows]


          def state_for(key):
              found = [row for row in setting_state() if row[0] == key]
              return found[0] if found else None


          def reset_all():
              sql("DELETE FROM SystemSetting WHERE `key` IN (" + keys_sql() + ")")
              redis("DEL", *CACHE_KEYS)


          def set_setting(key, value_text, is_public=0, description=None):
              desc = "NULL" if description is None else "'" + sql_escape(description) + "'"
              sql("REPLACE INTO SystemSetting (`key`, value, isPublic, description, createdAt, updatedAt, updatedById) "
                  "VALUES ('" + key + "', _utf8mb4'" + sql_escape(value_text) + "', " + str(is_public) + ", " + desc +
                  ", NOW(3), NOW(3), NULL)")


          def set_system_security(doc_text):
              redis("DEL", "system_security:settings")
              if doc_text is None:
                  sql("DELETE FROM SystemSetting WHERE `key` = '" + SECURITY_KEY + "'")
              else:
                  set_setting(SECURITY_KEY, doc_text, 0, None)


          def cache_snapshot():
              return tuple(redis("GET", key) for key in CACHE_KEYS)


          def audit_count(action):
              return int(scalar("SELECT COUNT(*) FROM AuditLog WHERE action='" + action + "'"))


          def audit_total():
              return int(scalar("SELECT COUNT(*) FROM AuditLog"))


          def newest_audit(action):
              rows = sql_rows("SELECT CAST(metadata AS CHAR) FROM AuditLog WHERE action='" + action + "' "
                              "ORDER BY createdAt DESC, id DESC LIMIT 1")
              return parse_json_text(rows[-1][0]) if rows else None


          def newest_audit_raw(action):
              rows = sql_rows("SELECT CAST(metadata AS CHAR) FROM AuditLog WHERE action='" + action + "' "
                              "ORDER BY createdAt DESC, id DESC LIMIT 1")
              return rows[-1][0] if rows else ""


          def parity(label, method, path, token, payload=None, expected=200, setup=None, expected_message=None):
              if setup is not None:
                  setup()
              nest_status, nest_raw = call(NEST_URL, path, method, token, payload)
              nest_state = setting_state()
              if setup is not None:
                  setup()
              go_status, go_raw = call(GO_URL, path, method, token, payload)
              go_state = setting_state()
              if nest_status != expected or go_status != expected:
                  fail(f"parity {label}: status nest={nest_status} go={go_status}, want {expected}; "
                       f"nest={nest_raw[:300]!r} go={go_raw[:300]!r}")
              if canon(body(nest_raw)) != canon(body(go_raw)):
                  fail(f"parity {label}: body mismatch nest={nest_raw[:800]!r} go={go_raw[:800]!r}")
              if nest_state != go_state:
                  fail(f"parity {label}: DB state mismatch nest={nest_state} go={go_state}")
              if expected_message is not None:
                  for side, raw in (("nest", nest_raw), ("go", go_raw)):
                      got = message_of(raw)
                      if got != expected_message:
                          fail(f"parity {label}: {side} message {got!r} want {expected_message!r} raw={raw[:400]!r}")
              print("parity ok:", label)
              return body(nest_raw), body(go_raw)


          def request_json(label, base, method, path, token, payload=None, expected=200, expected_message=None):
              status, raw = call(base, path, method, token, payload)
              if status != expected:
                  fail(f"{label}: {method} {path} -> {status} {raw[:400]!r}, want {expected}")
              if expected_message is not None and message_of(raw) != expected_message:
                  fail(f"{label}: message {message_of(raw)!r} want {expected_message!r} raw={raw[:400]!r}")
              return body(raw)


          def parity_write(label, method, path, token, payload, expected=200, setup=None, expected_message=None):
              return parity(label, method, path, token, payload, expected, setup, expected_message)


          def login(email):
              status, raw = call(NEST_URL, "/api/auth/login", "POST", None,
                                 {"email": email, "password": os.environ["SEED_ADMIN_PASSWORD"]})
              doc = body(raw) or {}
              if status not in (200, 201) or not doc.get("accessToken"):
                  fail(f"login {email} -> {status} {raw[:300]!r}")
              return doc["accessToken"]


          def jwt_jti(token):
              payload = token.split(".")[1]
              payload += "=" * (-len(payload) % 4)
              claims = json.loads(base64.urlsafe_b64decode(payload))
              return claims.get("jti")


          def docker_logs():
              proc = subprocess.run(["docker", "logs", GO_CONTAINER], text=True, capture_output=True)
              return (proc.stdout + proc.stderr)[-4000:]


          def log_tail(path, lines=60):
              try:
                  with open(path, "r", errors="replace") as handle:
                      return "".join(handle.readlines()[-lines:])
              except OSError:
                  return ""


          def stop_nest():
              # SIGTERM the recorded pid only. killpg must NOT be used here: the initial
              # NestJS background process is started by the workflow step shell, whose
              # process group is the Actions worker's own group - killing that group would
              # SIGTERM this very step (observed as "The operation was canceled.").
              pid_path = "/tmp/api-nestjs.pid"
              if os.path.exists(pid_path):
                  raw = open(pid_path).read().strip()
                  if raw.isdigit():
                      try:
                          os.kill(int(raw), signal.SIGTERM)
                      except Exception:
                          pass
              subprocess.run(["pkill", "-f", "apps/api/dist/main.js"], check=False, capture_output=True)
              subprocess.run(["pkill", "-f", "node dist/main.js"], check=False, capture_output=True)


          def start_nest(encryption_key=VALID_KEY):
              stop_nest()
              for _ in range(30):
                  try:
                      urllib.request.urlopen(NEST_URL + "/api/healthz/live", timeout=2).read()
                  except Exception:
                      break
                  time.sleep(1)
              env = dict(os.environ)
              env["NODE_ENV"] = "production"
              env["PORT"] = "4000"
              if encryption_key is None:
                  env.pop("SYSTEM_SETTINGS_ENCRYPTION_KEY", None)
              else:
                  env["SYSTEM_SETTINGS_ENCRYPTION_KEY"] = encryption_key
              log = open("/tmp/api-nestjs.log", "w")
              proc = subprocess.Popen(["pnpm", "--filter", "@modular/api", "run", "start"],
                                      env=env, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
              with open("/tmp/api-nestjs.pid", "w") as handle:
                  handle.write(str(proc.pid))
              for _ in range(90):
                  try:
                      status, _ = call(NEST_URL, "/api/healthz/live", timeout=3)
                      if status == 200:
                          print("nestjs up (encryptionKey=%s)" % ("valid" if encryption_key == VALID_KEY
                                                                  else ("absent" if encryption_key is None else "invalid")))
                          return
                  except Exception:
                      pass
                  time.sleep(2)
              fail("nestjs did not become healthy after restart:\n" + log_tail("/tmp/api-nestjs.log"))


          def start_go(mode, encryption_key=VALID_KEY):
              subprocess.run(["docker", "rm", "-f", GO_CONTAINER], check=False, capture_output=True)
              env = [
                  "PORT=4020",
                  "LEGACY_API_URL=http://host.docker.internal:4000",
                  "DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app",
                  "MONGO_URI=mongodb://host.docker.internal:27017/app",
                  f"API_GO_INFRASTRUCTURE_SETTINGS_MODE={mode}",
                  "API_GO_RUNTIME_SETTINGS_MODE=legacy",
                  "API_GO_RBAC_MODE=legacy",
                  "API_GO_CRAWL_PROFILES_MODE=legacy",
                  "API_GO_CRAWL_TEMPLATES_MODE=legacy",
                  "API_GO_CRAWL_WORKFLOWS_MODE=legacy",
                  "API_GO_NEWS_SOURCES_MODE=legacy",
                  "API_GO_SITUATION_MONITORS_MODE=legacy",
                  "API_GO_CONTENT_SUBSCRIPTIONS_MODE=legacy",
                  "API_GO_USER_NEWS_BEHAVIOR_MODE=legacy",
                  "API_GO_USER_DIGEST_MODE=legacy",
                  "API_GO_DASHBOARD_STATS_MODE=legacy",
                  "API_GO_DASHBOARD_CHARTS_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_GEO_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE=legacy",
                  "API_GO_DASHBOARD_STREAM_MODE=legacy",
                  "API_GO_HEALTHZ_MODE=legacy",
                  "API_GO_PUBLIC_PORTAL_MODE=legacy",
                  "API_GO_ANALYSIS_VIEWS_MODE=legacy",
                  "API_GO_ANALYSIS_BOARDS_MODE=legacy",
                  "API_GO_ANALYSIS_THREADS_MODE=legacy",
                  "API_GO_GRAPHQL_READ_MODE=legacy",
                  "API_GO_GRAPHQL_NEWS_EVENTS_MODE=legacy",
