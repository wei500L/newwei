          # ---------- assertions ----------
          def assert_pending_state(label, expected_groups):
              overview = get_ok(label + " overview", OVERVIEW, token_a)
              require(label + " overview pendingCount",
                      isinstance(overview, dict) and overview.get("pendingCount") == len(expected_groups),
                      repr(overview))
              rows = get_ok(label + " failures?status=pending", FAILURES + "?status=pending&limit=50", token_a)
              require(label + " failures list is an array", isinstance(rows, list), repr(rows))
              require(label + " pending group ids",
                      {row.get("groupId") for row in rows} == set(expected_groups) and
                      all(row.get("status") == "pending" for row in rows),
                      repr(rows)[:800])
              return overview, rows


          def run_race(label, base, group, token):
              path = backfill_path(group["groupId"])
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                  futures = [pool.submit(call, base, path, "POST", token) for _ in range(2)]
                  outcomes = [future.result() for future in futures]
              statuses = sorted(status for status, _ in outcomes)
              require(label + " concurrent statuses", statuses == [201, 400],
                      "statuses=" + repr(statuses) + " bodies=" + repr([raw[:400] for _, raw in outcomes]))
              wins = [(status, raw) for status, raw in outcomes if status == 201]
              losses = [(status, raw) for status, raw in outcomes if status == 400]
              win = body(wins[0][1]) or {}
              require(label + " single winner", len(wins) == 1 and len(losses) == 1, repr(statuses))
              require(label + " winner groupId", win.get("groupId") == group["groupId"], repr(win))
              require(label + " winner assignedCount", win.get("assignedCount") == 1, repr(win))
              require(label + " winner skippedCount", win.get("skippedCount") == 0, repr(win))
              require(label + " winner resolvedEventIds",
                      isinstance(win.get("resolvedEventIds"), list) and len(win["resolvedEventIds"]) == 1,
                      repr(win))
              require(label + " winner resolvedAt",
                      isinstance(win.get("resolvedAt"), str) and win["resolvedAt"].endswith("Z"), repr(win))
              loser_message = message(losses[0][1])
              require(label + " loser 400 message", loser_message in (PENDING_MSG, UNRECOVERABLE_MSG),
                      repr(loser_message) + " body=" + repr(losses[0][1][:400]))

              item_rows = mysql_int("SELECT COUNT(*) FROM NewsEventItem WHERE orgId='%s' AND processedArticleId='%s'" %
                                    (ORG_A, group["processedArticleId"]))
              require(label + " item assigned exactly once", item_rows == 1, "rows=" + str(item_rows))
              event_rows = mysql_int("SELECT COUNT(*) FROM NewsEvent WHERE orgId='%s' AND primaryTopic='%s'" %
                                     (ORG_A, group["topic"]))
              require(label + " exactly one event created", event_rows == 1, "rows=" + str(event_rows))
              doc = mongo_failure_doc(group["groupId"]) or {}
              require(label + " group resolved", doc.get("status") == "resolved", repr(doc))
              require(label + " attemptCount advanced once", doc.get("attemptCount") == 1, repr(doc))
              return win


          def run_ignore_then_backfill(label, base, group, token):
              ignored = post_ok(label + " ignore", ignore_path(group["groupId"]), token, base=base)
              require(label + " ignore status", isinstance(ignored, dict) and ignored.get("status") == "ignored",
                      repr(ignored))
              require(label + " ignore resolutionMode",
                      isinstance(ignored, dict) and ignored.get("resolutionMode") == "ignored", repr(ignored))
              status, raw = call(base, backfill_path(group["groupId"]), "POST", token)
              require(label + " backfill after ignore",
                      status == 400 and message(raw) == UNRECOVERABLE_MSG,
                      "status=" + str(status) + " message=" + repr(message(raw)))


          # ---------- phases ----------
          def run():
              global token_a, token_b, token_items_a, token_settings_a
              seed_static_data()
              token_a = login(EMAIL_FULL_A)
              token_b = login(EMAIL_FULL_B)
              token_items_a = login(EMAIL_ITEMS_A)
              token_settings_a = login(EMAIL_SETTINGS_A)
              record("four human JWTs obtained before NestJS is stopped", True)

              legacy_backfill = create_failure_group("legacy-backfill", 3000)
              legacy_ignore = create_failure_group("legacy-ignore", 2000)

              # ---- 阶段 1：legacy 开关，9 条路由经网关与 Nest 直连一致 ----
              start_go("legacy")
              negative_routes = [
                  ("GET", NEWSNOW + "/source?id=%21%21%21", None),
                  ("POST", NEWSNOW + "/sources/batch", {}),
                  ("GET", NEWSNOW + "/hottest-analysis", None),
                  ("GET", NEWSNOW + "/recommended", None),
                  ("POST", llm_backfill_path(ZERO_GROUP), None),
                  ("GET", NEWSNOW + "/sources", None),
                  ("POST", META, None),
              ]
              legacy_negative = {}
              for method, path, payload in negative_routes:
                  status, raw = call(GO, path, method, None, payload)
                  legacy_negative[(method, path)] = (status, raw)

              metadata = compare_direct("legacy parity: GET /api/news-aggregator/metadata", META, token_a)
              column_sources = metadata["columns"]["china"]["sources"][:3]
              require("china column has sources for sources/order", len(column_sources) > 0, repr(metadata)[:400])
              order_body = {"column": "china", "sources": column_sources}

              compare_resolve("legacy parity: GET /api/news-aggregator/resolve", URL_A, token_a)
              compare_direct("legacy parity: POST /api/news-aggregator/sources/order", ORDER, token_a,
                             ignore=("computedAt",), method="POST", payload=order_body)
              compare_direct("legacy parity: GET /api/news-aggregator/domestic-opinion-index?hours=24",
                             OPINION + "?hours=24", token_a, ignore=("generatedAt",))
              compare_direct("legacy parity: GET .../clustering/readiness", READINESS, token_a)
              compare_direct("legacy parity: GET .../clustering/overview", OVERVIEW, token_a)
              compare_direct("legacy parity: GET .../clustering/failures",
                             FAILURES + "?status=pending&limit=50", token_a)

              nest_backfill = post_ok("legacy parity: vector-backfill (NestJS)",
                                      backfill_path(legacy_backfill["groupId"]), token_a, base=NEST)
              reset_group(legacy_backfill, nest_backfill.get("resolvedEventIds") or [])
              proxy_backfill = post_ok("legacy parity: vector-backfill (gateway)",
                                       backfill_path(legacy_backfill["groupId"]), token_a)
              require("legacy parity: vector-backfill body",
                      normalized(nest_backfill, ("resolvedAt",), ("resolvedEventIds",)) ==
                      normalized(proxy_backfill, ("resolvedAt",), ("resolvedEventIds",)),
                      "nest=" + repr(nest_backfill) + " gateway=" + repr(proxy_backfill))

              nest_ignore = post_ok("legacy parity: ignore (NestJS)",
                                    ignore_path(legacy_ignore["groupId"]), token_a, base=NEST)
              reset_group(legacy_ignore, [])
              proxy_ignore = post_ok("legacy parity: ignore (gateway)",
                                     ignore_path(legacy_ignore["groupId"]), token_a)
              require("legacy parity: ignore body",
                      normalized(nest_ignore, ("resolvedAt", "updatedAt")) ==
                      normalized(proxy_ignore, ("resolvedAt", "updatedAt")),
                      "nest=" + repr(nest_ignore) + " gateway=" + repr(proxy_ignore))

              # ---- 阶段 2：go 开关，Nest 仍在运行 ----
              start_go("go")

              compare_direct("go parity: GET /api/news-aggregator/metadata", META, token_a)

              flush_newsnow_caches()
              gst, graw = call(GO, resolve_path(URL_A), "GET", token_a)
              flush_newsnow_caches()
              nst, nraw = call(NEST, resolve_path(URL_A), "GET", token_a)
              require("go parity: GET /api/news-aggregator/resolve status", st_pair_ok(nst, gst),
                      "nest=" + str(nst) + " go=" + str(gst) + " go_body=" + repr(graw[:400]))
              require("go parity: GET /api/news-aggregator/resolve body", body(nraw) == body(graw),
                      "nest=" + repr(nraw[:800]) + " go=" + repr(graw[:800]))

              flush_newsnow_caches()
              gst, graw = call(GO, ORDER, "POST", token_a, order_body)
              flush_newsnow_caches()
              nst, nraw = call(NEST, ORDER, "POST", token_a, order_body)
              require("go parity: POST /api/news-aggregator/sources/order status", nst == 201 and gst == 201,
                      "nest=" + str(nst) + " go=" + str(gst) + " body=" + repr(graw[:400]))
              require("go parity: POST /api/news-aggregator/sources/order body",
                      normalized(body(nraw), ("computedAt",)) == normalized(body(graw), ("computedAt",)),
                      "nest=" + repr(nraw[:800]) + " go=" + repr(graw[:800]))

              compare_direct("go parity: GET /api/news-aggregator/domestic-opinion-index?hours=24",
                             OPINION + "?hours=24", token_a, ignore=("generatedAt",))

              # ---- 阶段 3：缺陷 2（URL 反查的租户绑定）----
              missing = compare_resolve("defect 2: missing ItemMeta returns matched=false", URL_MISSING, None)
              require("defect 2: missing ItemMeta body", missing == {"matched": False}, repr(missing))

              resolved_a = compare_resolve("defect 2: org A item resolves to org A event", URL_A, None)
              require("defect 2: org A itemId", resolved_a.get("itemId") == ITEM_A, repr(resolved_a))
              require("defect 2: org A eventId", resolved_a.get("eventId") == EVENT_A, repr(resolved_a))
              require("defect 2: org A confidence", resolved_a.get("confidence") == 1, repr(resolved_a))
              require("defect 2: poisoned org B item never leaks", resolved_a.get("eventId") != EVENT_B,
                      repr(resolved_a))

              # 同一 URL 上，org B 自己的最新 rawitems 行只能解析出 org B 的条目与事件。
              raw_full_b, raw_base_b, raw_hash_b = comparable_variants(URL_A)
              mongo_seed("db.rawitems.insertOne(" + js_literal({
                  "itemMetaId": ITEM_B,
                  "payload": {"url": URL_A, "language": "en"},
                  "source": "smoke",
                  "urlComparableFull": raw_full_b,
                  "urlComparableFullHash": raw_hash_b,
                  "urlComparableBase": raw_base_b,
                  "createdAt": ("date", int(time.time() * 1000) - 5000),
                  "updatedAt": ("date", int(time.time() * 1000) - 5000),
              }) + ");")
              resolved_b = compare_resolve("defect 2: org B resolves only org B event", URL_A, None)
              require("defect 2: org B itemId", resolved_b.get("itemId") == ITEM_B, repr(resolved_b))
              require("defect 2: org B eventId", resolved_b.get("eventId") == EVENT_B, repr(resolved_b))
              require("defect 2: org B never obtains org A eventId", resolved_b.get("eventId") != EVENT_A,
                      repr(resolved_b))

              # ---- 阶段 4：缺陷 3（vector-backfill 原子抢占）----
              nest_race = create_failure_group("nest-race", 1500)
              nest_ignore_group = create_failure_group("nest-ignore", 1000)
              expected_pending = [nest_race["groupId"], nest_ignore_group["groupId"]]
              assert_pending_state("defect 3 (nest)", expected_pending)
              compare_direct("defect 3 (nest): overview parity", OVERVIEW, token_a)
              compare_direct("defect 3 (nest): pending failures parity",
                             FAILURES + "?status=pending&limit=50", token_a)
              run_race("defect 3 (nest)", NEST, nest_race, token_a)
              run_ignore_then_backfill("defect 3 (nest)", NEST, nest_ignore_group, token_a)

              go_race = create_failure_group("go-race", 1500)
              go_ignore_group = create_failure_group("go-ignore", 1000)
              expected_pending = [go_race["groupId"], go_ignore_group["groupId"]]
              assert_pending_state("defect 3 (go)", expected_pending)
              compare_direct("defect 3 (go): overview parity", OVERVIEW, token_a)
              compare_direct("defect 3 (go): pending failures parity",
                             FAILURES + "?status=pending&limit=50", token_a)
              run_race("defect 3 (go)", GO, go_race, token_a)
              run_ignore_then_backfill("defect 3 (go)", GO, go_ignore_group, token_a)

              # ---- 阶段 5：租户隔离与权限 ----
              beta_overview = get_ok("tenant: org B overview", OVERVIEW, token_b)
              require("tenant: org B owns no groups",
                      isinstance(beta_overview, dict) and
                      beta_overview.get("pendingCount") == 0 and
                      beta_overview.get("processingCount") == 0 and
                      beta_overview.get("resolvedCount") == 0 and
                      beta_overview.get("ignoredCount") == 0 and
                      beta_overview.get("latestFailureAt") is None,
                      repr(beta_overview))
              beta_rows = get_ok("tenant: org B failures", FAILURES + "?limit=50", token_b)
              require("tenant: org B sees only its own groups",
                      beta_rows == [] and all(row.get("groupId") not in expected_pending + [nest_race["groupId"]]
                                              for row in beta_rows),
                      repr(beta_rows))

              status, raw = call(GO, backfill_path(go_race["groupId"]), "POST", token_b)
              require("tenant: org B vector-backfill on org A group",
                      status == 404 and message(raw) == NOT_FOUND_MSG,
                      "status=" + str(status) + " message=" + repr(message(raw)))
              status, raw = call(GO, ignore_path(go_ignore_group["groupId"]), "POST", token_b)
              require("tenant: org B ignore on org A group",
                      status == 404 and message(raw) == NOT_FOUND_MSG,
                      "status=" + str(status) + " message=" + repr(message(raw)))

              for path in (READINESS, OVERVIEW, FAILURES):
                  status, raw = call(GO, path, "GET", token_items_a)
                  require("permission: missing settings.manage 403 " + path, status == 403,
                          "status=" + str(status) + " body=" + repr(raw[:300]))
              for path in (ignore_path(go_ignore_group["groupId"]), backfill_path(go_race["groupId"])):
                  status, raw = call(GO, path, "POST", token_items_a)
                  require("permission: missing settings.manage 403 POST " + path, status == 403,
                          "status=" + str(status) + " body=" + repr(raw[:300]))

              for path in (OPINION, ORDER):
                  status, raw = call(GO, path, "GET" if path == OPINION else "POST",
                                     token_settings_a, None if path == OPINION else order_body)
                  require("permission: missing items.read 403 " + path, status == 403,
                          "status=" + str(status) + " body=" + repr(raw[:300]))

              get_ok("permission: machine token with settings.manage", OVERVIEW, MACHINE_TOKEN)
              get_ok("permission: machine token failures", FAILURES, MACHINE_TOKEN)

              for path in (OVERVIEW, FAILURES):
                  status, raw = call(GO, path, "GET", None)
                  require("permission: unauthenticated 401 " + path, status == 401,
                          "status=" + str(status) + " body=" + repr(raw[:300]))
              status, raw = call(GO, backfill_path(ZERO_GROUP), "POST", None)
              require("permission: unauthenticated 401 vector-backfill", status == 401,
                      "status=" + str(status) + " body=" + repr(raw[:300]))
              get_ok("permission: public metadata without token", META, None)
              status, raw = call(GO, resolve_path(URL_A), "GET", None)
              require("permission: public resolve without token", status == 200,
                      "status=" + str(status) + " body=" + repr(raw[:300]))

              # ---- 阶段 6：未迁移路由仍回 NestJS（legacy 与 go 响应一致）----
              # NestJS error envelopes embed a per-request traceId and
              # timestamp, so the proxied response can only be compared after
              # dropping those two volatile keys.
              volatile = {"traceId", "timestamp"}
              for method, path, payload in negative_routes:
                  legacy_status, legacy_raw = legacy_negative[(method, path)]
                  status, raw = call(GO, path, method, None, payload)
                  require("route table: proxied " + method + " " + path,
                          status == legacy_status and
                          strip_keys(body(raw), volatile) == strip_keys(body(legacy_raw), volatile),
                          "legacy=" + str(legacy_status) + " go=" + str(status) +
                          " legacy_body=" + repr(legacy_raw[:400]) + " go_body=" + repr(raw[:400]))
              for method, path, payload in negative_routes[:5]:
                  status, _ = call(GO, path, method, None, payload)
                  require("route table: not answered by Go " + method + " " + path,
                          status not in (404, 501), "status=" + str(status))

              # ---- 阶段 7：Nest 停止后 9 条仍 200/201，未迁移路由 502 ----
              off_backfill = create_failure_group("off-backfill", 800)
              off_ignore = create_failure_group("off-ignore", 600)
              stop_nest()
              # 所有 JWT 都在 Nest 停止前取得；此处开始网关不得再依赖 NestJS。
              require("nest stop: still reachable through go gateway",
                      call(GO, META, "GET", token_a)[0] == 200, "metadata after stop")

              get_ok("nest-off: GET metadata", META, token_a)
              status, raw = call(GO, resolve_path(URL_A), "GET", token_a)
              require("nest-off: GET resolve", status == 200,
                      "status=" + str(status) + " body=" + repr(raw[:300]))
              post_ok("nest-off: POST sources/order", ORDER, token_a, order_body)
              get_ok("nest-off: GET domestic-opinion-index", OPINION + "?hours=24", token_a)
              get_ok("nest-off: GET clustering/readiness", READINESS, token_a)
              off_overview = get_ok("nest-off: GET clustering/overview", OVERVIEW, token_a)
              require("nest-off: overview pendingCount",
                      off_overview.get("pendingCount") == 2, repr(off_overview))
              off_rows = get_ok("nest-off: GET clustering/failures", FAILURES + "?status=pending&limit=50", token_a)
              require("nest-off: pending failures list",
                      isinstance(off_rows, list) and
                      {row.get("groupId") for row in off_rows} == {off_backfill["groupId"], off_ignore["groupId"]},
                      repr(off_rows)[:600])
              off_win = post_ok("nest-off: POST vector-backfill",
                                backfill_path(off_backfill["groupId"]), token_a)
              require("nest-off: vector-backfill semantics",
                      off_win.get("groupId") == off_backfill["groupId"] and
                      off_win.get("assignedCount") == 1 and off_win.get("skippedCount") == 0 and
                      len(off_win.get("resolvedEventIds") or []) == 1,
                      repr(off_win))
              off_ignore_body = post_ok("nest-off: POST ignore", ignore_path(off_ignore["groupId"]), token_a)
              require("nest-off: ignore status", off_ignore_body.get("status") == "ignored",
                      repr(off_ignore_body))

              for label, method, path in (
                  ("nest-off: GET hottest-analysis stays on NestJS", "GET", NEWSNOW + "/hottest-analysis"),
                  ("nest-off: POST llm-backfill stays on NestJS", "POST", llm_backfill_path(ZERO_GROUP)),
              ):
                  status, raw = call(GO, path, method, token_a)
                  payload = body(raw) or {}
                  require(label, status == 502 and isinstance(payload, dict) and payload.get("statusCode") == 502,
                          "status=" + str(status) + " body=" + repr(raw[:400]))


          def cleanup():
              print("cleanup: removing smoke rows")
              statements = [
                  "DELETE FROM NewsEventItem WHERE orgId IN ('%s', '%s')" % (ORG_A, ORG_B),
                  "DELETE FROM NewsEvent WHERE orgId IN ('%s', '%s')" % (ORG_A, ORG_B),
                  "DELETE FROM ProcessedArticle WHERE orgId IN ('%s', '%s')" % (ORG_A, ORG_B),
                  "DELETE FROM Article WHERE orgId IN ('%s', '%s')" % (ORG_A, ORG_B),
                  "DELETE FROM NewsnowDomesticOpinionIndexSnapshot WHERE orgId IN ('%s', '%s')" % (ORG_A, ORG_B),
                  "DELETE FROM MachineAccessToken WHERE orgId IN ('%s', '%s')" % (ORG_A, ORG_B),
                  "DELETE FROM RolePermission WHERE roleId IN ('%s', '%s', '%s', '%s')" %
                  (ROLE_FULL_A, ROLE_FULL_B, ROLE_ITEMS_A, ROLE_SETTINGS_A),
                  "DELETE FROM Membership WHERE orgId IN ('%s', '%s')" % (ORG_A, ORG_B),
                  "DELETE FROM Role WHERE orgId IN ('%s', '%s')" % (ORG_A, ORG_B),
                  "DELETE FROM RefreshToken WHERE userId IN ('%s', '%s', '%s', '%s')" %
                  (USER_FULL_A, USER_FULL_B, USER_ITEMS_A, USER_SETTINGS_A),
                  "DELETE FROM AuditLog WHERE orgId IN ('%s', '%s')" % (ORG_A, ORG_B),
                  "DELETE FROM AuditLogOutbox WHERE orgId IN ('%s', '%s')" % (ORG_A, ORG_B),
                  "DELETE FROM User WHERE id IN ('%s', '%s', '%s', '%s')" %
                  (USER_FULL_A, USER_FULL_B, USER_ITEMS_A, USER_SETTINGS_A),
                  "DELETE FROM Org WHERE id IN ('%s', '%s')" % (ORG_A, ORG_B),
              ]
              for statement in statements:
                  sql_quiet(statement)
              try:
                  mongo_seed("\n".join([
                      "db.newseventclusteringfailures.deleteMany(" +
                      js_literal({"orgId": {"$in": [ORG_A, ORG_B]}}) + ");",
                      "db.rawitems.deleteMany(" +
                      js_literal({"itemMetaId": {"$in": [ITEM_A, ITEM_B, ITEM_MISSING]}}) + ");",
                      "db.processeditems.deleteMany(" +
                      js_literal({"$or": [
                          {"orgId": {"$in": [ORG_A, ORG_B]}},
                          {"_id": {"$in": [("oid", P_A), ("oid", P_POISON), ("oid", P_B)]}},
                      ]}) + ");",
                      "db.tasklogs.deleteMany(" +
                      js_literal({"orgId": {"$in": [ORG_A, ORG_B]}}) + ");",
                  ]))
              except Exception as exc:
                  print("cleanup mongo skipped:", exc)
              print("cleanup: done")


          def main():
              try:
                  run()
              except SmokeFailure as exc:
                  print("FAIL", exc)
                  write_summary(False, str(exc))
                  dump_logs()
                  sys.exit(1)
              except Exception as exc:
                  traceback.print_exc()
                  write_summary(False, "unexpected error: " + str(exc))
                  dump_logs()
                  sys.exit(1)
              else:
                  print("PASS api-go newsnow clustering ops: legacy parity, go parity, "
                        "url reverse-lookup tenant binding, atomic vector-backfill claim, "
                        "tenant isolation, permissions, nest-off survival")
                  write_summary(True)
              finally:
                  cleanup()


          if __name__ == "__main__":
              main()
          PY
      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== NestJS log (tail) ==="
          tail -200 /tmp/api-nestjs.log || true
          echo "=== api-go log (tail) ==="
          docker logs api-go-newsnow-clustering 2>&1 | tail -200 || true
