# NewsNow 本地计算 + 新闻事件聚类失败管理 9 条 HTTP 的真实栈验收。
# 不进普通 CI。PR 上加 label api-go-newsnow-clustering-ops-smoke，或
# workflow_dispatch。
#
# 覆盖：
#   1. legacy 开关下 9 条路由经 Go 网关与 NestJS 直连一致；
#   2. go 开关下 metadata / resolve / sources/order / domestic-opinion-index
#      与 NestJS 逐字段一致（忽略 generatedAt / computedAt）；
#   3. 缺陷 2：rawitems.itemMetaId 无对应 ItemMeta 时 resolve 返回
#      {"matched":false}；合法链路上返回正确 itemId + 本组织 eventId，
#      且另一组织同一 URL 拿不到本组织 eventId；
#   4. 缺陷 3：vector-backfill 的原子抢占（两个并发请求恰好一个 201，
#      另一个 400，条目只被分配一次）；ignore 后不可再恢复；
#   5. 租户隔离与权限（跨组织 404、缺 items.read / settings.manage 403、
#      mtk_ 机器令牌放行）；
#   6. NestJS 停止后 9 条仍 200/201，未迁移路由由网关返回 502。
#
# 不请求 crawl4ai、不调用模型、不启动调度。SCHEDULE_ENABLED 保持 false。
name: api-go-newsnow-clustering-ops-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: api-go-newsnow-clustering-ops-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-newsnow-clustering-ops-smoke@example.com
  SMTP_PASS: api-go-newsnow-clustering-ops-smoke-smtp-not-connected
  JWT_SECRET: 9d3f7b1c5e2a8460f1d9c7b3e5a2846f0c1d9b7e3a5f2846c0d1b9e7f3a5c2846
  NEXTAUTH_SECRET: 4a8c2e6f0b3d9517c4a8e2f6b0d39517e4a8c2f6b0d39517c4a8e2f6b0d39517
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  SEED_ORG_SLUG: api-go-newsnow-clustering-ops-smoke-org
  SEED_ORG_NAME: api-go NewsNow Clustering Ops Smoke Org
  SEED_ADMIN_EMAIL: api-go-newsnow-clustering-ops-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: ApiGoNewsnow#2026-Ci
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-newsnow-clustering-ops-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-newsnow-clustering-ops-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-newsnow:ci .
      - name: Exercise NewsNow + clustering ops routes
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import concurrent.futures
          import hashlib
          import json
          import os
          import random
          import re
          import signal
          import string
          import subprocess
          import sys
          import time
          import traceback
          import urllib.error
          import urllib.parse
          import urllib.request

          NEST = "http://127.0.0.1:4000"
          GO = "http://127.0.0.1:4020"
          GO_CONTAINER = "api-go-newsnow-clustering"
          GO_IMAGE = "api-go-newsnow:ci"

          NEWSNOW = "/api/news-aggregator"
          CLUSTER = "/api/system-settings/news-events/clustering"
          META = NEWSNOW + "/metadata"
          RESOLVE = NEWSNOW + "/resolve"
          ORDER = NEWSNOW + "/sources/order"
          OPINION = NEWSNOW + "/domestic-opinion-index"
          READINESS = CLUSTER + "/readiness"
          OVERVIEW = CLUSTER + "/overview"
          FAILURES = CLUSTER + "/failures"

          PENDING_MSG = "Failure group is already processing"
          UNRECOVERABLE_MSG = "Failure group can no longer be recovered"
          NOT_FOUND_MSG = "News event clustering failure not found"
          FAILURE_MESSAGE = "Smoke forced failure"

          RUN_ID = re.sub(r"[^a-z0-9]", "", (
              os.environ.get("GITHUB_RUN_ID", "") +
              os.environ.get("GITHUB_RUN_ATTEMPT", "")
          ).lower()) or "0"
          RANDOM = "".join(random.choice(string.ascii_lowercase + string.digits) for _ in range(6))
          SUFFIX = RUN_ID + RANDOM

          ORG_A = "newsnow-smoke-a-" + SUFFIX
          ORG_B = "newsnow-smoke-b-" + SUFFIX
          SLUG_A = "newsnow-smoke-a-" + SUFFIX
          SLUG_B = "newsnow-smoke-b-" + SUFFIX

          ROLE_FULL_A = "role-full-a-" + SUFFIX
          ROLE_FULL_B = "role-full-b-" + SUFFIX
          ROLE_ITEMS_A = "role-items-a-" + SUFFIX
          ROLE_SETTINGS_A = "role-settings-a-" + SUFFIX

          USER_FULL_A = "user-full-a-" + SUFFIX
          USER_FULL_B = "user-full-b-" + SUFFIX
          USER_ITEMS_A = "user-items-a-" + SUFFIX
          USER_SETTINGS_A = "user-settings-a-" + SUFFIX

          EMAIL_FULL_A = "newsnow-smoke-a-" + SUFFIX + "@example.com"
          EMAIL_FULL_B = "newsnow-smoke-b-" + SUFFIX + "@example.com"
          EMAIL_ITEMS_A = "newsnow-smoke-items-" + SUFFIX + "@example.com"
          EMAIL_SETTINGS_A = "newsnow-smoke-settings-" + SUFFIX + "@example.com"

          MACHINE_TOKEN = "mtk_newsnow_smoke_" + SUFFIX

          ITEM_A = "smoke-itemmeta-a-" + SUFFIX
          ITEM_B = "smoke-itemmeta-b-" + SUFFIX
          ITEM_MISSING = "smoke-itemmeta-missing-" + SUFFIX

          HOST = "newsnow-" + SUFFIX + ".example.com"
          URL_A = "https://" + HOST + "/story/a1?utm=1"
          URL_MISSING = "https://" + HOST + "/story/missing"

          EVENT_A = "event-resolve-a-" + SUFFIX
          EVENT_B = "event-resolve-b-" + SUFFIX
          P_A = hashlib.sha256(("processed-a:" + SUFFIX).encode()).hexdigest()[:24]
          P_POISON = hashlib.sha256(("processed-poison:" + SUFFIX).encode()).hexdigest()[:24]
          P_B = hashlib.sha256(("processed-b:" + SUFFIX).encode()).hexdigest()[:24]

          ZERO_GROUP = "0" * 24

          token_a = ""
          token_b = ""
          token_items_a = ""
          token_settings_a = ""

          results = []


          class SmokeFailure(Exception):
              pass


          def record(label, ok, detail=""):
              results.append((label, ok, detail))
              suffix = (" :: " + str(detail)) if (detail and not ok) else ""
              print(("PASS " if ok else "FAIL ") + label + suffix)


          def require(label, condition, detail=""):
              if condition:
                  record(label, True)
                  return
              record(label, False, detail)
              raise SmokeFailure(label + ": " + str(detail))


          # ---------- generic helpers ----------
          def call(base, path, method="GET", token=None, payload=None, timeout=60):
              headers = {"accept": "application/json"}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()


          def body(raw):
              if not raw:
                  return None
              text = raw.decode("utf-8", "replace").strip()
              if not text:
                  return None
              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  return text


          def message(raw):
              doc = body(raw)
              if not isinstance(doc, dict):
                  return None
              text = doc.get("message")
              if isinstance(text, list):
                  return "; ".join(str(item) for item in text)
              return text


          def strip_keys(value, keys):
              if isinstance(value, dict):
                  return {k: strip_keys(v, keys) for k, v in value.items() if k not in keys}
              if isinstance(value, list):
                  return [strip_keys(item, keys) for item in value]
              return value


          def normalized(value, ignore=(), length_keys=()):
              out = strip_keys(value, set(ignore))
              if isinstance(out, dict):
                  for key in length_keys:
                      if isinstance(out.get(key), list):
                          out[key] = len(out[key])
              return out


          def quote(value):
              return urllib.parse.quote(value, safe="")


          def resolve_path(url_value):
              return RESOLVE + "?url=" + quote(url_value)


          def backfill_path(group_id):
              return CLUSTER + "/failures/" + group_id + "/vector-backfill"


          def ignore_path(group_id):
              return CLUSTER + "/failures/" + group_id + "/ignore"


          def llm_backfill_path(group_id):
              return CLUSTER + "/failures/" + group_id + "/llm-backfill"


          # ---------- docker / service helpers ----------
          def container_id(ancestor):
              return subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=" + ancestor], text=True).split()[0]


          def sql(statement):
              cid = container_id("mysql:8.4")
              proc = subprocess.run(["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "app"],
                                    input=statement, text=True, capture_output=True, timeout=120)
              if proc.returncode != 0:
                  raise SmokeFailure((proc.stderr or proc.stdout).strip()[:2000])
              return proc.stdout.strip()


          def sql_quiet(statement):
              try:
                  cid = container_id("mysql:8.4")
                  subprocess.run(["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "app"],
                                 input=statement, text=True, capture_output=True, timeout=120)
              except Exception as exc:
                  print("cleanup mysql skipped:", exc)


          def scalar(statement):
              lines = [line.strip() for line in sql(statement).splitlines() if line.strip()]
              return lines[-1] if lines else ""


          def mysql_int(statement):
              value = scalar(statement)
              return int(value) if value else 0


          def mongo_seed(script):
              cid = container_id("mongo:7.0")
              path = "/tmp/newsnow-clustering-smoke-seed.js"
              with open(path, "w") as handle:
                  handle.write(script)
              subprocess.check_call(["docker", "cp", path, cid + ":/tmp/seed.js"], stdout=subprocess.DEVNULL)
              proc = subprocess.run(["docker", "exec", cid, "mongosh", "--quiet", "app", "--file", "/tmp/seed.js"],
                                    text=True, capture_output=True, timeout=120)
              if proc.returncode != 0:
                  raise SmokeFailure((proc.stderr or proc.stdout).strip()[:2000])
              return proc.stdout


          def mongo_eval(expression):
              cid = container_id("mongo:7.0")
              proc = subprocess.run(["docker", "exec", cid, "mongosh", "--quiet", "app", "--eval", expression],
                                    text=True, capture_output=True, timeout=120)
              if proc.returncode != 0:
                  raise SmokeFailure((proc.stderr or proc.stdout).strip()[:2000])
              return proc.stdout.strip()


          def flush_cache_pattern(pattern):
              cid = container_id("redis:7.2")
              subprocess.run(
                  ["docker", "exec", cid, "sh", "-c",
                   "redis-cli --scan --pattern " + json.dumps(pattern) + " | xargs -r redis-cli del"],
                  text=True, capture_output=True, timeout=120)


          def flush_newsnow_caches():
              # Nest 与 Go 的 resolve / personalization 缓存键互不相同，按前缀一起清掉，
              # 保证两次比对都是现算结果。
              flush_cache_pattern("*resolve*")
              flush_cache_pattern("*personalization*")


          def js_literal(value):
              if isinstance(value, dict):
                  return "{" + ",".join(json.dumps(str(k)) + ":" + js_literal(v) for k, v in value.items()) + "}"
              if isinstance(value, list):
                  return "[" + ",".join(js_literal(item) for item in value) + "]"
              if isinstance(value, tuple):
                  kind, payload = value
                  if kind == "date":
                      return "new Date(" + str(int(payload)) + ")"
                  if kind == "oid":
                      return 'ObjectId("' + str(payload) + '")'
              if value is None:
                  return "null"
              if isinstance(value, bool):
                  return "true" if value else "false"
              if isinstance(value, (int, float)):
                  return json.dumps(value)
              return json.dumps(str(value))


          def comparable_variants(url_value):
              parts = urllib.parse.urlsplit(url_value)
              netloc = parts.netloc.lower()
              full = urllib.parse.urlunsplit((parts.scheme.lower(), netloc, parts.path, parts.query, ""))
              base = urllib.parse.urlunsplit((parts.scheme.lower(), netloc, parts.path, "", ""))
              return full, base, hashlib.sha256(full.encode()).hexdigest()


          def start_go(mode):
              subprocess.run(["docker", "rm", "-f", GO_CONTAINER], check=False, capture_output=True)
              env = [
                  "PORT=4020",
                  "LEGACY_API_URL=http://host.docker.internal:4000",
                  "DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app",
                  "MONGO_URI=mongodb://host.docker.internal:27017/app",
                  "API_GO_NEWSNOW_CLUSTERING_OPS_MODE=" + mode,
                  "API_GO_QUALITY_OVERVIEW_MODE=legacy",
                  "API_GO_ADMIN_LOGS_MODE=legacy",
                  "API_GO_LLM_LOGS_MODE=legacy",
                  "API_GO_CRAWL_PROFILES_MODE=legacy",
                  "API_GO_CRAWL_TEMPLATES_MODE=legacy",
                  "API_GO_CRAWL_WORKFLOWS_MODE=legacy",
                  "API_GO_NEWS_SOURCES_MODE=legacy",
                  "API_GO_RBAC_MODE=legacy",
                  "API_GO_SITUATION_MONITORS_MODE=legacy",
                  "API_GO_CONTENT_SUBSCRIPTIONS_MODE=legacy",
                  "API_GO_USER_NEWS_BEHAVIOR_MODE=legacy",
                  "API_GO_USER_DIGEST_MODE=legacy",
                  "API_GO_DASHBOARD_STATS_MODE=legacy",
                  "API_GO_DASHBOARD_CHARTS_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_GEO_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE=legacy",
                  "API_GO_DASHBOARD_STREAM_MODE=legacy",
                  "API_GO_HEALTHZ_MODE=legacy",
                  "API_GO_PUBLIC_PORTAL_MODE=legacy",
                  "API_GO_ANALYSIS_VIEWS_MODE=legacy",
                  "API_GO_ANALYSIS_BOARDS_MODE=legacy",
                  "API_GO_ANALYSIS_THREADS_MODE=legacy",
                  "API_GO_GRAPHQL_READ_MODE=legacy",
                  "API_GO_GRAPHQL_NEWS_EVENTS_MODE=legacy",
                  "API_GO_USER_SETTINGS_WRITE_MODE=legacy",
                  "REALTIME_SIGNALS_ENABLED=false",
                  "ELASTICSEARCH_ENABLED=false",
                  "MODEL_SERVICE_ENABLED=false",
                  "SCHEDULE_ENABLED=false",
                  "JWT_SECRET=" + os.environ["JWT_SECRET"],
                  "JWT_ISSUER=" + os.environ["JWT_ISSUER"],
                  "JWT_AUDIENCE=" + os.environ["JWT_AUDIENCE"],
                  "REDIS_HOST=host.docker.internal",
                  "REDIS_PORT=6379",
                  "CANARY_PERCENT=0",
                  "CORS_ORIGIN=" + os.environ["CORS_ORIGIN"],
              ]
              cmd = ["docker", "run", "-d", "--name", GO_CONTAINER,
                     "--add-host=host.docker.internal:host-gateway",
                     "--health-interval", "5s", "--health-timeout", "3s",
                     "--health-retries", "20", "--health-start-period", "5s",
                     "-p", "127.0.0.1:4020:4020"]
              for item in env:
                  cmd.extend(["-e", item])
              cmd.append(GO_IMAGE)
              proc = subprocess.run(cmd, capture_output=True, text=True)
              if proc.returncode != 0:
                  raise SmokeFailure("docker run " + mode + " failed: " + (proc.stderr or proc.stdout)[-2000:])
              for _ in range(60):
                  status = subprocess.check_output(
                      ["docker", "inspect", "--format", "{{.State.Health.Status}}", GO_CONTAINER],
                      text=True).strip()
                  print("api-go health", status, "mode", mode)
                  if status == "healthy":
                      record("api-go gateway healthy (" + mode + " mode)", True)
                      return
                  if status == "unhealthy":
                      raise SmokeFailure("api-go unhealthy in " + mode + " mode: " +
                                         subprocess.run(["docker", "logs", GO_CONTAINER],
                                                        capture_output=True, text=True).stdout[-4000:])
                  time.sleep(2)
              raise SmokeFailure("api-go did not become healthy in " + mode + " mode: " +
                                 subprocess.run(["docker", "logs", GO_CONTAINER],
                                                capture_output=True, text=True).stdout[-4000:])


          def stop_nest():
              if os.path.exists("/tmp/api-nestjs.pid"):
                  try:
                      os.kill(int(open("/tmp/api-nestjs.pid").read().strip()), signal.SIGTERM)
                  except Exception:
                      pass
              subprocess.run(["pkill", "-f", "apps/api/dist/main.js"], check=False)
              subprocess.run(["pkill", "-f", "node dist/main.js"], check=False)
              for _ in range(30):
                  try:
                      urllib.request.urlopen(NEST + "/api/healthz/live", timeout=2).read()
                  except Exception:
                      return
                  time.sleep(1)
              raise SmokeFailure("nestjs did not stop")


          def dump_logs():
              print("=== nestjs log tail ===")
              try:
                  with open("/tmp/api-nestjs.log", "r", errors="replace") as handle:
                      print(handle.read()[-8000:])
              except Exception as exc:
                  print("no nestjs log:", exc)
              print("=== api-go log tail ===")
              try:
                  proc = subprocess.run(["docker", "logs", GO_CONTAINER], capture_output=True, text=True)
                  print((proc.stdout + proc.stderr)[-8000:])
              except Exception as exc:
                  print("no api-go log:", exc)


          def write_summary(passed, detail=""):
              lines = ["## api-go-newsnow-clustering-ops-smoke: " + ("PASS" if passed else "FAIL"), ""]
              if detail:
                  lines.extend(["`" + str(detail)[:800] + "`", ""])
              lines.append("| # | assertion | result |")
              lines.append("| --- | --- | --- |")
              for index, (label, ok, _) in enumerate(results, 1):
                  lines.append("| " + str(index) + " | " + label.replace("|", "/") + " | " +
                               ("PASS" if ok else "FAIL") + " |")
              text = "\n".join(lines) + "\n"
              print(text)
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  try:
                      with open(path, "a") as handle:
                          handle.write(text)
                  except Exception as exc:
                      print("could not write job summary:", exc)


          # ---------- API helpers ----------
          def login(email):
              status, raw = call(NEST, "/api/auth/login", "POST",
                                 payload={"email": email, "password": os.environ["SEED_ADMIN_PASSWORD"]})
              doc = body(raw)
              if status not in (200, 201) or not isinstance(doc, dict) or not doc.get("accessToken"):
                  raise SmokeFailure("login " + email + " " + str(status) + " " + repr(raw[:400]))
              return doc["accessToken"]


          def get_ok(label, path, token=None, base=GO, expect=200):
              status, raw = call(base, path, "GET", token)
              require(label + " status", status == expect,
                      "got " + str(status) + " want " + str(expect) + " body=" + repr(raw[:500]))
              return body(raw)


          def post_ok(label, path, token=None, payload=None, base=GO, expect=201):
              status, raw = call(base, path, "POST", token, payload)
              require(label + " status", status == expect,
                      "got " + str(status) + " want " + str(expect) + " body=" + repr(raw[:500]))
              return body(raw)


          def compare_direct(label, path, token=None, ignore=(), method="GET", payload=None):
              nst, nraw = call(NEST, path, method, token, payload)
              gst, graw = call(GO, path, method, token, payload)
              require(label + " status", nst == gst and nst in (200, 201),
                      "nest=" + str(nst) + " go=" + str(gst) + " nest_body=" + repr(nraw[:400]) +
                      " go_body=" + repr(graw[:400]))
              nbody, gbody = body(nraw), body(graw)
              require(label + " body", normalized(nbody, ignore) == normalized(gbody, ignore),
                      "nest=" + repr(nraw[:800]) + " go=" + repr(graw[:800]))
              return nbody


          def compare_resolve(label, url_value, token=None):
              flush_newsnow_caches()
              gst, graw = call(GO, resolve_path(url_value), "GET", token)
              flush_newsnow_caches()
              nst, nraw = call(NEST, resolve_path(url_value), "GET", token)
              require(label + " status", st_pair_ok(nst, gst), "nest=" + str(nst) + " go=" + str(gst))
              require(label + " body", body(nraw) == body(graw),
