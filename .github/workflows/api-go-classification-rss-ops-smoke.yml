# 分类质量工作台 + RSS 链路诊断/翻译指标（13 条精确路由规则）的真实栈验收。
# 不进普通 CI。PR 上加 label api-go-classification-rss-ops-smoke，或 workflow_dispatch。
# SCHEDULE_ENABLED / NEWS_SOURCE_SCHEDULER_ENABLED 保持 false。不请求 crawl4ai；
# 不把抓取、模型、AkShare 或 Nominatim 当通过。
name: api-go-classification-rss-ops-smoke

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

# The job only reads the repository; every write happens inside the ephemeral
# MySQL/Redis/Mongo services and the built containers.
permissions:
  contents: read

concurrency:
  group: api-go-classification-rss-ops-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"
  DATABASE_URL: mysql://root:secret@127.0.0.1:3306/app
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: secret
  MYSQL_DB: app
  MONGO_URI: mongodb://127.0.0.1:27017/app
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6379"
  JWT_ISSUER: modular-monolith
  JWT_AUDIENCE: modular-monolith-clients
  SMTP_USER: api-go-classification-rss-ops-smoke@example.com
  SMTP_PASS: api-go-classification-rss-ops-smoke-smtp-not-connected
  JWT_SECRET: d4a8f1c25b9e3067a2f5c8d1e4b70936f8a2c5d9e1b40738a6c2f5d8e1b4073a
  NEXTAUTH_SECRET: f7b2e5a8d1c49036e2a5f8b1d4c70936a2e5f8b1d4c70936a2e5f8b1d4c70936
  NEXTAUTH_URL: http://localhost:3000
  API_BASE_URL: http://localhost:4000
  CRAWL4AI_BASE_URL: http://127.0.0.1:11235
  CORS_ORIGIN: http://localhost:3000
  AKSHARE_ENABLED: "false"
  SCHEDULE_ENABLED: "false"
  NEWS_SOURCE_SCHEDULER_ENABLED: "false"
  REALTIME_SIGNALS_ENABLED: "false"
  ELASTICSEARCH_ENABLED: "false"
  VECTOR_SERVICE_ENABLED: "false"
  MODEL_SERVICE_ENABLED: "false"
  SEED_ORG_SLUG: api-go-classification-rss-ops-smoke-org
  SEED_ORG_NAME: api-go Classification RSS Ops Smoke Org
  SEED_ADMIN_EMAIL: api-go-classification-rss-ops-smoke-admin@example.com
  SEED_ADMIN_PASSWORD: ApiGoClassification#2026-Ci
  SEED_ADMIN_FIRST_NAME: Smoke
  SEED_ADMIN_LAST_NAME: Admin

jobs:
  api-go-classification-rss-ops-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'api-go-classification-rss-ops-smoke')
    runs-on: [self-hosted, linux, build-server]
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter db run prisma:generate
      - name: Migrate
        run: pnpm --filter db run migrate
      - name: Seed
        run: pnpm --filter db run seed
      - name: Build NestJS
        run: pnpm exec turbo run build --env-mode=loose --filter=@modular/api
      - name: Start NestJS
        run: |
          NODE_ENV=production PORT=4000 pnpm --filter @modular/api run start > /tmp/api-nestjs.log 2>&1 &
          echo $! > /tmp/api-nestjs.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4000/api/healthz/live >/dev/null 2>&1; then
              echo "nestjs healthy"
              exit 0
            fi
            sleep 2
          done
          tail -80 /tmp/api-nestjs.log || true
          exit 1
      - name: Build api-go image
        run: docker build -f infra/docker/api-go.Dockerfile -t api-go-classification-rss-ops:ci .
      - name: Exercise classification/RSS ops routes
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib, json, os, signal, subprocess, time, urllib.error, urllib.request

          nest = "http://127.0.0.1:4000"
          go = "http://127.0.0.1:4020"

          org_a = "cls-smoke-org-a-0001"
          org_b = "cls-smoke-org-b-0001"
          user_a = "cls-smoke-user-a-0001"
          user_b = "cls-smoke-user-b-0001"
          user_denied = "cls-smoke-user-denied-0001"
          machine_token = "mtk_cls_smoke_0000000000000000001"

          # Seeded Mongo ids (ObjectIds so the classification collections work).
          review_a = "64b7f0c2a1d3e5f7091b2c01"
          review_b = "64b7f0c2a1d3e5f7091b2c02"
          report_a = "64b7f0c2a1d3e5f7091b2c03"
          item_a1 = "64b7f0c2a1d3e5f7091b2c11"
          item_a2 = "64b7f0c2a1d3e5f7091b2c12"
          item_a_backfill = "64b7f0c2a1d3e5f7091b2c13"
          item_b1 = "64b7f0c2a1d3e5f7091b2c14"
          raw_a_backfill = "64b7f0c2a1d3e5f7091b2c21"

          source_a = "cls-smoke-source-a-0001"
          # A second RSS source that only becomes visible after the backfill: the
          # seeded item missing a sourceId resolves to it through
          # RawItem.payload.metadata.sourceId.
          source_a2 = "cls-smoke-source-a-0002"
          source_b = "cls-smoke-source-b-0001"

          summary = "/api/admin/quality/classification/summary"
          source_items = f"/api/admin/quality/classification/sources/{source_a}/items"
          queue = "/api/admin/quality/classification/reviews/queue"
          decision = f"/api/admin/quality/classification/reviews/{review_a}/decision"
          reviews_batch = "/api/admin/quality/classification/reviews/batch"
          sampling = "/api/admin/quality/classification/sampling/query"
          annotations = "/api/admin/quality/classification/sampling/annotations"
          report = f"/api/admin/quality/classification/reports/{report_a}"
          diag_overview = "/api/system-settings/rss-diagnostics/overview"
          diag_chain = "/api/system-settings/rss-diagnostics/chain"
          diag_sources = "/api/system-settings/rss-diagnostics/sources"
          backfill = "/api/system-settings/rss-diagnostics/backfill-source-id"
          translation = "/api/system-settings/rss-translation/metrics"
          reports_enqueue = "/api/admin/quality/classification/reports"

          get_paths = [summary, source_items, queue, report, diag_overview, diag_chain, diag_sources, translation]
          post_paths = [decision, reviews_batch, sampling, annotations, backfill]
          all_paths = get_paths + post_paths
          # Cross-org markers: org B data must never appear in org A responses.
          foreign_markers = ["cls-beta-source", "cls-beta-marker", "cls-beta-provider-marker"]
          org_a_markers = ["cls-alpha-source", "cls-alpha-marker"]

          def fail(message):
              print("FAIL", message)
              raise SystemExit(1)

          def container_id(ancestor):
              return subprocess.check_output(["docker", "ps", "-q", "-f", "ancestor=" + ancestor], text=True).split()[0]

          def sql(statement):
              cid = container_id("mysql:8.4")
              proc = subprocess.run(["docker", "exec", "-i", cid, "mysql", "-uroot", "-psecret", "-N", "app"],
                                    input=statement, text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(proc.stderr or proc.stdout)
              return proc.stdout.strip()

          def scalar(statement):
              lines = [line.strip() for line in sql(statement).splitlines() if line.strip()]
              return lines[-1] if lines else ""

          def mongo_seed(script):
              cid = container_id("mongo:7.0")
              with open("/tmp/classification-rss-ops-seed.js", "w") as handle:
                  handle.write(script)
              subprocess.check_call(["docker", "cp", "/tmp/classification-rss-ops-seed.js", cid + ":/tmp/seed.js"])
              proc = subprocess.run(["docker", "exec", cid, "mongosh", "--quiet", "app", "--file", "/tmp/seed.js"],
                                    text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(proc.stderr or proc.stdout)
              return proc.stdout

          def mongo_eval(script):
              cid = container_id("mongo:7.0")
              proc = subprocess.run(["docker", "exec", cid, "mongosh", "--quiet", "app", "--eval", script],
                                    text=True, capture_output=True)
              if proc.returncode != 0:
                  fail(proc.stderr or proc.stdout)
              return proc.stdout.strip()

          def redis(*args):
              cid = container_id("redis:7.2")
              return subprocess.run(["docker", "exec", cid, "redis-cli", *args],
                                    text=True, capture_output=True).stdout.strip()

          def start_go(mode):
              subprocess.run(["docker", "rm", "-f", "api-go-classification-rss-ops"], check=False, capture_output=True)
              env = [
                  "PORT=4020",
                  "LEGACY_API_URL=http://host.docker.internal:4000",
                  "DATABASE_URL=mysql://root:secret@host.docker.internal:3306/app",
                  "MONGO_URI=mongodb://host.docker.internal:27017/app",
                  f"API_GO_CLASSIFICATION_RSS_OPS_MODE={mode}",
                  "API_GO_QUALITY_OVERVIEW_MODE=legacy",
                  "API_GO_ADMIN_LOGS_MODE=legacy",
                  "API_GO_LLM_LOGS_MODE=legacy",
                  "API_GO_NEWS_INDICATORS_MODE=legacy",
                  "API_GO_CRAWL_PROFILES_MODE=legacy",
                  "API_GO_CRAWL_TEMPLATES_MODE=legacy",
                  "API_GO_CRAWL_WORKFLOWS_MODE=legacy",
                  "API_GO_NEWS_SOURCES_MODE=legacy",
                  "API_GO_RBAC_MODE=legacy",
                  "API_GO_SITUATION_MONITORS_MODE=legacy",
                  "API_GO_CONTENT_SUBSCRIPTIONS_MODE=legacy",
                  "API_GO_USER_NEWS_BEHAVIOR_MODE=legacy",
                  "API_GO_USER_DIGEST_MODE=legacy",
                  "API_GO_DASHBOARD_STATS_MODE=legacy",
                  "API_GO_DASHBOARD_CHARTS_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_TRANSPORT_MODE=legacy",
                  "API_GO_DASHBOARD_WAR_MAP_LAYERS_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_GEO_MODE=legacy",
                  "API_GO_DASHBOARD_SPACETIME_PROPAGATION_MODE=legacy",
                  "API_GO_DASHBOARD_STREAM_MODE=legacy",
                  "API_GO_HEALTHZ_MODE=legacy",
                  "API_GO_PUBLIC_PORTAL_MODE=legacy",
                  "API_GO_ANALYSIS_VIEWS_MODE=legacy",
                  "API_GO_ANALYSIS_BOARDS_MODE=legacy",
                  "API_GO_ANALYSIS_THREADS_MODE=legacy",
                  "API_GO_GRAPHQL_READ_MODE=legacy",
                  "API_GO_GRAPHQL_NEWS_EVENTS_MODE=legacy",
                  "API_GO_GRAPHQL_KG_IMPACT_MODE=legacy",
                  "API_GO_GRAPHQL_KNOWLEDGE_GRAPH_MODE=legacy",
                  "API_GO_USER_SETTINGS_WRITE_MODE=legacy",
                  "NEWS_SOURCE_SCHEDULER_ENABLED=false",
                  "REALTIME_SIGNALS_ENABLED=false",
                  "ELASTICSEARCH_ENABLED=false",
                  "MODEL_SERVICE_ENABLED=false",
                  "SCHEDULE_ENABLED=false",
                  f"JWT_SECRET={os.environ['JWT_SECRET']}",
                  f"JWT_ISSUER={os.environ['JWT_ISSUER']}",
                  f"JWT_AUDIENCE={os.environ['JWT_AUDIENCE']}",
                  "REDIS_HOST=host.docker.internal",
                  "REDIS_PORT=6379",
                  "CANARY_PERCENT=0",
                  f"CORS_ORIGIN={os.environ['CORS_ORIGIN']}",
              ]
              cmd = ["docker", "run", "-d", "--name", "api-go-classification-rss-ops",
                     "--add-host=host.docker.internal:host-gateway",
                     "--health-interval", "5s", "--health-timeout", "3s", "--health-retries", "20", "--health-start-period", "5s",
                     "-p", "127.0.0.1:4020:4020"]
              for item in env:
                  cmd.extend(["-e", item])
              cmd.append("api-go-classification-rss-ops:ci")
              subprocess.check_call(cmd)
              for _ in range(30):
                  status = subprocess.check_output(["docker", "inspect", "--format", "{{.State.Health.Status}}",
                                                    "api-go-classification-rss-ops"], text=True).strip()
                  print("health", status, "mode", mode)
                  if status == "healthy":
                      return
                  if status == "unhealthy":
                      fail(subprocess.check_output(["docker", "logs", "api-go-classification-rss-ops"], text=True)[-4000:])
                  time.sleep(2)
              fail(subprocess.check_output(["docker", "logs", "api-go-classification-rss-ops"], text=True)[-4000:])

          def call(base_url, path, method="GET", token=None, payload=None, timeout=30):
              headers = {}
              data = None
              if token:
                  headers["authorization"] = "Bearer " + token
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(base_url + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          def body(raw):
              if not raw:
                  return None
              text = raw.decode("utf-8", "replace").strip()
              if not text:
                  return None
              return json.loads(text)

          def message(raw):
              doc = body(raw) or {}
              text = doc.get("message")
              if isinstance(text, list):
                  return "; ".join(str(item) for item in text)
              return text

          def login(email):
              status, raw = call(nest, "/api/auth/login", "POST",
                                 payload={"email": email, "password": os.environ["SEED_ADMIN_PASSWORD"]})
              doc = body(raw)
              if status not in (200, 201) or not doc or not doc.get("accessToken"):
                  fail(f"login {email} {status} {raw[:400]!r}")
              return doc["accessToken"]

          def strip_volatile(payload, drop):
              if isinstance(payload, dict):
                  return {key: strip_volatile(value, drop) for key, value in payload.items() if key not in drop}
              if isinstance(payload, list):
                  return [strip_volatile(value, drop) for value in payload]
              return payload

          def sorted_items(payload):
              if isinstance(payload, dict) and isinstance(payload.get("items"), list):
                  copy = dict(payload)
                  copy["items"] = sorted(copy["items"], key=lambda entry: entry.get("processedItemId") or "")
                  return copy
              return payload

          def flush_caches():
              sql(f"DELETE FROM ObservabilitySnapshot WHERE orgId IN ('{org_a}', '{org_b}')")
              redis("DEL", f"quality:classification:summary:{org_a}:24h:all:all")
              redis("DEL", f"quality:classification:summary:{org_a}:24h:{source_a}:all")
              redis("DEL", f"quality:classification:alert:notify:{org_a}:24h:latency:llm")
              redis("DEL", f"classificationQuality:settings:{org_a}")
              redis("DEL", f"news_event_source_policy:{org_a}")

          def compare(left_label, left_raw, left_status, right_label, right_raw, right_status, drop=()):
              if left_status != right_status:
                  fail(f"parity status nest={left_status} go={right_status}: {left_raw[:300]!r} {right_raw[:300]!r}")
              left = strip_volatile(sorted_items(body(left_raw)), drop)
              right = strip_volatile(sorted_items(body(right_raw)), drop)
              if left != right:
                  fail(f"parity body {left_label} vs {right_label}: nest={left_raw[:900]!r} go={right_raw[:900]!r}")
              return left

          def assert_no_markers(label, payload, markers):
              text = json.dumps(payload, ensure_ascii=False)
              for marker in markers:
                  if marker in text:
                      fail(f"{label} leaked {marker} in {text[:400]!r}")

          def assert_no_foreign(label, payload):
              assert_no_markers(label, payload, foreign_markers)

          # ---- Seed MySQL + Mongo test data for two organizations ----
          admin = scalar("SELECT id FROM User WHERE email='api-go-classification-rss-ops-smoke-admin@example.com'")
          settings_perm = scalar("SELECT id FROM Permission WHERE name='settings.manage'")
          other_perm = scalar("SELECT id FROM Permission WHERE name='crawl.read'")
          if not admin or not settings_perm or not other_perm:
              fail(f"missing seed rows admin={admin} settings={settings_perm} other={other_perm}")
          machine_hash = hashlib.sha256(machine_token.encode()).hexdigest()

          sql(f"""
          INSERT INTO Org (id, name, slug, isActive, createdAt, updatedAt) VALUES
            ('{org_a}', 'Cls Ops Org A', 'cls-smoke-org-a', 1, NOW(3), NOW(3)),
            ('{org_b}', 'Cls Ops Org B', 'cls-smoke-org-b', 1, NOW(3), NOW(3));
          INSERT INTO Role (id, name, isSystem, orgId) VALUES
            ('cls-role-a-0001', 'cls-a', 0, '{org_a}'),
            ('cls-role-b-0001', 'cls-b', 0, '{org_b}'),
            ('cls-role-d-0001', 'cls-d', 0, '{org_a}');
          INSERT INTO RolePermission (id, roleId, permissionId) VALUES
            ('cls-rp-a-0001', 'cls-role-a-0001', '{settings_perm}'),
            ('cls-rp-b-0001', 'cls-role-b-0001', '{settings_perm}'),
            ('cls-rp-d-0001', 'cls-role-d-0001', '{other_perm}');
          INSERT INTO NewsSource (id, orgId, name, url, siteType, frequencySeconds, priority, isActive, config, consecutiveFailures, circuitOpenUntil, lastFailureAt, nextRunAt, createdAt, updatedAt) VALUES
            ('{source_a}', '{org_a}', 'cls-alpha-source', 'https://www.reuters.com/rss', 'general', 3600, 0, 1, '{{"seed":{{"enabled":true,"mode":"rss","feedUrl":"https://www.reuters.com/rss"}}}}', 0, NULL, NULL, NULL, NOW(3), NOW(3)),
            ('{source_a2}', '{org_a}', 'cls-alpha-secondary', 'https://secondary.example.com/rss', 'general', 3600, 0, 1, '{{"seed":{{"enabled":true,"mode":"rss"}}}}', 0, NULL, NULL, NULL, NOW(3), NOW(3)),
            ('{source_b}', '{org_b}', 'cls-beta-source', 'https://beta.example.com/rss', 'general', 3600, 0, 1, '{{"seed":{{"enabled":true,"mode":"rss","feedUrl":"https://beta.example.com/rss"}}}}', 0, NULL, NULL, NULL, NOW(3), NOW(3));
          INSERT INTO Article (id, orgId, sourceId, url, crawlAt, contentHash, markdownRef, version, createdAt, updatedAt) VALUES
            ('cls-article-a-0001', '{org_a}', '{source_a}', 'https://www.reuters.com/a/1', DATE_SUB(NOW(3), INTERVAL 30 MINUTE), 'cls-hash-a-1', 'cls-md-a-1', 1, NOW(3), NOW(3)),
            ('cls-article-b-0001', '{org_b}', '{source_b}', 'https://beta.example.com/a/1', DATE_SUB(NOW(3), INTERVAL 30 MINUTE), 'cls-hash-b-1', 'cls-md-b-1', 1, NOW(3), NOW(3));
          INSERT INTO ProcessedArticle (id, orgId, articleId, status, source, cleanedMarkdownRef, createdAt, updatedAt) VALUES
            ('cls-pa-a-0001', '{org_a}', 'cls-article-a-0001', 'completed', 'cls-alpha-source', '{item_a1}', NOW(3), NOW(3)),
            ('cls-pa-b-0001', '{org_b}', 'cls-article-b-0001', 'completed', 'cls-beta-source', '{item_b1}', NOW(3), NOW(3));
          INSERT INTO PipelineJob (id, orgId, sourceId, url, status, queueName, attempts, createdAt, updatedAt) VALUES
            ('cls-job-a-1', '{org_a}', '{source_a}', 'https://www.reuters.com/1', 'completed', 'crawl-queue', 0, DATE_SUB(NOW(3), INTERVAL 20 MINUTE), NOW(3)),
            ('cls-job-a-2', '{org_a}', '{source_a}', 'https://www.reuters.com/2', 'failed', 'crawl-queue', 0, DATE_SUB(NOW(3), INTERVAL 10 MINUTE), NOW(3)),
            ('cls-job-b-1', '{org_b}', '{source_b}', 'https://beta.example.com/1', 'failed', 'crawl-queue', 0, DATE_SUB(NOW(3), INTERVAL 5 MINUTE), NOW(3));
          INSERT INTO CrawlTask (id, orgId, createdById, newsSourceId, targetUrl, displayName, status, config, createdAt, updatedAt) VALUES
            ('cls-task-a-0001', '{org_a}', '{admin}', '{source_a}', 'https://www.reuters.com/rss', 'NewsSource:cls-alpha-source', 'completed', '{{"sourceId":"{source_a}"}}', NOW(3), DATE_SUB(NOW(3), INTERVAL 25 MINUTE)),
            ('cls-task-b-0001', '{org_b}', '{admin}', '{source_b}', 'https://beta.example.com/rss', 'NewsSource:cls-beta-source', 'failed', '{{"sourceId":"{source_b}"}}', NOW(3), DATE_SUB(NOW(3), INTERVAL 25 MINUTE));
          INSERT INTO CrawlResult (id, taskId, orgId, sourceUrl, fetchedAt, markdownRef, contentHash, createdAt) VALUES
            ('cls-result-a-0001', 'cls-task-a-0001', '{org_a}', 'https://www.reuters.com/rss', DATE_SUB(NOW(3), INTERVAL 25 MINUTE), 'cls-md-result-a', 'cls-hash-result-a', NOW(3)),
            ('cls-result-b-0001', 'cls-task-b-0001', '{org_b}', 'https://beta.example.com/rss', DATE_SUB(NOW(3), INTERVAL 25 MINUTE), 'cls-md-result-b', 'cls-hash-result-b', NOW(3));
          INSERT INTO RssTranslationMetricsDaily (id, orgId, date, provider, targetLanguage, requestCount, itemCount, textCount, cacheHitCount, cacheMissCount, translatedCount, failureCount, skipTooLongCount, totalLatencyMs, maxLatencyMs, createdAt, updatedAt) VALUES
            ('cls-metrics-a-1', '{org_a}', DATE_SUB(CURDATE(), INTERVAL 2 DAY), 'deeplx', 'zh', 10, 8, 20, 6, 4, 18, 2, 1, 1234, 500, NOW(3), NOW(3)),
            ('cls-metrics-a-2', '{org_a}', DATE_SUB(CURDATE(), INTERVAL 1 DAY), 'deeplx', 'zh', 5, 4, 9, 3, 2, 7, 1, 0, 600, 300, NOW(3), NOW(3)),
            ('cls-metrics-a-3', '{org_a}', DATE_SUB(CURDATE(), INTERVAL 1 DAY), 'llm', 'en', 4, 3, 6, 1, 3, 5, 0, 0, 400, 200, NOW(3), NOW(3)),
            ('cls-metrics-b-1', '{org_b}', DATE_SUB(CURDATE(), INTERVAL 1 DAY), 'deeplx', 'zh', 7, 7, 7, 7, 0, 7, 0, 0, 70, 10, NOW(3), NOW(3));
          INSERT INTO MachineAccessToken (id, orgId, name, tokenHash, permissions, lastUsedAt, expiresAt, revokedAt, createdAt, updatedAt)
          VALUES ('cls-mtok-0001', '{org_a}', 'smoke', '{machine_hash}', '["settings.manage"]', NULL, NULL, NULL, NOW(3), NOW(3));
          """)
          users = [
              (user_a, "cls-ops-a@example.com", org_a, "cls-role-a-0001"),
              (user_b, "cls-ops-b@example.com", org_b, "cls-role-b-0001"),
              (user_denied, "cls-ops-denied@example.com", org_a, "cls-role-d-0001"),
          ]
          for user_id, email, user_org, role_id in users:
              sql(f"""
              INSERT INTO User (id, email, passwordHash, firstName, lastName, isActive, emailVerified, createdAt, updatedAt)
              SELECT '{user_id}', '{email}', passwordHash, 'Smoke', 'User', 1, NOW(3), NOW(3), NOW(3)
