              (reviews_batch, {"status": "approved", "reviewIds": [review_a]}),
              (sampling, {"window": "24h", "perStratum": 5}),
              (backfill, {"dryRun": True}),
          ]:
              status, raw = call(go, path, "POST", alive, payload)
              if status != 201:
                  fail(f"after nest stop POST {path} {status} {raw[:300]!r}")
          status, raw = call(go, reports_enqueue, "POST", alive, {"sampleId": None})
          if status != 502 or (body(raw) or {}).get("statusCode") != 502:
              fail(f"POST {reports_enqueue} after nest stop {status} {raw[:300]!r}")
          print("classification/rss ops takeover verified: legacy parity, fresh parity, defects 1/2/3/4, sampling metrics, multi-hop backfill, snapshot reuse, translation metrics, org isolation, machine token, nest stop")
          PY
