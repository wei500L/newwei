              f"/api/dashboard/spacetime/geo-heatmap/articles?{q}&pointId={point}&snapshotId={geo['snapshotId']}": lambda body: len(body["articles"]) == 2,
              "/api/dashboard/spacetime/propagation/articles?" + q + "&source=Reuters": lambda body: [item["id"] for item in body["articles"]] == ["pa_sp_r"] and len(body.get("edges") or []) == 0,
          }.items():
              req = urllib.request.Request("http://127.0.0.1:4020" + path, headers={"authorization": "Bearer " + token})
              with urllib.request.urlopen(req, timeout=30) as resp:
