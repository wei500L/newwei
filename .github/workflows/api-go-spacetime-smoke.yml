              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = json.load(resp)
              if resp.status != 200 or not pred(body):
                  raise SystemExit(f"after nest stop {path} {body}")
          geo = json.load(urllib.request.urlopen(urllib.request.Request(
              "http://127.0.0.1:4020/api/dashboard/spacetime/geo-heatmap?" + q,
              headers={"authorization": "Bearer " + token},
          ), timeout=30))
          point = next(item["id"] for item in geo["points"] if item["total"] == 2)
          for path, pred in {
