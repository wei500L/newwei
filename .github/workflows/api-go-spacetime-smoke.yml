                  raise SystemExit(f"stream status {exc.code}")
          logs = __import__("subprocess").check_output(["docker", "logs", "api-go-spacetime"], text=True, stderr=__import__("subprocess").STDOUT)
          if "nominatim.openstreetmap.org" in logs:
