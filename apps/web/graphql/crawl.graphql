query CrawlTasks($first: Int!, $after: String, $search: String, $status: CrawlTaskStatus) {
  crawlTasks(first: $first, after: $after, search: $search, status: $status) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      cursor
      node {
        id
        displayName
        targetUrl
        status
        concurrency
        runCount
        resultCount
        lastRunAt
        lastSuccessAt
        lastError
        createdAt
        lastPeakMemoryMb
        lastMemoryEfficiency
      }
    }
  }
}

query CrawlTask($id: ID!, $resultLimit: Int, $resultSearch: String) {
  crawlTask(id: $id, resultLimit: $resultLimit, resultSearch: $resultSearch) {
    id
    displayName
    targetUrl
    status
    keywords
    concurrency
    runCount
    lastRunAt
    lastSuccessAt
    lastResultAt
    lastError
    config
    lastServerMemoryMb
    lastPeakMemoryMb
    lastMemoryEfficiency
    results {
      id
      sourceUrl
      fetchedAt
      markdown
      markdownWithCitations
      referencesMarkdown
      fitMarkdown
      metadata
      media
      mediaAssets
      tables
      linkAnalysis {
        stats {
          totalLinks
          internalLinks
          externalLinks
          averageIntrinsicScore
          highQualityLinks
          lowQualityLinks
        }
        topLinks {
          href
          text
          title
          baseDomain
          type
          intrinsicScore
          contextualScore
          totalScore
        }
        lowQualityLinks {
          href
          text
          title
          intrinsicScore
          baseDomain
        }
        buckets {
          kind
          links {
            href
            text
            title
            baseDomain
            type
            intrinsicScore
            contextualScore
            totalScore
          }
        }
      }
    }
    memoryStats {
      serverMemoryMb
      peakMemoryMb
      efficiencyPercent
    }
  }
}

mutation CreateCrawlTask($input: CreateCrawlTaskInput!) {
  createCrawlTask(input: $input) {
    id
    displayName
    targetUrl
    status
    concurrency
    runCount
    resultCount
    lastRunAt
    lastSuccessAt
    lastError
    createdAt
  }
}

mutation RetryCrawlTask($id: String!) {
  retryCrawlTask(id: $id) {
    id
    status
    lastRunAt
    lastError
    runCount
  }
}

query CrawlMetadata($input: CrawlMetadataInput!) {
  crawlMetadata(input: $input) {
    url
    status
    httpStatus
    fetchedAt
    title
    description
    keywords
    author
    relevanceScore
    error
    metaTags {
      name
      value
    }
    openGraph {
      name
      value
    }
    jsonLd
  }
}
