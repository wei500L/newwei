query RateLimitSettings {
  rateLimitSettings {
    login {
      limit
      windowSeconds
    }
    crawlCreate {
      limit
      windowSeconds
    }
    rbacWrite {
      limit
      windowSeconds
    }
  }
}

mutation UpdateRateLimitSettings($input: UpdateRateLimitSettingsInput!) {
  updateRateLimitSettings(input: $input) {
    login {
      limit
      windowSeconds
    }
    crawlCreate {
      limit
      windowSeconds
    }
    rbacWrite {
      limit
      windowSeconds
    }
  }
}

query AuthCacheSettings {
  authCacheSettings {
    profileTtlSeconds
    lockTtlMs
    maxWaitMs
    retryDelayMs
  }
}

mutation UpdateAuthCacheSettings($input: UpdateAuthCacheSettingsInput!) {
  updateAuthCacheSettings(input: $input) {
    profileTtlSeconds
    lockTtlMs
    maxWaitMs
    retryDelayMs
  }
}

query AuditLogRetention {
