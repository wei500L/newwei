query AlertRules {
  alertRules {
    id
    name
    description
    severity
    status
    metricProvider
    metricSlug
    operator
    thresholdValue
    thresholdLower
    thresholdUpper
    changeWindowMin
    cooldownSeconds
    checkIntervalSec
    lastTriggeredAt
    metadata
    channels {
      id
      name
      type
      target
    }
  }
}

query AlertChannels {
  alertChannels {
    id
    name
    type
    target
  }
}

query AlertEvents($limit: Int) {
  alertEvents(limit: $limit) {
    id
    triggeredAt
    metricValue
    changePercent
    severity
    status
    message
    ruleId
    ruleName
    metricProvider
    metricSlug
    operator
    thresholdValue
    thresholdLower
    thresholdUpper
    changeWindowMin
    context
    deliveries {
      id
      status
      channelType
      channelName
      target
      sentAt
      error
    }
  }
}

mutation UpsertAlertRule($input: UpsertAlertRuleInput!) {
  upsertAlertRule(input: $input) {
    id
    name
  }
}

mutation CreateAlertChannel($input: AlertChannelInput!) {
  createAlertChannel(input: $input) {
    id
    name
    type
    target
  }
}

mutation TriggerAlertRule($ruleId: String!) {
  triggerAlertRule(ruleId: $ruleId)
}

mutation UpdateAlertEventStatus($input: UpdateAlertEventStatusInput!) {
  updateAlertEventStatus(input: $input) {
    id
    status
  }
}

query AlertEventReplay($eventId: String!, $windowDays: Int) {
  alertEventReplay(eventId: $eventId, windowDays: $windowDays) {
    eventId
    metricProvider
    metricSlug
    unit
    points {
      timestamp
      value
    }
  }
}

subscription AlertEventsStream {
  alertEvents {
    id
    triggeredAt
    severity
    message
    metricValue
    changePercent
    ruleName
    metricSlug
    context
  }
}
