query AccessSettingsMeta {
  roles(includeSystem: true) {
    id
    name
    description
    isSystem
    permissions {
      id
      name
      description
    }
  }
  permissions {
    id
    name
    description
  }
}

query AccessSettingsUsers($first: Int!, $after: String, $search: String) {
  users(first: $first, after: $after, search: $search) {
    id
    email
    firstName
    lastName
    primaryRoleId
    isActive
    emailVerified
    lastLoginAt
    roleIds
    permissions
  }
}

query UserLoginRecords($userId: String!, $limit: Int) {
  userLoginRecords(userId: $userId, limit: $limit) {
    id
    createdAt
    ipAddress
    userAgent
    method
  }
}

mutation CreateRole($input: CreateRoleInput!) {
  createRole(input: $input) {
    id
    name
    description
    isSystem
    permissions {
      id
      name
      description
    }
  }
}

mutation UpdateRole($input: UpdateRoleInput!) {
  updateRole(input: $input) {
    id
    name
    description
    isSystem
    permissions {
      id
      name
      description
    }
  }
}

mutation UpdateMembershipRoles($input: UpdateMembershipRolesInput!) {
  updateMembershipRoles(input: $input) {
    id
    email
    firstName
    lastName
    primaryRoleId
    isActive
    emailVerified
    lastLoginAt
