query RbacOverview {
  roles {
    id
    name
    description
    isSystem
    permissions {
      id
      name
      description
    }
  }
  permissions {
    id
    name
    description
  }
  memberships {
    id
    orgId
    role {
      id
      name
      isSystem
    }
    user {
      id
      email
      firstName
      lastName
    }
  }
}

mutation AssignRole($input: AssignRoleInput!) {
  assignRole(input: $input) {
    id
    orgId
    role {
      id
      name
      isSystem
    }
    user {
      id
      email
      firstName
      lastName
    }
  }
}

mutation UpdateRole($input: UpdateRoleInput!) {
  updateRole(input: $input) {
    id
    name
    description
    isSystem
    permissions {
      id
      name
      description
    }
  }
}
