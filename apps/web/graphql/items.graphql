query Items($first: Int!, $after: String, $search: String, $filters: ItemsFiltersInput) {
  items(first: $first, after: $after, search: $search, filters: $filters) {
    edges {
      node {
        id
        title
        status
        createdAt
        processed {
          result
          tags
          duplicateOf
          duplicateSimilarity
          llm {
            model
            promptVersion
            promptTokens
            completionTokens
            totalTokens
            costUsd
            latencyMs
          }
        }
        raw {
          payload
          source
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query ItemFacets($search: String, $filters: ItemsFiltersInput) {
  itemFacets(search: $search, filters: $filters) {
    regions {
      value
      count
    }
    topics {
      value
      count
    }
    sentiments {
      value
      count
    }
  }
}

query Item($id: String!) {
  item(id: $id) {
    id
    title
    status
    createdAt
    updatedAt
    meta {
      id
      externalId
      name
      status
      createdAt
      updatedAt
    }
    raw {
      id
      payload
      source
      createdAt
      updatedAt
    }
    processed {
      id
      status
      tags
      duplicateOf
      duplicateSimilarity
      llm {
        model
        promptVersion
        promptTokens
        completionTokens
        totalTokens
        costUsd
        latencyMs
      }
      result
      createdAt
    }
  }
}
