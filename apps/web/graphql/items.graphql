query Items(
  $first: Int!
  $after: String
  $page: Int
  $search: String
  $filters: ItemsFiltersInput
  $orderBy: ItemsOrderBy = CREATED_DESC
) {
  items(first: $first, after: $after, page: $page, search: $search, filters: $filters, orderBy: $orderBy) {
    edges {
      node {
        id
        title
        status
        createdAt
        ingestedAt
        publishedAt
        processedPreview {
          id
          itemMetaId
          status
          tags
          duplicateOf
          duplicateSimilarity
          source
          publishedAt
          summary
          sentiment
          topics
          entities
          qualityScore
          location
          createdAt
          llm {
            model
            promptVersion
            promptTokens
            completionTokens
            totalTokens
            costUsd
            latencyMs
          }
        }
        rawPreview {
          url
          sourceName
          thumbnail
          summary
          sentiment
          region
          location
          ticker
          price
          changePercent
          history {
            timestamp
            value
          }
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query ItemFacets($search: String, $filters: ItemsFiltersInput) {
  itemFacets(search: $search, filters: $filters) {
    regions {
      value
      count
    }
    topics {
      value
      count
    }
    sentiments {
      value
      count
    }
  }
}

query Item($id: String!) {
  item(id: $id) {
    id
    title
    status
    createdAt
    updatedAt
    ingestedAt
    publishedAt
    meta {
      id
      externalId
      name
      status
      createdAt
      updatedAt
    }
    raw {
      id
      payload
      source
      createdAt
      updatedAt
    }
    processed {
      id
      status
      tags
      duplicateOf
      duplicateSimilarity
      llm {
        model
        promptVersion
        promptTokens
        completionTokens
        totalTokens
        costUsd
        latencyMs
      }
      result
      resultJson
      createdAt
    }
  }
}
