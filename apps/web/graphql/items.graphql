query Items($first: Int!, $after: String, $search: String) {
  items(first: $first, after: $after, search: $search) {
    edges {
      node {
        id
        title
        status
        createdAt
        processed {
          result
          tags
        }
        raw {
          payload
          source
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}
