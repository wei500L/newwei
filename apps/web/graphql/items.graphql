query Items($first: Int!, $after: String, $search: String) {
  items(first: $first, after: $after, search: $search) {
    edges {
      node {
        id
        title
        status
        createdAt
        processed {
          result
          tags
        }
        raw {
          payload
          source
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

query Item($id: String!) {
  item(id: $id) {
    id
    title
    status
    createdAt
    updatedAt
    meta {
      id
      externalId
      name
      status
      createdAt
      updatedAt
    }
    raw {
      id
      payload
      source
      createdAt
      updatedAt
    }
    processed {
      id
      status
      tags
      result
      createdAt
    }
  }
}
