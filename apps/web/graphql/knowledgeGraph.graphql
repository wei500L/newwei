query GetKnowledgeGraphSubgraph($input: KnowledgeGraphSubgraphInput!) {
  getKnowledgeGraphSubgraph(input: $input) {
    seed {
      id
      name
      type
      properties
    }
    nodes {
      id
      name
      type
      properties
    }
    edges {
      id
      from
      to
      type
      weight
      confidence
      properties
    }
    metadata {
      totalNodes
      totalEdges
      generatedAt
    }
  }
}

query KnowledgeGraphEdgeEvidence($edgeId: String!, $limit: Int) {
  knowledgeGraphEdgeEvidence(edgeId: $edgeId, limit: $limit) {
    id
    confidence
    extractorVersion
    createdAt
    evidence
    article {
      id
      url
      title
      summary
      language
      crawlAt
    }
  }
}
