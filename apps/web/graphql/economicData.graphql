query EconomicData($category: String!, $timeRange: DateRangeInput!, $granularity: TimeGranularity) {
  getEconomicData(category: $category, timeRange: $timeRange, granularity: $granularity) {
    timestamp
    effectiveGranularity
    value
    unit
    sourceField
    dataType
    item {
      slug
      displayName
      groupLabel
      defaultUnit
      metadata
    }
  }
}

query EconomicDataWithInsights($category: String!, $timeRange: DateRangeInput!, $granularity: TimeGranularity) {
  getEconomicDataWithInsights(category: $category, timeRange: $timeRange, granularity: $granularity) {
    points {
      timestamp
      effectiveGranularity
      value
      unit
      sourceField
      dataType
      item {
        slug
        displayName
        groupLabel
        defaultUnit
        metadata
      }
    }
    insights {
      itemSlug
      seriesKey
      sourceField
      unit
      sampleCount
      currentValue
      previousValue
      change
      percentChange
      mean
      stdDev
      zScore
      direction
      classification
      message
    }
  }
}

query EconomicFetchConfigs {
  economicDataFetchConfigs {
    id
    frequency
    repeatCron
    isEnabled
    lastRunAt
    lastStatus
    lastError
    item {
      slug
      displayName
      groupLabel
      defaultUnit
      metadata
    }
  }
}

query EconomicDataRefreshPresetStatus($preset: EconomicDashboardRefreshPreset!) {
  economicDataRefreshPresetStatus(preset: $preset) {
    preset
    categoryKey
    totalItems
    enabledItems
    lastRunAt
    lastStatus
    lastError
  }
}

mutation UpdateEconomicFetchConfig($slug: String!, $frequency: EconomicDataFrequency, $repeatCron: String, $isEnabled: Boolean) {
  updateEconomicDataFetchConfig(slug: $slug, frequency: $frequency, repeatCron: $repeatCron, isEnabled: $isEnabled) {
    id
    frequency
    repeatCron
    isEnabled
    lastRunAt
    lastStatus
    lastError
    item {
      slug
      displayName
      groupLabel
      defaultUnit
      metadata
    }
  }
}

mutation TriggerEconomicDataFetch($slugs: [String!]!) {
  triggerDataFetch(input: { slugs: $slugs })
}

mutation TriggerEconomicDataRefreshPreset($preset: EconomicDashboardRefreshPreset!) {
  triggerEconomicDataRefreshPreset(preset: $preset)
}
