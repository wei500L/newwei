query DashboardHeroMetrics($start: DateTime!, $end: DateTime!, $granularity: TimeGranularity) {
  conflict: getEconomicData(
    category: "global-conflict-index"
    timeRange: { start: $start, end: $end }
    granularity: $granularity
  ) {
    timestamp
    effectiveGranularity
    value
    unit
    dataType
    item {
      displayName
      defaultUnit
    }
  }
  market: getEconomicData(
    category: "market-sentiment"
    timeRange: { start: $start, end: $end }
    granularity: $granularity
  ) {
    timestamp
    effectiveGranularity
    sourceField
    value
    unit
    dataType
    item {
      slug
      displayName
      defaultUnit
    }
  }
  resource: getEconomicData(
    category: "resource-scarcity"
    timeRange: { start: $start, end: $end }
    granularity: $granularity
  ) {
    timestamp
    effectiveGranularity
    value
    unit
    dataType
    item {
      displayName
      defaultUnit
    }
  }
  supply: getEconomicData(
    category: "supply-chain-stability"
    timeRange: { start: $start, end: $end }
    granularity: $granularity
  ) {
    timestamp
    effectiveGranularity
    value
    unit
    dataType
    item {
      displayName
      defaultUnit
    }
  }
}

query MetricDrillDownDetails(
  $category: String!
  $start: DateTime!
  $end: DateTime!
  $granularity: TimeGranularity
) {
  history: getEconomicData(
    category: $category
    timeRange: { start: $start, end: $end }
    granularity: $granularity
  ) {
    timestamp
    effectiveGranularity
    value
    unit
    dataType
    item {
      displayName
      defaultUnit
    }
  }
  relatedAlerts: alertEvents(limit: 20) {
    id
    severity
    message
    triggeredAt
    status
    metricValue
    context
  }
}
