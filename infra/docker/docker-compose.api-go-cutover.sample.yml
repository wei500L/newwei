# ============================================================================
# api-go 全 Go override 样例（docker-compose.api-go-cutover.sample.yml）
# ============================================================================
#
# 性质与边界：
#   1. 不被 docker-compose.yml 默认加载；不传 -f 时对任何服务都没有影响。
#   2. 本批切默认之后，docker-compose.yml 的 api-go 块已经把 137 个开关全部
#      改成 ${API_GO_X:-go}（fallback 为 ${API_GO_LEGACY_FALLBACK_MODE:-reject}），
#      因此「让 env 文件的值真正生效」不再需要重新声明 59 个硬编码开关——
#      那段历史用途（49 个写死 + 10 个未注入）已经消失。
#   3. 保留用途：
#      (a) 显式注入 api-go-cutover.env.sample（全 Go 终态清单）用于审阅/演练；
#      (b) 作为「从回退恢复全 Go」时的编排侧输入。
#      回退方向请用 infra/docker/legacy-rollback.override.yml +
#      infra/docker/legacy-rollback.env.sample。
#   4. 使用方式（仓库根目录执行；两个 --env-file 缺一不可，因为 --env-file
#      会替代默认 .env；多 --env-file 需要 compose v2.24+，本批未执行验证）：
#
#        docker compose \
#          --env-file infra/docker/.env \
#          --env-file infra/docker/api-go-cutover.env.sample \
#          -f infra/docker/docker-compose.yml \
#          -f infra/docker/docker-compose.api-go-cutover.sample.yml \
#          up -d
#
#      不再需要 --profile：api-go 已是默认启动的服务。
#   5. 与基础设施默认的差异仅在于 env 文件；服务集合、依赖图、Web 地址仍由
#      基础 compose 决定（Web → api-go、两个 Go Socket.IO 路径）。
#   6. 本 override + env 样例只表达配置；是否部署、是否承接真实流量不在本批
#      范围，也未验证。
#
# 开关数量核对（本批修改后的 infra/docker/docker-compose.yml，api-go environment）：
#   - API_GO_* 共 137 个，全部以 ${VAR} 插值，无一硬编码；
#   - 其中 136 个默认 go，1 个（LEGACY_FALLBACK_MODE）默认 reject；
#   - 因此本文件不再需要逐个重新声明开关。
#
# 凭据类：仍由 .env 提供（JWT_SECRET / MONGO_URI / REDIS_* /
# SYSTEM_SETTINGS_ENCRYPTION_KEY 等）。下面显式重列一次，让本 override
# 自包含、便于审阅，并保证 env_file 与 --env-file 的值一致。
# ============================================================================

services:
  api-go:
    env_file:
      - ./api-go-cutover.env.sample
    environment:
      # --- 凭据/资源（值仍由 .env / env 样例提供；占位符必须替换）---
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      SYSTEM_SETTINGS_ENCRYPTION_KEY: ${SYSTEM_SETTINGS_ENCRYPTION_KEY:-}
# 说明：DATABASE_URL 由 compose 用 MYSQL_* 派生，优先级高于 env_file，
# 因此不需要在这里重复声明；要改 MySQL 请改 MYSQL_*。
