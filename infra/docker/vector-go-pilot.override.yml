# 本文件在切默认之后只保留历史用途说明。
#
# 切默认之前它补两个缺口：vector（NestJS）未传 QDRANT_API_KEY，vector-go 在
# NODE_ENV=production 下把 VECTOR_INTERNAL_TOKEN 默认成 dev-token 导致 fail-closed。
# 现在基础 compose 已经处理这两点：
#   - vector-go 是默认服务，VECTOR_INTERNAL_TOKEN 与 QDRANT_API_KEY 都是必填
#     （缺失时 compose 直接报错，不再静默用 dev-token）；
#   - Node vector 只在 --profile legacy-node 下启动，仍保留自己的取值方式。
#
# 因此默认部署不再需要 --profile go-pilot（该 profile 已随切默认移除）。
# 若要显式为 Node vector 补 QDRANT_API_KEY / token，可继续叠加本文件，但
# 只对 legacy-node profile 生效：
#
#   docker compose \
#     -f infra/docker/docker-compose.yml \
#     -f infra/docker/vector-go-pilot.override.yml \
#     --profile legacy-node up -d qdrant vector
services:
  vector:
    environment:
      NODE_ENV: production
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      VECTOR_INTERNAL_TOKEN: ${VECTOR_INTERNAL_TOKEN:?VECTOR_INTERNAL_TOKEN is required}
  vector-go:
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      VECTOR_INTERNAL_TOKEN: ${VECTOR_INTERNAL_TOKEN:?VECTOR_INTERNAL_TOKEN is required}
