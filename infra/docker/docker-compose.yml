      # 已认证 MFA 管理与组织 OIDC 配置 7 条精确 HTTP：
      # GET /api/auth/mfa、POST /api/auth/mfa/enroll|verify-enroll|disable|
      # recovery/rotate、GET/PUT /api/auth/admin/oidc-config。
      # 默认 go。改成 go 才由 Go 独立验签（人类 JWT + Redis
      # blacklist + MySQL membership/权限重推导；机器令牌沿用 mtk_ 查库路径）
      # 并读写 MySQL UserTotpFactor/UserRecoveryCode/OrgOidcConfig。四条 MFA
      # 写要求真实人类 User（机器身份 403）；OIDC 是租户设置，按
      # settings.manage 判定，不套全局平台管理员门禁。go 要求 JWT_SECRET、
      # DATABASE_URL、REDIS_HOST，不要求 Mongo，不访问身份提供方、不签发
      # token、不启动 worker。login/refresh/logout/me/change-password/
      # machine-tokens、公开 MFA 登录与强制 enrollment 挑战，以及 OIDC
      # start/callback/handoff 仍回 NestJS。回滚只把该变量改回 legacy。

      # 登录、会话签发与账户验证 11 条精确 HTTP POST（/api/auth/login、
      # refresh、send-login-code、login-with-code、mfa/verify-login、
      # mfa/enrollment/start|complete、password/forgot|reset、
      # send-verification、verify-email）。默认 go，只接受空串/legacy/go，
      # 非法值启动失败。go 要求 JWT_SECRET、DATABASE_URL、REDIS_HOST 以及
      # SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASS（四条路由同步真实发信），
      # 不需要 Mongo；与 account-security / auth-factors 开关相互独立、路径
      # 不重叠。生产 Web 入口与 canary 保持现状。回滚只把该变量改回 legacy。

      # 注册申请、审批、邀请与入组 14 条 HTTP（/api/auth/admin/invites、
      # /admin/registration-applications、/register/applications、
      # /register/join-applications、/invitations/:token）。默认 go，
      # 只接受空串/legacy/go，非法值启动失败。go 要求 JWT_SECRET、
      # DATABASE_URL、REDIS_HOST 以及 SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASS
      # （邀请、重发与驳回路径同步真实发信），不需要 Mongo；与登录 /
      # account-security / auth-factors 开关相互独立、路径不重叠。生产 Web
      # 入口与 canary 保持现状。回滚只把该变量改回 legacy。

      # 组织 OIDC 登录 3 条公开 HTTP（GET /api/auth/sso/oidc/start、
      # GET /api/auth/oidc/callback、POST /api/auth/sso/handoff/exchange）。
      # 默认 go，只接受空串/legacy/go，非法值启动失败。go 要求
      # JWT_SECRET、DATABASE_URL、REDIS_HOST；API_BASE_URL 只在请求时用于
      # IdP redirect_uri（缺失返回源 400，不阻塞启动），NEXTAUTH_URL 缺省
      # http://localhost:3000。复用既有可信登录/MFA/会话签发与 AuthSecurity
      # secret 策略，state/discovery/JWKS、AuthChallenge 与 RefreshToken 与
      # NestJS 共用；不要求 MONGO_URI/SMTP_*，不访问新增外部服务。
      # OIDC 配置 GET/PUT 与其余 /api/auth/* 仍回 NestJS。回滚只把该变量
      # 改回 legacy。

      # 模型接入设置 10 条 HTTP（/api/system-settings/model-service、
      # /api/system-settings/openai-keys(+ /key/:fingerprint)、
      # /api/internal/litellm/openai-keys(+ /applied)）。默认 go
      # legacy。改成 go 才由 Go 验签并读写 MySQL 的 SystemSetting
      # （model_service、openai_keys、litellm_openai_keys_applied）与 Redis
      # 缓存；六条管理写额外要求平台管理员；两条内部接口只用
      # LITELLM_CONFIG_INTERNAL_TOKEN。go 要求 JWT_SECRET、DATABASE_URL、
      # REDIS_HOST（不要求 Mongo，不启动 worker，不调用模型服务）。
      # /api/internal/litellm/proxy-load-balancing 与
      # /api/system-settings/llm-gateways 等仍回 NestJS。
      # 回滚只把该变量改回 legacy。
      # LiteLLM 负载均衡配置管理与下发 4 条 HTTP
      # （/api/system-settings/llm-gateways/proxy-load-balancing 的
      # GET/PUT/DELETE、/api/internal/litellm/proxy-load-balancing 的 GET）。
      # 默认 go。改成 go 才由 Go 验签并读写 MySQL 的
      # SystemSetting（litellm_proxy_load_balancing）与 Redis 缓存，并复用
      # 真实 OpenAI 密钥读取；两条管理写额外要求平台管理员，内部快照只用
      # LITELLM_CONFIG_INTERNAL_TOKEN。go 要求 JWT_SECRET、DATABASE_URL、
      # REDIS_HOST（不要求 Mongo，不启动 worker，不调用模型上游，实际请求
      # 路由仍由 LiteLLM 执行）。与 API_GO_MODEL_ACCESS_SETTINGS_MODE 相互
      # 独立。未列路径（Profile/治理路由等）仍回 NestJS。回滚只把该变量改回
      # legacy。
      # 知识图谱冲击传导与实体共现/价格相关图 4 个 GraphQL 只读 root
      # （getExecutiveChangeImpact / getCommodityMoveImpact /
      # getPolicyEventImpact / getEntityImpactGraph）。默认 go
      # legacy。只有 API_GO_GRAPHQL_READ_MODE=go 且本变量=go 才登记；权限
      # 是重推导的 dashboards.read，mtk_ 机器令牌沿用读执行器规则拒绝。
      # 回滚只把该变量改回 legacy。不改表，不改 Web 入口。
      # 身份/组织/RBAC/仪表盘/队列统计/情感时间序列/已处理条目详情 12 个
      # GraphQL 只读 root。默认 go。只有
      # API_GO_GRAPHQL_READ_MODE=go 且本变量=go 才登记；本变量为 legacy 时
      # 含这 12 个 root 的文档整包回 NestJS。回滚只把该变量改回 legacy。
      # 设置中心/来源策略/同步状态/证据复核队列/采集任务 20 个 GraphQL
      # 只读 root。默认 go。只有 API_GO_GRAPHQL_READ_MODE=go
      # 且本变量=go 才登记；本变量为 legacy 时含这 20 个 root 的文档整包回
      # NestJS。回滚只把该变量改回 legacy。
      # 网页元数据预览的 GraphQL root（Query crawlMetadata）。默认 go。只有 API_GO_GRAPHQL_READ_MODE=go 且本变量=go 才登记；
      # 本变量=go 而父读开关非 go 时启动失败。与 API_GO_CRAWL_METADATA_MODE
      # 互不依赖并共享同一个 metadata 服务实例，也不加入 GraphQL 全量响应
      # 缓存。回滚只把该变量改回 legacy。
      # newsEventBrief 单 root 的独立子开关。默认 go，只接受
      # 空串/legacy/go，非法值启动失败。只有 API_GO_GRAPHQL_READ_MODE=go 且
      # API_GO_GRAPHQL_NEWS_EVENTS_MODE=go 时才允许为 go。为 go 时该 root 由
      # Go 完成选源→调用模型→校验清洗→写回 metadata.briefV1 全链路；为
      # legacy 时只登记其余五个新闻事件 root，含 newsEventBrief 的文档整包回
      # NestJS。回滚只把该变量改回 legacy，旧 briefV1 缓存保持兼容。
      # 账户资料、会话退出与机器令牌管理的 8 条 HTTP（GET /api/auth/me、
      # PATCH /api/auth/profile、POST /api/auth/change-password、
      # POST /api/auth/logout、GET/POST /api/auth/machine-tokens、
      # DELETE /api/auth/machine-tokens/:tokenId、
      # POST /api/auth/machine-tokens/:tokenId/rotate）。默认 go，只接受
      # 空串/legacy/go，非法值启动失败。go 需要 JWT_SECRET、DATABASE_URL、
      # REDIS_HOST，不需要 Mongo。登录、refresh、邮箱验证码、密码找回、
      # MFA、OIDC、邀请与注册审核仍回 NestJS；头像上传签名与个人数据导出
      # 由各自的开关控制（见下）。生产 Web 入口仍指向 NestJS，canary 与
      # shadow 关闭。回滚只把该变量改回 legacy。
      # 头像上传签名（POST /api/auth/avatar/presigned-url）。默认 go，
      # 只接受空串/legacy/go，非法值启动失败。go 需要 JWT_SECRET、
      # DATABASE_URL、REDIS_HOST，不需要 Mongo；签名在本地完成，不访问 S3。
      # 回滚只把该变量改回 legacy。
      # 个人数据导出（GET /api/auth/data-export）。默认 go，只接受空串/
      # legacy/go，非法值启动失败。go 需要 JWT_SECRET、DATABASE_URL、
      # REDIS_HOST 与 MONGO_URI（assistantruns 在 Mongo）。文件名、响应头、
      # 限流（3 次/小时）与审计副作用与 Nest 一致；回滚只把该变量改回
      # legacy。
      # 条目写入（POST /api/items 与五个 item/crawl mutation）和 raw_item 定时
      # 补偿是独立开关。默认 go；仅接受空串/legacy/go，非法值启动失败。
      # 写模式需要 JWT_SECRET、DATABASE_URL、REDIS_HOST、MONGO_URI；后台补偿
      # 单开只需要 DATABASE_URL、REDIS_HOST、MONGO_URI。SCHEDULE_ENABLED=false
      # 只停定时重放，不停请求内即时投递。回滚分别改回 legacy。
      # 条目列表 GraphQL root 独立子开关：默认 go；go 要求读开关与条目阅读
      # 开关均为 go。回滚只把该变量改回 legacy，其余已迁读与 REST 不受影响。
      ITEMS_READ_MODEL_ENABLED: "false"
      ITEMS_VECTOR_HARD_FAIL_ENABLED: "false"
      # 组织、角色与成员管理 8 个 GraphQL mutation（createOrg / updateOrg /
      # setOrgActive / createRole / updateRole / assignRole /
      # updateMembershipRoles / setUserActive）。默认 go，与
      # API_GO_GRAPHQL_READ_MODE 解耦：只开本变量时 query 仍走 NestJS，只有这
      # 8 个 mutation 由 Go 执行。只需要 JWT/MySQL/Redis，不要求 Mongo，不启动
      # worker。回滚只把该变量改回 legacy。
      # 工作台交互写入的 8 个 GraphQL mutation（markNotificationRead /
      # markAllNotificationsRead / upsertDashboard / deleteDashboard /
      # createAlertChannel / updateAlertChannel / deleteAlertChannel /
      # updateAlertEventStatus）。默认 go，与
      # API_GO_GRAPHQL_READ_MODE 解耦：只开本变量时 query 仍走 NestJS，只有这
      # 8 个 mutation 由 Go 执行。只需要 JWT/MySQL/Redis，不要求 Mongo，不启动
      # worker，也不发送邮件或 webhook。回滚只把该变量改回 legacy。
      # 告警规则配置与手动触发 4 个 GraphQL root（alertRules query 与
      # upsertAlertRule / deleteAlertRule / triggerAlertRule）。默认 go，与 API_GO_GRAPHQL_READ_MODE 刻意解耦：alertRules 会补建
      # 17 条默认规则、更新定时计划并排入一次评估，所以读与三个写作为一个整体。
      # 只需要 JWT/MySQL/Redis，不要求 Mongo，不启动 worker，也不发邮件或
      # webhook；AlertsProcessor 仍是 alerts 队列唯一消费者。回滚只把该变量
      # 改回 legacy。
      # 设置中心 13 个 GraphQL mutation。默认 go，与全部读开关
      # 解耦：只开本变量时只登记这 13 个 mutation，20 个设置读 query 仍走
      # NestJS。只需要 JWT/MySQL/Redis，不要求 Mongo，不启动 worker，不回调
      # NestJS。回滚只把该变量改回 legacy。
      # 来源策略 4 个 GraphQL mutation（update/preset/rollback/reset）。默认 go；
      # 只开本变量时仅登记这 4 个 mutation 与策略嵌套模型，
      # Query 仍走 NestJS。需要 JWT/MySQL/Redis，不要求 Mongo，不启动 worker。
      # 回滚只把变量改回 legacy，已存 v2/legacy/preset 与共享缓存继续可读。
      # 知识图谱证据人工复核的单个 mutation（reviewKnowledgeGraphEvidence）。
      # 默认 go，与全部读开关及其他写开关解耦：只开本变量时
      # 图谱 11 个只读 root 仍走 NestJS，只有该 mutation 由 Go 执行。只需要
      # JWT/MySQL/Redis，不要求 Mongo，不启动 worker，不调用模型/向量/外部
      # HTTP。回滚只把该变量改回 legacy。
      # RSS 阅读批量翻译单个 GraphQL mutation（translateRssItems，根权限
      # items.read）。默认 go，与全部读开关、条目阅读开关及
      # 其他写开关解耦：只开本变量时只登记这一个 mutation 与两个返回模型，旧
      # items query 仍走 NestJS；含未接管 root/字段的文档在任何副作用前整份
      # operation 回 NestJS。go 要求 JWT/MySQL/Redis/Mongo；provider URL、密钥、
      # profile 与加密 key 保持请求时语义，不启动实网探测。翻译只写两层缓存、
      # 每日指标与模型请求日志，不覆盖原文/read-model/ES，不入队、不启动
      # worker/Cron、不发通知。回滚只把该变量改回 legacy。
      # 基础设施设置的 env 缺省与 api 服务同源（同一份 .env，同样的默认
      # 值）。S3_* 与 VECTOR_* 都不进入日志；不在这里新增第二套网关配置。
      NODE_ENV: production
      VECTOR_SERVICE_ENABLED: ${VECTOR_SERVICE_ENABLED:-false}
      VECTOR_SERVICE_FALLBACK_TO_MONGO: ${VECTOR_SERVICE_FALLBACK_TO_MONGO:-true}
      VECTOR_SERVICE_BASE_URL: ${VECTOR_SERVICE_BASE_URL:-}
      VECTOR_INTERNAL_TOKEN: ${VECTOR_INTERNAL_TOKEN:-}
      VECTOR_SERVICE_TIMEOUT_MS: ${VECTOR_SERVICE_TIMEOUT_MS:-5000}
      VECTOR_SERVICE_MAX_RETRIES: ${VECTOR_SERVICE_MAX_RETRIES:-2}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PRESIGNED_URL_TTL_SECONDS: ${S3_PRESIGNED_URL_TTL_SECONDS:-300}
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      # 与 api 服务相同的模型网关缺省和设置解密密钥。profile 在 MySQL。
      # 密钥不进日志。空值表示沿用进程内缺省，不单独发明一套网关配置。
      SYSTEM_SETTINGS_ENCRYPTION_KEY: ${SYSTEM_SETTINGS_ENCRYPTION_KEY:-}
      # 与 api 服务完全相同的模型服务缺省值（默认值必须一致，否则 Go 的 env
      # 回退与 Nest 不同）。MODEL_SERVICE_ENABLED 为 false 的部署形态照此覆盖。
      MODEL_SERVICE_ENABLED: ${MODEL_SERVICE_ENABLED:-true}
      MODEL_SERVICE_BASE_URL: ${MODEL_SERVICE_BASE_URL:-http://model-service:8090}
      MODEL_SERVICE_INTERNAL_TOKEN: ${MODEL_SERVICE_INTERNAL_TOKEN:-dev-model-token}
      MODEL_SERVICE_TIMEOUT_MS: ${MODEL_SERVICE_TIMEOUT_MS:-15000}
      MODEL_SERVICE_MAX_RETRIES: ${MODEL_SERVICE_MAX_RETRIES:-2}
      # 两条内部接口（取钥/上报已应用指纹）的 bearer token，与 api 服务同一份
      # 配置。缺失是接口契约（403），不是启动条件；值不进日志。
      LITELLM_CONFIG_INTERNAL_TOKEN: ${LITELLM_CONFIG_INTERNAL_TOKEN:-}
      # NODE_ENV=production 已在上方（基础设施设置批次）声明一次，此处不再重复；
      # 本批的生产加密策略判断复用同一项。
      LITELLM_API_URL: ${LITELLM_API_URL:-}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-http://localhost:4001}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_TIMEOUT_MS: ${LITELLM_TIMEOUT_MS:-60000}
      LITELLM_RETRY_ATTEMPTS: ${LITELLM_RETRY_ATTEMPTS:-3}
      # 本批 profile 默认值还需要这几个 LITELLM_* 与 NODE_ENV，与 api
      # 服务同源同名；上面已有的键不重复声明。LITELLM_MAX_TOKENS 在 Nest
      # env schema 里有默认值，优先于 LITELLM_MAX_OUTPUT_TOKENS（Go 侧同序）。
      NODE_ENV: ${NODE_ENV:-production}
      LITELLM_MODEL: ${LITELLM_MODEL:-openai/gpt-4o-mini}
      LITELLM_TEMPERATURE: ${LITELLM_TEMPERATURE:-0.2}
      LITELLM_TOP_P: ${LITELLM_TOP_P:-0.9}
      LITELLM_MAX_TOKENS: ${LITELLM_MAX_TOKENS:-2048}
      LITELLM_FALLBACK_MODELS: ${LITELLM_FALLBACK_MODELS:-}
      # Go-批3A 兼容变量：readMode 未设时仍控制 onboarding（默认 go，
      # 与 config.go 的默认一致；readMode=go 已覆盖全部六端点）。
      # 与 api 服务同一 JWT 配置（issuer/audience 默认值与 NestJS env
      # schema 一致）。secret 只经环境注入，不进日志/healthz/错误正文。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-modular-monolith}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-modular-monolith-clients}
      # 与 api 服务同一 Redis（blacklist 共享，不建第二套撤销名单）。
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      # 与 NestJS 同一份来源白名单。浏览器跨源访问 :4020 上已接管的
      # user-settings GET/PUT 时，Go 用它回 CORS 头；空名单不放行任何 Origin。
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # 态势监控 GDELT 外部快照定时重建的执行权（与 api 服务同一变量）。
      # 默认 go=不启动 Go 定时任务；go=Go 每 15 分钟重建，与 NestJS 共用
      # lock:cron:situation-monitor:external-snapshot:gdelt。要求 DATABASE_URL、
      # REDIS_HOST，不要求 JWT。回滚只把该变量（以及 api 服务的同名变量）改回
      # legacy，写入的历史与两层缓存格式相同，NestJS 可直接读取。
      # 新闻事件时间线（每 10 分钟）与情绪快照（每小时）重建的执行权（与 api
      # 服务同一组变量）。默认 go=不启动 Go 定时任务；go=Go 定时重建，与
      # NestJS 共用 cron:news-events-timeline:tick-gate /
      # lock:cron:news-events-timeline:org:<orgId> 与
      # cron:sentiment-snapshot:tick-gate / lock:cron:sentiment-snapshot:org:<orgId>。
      # 要求 DATABASE_URL、REDIS_HOST、MONGO_URI，不要求 JWT。回滚只把两个变量
      # （以及 api 服务的同名变量）改回 legacy，NestJS 下一轮会整体覆盖。
      # 实时信号采集 Cron（与 api 服务同一变量）。默认 go=不启动 Go 采集；
      # go=Go 每分钟采集 8 个数据源，与 NestJS 共用 tick gate 与组织锁，要求
      # DATABASE_URL、REDIS_HOST、MONGO_URI，不要求 JWT。回滚只把两侧变量改回
      # legacy；Redis/Mongo 文档与额度账本格式相同，NestJS 可直接沿用。
      # 强制刷新入口 POST /api/system-settings/situation-monitor/external-snapshot/
      # refresh 的执行权（仅 Go 读取；Nest 控制器始终保留该路由）。默认 go=
      # 继续由 NestJS 处理；go=Go 处理，要求 JWT、MySQL、Redis，与定时任务共用
      # 同一把锁。与上面的定时开关相互独立。
      # 以下各项此前完全未注入，依赖 config.go 的默认值。默认切 go 后必须显式
      # 出现，否则同一份 compose 在 .env 覆盖时会出现「Go 侧 go、Nest 侧 legacy」
      # 的分叉。全部可插值，回退时逐个改 legacy。API_GO_HEALTHZ_LIVE_MODE 已在
      # 上方 C-1 组声明，这里不再重复。
      # NestJS 的 GDELT 总开关（默认 true；false 时定时重建与强制刷新都直接返回）。
      # api-go 未设置时按 true 解析，与 Nest env schema 默认一致。
      SITUATION_MONITOR_GDELT_ENABLED: ${SITUATION_MONITOR_GDELT_ENABLED:-true}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${API_GO_HOST_PORT:-4020}:4020"
    logging: *json-file-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongo-indexes:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      # distroless 无 curl：healthcheck 子命令自探活（不依赖宿主侧探测）。
      test: ["CMD", "/api-go", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s

  # migrate: one-shot Prisma migration, extracted from the NestJS api command
  # line. The NestJS service used to run `pnpm --filter db run migrate` before
  # starting the server; api-go is a Go binary and cannot run it, so the step
  # becomes its own service that api-go waits on. A failure blocks startup
  # instead of letting the gateway serve an unmigrated schema.
  #
  # This is Node tooling on purpose: the repository keeps Prisma as the schema
  # owner in this cutover, and the Go services never write DDL. Not the whole
  # toolchain is Go yet.
  migrate:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: "no"
    working_dir: /workspace
    command: >
      sh -ec "
      echo '[migrate] prisma migrate (deploy)...';
      pnpm --filter db run migrate
      "
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      CI: "true"
      HUSKY: "0"
    depends_on:
      mysql:
        condition: service_healthy
    logging: *json-file-logging

  # mongo-indexes: one-shot Mongo index build. Runs the shared @modular/mongo
  # index tool (no NestJS application module); the Go services assume the
  # indexes exist.
  mongo-indexes:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: "no"
    working_dir: /workspace
    command: >
      sh -ec "
      echo '[mongo-indexes] ensuring mongo indexes...';
      pnpm --filter @modular/mongo run mongo:indexes
      "
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      CI: "true"
      HUSKY: "0"
    depends_on:
      mongo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *json-file-logging

  web:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        # Server-side runtime base. The gateway is api-go.
        API_BASE_URL: ${API_BASE_URL:-http://api-go:4020}
        # Browser base is inlined at build time, so changing it needs a rebuild.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4020/api}
        NEXT_PUBLIC_GRAPHQL_APQ_ENABLED: ${NEXT_PUBLIC_GRAPHQL_APQ_ENABLED:-true}
        # Dedicated Go Socket.IO transports; these paths must match the paths the
        # Go process serves.
        NEXT_PUBLIC_NOTIFICATIONS_SOCKET_PATH: ${NEXT_PUBLIC_NOTIFICATIONS_SOCKET_PATH:-/socket.io-notifications}
        NEXT_PUBLIC_REALTIME_SOCKET_PATH: ${NEXT_PUBLIC_REALTIME_SOCKET_PATH:-/socket.io-realtime}
    restart: unless-stopped
    working_dir: /workspace
    # Startup gate uses the resolved API base (API_BASE_URL). With the Go
    # default that is http://api-go:4020 and the probe is answered by api-go's
    # own liveness rule, not proxied to NestJS. Bases that already end in /api or
    # a trailing slash are handled.
    command: >
      sh -ec "
      base=$${API_BASE_URL%/};
      base=$${base%/api};
      url=$${base}/api/healthz/live;
      echo "[web] waiting for api at $${url}...";
      i=0;
      while [ $$i -lt 150 ]; do
        if curl -fsS $${url} >/dev/null; then
          echo '[web] api ready';
          break;
        fi;
        i=$$((i + 1));
        sleep 2;
      done;
      if ! curl -fsS $${url} >/dev/null; then
        echo '[web] api not ready after 300s';
        exit 1;
      fi;
      echo '[web] starting runtime server...';
      exec pnpm --filter @modular/web exec next start --hostname 0.0.0.0 --port 3000
      "
    env_file:
      - ./.env
    environment:
      PORT: 3000
      NODE_ENV: production
      NODE_OPTIONS: "${WEB_NODE_OPTIONS:---max-old-space-size=8192}"
      CI: "true"
      HUSKY: "0"
      # Server-side runtime API base, read by apps/web/lib/env.ts at runtime.
      # Default http://api-go:4020.
      # The browser-side NEXT_PUBLIC_API_BASE_URL is inlined at build time, so
      # switching browser traffic requires rebuilding the web image with the
      # matching build arg.
      API_BASE_URL: ${API_BASE_URL:-http://api-go:4020}
      COREPACK_NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      npm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      pnpm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:3000:3000"
    logging: *json-file-logging
    depends_on:
      api-go:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: ${WEB_HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 20
      start_period: 300s

volumes:
  mysql-data:
  mongo-data:
  redis-data:
  minio-data:
  qdrant-data:
  elasticsearch-data:
  litellm-postgres-data:
