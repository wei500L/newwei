x-json-file-logging: &json-file-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-3}

x-app-hardening: &app-hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "db.adminCommand(''ping'').ok" | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/redis.Dockerfile
      args:
        REDIS_IMAGE: ${REDIS_IMAGE:-redis:7.2}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_AOF_CHECK_ON_START: ${REDIS_AOF_CHECK_ON_START:-true}
      REDIS_AOF_AUTO_FIX: ${REDIS_AOF_AUTO_FIX:-false}
      REDIS_AOF_PREFLIGHT_AUTO_REPAIR: ${REDIS_AOF_PREFLIGHT_AUTO_REPAIR:-true}
      REDIS_AOF_PREFLIGHT_LOG_TAIL: ${REDIS_AOF_PREFLIGHT_LOG_TAIL:-40}
      REDIS_AOF_BACKUP_KEEP: ${REDIS_AOF_BACKUP_KEEP:-5}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    logging: *json-file-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LITELLM_POSTGRES_DB:-litellm}
      POSTGRES_USER: ${LITELLM_POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:?LITELLM_POSTGRES_PASSWORD is required}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:5432:5432"
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data
    logging: *json-file-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    logging: *json-file-logging

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS -u "elastic:$$ELASTIC_PASSWORD" http://localhost:9200 >/dev/null',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:9000:9000"
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:9001:9001"
    volumes:
      - minio-data:/data
    logging: *json-file-logging

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727}
    restart: "no"
    depends_on:
      - minio
    entrypoint:
      - sh
      - -ec
      - |
        until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1; do
          echo '[minio-init] waiting for minio...';
          sleep 1;
        done;
        mc mb --ignore-existing local/$$S3_BUCKET;
        mc anonymous set download local/$$S3_BUCKET;
        echo '[minio-init] bucket initialized';
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-modular-avatars}
    logging: *json-file-logging

  akshare:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/akshare/Dockerfile
      args:
        PYTHON_IMAGE: ${AKSHARE_PYTHON_IMAGE:-python:3.11-slim}
        AKSHARE_VERSION: ${AKSHARE_VERSION:-1.18.39}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    environment:
      AKSHARE_ADMIN_TOKEN: ${AKSHARE_ADMIN_TOKEN:-}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${AKSHARE_PORT:-8081}:8081"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8081/healthz'', timeout=2).read()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  model-service:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/model-service/Dockerfile
      args:
        PYTHON_IMAGE: ${MODEL_SERVICE_PYTHON_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    environment:
      MODEL_SERVICE_INTERNAL_TOKEN: ${MODEL_SERVICE_INTERNAL_TOKEN:-dev-model-token}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${MODEL_SERVICE_PORT:-8090}:8090"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8090/healthz'', timeout=2).read()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  litellm:
    <<: *app-hardening
    # Pin the currently verified LiteLLM image digest to avoid drifting to bad upstream releases.
    build:
      context: ../..
      dockerfile: infra/docker/litellm.Dockerfile
      args:
        LITELLM_IMAGE: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm@sha256:067aee932b8770ed42955ee802a04abdcd369d0995b5e696bb07d6520a231b1c}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      litellm-postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        if [ -z "$${LITELLM_MASTER_KEY:-}" ]; then
          echo "[litellm] LITELLM_MASTER_KEY is required; refusing to start without proxy auth." >&2
          exit 1
        fi
        python /app/generate-litellm-config.py --input /app/config.base.yaml --output /app/config.yaml
        exec litellm --config /app/config.yaml --detailed_debug
    environment:
      DATABASE_URL: ${LITELLM_DATABASE_URL:?LITELLM_DATABASE_URL is required}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_CONFIG_API_BASE: ${LITELLM_CONFIG_API_BASE:-http://api:4000/api}
      LITELLM_CONFIG_INTERNAL_TOKEN: ${LITELLM_CONFIG_INTERNAL_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_API_KEYS: ${ANTHROPIC_API_KEYS:-}
      LITELLM_ROUTING_STRATEGY: ${LITELLM_ROUTING_STRATEGY:-simple-shuffle}
      LITELLM_REDIS_HOST: ${LITELLM_REDIS_HOST:-redis}
      LITELLM_REDIS_PORT: ${LITELLM_REDIS_PORT:-6379}
      LITELLM_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      LITELLM_DEPLOYMENT_RPM: ${LITELLM_DEPLOYMENT_RPM:-}
      LITELLM_DEPLOYMENT_TPM: ${LITELLM_DEPLOYMENT_TPM:-}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:4001:4000"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'', timeout=2).read()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  crawl4ai:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/crawl4ai.Dockerfile
      args:
        CRAWL4AI_IMAGE: ${CRAWL4AI_IMAGE:-unclecode/crawl4ai:0.9.2@sha256:bd36741e7bdd35ddc1a05d9183e1d6d8cefb61dd640d944a25d026b76e917690}
    restart: unless-stopped
    working_dir: /app
    shm_size: 1g
    tmpfs:
      - /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CRAWL4AI_XVFB_ENABLED: ${CRAWL4AI_XVFB_ENABLED:-true}
      CRAWL4AI_XVFB_DISPLAY_NUM: ${CRAWL4AI_XVFB_DISPLAY_NUM:-99}
      CRAWL4AI_XVFB_SCREEN: ${CRAWL4AI_XVFB_SCREEN:-1920x1080x24}
      CRAWL4AI_SSRF_PROXY_PORT: ${CRAWL4AI_SSRF_PROXY_PORT:-18080}
      CRAWL4AI_HTTP_PROXY: ${CRAWL4AI_HTTP_PROXY:-}
      CRAWL4AI_HTTPS_PROXY: ${CRAWL4AI_HTTPS_PROXY:-}
      CRAWL4AI_NO_PROXY: ${CRAWL4AI_NO_PROXY:-localhost,127.0.0.1,crawl4ai,api,web,db,redis,host.docker.internal}
      HTTP_PROXY: ${CRAWL4AI_HTTP_PROXY:-}
      HTTPS_PROXY: ${CRAWL4AI_HTTPS_PROXY:-}
      NO_PROXY: ${CRAWL4AI_NO_PROXY:-localhost,127.0.0.1,crawl4ai,api,web,db,redis,host.docker.internal}
      http_proxy: ${CRAWL4AI_HTTP_PROXY:-}
      https_proxy: ${CRAWL4AI_HTTPS_PROXY:-}
      no_proxy: ${CRAWL4AI_NO_PROXY:-localhost,127.0.0.1,crawl4ai,api,web,db,redis,host.docker.internal}
    command:
      - sh
      - -lc
      - |
        if [ -f /opt/modular/crawl4ai-ssrf-proxy.py ]; then
          python /opt/modular/crawl4ai-ssrf-proxy.py &
        fi

        if [ "$$CRAWL4AI_XVFB_ENABLED" = "true" ]; then
          if command -v Xvfb >/dev/null 2>&1; then
            echo "[crawl4ai] Starting Xvfb on :$$CRAWL4AI_XVFB_DISPLAY_NUM ($$CRAWL4AI_XVFB_SCREEN)"
            mkdir -p /tmp/.X11-unix
            rm -f "/tmp/.X$${CRAWL4AI_XVFB_DISPLAY_NUM}-lock" "/tmp/.X11-unix/X$${CRAWL4AI_XVFB_DISPLAY_NUM}" || true
            Xvfb ":$$CRAWL4AI_XVFB_DISPLAY_NUM" -screen 0 "$$CRAWL4AI_XVFB_SCREEN" -nolisten tcp -ac +extension RANDR &
            export DISPLAY=":$$CRAWL4AI_XVFB_DISPLAY_NUM"
            i=0
            while [ $$i -lt 50 ]; do
              if [ -e "/tmp/.X11-unix/X$${CRAWL4AI_XVFB_DISPLAY_NUM}" ]; then
                break
              fi
              i=$$((i + 1))
              sleep 0.1
            done
            if [ ! -e "/tmp/.X11-unix/X$${CRAWL4AI_XVFB_DISPLAY_NUM}" ]; then
              echo "[crawl4ai] Xvfb failed to start; continuing without DISPLAY"
              unset DISPLAY
            fi
          else
            echo "[crawl4ai] Xvfb is not installed; continuing without DISPLAY"
            unset DISPLAY
          fi
        fi
        exec supervisord -c supervisord.conf
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:8082:11235"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request\nurls=['http://localhost:11235/dashboard/','http://localhost:11235/playground/']\nfor url in urls:\n  try:\n    urllib.request.urlopen(url, timeout=2).read();\n    sys.exit(0)\n  except Exception:\n    pass\nsys.exit(1)\n\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  ais-relay:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/ais-relay.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3004
      NODE_ENV: production
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${AIS_RELAY_PORT:-3004}:3004"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/healthz/live').then((response) => { process.exit(response.ok ? 0 : 1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 120s

  api:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        API_BASE_URL: ${API_BASE_URL:-http://api:4000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_GRAPHQL_APQ_ENABLED: ${NEXT_PUBLIC_GRAPHQL_APQ_ENABLED:-true}
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -ec "
      echo '[api] prisma migrate (deploy) + generate...';
      pnpm --filter db run migrate;
      echo '[api] ensuring mongo indexes...';
      pnpm --filter @modular/api run mongo:indexes;
      echo '[api] starting runtime server...';
      exec pnpm --filter @modular/api run start
      "
    env_file:
      - ./.env
    environment:
      PORT: 4000
      NODE_ENV: production
      CI: "true"
      HUSKY: "0"
      PRISMA_AUTO_RESOLVE_FAILED_MIGRATIONS: "false"
      AKSHARE_ENABLED: ${AKSHARE_ENABLED:-true}
      AKSHARE_HTTP_BASE_URL: ${AKSHARE_HTTP_BASE_URL:-http://akshare:8081}
      MODEL_SERVICE_ENABLED: ${MODEL_SERVICE_ENABLED:-true}
      MODEL_SERVICE_BASE_URL: ${MODEL_SERVICE_BASE_URL:-http://model-service:8090}
      MODEL_SERVICE_INTERNAL_TOKEN: ${MODEL_SERVICE_INTERNAL_TOKEN:-dev-model-token}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_NODE: ${ELASTICSEARCH_NODE:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}
      COREPACK_NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      npm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      pnpm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${API_HOST_PORT:-4000}:4000"
    logging: *json-file-logging
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ais-relay:
        condition: service_healthy
      akshare:
        condition: service_healthy
      model-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/healthz/live"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

  vector:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        API_BASE_URL: ${API_BASE_URL:-http://api:4000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_GRAPHQL_APQ_ENABLED: ${NEXT_PUBLIC_GRAPHQL_APQ_ENABLED:-true}
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -ec "
      echo '[vector] starting runtime server...';
      exec pnpm --filter @modular/vector run start
      "
    env_file:
      - ./.env
    environment:
      PORT: 4010
      NODE_ENV: production
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      VECTOR_INTERNAL_TOKEN: ${VECTOR_INTERNAL_TOKEN:-dev-token}
      HUSKY: "0"
      COREPACK_NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      npm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      pnpm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:4010:4010"
    logging: *json-file-logging
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4010/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  # vector-go：Go 重写试点（Strangler Fig 迁移序 1）。
  # 独立 go-pilot profile——默认部署不启动该服务，NestJS vector 仍是事实源。
  # 切换：把 api 的 vector 服务配置（VECTOR_SERVICE_BASE_URL / 系统设置）
  # 指向 http://vector-go:4010；回滚：指回 http://vector:4010（NestJS 版）。
  # 健康检查在宿主侧执行（distroless 镜像无 curl）：见 go-pilot 的 CI job。
  vector-go:
    <<: *app-hardening
    profiles: ["go-pilot"]
    build:
      context: ../..
      dockerfile: infra/docker/vector-go.Dockerfile
      args:
        GO_IMAGE: ${VECTOR_GO_IMAGE:-golang:1.27}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4010
      VECTOR_INTERNAL_TOKEN: ${VECTOR_INTERNAL_TOKEN:-dev-token}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      VECTOR_COLLECTION_PREFIX: ${VECTOR_COLLECTION_PREFIX:-processed_item_summary}
      VECTOR_QDRANT_TIMEOUT_MS: ${VECTOR_QDRANT_TIMEOUT_MS:-5000}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:4011:4010"
    logging: *json-file-logging
    depends_on:
      qdrant:
        condition: service_started

  # api-go：主后端 Go 网关试点（Go-批2C：真实入口接线；Go-批3A：
  # onboarding GET 首个业务端点真实接管；Go-批3B：user-settings 六个
  # 只读 GET 统一接管）。独立 api-go-pilot profile——默认部署不启动该
  # 服务，NestJS api 仍是唯一入口（Web → api:4000）。
  #
  # 启用：docker compose --profile api-go-pilot up -d api-go
  #   （或 .env 设 COMPOSE_PROFILES=api-go-pilot 后 up -d）。
  # 切流（pilot 模式）：.env 中 API_BASE_URL=http://api-go:4020（服务端
  #   运行期），浏览器端以构建参数 NEXT_PUBLIC_API_BASE_URL 指向
  #   http://<host>:${API_GO_HOST_PORT:-4020}/api 重建 web 镜像。
  # 回滚（无数据迁移耦合，按序）：
  #   1. API_GO_DASHBOARD_WAR_MAP_MODE=legacy——events 与 news-markers 回到 NestJS；
  #   2. API_GO_DASHBOARD_CHARTS_MODE=legacy——三个图表 GET 回到 NestJS；
  #   3. API_GO_DASHBOARD_STATS_MODE=legacy——GET /api/dashboard/stats 回到 NestJS；
  #   4. API_GO_PUBLIC_PORTAL_MODE=legacy——首页、频道和故事详情回到 NestJS；
  #   5. API_GO_USER_SETTINGS_WRITE_MODE=legacy——六个 PUT 回到 NestJS；
  #   6. API_GO_USER_SETTINGS_READ_MODE=shadow——六个 GET 回到 NestJS
  #      响应 + Go 差分；
  #   7. API_BASE_URL 指回 http://api:4000（web 侧不再经 api-go）；
  #   8. 停止 api-go pilot 服务。
  # Go-批3C：pilot 同时启用读模式 go 与写模式 go。六个 PUT 写入同一
  # UserSetting 表、同一八个 key。登录/refresh/logout/MFA/OIDC/机器令牌
  # 及其余路由仍由 NestJS 承载。CANARY_PERCENT 固定 0。
  # DATABASE_URL 由与 NestJS api 相同的 MYSQL_* 值派生——同一真实
  # MySQL，不复制数据、不引入第二个 NestJS；Redis/JWT 配置与 api 服务
  # 同源（同一 Redis 实例查 blacklist、同一 secret 验签）。
  api-go:
    <<: *app-hardening
    profiles: ["api-go-pilot"]
    build:
      context: ../..
      dockerfile: infra/docker/api-go.Dockerfile
      args:
        GO_IMAGE: ${API_GO_IMAGE:-golang:1.27}
    restart: unless-stopped
    environment:
      PORT: 4020
      LEGACY_API_URL: http://api:4000
      DATABASE_URL: mysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD}@mysql:${MYSQL_PORT:-3306}/${MYSQL_DB}
      # pilot 明确接管六个 user-settings 只读 GET（Go-批3B 统一读模式，
      # 优先级高于 API_GO_ONBOARDING_MODE；默认部署不启动本服务；手工
      # 裸启 api-go 时该变量未设——旧行为不变：onboarding 由
      # API_GO_ONBOARDING_MODE 控制，rss/spacetime shadow，其余 legacy）。
      API_GO_USER_SETTINGS_READ_MODE: go
      # 六个 PUT 写接管（Go-批3C）。必须与读模式同为 go；改回 legacy 即回滚写路径。
      API_GO_USER_SETTINGS_WRITE_MODE: go
      # 公开首页、频道和两个故事详情（Go-批4A/4B）。默认部署不启动本服务；
      # 未设置或 legacy 时这些 GET 仍代理 NestJS。启用 go 前应确认模型网关
      # 配置可用；缓存缺失时的真实模型调用尚未验证。回滚 = 改回 legacy。
      API_GO_PUBLIC_PORTAL_MODE: go
      # GET /api/dashboard/stats（Go-批5A）。只这一条精确 GET。
      # MONGO_URI 与 NestJS 相同（主机名在 compose 网络内可解析）。
      # 改回 legacy 即把该 GET 交回 NestJS。不复制数据。
      API_GO_DASHBOARD_STATS_MODE: go
      # 三个图表 GET（Go-批5B）。只这些精确 GET。不读 Mongo。
      # 改回 legacy 即交回 NestJS。不复制经济数据，不新建抓取任务。
      API_GO_DASHBOARD_CHARTS_MODE: go
      # war-map events 与 news-markers（Go-批5C）。只这两条精确 GET。
      # 改回 legacy 即交回 NestJS。不复制告警或新闻数据。
      API_GO_DASHBOARD_WAR_MAP_MODE: go
      # 个人内容订阅、行为画像、每日摘要（Go-批7）。pilot 默认仍交给 NestJS。
      # 三个变量各自改成 go 才切换对应 HTTP。内部服务不看另外两个开关。
      API_GO_CONTENT_SUBSCRIPTIONS_MODE: legacy
      API_GO_USER_NEWS_BEHAVIOR_MODE: legacy
      API_GO_USER_DIGEST_MODE: legacy
      # 分析工作台保存视图、看板/列/任务、笔记/评论（Go 协作域）。
      # pilot 与样例保持 legacy。三个变量各自改成 go 才切换对应 HTTP。
      # 内部讨论检查、评论计数和删除清理不看另一个开关，也不回调 NestJS。
      # 不接管 POST /api/analysis/exports/*。
      API_GO_ANALYSIS_VIEWS_MODE: legacy
      API_GO_ANALYSIS_BOARDS_MODE: legacy
      API_GO_ANALYSIS_THREADS_MODE: legacy
      # 态势监控自定义监控五条 HTTP。pilot 与样例保持 legacy。
      # 改成 go 才由 Go 验签并写 SituationMonitorMonitor。
      # 回滚只把该变量改回 legacy。insights、refresh 和其他采集接口不在这个开关里。
      API_GO_SITUATION_MONITORS_MODE: legacy
      # 态势监控信号读取与反馈 7 条 HTTP（catalog、feedback、refresh-runs/:id、
      # telegram-feed、oref-alerts、oref-history、live-hls-proxy-config）。
      # pilot 与样例默认 legacy。改成 go 才由 Go 独立验签（JWT + Redis
      # 撤销名单 + MySQL 权限重推导 + mtk_ 机器令牌）并读 Redis 缓存态、
      # 写 Mongo 反馈。insights、POST refresh、monitors** 与
      # realtime-signals/runtime 不在这个开关里。回滚只把该变量改回 legacy。
      API_GO_SITUATION_MONITOR_SIGNALS_MODE: ${API_GO_SITUATION_MONITOR_SIGNALS_MODE:-legacy}
      # 新闻源管理台十五条 HTTP。pilot 与样例保持 legacy。
      # 改成 go 才由 Go 验签并读写 NewsSource。GET :id/preview 仍回 NestJS。
      # 回滚只把该变量改回 legacy。不入队，不启动采集 worker。
      API_GO_NEWS_SOURCES_MODE: legacy
      # 采集策略工作流编辑接口。pilot 与样例保持 legacy。
      # 改成 go 才由 Go 验签并读写 CrawlStrategyWorkflow(-Version)。
      # trial-run、replay、workflow-runs、profiles 列表/创建/预览/回滚、
      # runs、nodes 仍回 NestJS。回滚只把该变量改回 legacy。不入队。
      API_GO_CRAWL_WORKFLOWS_MODE: legacy
      # 采集站点画像编辑接口。pilot 与样例保持 legacy。
      # 改成 go 才由 Go 验签并读写 CrawlSiteProfile(-Version)。
      # runs、nodes、workflows 与 workflow-bridge 仍回 NestJS。
      # 回滚只把该变量改回 legacy。不入队。
      API_GO_CRAWL_PROFILES_MODE: legacy
      # 采集模板编辑接口。pilot 与样例保持 legacy。
      # 改成 go 才由 Go 验签并读写 CrawlTemplate。
      # crawl-tasks、metadata、crawl4ai 队列仍回 NestJS。
      # 回滚只把该变量改回 legacy。不入队。
      API_GO_CRAWL_TEMPLATES_MODE: legacy
      # 采集 Frontier 运行监控与取消的 11 条 HTTP。pilot 与样例保持 legacy。
      # 改成 go 才由 Go 验签并读写 CrawlFrontierRun/Node 与 workflow run。
      # POST /runs、retry、replay、trial-run 仍回 NestJS（入队或调用 crawl4ai）。
      # 回滚只把该变量改回 legacy。不入队，不启动采集 worker。
      API_GO_CRAWL_FRONTIER_RUNS_MODE: ${API_GO_CRAWL_FRONTIER_RUNS_MODE:-legacy}
      # LLM 请求日志的列表、CSV 导出与用量汇总（三条精确 GET）。
      # pilot 与样例保持 legacy。改成 go 才由 Go 验签并只读 Mongo
      # llmrequestlogs；导出仍保留 90 天窗口、50000 行上限、公式注入
      # 防护与导出审计。日志设置接口会改 Mongo TTL 索引，仍回 NestJS。
      # 回滚只把该变量改回 legacy。不调用模型服务。
      API_GO_LLM_LOGS_MODE: legacy

      # 管理端日志与异常读取 7 条 GET。pilot 与样例保持 legacy。
      # 改成 go 才由 Go 验签并读 Mongo 的 tasklogs/exceptionevents 与
      # MySQL 的 AuditLog。admin/quality、observability、metrics 与
      # 异常上报 POST 仍回 NestJS。回滚只把该变量改回 legacy。
      API_GO_ADMIN_LOGS_MODE: legacy
      # 异常上报 2 个 POST（client 与 LiteLLM internal）。pilot 与样例保持
      # legacy。改成 go 才由 Go 接收并写入既有 exceptionevents 集合；只控制
      # 这 2 个上报入口，读取 GET 仍用 API_GO_ADMIN_LOGS_MODE。client 入口
      # 沿用现有上报限流，internal 入口沿用 LITELLM_CONFIG_INTERNAL_TOKEN
      # （未配置时接口级 403）。回滚只把该变量改回 legacy。
      API_GO_EXCEPTION_INGEST_MODE: legacy
      # 新闻指标关联分析的 3 条 HTTP 与 2 个 GraphQL 只读 query。pilot 与样例
      # 保持 legacy。改成 go 才由 Go 验签并读 MySQL 的 NewsIndicatorAssociation
      # 与 EconomicData(Point/Item)；GraphQL 两个 query 另需
      # API_GO_GRAPHQL_READ_MODE=go。refresh 在按组织会话锁内单事务写入。
      # reflection mutation 与设置读写仍回 NestJS。回滚只把该变量改回 legacy。
      # 不调用 AkShare，不启动调度 worker。
      API_GO_NEWS_INDICATORS_MODE: legacy
      # 管理端质量面板 5 条 GET。pilot 与样例保持 legacy。改成 go 才由
      # Go 验签并读写 MySQL ObservabilitySnapshot（与 Nest 共享 60 秒
      # 快照）与 Mongo 的 processeditems/tasklogs。classification 与
      # pipeline-recovery 仍回 NestJS。回滚只把该变量改回 legacy。
      API_GO_QUALITY_OVERVIEW_MODE: legacy
      # 分类质量工作台 7 条 + RSS 链路诊断 4 条 + RSS 翻译每日指标 1 条（13 条
      # 精确路由规则）。pilot 与样例保持 legacy。改成 go 才由 Go 验签并读写
      # Mongo 的 classification* 集合与 processeditems/tasklogs，RSS 诊断读
      # MySQL 与 ObservabilitySnapshot(scope=rss_diagnostics)。权限统一
      # settings.manage；POST /api/admin/quality/classification/reports 会投递
      # BullMQ 任务，不迁移，继续回落 NestJS。回滚只把该变量改回 legacy。
      API_GO_CLASSIFICATION_RSS_OPS_MODE: legacy
      # NewsNow 本地计算与聚类失败管理的 9 条 HTTP。pilot 与样例保持
      # legacy。改成 go 才由 Go 独立鉴权并读 Redis/Mongo 的
      # rawitems、processeditems 与 newseventclusteringfailures，以及
      # MySQL 的 NewsnowDomesticOpinionIndexSnapshot、ProcessedArticle
      # 与 NewsEvent/NewsEventItem。抓外网源的 source、sources/batch、
      # hottest-analysis、recommended 与投递 BullMQ 的 llm-backfill 仍回
      # NestJS。回滚只把该变量改回 legacy。
      API_GO_NEWSNOW_CLUSTERING_OPS_MODE: legacy
      # 采集只读与媒体/遥测 7 条 HTTP（crawl-tasks 列表/详情、媒体资产
      # 签名下发、crawl4ai quality 两条、search-telemetry 上报/汇总）。
      # pilot 与样例保持 legacy。改成 go 才由 Go 验签并读 MySQL 的
      # CrawlTask/CrawlResult/CrawlMediaAsset 与 Mongo 的
      # crawlresultcontents/tasklogs；媒体资产用 JWT_SECRET 做 HMAC 签名。
      # 写队列与实时抓取接口（POST/DELETE/retry/metadata 与
      # admin/crawl4ai/queue*）仍回 NestJS。回滚只把该变量改回 legacy。
      API_GO_CRAWL_READ_TELEMETRY_MODE: legacy
      # 搜索索引重建 2 条 HTTP（POST /api/admin/search/reindex 与
      # GET /api/admin/search/reindex/:jobId）。样例保持 legacy。只接受
      # 空串/legacy/go，非法值启动失败；改成 go 才由 Go 独立鉴权并写 Redis
      # 的既有 job/list/orgs/lock 结构、分批读 Mongo 的 itemreadmodels 并
      # bulk 写入 Elasticsearch。go 要求 JWT_SECRET、DATABASE_URL、
      # REDIS_HOST、MONGO_URI；Elasticsearch 不是启动条件（未启用时沿用
      # 禁用分支 indexed=0）。遥测仍由 API_GO_CRAWL_READ_TELEMETRY_MODE
      # 控制。回滚只把该变量改回 legacy。
      API_GO_SEARCH_REINDEX_MODE: ${API_GO_SEARCH_REINDEX_MODE:-legacy}
      # 与 api 服务同源的 Elasticsearch 配置（与 Nest env schema 同名同默认
      # 值），只供 reindex 的 ensureIndex 与 bulk 写入使用。
      # ELASTICSEARCH_ENABLED 为 false 或 NODE 为空时不建客户端、不读 Mongo，
      # 任务直接 completed/indexed=0。凭据不进入日志、healthz 或错误正文。
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_NODE: ${ELASTICSEARCH_NODE:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      ELASTICSEARCH_ITEMS_INDEX: ${ELASTICSEARCH_ITEMS_INDEX:-items-v1}
      ELASTICSEARCH_ITEMS_ALIAS: ${ELASTICSEARCH_ITEMS_ALIAS:-items-current}
      ELASTICSEARCH_REQUEST_TIMEOUT_MS: ${ELASTICSEARCH_REQUEST_TIMEOUT_MS:-3000}
      # 运行时与治理设置 18 条 HTTP（/api/system-settings 下的
      # rate-limit-policies、rate-limits、auth-cache、audit-log、
      # multi-tenant-schedulers、news-source-scheduler、
      # newsnow-personalization(+metrics)）。pilot 与样例保持 legacy。
      # 改成 go 才由 Go 验签并读写 MySQL SystemSetting/RateLimitPolicy 与
      # Redis 缓存；go 要求 JWT_SECRET、DATABASE_URL、REDIS_HOST（不要求
      # Mongo，不启动 worker）。/api/system-settings/security 与其余
      # /api/system-settings/* 仍回 NestJS。回滚只把该变量改回 legacy。
      API_GO_RUNTIME_SETTINGS_MODE: legacy
      # 平台治理设置 16 条 HTTP（/api/system-settings 下的 security、
      # assistant-quota、assistant-safety(+metrics)、task-logs、
      # llm-request-logs(+metadata-policy/reset)）。pilot 与样例保持 legacy。
      # 只接受空串/legacy/go，非法值启动失败；改成 go 才由 Go 验签、执行
      # 平台管理员门禁并读写 SystemSetting 与 Redis 缓存，同时按调用者 orgId
      # 查询 Mongo 的 assistantruns/llmrequestlogs 并对账 TTL 索引。go 要求
      # JWT_SECRET、DATABASE_URL、REDIS_HOST、MONGO_URI。/assistant-safety/
      # diagnostics、email、archive-preparation、realtime-signals、
      # situation-monitor、vector-service 与其余 /api/system-settings/*
      # 仍回 NestJS。回滚只把该变量改回 legacy。
      API_GO_PLATFORM_GOVERNANCE_SETTINGS_MODE: ${API_GO_PLATFORM_GOVERNANCE_SETTINGS_MODE:-legacy}
      # 与 api 服务同源的 6 个平台治理缺省值（api 经 env_file 读取，api-go
      # 没有 env_file，所以在此显式透传，取值与 Nest env schema 一致）。
      # 只有上面的开关为 go 时才会被校验与使用；legacy 下取值不影响行为。
      ASSISTANT_GUARDRAILS_ENABLED: ${ASSISTANT_GUARDRAILS_ENABLED:-true}
      ASSISTANT_GUARDRAILS: ${ASSISTANT_GUARDRAILS:-openai-moderation-pre}
      ASSISTANT_ORG_SUBMIT_LIMIT_PER_HOUR: ${ASSISTANT_ORG_SUBMIT_LIMIT_PER_HOUR:-30}
      ASSISTANT_ORG_MAX_IN_FLIGHT: ${ASSISTANT_ORG_MAX_IN_FLIGHT:-2}
      ASSISTANT_ORG_MONTHLY_TOKEN_BUDGET: ${ASSISTANT_ORG_MONTHLY_TOKEN_BUDGET:-2000000}
      TASK_LOG_RETENTION_DAYS: ${TASK_LOG_RETENTION_DAYS:-14}
      # LLM 网关 profile 七条配置/激活 HTTP
      # （GET/POST /api/system-settings/llm-gateways、PUT active /
      # embedding-active / rerank-active、PUT/DELETE :id）。pilot 与样例
      # 保持 legacy。改成 go 才由 Go 验签、平台管理员门禁并读写 MySQL
      # SystemSetting；proxy-governance、proxy-load-balancing、
      # test-config、models-config 与 :id/... 仍回 NestJS。go 要求
      # JWT_SECRET、DATABASE_URL、REDIS_HOST（不要求 Mongo，不调用模型
      # 上游）。回滚只把该变量改回 legacy。
      API_GO_LLM_GATEWAY_PROFILES_MODE: ${API_GO_LLM_GATEWAY_PROFILES_MODE:-legacy}
      # 基础设施连接与采集运行凭据 7 条精确 HTTP：
      # GET/PUT/DELETE /api/system-settings/vector-service、
      # GET/PATCH /api/admin/settings/storage、
      # GET/PUT /api/system-settings/news-source-runtime-secrets。
      # pilot 与样例保持 legacy。改成 go 才由 Go 独立验签并读写 MySQL
      # SystemSetting 与 Redis 配置缓存（vector_service:settings、
      # storage:settings）；四条写另需平台管理员。go 要求 JWT_SECRET、
      # DATABASE_URL、REDIS_HOST，不要求 Mongo，不建 S3/vector 客户端，
      # 不做启动网络探测。diagnostics 与 storage/test 仍回 NestJS。
      # 回滚只把该变量改回 legacy。
      API_GO_INFRASTRUCTURE_SETTINGS_MODE: ${API_GO_INFRASTRUCTURE_SETTINGS_MODE:-legacy}
      # 数据运行设置与归档状态 9 条精确 HTTP：实时信号设置
      # （GET/PUT/DELETE /api/system-settings/realtime-signals）、归档准备设置
      # （GET/PUT/DELETE /api/system-settings/archive-preparation）、归档准备状态
      # （GET /api/admin/archive-preparation/status）、Nominatim 身份设置
      # （GET/PUT /api/system-settings/geo/nominatim）。pilot 与样例保持 legacy。
      # 改成 go 才由 Go 独立验签并读写 MySQL SystemSetting 与 Redis 缓存
      # （realtime-signals:settings、archive_preparation:settings 等）；五条写
      # 另需平台管理员，机器令牌写一律 403。go 要求 JWT_SECRET、DATABASE_URL、
      # REDIS_HOST，不要求 MONGO_URI，不建 OAuth/采集器/地理编码客户端，不做启动
      # 网络探测。ACLED API 固定关闭，本开关不改变该政策。
      # 回滚只把该变量改回 legacy。
      API_GO_DATA_RUNTIME_SETTINGS_MODE: ${API_GO_DATA_RUNTIME_SETTINGS_MODE:-legacy}
      # 实时信号设置的 env 缺省与 api 服务同源（同一份 .env，同样的默认值）。
      # 注意 REALTIME_SIGNALS_ADSB_* 刻意不在此列：apiEnvSchema 已给
      # REALTIME_SIGNALS_OPENSKY_* 设了默认值，ADSB_* 回落分支不可达，这里不
      # "修复"这一旧优先级，也不改变既有 Go 采集器字段的语义。
      REALTIME_SIGNALS_ENABLED: ${REALTIME_SIGNALS_ENABLED:-true}
      REALTIME_SIGNALS_REQUEST_TIMEOUT_MS: ${REALTIME_SIGNALS_REQUEST_TIMEOUT_MS:-12000}
      REALTIME_SIGNALS_MAX_RETRIES: ${REALTIME_SIGNALS_MAX_RETRIES:-2}
      REALTIME_SIGNALS_OPENSKY_ENABLED: ${REALTIME_SIGNALS_OPENSKY_ENABLED:-true}
      REALTIME_SIGNALS_OPENSKY_INTERVAL_SEC: ${REALTIME_SIGNALS_OPENSKY_INTERVAL_SEC:-900}
      REALTIME_SIGNALS_OPENSKY_DAILY_CREDIT_BUDGET: ${REALTIME_SIGNALS_OPENSKY_DAILY_CREDIT_BUDGET:-4000}
      REALTIME_SIGNALS_OPENSKY_DAY_INTERVAL_SEC: ${REALTIME_SIGNALS_OPENSKY_DAY_INTERVAL_SEC:-600}
      REALTIME_SIGNALS_OPENSKY_NIGHT_INTERVAL_SEC: ${REALTIME_SIGNALS_OPENSKY_NIGHT_INTERVAL_SEC:-1800}
      REALTIME_SIGNALS_OPENSKY_DAY_START_HKT: ${REALTIME_SIGNALS_OPENSKY_DAY_START_HKT:-8}
      REALTIME_SIGNALS_OPENSKY_NIGHT_START_HKT: ${REALTIME_SIGNALS_OPENSKY_NIGHT_START_HKT:-22}
      REALTIME_SIGNALS_OPENSKY_WARNING_REMAINING_PCT: ${REALTIME_SIGNALS_OPENSKY_WARNING_REMAINING_PCT:-20}
      REALTIME_SIGNALS_OPENSKY_CRITICAL_REMAINING_PCT: ${REALTIME_SIGNALS_OPENSKY_CRITICAL_REMAINING_PCT:-10}
      REALTIME_SIGNALS_OPENSKY_BASE_URL: ${REALTIME_SIGNALS_OPENSKY_BASE_URL:-https://opensky-network.org/api}
      REALTIME_SIGNALS_OPENSKY_TOKEN_URL: ${REALTIME_SIGNALS_OPENSKY_TOKEN_URL:-https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token}
      REALTIME_SIGNALS_OPENSKY_CLIENT_ID: ${REALTIME_SIGNALS_OPENSKY_CLIENT_ID:-}
      REALTIME_SIGNALS_OPENSKY_CLIENT_SECRET: ${REALTIME_SIGNALS_OPENSKY_CLIENT_SECRET:-}
      REALTIME_SIGNALS_AIS_ENABLED: ${REALTIME_SIGNALS_AIS_ENABLED:-true}
      REALTIME_SIGNALS_AIS_INTERVAL_SEC: ${REALTIME_SIGNALS_AIS_INTERVAL_SEC:-600}
      REALTIME_SIGNALS_UNREST_ENABLED: ${REALTIME_SIGNALS_UNREST_ENABLED:-true}
      REALTIME_SIGNALS_UNREST_INTERVAL_SEC: ${REALTIME_SIGNALS_UNREST_INTERVAL_SEC:-600}
      REALTIME_SIGNALS_OUTAGES_ENABLED: ${REALTIME_SIGNALS_OUTAGES_ENABLED:-true}
      REALTIME_SIGNALS_OUTAGES_INTERVAL_SEC: ${REALTIME_SIGNALS_OUTAGES_INTERVAL_SEC:-600}
      REALTIME_SIGNALS_KEYWORD_SPIKE_ENABLED: ${REALTIME_SIGNALS_KEYWORD_SPIKE_ENABLED:-true}
      REALTIME_SIGNALS_KEYWORD_SPIKE_INTERVAL_SEC: ${REALTIME_SIGNALS_KEYWORD_SPIKE_INTERVAL_SEC:-600}
      REALTIME_SIGNALS_PIZZINT_ENABLED: ${REALTIME_SIGNALS_PIZZINT_ENABLED:-true}
      REALTIME_SIGNALS_PIZZINT_INTERVAL_SEC: ${REALTIME_SIGNALS_PIZZINT_INTERVAL_SEC:-600}
      REALTIME_SIGNALS_GDELT_TENSION_ENABLED: ${REALTIME_SIGNALS_GDELT_TENSION_ENABLED:-true}
      REALTIME_SIGNALS_GDELT_TENSION_INTERVAL_SEC: ${REALTIME_SIGNALS_GDELT_TENSION_INTERVAL_SEC:-600}
      REALTIME_SIGNALS_POLYMARKET_LEADS_ENABLED: ${REALTIME_SIGNALS_POLYMARKET_LEADS_ENABLED:-true}
      REALTIME_SIGNALS_POLYMARKET_LEADS_INTERVAL_SEC: ${REALTIME_SIGNALS_POLYMARKET_LEADS_INTERVAL_SEC:-600}
      REALTIME_SIGNALS_KEYWORD_SPIKE_MIN_COUNT: ${REALTIME_SIGNALS_KEYWORD_SPIKE_MIN_COUNT:-5}
      REALTIME_SIGNALS_KEYWORD_SPIKE_MULTIPLIER: ${REALTIME_SIGNALS_KEYWORD_SPIKE_MULTIPLIER:-3}
      REALTIME_SIGNALS_PREDICTION_SHIFT_THRESHOLD: ${REALTIME_SIGNALS_PREDICTION_SHIFT_THRESHOLD:-5}
      REALTIME_SIGNALS_PREDICTION_NEWS_ACTIVITY_THRESHOLD: ${REALTIME_SIGNALS_PREDICTION_NEWS_ACTIVITY_THRESHOLD:-3}
      REALTIME_SIGNALS_AIS_BASE_URL: ${REALTIME_SIGNALS_AIS_BASE_URL:-}
      REALTIME_SIGNALS_AIS_SHARED_SECRET: ${REALTIME_SIGNALS_AIS_SHARED_SECRET:-}
      AIS_RELAY_SHARED_SECRET: ${AIS_RELAY_SHARED_SECRET:-}
      REALTIME_SIGNALS_RELAY_BASE_URL: ${REALTIME_SIGNALS_RELAY_BASE_URL:-}
      REALTIME_SIGNALS_RELAY_SHARED_SECRET: ${REALTIME_SIGNALS_RELAY_SHARED_SECRET:-}
      REALTIME_SIGNALS_ACLED_USERNAME: ${REALTIME_SIGNALS_ACLED_USERNAME:-}
      REALTIME_SIGNALS_ACLED_PASSWORD: ${REALTIME_SIGNALS_ACLED_PASSWORD:-}
      REALTIME_SIGNALS_ACLED_CLIENT_ID: ${REALTIME_SIGNALS_ACLED_CLIENT_ID:-}
      REALTIME_SIGNALS_CLOUDFLARE_API_TOKEN: ${REALTIME_SIGNALS_CLOUDFLARE_API_TOKEN:-}
      REALTIME_SIGNALS_WINGBITS_API_KEY: ${REALTIME_SIGNALS_WINGBITS_API_KEY:-}
      REALTIME_SIGNALS_POLYMARKET_PROXY_URL: ${REALTIME_SIGNALS_POLYMARKET_PROXY_URL:-}
      GEO_NOMINATIM_USER_AGENT: ${GEO_NOMINATIM_USER_AGENT:-modular-api}
      GEO_NOMINATIM_EMAIL: ${GEO_NOMINATIM_EMAIL:-}
      # 已认证 MFA 管理与组织 OIDC 配置 7 条精确 HTTP：
      # GET /api/auth/mfa、POST /api/auth/mfa/enroll|verify-enroll|disable|
      # recovery/rotate、GET/PUT /api/auth/admin/oidc-config。
      # pilot 与样例保持 legacy。改成 go 才由 Go 独立验签（人类 JWT + Redis
      # blacklist + MySQL membership/权限重推导；机器令牌沿用 mtk_ 查库路径）
      # 并读写 MySQL UserTotpFactor/UserRecoveryCode/OrgOidcConfig。四条 MFA
      # 写要求真实人类 User（机器身份 403）；OIDC 是租户设置，按
      # settings.manage 判定，不套全局平台管理员门禁。go 要求 JWT_SECRET、
      # DATABASE_URL、REDIS_HOST，不要求 Mongo，不访问身份提供方、不签发
      # token、不启动 worker。login/refresh/logout/me/change-password/
      # machine-tokens、公开 MFA 登录与强制 enrollment 挑战，以及 OIDC
      # start/callback/handoff 仍回 NestJS。回滚只把该变量改回 legacy。
      API_GO_AUTH_FACTORS_MODE: ${API_GO_AUTH_FACTORS_MODE:-legacy}

      # 模型接入设置 10 条 HTTP（/api/system-settings/model-service、
      # /api/system-settings/openai-keys(+ /key/:fingerprint)、
      # /api/internal/litellm/openai-keys(+ /applied)）。pilot 与样例保持
      # legacy。改成 go 才由 Go 验签并读写 MySQL 的 SystemSetting
      # （model_service、openai_keys、litellm_openai_keys_applied）与 Redis
      # 缓存；六条管理写额外要求平台管理员；两条内部接口只用
      # LITELLM_CONFIG_INTERNAL_TOKEN。go 要求 JWT_SECRET、DATABASE_URL、
      # REDIS_HOST（不要求 Mongo，不启动 worker，不调用模型服务）。
      # /api/internal/litellm/proxy-load-balancing 与
      # /api/system-settings/llm-gateways 等仍回 NestJS。
      # 回滚只把该变量改回 legacy。
      API_GO_MODEL_ACCESS_SETTINGS_MODE: ${API_GO_MODEL_ACCESS_SETTINGS_MODE:-legacy}
      # LiteLLM 负载均衡配置管理与下发 4 条 HTTP
      # （/api/system-settings/llm-gateways/proxy-load-balancing 的
      # GET/PUT/DELETE、/api/internal/litellm/proxy-load-balancing 的 GET）。
      # pilot 与样例保持 legacy。改成 go 才由 Go 验签并读写 MySQL 的
      # SystemSetting（litellm_proxy_load_balancing）与 Redis 缓存，并复用
      # 真实 OpenAI 密钥读取；两条管理写额外要求平台管理员，内部快照只用
      # LITELLM_CONFIG_INTERNAL_TOKEN。go 要求 JWT_SECRET、DATABASE_URL、
      # REDIS_HOST（不要求 Mongo，不启动 worker，不调用模型上游，实际请求
      # 路由仍由 LiteLLM 执行）。与 API_GO_MODEL_ACCESS_SETTINGS_MODE 相互
      # 独立。未列路径（Profile/治理路由等）仍回 NestJS。回滚只把该变量改回
      # legacy。
      API_GO_PROXY_LOAD_BALANCING_MODE: ${API_GO_PROXY_LOAD_BALANCING_MODE:-legacy}
      # 知识图谱冲击传导与实体共现/价格相关图 4 个 GraphQL 只读 root
      # （getExecutiveChangeImpact / getCommodityMoveImpact /
      # getPolicyEventImpact / getEntityImpactGraph）。pilot 与样例保持
      # legacy。只有 API_GO_GRAPHQL_READ_MODE=go 且本变量=go 才登记；权限
      # 是重推导的 dashboards.read，mtk_ 机器令牌沿用读执行器规则拒绝。
      # 回滚只把该变量改回 legacy。不改表，不改 Web 入口。
      API_GO_GRAPHQL_KG_IMPACT_MODE: legacy
      # 身份/组织/RBAC/仪表盘/队列统计/情感时间序列/已处理条目详情 12 个
      # GraphQL 只读 root。pilot 与样例保持 legacy。只有
      # API_GO_GRAPHQL_READ_MODE=go 且本变量=go 才登记；本变量为 legacy 时
      # 含这 12 个 root 的文档整包回 NestJS。回滚只把该变量改回 legacy。
      API_GO_GRAPHQL_WORKSPACE_READ_MODE: legacy
      # 设置中心/来源策略/同步状态/证据复核队列/采集任务 20 个 GraphQL
      # 只读 root。pilot 与样例保持 legacy。只有 API_GO_GRAPHQL_READ_MODE=go
      # 且本变量=go 才登记；本变量为 legacy 时含这 20 个 root 的文档整包回
      # NestJS。回滚只把该变量改回 legacy。
      API_GO_GRAPHQL_SETTINGS_CRAWL_READ_MODE: legacy
      # 账户资料、会话退出与机器令牌管理的 8 条 HTTP（GET /api/auth/me、
      # PATCH /api/auth/profile、POST /api/auth/change-password、
      # POST /api/auth/logout、GET/POST /api/auth/machine-tokens、
      # DELETE /api/auth/machine-tokens/:tokenId、
      # POST /api/auth/machine-tokens/:tokenId/rotate）。默认 legacy，只接受
      # 空串/legacy/go，非法值启动失败。go 需要 JWT_SECRET、DATABASE_URL、
      # REDIS_HOST，不需要 Mongo。登录、refresh、邮箱验证码、密码找回、
      # MFA、OIDC、邀请与注册审核、头像上传签名、个人数据导出仍回 NestJS。
      # 生产 Web 入口仍指向 NestJS，canary 与 shadow 关闭。回滚只把该变量
      # 改回 legacy。
      API_GO_ACCOUNT_SECURITY_MODE: legacy
      API_GO_ITEMS_READING_MODE: legacy
      # 条目列表 GraphQL root 独立子开关：默认 legacy；go 要求读开关与条目阅读
      # 开关均为 go。回滚只把该变量改回 legacy，其余已迁读与 REST 不受影响。
      API_GO_GRAPHQL_ITEMS_LIST_MODE: legacy
      ITEMS_READ_MODEL_ENABLED: "false"
      ITEMS_VECTOR_HARD_FAIL_ENABLED: "false"
      # 组织、角色与成员管理 8 个 GraphQL mutation（createOrg / updateOrg /
      # setOrgActive / createRole / updateRole / assignRole /
      # updateMembershipRoles / setUserActive）。pilot 与样例保持 legacy，与
      # API_GO_GRAPHQL_READ_MODE 解耦：只开本变量时 query 仍走 NestJS，只有这
      # 8 个 mutation 由 Go 执行。只需要 JWT/MySQL/Redis，不要求 Mongo，不启动
      # worker。回滚只把该变量改回 legacy。
      API_GO_GRAPHQL_ORG_ACCESS_WRITE_MODE: legacy
      # 设置中心 13 个 GraphQL mutation。pilot 与样例保持 legacy，与全部读开关
      # 解耦：只开本变量时只登记这 13 个 mutation，20 个设置读 query 仍走
      # NestJS。只需要 JWT/MySQL/Redis，不要求 Mongo，不启动 worker，不回调
      # NestJS。回滚只把该变量改回 legacy。
      API_GO_GRAPHQL_SETTINGS_WRITE_MODE: legacy
      # 基础设施设置的 env 缺省与 api 服务同源（同一份 .env，同样的默认
      # 值）。S3_* 与 VECTOR_* 都不进入日志；不在这里新增第二套网关配置。
      NODE_ENV: production
      VECTOR_SERVICE_ENABLED: ${VECTOR_SERVICE_ENABLED:-false}
      VECTOR_SERVICE_FALLBACK_TO_MONGO: ${VECTOR_SERVICE_FALLBACK_TO_MONGO:-true}
      VECTOR_SERVICE_BASE_URL: ${VECTOR_SERVICE_BASE_URL:-}
      VECTOR_INTERNAL_TOKEN: ${VECTOR_INTERNAL_TOKEN:-}
      VECTOR_SERVICE_TIMEOUT_MS: ${VECTOR_SERVICE_TIMEOUT_MS:-5000}
      VECTOR_SERVICE_MAX_RETRIES: ${VECTOR_SERVICE_MAX_RETRIES:-2}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PRESIGNED_URL_TTL_SECONDS: ${S3_PRESIGNED_URL_TTL_SECONDS:-300}
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      # 与 api 服务相同的模型网关缺省和设置解密密钥。profile 在 MySQL。
      # 密钥不进日志。空值表示沿用进程内缺省，不单独发明一套网关配置。
      SYSTEM_SETTINGS_ENCRYPTION_KEY: ${SYSTEM_SETTINGS_ENCRYPTION_KEY:-}
      # 与 api 服务完全相同的模型服务缺省值（默认值必须一致，否则 Go 的 env
      # 回退与 Nest 不同）。MODEL_SERVICE_ENABLED 为 false 的部署形态照此覆盖。
      MODEL_SERVICE_ENABLED: ${MODEL_SERVICE_ENABLED:-true}
      MODEL_SERVICE_BASE_URL: ${MODEL_SERVICE_BASE_URL:-http://model-service:8090}
      MODEL_SERVICE_INTERNAL_TOKEN: ${MODEL_SERVICE_INTERNAL_TOKEN:-dev-model-token}
      MODEL_SERVICE_TIMEOUT_MS: ${MODEL_SERVICE_TIMEOUT_MS:-15000}
      MODEL_SERVICE_MAX_RETRIES: ${MODEL_SERVICE_MAX_RETRIES:-2}
      # 两条内部接口（取钥/上报已应用指纹）的 bearer token，与 api 服务同一份
      # 配置。缺失是接口契约（403），不是启动条件；值不进日志。
      LITELLM_CONFIG_INTERNAL_TOKEN: ${LITELLM_CONFIG_INTERNAL_TOKEN:-}
      # NODE_ENV=production 已在上方（基础设施设置批次）声明一次，此处不再重复；
      # 本批的生产加密策略判断复用同一项。
      LITELLM_API_URL: ${LITELLM_API_URL:-}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-http://localhost:4001}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_TIMEOUT_MS: ${LITELLM_TIMEOUT_MS:-60000}
      LITELLM_RETRY_ATTEMPTS: ${LITELLM_RETRY_ATTEMPTS:-3}
      # 本批 profile 默认值还需要这几个 LITELLM_* 与 NODE_ENV，与 api
      # 服务同源同名；上面已有的键不重复声明。LITELLM_MAX_TOKENS 在 Nest
      # env schema 里有默认值，优先于 LITELLM_MAX_OUTPUT_TOKENS（Go 侧同序）。
      NODE_ENV: ${NODE_ENV:-production}
      LITELLM_MODEL: ${LITELLM_MODEL:-openai/gpt-4o-mini}
      LITELLM_TEMPERATURE: ${LITELLM_TEMPERATURE:-0.2}
      LITELLM_TOP_P: ${LITELLM_TOP_P:-0.9}
      LITELLM_MAX_TOKENS: ${LITELLM_MAX_TOKENS:-2048}
      LITELLM_FALLBACK_MODELS: ${LITELLM_FALLBACK_MODELS:-}
      # Go-批3A 兼容变量：readMode 未设时仍控制 onboarding（pilot 固定
      # go，保持与批3A 部署等价；readMode=go 已覆盖全部六端点）。
      API_GO_ONBOARDING_MODE: go
      # 与 api 服务同一 JWT 配置（issuer/audience 默认值与 NestJS env
      # schema 一致）。secret 只经环境注入，不进日志/healthz/错误正文。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-modular-monolith}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-modular-monolith-clients}
      # 与 api 服务同一 Redis（blacklist 共享，不建第二套撤销名单）。
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      CANARY_PERCENT: "0"
      SHADOW_DEBUG_BODY_LOG: "false"
      # 与 NestJS 同一份来源白名单。浏览器跨源访问 :4020 上已接管的
      # user-settings GET/PUT 时，Go 用它回 CORS 头；空名单不放行任何 Origin。
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${API_GO_HOST_PORT:-4020}:4020"
    logging: *json-file-logging
    depends_on:
      api:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      # distroless 无 curl：healthcheck 子命令自探活（不依赖宿主侧探测）。
      test: ["CMD", "/api-go", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        API_BASE_URL: ${API_BASE_URL:-http://api:4000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_GRAPHQL_APQ_ENABLED: ${NEXT_PUBLIC_GRAPHQL_APQ_ENABLED:-true}
    restart: unless-stopped
    working_dir: /workspace
    # 启动等待使用最终配置的 API base（API_BASE_URL，默认 NestJS），
    # 不再硬编码 http://api:4000——api-go-pilot 模式下等待的是
    # http://api-go:4020 的真实探活。兼容 base 已带 /api 或尾斜杠。
    command: >
      sh -ec "
      base=$${API_BASE_URL%/};
      base=$${base%/api};
      url=$${base}/api/healthz/live;
      echo "[web] waiting for api at $${url}...";
      i=0;
      while [ $$i -lt 150 ]; do
        if curl -fsS $${url} >/dev/null; then
          echo '[web] api ready';
          break;
        fi;
        i=$$((i + 1));
        sleep 2;
      done;
      if ! curl -fsS $${url} >/dev/null; then
        echo '[web] api not ready after 300s';
        exit 1;
      fi;
      echo '[web] starting runtime server...';
      exec pnpm --filter @modular/web exec next start --hostname 0.0.0.0 --port 3000
      "
    env_file:
      - ./.env
    environment:
      PORT: 3000
      NODE_ENV: production
      NODE_OPTIONS: "${WEB_NODE_OPTIONS:---max-old-space-size=8192}"
      CI: "true"
      HUSKY: "0"
      # 服务端运行期 API base（apps/web/lib/env.ts 在运行时读取）：
      # legacy 默认 http://api:4000；api-go-pilot 切到
      # http://api-go:4020（.env 覆盖即可，无需重建镜像）。浏览器端的
      # NEXT_PUBLIC_API_BASE_URL 是构建期内联——切换浏览器流量需以
      # 对应构建参数重建 web 镜像。
      API_BASE_URL: ${API_BASE_URL:-http://api:4000}
      COREPACK_NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      npm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      pnpm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:3000:3000"
    logging: *json-file-logging
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: ${WEB_HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 20
      start_period: 300s

volumes:
  mysql-data:
  mongo-data:
  redis-data:
  minio-data:
  qdrant-data:
  elasticsearch-data:
  litellm-postgres-data:
