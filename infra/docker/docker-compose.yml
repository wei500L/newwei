services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    restart: "no"
    depends_on:
      - minio
    entrypoint:
      - sh
      - -ec
      - |
        until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
          echo '[minio-init] waiting for minio...';
          sleep 1;
        done;
        mc mb --ignore-existing local/$$S3_BUCKET;
        mc anonymous set download local/$$S3_BUCKET;
        cat > /tmp/cors.xml <<'EOF'
        <CORSConfiguration>
          <CORSRule>
            <AllowedOrigin>*</AllowedOrigin>
            <AllowedMethod>GET</AllowedMethod>
            <AllowedMethod>PUT</AllowedMethod>
            <AllowedMethod>HEAD</AllowedMethod>
            <AllowedHeader>*</AllowedHeader>
            <ExposeHeader>ETag</ExposeHeader>
            <MaxAgeSeconds>3000</MaxAgeSeconds>
          </CORSRule>
        </CORSConfiguration>
        EOF
        mc cors set local/$$S3_BUCKET /tmp/cors.xml || echo '[minio-init] warning: failed to set bucket CORS (continuing anyway)';
        echo '[minio-init] bucket initialized';
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-modular-avatars}

  akshare:
    build:
      context: ../..
      dockerfile: infra/akshare/Dockerfile
      args:
        PYTHON_IMAGE: ${AKSHARE_PYTHON_IMAGE:-python:3.11-slim}
        AKSHARE_VERSION: ${AKSHARE_VERSION:-1.17.94}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    environment:
      AKSHARE_ADMIN_TOKEN: ${AKSHARE_ADMIN_TOKEN:-}
    ports:
      - "${AKSHARE_PORT:-8081}:8081"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz', timeout=2).read()\""
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  model-service:
    build:
      context: ../..
      dockerfile: infra/model-service/Dockerfile
      args:
        PYTHON_IMAGE: ${MODEL_SERVICE_PYTHON_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    environment:
      MODEL_SERVICE_INTERNAL_TOKEN: ${MODEL_SERVICE_INTERNAL_TOKEN:-dev-model-token}
    ports:
      - "${MODEL_SERVICE_PORT:-8090}:8090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz', timeout=2).read()\""
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        if [ -z "${LITELLM_MASTER_KEY:-}" ]; then
          unset LITELLM_MASTER_KEY
        fi
        python /app/generate-litellm-config.py --input /app/config.base.yaml --output /app/config.yaml
        exec litellm --config /app/config.yaml --detailed_debug
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_CONFIG_API_BASE: ${LITELLM_CONFIG_API_BASE:-http://api:4000}
      LITELLM_CONFIG_INTERNAL_TOKEN: ${LITELLM_CONFIG_INTERNAL_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_API_KEYS: ${ANTHROPIC_API_KEYS:-}
      LITELLM_ROUTING_STRATEGY: ${LITELLM_ROUTING_STRATEGY:-simple-shuffle}
      LITELLM_REDIS_HOST: ${LITELLM_REDIS_HOST:-redis}
      LITELLM_REDIS_PORT: ${LITELLM_REDIS_PORT:-6379}
      LITELLM_REDIS_PASSWORD: ${LITELLM_REDIS_PASSWORD:-}
      LITELLM_DEPLOYMENT_RPM: ${LITELLM_DEPLOYMENT_RPM:-}
      LITELLM_DEPLOYMENT_TPM: ${LITELLM_DEPLOYMENT_TPM:-}
    ports:
      - "4001:4000"
    volumes:
      - ../litellm/litellm-config.yaml:/app/config.base.yaml:ro
      - ../litellm/generate-litellm-config.py:/app/generate-litellm-config.py:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=2).read()\""
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  crawl4ai:
    image: ${CRAWL4AI_IMAGE:-unclecode/crawl4ai:0}
    restart: unless-stopped
    working_dir: /app
    command:
      - sh
      - -lc
      - |
        Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR &
        export DISPLAY=:99
        exec supervisord -c supervisord.conf
    ports:
      - "8082:11235"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request\nurls=['http://localhost:11235/dashboard/','http://localhost:11235/playground/']\nfor url in urls:\n  try:\n    urllib.request.urlopen(url, timeout=2).read();\n    sys.exit(0)\n  except Exception:\n    pass\nsys.exit(1)\n\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
    working_dir: /workspace
    command: >
      sh -ec "
      echo '[api] pnpm install...';
      pnpm install --unsafe-perm;
      echo '[api] pnpm rebuild bcrypt...';
      pnpm rebuild bcrypt --unsafe-perm;
      echo '[api] prisma migrate (deploy) + generate...';
      pnpm --filter db run migrate;
      echo '[api] starting dev server...';
      pnpm --filter @modular/api run dev
      "
    env_file:
      - ./.env
    environment:
      PORT: 4000
      CI: "true"
      HUSKY: "0"
      PRISMA_AUTO_RESOLVE_FAILED_MIGRATIONS: "true"
      AKSHARE_ENABLED: ${AKSHARE_ENABLED:-true}
      AKSHARE_HTTP_BASE_URL: ${AKSHARE_HTTP_BASE_URL:-http://akshare:8081}
      MODEL_SERVICE_ENABLED: ${MODEL_SERVICE_ENABLED:-true}
      MODEL_SERVICE_BASE_URL: ${MODEL_SERVICE_BASE_URL:-http://model-service:8090}
      MODEL_SERVICE_INTERNAL_TOKEN: ${MODEL_SERVICE_INTERNAL_TOKEN:-dev-model-token}
      COREPACK_NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      npm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      pnpm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "4000:4000"
    volumes:
      - ../..:/workspace
      - api-node-modules:/workspace/node_modules
      - api-app-api-node-modules:/workspace/apps/api/node_modules
      - api-app-web-node-modules:/workspace/apps/web/node_modules
      - api-app-vector-node-modules:/workspace/apps/vector/node_modules
      - api-package-config-node-modules:/workspace/packages/config/node_modules
      - api-package-db-node-modules:/workspace/packages/db/node_modules
      - api-package-mongo-node-modules:/workspace/packages/mongo/node_modules
      - api-package-utils-node-modules:/workspace/packages/utils/node_modules
      - api-package-vector-client-node-modules:/workspace/packages/vector-client/node_modules
      - api-infra-scripts-node-modules:/workspace/infra/scripts/node_modules
      - api-pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      akshare:
        condition: service_healthy
      model-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/healthz/live"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

  vector:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
    working_dir: /workspace
    command: >
      sh -ec "
      echo '[vector] pnpm install...';
      pnpm install --unsafe-perm;
      echo '[vector] starting dev server...';
      pnpm --filter @modular/vector run dev
      "
    env_file:
      - ./.env
    environment:
      PORT: 4010
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      VECTOR_INTERNAL_TOKEN: ${VECTOR_INTERNAL_TOKEN:-dev-token}
      HUSKY: "0"
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "4010:4010"
    volumes:
      - ../..:/workspace
      - vector-node-modules:/workspace/node_modules
      - vector-app-api-node-modules:/workspace/apps/api/node_modules
      - vector-app-web-node-modules:/workspace/apps/web/node_modules
      - vector-app-vector-node-modules:/workspace/apps/vector/node_modules
      - vector-package-config-node-modules:/workspace/packages/config/node_modules
      - vector-package-db-node-modules:/workspace/packages/db/node_modules
      - vector-package-mongo-node-modules:/workspace/packages/mongo/node_modules
      - vector-package-utils-node-modules:/workspace/packages/utils/node_modules
      - vector-package-vector-client-node-modules:/workspace/packages/vector-client/node_modules
      - vector-infra-scripts-node-modules:/workspace/infra/scripts/node_modules
      - vector-pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4010/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
    working_dir: /workspace
    command: >
      sh -ec "
      echo '[web] pnpm install...';
      pnpm install --unsafe-perm;
      echo '[web] waiting for api...';
      i=0;
      while [ $$i -lt 150 ]; do
        if curl -fsS http://api:4000/api/healthz/live >/dev/null; then
          echo '[web] api ready';
          break;
        fi;
        i=$$((i + 1));
        sleep 2;
      done;
      if ! curl -fsS http://api:4000/api/healthz/live >/dev/null; then
        echo '[web] api not ready after 300s';
        exit 1;
      fi;
      echo '[web] starting dev server...';
      pnpm --filter @modular/web run dev:turbo
      "
    env_file:
      - ./.env
    environment:
      PORT: 3000
      NEXT_DIST_DIR: .next-docker
      CI: "false"
      HUSKY: "0"
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "1000"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      GRAPHQL_SCHEMA_URL: ${GRAPHQL_SCHEMA_URL:-http://api:4000/graphql}
      COREPACK_NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      npm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      pnpm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "3000:3000"
    volumes:
      - ../..:/workspace
      - web-node-modules:/workspace/node_modules
      - web-app-api-node-modules:/workspace/apps/api/node_modules
      - web-app-web-node-modules:/workspace/apps/web/node_modules
      - web-app-vector-node-modules:/workspace/apps/vector/node_modules
      - web-package-config-node-modules:/workspace/packages/config/node_modules
      - web-package-db-node-modules:/workspace/packages/db/node_modules
      - web-package-mongo-node-modules:/workspace/packages/mongo/node_modules
      - web-package-utils-node-modules:/workspace/packages/utils/node_modules
      - web-package-vector-client-node-modules:/workspace/packages/vector-client/node_modules
      - web-infra-scripts-node-modules:/workspace/infra/scripts/node_modules
      - web-pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

volumes:
  mysql-data:
  mongo-data:
  redis-data:
  minio-data:
  qdrant-data:
  api-node-modules:
  api-pnpm-store:
  api-app-api-node-modules:
  api-app-web-node-modules:
  api-app-vector-node-modules:
  api-package-config-node-modules:
  api-package-db-node-modules:
  api-package-mongo-node-modules:
  api-package-utils-node-modules:
  api-package-vector-client-node-modules:
  api-infra-scripts-node-modules:
  vector-node-modules:
  vector-pnpm-store:
  vector-app-api-node-modules:
  vector-app-web-node-modules:
  vector-app-vector-node-modules:
  vector-package-config-node-modules:
  vector-package-db-node-modules:
  vector-package-mongo-node-modules:
  vector-package-utils-node-modules:
  vector-package-vector-client-node-modules:
  vector-infra-scripts-node-modules:
  web-node-modules:
  web-pnpm-store:
  web-app-api-node-modules:
  web-app-web-node-modules:
  web-app-vector-node-modules:
  web-package-config-node-modules:
  web-package-db-node-modules:
  web-package-mongo-node-modules:
  web-package-utils-node-modules:
  web-package-vector-client-node-modules:
  web-infra-scripts-node-modules:
