version: "3.9"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    working_dir: /workspace
    command: sh -c "pnpm install && pnpm --filter @modular/api run dev"
    env_file:
      - ./.env
    environment:
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ../..:/workspace
      - api-node-modules:/workspace/node_modules
      - api-pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    working_dir: /workspace
    command: sh -c "pnpm install && pnpm --filter @modular/web run dev -- --hostname 0.0.0.0"
    env_file:
      - ./.env
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ../..:/workspace
      - web-node-modules:/workspace/node_modules
      - web-pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  mongo-data:
  redis-data:
  api-node-modules:
  api-pnpm-store:
  web-node-modules:
  web-pnpm-store:
