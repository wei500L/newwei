x-json-file-logging: &json-file-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-3}

x-app-hardening: &app-hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "db.adminCommand(''ping'').ok" | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/redis.Dockerfile
      args:
        REDIS_IMAGE: ${REDIS_IMAGE:-redis:7.2}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_AOF_CHECK_ON_START: ${REDIS_AOF_CHECK_ON_START:-true}
      REDIS_AOF_AUTO_FIX: ${REDIS_AOF_AUTO_FIX:-false}
      REDIS_AOF_PREFLIGHT_AUTO_REPAIR: ${REDIS_AOF_PREFLIGHT_AUTO_REPAIR:-true}
      REDIS_AOF_PREFLIGHT_LOG_TAIL: ${REDIS_AOF_PREFLIGHT_LOG_TAIL:-40}
      REDIS_AOF_BACKUP_KEEP: ${REDIS_AOF_BACKUP_KEEP:-5}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    logging: *json-file-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LITELLM_POSTGRES_DB:-litellm}
      POSTGRES_USER: ${LITELLM_POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:?LITELLM_POSTGRES_PASSWORD is required}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:5432:5432"
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data
    logging: *json-file-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    logging: *json-file-logging

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS -u "elastic:$$ELASTIC_PASSWORD" http://localhost:9200 >/dev/null',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:9000:9000"
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:9001:9001"
    volumes:
      - minio-data:/data
    logging: *json-file-logging

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727}
    restart: "no"
    depends_on:
      - minio
    entrypoint:
      - sh
      - -ec
      - |
        until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1; do
          echo '[minio-init] waiting for minio...';
          sleep 1;
        done;
        mc mb --ignore-existing local/$$S3_BUCKET;
        mc anonymous set download local/$$S3_BUCKET;
        echo '[minio-init] bucket initialized';
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-modular-avatars}
    logging: *json-file-logging

  akshare:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/akshare/Dockerfile
      args:
        PYTHON_IMAGE: ${AKSHARE_PYTHON_IMAGE:-python:3.11-slim}
        AKSHARE_VERSION: ${AKSHARE_VERSION:-1.18.39}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    environment:
      AKSHARE_ADMIN_TOKEN: ${AKSHARE_ADMIN_TOKEN:-}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${AKSHARE_PORT:-8081}:8081"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8081/healthz'', timeout=2).read()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  model-service:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/model-service/Dockerfile
      args:
        PYTHON_IMAGE: ${MODEL_SERVICE_PYTHON_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    environment:
      MODEL_SERVICE_INTERNAL_TOKEN: ${MODEL_SERVICE_INTERNAL_TOKEN:-dev-model-token}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${MODEL_SERVICE_PORT:-8090}:8090"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8090/healthz'', timeout=2).read()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  litellm:
    <<: *app-hardening
    # Pin the currently verified LiteLLM image digest to avoid drifting to bad upstream releases.
    build:
      context: ../..
      dockerfile: infra/docker/litellm.Dockerfile
      args:
        LITELLM_IMAGE: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm@sha256:067aee932b8770ed42955ee802a04abdcd369d0995b5e696bb07d6520a231b1c}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      litellm-postgres:
        condition: service_healthy
      api-go:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        if [ -z "$${LITELLM_MASTER_KEY:-}" ]; then
          echo "[litellm] LITELLM_MASTER_KEY is required; refusing to start without proxy auth." >&2
          exit 1
        fi
        python /app/generate-litellm-config.py --input /app/config.base.yaml --output /app/config.yaml
        exec litellm --config /app/config.yaml --detailed_debug
    environment:
      DATABASE_URL: ${LITELLM_DATABASE_URL:?LITELLM_DATABASE_URL is required}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_CONFIG_API_BASE: ${LITELLM_CONFIG_API_BASE:-http://api-go:4020/api}
      LITELLM_CONFIG_INTERNAL_TOKEN: ${LITELLM_CONFIG_INTERNAL_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_API_KEYS: ${ANTHROPIC_API_KEYS:-}
      LITELLM_ROUTING_STRATEGY: ${LITELLM_ROUTING_STRATEGY:-simple-shuffle}
      LITELLM_REDIS_HOST: ${LITELLM_REDIS_HOST:-redis}
      LITELLM_REDIS_PORT: ${LITELLM_REDIS_PORT:-6379}
      LITELLM_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      LITELLM_DEPLOYMENT_RPM: ${LITELLM_DEPLOYMENT_RPM:-}
      LITELLM_DEPLOYMENT_TPM: ${LITELLM_DEPLOYMENT_TPM:-}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:4001:4000"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'', timeout=2).read()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  crawl4ai:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/crawl4ai.Dockerfile
      args:
        CRAWL4AI_IMAGE: ${CRAWL4AI_IMAGE:-unclecode/crawl4ai:0.9.2@sha256:bd36741e7bdd35ddc1a05d9183e1d6d8cefb61dd640d944a25d026b76e917690}
    restart: unless-stopped
    working_dir: /app
    shm_size: 1g
    tmpfs:
      - /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CRAWL4AI_XVFB_ENABLED: ${CRAWL4AI_XVFB_ENABLED:-true}
      CRAWL4AI_XVFB_DISPLAY_NUM: ${CRAWL4AI_XVFB_DISPLAY_NUM:-99}
      CRAWL4AI_XVFB_SCREEN: ${CRAWL4AI_XVFB_SCREEN:-1920x1080x24}
      CRAWL4AI_SSRF_PROXY_PORT: ${CRAWL4AI_SSRF_PROXY_PORT:-18080}
      CRAWL4AI_HTTP_PROXY: ${CRAWL4AI_HTTP_PROXY:-}
      CRAWL4AI_HTTPS_PROXY: ${CRAWL4AI_HTTPS_PROXY:-}
      CRAWL4AI_NO_PROXY: ${CRAWL4AI_NO_PROXY:-localhost,127.0.0.1,crawl4ai,api,web,db,redis,host.docker.internal}
      HTTP_PROXY: ${CRAWL4AI_HTTP_PROXY:-}
      HTTPS_PROXY: ${CRAWL4AI_HTTPS_PROXY:-}
      NO_PROXY: ${CRAWL4AI_NO_PROXY:-localhost,127.0.0.1,crawl4ai,api,web,db,redis,host.docker.internal}
      http_proxy: ${CRAWL4AI_HTTP_PROXY:-}
      https_proxy: ${CRAWL4AI_HTTPS_PROXY:-}
      no_proxy: ${CRAWL4AI_NO_PROXY:-localhost,127.0.0.1,crawl4ai,api,web,db,redis,host.docker.internal}
    command:
      - sh
      - -lc
      - |
        if [ -f /opt/modular/crawl4ai-ssrf-proxy.py ]; then
          python /opt/modular/crawl4ai-ssrf-proxy.py &
        fi

        if [ "$$CRAWL4AI_XVFB_ENABLED" = "true" ]; then
          if command -v Xvfb >/dev/null 2>&1; then
            echo "[crawl4ai] Starting Xvfb on :$$CRAWL4AI_XVFB_DISPLAY_NUM ($$CRAWL4AI_XVFB_SCREEN)"
            mkdir -p /tmp/.X11-unix
            rm -f "/tmp/.X$${CRAWL4AI_XVFB_DISPLAY_NUM}-lock" "/tmp/.X11-unix/X$${CRAWL4AI_XVFB_DISPLAY_NUM}" || true
            Xvfb ":$$CRAWL4AI_XVFB_DISPLAY_NUM" -screen 0 "$$CRAWL4AI_XVFB_SCREEN" -nolisten tcp -ac +extension RANDR &
            export DISPLAY=":$$CRAWL4AI_XVFB_DISPLAY_NUM"
            i=0
            while [ $$i -lt 50 ]; do
              if [ -e "/tmp/.X11-unix/X$${CRAWL4AI_XVFB_DISPLAY_NUM}" ]; then
                break
              fi
              i=$$((i + 1))
              sleep 0.1
            done
            if [ ! -e "/tmp/.X11-unix/X$${CRAWL4AI_XVFB_DISPLAY_NUM}" ]; then
              echo "[crawl4ai] Xvfb failed to start; continuing without DISPLAY"
              unset DISPLAY
            fi
          else
            echo "[crawl4ai] Xvfb is not installed; continuing without DISPLAY"
            unset DISPLAY
          fi
        fi
        exec supervisord -c supervisord.conf
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:8082:11235"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request\nurls=['http://localhost:11235/dashboard/','http://localhost:11235/playground/']\nfor url in urls:\n  try:\n    urllib.request.urlopen(url, timeout=2).read();\n    sys.exit(0)\n  except Exception:\n    pass\nsys.exit(1)\n\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ais-relay-go: the default (and only) AIS relay. It is the Go port of the
  # former Node apps/ais-relay (code in apps/api-go/internal/aisrelay and
  # apps/api-go/cmd/ais-relay; same env vars, same HTTP paths, same JSON).
  # api-go reads REALTIME_SIGNALS_AIS_BASE_URL=http://ais-relay-go:3004 from
  # infra/docker/.env. Host port 3005 maps to container port 3004.
  # Healthcheck uses the binary's own healthcheck subcommand: the image has
  # no node and no curl.
  ais-relay-go:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/ais-relay-go.Dockerfile
      args:
        GO_IMAGE: ${AIS_RELAY_GO_IMAGE:-golang:1.27}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # AISSTREAM_API_KEY (required), AIS_RELAY_SHARED_SECRET, AISSTREAM_URL,
      # AIS_RELAY_PORT and the AIS_RELAY_HEALTH_* thresholds all come from the
      # shared env_file above, exactly like the Node service.
      PORT: 3004
      AIS_RELAY_HOST: "0.0.0.0"
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${AIS_RELAY_GO_HOST_PORT:-3005}:3004"
    logging: *json-file-logging
    healthcheck:
      # distroless has neither node nor curl: the binary probes itself against
      # http://127.0.0.1:$PORT/healthz/live.
      test: ["CMD", "/ais-relay", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s

  # vector-go: the default (and only) vector service. api-go and the system
  # settings point at http://vector-go:4010 (container port); this service
  # publishes host 4011. The healthcheck runs host-side (the distroless image
  # has no curl); the ordinary CI job covers it.
  vector-go:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/vector-go.Dockerfile
      args:
        GO_IMAGE: ${VECTOR_GO_IMAGE:-golang:1.27}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4010
      # Required and must not be dev-token: apps/vector-go/internal/config fails
      # closed in production. api-go sends the same value on x-internal-token.
      VECTOR_INTERNAL_TOKEN: ${VECTOR_INTERNAL_TOKEN:?VECTOR_INTERNAL_TOKEN is required}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      VECTOR_COLLECTION_PREFIX: ${VECTOR_COLLECTION_PREFIX:-processed_item_summary}
      VECTOR_QDRANT_TIMEOUT_MS: ${VECTOR_QDRANT_TIMEOUT_MS:-5000}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:4011:4010"
    logging: *json-file-logging
    depends_on:
      qdrant:
        condition: service_started

  # api-go: the backend gateway. This is the only HTTP gateway: the former
  # NestJS app has been removed, so every business route is answered here and an
  # unmatched route returns a plain 404.
  #
  # Default entry points:
  #   server-side runtime: API_BASE_URL=http://api-go:4020
  #   browser:             NEXT_PUBLIC_API_BASE_URL=http://<host>:4020/api
  #   host development:    http://localhost:4020
  #
  # Startup dependencies are the shared stores and the one-shot Prisma/Mongo
  # tool services (migrate / mongo-indexes) that this service waits on.
  # Rolling back the backend is a normal version rollback of the Go images; there
  # is no parallel Node stack and no per-switch legacy override.
  api-go:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/api-go.Dockerfile
      args:
        GO_IMAGE: ${API_GO_IMAGE:-golang:1.27}
    restart: unless-stopped
    environment:
      PORT: 4020
      # Realtime GraphQL subscriptions run on the Go executor: they need JWT,
      # MySQL and Redis only, and share the Redis pub/sub bus.
      # Socket.IO transports run on api-go: /socket.io-notifications and
      # /socket.io-realtime are served by the Go process itself.
      WS_MAX_CONNECTIONS_PER_USER: ${WS_MAX_CONNECTIONS_PER_USER:-5}
      WS_MAX_CONNECTIONS_PER_IP: ${WS_MAX_CONNECTIONS_PER_IP:-50}
      WS_CONNECT_RATE_LIMIT_PER_IP: ${WS_CONNECT_RATE_LIMIT_PER_IP:-60}
      WS_CONNECT_RATE_LIMIT_PER_USER: ${WS_CONNECT_RATE_LIMIT_PER_USER:-30}
      WS_CONNECT_RATE_LIMIT_WINDOW_SECONDS: ${WS_CONNECT_RATE_LIMIT_WINDOW_SECONDS:-60}
      # The /newsnow namespace is relayed from the Socket.IO Redis adapter
      # broadcast channel; defaults mirror config (enabled, "socket.io").
      WS_REDIS_ADAPTER_ENABLED: ${WS_REDIS_ADAPTER_ENABLED:-true}
      WS_REDIS_ADAPTER_KEY: ${WS_REDIS_ADAPTER_KEY:-socket.io}
      GRAPHQL_SUBSCRIPTION_BUS: ${GRAPHQL_SUBSCRIPTION_BUS:-redis}
      DATABASE_URL: mysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD}@mysql:${MYSQL_PORT:-3306}/${MYSQL_DB}
      # The OIDC login unit builds the web callback from NEXTAUTH_URL and the
      # IdP redirect_uri from API_BASE_URL (the public API origin). Both are read
      # per request; the public origin now points at this gateway.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://api-go:4020}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Outbox compensation tuning. The Go runtime owns the processed_item
      # MongoOutbox compensation chain (MySQL + Redis + Mongo).
      PROCESSED_ITEM_OUTBOX_TICK_BUDGET_MS: ${PROCESSED_ITEM_OUTBOX_TICK_BUDGET_MS:-240000}
      PROCESSED_ITEM_OUTBOX_CONCURRENCY: ${PROCESSED_ITEM_OUTBOX_CONCURRENCY:-4}
      PROCESSED_ITEM_OUTBOX_BATCH_SIZE: ${PROCESSED_ITEM_OUTBOX_BATCH_SIZE:-10}
      # 采集维护四个 Cron 由 Go 执行时需要的共享资源：DATABASE_URL 已在上方，
      # Redis/Mongo 与 Nest 同源。审计保留清理同样只需 DATABASE_URL 与 Redis。
      # 变量与 api 服务同名同默认值，切换时两侧读到同一组阈值。
      CRAWL_TASK_JANITOR_ENABLED: ${CRAWL_TASK_JANITOR_ENABLED:-true}
      CRAWL_TASK_RUNNING_TIMEOUT_MS: ${CRAWL_TASK_RUNNING_TIMEOUT_MS:-1800000}
      CRAWL_TASK_QUEUED_TIMEOUT_MS: ${CRAWL_TASK_QUEUED_TIMEOUT_MS:-43200000}
      CRAWL_TASK_JANITOR_BATCH_SIZE: ${CRAWL_TASK_JANITOR_BATCH_SIZE:-50}
      CRAWL_TASK_JANITOR_QUEUE_SCAN_LIMIT: ${CRAWL_TASK_JANITOR_QUEUE_SCAN_LIMIT:-5000}
      CRAWL_TASK_JANITOR_LOCK_TTL_MS: ${CRAWL_TASK_JANITOR_LOCK_TTL_MS:-120000}
      # Shared scheduling control. The Go runtime owns the news-source
      # scheduler and the raw_item failure-replay cron; SCHEDULE_ENABLED=false
      # disables both the scheduled replay and the live in-request delivery.
      SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-true}
      # 经济数据的三个 Mutation、三个管理 HTTP 与 akshare-data 消费所有权。
      # 两个开关独立，空串按 go；worker=go 时 NestJS 跳过目录/重复任务
      # 初始化且不再创建 Worker，只有 Go 消费。回滚先停 Go worker 再改回 legacy。
      AKSHARE_ENABLED: ${AKSHARE_ENABLED:-true}
      AKSHARE_HTTP_BASE_URL: ${AKSHARE_HTTP_BASE_URL:-http://akshare:8081}
      AKSHARE_HTTP_TIMEOUT_MS: ${AKSHARE_HTTP_TIMEOUT_MS:-20000}
      AKSHARE_HTTP_MAX_RETRIES: ${AKSHARE_HTTP_MAX_RETRIES:-3}
      AKSHARE_ADMIN_TOKEN: ${AKSHARE_ADMIN_TOKEN:-}
      AKSHARE_QUEUE_CONCURRENCY: ${AKSHARE_QUEUE_CONCURRENCY:-2}
      AKSHARE_SCHEDULE_SMOOTHING_ENABLED: ${AKSHARE_SCHEDULE_SMOOTHING_ENABLED:-false}
      AKSHARE_SKIP_UNCHANGED_LATEST_POINTS: ${AKSHARE_SKIP_UNCHANGED_LATEST_POINTS:-false}
      # News-event ingestion settle window, read by the Go ingestion scheduler.
