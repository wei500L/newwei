x-json-file-logging: &json-file-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-3}

x-app-hardening: &app-hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "db.adminCommand(''ping'').ok" | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/redis.Dockerfile
      args:
        REDIS_IMAGE: ${REDIS_IMAGE:-redis:7.2}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_AOF_CHECK_ON_START: ${REDIS_AOF_CHECK_ON_START:-true}
      REDIS_AOF_AUTO_FIX: ${REDIS_AOF_AUTO_FIX:-false}
      REDIS_AOF_PREFLIGHT_AUTO_REPAIR: ${REDIS_AOF_PREFLIGHT_AUTO_REPAIR:-true}
      REDIS_AOF_PREFLIGHT_LOG_TAIL: ${REDIS_AOF_PREFLIGHT_LOG_TAIL:-40}
      REDIS_AOF_BACKUP_KEEP: ${REDIS_AOF_BACKUP_KEEP:-5}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    logging: *json-file-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LITELLM_POSTGRES_DB:-litellm}
      POSTGRES_USER: ${LITELLM_POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:?LITELLM_POSTGRES_PASSWORD is required}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:5432:5432"
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data
    logging: *json-file-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    logging: *json-file-logging

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -fsS -u "elastic:$$ELASTIC_PASSWORD" http://localhost:9200 >/dev/null',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:9000:9000"
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:9001:9001"
    volumes:
      - minio-data:/data
    logging: *json-file-logging

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727}
    restart: "no"
    depends_on:
      - minio
    entrypoint:
      - sh
      - -ec
      - |
        until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1; do
          echo '[minio-init] waiting for minio...';
          sleep 1;
        done;
        mc mb --ignore-existing local/$$S3_BUCKET;
        mc anonymous set download local/$$S3_BUCKET;
        echo '[minio-init] bucket initialized';
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-modular-avatars}
    logging: *json-file-logging

  akshare:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/akshare/Dockerfile
      args:
        PYTHON_IMAGE: ${AKSHARE_PYTHON_IMAGE:-python:3.11-slim}
        AKSHARE_VERSION: ${AKSHARE_VERSION:-1.18.39}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    environment:
      AKSHARE_ADMIN_TOKEN: ${AKSHARE_ADMIN_TOKEN:-}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${AKSHARE_PORT:-8081}:8081"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8081/healthz'', timeout=2).read()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  model-service:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/model-service/Dockerfile
      args:
        PYTHON_IMAGE: ${MODEL_SERVICE_PYTHON_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    environment:
      MODEL_SERVICE_INTERNAL_TOKEN: ${MODEL_SERVICE_INTERNAL_TOKEN:-dev-model-token}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${MODEL_SERVICE_PORT:-8090}:8090"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8090/healthz'', timeout=2).read()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  litellm:
    <<: *app-hardening
    # Pin the currently verified LiteLLM image digest to avoid drifting to bad upstream releases.
    build:
      context: ../..
      dockerfile: infra/docker/litellm.Dockerfile
      args:
        LITELLM_IMAGE: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm@sha256:067aee932b8770ed42955ee802a04abdcd369d0995b5e696bb07d6520a231b1c}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      litellm-postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        if [ -z "$${LITELLM_MASTER_KEY:-}" ]; then
          echo "[litellm] LITELLM_MASTER_KEY is required; refusing to start without proxy auth." >&2
          exit 1
        fi
        python /app/generate-litellm-config.py --input /app/config.base.yaml --output /app/config.yaml
        exec litellm --config /app/config.yaml --detailed_debug
    environment:
      DATABASE_URL: ${LITELLM_DATABASE_URL:?LITELLM_DATABASE_URL is required}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_CONFIG_API_BASE: ${LITELLM_CONFIG_API_BASE:-http://api:4000/api}
      LITELLM_CONFIG_INTERNAL_TOKEN: ${LITELLM_CONFIG_INTERNAL_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_API_KEYS: ${ANTHROPIC_API_KEYS:-}
      LITELLM_ROUTING_STRATEGY: ${LITELLM_ROUTING_STRATEGY:-simple-shuffle}
      LITELLM_REDIS_HOST: ${LITELLM_REDIS_HOST:-redis}
      LITELLM_REDIS_PORT: ${LITELLM_REDIS_PORT:-6379}
      LITELLM_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      LITELLM_DEPLOYMENT_RPM: ${LITELLM_DEPLOYMENT_RPM:-}
      LITELLM_DEPLOYMENT_TPM: ${LITELLM_DEPLOYMENT_TPM:-}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:4001:4000"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'', timeout=2).read()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  crawl4ai:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/crawl4ai.Dockerfile
      args:
        CRAWL4AI_IMAGE: ${CRAWL4AI_IMAGE:-unclecode/crawl4ai:0.9.2@sha256:bd36741e7bdd35ddc1a05d9183e1d6d8cefb61dd640d944a25d026b76e917690}
    restart: unless-stopped
    working_dir: /app
    shm_size: 1g
    tmpfs:
      - /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CRAWL4AI_XVFB_ENABLED: ${CRAWL4AI_XVFB_ENABLED:-true}
      CRAWL4AI_XVFB_DISPLAY_NUM: ${CRAWL4AI_XVFB_DISPLAY_NUM:-99}
      CRAWL4AI_XVFB_SCREEN: ${CRAWL4AI_XVFB_SCREEN:-1920x1080x24}
      CRAWL4AI_SSRF_PROXY_PORT: ${CRAWL4AI_SSRF_PROXY_PORT:-18080}
      CRAWL4AI_HTTP_PROXY: ${CRAWL4AI_HTTP_PROXY:-}
      CRAWL4AI_HTTPS_PROXY: ${CRAWL4AI_HTTPS_PROXY:-}
      CRAWL4AI_NO_PROXY: ${CRAWL4AI_NO_PROXY:-localhost,127.0.0.1,crawl4ai,api,web,db,redis,host.docker.internal}
      HTTP_PROXY: ${CRAWL4AI_HTTP_PROXY:-}
      HTTPS_PROXY: ${CRAWL4AI_HTTPS_PROXY:-}
      NO_PROXY: ${CRAWL4AI_NO_PROXY:-localhost,127.0.0.1,crawl4ai,api,web,db,redis,host.docker.internal}
      http_proxy: ${CRAWL4AI_HTTP_PROXY:-}
      https_proxy: ${CRAWL4AI_HTTPS_PROXY:-}
      no_proxy: ${CRAWL4AI_NO_PROXY:-localhost,127.0.0.1,crawl4ai,api,web,db,redis,host.docker.internal}
    command:
      - sh
      - -lc
      - |
        if [ -f /opt/modular/crawl4ai-ssrf-proxy.py ]; then
          python /opt/modular/crawl4ai-ssrf-proxy.py &
        fi

        if [ "$$CRAWL4AI_XVFB_ENABLED" = "true" ]; then
          if command -v Xvfb >/dev/null 2>&1; then
            echo "[crawl4ai] Starting Xvfb on :$$CRAWL4AI_XVFB_DISPLAY_NUM ($$CRAWL4AI_XVFB_SCREEN)"
            mkdir -p /tmp/.X11-unix
            rm -f "/tmp/.X$${CRAWL4AI_XVFB_DISPLAY_NUM}-lock" "/tmp/.X11-unix/X$${CRAWL4AI_XVFB_DISPLAY_NUM}" || true
            Xvfb ":$$CRAWL4AI_XVFB_DISPLAY_NUM" -screen 0 "$$CRAWL4AI_XVFB_SCREEN" -nolisten tcp -ac +extension RANDR &
            export DISPLAY=":$$CRAWL4AI_XVFB_DISPLAY_NUM"
            i=0
            while [ $$i -lt 50 ]; do
              if [ -e "/tmp/.X11-unix/X$${CRAWL4AI_XVFB_DISPLAY_NUM}" ]; then
                break
              fi
              i=$$((i + 1))
              sleep 0.1
            done
            if [ ! -e "/tmp/.X11-unix/X$${CRAWL4AI_XVFB_DISPLAY_NUM}" ]; then
              echo "[crawl4ai] Xvfb failed to start; continuing without DISPLAY"
              unset DISPLAY
            fi
          else
            echo "[crawl4ai] Xvfb is not installed; continuing without DISPLAY"
            unset DISPLAY
          fi
        fi
        exec supervisord -c supervisord.conf
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:8082:11235"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request\nurls=['http://localhost:11235/dashboard/','http://localhost:11235/playground/']\nfor url in urls:\n  try:\n    urllib.request.urlopen(url, timeout=2).read();\n    sys.exit(0)\n  except Exception:\n    pass\nsys.exit(1)\n\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  ais-relay:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/ais-relay.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3004
      NODE_ENV: production
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${AIS_RELAY_PORT:-3004}:3004"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/healthz/live').then((response) => { process.exit(response.ok ? 0 : 1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 120s

  api:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        API_BASE_URL: ${API_BASE_URL:-http://api:4000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_GRAPHQL_APQ_ENABLED: ${NEXT_PUBLIC_GRAPHQL_APQ_ENABLED:-true}
        NEXT_PUBLIC_NOTIFICATIONS_SOCKET_PATH: ${NEXT_PUBLIC_NOTIFICATIONS_SOCKET_PATH:-/socket.io}
        NEXT_PUBLIC_REALTIME_SOCKET_PATH: ${NEXT_PUBLIC_REALTIME_SOCKET_PATH:-/socket.io}
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -ec "
      echo '[api] prisma migrate (deploy) + generate...';
      pnpm --filter db run migrate;
      echo '[api] ensuring mongo indexes...';
      pnpm --filter @modular/api run mongo:indexes;
      echo '[api] starting runtime server...';
      exec pnpm --filter @modular/api run start
      "
    env_file:
      - ./.env
    environment:
      PORT: 4000
      NODE_ENV: production
      CI: "true"
      HUSKY: "0"
      # Nest producers and the api-go subscription executor must use the same
      # Redis channels. The container receives the value explicitly instead of
      # relying on a host-side .env that compose would not inject.
      GRAPHQL_SUBSCRIPTION_BUS: ${GRAPHQL_SUBSCRIPTION_BUS:-redis}
      # Go notifications Socket.IO 传输的执行权。Nest 也读取它：go 时
      # NotificationsService 改发 identifiers-only relay、由 api-go 的
      # /socket.io-notifications 推给浏览器。两侧必须看到同一值，否则会退化成
      # Nest 发本机 socket 而 Web 连 Go 路径（实时通知丢失）。
      API_GO_NOTIFICATIONS_SOCKET_MODE: ${API_GO_NOTIFICATIONS_SOCKET_MODE:-legacy}
      # 态势信号 worker（队列 situationMonitorSignals：Telegram 频道轮询 + OREF
      # 警报轮询）的执行权。Nest 也读取它：go 时不再创建 Worker、不注册重复
      # 任务，重启后也不再持有 Telegram 连接（避免与 Go 同时持有同一会话触发
      # AUTH_KEY_DUPLICATED）。切换顺序：先把 api 侧改为 go 并重启，再把
      # api-go 侧改为 go；回退按相反顺序。会话字符串、Redis 状态与队列协议
      # 两端相同，回退不需要重新登录。
      API_GO_SITUATION_SIGNALS_WORKER_MODE: ${API_GO_SITUATION_SIGNALS_WORKER_MODE:-legacy}
      # 态势手动刷新 POST /api/situation-monitor/refresh 的执行权。Nest 只做
      # schema 校验；go 时该路由由 api-go 处理（要求 api-go 侧同名变量为 go，
      # 且 API_GO_SITUATION_SIGNALS_WORKER_MODE 与
      # API_GO_NEWS_SOURCE_SCHEDULER_MODE 已为 go，否则 api-go 启动失败）。
      API_GO_SITUATION_REFRESH_MODE: ${API_GO_SITUATION_REFRESH_MODE:-legacy}
      # Telegram 登录两个 POST 的执行权。Nest 只做 schema 校验；go 时这两条
      # 请求由 api-go 处理（Nest 控制器不改，其余 settings 路由不受影响）。
      API_GO_SITUATION_TELEGRAM_AUTH_MODE: ${API_GO_SITUATION_TELEGRAM_AUTH_MODE:-legacy}
      # 实时 Socket.IO 传输（newsnow/quality/ops/queue/situation-monitor）的执行权。
      # Nest 也读取它：go 时各 dispatcher 改发 identifiers-only relay，由 api-go 的
      # 独立 Engine.IO path 推给浏览器。两侧必须看到同一值，否则会 split-brain。
      API_GO_REALTIME_SOCKET_MODE: ${API_GO_REALTIME_SOCKET_MODE:-legacy}
      # 分类质检告警评估调度的执行权。Nest 也读取它：go 时 NestJS 每 5 分钟调度
      # 在领取共享 tick gate 前返回，由 api-go 执行并共用同一组织锁。
      API_GO_CLASSIFICATION_QUALITY_ALERT_MODE: ${API_GO_CLASSIFICATION_QUALITY_ALERT_MODE:-legacy}
      PRISMA_AUTO_RESOLVE_FAILED_MIGRATIONS: "false"
      AKSHARE_ENABLED: ${AKSHARE_ENABLED:-true}
      AKSHARE_HTTP_BASE_URL: ${AKSHARE_HTTP_BASE_URL:-http://akshare:8081}
      AKSHARE_HTTP_TIMEOUT_MS: ${AKSHARE_HTTP_TIMEOUT_MS:-20000}
      AKSHARE_HTTP_MAX_RETRIES: ${AKSHARE_HTTP_MAX_RETRIES:-3}
      AKSHARE_ADMIN_TOKEN: ${AKSHARE_ADMIN_TOKEN:-}
      AKSHARE_QUEUE_CONCURRENCY: ${AKSHARE_QUEUE_CONCURRENCY:-2}
      AKSHARE_SCHEDULE_SMOOTHING_ENABLED: ${AKSHARE_SCHEDULE_SMOOTHING_ENABLED:-false}
      AKSHARE_SKIP_UNCHANGED_LATEST_POINTS: ${AKSHARE_SKIP_UNCHANGED_LATEST_POINTS:-false}
      # Economic-data request and worker ownership. Empty behaves like legacy;
      # both Nest and Go must see the same worker value so only one process
      # consumes the akshare-data queue.
      API_GO_ECONOMIC_DATA_MODE: ${API_GO_ECONOMIC_DATA_MODE:-legacy}
      API_GO_ECONOMIC_DATA_WORKER_MODE: ${API_GO_ECONOMIC_DATA_WORKER_MODE:-legacy}
      MODEL_SERVICE_ENABLED: ${MODEL_SERVICE_ENABLED:-true}
      MODEL_SERVICE_BASE_URL: ${MODEL_SERVICE_BASE_URL:-http://model-service:8090}
      MODEL_SERVICE_INTERNAL_TOKEN: ${MODEL_SERVICE_INTERNAL_TOKEN:-dev-model-token}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_NODE: ${ELASTICSEARCH_NODE:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}
      # 每日摘要后台投递所有权。空串按 legacy 处理；非法值在 Nest 与 Go 都启动失败。
      # 默认 legacy=保留 NestJS Cron；go=Go 每分钟扫描并投递，NestJS Cron 在 tick
      # gate 前退出且摘要通知 subscriber 启动。Nest 与 Go 注入同一变量。
      API_GO_USER_DIGEST_DELIVERY_MODE: ${API_GO_USER_DIGEST_DELIVERY_MODE:-legacy}
      # 审计日志失败补偿链的执行所有权。空串按 legacy；非法值在 Nest 与 Go 都启动失败。
      # 默认 legacy=保留 NestJS 每分钟 Cron；go=Go 每分钟扫描并重放，NestJS 在申请锁前退出。
      # SCHEDULE_ENABLED=false 时两边都停止调度本链；切换/回滚顺序见 docs 与 README。
      API_GO_AUDIT_OUTBOX_MODE: ${API_GO_AUDIT_OUTBOX_MODE:-legacy}
      # processed_item MongoOutbox 补偿链所有权。空串按 legacy；go=Go 每 5 分钟
      # 扫描并按时间预算分批并发补偿，Nest 的定时扫描在申请锁前退出。立即投递与
      # 进程内重试仍归 Nest。go 需要 MySQL、Redis、Mongo；回滚改回 legacy。
      API_GO_PROCESSED_ITEM_OUTBOX_MODE: ${API_GO_PROCESSED_ITEM_OUTBOX_MODE:-legacy}
      PROCESSED_ITEM_OUTBOX_TICK_BUDGET_MS: ${PROCESSED_ITEM_OUTBOX_TICK_BUDGET_MS:-240000}
      PROCESSED_ITEM_OUTBOX_CONCURRENCY: ${PROCESSED_ITEM_OUTBOX_CONCURRENCY:-4}
      PROCESSED_ITEM_OUTBOX_BATCH_SIZE: ${PROCESSED_ITEM_OUTBOX_BATCH_SIZE:-10}
      # NewsNow 来源获取两路（公开）：GET /api/news-aggregator/source 与
      # POST /api/news-aggregator/sources/batch。Nest 与 Go 注入同一变量；
      # 空串按 legacy。go 时 Go 真实抓取上游、写兼容缓存并发布
      # newsnow:source-refresh:v1；Nest 预热与热点 Cron 所有权不变。
      API_GO_NEWSNOW_SOURCES_MODE: ${API_GO_NEWSNOW_SOURCES_MODE:-legacy}
      # NewsNow 热点分析与推荐两路（需 items.read；自动导入需 items.write）。
      # 空串按 legacy；go 由 Go 计算并返回，要求 JWT/MySQL/Redis/Mongo 与
      # 既有 LiteLLM 网关配置。回滚只把本变量改回 legacy。
      API_GO_NEWSNOW_HOTTEST_MODE: ${API_GO_NEWSNOW_HOTTEST_MODE:-legacy}
      # NewsNow 两个后台任务（热点 10 分钟、来源预热 1 分钟）。Nest 与 Go
      # 注入同一变量；go 时 Nest 在领取时间片/加锁前返回，Go 运行两个调度。
      API_GO_NEWSNOW_BACKGROUND_MODE: ${API_GO_NEWSNOW_BACKGROUND_MODE:-legacy}
      # 知识图谱自动构建所有权。空串按 legacy 处理；非法值在 Nest 与 Go 都启动失败。
      # 默认 legacy=保留 NestJS 每 5 分钟 Cron；go=Go 领取同一 tick gate、按组织锁
      # 构建图谱，NestJS Cron 在领取时间片前退出。Nest 与 Go 注入同一变量。
      API_GO_KNOWLEDGE_GRAPH_INGESTION_MODE: ${API_GO_KNOWLEDGE_GRAPH_INGESTION_MODE:-legacy}
      # 新闻事件入库所有权。空串按 legacy 处理；非法值在 Nest 与 Go 都启动失败。
      # 默认 legacy=保留 NestJS 每 5 分钟 Cron；go=Go 领取同一 tick gate、持有同一
      # 组织锁、读共享游标并写入事件/条目/TaskLog/失败分组，NestJS Cron 在领取
      # 时间片前退出。Nest 与 Go 注入同一变量；NEWS_EVENTS_INGESTION_SETTLE_MS
      # 只由 Go 读取。
      API_GO_NEWS_EVENTS_INGESTION_MODE: ${API_GO_NEWS_EVENTS_INGESTION_MODE:-legacy}
      NEWS_EVENTS_INGESTION_SETTLE_MS: ${NEWS_EVENTS_INGESTION_SETTLE_MS:-120000}
      # 新闻事件聚类失败的 LLM 补救链与新闻—指标关联刷新。四个开关互相独立，
      # 默认 legacy；worker 与 6 小时 cron 开关 Nest 也读取，为 go 时 Nest 在
      # 领取锁/创建 Worker 之前退出。手动入队与 GraphQL mutation 只在 Go 读取。
      API_GO_NEWS_CLUSTERING_LLM_BACKFILL_MODE: ${API_GO_NEWS_CLUSTERING_LLM_BACKFILL_MODE:-legacy}
      API_GO_NEWS_CLUSTERING_RECOVERY_WORKER_MODE: ${API_GO_NEWS_CLUSTERING_RECOVERY_WORKER_MODE:-legacy}
      API_GO_GRAPHQL_NEWS_INDICATOR_REFRESH_MODE: ${API_GO_GRAPHQL_NEWS_INDICATOR_REFRESH_MODE:-legacy}
      API_GO_NEWS_INDICATOR_ASSOCIATION_CRON_MODE: ${API_GO_NEWS_INDICATOR_ASSOCIATION_CRON_MODE:-legacy}
      # 归档准备 worker（archivePreparation，并发 1）。Nest 与 Go 同一变量；
      # go 时 Nest 不建 Worker，由 api-go 消费。切换先 api 后 api-go。
      API_GO_ARCHIVE_PREPARATION_WORKER_MODE: ${API_GO_ARCHIVE_PREPARATION_WORKER_MODE:-legacy}
      # 条目流水线 worker（itemPipeline）执行权。Nest 与 Go 同一变量；go 时
      # Nest 不建 Worker，由 api-go 消费。切换先 api 后 api-go，回退相反。
      API_GO_ITEM_PIPELINE_WORKER_MODE: ${API_GO_ITEM_PIPELINE_WORKER_MODE:-legacy}
      # 按组织队列统计（Nest 的 queue-org-stats.tracker.ts 直接读该变量）的
      # 读取权。默认 legacy 保留 NestJS 的 6 个 QueueEvents 监听；go 时 Nest
      # 不再注册这些监听，由 api-go 的 queueorgstats 读同一条
      # bull:itemPipeline:events 流并用 Redis 租约保证单实例。切换先 api 侧
      # 设 go 重启，再 api-go 侧设 go 重启（runbook 4E-2），回退顺序相反。
      API_GO_QUEUE_ORG_STATS_MODE: ${API_GO_QUEUE_ORG_STATS_MODE:-legacy}
      # 分类质量报告创建、队列消费权、流水线运行记录与两条写接口。各开关互相
      # 独立，默认 legacy。worker/清理/复核样本/启动对齐开关 Nest 与 Go 都读：
      # go 时 Nest 不再启动对应的定时器、监听或启动对齐。指标与写接口只需切
      # api-go 的开关。
      API_GO_CLASSIFICATION_REPORTS_MODE: ${API_GO_CLASSIFICATION_REPORTS_MODE:-legacy}
      API_GO_CLASSIFICATION_QUALITY_WORKER_MODE: ${API_GO_CLASSIFICATION_QUALITY_WORKER_MODE:-legacy}
      API_GO_PIPELINE_RECOVERY_MODE: ${API_GO_PIPELINE_RECOVERY_MODE:-legacy}
      # 保留任务清理、分类复核样本触发、流水线恢复写、指标端点与启动对齐。
      # 后四项见 .env.sample 的说明；后台类切换先 api=go 再 api-go=go，回退反向。
      API_GO_BULLMQ_CLEANUP_MODE: ${API_GO_BULLMQ_CLEANUP_MODE:-legacy}
      API_GO_CLASSIFICATION_REVIEW_SEED_MODE: ${API_GO_CLASSIFICATION_REVIEW_SEED_MODE:-legacy}
      API_GO_PIPELINE_RECOVERY_WRITE_MODE: ${API_GO_PIPELINE_RECOVERY_WRITE_MODE:-legacy}
      API_GO_METRICS_MODE: ${API_GO_METRICS_MODE:-legacy}
      API_GO_STARTUP_RECONCILE_MODE: ${API_GO_STARTUP_RECONCILE_MODE:-legacy}
      # AI 助手执行权。提交/删除 Mutation 的 Go 接管与 worker 消费是两个独立
      # 开关，只接受空串/legacy/go，非法值启动失败。默认均 legacy：四个
      # Mutation 与 assistant worker 都仍由 NestJS 处理。切换 worker 前先把
      # 本服务的 worker 开关设为 go 并重启，再把 api-go 的设为 go。
      API_GO_GRAPHQL_ASSISTANT_WRITE_MODE: ${API_GO_GRAPHQL_ASSISTANT_WRITE_MODE:-legacy}
      API_GO_ASSISTANT_WORKER_MODE: ${API_GO_ASSISTANT_WORKER_MODE:-legacy}
      # 态势监控 GDELT 外部快照 15 分钟重建的执行权。空串按 legacy 处理；非法值在
      # Nest 与 Go 都启动失败。默认 legacy=NestJS @Cron 持有；go=Go 定时重建，
      # NestJS @Cron 在加锁前返回。两侧共用同一把 Redis 锁，切换不会并发重建。
      # 只控制定时重建；强制刷新入口另有 API_GO_GDELT_SNAPSHOT_REFRESH_MODE（仅
      # api-go 读取）。
      API_GO_GDELT_SNAPSHOT_MODE: ${API_GO_GDELT_SNAPSHOT_MODE:-legacy}
      # 新闻源 30 秒定时调度与 4 条运维 POST（dispatch/cancel-queued/
      # clear-inflight/retry-latest）的执行权。两个开关互相独立，空串按
      # legacy；非法值 Nest 与 Go 都启动失败。默认 legacy=NestJS 持有；go 时
      # 定时循环由 api-go 执行，本服务 @Cron 在加锁前返回。切换先改本服务再改
      # api-go，回滚按相反顺序。两侧共用 cron:news-source-scheduler 锁与按
      # WINDOW 的 dispatch 去重键。
      API_GO_NEWS_SOURCE_SCHEDULER_MODE: ${API_GO_NEWS_SOURCE_SCHEDULER_MODE:-legacy}
      API_GO_NEWS_SOURCE_OPS_MODE: ${API_GO_NEWS_SOURCE_OPS_MODE:-legacy}
      # 新闻源调度的数值配置（与 api-go 同名同默认；Nest 侧始终读取）。
      NEWS_SOURCE_SCHEDULER_ENABLED: ${NEWS_SOURCE_SCHEDULER_ENABLED:-true}
      NEWS_SOURCE_SCHEDULER_BATCH_SIZE: ${NEWS_SOURCE_SCHEDULER_BATCH_SIZE:-20}
      NEWS_SOURCE_SCHEDULER_LOCK_TTL_MS: ${NEWS_SOURCE_SCHEDULER_LOCK_TTL_MS:-120000}
      NEWS_SOURCE_SCHEDULER_INFLIGHT_LOOKBACK_MS: ${NEWS_SOURCE_SCHEDULER_INFLIGHT_LOOKBACK_MS:-21600000}
      NEWS_SOURCE_SCHEDULER_INFLIGHT_RESCHEDULE_DELAY_MS: ${NEWS_SOURCE_SCHEDULER_INFLIGHT_RESCHEDULE_DELAY_MS:-300000}
      NEWS_SOURCE_SCHEDULER_JITTER_MAX_MS: ${NEWS_SOURCE_SCHEDULER_JITTER_MAX_MS:-60000}
      NEWS_SOURCE_SCHEDULER_MAX_ENQUEUE_PER_TICK: ${NEWS_SOURCE_SCHEDULER_MAX_ENQUEUE_PER_TICK:-100}
      NEWS_SOURCE_SCHEDULER_BACKPRESSURE_MAX_PENDING_JOBS: ${NEWS_SOURCE_SCHEDULER_BACKPRESSURE_MAX_PENDING_JOBS:-100}
      NEWS_SOURCE_SCHEDULER_BACKPRESSURE_DELAY_MS: ${NEWS_SOURCE_SCHEDULER_BACKPRESSURE_DELAY_MS:-300000}
      NEWS_SOURCE_SCHEDULER_FAILURE_RECOVERY_DELAY_MS: ${NEWS_SOURCE_SCHEDULER_FAILURE_RECOVERY_DELAY_MS:-600000}
      NEWS_SOURCE_SCHEDULER_FAILURE_MAX_DELAY_MS: ${NEWS_SOURCE_SCHEDULER_FAILURE_MAX_DELAY_MS:-21600000}
      NEWS_SOURCE_SCHEDULER_CIRCUIT_BREAKER_THRESHOLD: ${NEWS_SOURCE_SCHEDULER_CIRCUIT_BREAKER_THRESHOLD:-3}
      NEWS_SOURCE_SCHEDULER_CIRCUIT_BREAKER_BASE_DELAY_MS: ${NEWS_SOURCE_SCHEDULER_CIRCUIT_BREAKER_BASE_DELAY_MS:-3600000}
      NEWS_SOURCE_SCHEDULER_CIRCUIT_BREAKER_MAX_DELAY_MS: ${NEWS_SOURCE_SCHEDULER_CIRCUIT_BREAKER_MAX_DELAY_MS:-86400000}
      # 采集维护四个 Cron 与审计保留清理的执行权。空串按 legacy；非法值在
      # Nest 与 Go 都启动失败。legacy=NestJS @Cron；go=Go 定时执行，Nest 在读取
      # 活动计数或领取同名 Redis 锁/tick gate 之前返回。Nest 与 Go 注入同一组值。
      API_GO_CRAWL_MAINTENANCE_MODE: ${API_GO_CRAWL_MAINTENANCE_MODE:-legacy}
      API_GO_AUDIT_LOG_RETENTION_MODE: ${API_GO_AUDIT_LOG_RETENTION_MODE:-legacy}
      CRAWL_TASK_JANITOR_ENABLED: ${CRAWL_TASK_JANITOR_ENABLED:-true}
      CRAWL_TASK_RUNNING_TIMEOUT_MS: ${CRAWL_TASK_RUNNING_TIMEOUT_MS:-1800000}
      CRAWL_TASK_QUEUED_TIMEOUT_MS: ${CRAWL_TASK_QUEUED_TIMEOUT_MS:-43200000}
      CRAWL_TASK_JANITOR_BATCH_SIZE: ${CRAWL_TASK_JANITOR_BATCH_SIZE:-50}
      CRAWL_TASK_JANITOR_QUEUE_SCAN_LIMIT: ${CRAWL_TASK_JANITOR_QUEUE_SCAN_LIMIT:-5000}
      CRAWL_TASK_JANITOR_LOCK_TTL_MS: ${CRAWL_TASK_JANITOR_LOCK_TTL_MS:-120000}
      # 新闻事件时间线（每 10 分钟）与情绪快照（每小时）重建的执行权。空串按
      # legacy 处理；非法值在 Nest 与 Go 都启动失败。legacy=NestJS @Cron 持有；
      # go=Go 定时重建，NestJS @Cron 在取 tick gate 前返回。两侧共用同名 tick
      # gate 与组织锁，切换不会并发重建同一组织。两个开关相互独立，都要求
      # DATABASE_URL、REDIS_HOST、MONGO_URI，不要求 JWT。
      API_GO_NEWS_EVENTS_TIMELINE_MODE: ${API_GO_NEWS_EVENTS_TIMELINE_MODE:-legacy}
      API_GO_SENTIMENT_SNAPSHOT_MODE: ${API_GO_SENTIMENT_SNAPSHOT_MODE:-legacy}
      # 实时信号采集 Cron（每分钟）的执行权。空串按 legacy 处理；非法值在 Nest 与
      # Go 都启动失败。默认 legacy=NestJS @Cron 持有；go=Go 每分钟采集 8 个数据源，
      # NestJS @Cron 在领取共享 tick gate 前返回（全量航班抓取随同停止）。两侧共用
      # cron:realtime-signals:tick-gate 与 lock:cron:realtime-signals:org:{orgId}，
      # 切换不会重复采集或重复预扣 OpenSky 额度。go 要求 DATABASE_URL、REDIS_HOST、
      # MONGO_URI，不要求 JWT。
      API_GO_REALTIME_SIGNALS_MODE: ${API_GO_REALTIME_SIGNALS_MODE:-legacy}
      # 告警队列（scan / 规则评估 / 站内通知 / 邮件与 Webhook 投递）的执行权。
      # 空串按 legacy 处理；非法值在 Nest 与 Go 都启动失败。默认 legacy=保留
      # NestJS AlertsProcessor；go=Go 消费 alerts 队列，Nest 处理器只保留幂等的
      # 定时计划并在创建 Worker 前退出，告警实时推送改由 Go 的
      # alert:notifications:v1 桥接通道驱动。Nest 与 Go 注入同一变量。
      # go 要求 DATABASE_URL、REDIS_HOST、MONGO_URI 与 SMTP_*（站内通知、邮件
      # 与 Webhook 都由 Go 产生）；模型服务可选，缺失时经济异常规则回退本地检测。
      API_GO_ALERT_WORKER_MODE: ${API_GO_ALERT_WORKER_MODE:-legacy}
      # Frontier LLM 判定/学习队列执行权。空串按 legacy 处理；非法值在 Nest
      # 与 Go 都启动失败。默认 legacy 保留 NestJS 的两个 LLM Worker；go 时
      # Nest 只跳过这两个 worker（三个爬取队列 worker 仍由 Nest 执行），Go
      # 消费两个队列（并发 1、限速 1/1000ms，共用同一 limiter 键）。go 要求
      # DATABASE_URL、REDIS_HOST 与 SYSTEM_SETTINGS_ENCRYPTION_KEY。
      API_GO_CRAWL_FRONTIER_LLM_WORKER_MODE: ${API_GO_CRAWL_FRONTIER_LLM_WORKER_MODE:-legacy}
      # 三个爬取队列 worker（crawl4ai / crawl4ai-hot / crawl4ai-normal）的
      # 执行权。空串与 legacy 等价，非法值在 Nest 与 Go 都启动失败。默认
      # legacy=三个 Worker、QueueEvents 与 C2 订阅都由 NestJS 创建；go=NestJS
      # 不再创建这三者，由 Go 消费（共享并发限制器 hot 优先、meta 全局并发、
      # 队列级 limiter、C2 广播、按队列等级超时、内存压力冷却重排队、副作用
      # 恰好一次、统一通知中继）。go 要求 DATABASE_URL、REDIS_HOST、
      # MONGO_URI、CRAWL4AI_BASE_URL、SYSTEM_SETTINGS_ENCRYPTION_KEY，并在
      # 接线时有非 nil 的 crawlfrontiernode processor。
      API_GO_CRAWL_WORKER_MODE: ${API_GO_CRAWL_WORKER_MODE:-legacy}
      # ALERT_* 与 BULLMQ_NAMESPACE 与 NestJS 同源同名（同一份默认值），
      # 只在 API_GO_ALERT_WORKER_MODE=go 时被 Go 读取。
      BULLMQ_NAMESPACE: ${BULLMQ_NAMESPACE:-modular}
      ALERT_QUEUE_CONCURRENCY: ${ALERT_QUEUE_CONCURRENCY:-4}
      ALERT_WEBHOOK_TIMEOUT_MS: ${ALERT_WEBHOOK_TIMEOUT_MS:-5000}
      ALERT_SCAN_INTERVAL_MS: ${ALERT_SCAN_INTERVAL_MS:-300000}
      ALERT_NOTIFY_GLOBAL_PER_SECOND: ${ALERT_NOTIFY_GLOBAL_PER_SECOND:-10}
      ALERT_NOTIFY_EMAIL_PER_SECOND: ${ALERT_NOTIFY_EMAIL_PER_SECOND:-2}
      ALERT_NOTIFY_WEBHOOK_PER_SECOND: ${ALERT_NOTIFY_WEBHOOK_PER_SECOND:-10}
      ALERT_NOTIFY_PER_CHANNEL_PER_SECOND: ${ALERT_NOTIFY_PER_CHANNEL_PER_SECOND:-2}
      ALERT_NOTIFY_LIMITER_TTL_MS: ${ALERT_NOTIFY_LIMITER_TTL_MS:-60000}
      # 分析三写与 analysis 队列消费者所有权。空串按 legacy；非法值 Nest/Go 都启动失败。
      # 三写请求模式需要 JWT/DATABASE_URL/REDIS_HOST/MONGO_URI；worker 模式需要
      # DATABASE_URL/REDIS_HOST/MONGO_URI 与 GRAPHQL_SUBSCRIPTION_BUS=redis，不要求 JWT。
      # BULLMQ_WORKERS_ENABLED=false 时两端都不启动 analysis 消费。
      API_GO_ANALYSIS_RUNS_MODE: ${API_GO_ANALYSIS_RUNS_MODE:-legacy}
      API_GO_ANALYSIS_WORKER_MODE: ${API_GO_ANALYSIS_WORKER_MODE:-legacy}
      COREPACK_NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      npm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      pnpm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:${API_HOST_PORT:-4000}:4000"
    logging: *json-file-logging
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ais-relay:
        condition: service_healthy
      akshare:
        condition: service_healthy
      model-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/healthz/live"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

  vector:
    <<: *app-hardening
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        API_BASE_URL: ${API_BASE_URL:-http://api:4000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_GRAPHQL_APQ_ENABLED: ${NEXT_PUBLIC_GRAPHQL_APQ_ENABLED:-true}
        NEXT_PUBLIC_NOTIFICATIONS_SOCKET_PATH: ${NEXT_PUBLIC_NOTIFICATIONS_SOCKET_PATH:-/socket.io}
        NEXT_PUBLIC_REALTIME_SOCKET_PATH: ${NEXT_PUBLIC_REALTIME_SOCKET_PATH:-/socket.io}
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -ec "
      echo '[vector] starting runtime server...';
      exec pnpm --filter @modular/vector run start
      "
    env_file:
      - ./.env
    environment:
      PORT: 4010
      NODE_ENV: production
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      VECTOR_INTERNAL_TOKEN: ${VECTOR_INTERNAL_TOKEN:-dev-token}
      HUSKY: "0"
      COREPACK_NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      npm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      pnpm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:4010:4010"
    logging: *json-file-logging
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4010/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  # vector-go：Go 重写试点（Strangler Fig 迁移序 1）。
  # 独立 go-pilot profile——默认部署不启动该服务，NestJS vector 仍是事实源。
  # 切换：把 api 的 vector 服务配置（VECTOR_SERVICE_BASE_URL / 系统设置）
  # 指向 http://vector-go:4010；回滚：指回 http://vector:4010（NestJS 版）。
  # 健康检查在宿主侧执行（distroless 镜像无 curl）：见 go-pilot 的 CI job。
  vector-go:
    <<: *app-hardening
    profiles: ["go-pilot"]
    build:
      context: ../..
      dockerfile: infra/docker/vector-go.Dockerfile
      args:
        GO_IMAGE: ${VECTOR_GO_IMAGE:-golang:1.27}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4010
      VECTOR_INTERNAL_TOKEN: ${VECTOR_INTERNAL_TOKEN:-dev-token}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      VECTOR_COLLECTION_PREFIX: ${VECTOR_COLLECTION_PREFIX:-processed_item_summary}
      VECTOR_QDRANT_TIMEOUT_MS: ${VECTOR_QDRANT_TIMEOUT_MS:-5000}
    ports:
      - "${DOCKER_PUBLISH_HOST:-127.0.0.1}:4011:4010"
    logging: *json-file-logging
    depends_on:
      qdrant:
        condition: service_started

  # api-go：主后端 Go 网关试点（Go-批2C：真实入口接线；Go-批3A：
  # onboarding GET 首个业务端点真实接管；Go-批3B：user-settings 六个
  # 只读 GET 统一接管）。独立 api-go-pilot profile——默认部署不启动该
  # 服务，NestJS api 仍是唯一入口（Web → api:4000）。
  #
  # 启用：docker compose --profile api-go-pilot up -d api-go
  #   （或 .env 设 COMPOSE_PROFILES=api-go-pilot 后 up -d）。
  # 切流（pilot 模式）：.env 中 API_BASE_URL=http://api-go:4020（服务端
  #   运行期），浏览器端以构建参数 NEXT_PUBLIC_API_BASE_URL 指向
  #   http://<host>:${API_GO_HOST_PORT:-4020}/api 重建 web 镜像。
  # 回滚（无数据迁移耦合，按序）：
  #   1. API_GO_DASHBOARD_WAR_MAP_MODE=legacy——events 与 news-markers 回到 NestJS；
  #   2. API_GO_DASHBOARD_CHARTS_MODE=legacy——三个图表 GET 回到 NestJS；
  #   3. API_GO_DASHBOARD_STATS_MODE=legacy——GET /api/dashboard/stats 回到 NestJS；
  #   4. API_GO_PUBLIC_PORTAL_MODE=legacy——首页、频道和故事详情回到 NestJS；
  #   5. API_GO_USER_SETTINGS_WRITE_MODE=legacy——六个 PUT 回到 NestJS；
  #   6. API_GO_USER_SETTINGS_READ_MODE=shadow——六个 GET 回到 NestJS
  #      响应 + Go 差分；
  #   7. API_BASE_URL 指回 http://api:4000（web 侧不再经 api-go）；
  #   8. 停止 api-go pilot 服务。
  # Go-批3C：pilot 同时启用读模式 go 与写模式 go。六个 PUT 写入同一
  # UserSetting 表、同一八个 key。登录/refresh/logout/MFA/OIDC/机器令牌
  # 及其余路由仍由 NestJS 承载。CANARY_PERCENT 固定 0。
  # DATABASE_URL 由与 NestJS api 相同的 MYSQL_* 值派生——同一真实
  # MySQL，不复制数据、不引入第二个 NestJS；Redis/JWT 配置与 api 服务
  # 同源（同一 Redis 实例查 blacklist、同一 secret 验签）。
  api-go:
    <<: *app-hardening
    profiles: ["api-go-pilot"]
    build:
      context: ../..
      dockerfile: infra/docker/api-go.Dockerfile
      args:
        GO_IMAGE: ${API_GO_IMAGE:-golang:1.27}
    restart: unless-stopped
    environment:
      PORT: 4020
      LEGACY_API_URL: http://api:4000
      # Realtime GraphQL subscriptions are an independent takeover: default
      # legacy keeps every upgrade on the legacy proxy. go needs JWT, MySQL and
      # Redis only and must share the Nest producers' Redis bus.
      API_GO_GRAPHQL_SUBSCRIPTIONS_MODE: ${API_GO_GRAPHQL_SUBSCRIPTIONS_MODE:-legacy}
      # Dedicated Go Socket.IO transport for /notifications. Default legacy
      # leaves every Socket.IO namespace on the NestJS path.
      API_GO_NOTIFICATIONS_SOCKET_MODE: ${API_GO_NOTIFICATIONS_SOCKET_MODE:-legacy}
      # Realtime Socket.IO transport for the newsnow/quality/ops/queue/
      # situation-monitor namespaces and the classification quality alert
      # scheduler. Nest reads both switches too, so the api service must carry
      # the same values; legacy keeps every namespace on the NestJS path.
      API_GO_REALTIME_SOCKET_MODE: ${API_GO_REALTIME_SOCKET_MODE:-legacy}
      API_GO_CLASSIFICATION_QUALITY_ALERT_MODE: ${API_GO_CLASSIFICATION_QUALITY_ALERT_MODE:-legacy}
      WS_MAX_CONNECTIONS_PER_USER: ${WS_MAX_CONNECTIONS_PER_USER:-5}
      WS_MAX_CONNECTIONS_PER_IP: ${WS_MAX_CONNECTIONS_PER_IP:-50}
      WS_CONNECT_RATE_LIMIT_PER_IP: ${WS_CONNECT_RATE_LIMIT_PER_IP:-60}
      WS_CONNECT_RATE_LIMIT_PER_USER: ${WS_CONNECT_RATE_LIMIT_PER_USER:-30}
      WS_CONNECT_RATE_LIMIT_WINDOW_SECONDS: ${WS_CONNECT_RATE_LIMIT_WINDOW_SECONDS:-60}
      # The /newsnow namespace is relayed from the Socket.IO Redis adapter
      # broadcast channel, so api-go must see the same adapter switch and key as
      # the api service. Defaults mirror config.service.ts (enabled, "socket.io").
      WS_REDIS_ADAPTER_ENABLED: ${WS_REDIS_ADAPTER_ENABLED:-true}
      WS_REDIS_ADAPTER_KEY: ${WS_REDIS_ADAPTER_KEY:-socket.io}
      GRAPHQL_SUBSCRIPTION_BUS: ${GRAPHQL_SUBSCRIPTION_BUS:-redis}
      DATABASE_URL: mysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD}@mysql:${MYSQL_PORT:-3306}/${MYSQL_DB}
      # The OIDC login unit builds the web callback from NEXTAUTH_URL and the
      # IdP redirect_uri from API_BASE_URL. Both keep the same values the api
      # service uses; API_BASE_URL is only read per request.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://api:4000}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # pilot 明确接管六个 user-settings 只读 GET（Go-批3B 统一读模式，
      # 优先级高于 API_GO_ONBOARDING_MODE；默认部署不启动本服务；手工
      # 裸启 api-go 时该变量未设——旧行为不变：onboarding 由
      # API_GO_ONBOARDING_MODE 控制，rss/spacetime shadow，其余 legacy）。
      API_GO_USER_SETTINGS_READ_MODE: go
      # 六个 PUT 写接管（Go-批3C）。必须与读模式同为 go；改回 legacy 即回滚写路径。
      API_GO_USER_SETTINGS_WRITE_MODE: go
      # 公开首页、频道和两个故事详情（Go-批4A/4B）。默认部署不启动本服务；
      # 未设置或 legacy 时这些 GET 仍代理 NestJS。启用 go 前应确认模型网关
      # 配置可用；缓存缺失时的真实模型调用尚未验证。回滚 = 改回 legacy。
      API_GO_PUBLIC_PORTAL_MODE: go
      # GET /api/dashboard/stats（Go-批5A）。只这一条精确 GET。
      # MONGO_URI 与 NestJS 相同（主机名在 compose 网络内可解析）。
      # 改回 legacy 即把该 GET 交回 NestJS。不复制数据。
      API_GO_DASHBOARD_STATS_MODE: go
      # 三个图表 GET（Go-批5B）。只这些精确 GET。不读 Mongo。
      # 改回 legacy 即交回 NestJS。不复制经济数据，不新建抓取任务。
      API_GO_DASHBOARD_CHARTS_MODE: go
      # war-map events 与 news-markers（Go-批5C）。只这两条精确 GET。
      # 改回 legacy 即交回 NestJS。不复制告警或新闻数据。
      API_GO_DASHBOARD_WAR_MAP_MODE: go
      # 个人内容订阅、行为画像、每日摘要（Go-批7）。pilot 默认仍交给 NestJS。
      # 三个变量各自改成 go 才切换对应 HTTP。内部服务不看另外两个开关。
      API_GO_CONTENT_SUBSCRIPTIONS_MODE: legacy
      API_GO_USER_NEWS_BEHAVIOR_MODE: legacy
      API_GO_USER_DIGEST_MODE: legacy
      # 每日摘要后台投递所有权。与上面三个 HTTP 开关独立；delivery-only 时上述
      # 全部 legacy 也能运行。go 要求 DATABASE_URL、REDIS_HOST、MONGO_URI 和
      # SMTP_*，不要求 JWT_SECRET。默认 legacy；切换/回滚顺序见 docs 与 README。
      API_GO_USER_DIGEST_DELIVERY_MODE: ${API_GO_USER_DIGEST_DELIVERY_MODE:-legacy}
      # 审计日志失败补偿链（AUDIT-OUTBOX-001）。只开本变量即可由 Go 消费：
      # 需要 DATABASE_URL 与 REDIS_HOST，不要求 JWT/Mongo/SMTP，也不强开任何
      # HTTP 模式。Nest 与 Go 注入同一变量，默认 legacy 仍由 NestJS Cron 消费。
      API_GO_AUDIT_OUTBOX_MODE: ${API_GO_AUDIT_OUTBOX_MODE:-legacy}
      # processed_item MongoOutbox 补偿链所有权。空串按 legacy；go=Go 每 5 分钟
      # 扫描并按时间预算分批并发补偿，Nest 的定时扫描在申请锁前退出。立即投递与
      # 进程内重试仍归 Nest。go 需要 MySQL、Redis、Mongo；回滚改回 legacy。
      API_GO_PROCESSED_ITEM_OUTBOX_MODE: ${API_GO_PROCESSED_ITEM_OUTBOX_MODE:-legacy}
      PROCESSED_ITEM_OUTBOX_TICK_BUDGET_MS: ${PROCESSED_ITEM_OUTBOX_TICK_BUDGET_MS:-240000}
      PROCESSED_ITEM_OUTBOX_CONCURRENCY: ${PROCESSED_ITEM_OUTBOX_CONCURRENCY:-4}
      PROCESSED_ITEM_OUTBOX_BATCH_SIZE: ${PROCESSED_ITEM_OUTBOX_BATCH_SIZE:-10}
      # 采集维护四个 Cron 由 Go 执行时需要的共享资源：DATABASE_URL 已在上方，
      # Redis/Mongo 与 Nest 同源。审计保留清理同样只需 DATABASE_URL 与 Redis。
      # 变量与 api 服务同名同默认值，切换时两侧读到同一组阈值。
      API_GO_CRAWL_MAINTENANCE_MODE: ${API_GO_CRAWL_MAINTENANCE_MODE:-legacy}
      API_GO_AUDIT_LOG_RETENTION_MODE: ${API_GO_AUDIT_LOG_RETENTION_MODE:-legacy}
      CRAWL_TASK_JANITOR_ENABLED: ${CRAWL_TASK_JANITOR_ENABLED:-true}
      CRAWL_TASK_RUNNING_TIMEOUT_MS: ${CRAWL_TASK_RUNNING_TIMEOUT_MS:-1800000}
      CRAWL_TASK_QUEUED_TIMEOUT_MS: ${CRAWL_TASK_QUEUED_TIMEOUT_MS:-43200000}
      CRAWL_TASK_JANITOR_BATCH_SIZE: ${CRAWL_TASK_JANITOR_BATCH_SIZE:-50}
      CRAWL_TASK_JANITOR_QUEUE_SCAN_LIMIT: ${CRAWL_TASK_JANITOR_QUEUE_SCAN_LIMIT:-5000}
      CRAWL_TASK_JANITOR_LOCK_TTL_MS: ${CRAWL_TASK_JANITOR_LOCK_TTL_MS:-120000}
      # NewsNow 来源获取两路（公开）：GET /api/news-aggregator/source 与
      # POST /api/news-aggregator/sources/batch。pilot 默认仍交 NestJS；
      # go 只接管这两条精确路由（无 JWT/Mongo 依赖），Nest 预热与热点
      # Cron 继续运行。回滚只把本变量改回 legacy。
      API_GO_NEWSNOW_SOURCES_MODE: ${API_GO_NEWSNOW_SOURCES_MODE:-legacy}
      # NewsNow 热点分析与推荐两路（需 items.read；自动导入需 items.write）。
      # pilot 默认仍交 NestJS；go 由 Go 计算并返回，要求 JWT/MySQL/Redis/Mongo
      # 与既有 LiteLLM 网关配置。回滚只把本变量改回 legacy。
      API_GO_NEWSNOW_HOTTEST_MODE: ${API_GO_NEWSNOW_HOTTEST_MODE:-legacy}
      # NewsNow 两个后台任务（热点 10 分钟、来源预热 1 分钟）。Nest 与 Go
      # 注入同一变量；go 时 Nest 在领取时间片/加锁前返回，Go 运行两个调度。
      # 两侧共用同一组缓存、锁与时间片，切换中不会对同一组织并发刷新。
      API_GO_NEWSNOW_BACKGROUND_MODE: ${API_GO_NEWSNOW_BACKGROUND_MODE:-legacy}
      # raw_item 失败补偿的定时重放所有权。与条目写/读开关独立；默认 legacy。
      # go 时 NestJS Cron 在申请锁前退出，Go 每分钟扫描并投递。Nest 与 Go 注入
      # 同一变量；SCHEDULE_ENABLED=false 时两边都停止定时重放，但请求内即时投递
      # 不受影响。回滚只把该变量改回 legacy。
      API_GO_RAW_ITEM_OUTBOX_MODE: ${API_GO_RAW_ITEM_OUTBOX_MODE:-legacy}
      SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-true}
      # 经济数据的三个 Mutation、三个管理 HTTP 与 akshare-data 消费所有权。
      # 两个开关独立，空串按 legacy；worker=go 时 NestJS 跳过目录/重复任务
      # 初始化且不再创建 Worker，只有 Go 消费。回滚先停 Go worker 再改回 legacy。
      API_GO_ECONOMIC_DATA_MODE: ${API_GO_ECONOMIC_DATA_MODE:-legacy}
      API_GO_ECONOMIC_DATA_WORKER_MODE: ${API_GO_ECONOMIC_DATA_WORKER_MODE:-legacy}
      AKSHARE_ENABLED: ${AKSHARE_ENABLED:-true}
      AKSHARE_HTTP_BASE_URL: ${AKSHARE_HTTP_BASE_URL:-http://akshare:8081}
      AKSHARE_HTTP_TIMEOUT_MS: ${AKSHARE_HTTP_TIMEOUT_MS:-20000}
      AKSHARE_HTTP_MAX_RETRIES: ${AKSHARE_HTTP_MAX_RETRIES:-3}
      AKSHARE_ADMIN_TOKEN: ${AKSHARE_ADMIN_TOKEN:-}
      AKSHARE_QUEUE_CONCURRENCY: ${AKSHARE_QUEUE_CONCURRENCY:-2}
      AKSHARE_SCHEDULE_SMOOTHING_ENABLED: ${AKSHARE_SCHEDULE_SMOOTHING_ENABLED:-false}
      AKSHARE_SKIP_UNCHANGED_LATEST_POINTS: ${AKSHARE_SKIP_UNCHANGED_LATEST_POINTS:-false}
      # 知识图谱自动构建所有权。与所有 HTTP / GraphQL 读开关独立；go 要求
      # DATABASE_URL 与 REDIS_HOST，不要求 JWT 或 MONGO_URI。Nest 与 Go 同一变量。
      API_GO_KNOWLEDGE_GRAPH_INGESTION_MODE: ${API_GO_KNOWLEDGE_GRAPH_INGESTION_MODE:-legacy}
      # 新闻事件入库所有权。空串按 legacy 处理；非法值在 Nest 与 Go 都启动失败。
      # 默认 legacy=保留 NestJS 每 5 分钟 Cron；go=Go 领取同一 tick gate、持有同一
      # 组织锁、读共享游标并写入事件/条目/TaskLog/失败分组，NestJS Cron 在领取
      # 时间片前退出。Nest 与 Go 注入同一变量；NEWS_EVENTS_INGESTION_SETTLE_MS
      # 只由 Go 读取。
      API_GO_NEWS_EVENTS_INGESTION_MODE: ${API_GO_NEWS_EVENTS_INGESTION_MODE:-legacy}
      NEWS_EVENTS_INGESTION_SETTLE_MS: ${NEWS_EVENTS_INGESTION_SETTLE_MS:-120000}
      # 新闻事件聚类失败的 LLM 补救链与新闻—指标关联刷新。四个开关互相独立，
      # 默认 legacy；worker 与 6 小时 cron 开关 Nest 也读取，为 go 时 Nest 在
      # 领取锁/创建 Worker 之前退出。手动入队与 GraphQL mutation 只在 Go 读取。
      API_GO_NEWS_CLUSTERING_LLM_BACKFILL_MODE: ${API_GO_NEWS_CLUSTERING_LLM_BACKFILL_MODE:-legacy}
      API_GO_NEWS_CLUSTERING_RECOVERY_WORKER_MODE: ${API_GO_NEWS_CLUSTERING_RECOVERY_WORKER_MODE:-legacy}
      API_GO_GRAPHQL_NEWS_INDICATOR_REFRESH_MODE: ${API_GO_GRAPHQL_NEWS_INDICATOR_REFRESH_MODE:-legacy}
      API_GO_NEWS_INDICATOR_ASSOCIATION_CRON_MODE: ${API_GO_NEWS_INDICATOR_ASSOCIATION_CRON_MODE:-legacy}
      # 归档准备 worker（archivePreparation，并发 1）。Nest 与 Go 同一变量；
      # go 时 Nest 不建 Worker，由 api-go 消费。切换先 api 后 api-go。
      API_GO_ARCHIVE_PREPARATION_WORKER_MODE: ${API_GO_ARCHIVE_PREPARATION_WORKER_MODE:-legacy}
      # 条目流水线 worker（itemPipeline）执行权。Nest 与 Go 同一变量；go 时
      # Nest 不建 Worker，由 api-go 消费。切换先 api 后 api-go，回退相反。
      API_GO_ITEM_PIPELINE_WORKER_MODE: ${API_GO_ITEM_PIPELINE_WORKER_MODE:-legacy}
      # 告警队列（scan / 规则评估 / 站内通知 / 邮件与 Webhook 投递）的执行权。
      # 空串按 legacy 处理；非法值在 Nest 与 Go 都启动失败。默认 legacy=保留
      # NestJS AlertsProcessor；go=Go 消费 alerts 队列，Nest 处理器只保留幂等的
      # 定时计划并在创建 Worker 前退出，告警实时推送改由 Go 的
      # alert:notifications:v1 桥接通道驱动。Nest 与 Go 注入同一变量。
      # go 要求 DATABASE_URL、REDIS_HOST、MONGO_URI 与 SMTP_*（站内通知、邮件
      # 与 Webhook 都由 Go 产生）；模型服务可选，缺失时经济异常规则回退本地检测。
      API_GO_ALERT_WORKER_MODE: ${API_GO_ALERT_WORKER_MODE:-legacy}
      # 队列运维控制台与 DLQ 处置（Go-only 界面，路径 /api/admin/queue-ops/*）。
      # 默认 legacy 不注册任何路由（保持 404）。go 时由 Go 提供队列/任务浏览、
      # 暂停/恢复、单条与批量重放、DLQ 重放与删除，并把鉴权收紧为平台管理员
      # + queue.manage；Bull Board 与 /admin/queues 的代理规则不变。
      # 要求 JWT_SECRET、DATABASE_URL、REDIS_HOST。
      API_GO_QUEUE_OPS_MODE: ${API_GO_QUEUE_OPS_MODE:-legacy}
      # 按组织队列统计读取权。Nest 与 Go 同读该变量：go 时 Nest 不再注册
      # 6 个 QueueEvents 监听，由 api-go 的 queueorgstats 用 Redis 租约单实例
      # 读同一条 bull:itemPipeline:events 流。切换先 api 侧 go 再 api-go 侧 go，
      # 回退顺序相反；不消费队列任务本身。
      API_GO_QUEUE_ORG_STATS_MODE: ${API_GO_QUEUE_ORG_STATS_MODE:-legacy}
      # 态势信号 worker（situationMonitorSignals：telegram-poll + oref-poll）。
      # 默认 legacy 仍由 NestJS 消费；go 时 api-go 消费队列（并发 1）、注册
      # 重复任务并发布 situation-monitor:signals:events:v1 事件桥。go 要求
      # DATABASE_URL 与 REDIS_HOST，不要求 JWT。Telegram 会话由 Redis 租约
      # 保证集群内只有一个实例持有 MTProto 连接。切换前先把 api 服务同名
      # 变量改为 go；回退最后再把 api 侧改回 legacy。
      API_GO_SITUATION_SIGNALS_WORKER_MODE: ${API_GO_SITUATION_SIGNALS_WORKER_MODE:-legacy}
      # 态势手动刷新 POST /api/situation-monitor/refresh 的执行权。默认 legacy=
      # 由 NestJS 处理；go 时由 api-go 处理，并要求本服务的
      # API_GO_SITUATION_SIGNALS_WORKER_MODE 与 API_GO_NEWS_SOURCE_SCHEDULER_MODE
      # 同为 go（否则启动失败：Telegram 会话只能由 Go 租约持有方使用，调度入口
      # 在 Go）。刷新记录键/字段/TTL 两端相同，GET refresh-runs 不受影响。
      API_GO_SITUATION_REFRESH_MODE: ${API_GO_SITUATION_REFRESH_MODE:-legacy}
      # Telegram 登录两个 POST（.../telegram-auth/start、.../complete）的执行权。
      # 默认 legacy=NestJS；go 要求 JWT_SECRET、DATABASE_URL、REDIS_HOST、
      # MONGO_URI 与 SYSTEM_SETTINGS_ENCRYPTION_KEY。待完成请求缓存格式两端
      # 相同，切换期间可以由一端发码、另一端完成。
      API_GO_SITUATION_TELEGRAM_AUTH_MODE: ${API_GO_SITUATION_TELEGRAM_AUTH_MODE:-legacy}
      # 与 api 服务同名同默认值的态势监控 env。Telegram 凭据优先读 MySQL
      # 设置行（这里只是 env 回退）；OREF 只从 env 读。默认值必须与 api 服务
      # 一致，否则 Go 的 env 回退与 Nest 不同。
      SITUATION_MONITOR_TELEGRAM_ENABLED: ${SITUATION_MONITOR_TELEGRAM_ENABLED:-false}
      SITUATION_MONITOR_TELEGRAM_API_ID: ${SITUATION_MONITOR_TELEGRAM_API_ID:-}
      SITUATION_MONITOR_TELEGRAM_API_HASH: ${SITUATION_MONITOR_TELEGRAM_API_HASH:-}
      SITUATION_MONITOR_TELEGRAM_CHANNEL_SET: ${SITUATION_MONITOR_TELEGRAM_CHANNEL_SET:-full}
      SITUATION_MONITOR_TELEGRAM_MAX_FEED_ITEMS: ${SITUATION_MONITOR_TELEGRAM_MAX_FEED_ITEMS:-200}
      SITUATION_MONITOR_TELEGRAM_MAX_TEXT_CHARS: ${SITUATION_MONITOR_TELEGRAM_MAX_TEXT_CHARS:-800}
      SITUATION_MONITOR_TELEGRAM_CHANNEL_TIMEOUT_MS: ${SITUATION_MONITOR_TELEGRAM_CHANNEL_TIMEOUT_MS:-15000}
      SITUATION_MONITOR_TELEGRAM_POLL_CYCLE_TIMEOUT_MS: ${SITUATION_MONITOR_TELEGRAM_POLL_CYCLE_TIMEOUT_MS:-180000}
      SITUATION_MONITOR_TELEGRAM_STARTUP_DELAY_MS: ${SITUATION_MONITOR_TELEGRAM_STARTUP_DELAY_MS:-60000}
      SITUATION_MONITOR_TELEGRAM_RATE_LIMIT_MS: ${SITUATION_MONITOR_TELEGRAM_RATE_LIMIT_MS:-800}
      SITUATION_MONITOR_TELEGRAM_POLL_INTERVAL_MS: ${SITUATION_MONITOR_TELEGRAM_POLL_INTERVAL_MS:-60000}
      SITUATION_MONITOR_OREF_ENABLED: ${SITUATION_MONITOR_OREF_ENABLED:-false}
      SITUATION_MONITOR_OREF_PROXY_AUTH: ${SITUATION_MONITOR_OREF_PROXY_AUTH:-}
      SITUATION_MONITOR_OREF_ALERTS_URL: ${SITUATION_MONITOR_OREF_ALERTS_URL:-https://www.oref.org.il/WarningMessages/alert/alerts.json}
