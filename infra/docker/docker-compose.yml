x-json-file-logging: &json-file-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-3}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "db.adminCommand(''ping'').ok" | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ../..
      dockerfile: infra/docker/redis.Dockerfile
      args:
        REDIS_IMAGE: ${REDIS_IMAGE:-redis:7.2}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint.sh"]
    environment:
      REDIS_AOF_CHECK_ON_START: ${REDIS_AOF_CHECK_ON_START:-true}
      REDIS_AOF_AUTO_FIX: ${REDIS_AOF_AUTO_FIX:-false}
      REDIS_AOF_PREFLIGHT_AUTO_REPAIR: ${REDIS_AOF_PREFLIGHT_AUTO_REPAIR:-true}
      REDIS_AOF_PREFLIGHT_LOG_TAIL: ${REDIS_AOF_PREFLIGHT_LOG_TAIL:-40}
      REDIS_AOF_BACKUP_KEEP: ${REDIS_AOF_BACKUP_KEEP:-5}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    logging: *json-file-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LITELLM_POSTGRES_DB:-litellm}
      POSTGRES_USER: ${LITELLM_POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:-litellm}
    ports:
      - "5432:5432"
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data
    logging: *json-file-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    logging: *json-file-logging

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    logging: *json-file-logging

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    restart: "no"
    depends_on:
      - minio
    entrypoint:
      - sh
      - -ec
      - |
        until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1; do
          echo '[minio-init] waiting for minio...';
          sleep 1;
        done;
        mc mb --ignore-existing local/$$S3_BUCKET;
        mc anonymous set download local/$$S3_BUCKET;
        echo '[minio-init] bucket initialized';
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-modular-avatars}
    logging: *json-file-logging

  akshare:
    build:
      context: ../..
      dockerfile: infra/akshare/Dockerfile
      args:
        PYTHON_IMAGE: ${AKSHARE_PYTHON_IMAGE:-python:3.11-slim}
        AKSHARE_VERSION: ${AKSHARE_VERSION:-1.18.39}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    environment:
      AKSHARE_ADMIN_TOKEN: ${AKSHARE_ADMIN_TOKEN:-}
    ports:
      - "${AKSHARE_PORT:-8081}:8081"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8081/healthz'', timeout=2).read()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  model-service:
    build:
      context: ../..
      dockerfile: infra/model-service/Dockerfile
      args:
        PYTHON_IMAGE: ${MODEL_SERVICE_PYTHON_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    environment:
      MODEL_SERVICE_INTERNAL_TOKEN: ${MODEL_SERVICE_INTERNAL_TOKEN:-dev-model-token}
    ports:
      - "${MODEL_SERVICE_PORT:-8090}:8090"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8090/healthz'', timeout=2).read()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  litellm:
    # Pin the currently verified LiteLLM image digest to avoid drifting to bad upstream releases.
    build:
      context: ../..
      dockerfile: infra/docker/litellm.Dockerfile
      args:
        LITELLM_IMAGE: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm@sha256:067aee932b8770ed42955ee802a04abdcd369d0995b5e696bb07d6520a231b1c}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      litellm-postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        if [ -z "${LITELLM_MASTER_KEY:-}" ]; then
          unset LITELLM_MASTER_KEY
        fi
        python /app/generate-litellm-config.py --input /app/config.base.yaml --output /app/config.yaml
        exec litellm --config /app/config.yaml --detailed_debug
    environment:
      DATABASE_URL: ${LITELLM_DATABASE_URL:-postgresql://litellm:litellm@litellm-postgres:5432/litellm}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_CONFIG_API_BASE: ${LITELLM_CONFIG_API_BASE:-http://api:4000/api}
      LITELLM_CONFIG_INTERNAL_TOKEN: ${LITELLM_CONFIG_INTERNAL_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_API_KEYS: ${ANTHROPIC_API_KEYS:-}
      LITELLM_ROUTING_STRATEGY: ${LITELLM_ROUTING_STRATEGY:-simple-shuffle}
      LITELLM_REDIS_HOST: ${LITELLM_REDIS_HOST:-redis}
      LITELLM_REDIS_PORT: ${LITELLM_REDIS_PORT:-6379}
      LITELLM_REDIS_PASSWORD: ${LITELLM_REDIS_PASSWORD:-}
      LITELLM_DEPLOYMENT_RPM: ${LITELLM_DEPLOYMENT_RPM:-}
      LITELLM_DEPLOYMENT_TPM: ${LITELLM_DEPLOYMENT_TPM:-}
    ports:
      - "4001:4000"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'', timeout=2).read()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  crawl4ai:
    build:
      context: ../..
      dockerfile: infra/docker/crawl4ai.Dockerfile
      args:
        CRAWL4AI_IMAGE: ${CRAWL4AI_IMAGE:-unclecode/crawl4ai:0}
    restart: unless-stopped
    working_dir: /app
    shm_size: 1g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CRAWL4AI_XVFB_ENABLED: ${CRAWL4AI_XVFB_ENABLED:-true}
      CRAWL4AI_XVFB_DISPLAY_NUM: ${CRAWL4AI_XVFB_DISPLAY_NUM:-99}
      CRAWL4AI_XVFB_SCREEN: ${CRAWL4AI_XVFB_SCREEN:-1920x1080x24}
      CRAWL4AI_SSRF_PROXY_PORT: ${CRAWL4AI_SSRF_PROXY_PORT:-18080}
      CRAWL4AI_HTTP_PROXY: ${CRAWL4AI_HTTP_PROXY:-}
      CRAWL4AI_HTTPS_PROXY: ${CRAWL4AI_HTTPS_PROXY:-}
      CRAWL4AI_NO_PROXY: ${CRAWL4AI_NO_PROXY:-localhost,127.0.0.1,crawl4ai,api,web,db,redis,host.docker.internal}
      HTTP_PROXY: ${CRAWL4AI_HTTP_PROXY:-}
      HTTPS_PROXY: ${CRAWL4AI_HTTPS_PROXY:-}
      NO_PROXY: ${CRAWL4AI_NO_PROXY:-localhost,127.0.0.1,crawl4ai,api,web,db,redis,host.docker.internal}
      http_proxy: ${CRAWL4AI_HTTP_PROXY:-}
      https_proxy: ${CRAWL4AI_HTTPS_PROXY:-}
      no_proxy: ${CRAWL4AI_NO_PROXY:-localhost,127.0.0.1,crawl4ai,api,web,db,redis,host.docker.internal}
    command:
      - sh
      - -lc
      - |
        if [ -f /app/server.py ]; then
          python - <<'PY'
        import pathlib
        import re

        version = "unknown"
        try:
            import crawl4ai.__version__ as version_module

            version = (
                getattr(version_module, "__version__", None)
                or getattr(version_module, "VERSION", None)
                or "unknown"
            )
        except Exception:
            version = "unknown"

        if isinstance(version, str) and version.strip() and version != "unknown":
            server_path = pathlib.Path("/app/server.py")
            content = server_path.read_text(encoding="utf-8")
            updated, count = re.subn(
                r'^__version__\s*=\s*["\'][^"\']*["\']',
                f'__version__ = "{version.strip()}"',
                content,
                count=1,
                flags=re.MULTILINE,
            )
            if count > 0:
                server_path.write_text(updated, encoding="utf-8")
                print(f"[crawl4ai] /health version patched to {version.strip()}")
        PY
        fi

        if [ -f /opt/modular/crawl4ai-ssrf-proxy.py ]; then
          python /opt/modular/crawl4ai-ssrf-proxy.py &
        fi

        if [ "$$CRAWL4AI_XVFB_ENABLED" = "true" ]; then
          if command -v Xvfb >/dev/null 2>&1; then
            echo "[crawl4ai] Starting Xvfb on :$$CRAWL4AI_XVFB_DISPLAY_NUM ($$CRAWL4AI_XVFB_SCREEN)"
            mkdir -p /tmp/.X11-unix
            rm -f "/tmp/.X$${CRAWL4AI_XVFB_DISPLAY_NUM}-lock" "/tmp/.X11-unix/X$${CRAWL4AI_XVFB_DISPLAY_NUM}" || true
            Xvfb ":$$CRAWL4AI_XVFB_DISPLAY_NUM" -screen 0 "$$CRAWL4AI_XVFB_SCREEN" -nolisten tcp -ac +extension RANDR &
            export DISPLAY=":$$CRAWL4AI_XVFB_DISPLAY_NUM"
            i=0
            while [ $$i -lt 50 ]; do
              if [ -e "/tmp/.X11-unix/X$${CRAWL4AI_XVFB_DISPLAY_NUM}" ]; then
                break
              fi
              i=$$((i + 1))
              sleep 0.1
            done
            if [ ! -e "/tmp/.X11-unix/X$${CRAWL4AI_XVFB_DISPLAY_NUM}" ]; then
              echo "[crawl4ai] Xvfb failed to start; continuing without DISPLAY"
              unset DISPLAY
            fi
          else
            echo "[crawl4ai] Xvfb is not installed; continuing without DISPLAY"
            unset DISPLAY
          fi
        fi
        exec supervisord -c supervisord.conf
    ports:
      - "8082:11235"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request\nurls=['http://localhost:11235/dashboard/','http://localhost:11235/playground/']\nfor url in urls:\n  try:\n    urllib.request.urlopen(url, timeout=2).read();\n    sys.exit(0)\n  except Exception:\n    pass\nsys.exit(1)\n\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  ais-relay:
    build:
      context: ../..
      dockerfile: infra/docker/ais-relay.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3004
      NODE_ENV: production
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "${AIS_RELAY_PORT:-3004}:3004"
    logging: *json-file-logging
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/health').then(async (response) => { if (!response.ok) { process.exit(1); return; } const payload = await response.json(); process.exit(payload?.status === 'ok' ? 0 : 1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 120s

  api:
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change_me_please_replace_32_chars}
        API_BASE_URL: ${API_BASE_URL:-http://api:4000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -ec "
      echo '[api] prisma migrate (deploy) + generate...';
      pnpm --filter db run migrate;
      echo '[api] ensuring mongo indexes...';
      pnpm --filter @modular/api run mongo:indexes;
      echo '[api] starting runtime server...';
      exec pnpm --filter @modular/api run start
      "
    env_file:
      - ./.env
    environment:
      PORT: 4000
      NODE_ENV: production
      CI: "true"
      HUSKY: "0"
      PRISMA_AUTO_RESOLVE_FAILED_MIGRATIONS: "false"
      AKSHARE_ENABLED: ${AKSHARE_ENABLED:-true}
      AKSHARE_HTTP_BASE_URL: ${AKSHARE_HTTP_BASE_URL:-http://akshare:8081}
      MODEL_SERVICE_ENABLED: ${MODEL_SERVICE_ENABLED:-true}
      MODEL_SERVICE_BASE_URL: ${MODEL_SERVICE_BASE_URL:-http://model-service:8090}
      MODEL_SERVICE_INTERNAL_TOKEN: ${MODEL_SERVICE_INTERNAL_TOKEN:-dev-model-token}
      COREPACK_NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      npm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      pnpm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "4000:4000"
    logging: *json-file-logging
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ais-relay:
        condition: service_healthy
      akshare:
        condition: service_healthy
      model-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/healthz/live"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

  vector:
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change_me_please_replace_32_chars}
        API_BASE_URL: ${API_BASE_URL:-http://api:4000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -ec "
      echo '[vector] starting runtime server...';
      exec pnpm --filter @modular/vector run start
      "
    env_file:
      - ./.env
    environment:
      PORT: 4010
      NODE_ENV: production
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      VECTOR_INTERNAL_TOKEN: ${VECTOR_INTERNAL_TOKEN:-dev-token}
      HUSKY: "0"
      COREPACK_NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      npm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      pnpm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "4010:4010"
    logging: *json-file-logging
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4010/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/runtime.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change_me_please_replace_32_chars}
        API_BASE_URL: ${API_BASE_URL:-http://api:4000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -ec "
      echo '[web] waiting for api...';
      i=0;
      while [ $$i -lt 150 ]; do
        if curl -fsS http://api:4000/api/healthz/live >/dev/null; then
          echo '[web] api ready';
          break;
        fi;
        i=$$((i + 1));
        sleep 2;
      done;
      if ! curl -fsS http://api:4000/api/healthz/live >/dev/null; then
        echo '[web] api not ready after 300s';
        exit 1;
      fi;
      echo '[web] starting runtime server...';
      exec pnpm --filter @modular/web exec next start --hostname 0.0.0.0 --port 3000
      "
    env_file:
      - ./.env
    environment:
      PORT: 3000
      NODE_ENV: production
      NODE_OPTIONS: "${WEB_NODE_OPTIONS:---max-old-space-size=8192}"
      CI: "true"
      HUSKY: "0"
      COREPACK_NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      npm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      pnpm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    dns:
      - ${DOCKER_DNS_1:-223.5.5.5}
      - ${DOCKER_DNS_2:-114.114.114.114}
    ports:
      - "3000:3000"
    logging: *json-file-logging
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: ${WEB_HEALTHCHECK_INTERVAL:-30s}
      timeout: 5s
      retries: 20
      start_period: 300s

volumes:
  mysql-data:
  mongo-data:
  redis-data:
  minio-data:
  qdrant-data:
  litellm-postgres-data:
