# NOTE:
# - This is a base config for LiteLLM Proxy.
# - In docker-compose, the `litellm` service generates an effective config at startup via
#   infra/litellm/generate-litellm-config.py:
#   - Preferred: fetch DB-managed proxy load balancing settings from API if
#     `LITELLM_CONFIG_API_BASE` + `LITELLM_CONFIG_INTERNAL_TOKEN` are set.
#   - When API has Nest global prefix, use `LITELLM_CONFIG_API_BASE=http://api:4000/api`.
#   - Fallback: env-based `OPENAI_API_KEYS` / `ANTHROPIC_API_KEYS` and router settings.
#   - When multiple keys are provided, entries that use `os.environ/OPENAI_API_KEY` /
#     `os.environ/ANTHROPIC_API_KEY` are expanded into multiple deployments/guardrails for load balancing.

model_list:
  - model_name: openai/gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: openai/text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  - model_name: anthropic/claude-3-haiku
    litellm_params:
      model: anthropic/claude-3-haiku
      api_key: os.environ/ANTHROPIC_API_KEY

# Guardrails & Content Safety
#
# How this works:
# - The application can request guardrails per-call by adding `guardrails: ["guardrail-name"]`
#   to the OpenAI-compatible request body.
# - Guardrails can run in `pre_call` (input) and/or `post_call` (output) modes.
#
# Recommended baseline to prevent upstream bans:
# - Enable `openai-moderation-pre` for all user-facing LLM calls (e.g. AI assistant prompts).
guardrails:
  - guardrail_name: openai-moderation-pre
    litellm_params:
      guardrail: openai_moderation
      mode: pre_call
      api_key: os.environ/OPENAI_API_KEY
      model: omni-moderation-latest

  # Optional: output moderation. Note that some guardrails may buffer streaming responses.
  - guardrail_name: openai-moderation-post
    litellm_params:
      guardrail: openai_moderation
      mode: post_call
      api_key: os.environ/OPENAI_API_KEY
      model: omni-moderation-latest

  # Optional (requires Azure Content Safety):
  # - guardrail_name: azure-prompt-shield
  #   litellm_params:
  #     guardrail: azure/prompt_shield
  #     mode: pre_call
  #     api_key: os.environ/AZURE_GUARDRAIL_API_KEY
  #     api_base: os.environ/AZURE_GUARDRAIL_API_BASE
  #
  # - guardrail_name: azure-text-moderation
  #   litellm_params:
  #     guardrail: azure/text_moderations
  #     mode: [pre_call, post_call]
  #     api_key: os.environ/AZURE_GUARDRAIL_API_KEY
  #     api_base: os.environ/AZURE_GUARDRAIL_API_BASE
  #     severity_threshold: 5
  #     categories: ["Hate", "Violence"]
  #     haltOnBlocklistHit: true
